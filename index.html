hst","gruppe":"Schock","reihenfolge":20,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Herzzeitvolumen und Blutdruck aus Schlagvolumen, Frequenz und Gefäßwiderstand herleiten","Kardiogenen, septischen und hypovolämischen Schock am Muster aus Herzindex, Füllungsdruck und Widerstand unterscheiden","Vorhersagen, wie Noradrenalin, Dobutamin, Milrinon, Volumen und Entlastung den Kreislauf verändern"],"quellen":[{"id":"scai","kurz":"SCAI 2022","titel":"Naidu SS et al.: SCAI SHOCK Stage Classification Expert Consensus Update. J Am Coll Cardiol 2022;79:933-946","stand":"2022"},{"id":"esc-hf","kurz":"ESC HF 2021","titel":"McDonagh TA et al.: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure. Eur Heart J 2021;42:3599-3726","stand":"2021"},{"id":"ssc","kurz":"SSC 2021","titel":"Evans L et al.: Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2021. Intensive Care Med 2021;47:1181-1247","stand":"2021"},{"id":"cardiocalc","kurz":"CardioCalc","titel":"Hämodynamik-Formeln (Fick-HZV, SVR, CPO, VIS, SCAI-Klassifikation) aus der CardioCalc-Engine; Abgleichtest beiliegend","stand":"2026"}],"moderation":"Lass die Gruppe vor jedem Eingriff vorhersagen, was mit Blutdruck und Herzindex passiert, und decke dann auf. Bei Falschvorhersagen nach dem Mechanismus fragen, nicht nach der richtigen Antwort.","erklaerung":"Die orange Kurve zeigt, wie viel Blut das Herz bei einem Füllungsdruck pro Minute fördert. Inotropika heben die Kurve an, Volumen verschiebt den Punkt entlang der Kurve nach rechts, Entlastung nach links. Eine hohe Nachlast drückt die Kurve bei schwachem Herzen deutlich nach unten.","regler":[{"id":"na","label":"Noradrenalin","einheit":"µg/kg/min","min":0,"max":0.5,"schritt":0.01,"hinweis":"Vasokonstriktion, in niedriger Dosis kaum Inotropie"},{"id":"epi","label":"Adrenalin","einheit":"µg/kg/min","min":0,"max":0.3,"schritt":0.01,"hinweis":"Inotropie und Vasokonstriktion, Frequenzanstieg"},{"id":"dobu","label":"Dobutamin","einheit":"µg/kg/min","min":0,"max":15,"schritt":0.5,"hinweis":"Inotropie, leichte Vasodilatation, Frequenzanstieg"},{"id":"mil","label":"Milrinon","einheit":"µg/kg/min","min":0,"max":0.75,"schritt":0.05,"hinweis":"Inotropie und Vasodilatation, wenig Frequenzeffekt"},{"id":"vol","label":"Volumenbolus","einheit":"ml","min":0,"max":2000,"schritt":250,"hinweis":"Erhöht den Füllungsdruck"},{"id":"entzug","label":"Volumenentzug (Diurese, Ultrafiltration)","einheit":"ml","min":0,"max":3000,"schritt":250,"hinweis":"Senkt den Füllungsdruck"},{"id":"nitro","label":"Nitroglycerin","einheit":"µg/min","min":0,"max":200,"schritt":10,"hinweis":"Venöse Vorlastsenkung, bei Hochdosis auch Nachlastsenkung"}],"basisregler":[{"id":"pcwp","label":"Füllungsdruck (PCWP)","einheit":"mmHg","min":2,"max":40,"schritt":1},{"id":"c","label":"Kontraktilität (1,0 = normal)","einheit":"","min":0.15,"max":2,"schritt":0.05},{"id":"svr","label":"Systemischer Gefäßwiderstand","einheit":"dyn·s·cm⁻⁵","min":250,"max":3500,"schritt":50},{"id":"hf","label":"Herzfrequenz","einheit":"/min","min":35,"max":160,"schritt":1}],"presets":[{"id":"normal","name":"Normalbefund","basis":{"pcwp":10,"c":1,"svr":1250,"hf":70},"beschreibung":"Gesunder Kreislauf als Vergleich. Das Herz fördert ausreichend, der Füllungsdruck liegt im Normbereich.","lernpunkt":"Blutdruck (MAP) ergibt sich aus Herzzeitvolumen mal Gefäßwiderstand plus ZVD. Das Herzzeitvolumen ergibt sich aus Schlagvolumen mal Frequenz.","moderation":"Starte hier und lass ein Rädchen nach dem anderen drehen: Was ändert sich zuerst, was bleibt gleich?","ziele":[]},{"id":"kardiogen","name":"Kardiogener Schock","basis":{"pcwp":26,"c":0.32,"svr":1500,"hf":100},"beschreibung":"Großer Vorderwandinfarkt, Pumpversagen. Niedriger Herzindex, hoher Füllungsdruck, hoher Gefäßwiderstand, kalte Haut, Lungenstauung.","lernpunkt":"Noradrenalin hebt den Druck, aber nicht den Fluss. Inotropie hebt den Fluss. Volumen verschlechtert die Lunge. Mechanische Kreislaufunterstützung wird hier nicht simuliert.","moderation":"Frage: Warum steigt der Druck unter Noradrenalin, obwohl das Herz nicht stärker pumpt? Was passiert mit der Nachlast?","ziele":[{"text":"MAP ≥ 65 mmHg","groesse":"map","op":">=","wert":65},{"text":"Herzindex ≥ 2,2 l/min/m²","groesse":"ci","op":">=","wert":2.2},{"text":"Füllungsdruck ≤ 18 mmHg","groesse":"pcwp","op":"\u003c=","wert":18}]},{"id":"septisch","name":"Septischer Schock","basis":{"pcwp":8,"c":1,"svr":520,"hf":115},"beschreibung":"Vasoplegie bei Sepsis. Hohes Herzzeitvolumen bei sehr niedrigem Gefäßwiderstand, warme Peripherie, niedriger Füllungsdruck.","lernpunkt":"Hier ist nicht die Pumpe das Problem, sondern Gefäßtonus und Volumenstatus. Zu viel Volumen treibt den Füllungsdruck und die Lunge in die Stauung.","moderation":"Vergleiche mit dem kardiogenen Schock: Beide haben niedrigen Blutdruck. Woran erkennst du den Unterschied am Herzindex, am Widerstand und am Füllungsdruck?","ziele":[{"text":"MAP ≥ 65 mmHg","groesse":"map","op":">=","wert":65},{"text":"Füllungsdruck ≤ 18 mmHg","groesse":"pcwp","op":"\u003c=","wert":18}]},{"id":"hypovol","name":"Hypovolämischer Schock","basis":{"pcwp":3,"c":1,"svr":1500,"hf":125,"komp":1},"beschreibung":"Blutung oder Volumenverlust. Der Füllungsdruck ist sehr niedrig, der Körper kompensiert mit hoher Frequenz und Vasokonstriktion.","lernpunkt":"Die Therapie ist Ursachenbeseitigung und Volumenersatz, bei Blutung Blut. Ein Vasopressor hebt den Druck, lässt aber den Volumenmangel bestehen. Mit Volumen sinkt die kompensatorische Tachykardie.","moderation":"Frage: Woran siehst du im Modell, dass der Körper noch kompensiert? Was passiert mit der Frequenz, wenn du Volumen gibst?","ziele":[{"text":"MAP ≥ 65 mmHg","groesse":"map","op":">=","wert":65},{"text":"Herzfrequenz ≤ 100 /min","groesse":"hf","op":"\u003c=","wert":100}]},{"id":"dekomp","name":"Akut dekompensierte Herzinsuffizienz","basis":{"pcwp":28,"c":0.5,"svr":1400,"hf":95},"beschreibu 'use strict';
KT.modell = (function () {
  const BSA = 1.9, HB = 12, GEWICHT = 80;

    // Sympathische Kompensation bei Volumenmangel (nur Presets mit komp > 0): lässt mit Volumengabe nach
    const komp = (x) => klemme((10 - x) / 7, 0, 1);

    const c = klemme(p.c + 0.3 * th.na + 0.02 * th.dobu + 0.25 * th.mil + 1.0 * th.epi, 0.15, 2.2);
    const svr = klemme(p.svr + 2500 * th.na - 20 * th.dobu - 600 * th.mil + 2500 * th.epi - 2.5 * th.nitro - 800 * dKomp, 250, 4000);
    const hf = klemme(p.hf + 20 * th.na + 1.0 * th.dobu + 50 * th.epi - 60 * dKomp, 35, 180);

    let svi = 55 * c * (1 - Math.exp(-pcwp / 8));

    const map = co * svr / 80 + rap;
    const pp = klemme(sv / 1.8, 12, 80);
    const sys = map + (2 / 3) * pp, dia = map - pp / 3;

    for (let p = 0; p <= 36; p += 6) s += `<line y1="${T}" y2="${H - B}" x1="${X(p)}" x2="${X(p)}" stroke="currentColor" opacity="0.12"/><text x="${X(p)}" y="${H - B + 16}" text-anchor="middle">${p}</text>`;

            luecken ? ' ' + luecken + ' wichtige Information(en) hast du weggelassen.' : '', ablenkerFalsch ? ' ' + ablenkerFalsch + ' unwichtige Information(en) hast du in die Übergabe aufgenommen.' : ''),

          h('h3', { style: { margin: '16px 0 4px' } }, 'Debriefing'), h('ul', { class: 'klar' }, sz.debriefing.map((d) => h('li', null, rich(d)))),

      host.appendChild(h('div', { class: 'small muted', style: { margin: '8px 0' } }, 'Ordne jede Information einem Buchstaben zu: ', Object.entries(NAMEN).map(([b, n]) => b + ' ' + n).join(' · ')));

/* Kardio Teaching, EKG-Quiz mit synthetischen Streifen */
'use strict';
(function () {
  const { h, rich } = KT;
  const U = KT.ui;

  KT.registriereTyp('bildquiz', (container, mod) => {
    container.appendChild(U.modulKopf(mod));
    const host = h('div'); container.appendChild(host);
    container.appendChild(U.quellenListe(mod));

    function start() {
      const fragen = mod.fragen; let i = 0; let treffer = 0;
      function frage() {
        KT.leeren(host);
        if (i >= fragen.length) { ende(); return; }
        const q = fragen[i]; let beantwortet = false; let tipp = null;
        const s = KT.ekg.streifen(q.bild.rhythmus, { hf: q.bild.hf, dauer_s: q.bild.dauer_s || 6, st: q.bild.st || 0, seed: 17 + i * 13 });
        const wrap = KT.ekg.streifenElement(s, { von_s: 0, bis_s: s.dauer, alt: 'EKG-Streifen, Ableitung II, synthetisch erzeugt', onTipp: q.fragetyp === 'tippen' ? (t) => {
          if (beantwortet) return; tipp = t; wrap.loescheMarker(); wrap.markiere(t - 0.03, t + 0.03, 'rgba(3,123,195,0.9)'); pruefBtn.disabled = false;
        } : null });
        const box = h('div', { 'aria-live': 'polite' }); const weiter = h('div', { style: { marginTop: '16px' } });
        function abschluss(ok) {
          beantwortet = true; if (ok) treffer++;
          box.appendChild(U.alertBox(ok ? 'richtig' : 'falsch', h('strong', null, ok ? 'Richtig. ' : 'Nicht ganz. '), rich(q.erklaerung)));
          box.appendChild(h('div', { class: 'card' }, h('h4', null, 'Merkmale'), h('ul', { class: 'klar' }, q.merkmale.map((m) => h('li', null, rich(m))))));
          weiter.appendChild(U.btn(i + 1 < fragen.length ? 'Nächste Frage' : 'Ergebnis', { icon: 'arrow-right', iconLinks: false, gross: true, onClick: () => { i++; frage(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }));
        }
        const opts = h('div', { class: 'opts' });
        let pruefBtn = null;
        if (q.fragetyp === 'wahl') {
          KT.mischen(q.optionen).forEach((o) => {
            const b = h('button', { type: 'button', class: 'opt', onclick: () => {
              if (beantwortet) return; opts.querySelectorAll('.opt').forEach((x) => { x.disabled = true; x.classList.add('gedimmt'); });
              b.classList.remove('gedimmt'); b.classList.add(o.richtig ? 'richtig' : 'falsch'); abschluss(!!o.richtig);
              opts.querySelectorAll('.opt').forEach((x) => { if (x.dataset.richtig === '1') { x.classList.remove('gedimmt'); x.classList.add('richtig', 'empfohlen'); } });
            }, 'data-richtig': o.richtig ? '1' : '0' }, h('span', { class: 't' }, o.text));
            opts.appendChild(b);
          });
        } else {
          pruefBtn = U.btn('Antwort prüfen', { icon: 'check', disabled: true, onClick: () => {
            pruefBtn.disabled = true;
            const D = s.dauer, ziele = [];
            if (q.tippen.ziel) {   // Zielzeitpunkte aus den Schlägen des erzeugten Streifens
              const off = q.tippen.ziel === 'p' ? -0.16 : 0, tol = q.tippen.ziel === 'p' ? 0.07 : 0.1;
              s.schlaege.forEach((b) => ziele.push({ von: b.t + off - tol, bis: b.t + off + tol }));
            } else ziele.push({ von: q.tippen.von_s - 0.15, bis: q.tippen.bis_s + 0.15 });
            const ok = tipp !== null && ziele.some((z) => { const m = (z.von + z.bis) / 2, r = (z.bis - z.von) / 2; let d = (((tipp - m) % D) + D) % D; d = Math.min(d, D - d); return d <= r; });
            ziele.forEach((z) => { if (z.von >= 0 && z.bis <= D) wrap.markiere(z.von, z.bis, 'rgba(34,197,94,0.25)'); });
            abschluss(ok);
          } });
        }
        host.appendChild(h('div', { class: 'row', style: { justifyContent: 'space-between', marginBottom: '8px' } }, h('span', { class: 'eyebrow' }, 'Frage ' + (i + 1) + ' von ' + fragen.length), h('span', { class: 'small muted' }, treffer + ' richtig')));
        host.appendChild(U.fortschritt(i / fragen.length));
        host.appendChild(h('h2', { style: { margin: '8px 0 12px' } }, q.frage));
        host.appendChild(wrap);
        host.appendChild(opts);
        if (pruefBtn) host.appendChild(h('div', { class: 'row', style: { marginTop: '12px' } }, h('span', { class: 'small muted' }, 'Tippe auf den Streifen, dann prüfen.'), pruefBtn));
        host.appendChild(box); host.appendChild(weiter);
      }
      function ende() {
        host.appendChild(h('div', { class: 'card akzent' }, h('div', { class: 'eyebrow' }, 'Ergebnis'), h('div', { class: 'score', style: { margin: '8px 0' } }, Math.round(treffer / fragen.length * 100) + ' %'),
          h('p', null, treffer + ' von ' + fragen.length + ' Fragen richtig.'), U.moderation(mod.moderation),
          h('div', { class: 'row' }, U.btn('Nochmal', { icon: 'rotate-ccw', onClick: start }))));
      }
      frage();
    }
    host.appendChild(h('div', { class: 'card akzent' }, h('h3', null, mod.titel), h('p', null, mod.untertitel || 'Erkenne den Rhythmus am Streifen.'),
      h('p', { class: 'small muted' }, 'Die Streifen werden von der App synthetisch erzeugt (Ableitung II, 25 mm/s, 10 mm/mV) und sind keine echten Patient:innen-EKGs.'),
      U.btn('Quiz starten', { icon: 'play', gross: true, onClick: start })));
  });
})();

/* Kardio Teaching, Gerüst: Navigation, Modi, Hausebene, Startseite */
'use strict';
(function () {
  const { h, rich, ic } = KT;
  const U = KT.ui;
  const root = document.documentElement;

  const lies = (id) => { try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return null; } };
  const DATEN = lies('kt-daten') || { oeffentlich: [], haus: null, hausKrypto: null };
  const BILDER = lies('kt-bilder') || {};

  /* ---------- Hausebene ---------- */
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const b64url = (s) => b64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
  KT.haus = {
    gesperrt: () => !!DATEN.hausKrypto && KT.zustand.haus !== 'offen',
    async freischalten(schluessel) {
      if (!window.crypto || !window.crypto.subtle) throw new Error('Dieser Browser erlaubt die Entschlüsselung hier nicht (kein sicherer Kontext).');
      const key = await crypto.subtle.importKey('raw', b64url(schluessel.trim()), 'AES-GCM', false, ['decrypt']);
      const klar = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATEN.hausKrypto.iv) }, key, b64(DATEN.hausKrypto.ct));
      const module = JSON.parse(new TextDecoder().decode(klar));
      KT.registriere(module, 'haus'); KT.zustand.haus = 'offen';
    },
  };

  /* ---------- Zustand ---------- */
  function setzeTheme(t) {
    KT.zustand.theme = t; root.setAttribute('data-theme', t === 'dunkel' ? 'dark' : 'light'); KT.speicher.schreiben('theme', t);
    if (themeBtn) { KT.leeren(themeBtn); themeBtn.appendChild(ic(t === 'dunkel' ? 'sun' : 'moon')); themeBtn.setAttribute('aria-label', t === 'dunkel' ? 'Helles Thema' : 'Dunkles Thema'); }
  }
  function setzeModus(m) {
    KT.zustand.modus = m; root.classList.toggle('modus-praesi', m === 'praesi'); KT.speicher.schreiben('modus', m);
    if (modusEl) modusEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.modus === m ? 'true' : 'false'));
    if (m === 'praesi') root.classList.remove('nav-offen');
  }

  /* ---------- Routing (ohne Hash, der Hash trägt den Schlüssel) ---------- */
  KT.gehe = function (ansicht, id, push = true) {
    KT.zustand.ansicht = ansicht; KT.zustand.id = id || null;
    if (push) { try { history.pushState({ ansicht, id: id || null }, '', location.href); } catch (e) { /* ignorieren */ } }
    root.classList.remove('nav-offen');
    zeige(true);
  };
  window.addEventListener('popstate', (e) => {
    const s = e.state || { ansicht: 'start', id: null };
    KT.zustand.ansicht = s.ansicht; KT.zustand.id = s.id; zeige(true);
  });

  /* ---------- Aufbau ---------- */
  let themeBtn, modusEl, navEl, mainEl, wrapEl;
  function bauGeruest() {
    const body = document.body; KT.leeren(body);
    themeBtn = h('button', { class: 'btn ghost', type: 'button', onclick: () => setzeTheme(KT.zustand.theme === 'dunkel' ? 'hell' : 'dunkel') });
    modusEl = h('div', { class: 'seg', role: 'group', 'aria-label': 'Ansicht' },
      h('button', { type: 'button', 'data-modus': 'selbst', 'aria-pressed': 'true', onclick: () => setzeModus('selbst') }, ic('book-open'), h('span', null, 'Selbstlernen')),
      h('button', { type: 'button', 'data-modus': 'praesi', 'aria-pressed': 'false', onclick: () => setzeModus('praesi') }, ic('presentation'), h('span', null, 'Präsentation')));
    navEl = h('nav', { class: 'sidebar', 'aria-label': 'Module' });
    wrapEl = h('div', { class: 'wrap' });
    mainEl = h('main', { class: 'main', id: 'inhalt' }, wrapEl);
    const kopf = h('header', { class: 'topbar' },
      h('button', { class: 'btn ghost menu-btn', type: 'button', 'aria-label': 'Menü', onclick: () => root.classList.toggle('nav-offen') }, ic('menu')),
      h('button', { class: 'brand', type: 'button', onclick: () => KT.gehe('start'), 'aria-label': 'Startseite' }, BILDER.logo96 ? h('img', { src: BILDER.logo96, alt: '' }) : null, h('b', null, 'Kardio ', h('span', null, 'Teaching'))),
      h('div', { class: 'spacer' }), h('button', { class: 'btn ghost nur-praesi', type: 'button', 'aria-label': 'Vollbild', title: 'Vollbild', onclick: () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { /* ignorieren */ } } }, ic('maximize')), modusEl, themeBtn);
    const fuss = h('footer', { class: 'footbar' }, h('details', { class: 'hinweis', role: 'note' },
      h('summary', null, h('b', null, 'Hinweis: '), 'Lehrmaterial, kein Medizinprodukt, alle Fälle fiktiv, Inhalte sind Entwürfe. ', h('span', { class: 'mehr' }, 'Mehr')),
      h('div', { style: { marginTop: '6px' } }, 'Kein validiertes Medizinprodukt. Nicht zur Entscheidung über die Behandlung echter Patient:innen verwenden. Alle Fälle sind fiktiv, die Inhalte sind Entwürfe und nicht fachlich freigegeben. Dosierungen und Vorgehen immer gegen Fachinformation, Leitlinie und Hausstandard prüfen.')));
    body.appendChild(h('div', { class: 'app' }, kopf, navEl, mainEl, fuss));
  }

  function navBau() {
    KT.leeren(navEl);
    navEl.appendChild(h('div', { class: 'nav-group' }, navItem('Start', 'start', null, 'home')));
    KT.GRUPPEN.forEach((g) => {
      const ms = KT.module.filter((m) => m.gruppe === g);
      if (!ms.length) return;
      navEl.appendChild(h('div', { class: 'nav-group' }, h('span', { class: 'eyebrow' }, g), ms.map((m) => navItem(m.titel, 'modul', m.id, null, m))));
    });
    if (KT.haus.gesperrt()) {
      const inp = h('input', { type: 'password', placeholder: 'Schlüssel einfügen', 'aria-label': 'Schlüssel für Hausmodule', autocomplete: 'off' });
      const fehler = h('div', { class: 'xs', style: { color: 'var(--danger)' } });
      navEl.appendChild(h('div', { class: 'nav-group' }, h('span', { class: 'eyebrow' }, 'Hausmodule'),
        h('div', { class: 'lock-card' }, h('div', { class: 'row' }, ic('lock'), h('strong', null, 'Gesperrt')), 'Hausinterne Module (z. B. HTX-Listung, TAVI) öffnen sich über den QR-Code oder Link der Lehrenden. Alternativ den Schlüssel hier einfügen.', inp,
          U.btn('Freischalten', { variante: 'sek', icon: 'unlock', onClick: () => entsperre(inp.value, fehler) }), fehler)));
    }
    navEl.appendChild(h('div', { class: 'nav-group' }, h('span', { class: 'eyebrow' }, 'Mehr'), navItem('Über diese App', 'info', null, 'info')));
  }
  function navItem(text, ansicht, id, icon, m) {
    const aktiv = KT.zustand.ansicht === ansicht && (KT.zustand.id || null) === (id || null);
    return h('button', { type: 'button', class: 'nav-item', 'aria-current': aktiv ? 'page' : null, onclick: () => KT.gehe(ansicht, id) },
      icon ? ic(icon) : h('span', { class: 'dot', title: 'Entwurf, nicht fachlich geprüft' }), h('span', null, text));
  }
  async function entsperre(schluessel, fehlerEl) {
    fehlerEl.textContent = '';
    try { await KT.haus.freischalten(schluessel); navBau(); zeige(true); } catch (e) { fehlerEl.textContent = 'Schlüssel passt nicht oder wird nicht unterstützt.'; }
  }

  /* ---------- Ansichten ---------- */
  function startseite() {
    const w = h('div');
    w.appendChild(h('section', { class: 'hero' },
      h('div', null, h('div', { class: 'eyebrow' }, 'Kardiologie · IMC und ICU · PJ-Teaching'), h('h1', { style: { margin: '8px 0 12px' } }, 'Kardio ', h('b', null, 'Teaching')),
        h('p', { style: { fontSize: 'var(--text-lg)', color: 'var(--text-muted)' } }, 'Fälle, Sandkästen und Übungen zum Mitmachen. Du entscheidest, der Monitor reagiert, am Ende gibt es ein Debriefing.'),
        h('div', { class: 'row', style: { marginTop: '16px' } },
          KT.nachId['fall-kardiogener-schock'] ? U.btn('Mit dem Schock-Fall starten', { icon: 'play', gross: true, onClick: () => KT.gehe('modul', 'fall-kardiogener-schock') }) : null,
          U.btn('Präsentationsansicht', { variante: 'sek', icon: 'presentation', gross: true, onClick: () => setzeModus('praesi') }))),
      BILDER.logo512 ? h('img', { src: BILDER.logo512, alt: 'MedApe-Maskottchen mit Stethoskop zeigt auf ein Herzmodell' }) : null));
    w.appendChild(h('div', { class: 'grid' },
      h('div', { class: 'card akzent' }, h('h3', null, 'Selbstlernen'), h('p', { class: 'small' }, 'Für dich allein, auch am Handy. Nach jeder Entscheidung bekommst du Rückmeldung mit Begründung und Quelle.')),
      h('div', { class: 'card akzent' }, h('h3', null, 'Präsentation'), h('p', { class: 'small' }, 'Für das Teaching am Beamer. Große Schrift, Impulsfragen für die Lehrenden, Lösungen auf Knopfdruck, Vorhersage-Modus im Sandkasten.')),
      h('div', { class: 'card akzent' }, h('h3', null, 'Alles lokal'), h('p', { class: 'small' }, 'Es werden keine Daten gespeichert oder übertragen. Alle Fälle sind fiktiv.'))));
    KT.GRUPPEN.forEach((g) => {
      const ms = KT.module.filter((m) => m.gruppe === g);
      if (!ms.length) return;
      w.appendChild(h('h2', { class: 'gruppe-titel' }, g, h('span', { class: 'muted small', style: { fontWeight: 400, marginLeft: '10px' } }, KT.GRUPPEN_INFO[g] || '')));
      w.appendChild(h('div', { class: 'grid' }, ms.map((m) => h('button', { type: 'button', class: 'modul-karte', onclick: () => KT.gehe('modul', m.id) },
        h('div', { class: 'row' }, h('span', { class: 'badge entwurf' }, 'Entwurf'), m._ebene === 'haus' ? h('span', { class: 'badge haus' }, ic('lock'), 'Haus') : null, m.dauer ? h('span', { class: 'chip' }, m.dauer) : null),
        h('h3', null, m.titel), m.untertitel ? h('div', { class: 'small muted' }, m.untertitel) : null))));
    });
    if (KT.haus.gesperrt()) w.appendChild(h('div', { class: 'alert info', style: { marginTop: '24px' } }, ic('lock'), ' Weitere Hausmodule sind gesperrt. Sie öffnen sich über den QR-Code der Lehrenden.'));
    return w;
  }

  function infoSeite() {
    return h('div', { class: 'stack' }, h('h1', null, 'Über diese App'),
      h('div', { class: 'card' }, h('h3', null, 'Zweck und Grenzen'), h('p', null, 'Kardio Teaching ist ein Lehrwerkzeug für PJ-Studierende in der Kardiologie auf IMC und ICU. Es ersetzt keine Leitlinie, keine Fachinformation und keinen Hausstandard. Alle Fälle und Patient:innen sind erfunden. Alle Module sind Entwürfe und nicht fachlich freigegeben, bis dies im Modul ausdrücklich steht.')),
      h('div', { class: 'card' }, h('h3', null, 'Datenschutz'), h('p', null, 'Die App speichert nichts über dich. Im Browser werden nur Darstellung (hell oder dunkel) und Ansicht (Selbstlernen oder Präsentation) gemerkt. Es gibt keine Konten, keine Server-Aufrufe und keine Auswertung deiner Antworten.')),
      h('div', { class: 'card' }, h('h3', null, 'Bilder, Kurven und Lizenzen'),
        h('ul', { class: 'klar' },
          h('li', null, 'EKG-Streifen, Blutdruckkurven und Schemazeichnungen werden von der App selbst erzeugt oder wurden eigens gezeichnet. Sie sind keine Patient:innen-Aufnahmen.'),
          h('li', null, 'Symbole: Lucide (ISC-Lizenz).'),
          h('li', null, 'Gestaltung: MedApe Design System, Universitätsklinikum Heidelberg. Das Maskottchen wird unverändert aus den Originaldateien verwendet.'),
          h('li', null, 'Hämodynamik- und Perfusorformeln: portiert aus CardioCalc und gegen das Original getestet.'))));
  }

  function zeige(nachOben) {
    navBau();
    KT.leeren(wrapEl);
    const z = KT.zustand;
    let titel = 'Kardio Teaching';
    try {
      if (z.ansicht === 'modul' && KT.nachId[z.id]) {
        const m = KT.nachId[z.id]; titel = m.titel + ' · Kardio Teaching';
        const fn = KT.typen[m.typ];
        if (fn) fn(wrapEl, m); else wrapEl.appendChild(U.alertBox('warn', 'Für den Typ „' + m.typ + '“ gibt es noch keine Ansicht.'));
      } else if (z.ansicht === 'info') { wrapEl.appendChild(infoSeite()); }
      else { z.ansicht = 'start'; wrapEl.appendChild(startseite()); }
    } catch (e) {
      console.error(e); KT.leeren(wrapEl); wrapEl.appendChild(U.alertBox('falsch', 'Beim Aufbau dieser Seite ist ein Fehler aufgetreten: ' + e.message));
    }
    document.title = titel;
    if (nachOben) window.scrollTo(0, 0);
  }

  /* ---------- Start ---------- */
  function start() {
    KT.registriere(DATEN.oeffentlich || [], 'oeffentlich');
    if (DATEN.haus) KT.registriere(DATEN.haus, 'haus');
    bauGeruest();
    setzeTheme(KT.speicher.lesen('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dunkel' : 'hell'));
    const modus = KT.speicher.lesen('modus'); if (modus === 'praesi') setzeModus('praesi');
    try { history.replaceState({ ansicht: 'start', id: null }, '', location.href); } catch (e) { /* ignorieren */ }
    const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash || '');
    const fertig = () => zeige(false);
    if (m && DATEN.hausKrypto) KT.haus.freischalten(m[1]).then(fertig, fertig); else fertig();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
