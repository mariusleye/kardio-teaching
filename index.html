tik und Behandlung sollen parallel und ohne Verzögerung beginnen (ESC).","q":["esc-hf"]}],"weiter":"k5"},{"id":"k5","typ":"wahl","zeit":"Minute 8","effekt":{"vitals":{"spo2":88,"af":30,"hf":126}},"frage":"Unter 10 l/min Sauerstoff über Maske mit Reservoir liegt die SpO₂ bei 88 %, die Atemfrequenz bei 30/min. Frau K. ist wach und kooperativ, aber zunehmend erschöpft. Wie geht es weiter?","optionen":[{"id":"a","text":"CPAP bzw. NIV über Gesichtsmaske beginnen, FiO₂ nach Sättigung anpassen, Blutdruck engmaschig messen","bewertung":"richtig","feedback":"Respiratorische Insuffizienz mit Atemfrequenz über 25/min und SpO₂ unter 90 %: NIV so früh wie möglich (ESC IIa B). Der positive Atemwegsdruck bessert Oxygenierung und pH, senkt pCO₂ und Atemarbeit und vermindert den venösen Rückstrom. In 3CPO besserten sich Luftnot, Herzfrequenz, Azidose und Hyperkapnie nach 1 Stunde schneller als unter Sauerstoff, die 7-Tage-Sterblichkeit war gleich. Die Cochrane-Analyse zeigt weniger Intubationen und, bei geringer Evidenzsicherheit, eine niedrigere Krankenhaussterblichkeit. Weil die NIV den Blutdruck senken kann, wird er engmaschig gemessen.","q":["esc-hf","3cpo","cochrane-niv"],"effekt":{"vitals":{"spo2":93,"af":24,"hf":118}}},{"id":"b","text":"Morphin i.v. gegen Luftnot und Angst, Sauerstoff über Maske weiter","bewertung":"falsch","feedback":"Opiate lindern Luftnot und Angst, werden bei akuter Herzinsuffizienz aber nicht routinemäßig empfohlen (ESC III C). Retrospektiv gingen sie mit mehr Beatmung, mehr Intensivaufnahmen und höherer Sterblichkeit einher. Bei schon erhöhtem pCO₂ droht eine Atemdepression. Ausnahmen sind schwere Schmerzen oder Angst und die Palliation; als Sedierung zur besseren NIV-Toleranz nennt die ESC sie als Möglichkeit. Die Oberärztin beginnt CPAP.","q":["esc-hf"],"effekt":{"vitals":{"spo2":85,"af":24,"hf":122}}},{"id":"c","text":"Sofort intubieren und beatmen","bewertung":"falsch","feedback":"Frau K. ist wach und kooperativ, eine NIV ist möglich. Die Intubation ist empfohlen, wenn die respiratorische Insuffizienz trotz Sauerstoff oder NIV fortschreitet (ESC I C). Sie bleibt die nächste Stufe und sollte vorbereitet sein. Die Oberärztin beginnt CPAP.","q":["esc-hf"]},{"id":"d","text":"High-Flow-Sauerstoff über Nasenkanüle","bewertung":"akzeptabel","feedback":"Die ESC nennt High-Flow neben CPAP und NIV als Option beim Lungenödem. Die Belege für weniger Intubationen liegen aber vor allem für CPAP und NIV vor. High-Flow ist eine Alternative, etwa wenn die Maske nicht toleriert wird. Die Oberärztin entscheidet sich hier für CPAP.","q":["esc-hf","cochrane-niv"],"effekt":{"vitals":{"spo2":90,"af":27,"hf":124}}},{"id":"e","text":"Bei der Maske bleiben, das Diuretikum geben und seine Wirkung abwarten","bewertung":"falsch","feedback":"Frau K. erschöpft sich, das pCO₂ steigt bereits. Abwarten erhöht das Intubationsrisiko. NIV sofort, das Diuretikum parallel. Die Oberärztin beginnt CPAP.","effekt":{"vitals":{"spo2":86,"af":32,"hf":128}}}],"weiter":"k6"},{"id":"k6","typ":"zahl","zeit":"Minute 12","effekt":{"vitals":{"spo2":93,"af":24,"hf":118,"sys":180,"dia":98}},"frage":"CPAP läuft, die SpO₂ steigt auf 93 %. Frau K. nimmt zu Hause Furosemid 40 mg p. o. einmal täglich. Welche Furosemid-Dosis gibst du jetzt als i.v.-Bolus?","einheit":"mg","min":0,"max":200,"schritt":10,"start":0,"zielbereich":[40,80],"feedback_ok":"Passt. Unter oraler Vortherapie beginnt man mit dem 1- bis 2-Fachen der oralen Tagesdosis als i.v.-Dosis, hier 40 bis 80 mg (ESC 2021, Abbildung 13). Vor der Gabe die Blase entleeren lassen und den Urin ab jetzt sammeln: Nach 2 Stunden wird das Ansprechen mit Spot-Natrium und Urinmenge geprüft (HFA 2019). Weitere Gaben 2- bis 3-mal täglich oder als Dauerinfusion, keine einzelne Tagesgabe.","feedback_zu_niedrig":"Zu wenig. 20 bis 40 mg i.v. ist die Startdosis für Patient:innen ohne Diuretika-Vortherapie. Unter Dauertherapie braucht es mindestens die orale Tagesdosis als i.v.-Dosis, bis zum Doppelten. Eine eingeschränkte Nierenfunktion erhöht den Bedarf eher noch (ESC 2021, HFA 2019).","feedback_zu_hoch":"Mehr als für den Start nötig. Die ESC empfiehlt das 1- bis 2-Fache der oralen Tagesdosis und eine frühe Verdopplung, wenn das Ansprechen nicht reicht. Höhere Dosen (in der DOSE-Studie das 2,5-Fache) entstauen etwas stärker, können aber mehr Elektrolytstörungen und vorübergehende Kreatininanstiege bringen. Als Tageshöchstdosis i.v. gelten meist 400 bis 600 mg Furosemid.","moderation":"Erst schätzen lassen, dann fragen: Woran orientiert ihr euch? Anker ist die orale Tagesdosis vor Aufnahme, nicht das Körpergewicht.","weiter":"k7"},{"id":"k7","typ":"wahl","zeit":"Minute 15","frage":"Der Blutdruck liegt unter CPAP weiter bei 180/98 mmHg. Wie gehst du mit dem Blutdruck um?","optionen":[{"id":"a","text":"Glyceroltrinitrat i.v., niedrig beginnen und nach Blutdruck und Klinik titrieren, Messung alle 5 Minuten","bewertung":"richtig","feedback":"Bei einem systolischen Druck über 110 mmHg können i.v.-Vasodilatatoren zur Symptomlinderung und Entstauung erwogen werden (ESC IIb B). Nitrate wirken vor allem venös und senken Vor- und Nachlast. Wenn das Lungenödem vor allem durch Nachlastanstieg und Umverteilung in die Lunge entsteht, können sie wirksamer sein als ein Diuretikum allein. Frau K. ist zusätzlich überwässert (3 kg, Ödeme), deshalb beides. Eine Prognoseverbesserung ist nicht belegt. Vorsicht bei Hypotonie, schwerer Aortenstenose und ausgeprägter LV-Hypertrophie.","q":["esc-hf"],"effekt":{"vitals":{"sys":148,"dia":82,"hf":112,"spo2":95,"af":21}}},{"id":"b","text":"Kein Vasodilatator, Furosemid und CPAP reichen","bewertung":"akzeptabel","feedback":"Vertretbar: Vasodilatatoren sind nur als IIb empfohlen, und zwei randomisierte Studien zeigten keinen Vorteil einer intensiven Vasodilatation gegenüber hochdosierten Diuretika. Bei hohem Blutdruck und nachlastgetriebenem Lungenödem passt ein Nitrat aber gut zum Mechanismus und lindert die Beschwerden. Die Oberärztin setzt deshalb Glyceroltrinitrat an.","q":["esc-hf"],"effekt":{"vitals":{"sys":170,"dia":94,"hf":116,"spo2":93,"af":23}}},{"id":"c","text":"Urapidil i.v. zur Blutdrucksenkung","bewertung":"akzeptabel","feedback":"Senkt den Blutdruck über die Nachlast. Die ESC-Leitlinie zur Herzinsuffizienz nennt beim Lungenödem aber Nitrate und Nitroprussid als Vasodilatatoren. Nitrate entlasten zusätzlich über die venöse Vorlastsenkung. Hausstandards können Urapidil vorsehen. Die Oberärztin ergänzt Glyceroltrinitrat.","q":["esc-hf"],"effekt":{"vitals":{"sys":156,"dia":86,"hf":114,"spo2":94,"af":22}}},{"id":"d","text":"Blutdruck mit hochdosiertem Nitrat so rasch wie möglich unter 110 mmHg senken","bewertung":"falsch","feedback":"Zu aggressiv. Vasodilatatoren werden niedrig begonnen und nach Klinik und Blutdruck hochtitriert (ESC). Ein zu starker Abfall von Vor- und Nachlast führt zur Hypotonie und gefährdet Nieren- und Koronarperfusion.","q":["esc-hf"],"effekt":{"vitals":{"sys":102,"dia":58,"hf":120,"spo2":94,"af":22}}}],"erklaerung":"Nitrat nur bei ausreichendem Blutdruck: Die ESC nennt einen systolischen Druck über 110 mmHg. Liegt er darunter oder bestehen Zeichen der Minderperfusion, ist ein Vasodilatator keine Initialtherapie.","weiter":"k8"},{"id":"k8","typ":"wahl","zeit":"Minute 50","effekt":{"vitals":{"sys":90,"dia":54,"hf":108,"spo2":95,"af":21}},"frage":"Die letzten 30 Minuten waren gut: Frau K. spricht in ganzen Sätzen, die Atemfrequenz ist gesunken, bisher 90 ml Urin. Glyceroltrinitrat läuft und wurde schrittweise erhöht. Jetzt meldet die Pflege: RR 90/54 mmHg, Frau K. ist schwindelig, aber wach, die Hände sind warm. Die Pflege fragt, ob sie 500 ml Vollelektrolytlösung als Bolus anhängen soll. Wie entscheidest du?","optionen":[{"id":"a","text":"Nitrat pausieren, kein Volumen. Perfusion, Urin und CPAP-Druck prüfen, Blutdruck in 5 bis 10 Minuten kontrollieren","bewertung":"richtig","feedback":"Die Hypotonie ist am ehesten Folge der Vorlastsenkung durch Nitrat und positiven Atemwegsdruck; die ESC weist für beide ausdrücklich auf dieses Risiko hin. Frau K. bleibt warm und wach, die Lunge ist noch nass. Nach Pausieren des Nitrats erholt sich der Druck meist binnen Minuten. Volumen ist nicht nötig.","q":["esc-hf"],"effekt":{"vitals":{"sys":114,"dia":66,"hf":102,"spo2":95,"af":20}},"weiter":"k12"},{"id":"b","text":"500 ml Vollelektrolytlösung als Bolus, Nitrat unverändert weiter","bewertung":"falsch","feedback":"Die Lunge ist noch gestaut, die V. cava weit. Der Bolus füllt genau den Kreislauf, der gerade entlastet wird, und die Ursache der Hypotonie bleibt bestehen.","effekt":{"vitals":{"sys":104,"dia":60,"hf":124,"spo2":89,"af":28}},"weiter":"k9"},{"id":"c","text":"Noradrenalin über Perfusor beginnen, Nitrat unverändert weiter","bewertung":"falsch","feedback":"Ein Vasopressor gegen einen Vasodilatator ist widersinnig. Noradrenalin ist für den kardiogenen Schock mit Minderperfusion vorgesehen (ESC IIb B), die hier nicht vorliegt. Die Oberärztin pausiert das Nitrat, Noradrenalin wird nicht gebraucht.","q":["esc-hf"],"effekt":{"vitals":{"sys":108,"dia":62,"hf":110}},"weiter":"k12"}],"moderation":"Verzweigungspunkt: erst abstimmen lassen. Danach fragen: Was hat sich an Stauung und Perfusion seit Minute 4 geändert? Antwort: an der Stauung wenig, an der Perfusion nichts. Geändert hat sich nur die Vorlast."},{"id":"k9","typ":"text","zeit":"Minute 80","titel":"Verschlechterung","effekt":{"vitals":{"spo2":82,"af":36,"hf":136,"sys":148,"dia":86}},"text":"Eine halbe Stunde nach dem Bolus verschlechtert sich Frau K. rasch: SpO₂ 82 % unter CPAP mit FiO₂ 0,8, Atemfrequenz 36/min, rötlich-schaumiges Sputum. Sie wird zunehmend somnolent. BGA: pH 7,19; pCO₂ 66 mmHg; pO₂ 49 mmHg.","weiter":"k10"},{"id":"k10","typ":"wahl","zeit":"Minute 82","frage":"Was ist jetzt vorrangig?","optionen":[{"id":"a","text":"Infusion stoppen, Intensivteam und Oberärztin sofort dazu, Intubation vorbereiten, Furosemid erneut i.v.","bewertung":"richtig","feedback":"Fortschreitende respiratorische Insuffizienz trotz NIV mit Vigilanzminderung und Azidose: Die Intubation ist empfohlen (ESC I C). Parallel weiter entstauen.","q":["esc-hf"],"effekt":{"vitals":{"spo2":92,"af":16,"hf":118,"sys":122,"dia":70}}},{"id":"b","text":"Morphin i.v. zur Beruhigung, CPAP unverändert","bewertung":"falsch","feedback":"Bei Somnolenz und Hyperkapnie verstärkt ein Opiat die Atemdepression. Frau K. braucht jetzt einen gesicherten Atemweg und eine kontrollierte Beatmung.","q":["esc-hf"]},{"id":"c","text":"Auf High-Flow-Sauerstoff wechseln und abwarten","bewertung":"falsch","feedback":"Die Atemunterstützung zu reduzieren, wenn die NIV versagt, verschlimmert die Lage. Jetzt ist die Intubation fällig.","q":["esc-hf"]}],"weiter":"k11"},{"id":"k11","typ":"ende","titel":"Debriefing: Verlegung auf die Intensivstation","text":"Frau K. wird intubiert und auf die Intensivstation verlegt. Der Volumenbolus hat die Hypotonie nicht an ihrer Ursache behandelt, sondern das Lungenödem verstärkt. Bei einer warmen, weiterhin gestauten Patientin mit Blutdruckabfall unter Nitrat heißt die Antwort: Vasodilatator pausieren, nicht auffüllen.","lernpunkte":["Ein Blutdruckabfall unter Nitrat und NIV ist meist Folge der Vorlastsenkung: zuerst das Nitrat pausieren und die Perfusion prüfen.","Warm und nass bleibt nass, auch wenn der Blutdruck kurz sinkt. Volumen verschlechtert das Lungenödem.","Vasopressoren und Inotropika gehören zur Minderperfusion, nicht zu einer medikamentös ausgelösten Hypotonie bei guter Perfusion.","Versagt die NIV (Vigilanz, Azidose, Hypoxämie), ist die Intubation empfohlen. Sie sollte vorbereitet sein, bevor es so weit ist.","Opiate sind bei akuter Herzinsuffizienz nicht routinemäßig empfohlen, bei Hyperkapnie und Somnolenz erst recht nicht."],"moderation":"Frage an die Gruppe: Welche drei Befunde hätten am Bett gezeigt, dass Frau K. kein Volumen braucht? Erwartet: warme Akren, Rasselgeräusche und B-Linien, weite V. cava."},{"id":"k12","typ":"info","zeit":"Minute 70","effekt":{"vitals":{"sys":116,"dia":66,"hf":100,"spo2":95,"af":20}},"text":"Der Blutdruck hat sich erholt, die Atmung ist ruhiger. Jetzt die Frage: Warum ist Frau K. dekompensiert? Welche Informationen holst du ein?","optionen":[{"id":"ekg_trop","label":"EKG-Kontrolle und Troponin-Verlauf","ergebnis":"Vorhofflimmern 100/min, die ST-Senkungen in V5 und V6 sind bei niedrigerer Frequenz rückläufig. hs-Troponin T 34 ng/l bei Aufnahme, 35 ng/l nach 1 Stunde: erhöht, ohne relevante Dynamik. Eine weitere Kontrolle ist angesetzt.","q":["esc-hf"]},{"id":"medikamente","label":"Medikamentenanamnese mit der Tochter","ergebnis":"Alle Herzmedikamente laut Tablettenbox regelmäßig eingenommen. Neu seit 10 Tagen: Ibuprofen 600 mg dreimal täglich, vom Orthopäden wegen Kniearthrose verordnet. Gewicht zu Hause in dieser Woche um 3 kg gestiegen."},{"id":"niere","label":"Nierenfunktion und Elektrolyte","ergebnis":"Kreatinin 1,6 mg/dl (vor 3 Monaten 1,1 mg/dl), eGFR 34 ml/min/1,73 m². Natrium 136, Kalium 4,9, Magnesium 0,8 mmol/l."},{"id":"infekt","label":"Infektzeichen und Röntgen-Thorax","ergebnis":"Temperatur 36,8 °C, Leukozyten 8,6/nl, CRP 7 mg/l. Röntgen: zentrale Stauung, Kerley-B-Linien, kleine Ergüsse beidseits, kein Infiltrat."},{"id":"rhythmus","label":"Rhythmusanamnese","ergebnis":"Vorhofflimmern seit 4 Jahren bekannt und dauerhaft, unter Bisoprolol in der Praxis um 75/min. Apixaban regelmäßig eingenommen."},{"id":"tsh","label":"TSH","ergebnis":"1,6 mU/l, im Normbereich."},{"id":"le","label":"Hinweise auf Lungenembolie","ergebnis":"Regelmäßige Antikoagulation mit Apixaban, rechter Ventrikel nicht dilatiert, die Hypoxämie ist durch das Lungenödem erklärt. Derzeit kein Anhalt, keine CT erforderlich."}],"pflicht":["ekg_trop","medikamente","niere","infekt"],"weiter":"k13"},{"id":"k13","typ":"mehrfach","zeit":"Minute 80","frage":"Welche Faktoren haben die Dekompensation am ehesten ausgelöst oder verstärkt? Wähle alles Passende.","optionen":[{"id":"a","text":"Ibuprofen: Natrium- und Wasserretention, Verschlechterung der Nierenfunktion","richtig":true,"feedback":"NSAR können bei Herzinsuffizienz eine Dekompensation auslösen und die Nierenfunktion verschlechtern; sie werden bei Herzinsuffizienz nicht empfohlen (ESC III B). Gewichtszunahme und Kreatininanstieg passen zeitlich.","q":["esc-hf"]},{"id":"b","text":"Hypertensive Entgleisung mit Nachlastanstieg","richtig":true,"feedback":"Hoher Blutdruck bei Aufnahme und rasche Besserung unter Vor- und Nachlastsenkung: typisch für das Lungenödem durch erhöhte Nachlast (H in CHAMPIT).","q":["esc-hf"]},{"id":"c","text":"Vorhofflimmern mit schneller Überleitung als Verstärker","richtig":true,"feedback":"Die Frequenz stieg mit der Stauung und fällt mit der Entstauung. Die schnelle Überleitung verschlechtert die Füllung, ist hier aber eher Verstärker als alleinige Ursache. Entstauung kann den Sympathikotonus und damit die Kammerfrequenz senken.","q":["esc-hf"]},{"id":"d","text":"Akutes Koronarsyndrom als Hauptauslöser","richtig":false,"feedback":"Kein Brustschmerz, keine ST-Hebungen, keine neue Wandbewegungsstörung, Koronarien 2024 ohne relevante Stenosen, Troponin ohne relevante Dynamik. Ein Myokardschaden bei Dekompensation und Niereninsuffizienz ist häufig. Endgültig beurteilt wird mit dem Troponin-Verlauf."},{"id":"e","text":"Pneumonie","richtig":false,"feedback":"Kein Fieber, CRP normal, kein Infiltrat. Infektionen sind häufige Auslöser (I in CHAMPIT), hier aber nicht belegt."},{"id":"f","text":"Lungenembolie","richtig":false,"feedback":"Unter regelmäßigem Apixaban, mit normalem rechtem Ventrikel und einem Stauungsbild, das die Hypoxämie erklärt, unwahrscheinlich."},{"id":"g","text":"Hyperthyreose","richtig":false,"feedback":"TSH normal. Bei neuem oder schwer kontrollierbarem Vorhofflimmern trotzdem sinnvoll zu prüfen."}],"erklaerung":"CHAMPIT (ESC): **C** akutes Koronarsyndrom, **H** hypertensiver Notfall, **A** Arrhythmie, **M** akute mechanische Ursache, **P** Pulmonalembolie, **I** Infektion, **T** Tamponade. Dazu bei jeder Dekompensation: Medikamente (NSAR, ausgelassene Einnahme), Salz- und Flüssigkeitszufuhr, Nierenfunktion.","weiter":"k14"},{"id":"k14","typ":"wahl","zeit":"Minute 135","frage":"Zwei Stunden nach dem Furosemid-Bolus: seit der Gabe 180 ml Urin (die Blase war vorher entleert), Spot-Urin-Natrium 41 mmol/l. Kreatinin unverändert 1,6 mg/dl. Wie bewertest du das Ansprechen?","optionen":[{"id":"a","text":"Unzureichend: Furosemid-Dosis i.v. jetzt verdoppeln und das Ansprechen erneut prüfen","bewertung":"richtig","feedback":"Ausreichend wäre ein Spot-Natrium über 50 bis 70 mmol/l nach 2 Stunden und/oder eine Urinmenge über 100 bis 150 ml/h in den ersten 6 Stunden. Beides ist nicht erreicht (180 ml in 2 Stunden, also bisher 90 ml/h). Dann wird die i.v.-Dosis verdoppelt, bis zur Tageshöchstdosis von meist 400 bis 600 mg Furosemid, bei schwer eingeschränkter Nierenfunktion bis 1000 mg (ESC 2021, Abbildung 13).","q":["esc-hf","hfa-diuretika"]},{"id":"b","text":"Ausreichend: dieselbe Dosis in 12 Stunden wiederholen","bewertung":"falsch","feedback":"41 mmol/l liegen unter der Schwelle, 90 ml/h reichen nicht. Wer jetzt wartet, verliert Stunden der Entstauung.","q":["esc-hf"]},{"id":"c","text":"Thiazid zusätzlich, Furosemid in unveränderter Dosis","bewertung":"akzeptabel","feedback":"Eine Kombination mit Thiazid, Metolazon oder Acetazolamid ist der nächste Schritt, wenn trotz gesteigerter Schleifendiuretika-Dosis die Wirkung ausbleibt (Thiazid-Kombination ESC IIa B). Zuerst wird die Schleifendiuretika-Dosis gesteigert. Die Kombination braucht engmaschige Kontrollen von Elektrolyten und Nierenfunktion. Die Oberärztin verdoppelt zunächst das Furosemid.","q":["esc-hf","hfa-diuretika"]},{"id":"d","text":"Furosemid pausieren, weil das Kreatinin seit dem Vorwert gestiegen ist","bewertung":"falsch","feedback":"Ein Kreatininanstieg unter Entstauung ist kein Grund, das Diuretikum abzusetzen, solange die Patientin gestaut ist (HFA 2019). Hier ist der Anstieg zudem schon vor der Therapie entstanden (NSAR, Stauung). Wer gestaut entlassen wird, hat eine schlechte Prognose.","q":["hfa-diuretika"]}],"erklaerung":"Für Natrium gilt mmol/l gleich mEq/l. Das Schema der ESC beruht auf Expertenkonsens: niedrig beginnen, früh messen, bei unzureichendem Ansprechen rasch verdoppeln.","weiter":"k15"},{"id":"k15","typ":"text","zeit":"Morgenvisite, 8:30 Uhr","titel":"Verlauf bis zum Morgen","effekt":{"vitals":{"hf":88,"sys":126,"dia":72,"spo2":94,"af":18}},"text":"Die Furosemid-Dosis wurde verdoppelt. Zwei Stunden danach lag das Spot-Natrium bei 96 mmol/l, seitdem 1,6 l Urin. CPAP wurde nach 3 Stunden beendet, die SpO₂ liegt unter Raumluft bei 94 %, deshalb kein Sauerstoff mehr. Vorhofflimmern 88/min, RR 126/72 mmHg. Kreatinin 1,7 mg/dl, Kalium 4,3 mmol/l. Frau K. kann flacher liegen, basal noch Rasselgeräusche, Knöchelödeme unverändert.","weiter":"k16"},{"id":"k16","typ":"mehrfach","zeit":"Morgenvisite","frage":"Bei der Visite geht es um die weitere Therapie. Welche Aussagen treffen zu?","optionen":[{"id":"a","text":"Bisoprolol in bisheriger Dosis weitergeben, solange keine symptomatische Hypotonie, Bradykardie oder Minderperfusion besteht","richtig":true,"feedback":"Die orale Herzinsuffizienz-Therapie wird fortgesetzt. Reduktion oder Pause nur bei hämodynamischer Instabilität, schwer eingeschränkter Nierenfunktion oder Hyperkaliämie. Absetzen oder Reduktion des Betablockers war retrospektiv mit schlechterem Verlauf verbunden (ESC 2021).","q":["esc-hf"]},{"id":"b","text":"Bisoprolol absetzen, bis die Dekompensation vorbei ist","richtig":false,"feedback":"Kein Schock, keine Bradykardie: Der Betablocker bleibt. Ohne ihn fehlt außerdem die Frequenzkontrolle des Vorhofflimmerns.","q":["esc-hf"]},{"id":"c","text":"Ibuprofen absetzen, Schmerztherapie ohne NSAR planen und den Hinweis in den Arztbrief schreiben","richtig":true,"feedback":"NSAR sind bei Herzinsuffizienz nicht empfohlen (ESC III B). Ohne klare Kommunikation an Hausarztpraxis und Orthopädie droht die nächste Dekompensation.","q":["esc-hf"]},{"id":"d","text":"Sacubitril/Valsartan und Spironolacton fortführen, sofern Blutdruck, Kalium und Kreatinin es erlauben; sonst Dosis anpassen oder kurz pausieren","richtig":true,"feedback":"Die prognostisch wirksame Therapie bleibt, mit täglicher Kontrolle von Kalium und Kreatinin. Die HFA rät, die Herzinsuffizienz-Therapie während der Entstauung beizubehalten, da sie auch das Ansprechen auf Diuretika verbessern kann.","q":["esc-hf","hfa-diuretika"]},{"id":"e","text":"Morphin als Bedarfsmedikation gegen nächtliche Luftnot ansetzen","richtig":false,"feedback":"Routinemäßige Opiate sind bei akuter Herzinsuffizienz nicht empfohlen (ESC III C). Nächtliche Luftnot ist ein Zeichen für Reststauung und gehört entstaut.","q":["esc-hf"]},{"id":"f","text":"Zusätzlich niedermolekulares Heparin zur Thromboseprophylaxe","richtig":false,"feedback":"Frau K. ist mit Apixaban antikoaguliert. Die Prophylaxe ist für Patient:innen ohne bestehende Antikoagulation empfohlen (ESC I A). Doppelte Antikoagulation erhöht das Blutungsrisiko.","q":["esc-hf"]},{"id":"g","text":"Diltiazem i.v. für eine schnellere Frequenzkontrolle","richtig":false,"feedback":"Bei HFrEF nicht empfohlen, da negativ inotrop (ESC III C). Für die Frequenz reichen meist Entstauung und Betablocker. Bleibt sie über 110/min, kann Digoxin erwogen werden; bei Instabilität Amiodaron i.v. oder Kardioversion.","q":["esc-hf"]},{"id":"h","text":"Täglich wiegen, Ein- und Ausfuhr bilanzieren, Kreatinin und Elektrolyte mindestens alle 24 Stunden","richtig":true,"feedback":"So wird die Entstauung gesteuert und Elektrolytstörungen werden früh erkannt (ESC 2021, Abbildung 13; HFA 2019).","q":["esc-hf","hfa-diuretika"]}],"erklaerung":"Vor der Entlassung: keine Reststauung, orale Therapie optimiert, Kontrolltermin nach 1 bis 2 Wochen (ESC 2021). Das Focused Update 2023 empfiehlt nach einer Herzinsuffizienz-Hospitalisierung eine intensive, rasche Aufdosierung der Therapie mit engmaschigen Kontrollen in den ersten 6 Wochen (STRONG-HF).","weiter":"k17"},{"id":"k17","typ":"ende","titel":"Debriefing","text":"Frau K. ist auf dem Weg der Besserung, der Auslöser ist gefunden. Entscheidend waren die frühe Atemunterstützung, eine Diuretika-Dosis, die zur Vormedikation passt, die Erfolgskontrolle nach 2 Stunden und die Ruhe, einen Blutdruckabfall unter Nitrat nicht mit Volumen zu beantworten.","lernpunkte":["Das akute Lungenödem ist meist warm und nass: Stauung ja, Minderperfusion nein. Das Profil bestimmt die Therapie.","Bei Atemfrequenz über 25/min und SpO₂ unter 90 % früh CPAP/NIV: Luftnot und Gasaustausch bessern sich schneller, Intubationen werden seltener.","Furosemid i.v.: 1- bis 2-Fache der oralen Tagesdosis, ohne Vortherapie 20 bis 40 mg. Nach 2 Stunden Spot-Natrium über 50 bis 70 mmol/l und/oder Urin über 100 bis 150 ml/h in den ersten 6 Stunden, sonst Dosis verdoppeln.","Nitrat nur bei ausreichendem Blutdruck (systolisch über 110 mmHg), niedrig beginnen, titrieren, bei Hypotonie pausieren.","Auslöser systematisch suchen: CHAMPIT plus Medikamente (NSAR) und Nierenfunktion.","Kein Routine-Morphin, kein Volumen bei Stauung. Betablocker und übrige Herzinsuffizienz-Therapie ohne Schockzeichen weitergeben."],"moderation":"Abschlussfrage: Was müsste sich ändern, damit aus diesem Fall ein kalt-nasses Profil wird, und was hieße das für Nitrat und Inotropika?"}]},{"id":"ablauf-bga-lesen","typ":"ablauf","titel":"Blutgas lesen","untertitel":"Systematisch von der Oxygenierung bis zum Laktat","gruppe":"Befunde","reihenfolge":20,"ebene":"oeffentlich","status":"entwurf","dauer":"25 bis 30 min","lernziele":["Eine Blutgasanalyse in fester Reihenfolge lesen: Oxygenierung, pH, pCO2, HCO3⁻ und Base Excess, Kompensation, Anionenlücke, Laktat, Elektrolyte, Glukose und Hb.","Den Horovitz-Quotienten berechnen und die Oxygenierungsstörung einordnen.","Die erwartete Kompensation mit Faustregeln abschätzen und Mischstörungen erkennen, auch bei normalem pH.","Die Anionenlücke mit Albumin-Korrektur berechnen und metabolische Azidosen mit hoher und normaler Anionenlücke ihren Ursachen zuordnen.","Präanalytische Fehler erkennen (venöse Probe, Verdünnung, Luft, Pseudohyperkaliämie) und zwischen Kontrolle und sofortiger Behandlung abwägen."],"quellen":[{"id":"berend-2014","kurz":"Berend 2014","titel":"Berend K, de Vries APJ, Gans ROB. Physiological approach to assessment of acid-base disturbances. N Engl J Med 2014;371:1434–1445. Volltext nicht eingesehen, Kernaussagen nach der Zusammenfassung in ADLM CLN Stat, November 2014","url":"https://myadlm.org/cln/cln-stat/2014/november/a-physiological-approach-to-assessing-acid-base-disturbances","stand":"2014"},{"id":"msd-sb","kurz":"MSD Manual 2025a","titel":"Lewis JL. Acid-Base Disorders. MSD Manual Professional Edition (Tabelle der erwarteten Kompensation, Anionenlücke, Delta-Gap)","url":"https://www.msdmanuals.com/professional/endocrine-and-metabolic-disorders/acid-base-regulation-and-disorders/acid-base-disorders","stand":"2025"},{"id":"msd-azidose","kurz":"MSD Manual 2025b","titel":"Lewis JL. Metabolic Acidosis. MSD Manual Professional Edition","url":"https://www.msdmanuals.com/professional/endocrine-and-metabolic-disorders/acid-base-regulation-and-disorders/metabolic-acidosis","stand":"2025"},{"id":"msd-alkalose","kurz":"MSD Manual 2025c","titel":"Lewis JL. Metabolic Alkalosis. MSD Manual Professional Edition","url":"https://www.msdmanuals.com/professional/endocrine-and-metabolic-disorders/acid-base-regulation-and-disorders/metabolic-alkalosis","stand":"2025"},{"id":"msd-resp-azidose","kurz":"MSD Manual 2025d","titel":"Lewis JL. Respiratory Acidosis. MSD Manual Professional Edition","url":"https://www.msdmanuals.com/professional/endocrine-and-metabolic-disorders/acid-base-regulation-and-disorders/respiratory-acidosis","stand":"2025"},{"id":"msd-resp-alkalose","kurz":"MSD Manual 2026a","titel":"Lewis JL. Respiratory Alkalosis. MSD Manual Professional Edition","url":"https://www.msdmanuals.com/professional/endocrine-and-metabolic-disorders/acid-base-regulation-and-disorders/respiratory-alkalosis","stand":"2026"},{"id":"msd-gas","kurz":"MSD Manual 2026b","titel":"Wood KL. Measurement of Gas Exchange. MSD Manual Professional Edition (Hypoxämie, pCO2, A-a-Gradient, Pulsoxymetrie)","url":"https://www.msdmanuals.com/professional/pulmonary-disorders/tests-of-pulmonary-function-pft/measurement-of-gas-exchange","stand":"2026"},{"id":"sood-2010","kurz":"Sood 2010","titel":"Sood P, Paul G, Puri S. Interpretation of arterial blood gas. Indian J Crit Care Med 2010;14:57–64","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2936733/","stand":"2010"},{"id":"hamm-2015","kurz":"Hamm 2015","titel":"Hamm LL, Nakhoul N, Hering-Smith KS. Acid-Base Homeostasis. Clin J Am Soc Nephrol 2015;10:2232–2242","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4670772/","stand":"2015"},{"id":"kraut-2013","kurz":"Kraut 2013","titel":"Kraut JA, Nagami GT. The serum anion gap in the evaluation of acid-base disorders: what are its limitations and can its effectiveness be improved? Clin J Am Soc Nephrol 2013;8:2018–2024","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3817910/","stand":"2013"},{"id":"berend-2017","kurz":"Berend 2017","titel":"Berend K. Review of the diagnostic evaluation of normal anion gap metabolic acidosis. Kidney Dis 2017;3:149–159","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5757610/","stand":"2017"},{"id":"emmett-2020","kurz":"Emmett 2020","titel":"Emmett M. Metabolic alkalosis: a brief pathophysiologic review. Clin J Am Soc Nephrol 2020;15:1848–1856","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7769018/","stand":"2020"},{"id":"aafp-2025","kurz":"AAFP 2025","titel":"Morikawa MJ, Ganesh PR. Acid-Base Interpretation: A Practical Approach. Am Fam Physician 2025;111:148–155 (frei zugänglicher Teil: Zusammenfassung, Kernempfehlungen)","url":"https://www.aafp.org/afp/2025/0200/acid-base-interpretation","stand":"2025"},{"id":"higgins-2017","kurz":"Higgins 2017","titel":"Higgins C. Base excess: the basics. acutecaretesting.org, November 2017","url":"https://acutecaretesting.org/en/articles/Base-Excess-the-basics","stand":"2017"},{"id":"andersen-2013","kurz":"Andersen 2013","titel":"Andersen LW, Mackenhauer J, Roberts JC, Berg KM, Cocchi MN, Donnino MW. Etiology and therapeutic approach to elevated lactate levels. Mayo Clin Proc 2013;88:1127–1140","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3975915/","stand":"2013"},{"id":"erc-2021","kurz":"ERC 2021","titel":"Lott C, Truhlář A, Alfonzo A, et al. Kreislaufstillstand unter besonderen Umständen. Leitlinien des European Resuscitation Council 2021 (Abschnitte Hyper- und Hypokaliämie). Notfall Rettungsmed 2021;24:447–523","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8190767/","stand":"2021"},{"id":"berlin-2012","kurz":"Berlin-Definition 2012","titel":"The ARDS Definition Task Force. Acute respiratory distress syndrome: the Berlin Definition. JAMA 2012;307:2526–2533","url":"https://jamanetwork.com/journals/jama/fullarticle/1160659","stand":"2012"},{"id":"s2k-niv-2023","kurz":"S2k NIV 2023","titel":"Westhoff M, Neumann P, Geiseler J, Bickenbach J, Kluge S. Zehn Kernaussagen der S2k-Leitlinie Nichtinvasive Beatmung als Therapie der akuten respiratorischen Insuffizienz. Med Klin Intensivmed Notfmed 2023;118:656–659","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10624735/","stand":"2023"},{"id":"baird-2013","kurz":"Baird 2013","titel":"Baird G. Preanalytical considerations in blood gas analysis. Biochem Med 2013;23:19–27","url":"https://www.biochemia-medica.com/en/journal/23/1/10.11613/BM.2013.005/fullArticle","stand":"2013"},{"id":"salvagno-2019","kurz":"Salvagno 2019","titel":"Salvagno GL, Demonte D, Lippi G. A paradigmatic case of haemolysis and pseudohyperkalemia in blood gas analysis. Biochem Med 2019;29:011003","url":"https://www.biochemia-medica.com/en/journal/29/1/10.11613/BM.2019.011003","stand":"2019"},{"id":"smellie-2007","kurz":"Smellie 2007","titel":"Smellie WSA. Spurious hyperkalaemia. BMJ 2007;334:693–695","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC1839224/","stand":"2007"},{"id":"allardet-2017","kurz":"Allardet-Servent 2017","titel":"Allardet-Servent J, Lebsir M, Dubroca C, et al. Point-of-care versus central laboratory measurements of hemoglobin, hematocrit, glucose, bicarbonate and electrolytes. PLoS One 2017;12:e0169593","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0169593","stand":"2017"},{"id":"byrne-2014","kurz":"Byrne 2014","titel":"Byrne AL, Bennett M, Chatterji R, et al. Peripheral venous and arterial blood gas analysis in adults: are they comparable? A systematic review and meta-analysis. Respirology 2014;19:168–175 (Zusammenfassung auf acutecaretesting.org; Zahlen nach Abstract)","url":"https://acutecaretesting.org/en/journal-scans/venous-versus-arterial-blood-for-blood-gas-analysis--revisited","stand":"2014"},{"id":"cochrane-2025","kurz":"Cochrane 2025","titel":"Byrne AL, Pace NL, Thomas PS, et al. Peripheral venous blood gas analysis for the diagnosis of respiratory failure, hypercarbia and metabolic disturbance in adults. Cochrane Database Syst Rev 2025 (Zusammenfassung Cochrane)","url":"https://ec.cochrane.org/news/peripheral-venous-blood-gas-analysis-diagnosis-respiratory-failure-hypercarbia-and-metabolic","stand":"2025"},{"id":"chl-2025","kurz":"Laborbereich CHL 2025","titel":"Canterbury Health Laboratories (Neuseeland). Core Biochemistry Reference Intervals: Blood Gases, Issue 3, Juli 2025. Nur als Beispiel eines Labor-Referenzbereichs","url":"https://www.chl.co.nz/wp-content/uploads/2023/10/Laboratory-Reference-Intervals-Blood-Gases.pdf","stand":"2025"},{"id":"waikato-be","kurz":"Laborleitfaden Waikato","titel":"Te Whatu Ora Waikato Laboratory. Test Guide: Base excess (blood gas), Referenzbereich und Abnahme aus Leitungen. Nur als Beispiel eines Laborleitfadens","url":"https://lab.waikatodhb.health.nz/test-guide/view/89/base-excess-blood-gas","stand":"2026"}],"moderation":"Impulsfragen:\n1. Warum steht die Oxygenierung am Anfang, obwohl der pH die Säure-Basen-Frage entscheidet?\n2. Woran erkennt ihr, dass hinter einem normalen pH zwei Störungen stecken?\n3. Welche auffälligen Werte würdet ihr erst bestätigen, und bei welchen behandelt ihr sofort?\n4. Wann reicht euch eine venöse BGA, und wann besteht ihr auf einer arteriellen?\nStolperstellen: Albumin-Korrektur vergessen. Ein pCO2 über 45 mmHg bei metabolischer Alkalose wird als Hypoventilation fehlgedeutet. Kompensationsregeln sind Faustregeln, keine exakten Grenzen. Normbereiche im Modul sind Richtwerte, maßgeblich ist das eigene Labor.","phasen":[{"titel":"Oxygenierung: pO2, SaO2, Horovitz-Quotient","inhalt":"Vorab den Rahmen notieren: Probenart (arteriell, venös, Mischblut?), Uhrzeit, FiO2 bzw. Sauerstofffluss, Atemunterstützung (NIV, Beatmung). Ohne FiO2 lässt sich ein pO2 nicht bewerten.\n**pO2:** Hypoxämie ist definiert als PaO2 \u003c60 mmHg, entsprechend einer SaO2 \u003c90 %. Richtwert unter Raumluft etwa 75 bis 100 mmHg (Laborbereiche unterscheiden sich). Der A-a-Gradient nimmt mit Alter und FiO2 zu.\n**SaO2 und SpO2:** Die Pulsoxymetrie weicht im Bereich 70 bis 100 % um 2 bis 5 % von der gemessenen SaO2 ab, bei Hypotonie, Zentralisation und Arrhythmie stärker. Bei CO-Vergiftung zeigt sie falsch normale Werte, bei Methämoglobinämie ungenaue. Passen SO2 der Probe und SpO2 nicht zusammen (z. B. 68 % gegenüber 97 %), an eine venöse Probe denken.\n**Horovitz-Quotient:** PaO2 in mmHg geteilt durch FiO2 als Bruch. Beispiel: 80 mmHg bei FiO2 0,4 ergibt 200 mmHg. Mit Normwerten des pO2 unter Raumluft ergeben sich rechnerisch etwa 350 bis 480 mmHg. Die Berlin-Definition stuft beim ARDS ein: >200 bis ≤300 mmHg mild, >100 bis ≤200 moderat, ≤100 schwer. Diese Stufen setzen voraus, dass die übrigen ARDS-Kriterien erfüllt sind; beim kardialen Lungenödem beschreibt der Quotient nur das Ausmaß der Oxygenierungsstörung. Bei Angabe in kPa ändern sich die Zahlen (1 kPa = 7,5 mmHg; 300 mmHg entsprechen 40 kPa).","q":["msd-gas","berlin-2012","chl-2025","sood-2010"]},{"titel":"pH: Azidämie oder Alkalämie?","inhalt":"pH \u003c7,35: Azidämie, pH >7,45: Alkalämie (Richtwerte). Der pH zeigt nur das Nettoergebnis aller Störungen.\nEin normaler pH schließt eine Störung nicht aus: Gegenläufige Störungen können sich aufheben. Die Kompensation bewegt den pH in Richtung Normalbereich, in der Regel aber nicht ganz zurück.\nSchrittfolge nach dem physiologischen Ansatz (Berend 2014): klinische Einschätzung, Primärstörung und Gegenregulation, Anionenlücke bei metabolischer Azidose, Suche nach weiteren metabolischen Störungen, bei unklarer hoher Anionenlücke die osmotische Lücke.","q":["msd-sb","msd-resp-azidose","berend-2014","chl-2025"]},{"titel":"Respiratorische Komponente: pCO2","inhalt":"Richtwert 35 bis 45 mmHg.\n**Erklärt der pCO2 die pH-Richtung?** Azidämie mit pCO2 >45 mmHg: respiratorische Azidose. Alkalämie mit pCO2 \u003c35 mmHg: respiratorische Alkalose.\nEin hoher pCO2 bei Alkalämie oder ein niedriger bei Azidämie ist meist die Kompensation einer metabolischen Störung, nicht die Primärstörung.\n**Respiratorische Azidose (Hypoventilation):** zentral (Sedativa, Opioide, Hirnstamm), neuromuskulär, obstruktive, restriktive oder parenchymatöse Lungenerkrankung, Erschöpfung der Atempumpe.\n**Respiratorische Alkalose (Hyperventilation):** Hypoxämie, Lungenembolie (oft ohne Hypoxämie), Sepsis, Lebererkrankung, Schmerz, Fieber, ZNS-Erkrankung, Überbeatmung am Respirator; Angst erst nach Ausschluss anderer Ursachen.\nAkut oder chronisch entscheidet sich am Ausmaß der metabolischen Kompensation (siehe Kompensationsregeln). Eine chronische Hyperkapnie langsam senken, sonst droht eine posthyperkapnische Alkalose.","q":["msd-gas","msd-resp-azidose","msd-resp-alkalose","aafp-2025","sood-2010"]},{"titel":"Metabolische Komponente: Bikarbonat und Base Excess","inhalt":"**HCO3⁻:** Richtwert etwa 22 bis 28 mmol/l (obere Grenze je nach Labor 28 bis 29). Azidämie mit niedrigem HCO3⁻: metabolische Azidose. Alkalämie mit hohem HCO3⁻: metabolische Alkalose.\n**Base Excess (BE):** Menge an starker Säure oder Base, die den pH der Probe bei pCO2 40 mmHg und 37 °C auf 7,40 zurückbringt. Richtwert um 0, etwa −2 bis +2 mmol/l, je nach Labor bis ±3.\nNegativer BE (Basendefizit): metabolische Azidose oder metabolische Kompensation einer respiratorischen Alkalose. Positiver BE: metabolische Alkalose oder Kompensation einer respiratorischen Azidose. Bei akuten respiratorischen Störungen bleibt der BE normal, solange keine renale Kompensation eingesetzt hat.\nDer Standard-BE (SBE) hängt weniger vom pCO2 ab als der aktuelle BE und ist deshalb das bessere metabolische Maß.\n**Gegensinnig veränderte Werte** (pCO2 hoch und HCO3⁻ niedrig oder umgekehrt) sind keine Kompensation, sondern immer eine kombinierte Störung.","q":["higgins-2017","msd-sb","chl-2025","waikato-be"]},{"titel":"Kompensation und Mischstörungen","inhalt":"Jede Primärstörung löst eine gleichsinnige Gegenregulation aus. Respiratorisch geht das schnell (Stunden, vollständig nach etwa 12 bis 24 h), renal langsam (2 bis 5 Tage).\n**Erwartete Kompensation (Faustregeln):**\n• Metabolische Azidose: pCO2 = 1,5 × HCO3⁻ + 8 (±2) mmHg (Winter-Formel); etwa 1,2 mmHg pCO2-Abfall je 1 mmol/l HCO3⁻-Abfall\n• Metabolische Alkalose: pCO2 steigt um etwa 0,6 bis 0,75 mmHg je 1 mmol/l HCO3⁻-Anstieg (Sood: pCO2 = 0,7 × HCO3⁻ + 21 ±2); sehr variabel, meist nicht über 55 mmHg\n• Respiratorische Azidose: HCO3⁻ steigt je 10 mmHg pCO2-Anstieg akut um 1 bis 2, chronisch um 3 bis 4 mmol/l (Sood: 1 bzw. 3,5)\n• Respiratorische Alkalose: HCO3⁻ fällt je 10 mmHg pCO2-Abfall akut um 1 bis 2 (Sood: 2), chronisch um 4 bis 5 mmol/l\n**Hinweise auf eine Mischstörung:** gemessener Wert außerhalb des erwarteten Bereichs (bei metabolischer Azidose: pCO2 höher als erwartet = zusätzliche respiratorische Azidose, niedriger = zusätzliche respiratorische Alkalose); pCO2 und HCO3⁻ gegensinnig verändert; normaler pH bei deutlich verändertem pCO2 oder HCO3⁻; hohe Anionenlücke bei normalem oder hohem HCO3⁻.\nDie Regeln sind Näherungen. Liegt ein Wert knapp außerhalb, Klinik und Verlauf entscheiden lassen.","q":["msd-sb","sood-2010","hamm-2015","berend-2014","emmett-2020"]},{"titel":"Anionenlücke und Differenzialdiagnosen","inhalt":"Bei jeder metabolischen Azidose und bei unklarer Konstellation berechnen: **AG = Na⁺ − (Cl⁻ + HCO3⁻)**, ohne Kalium.\n**Normalwert:** stark methodenabhängig. Richtwert etwa 12 mmol/l; mit ionenselektiven Elektroden liegen Referenzbereiche oft niedriger (z. B. 3 bis 11 mmol/l). Eigenen Laborbereich und möglichst den Ausgangswert der Patient:in kennen.\n**Albumin-Korrektur:** Albumin ist das wichtigste ungemessene Anion. Je 1 g/dl (10 g/l) Albumin unter 4 g/dl sinkt die AG um etwa 2,5 mmol/l.\nAG korrigiert = AG + 2,5 × (4,0 − Albumin in g/dl) = AG + 0,25 × (40 − Albumin in g/l).\nOhne Korrektur wird bei Hypalbuminämie eine Azidose mit hoher AG leicht übersehen.\n**Hohe AG:** Laktatazidose, Ketoazidose (diabetisch, alkoholisch, Hunger), Nierenversagen, Rhabdomyolyse, Toxine (Methanol, Ethylenglykol, Salicylate u. a.). Bei unklarer hoher AG die osmotische Lücke bestimmen (>10 spricht für eine osmotisch aktive Substanz).\n**Normale AG (hyperchlorämisch):** Bikarbonatverlust über den Darm (Diarrhö, Ileostoma, Fisteln), renal (RTA, Acetazolamid), rasche Infusion großer Mengen NaCl 0,9 % (Chlorid 154 mmol/l, Plasma etwa 106), Hypoaldosteronismus, Harnableitung in den Darm.\n**Delta-Betrachtung bei hoher AG:** ΔAG = AG (korrigiert) − Normalwert. HCO3⁻ + ΔAG ergibt das „korrigierte“ Bikarbonat: deutlich über dem Normbereich spricht für eine zusätzliche metabolische Alkalose, deutlich darunter für eine zusätzliche Azidose mit normaler AG. Das Verhältnis ΔAG/ΔHCO3⁻ schwankt (Laktatazidose im Mittel etwa 1,5, Ketoazidose etwa 1), deshalb nur als Hinweis nutzen.\n**Niedrige AG:** meist Laborfehler oder Hypalbuminämie.","q":["msd-sb","msd-azidose","kraut-2013","berend-2017","sood-2010"]},{"titel":"Laktat","inhalt":"Richtwert \u003c2 mmol/l (methoden- und laborabhängig). Studien definieren erhöhtes Laktat meist ab 2,0 bis 2,5 mmol/l, „hoch“ oft ab >4 mmol/l. Von Laktatazidose spricht man erst bei begleitender Azidämie (pH \u003c7,35).\n**Typ A (Hypoperfusion, Hypoxie):** Schock jeder Ursache, z. B. kardiogener Schock; schwere Hypoxämie.\n**Typ B (ohne Gewebehypoxie):** Adrenalin und β2-Agonisten, Metformin (vor allem bei Kumulation durch Nieren- oder Leberversagen), Leberversagen (verminderte Clearance), Krampfanfall (vorübergehend; Persistenz über 1 bis 2 h spricht für eine weitere Ursache), Thiaminmangel.\n**Verlauf:** Eine effektive Laktat-Clearance ist in mehreren Situationen mit geringerer Sterblichkeit verbunden; im kardiogenen Schock nach STEMI hatten Patient:innen mit Clearance \u003c10 % ein schlechteres Überleben.\n**Probe:** Laktat steigt in der Spritze weiter an. Innerhalb von 15 bis 30 min messen. Arterielles und venöses Laktat korrelieren eng, beide sind verwendbar.","q":["andersen-2013","chl-2025","msd-azidose"]},{"titel":"Elektrolyte, Glukose und Hämoglobin","inhalt":"**Kalium (ERC 2021):** Hypokaliämie \u003c3,5 mmol/l (leicht 3,0 bis 3,4; mittel 2,5 bis 2,9; schwer \u003c2,5). Hyperkaliämie >5,5 mmol/l (leicht 5,5 bis 5,9; mittel 6,0 bis 6,4; schwer ≥6,5).\n**EKG bei Hyperkaliämie:** AV-Block I° (PR >0,2 s), abgeflachte oder fehlende P-Wellen, hohe spitze T-Wellen (T höher als R in mehr als einer Ableitung), ST-Senkung, QRS >0,12 s, Bradykardie, ventrikuläre Tachykardie, Kreislaufstillstand. Ein normales EKG schließt eine schwere Hyperkaliämie nicht aus.\n**EKG bei Hypokaliämie:** U-Wellen, abgeflachte T-Wellen, ST-Senkung und T-Negativierung, PR-Verlängerung, Arrhythmien (besonders unter Digoxin).\n**Kalium und Säure-Basen-Status:** Hypokaliämie und metabolische Alkalose unterhalten sich gegenseitig. Insulin-Glukose und Salbutamol senken das Kalium.\n**Natrium und Chlorid** gehen in die AG ein. Chlorid ist bei Diuretika-Alkalose niedrig, nach großen NaCl-Mengen hoch.\n**Ionisiertes Calcium** sinkt bei Alkalämie (stärkere Proteinbindung).\n**Glukose:** BGA- und Laborwert stimmen im Mittel gut überein, im hypoglykämischen Bereich gibt es aber klinisch relevante Abweichungen.\n**Hb:** Das BGA-Hb weicht methodisch vom Labor-Hb ab und ist anfällig für Abnahmefehler. Gut als Verlaufswert, unplausible Werte korrekt wiederholen. Verdünnung durch Spüllösung senkt Hb, Kalium, Glukose und Laktat gleichsinnig.","q":["erc-2021","msd-alkalose","emmett-2020","allardet-2017","baird-2013"]}],"kriterien":[{"titel":"Merkliste Normbereiche (Richtwerte, arterielles Blut, Erwachsene; UKHD-Laborwerte nicht hinterlegt)","punkte":["pH 7,35 bis 7,45; darunter Azidämie, darüber Alkalämie","pCO2 35 bis 45 mmHg (4,7 bis 6,0 kPa; 1 kPa = 7,5 mmHg)","pO2 unter Raumluft etwa 75 bis 100 mmHg (Beispiel-Laborbereich 75 bis 105 mmHg); Hypoxämie: pO2 \u003c60 mmHg, entsprechend SaO2 \u003c90 %","SaO2 bei Lungengesunden unter Raumluft hoch (Beispiel-Laborbereich >97 %); SpO2 weicht im Bereich 70 bis 100 % um 2 bis 5 % ab","HCO3⁻ etwa 22 bis 28 mmol/l (obere Grenze je nach Labor 28 bis 29)","Base Excess etwa −2 bis +2 mmol/l (je nach Labor bis ±3)","Anionenlücke Na⁺ − (Cl⁻ + HCO3⁻) ohne Kalium: Richtwert etwa 12 mmol/l, stark methodenabhängig (mit ionenselektiven Elektroden oft 3 bis 11 mmol/l); Korrektur +2,5 mmol/l je 1 g/dl (10 g/l) Albumin unter 4 g/dl","Laktat \u003c2 mmol/l; erhöht meist ab 2,0 bis 2,5, „hoch“ oft ab >4 mmol/l","Kalium: Hypokaliämie \u003c3,5 mmol/l (schwer \u003c2,5), Hyperkaliämie >5,5 mmol/l (schwer ≥6,5)","Ionisiertes Calcium: Beispiel-Laborbereich 1,15 bis 1,30 mmol/l","Horovitz-Quotient PaO2/FiO2: rechnerisch etwa 350 bis 480 mmHg bei normalem pO2 unter Raumluft; ARDS-Stufen (Berlin): ≤300 mild, ≤200 moderat, ≤100 schwer","Alle Zahlen sind Richtwerte aus Literatur und Beispiel-Laborbereichen. Maßgeblich sind der Referenzbereich des eigenen Labors und Geräts sowie der Hausstandard."]},{"titel":"Ursachen nach Störung","punkte":["**Metabolische Azidose mit hoher AG:** Laktat (Schock, Hypoxämie, Adrenalin, Metformin), Ketoazidose, Nierenversagen, Rhabdomyolyse, Toxine (Methanol, Ethylenglykol, Salicylate)","**Metabolische Azidose mit normaler AG:** Diarrhö, Ileostoma, Fisteln; RTA; Acetazolamid; große Mengen NaCl 0,9 %; Hypoaldosteronismus (auch durch ACE-Hemmer, AT1-Blocker, Spironolacton); Harnableitung in den Darm","**Metabolische Alkalose, chloridsensibel (Urin-Chlorid \u003c20 mmol/l):** Diuretika (nach Abklingen der Wirkung), Erbrechen oder Magensonde, posthyperkapnisch","**Metabolische Alkalose, chloridresistent (Urin-Chlorid >20 mmol/l):** schwere Hypokaliämie und Hypomagnesiämie, Hyperaldosteronismus, Bartter- und Gitelman-Syndrom, Lakritz; unter laufender Diuretikawirkung ist das Urin-Chlorid ebenfalls hoch","**Respiratorische Azidose:** zentrale Atemdepression (Sedativa, Opioide, Hirnstamm), neuromuskuläre Schwäche, obstruktive, restriktive oder parenchymatöse Lungenerkrankung, Erschöpfung","**Respiratorische Alkalose:** Hypoxämie, Lungenembolie, Sepsis, Lebererkrankung, Schmerz, Fieber, ZNS-Erkrankung, Überbeatmung; Angst erst nach Ausschluss"]},{"titel":"Fallen bei Probe und Messung","punkte":["**Venös statt arteriell:** pO2 und SO2 unbrauchbar; pCO2 nicht austauschbar (ein normaler venöser pCO2 macht eine Hyperkapnie unwahrscheinlich, ein erhöhter beweist sie nicht); arterieller pH im Mittel etwa 0,03 höher. Hinweis: SO2 der Probe passt nicht zur SpO2.","**Verdünnung durch Spüllösung** aus dem arteriellen Zugang (zu wenig verworfen): Hb, Kalium, Glukose und Laktat gleichsinnig zu niedrig; bei NaCl zusätzlich Chlorid hoch, HCO3⁻ und pCO2 niedrig, pH kaum verändert. Verwerfvolumen nach Hausstandard (Beispiel eines Laborleitfadens: mindestens 3 ml).","**Zu viel Flüssigheparin:** verdünnt HCO3⁻ und pCO2; Heparin bindet Kationen wie ionisiertes Calcium. Spritzen mit balanciertem Trockenheparin verwenden.","**Luftblasen:** pO2 wandert Richtung Raumluft (etwa 150 mmHg), bei längerem Kontakt sinkt der pCO2 und der pH steigt. Luft sofort entfernen.","**Verzögerte Messung:** Zellen verbrauchen weiter Sauerstoff und Glukose, Laktat steigt. Messung innerhalb von 15 min, wenn pO2 gebraucht wird, sonst innerhalb von 30 min. Plastikspritzen nicht auf Eis legen (Baird, Salvagno); ältere Empfehlungen nennen Kühlung nur für Glasspritzen bei langem Transport.","**Pseudohyperkaliämie:** Hämolyse (schwierige Punktion, Blut durch dünne Kanüle gepresst, Schütteln), Faustschluss und lange Stauung, Kühlung, lange Lagerung, Kontamination mit Kalium-EDTA, ausgeprägte Thrombozytose oder Leukozytose. BGA-Geräte erkennen Hämolyse im Vollblut nicht. Verdacht bei normaler Nierenfunktion, normalem EKG oder hämatologischer Vorerkrankung: korrekt abgenommene Kontrolle ohne Kühlung, ggf. Plasma-Kalium (Lithium-Heparin).","**BGA und Zentrallabor** messen Hb, Natrium und Glukose methodisch verschieden. Für AG und Verlauf möglichst Werte derselben Messmethode verwenden."]}],"uebungen":[{"titel":"Die Lesereihenfolge","start_knoten":"r1","knoten":[{"id":"r1","typ":"sortieren","frage":"Bringe die Schritte beim Lesen einer arteriellen Blutgasanalyse in die Reihenfolge dieses Moduls.","schritte":[{"text":"Oxygenierung: pO2, SaO2 und Horovitz-Quotient im Kontext von FiO2 und Atemunterstützung","warum":"Eine Hypoxämie ist die unmittelbar bedrohlichste Störung. Zugleich prüfst du hier, ob die Probe überhaupt arteriell ist.","q":["msd-gas"]},{"text":"pH: Azidämie oder Alkalämie?","warum":"Der pH gibt die Richtung vor, an der sich die Primärstörung messen lassen muss.","q":["msd-sb"]},{"text":"pCO2: Erklärt er die pH-Richtung (respiratorische Primärstörung)?","warum":"Passt der pCO2 zur pH-Richtung, ist die Störung respiratorisch; sonst ist er eher Kompensation.","q":["msd-resp-azidose","msd-resp-alkalose"]},{"text":"HCO3⁻ und Base Excess: Erklärt die metabolische Komponente die pH-Richtung?","warum":"Gleiche Logik für die metabolische Seite; gegensinnige Veränderungen zeigen eine kombinierte Störung.","q":["higgins-2017"]},{"text":"Kompensation prüfen: erwarteter gegen gemessenen Wert","warum":"Weicht der gemessene Wert vom erwarteten ab, liegt eine zweite Störung vor.","q":["msd-sb","sood-2010"]},{"text":"Anionenlücke mit Albumin-Korrektur, bei hoher AG Delta-Betrachtung","warum":"Die AG trennt die Ursachen der metabolischen Azidose und deckt versteckte Mischstörungen auf.","q":["kraut-2013","berend-2017"]},{"text":"Laktat","warum":"Laktat zeigt Hypoperfusion an und erklärt einen Teil der hohen AG; der Verlauf hat prognostische Bedeutung.","q":["andersen-2013"]},{"text":"Elektrolyte (vor allem Kalium mit EKG), Glukose und Hb","warum":"Sie entscheiden oft über die nächste Therapie und müssen auf Plausibilität geprüft werden.","q":["erc-2021","allardet-2017"]}],"weiter":"r2"},{"id":"r2","typ":"wahl","frage":"Welche Angabe brauchst du, bevor du den ersten Schritt überhaupt bewerten kannst?","optionen":[{"id":"a","text":"FiO2 bzw. Sauerstofffluss, Atemunterstützung und Probenart (arteriell oder venös)","bewertung":"richtig","feedback":"Richtig. Ein pO2 von 80 mmHg ist unter Raumluft normal und unter FiO2 0,6 eine schwere Oxygenierungsstörung (Horovitz 133 mmHg). Bei venöser Probe ist der pO2 gar nicht verwertbar.","q":["msd-gas","berlin-2012"]},{"id":"b","text":"Das Albumin","bewertung":"falsch","feedback":"Albumin brauchst du erst für die Korrektur der Anionenlücke (Schritt 6), nicht für die Oxygenierung.","q":["kraut-2013"]},{"id":"c","text":"Das Körpergewicht","bewertung":"falsch","feedback":"Für das Lesen der BGA spielt das Gewicht keine Rolle; es wird z. B. für Beatmungsvolumina oder Dosierungen gebraucht."},{"id":"d","text":"Das Kreatinin","bewertung":"falsch","feedback":"Die Nierenfunktion hilft bei der Ursachensuche einer metabolischen Azidose oder Hyperkaliämie, nicht bei der Bewertung des pO2."}],"weiter":"r3"},{"id":"r3","typ":"ende","titel":"Systematik steht","text":"Die feste Reihenfolge verhindert, dass ein auffälliger Einzelwert den Blick auf den Rest verstellt.","lernpunkte":["Erst Rahmen (Probenart, FiO2, Atemunterstützung), dann Oxygenierung.","pH gibt die Richtung vor; pCO2 und HCO3⁻ werden daran gemessen.","Kompensation und Anionenlücke decken Mischstörungen auf, Laktat und Elektrolyte entscheiden oft über die nächste Maßnahme."]}]},{"titel":"Laktatazidose im kardiogenen Schock","start_knoten":"a1","knoten":[{"id":"a1","typ":"text","titel":"Ausgangslage","text":"Herr M., 64 J., Vorderwand-STEMI, PCI der LAD vor 3 h. Kardiogener Schock unter Noradrenalin und Dobutamin, spontan atmend, Sauerstoff über Maske, kalte Extremitäten. Keine Dauermedikation mit Metformin.\n**Arterielle BGA:** pH 7,26 | pCO2 23 mmHg | pO2 92 mmHg | HCO3⁻ 10 mmol/l | BE −15 mmol/l | Na⁺ 136 | K⁺ 4,8 | Cl⁻ 102 mmol/l | Laktat 9,0 mmol/l | Glukose 196 mg/dl | Hb 13,1 g/dl\n**Labor:** Albumin 36 g/l","weiter":"a2"},{"id":"a2","typ":"zahl","frage":"Primärstörung ist eine metabolische Azidose. Welchen pCO2 erwartest du bei angemessener respiratorischer Kompensation (Winter-Formel, Mittelwert)?","einheit":"mmHg","min":10,"max":50,"schritt":1,"start":40,"zielbereich":[21,25],"feedback_ok":"Richtig: 1,5 × 10 + 8 = 23 mmHg, mit Spielraum ±2 also 21 bis 25 mmHg. Der gemessene pCO2 von 23 mmHg liegt im erwarteten Bereich: Die Atmung kompensiert angemessen.","feedback_zu_niedrig":"Zu niedrig. Winter-Formel: erwarteter pCO2 = 1,5 × HCO3⁻ + 8 (±2), hier 1,5 × 10 + 8 = 23 mmHg.","feedback_zu_hoch":"Zu hoch. Bei metabolischer Azidose atmet der Körper CO2 ab, der pCO2 fällt unter 40 mmHg. Winter-Formel: 1,5 × 10 + 8 = 23 mmHg.","weiter":"a3"},{"id":"a3","typ":"wahl","frage":"Wie lautet deine Gesamtbewertung?","optionen":[{"id":"a","text":"Metabolische Azidose mit hoher Anionenlücke (AG 24, albuminkorrigiert 25 mmol/l), am ehesten Laktatazidose bei Hypoperfusion; respiratorisch angemessen kompensiert","bewertung":"richtig","feedback":"Richtig. AG = 136 − (102 + 10) = 24 mmol/l, Korrektur + 0,25 × (40 − 36) = + 1. Laktat 9,0 mmol/l erklärt den größten Teil. Delta: ΔAG = 25 − 12 = 13; HCO3⁻ + ΔAG = 23 mmol/l liegt im Normbereich, also keine zusätzliche metabolische Störung.","q":["msd-sb","kraut-2013","andersen-2013"]},{"id":"b","text":"Metabolische Azidose mit zusätzlicher respiratorischer Azidose","bewertung":"falsch","feedback":"Der pCO2 liegt mit 23 mmHg im erwarteten Bereich (21 bis 25). Eine zusätzliche respiratorische Azidose läge vor, wenn er darüber läge, z. B. bei Erschöpfung oder zunehmendem Lungenödem.","q":["msd-sb"]},{"id":"c","text":"Primär respiratorische Alkalose mit metabolischer Kompensation","bewertung":"falsch","feedback":"Der pH ist azidämisch. Die Primärstörung muss die pH-Richtung erklären; das tut hier das niedrige HCO3⁻, nicht der niedrige pCO2. Renale Kompensation bräuchte zudem Tage.","q":["msd-sb","hamm-2015"]},{"id":"d","text":"Metabolische Azidose mit normaler Anionenlücke","bewertung":"falsch","feedback":"Die AG beträgt 24 mmol/l (korrigiert 25) und ist damit klar erhöht. Eine normale AG würde an Bikarbonatverlust, z. B. Diarrhö, denken lassen.","q":["berend-2017"]}],"weiter":"a4"},{"id":"a4","typ":"mehrfach","frage":"Was gehört jetzt zum Vorgehen?","optionen":[{"text":"Die Ursache behandeln: Perfusion verbessern, Schocktherapie und Eskalation im Team nach Hausstandard","richtig":true,"feedback":"Eine Typ-A-Laktatazidose bessert sich nur, wenn die Gewebeperfusion besser wird."},{"text":"Laktat engmaschig kontrollieren und den Verlauf (Clearance) bewerten","richtig":true,"feedback":"Im kardiogenen Schock nach STEMI war eine Laktat-Clearance \u003c10 % mit schlechterem Überleben verbunden (Andersen 2013)."},{"text":"Den pCO2 als Warnsignal mitverfolgen: Steigt er über den erwarteten Bereich, erschöpft sich die Atemkompensation","richtig":true,"feedback":"Ein pCO2 über dem nach Winter erwarteten Wert bedeutet eine zusätzliche respiratorische Azidose, oft Vorbote der Erschöpfung."},{"text":"Typ-B-Ursachen mitdenken, z. B. Adrenalin als Katecholamin oder Metformin in der Medikation","richtig":true,"feedback":"Adrenalin (β2-Stimulation) und Metformin können Laktat unabhängig von der Perfusion erhöhen; das verändert die Deutung des Verlaufs."},{"text":"Natriumbicarbonat geben, bis der pH normal ist","richtig":false,"feedback":"Bei Azidose mit hoher AG ist Bikarbonat umstritten und senkt die Sterblichkeit nicht sicher; erwogen wird es allenfalls bei pH \u003c7,00. Nach Behebung der Ursache droht eine überschießende Alkalose."},{"text":"Laktatproben sammeln, auf Eis lagern und gemeinsam nach einer Stunde messen","richtig":false,"feedback":"Laktat steigt in der Probe weiter an. Messen innerhalb von 15 bis 30 min, sonst sind die Werte falsch hoch."}],"weiter":"a5"},{"id":"a5","typ":"ende","titel":"Laktatazidose eingeordnet","text":"Herr M. hat eine metabolische Azidose mit hoher Anionenlücke durch Laktat bei Hypoperfusion, angemessen respiratorisch kompensiert. Therapieziel ist die Perfusion, der Laktatverlauf dient als Verlaufsparameter.","lernpunkte":["Winter-Formel: erwarteter pCO2 = 1,5 × HCO3⁻ + 8 (±2) mmHg.","AG immer albuminkorrigiert berechnen; Delta-Betrachtung: HCO3⁻ + ΔAG im Normbereich spricht gegen eine zweite metabolische Störung.","Typ-A-Laktatazidose: Ursache ist die Hypoperfusion, behandelt wird die Perfusion, nicht der pH.","Steigt der pCO2 über den erwarteten Wert, erschöpft sich die Kompensation."]}]},{"titel":"Lungenödem unter NIV","start_knoten":"n1","knoten":[{"id":"n1","typ":"text","titel":"Ausgangslage","text":"Frau K., 78 J., hypertensive Entgleisung mit akutem kardialem Lungenödem. Keine bekannte Lungenerkrankung. Seit 30 min NIV mit FiO2 0,5, dazu Nitrat und Schleifendiuretikum. Sie ist wach und kooperativ, die Atemfrequenz geht zurück.\n**BGA vor NIV:** pH 7,18 | pCO2 75 mmHg | HCO3⁻ 27 mmol/l\n**Arterielle BGA jetzt:** pH 7,23 | pCO2 64 mmHg | pO2 68 mmHg | HCO3⁻ 26 mmol/l | BE −1 mmol/l | K⁺ 4,1 mmol/l | Laktat 1,9 mmol/l","weiter":"n2"},{"id":"n2","typ":"zahl","frage":"Berechne den aktuellen Horovitz-Quotienten.","einheit":"mmHg","min":0,"max":500,"schritt":1,"start":250,"zielbereich":[135,137],"feedback_ok":"Richtig: 68 mmHg / 0,5 = 136 mmHg. Das ist eine deutliche Oxygenierungsstörung; mit normalem pO2 unter Raumluft lägen rechnerisch etwa 350 bis 480 mmHg vor. Die ARDS-Stufen der Berlin-Definition passen hier nicht, weil ein kardiales Lungenödem vorliegt. Der Wert eignet sich als Verlaufsparameter unter NIV.","feedback_zu_niedrig":"Zu niedrig. Geteilt wird der pO2 durch die FiO2 als Bruch (0,5), nicht durch Prozent und nicht multipliziert: 68 / 0,5 = 136 mmHg.","feedback_zu_hoch":"Zu hoch. Hast du mit Raumluft (0,21) gerechnet? Frau K. erhält FiO2 0,5: 68 / 0,5 = 136 mmHg.","weiter":"n3"},{"id":"n3","typ":"wahl","frage":"Wie ordnest du die Säure-Basen-Störung ein?","optionen":[{"id":"a","text":"Akute respiratorische Azidose ohne relevante metabolische Kompensation","bewertung":"richtig","feedback":"Richtig. Akut steigt das HCO3⁻ nur um etwa 1 (bis 2) mmol/l je 10 mmHg pCO2-Anstieg: erwartet etwa 26 bis 29 mmol/l, gemessen 26. Der BE ist normal. Chronisch wären etwa 31 bis 34 mmol/l zu erwarten.","q":["msd-sb","sood-2010","higgins-2017"]},{"id":"b","text":"Chronische, metabolisch kompensierte respiratorische Azidose","bewertung":"falsch","feedback":"Bei chronischer Hyperkapnie steigt das HCO3⁻ um 3 bis 4 mmol/l je 10 mmHg, hier also auf etwa 31 bis 34 mmol/l, und der BE wird positiv. Beides fehlt.","q":["msd-sb"]},{"id":"c","text":"Metabolische Azidose","bewertung":"falsch","feedback":"HCO3⁻ und BE sind normal, Laktat liegt unter 2 mmol/l. Der niedrige pH erklärt sich vollständig durch den hohen pCO2.","q":["higgins-2017"]},{"id":"d","text":"Kombinierte respiratorische und metabolische Azidose","bewertung":"falsch","feedback":"Für eine metabolische Komponente müssten HCO3⁻ und BE erniedrigt sein. Bei HCO3⁻ 26 mmol/l und BE −1 ist das nicht der Fall.","q":["higgins-2017"]}],"erklaerung":"Normales HCO3⁻ bei hohem pCO2 spricht für eine akute Hyperkapnie, erhöhtes HCO3⁻ mit positivem BE für eine chronische.","weiter":"n4"},{"id":"n4","typ":"wahl","frage":"Wie geht es weiter?","optionen":[{"id":"a","text":"NIV fortführen und optimieren (Maskensitz, Leckage, Einstellung nach Hausstandard), Lungenödem weiter behandeln, Kontroll-BGA nach 1 bis 2 h, Intubationsbereitschaft","bewertung":"richtig","feedback":"Richtig. pH steigt, pCO2 fällt, Frau K. ist wach: Zeichen des Ansprechens. Nach S2k-Leitlinie zeigen sich Responder nach 1 bis 2 h, ein pH-Anstieg in den ersten 4 h ist ein wichtiger Erfolgsmarker.","q":["s2k-niv-2023"]},{"id":"b","text":"Sofort intubieren, weil der pH noch unter 7,25 liegt","bewertung":"falsch","feedback":"Entscheidend ist der Verlauf unter NIV, nicht ein einzelner pH-Wert. Intubiert wird bei NIV-Versagen (keine Besserung, Verschlechterung, neue Kontraindikation); als relative Kontraindikation nennt die Leitlinie erst eine Azidose mit pH \u003c7,1.","q":["s2k-niv-2023"]},{"id":"c","text":"NIV beenden und auf High-Flow-Sauerstoff umstellen, weil die Hyperkapnie rückläufig ist","bewertung":"falsch","feedback":"Beim kardialen Lungenödem sind CPAP oder NIV früh einzusetzen; High-Flow wird als primäre Therapie hier nicht empfohlen. Die Hyperkapnie ist noch deutlich.","q":["s2k-niv-2023"]},{"id":"d","text":"Natriumbicarbonat zur Anhebung des pH geben","bewertung":"falsch","feedback":"Eine respiratorische Azidose wird durch Ventilation behoben. Bikarbonat ist hier fast immer kontraindiziert und erhöht die CO2-Last.","q":["msd-resp-azidose"]}],"weiter":"n5"},{"id":"n5","typ":"ende","titel":"Hyperkapnie unter NIV eingeordnet","text":"Frau K. hat eine akute respiratorische Azidose bei kardialem Lungenödem und eine deutliche Oxygenierungsstörung. Unter NIV bessern sich pH und pCO2.","lernpunkte":["Horovitz = PaO2 / FiO2 als Bruch: 68 / 0,5 = 136 mmHg. Ohne FiO2 kein Horovitz.","Akut: HCO3⁻ steigt nur etwa 1 bis 2 mmol/l je 10 mmHg pCO2; chronisch 3 bis 4 mmol/l.","Beim kardialen Lungenödem früh CPAP oder NIV; Erfolg am Anstieg des pH und Abfall des pCO2 in den ersten Stunden messen.","Respiratorische Azidose: Ventilation verbessern, kein Bikarbonat."]}]},{"titel":"Alkalose unter Schleifendiuretika","start_knoten":"d1","knoten":[{"id":"d1","typ":"text","titel":"Ausgangslage","text":"Herr B., 72 J., HFrEF (LVEF 25 %), Aufnahme mit kardialer Dekompensation. Tag 5 unter hoch dosiertem Furosemid i.v., Gewicht −9 kg, noch Unterschenkelödeme. Er klagt über Schwäche und Wadenkrämpfe.\n**Arterielle BGA unter Raumluft:** pH 7,50 | pCO2 48 mmHg | pO2 74 mmHg | HCO3⁻ 36 mmol/l | BE +12 mmol/l | Na⁺ 133 | K⁺ 2,9 | Cl⁻ 88 mmol/l | ionisiertes Ca 1,08 mmol/l | Laktat 1,1 mmol/l | Glukose 118 mg/dl | Hb 14,6 g/dl","weiter":"d2"},{"id":"d2","typ":"wahl","frage":"Primärstörung ist eine metabolische Alkalose. Ist der pCO2 von 48 mmHg Ausdruck einer zusätzlichen respiratorischen Azidose?","optionen":[{"id":"a","text":"Nein. Er entspricht der erwarteten respiratorischen Kompensation.","bewertung":"richtig","feedback":"Richtig. Der pCO2 steigt um etwa 0,6 bis 0,75 mmHg je 1 mmol/l HCO3⁻-Anstieg: bei +12 mmol/l also auf etwa 47 bis 49 mmHg (Sood: 0,7 × 36 + 21 = 46 ±2). 48 mmHg passt dazu.","q":["msd-sb","sood-2010"]},{"id":"b","text":"Ja. Ein pCO2 über 45 mmHg ist definitionsgemäß eine respiratorische Azidose.","bewertung":"falsch","feedback":"Ob ein erhöhter pCO2 Primärstörung oder Kompensation ist, entscheidet die pH-Richtung. Bei Alkalämie erklärt der hohe pCO2 den pH nicht; er ist die Gegenregulation.","q":["msd-sb"]},{"id":"c","text":"Ja. Das Lungenödem führt zur Hypoventilation.","bewertung":"falsch","feedback":"Der pCO2 liegt im erwarteten Kompensationsbereich, und der pH ist alkalämisch. Eine Hypoventilation als Primärstörung würde eine Azidämie verursachen.","q":["msd-sb"]},{"id":"d","text":"Nein, aber nur, weil der pCO2 kompensatorisch eigentlich sinken müsste.","bewertung":"falsch","feedback":"Bei metabolischer Alkalose steigt der pCO2 kompensatorisch durch Hypoventilation; er sinkt nicht.","q":["hamm-2015"]}],"weiter":"d3"},{"id":"d3","typ":"mehrfach","frage":"Welche Mechanismen erzeugen und unterhalten die Alkalose bei Herrn B.?","optionen":[{"text":"Chlorid- und Volumenverlust über die Niere durch Hemmung von NKCC2 in der Henle-Schleife","richtig":true,"feedback":"Die Hypochlorämie (Cl⁻ 88 mmol/l) ist typisch und hält die Alkalose aufrecht."},{"text":"Sekundärer Hyperaldosteronismus mit vermehrter distaler H⁺- und K⁺-Sekretion","richtig":true,"feedback":"Hohe distale Natriumzufuhr plus Aldosteron beschleunigt die Sekretion von H⁺ und K⁺."},{"text":"Hypokaliämie: H⁺ wandert in die Zellen, die Niere rückresorbiert mehr Bikarbonat","richtig":true,"feedback":"Hypokaliämie und Alkalose verstärken sich gegenseitig."},{"text":"Bikarbonatverlust über den Urin","richtig":false,"feedback":"Bikarbonatverlust führt zur Azidose, nicht zur Alkalose. Bei der Diuretika-Alkalose wird Bikarbonat zurückgehalten."},{"text":"Laktatbildung durch Hypoperfusion","richtig":false,"feedback":"Laktat ist mit 1,1 mmol/l normal und würde ohnehin eine Azidose verursachen."},{"text":"Kompensatorische Hyperventilation","richtig":false,"feedback":"Die respiratorische Gegenregulation einer metabolischen Alkalose ist eine Hypoventilation, erkennbar am pCO2 von 48 mmHg."}],"weiter":"d4"},{"id":"d4","typ":"wahl","frage":"Wie gehst du vor?","optionen":[{"id":"a","text":"Kalium als Kaliumchlorid und Magnesium nach Hausstandard ersetzen, Diuretikastrategie im Team überprüfen (z. B. Mineralokortikoid-Rezeptor-Antagonist, Acetazolamid erwägen), EKG, Kalium und BGA engmaschig kontrollieren","bewertung":"richtig","feedback":"Richtig. Kaliumchlorid ersetzt Kalium und Chlorid zugleich. Muss weiter entwässert werden, helfen kaliumsparende Diuretika oder Acetazolamid; Acetazolamid steigert aber den Kaliumverlust und verlangt konsequenten Kaliumersatz. K⁺ 2,9 mmol/l ist eine mittelgradige Hypokaliämie: EKG auf U-Wellen, T-Abflachung und Arrhythmien.","q":["emmett-2020","msd-alkalose","erc-2021"]},{"id":"b","text":"Großzügig NaCl 0,9 % infundieren, um Chlorid und Volumen zu ersetzen","bewertung":"falsch","feedback":"Kochsalz behebt eine chloridsensible Alkalose bei Volumenmangel. Herr B. ist aber noch überwässert; eine Volumengabe widerspricht der Dekongestion. Chlorid kommt hier besser als Kaliumchlorid.","q":["emmett-2020","msd-alkalose"]},{"id":"c","text":"Furosemid pausieren, bis der pH normal ist, sonst nichts","bewertung":"akzeptabel","feedback":"Eine Pause oder Dosisreduktion kann Teil der Lösung sein. Allein behebt sie aber weder den Kaliummangel noch die verbliebene Stauung; ohne Kaliumersatz und Plan zur weiteren Dekongestion bleibt sie unvollständig.","q":["emmett-2020"]},{"id":"d","text":"Salzsäure (HCl) über einen ZVK","bewertung":"falsch","feedback":"HCl ist schweren Fällen vorbehalten (pH über 7,6 bei Nierenversagen, wenn keine Dialyse möglich ist).","q":["msd-alkalose"]}],"weiter":"d5"},{"id":"d5","typ":"ende","titel":"Diuretika-Alkalose verstanden","text":"Herr B. hat eine metabolische Alkalose mit Hypochlorämie und Hypokaliämie unter Schleifendiuretika, respiratorisch angemessen kompensiert. Die Alkalämie erklärt auch das erniedrigte ionisierte Calcium.","lernpunkte":["Metabolische Alkalose: pCO2 steigt kompensatorisch um etwa 0,7 mmHg je 1 mmol/l HCO3⁻; ein pCO2 über 45 mmHg ist dann keine Hypoventilationsstörung.","Schleifendiuretika: Chlorid- und Volumenverlust, sekundärer Hyperaldosteronismus und Hypokaliämie erzeugen und unterhalten die Alkalose.","Kalium als Kaliumchlorid ersetzen, Magnesium mitdenken; bei weiterem Entwässerungsbedarf kaliumsparende Diuretika oder Acetazolamid erwägen.","Alkalämie senkt das ionisierte Calcium; Hypokaliämie: EKG kontrollieren."]}]},{"titel":"Hyperkaliämie bei Niereninsuffizienz","start_knoten":"h1","knoten":[{"id":"h1","typ":"text","titel":"Ausgangslage","text":"Frau L., 81 J., HFrEF unter Ramipril, Spironolacton und Bisoprolol, CKD G4. Seit 3 Tagen Durchfall, jetzt schwach und schwindelig.\n**Arterielle BGA:** pH 7,29 | pCO2 30 mmHg | HCO3⁻ 14 mmol/l | BE −11 mmol/l | Na⁺ 134 | **K⁺ 6,9** | Cl⁻ 108 mmol/l | Laktat 1,3 mmol/l | Glukose 104 mg/dl | Hb 10,4 g/dl\n**EKG:** Sinusbradykardie 46/min, PR 240 ms, hohe spitze T-Wellen, QRS 124 ms.\nAnionenlücke: 134 − (108 + 14) = 12 mmol/l.","weiter":"h2"},{"id":"h2","typ":"wahl","frage":"Wie gehst du mit dem Kaliumwert um?","optionen":[{"id":"a","text":"Als echt behandeln: sofort Therapie beginnen, Monitor, parallel Labor-Kalium zur Bestätigung","bewertung":"richtig","feedback":"Richtig. Schwere Hyperkaliämie (≥6,5 mmol/l) mit EKG-Veränderungen, dazu CKD und zwei kaliumsteigernde Medikamente: Die Konstellation ist stimmig. Das EKG steuert die Dringlichkeit.","q":["erc-2021"]},{"id":"b","text":"Erst den Laborwert abwarten, das BGA-Kalium ist ungenau","bewertung":"falsch","feedback":"BGA- und Laborkalium stimmen im Mittel gut überein (Abweichung um 0,2 mmol/l). Bei EKG-Veränderungen kostet Abwarten Zeit, die Frau L. nicht hat.","q":["allardet-2017","erc-2021"]},{"id":"c","text":"Pseudohyperkaliämie annehmen und die Probe verwerfen","bewertung":"falsch","feedback":"An eine Pseudohyperkaliämie denkt man bei normaler Nierenfunktion, normalem EKG oder hämatologischer Erkrankung. Hier trifft nichts davon zu.","q":["erc-2021","smellie-2007"]}],"weiter":"h3"},{"id":"h3","typ":"mehrfach","frage":"Welche EKG-Befunde passen zur Hyperkaliämie?","optionen":[{"text":"Hohe, spitze T-Wellen","richtig":true,"feedback":"Klassisches Zeichen; nach ERC ist die T-Welle in mehr als einer Ableitung höher als die R-Zacke."},{"text":"PR-Verlängerung, abgeflachte oder fehlende P-Wellen","richtig":true,"feedback":"Die Leitung im Vorhof und AV-Knoten verlangsamt sich."},{"text":"QRS-Verbreiterung","richtig":true,"feedback":"QRS >0,12 s ist ein Alarmzeichen; bis zum Sinuswellenmuster und Kreislaufstillstand möglich."},{"text":"Bradykardie","richtig":true,"feedback":"Bradykardie gehört zu den Hyperkaliämie-Zeichen, hier möglicherweise durch Bisoprolol verstärkt."},{"text":"Ausgeprägte U-Wellen","richtig":false,"feedback":"U-Wellen sind ein Zeichen der Hypokaliämie."},{"text":"Ein normales EKG schließt eine schwere Hyperkaliämie aus","richtig":false,"feedback":"Falsch. Auch bei schwerer Hyperkaliämie kann das EKG unauffällig sein."}],"weiter":"h4"},{"id":"h4","typ":"zuordnen","frage":"Ordne die Maßnahmen ihrem Wirkprinzip zu.","kategorien":[{"id":"schutz","name":"Herz schützen"},{"id":"shift","name":"Kalium nach intrazellulär verschieben"},{"id":"elim","name":"Kalium entfernen"},{"id":"ursache","name":"Ursache und Nachschub stoppen"}],"eintraege":[{"text":"Calcium i.v. (Calciumchlorid oder Calciumgluconat), danach EKG wiederholen","kategorie":"schutz","warum":"Stabilisiert rasch die Membran, senkt das Kalium aber nicht. Indiziert bei schwerer Hyperkaliämie mit EKG-Veränderungen."},{"text":"10 IE Altinsulin mit 25 g Glukose i.v., Blutzucker engmaschig kontrollieren","kategorie":"shift","warum":"Verschiebt Kalium in die Zellen. Hypoglykämien sind häufig (laut ERC bis 28 %); bei niedrigem Ausgangs-BZ zusätzlich Glukoseinfusion."},{"text":"Salbutamol vernebelt, zusätzlich zu Insulin-Glukose","kategorie":"shift","warum":"Wirkt additiv, aber nicht allein einsetzen; unter Betablocker und bei terminaler Niereninsuffizienz oft unwirksam."},{"text":"Hämodialyse","kategorie":"elim","warum":"Bei lebensbedrohlicher Hyperkaliämie, fehlendem Ansprechen, terminaler Niereninsuffizienz oder oligurischem Nierenversagen."},{"text":"Spironolacton und Ramipril pausieren","kategorie":"ursache","warum":"Mineralokortikoid-Rezeptor-Antagonisten und ACE-Hemmer sind typische Auslöser, vor allem bei CKD und in Kombination."},{"text":"Kaliumhaltige Infusionen und Zusätze stoppen","kategorie":"ursache","warum":"Jede weitere Kaliumzufuhr verschärft die Lage, besonders bei eingeschränkter Ausscheidung."}],"weiter":"h5"},{"id":"h5","typ":"ende","titel":"Hyperkaliämie behandelt","text":"Frau L. hat eine schwere Hyperkaliämie mit EKG-Veränderungen bei CKD, RAAS-Hemmung und Durchfall, dazu eine metabolische Azidose mit normaler Anionenlücke (angemessen kompensiert: erwarteter pCO2 1,5 × 14 + 8 = 29 ±2 mmHg).","lernpunkte":["Hyperkaliämie >5,5 mmol/l, schwer ab 6,5 mmol/l (ERC 2021). EKG-Veränderungen machen sie zum Notfall.","Reihenfolge: Herz schützen (Calcium), verschieben (Insulin-Glukose, Salbutamol), entfernen (Dialyse), Ursache stoppen.","Normale-AG-Azidose mit Hyperkaliämie: an Durchfall und Hypoaldosteronismus denken (ACE-Hemmer, Spironolacton, CKD).","Pseudohyperkaliämie nur bei passender Konstellation; bei verändertem EKG verzögert die Bestätigung die Therapie nicht."]}]},{"titel":"Normaler pH, zwei Störungen","start_knoten":"m1","knoten":[{"id":"m1","typ":"text","titel":"Ausgangslage","text":"Herr T., 74 J., HFrEF, seit einer Woche hoch dosiert Furosemid. Jetzt Low-Output mit kalten Extremitäten und Oligurie, Kreatinin von 1,4 auf 2,6 mg/dl gestiegen.\n**Arterielle BGA unter 2 l/min O2:** pH 7,36 | pCO2 40 mmHg | pO2 81 mmHg | HCO3⁻ 22 mmol/l | BE −3 mmol/l | Na⁺ 139 | K⁺ 3,4 | Cl⁻ 93 mmol/l | Laktat 8,1 mmol/l | Glukose 132 mg/dl | Hb 11,2 g/dl\n**Labor:** Albumin 28 g/l","weiter":"m2"},{"id":"m2","typ":"zahl","frage":"Berechne die albuminkorrigierte Anionenlücke (ohne Kalium, Bezugswert Albumin 40 g/l).","einheit":"mmol/l","min":0,"max":50,"schritt":0.5,"start":12,"zielbereich":[26.5,27.5],"feedback_ok":"Richtig: AG = 139 − (93 + 22) = 24 mmol/l. Korrektur: + 0,25 × (40 − 28) = + 3. Korrigierte AG = 27 mmol/l, deutlich erhöht.","feedback_zu_niedrig":"Zu niedrig. Hast du die Albumin-Korrektur vergessen? Ohne Korrektur ergeben sich 24 mmol/l; bei Albumin 28 g/l kommen 0,25 × (40 − 28) = 3 mmol/l hinzu.","feedback_zu_hoch":"Zu hoch. Hast du Kalium mitgerechnet (die Richtwerte gelten meist ohne Kalium) oder die Korrektur doppelt angewendet? 139 − (93 + 22) = 24, plus 3 = 27 mmol/l.","weiter":"m3"},{"id":"m3","typ":"wahl","frage":"Wie lautet die Säure-Basen-Diagnose?","optionen":[{"id":"a","text":"Normalbefund, da pH, pCO2 und HCO3⁻ im Normbereich liegen","bewertung":"falsch","feedback":"Eine korrigierte AG von 27 mmol/l und ein Laktat von 8,1 mmol/l sind nie normal. Der normale pH ist das Nettoergebnis zweier gegenläufiger Störungen.","q":["msd-sb"]},{"id":"b","text":"Metabolische Azidose mit hoher AG, sonst nichts","bewertung":"falsch","feedback":"Bei ΔAG = 27 − 12 = 15 mmol/l wäre das HCO3⁻ ohne weitere Störung auf etwa 24 − 15 = 9 mmol/l gefallen, selbst bei einem Verhältnis ΔAG/ΔHCO3⁻ von 1,5 noch auf etwa 14 mmol/l. Gemessen sind 22 mmol/l: Es muss zusätzlich Bikarbonat entstanden sein.","q":["msd-sb","kraut-2013"]},{"id":"c","text":"Metabolische Azidose mit hoher AG (Laktat, Nierenversagen) plus metabolische Alkalose (Schleifendiuretika, Hypochlorämie); respiratorisch passend","bewertung":"richtig","feedback":"Richtig. HCO3⁻ + ΔAG = 22 + 15 = 37 mmol/l liegt weit über dem Normbereich: zusätzliche metabolische Alkalose. Das niedrige Chlorid und Kalium passen zur Diuretikatherapie. Der pCO2 von 40 mmHg entspricht dem nach Winter erwarteten Wert (1,5 × 22 + 8 = 41 ±2).","q":["msd-sb","kraut-2013","emmett-2020"]},{"id":"d","text":"Respiratorische Alkalose mit metabolischer Kompensation","bewertung":"falsch","feedback":"Der pCO2 ist mit 40 mmHg normal; eine respiratorische Alkalose setzt einen erniedrigten pCO2 voraus.","q":["msd-resp-alkalose"]}],"weiter":"m4"},{"id":"m4","typ":"mehrfach","frage":"Welche Schlüsse sind richtig?","optionen":[{"text":"Ein normaler pH schließt eine schwere Störung nicht aus: Laktat 8,1 mmol/l zeigt eine relevante Hypoperfusion","richtig":true,"feedback":"Der pH täuscht hier; Laktat und AG zeigen den Ernst der Lage."},{"text":"Ohne Albumin-Korrektur wäre die AG um 3 mmol/l unterschätzt worden","richtig":true,"feedback":"Bei Albumin 28 g/l fehlen 0,25 × 12 = 3 mmol/l; bei Intensivpatient:innen ist Hypalbuminämie häufig."},{"text":"Das niedrige Chlorid passt zur Diuretika-Alkalose","richtig":true,"feedback":"Chloridverlust ist ein zentraler Mechanismus der Diuretika-Alkalose."},{"text":"Weil der pH normal ist, genügt die nächste Routine-BGA","richtig":false,"feedback":"Der Laktatverlauf ist im Low-Output entscheidend und gehört engmaschig kontrolliert."},{"text":"Ein HCO3⁻ von 22 mmol/l beweist, dass keine Azidose vorliegt","richtig":false,"feedback":"Die Alkalose hebt das HCO3⁻ an und maskiert die Azidose; erst die AG deckt sie auf."},{"text":"Das Verhältnis ΔAG/ΔHCO3⁻ ist bei Laktatazidose immer genau 1","richtig":false,"feedback":"Es schwankt; bei Laktatazidose liegt es im Mittel um 1,5. Deshalb ist die Delta-Betrachtung ein Hinweis, kein Beweis."}],"weiter":"m5"},{"id":"m5","typ":"ende","titel":"Mischstörung aufgedeckt","text":"Herr T. hat eine Laktatazidose mit hoher Anionenlücke bei Low-Output und Nierenversagen, maskiert durch eine Diuretika-Alkalose. Der pH ist normal, die Lage ist ernst.","lernpunkte":["Hohe Anionenlücke bei normalem HCO3⁻: Azidose plus Alkalose.","AG immer albuminkorrigiert: AG + 0,25 × (40 − Albumin in g/l).","HCO3⁻ + ΔAG deutlich über dem Normbereich spricht für eine zusätzliche metabolische Alkalose.","Normaler pH ist kein Normalbefund: Laktat und AG gehören in jede Bewertung."]}]},{"titel":"Plötzlicher Hb-Abfall aus dem arteriellen Zugang","start_knoten":"v1","knoten":[{"id":"v1","typ":"text","titel":"Ausgangslage","text":"Herr S., 70 J., IMC wegen kardialer Dekompensation, radialer arterieller Zugang mit Spülsystem (NaCl 0,9 %). Klinisch stabil, RR 128/70 mmHg, HF 76/min, keine Blutungszeichen. Die neue Probe wurde aus dem Zugang direkt nach dem Spülen abgenommen.\n**Vor 2 h:** pH 7,39 | pCO2 41 | pO2 84 mmHg | HCO3⁻ 24 | BE 0 | Na⁺ 137 | K⁺ 4,2 | Cl⁻ 103 mmol/l | Glukose 140 mg/dl | Laktat 1,4 mmol/l | Hb 11,8 g/dl\n**Jetzt:** pH 7,39 | pCO2 31 | pO2 88 mmHg | HCO3⁻ 18 | BE −6 | Na⁺ 141 | K⁺ 3,2 | Cl⁻ 116 mmol/l | Glukose 105 mg/dl | Laktat 1,0 mmol/l | Hb 8,9 g/dl","weiter":"v2"},{"id":"v2","typ":"mehrfach","frage":"Welche Befunde sprechen für eine Verdünnung der Probe mit Spüllösung?","optionen":[{"text":"Hb, Kalium, Glukose und Laktat sind alle um etwa ein Viertel niedriger","richtig":true,"feedback":"Ein gleichmäßiger Abfall voneinander unabhängiger Werte innerhalb von 2 h ist physiologisch kaum zu erklären, passt aber zu etwa 25 % Spüllösung in der Probe."},{"text":"Chlorid steigt, HCO3⁻ und pCO2 fallen, der pH bleibt fast gleich","richtig":true,"feedback":"NaCl 0,9 % enthält 154 mmol/l Chlorid, aber kein Bikarbonat und kaum CO2. Beide werden etwa im gleichen Verhältnis verdünnt, deshalb ändert sich der pH kaum."},{"text":"Die Klinik ist unverändert stabil, und die Probe wurde direkt nach dem Spülen gezogen","richtig":true,"feedback":"Klinik und Abnahmetechnik passen zur Verdünnung, nicht zu einer Blutung."},{"text":"Der BE von −6 mmol/l zeigt eine neue metabolische Azidose","richtig":false,"feedback":"Der BE sinkt, weil Bikarbonat verdünnt wurde. Bei unverändertem pH und stabiler Klinik ist das kein Hinweis auf eine echte Azidose."},{"text":"Der Hb-Abfall um 2,9 g/dl beweist eine Blutung","richtig":false,"feedback":"Ein isolierter Wert aus einer fraglichen Probe beweist nichts. Erst korrekt wiederholen, dabei Klinik und Kreislauf im Blick behalten."}],"weiter":"v3"},{"id":"v3","typ":"wahl","frage":"Wie gehst du vor?","optionen":[{"id":"a","text":"Probe korrekt wiederholen: ausreichend Blut verwerfen (Hausstandard), luftfrei, zügig messen. Bis dahin keine Therapie auf Grundlage dieser Werte, Kreislauf und Klinik weiter beobachten","bewertung":"richtig","feedback":"Richtig. Die Kontrolle klärt die Frage in Minuten. Kontrolle heißt nicht abwarten: Bei Blutungszeichen würdest du sofort eskalieren.","q":["baird-2013","waikato-be","allardet-2017"]},{"id":"b","text":"Kalium substituieren und zwei Erythrozytenkonzentrate anfordern","bewertung":"falsch","feedback":"Kalium auf einen verdünnten Wert hin zu geben, kann eine Hyperkaliämie erzeugen; eine Transfusion ohne gesicherten Wert ist nicht begründet.","q":["baird-2013"]},{"id":"c","text":"Natriumbicarbonat wegen des Basendefizits","bewertung":"falsch","feedback":"Das Basendefizit ist ein Verdünnungsartefakt. Der pH ist unverändert normal.","q":["baird-2013"]},{"id":"d","text":"Die Werte als Fehler abhaken, keine Kontrolle","bewertung":"falsch","feedback":"Ein auffälliger Wert wird nicht einfach verworfen; eine echte Blutung muss sicher ausgeschlossen werden."}],"weiter":"v4"},{"id":"v4","typ":"text","titel":"Kontroll-BGA","text":"Korrekt abgenommen, ausreichend verworfen: pH 7,40 | pCO2 40 | HCO3⁻ 24 | Na⁺ 137 | K⁺ 4,1 | Cl⁻ 103 mmol/l | Glukose 136 mg/dl | Laktat 1,3 mmol/l | Hb 11,7 g/dl. Die Werte entsprechen dem Vorbefund.","weiter":"v5"},{"id":"v5","typ":"ende","titel":"Verdünnung erkannt","text":"Die auffälligen Werte entstanden durch Spüllösung in der Probe. Eine Therapie auf ihrer Grundlage hätte geschadet.","lernpunkte":["Verdünnungsmuster: viele Werte gleichsinnig um denselben Anteil niedriger; bei NaCl zusätzlich Chlorid hoch, HCO3⁻ und pCO2 niedrig, pH kaum verändert.","Scheinbarer Hb-Abfall und scheinbare hyperchlorämische Azidose: erst die Probe prüfen.","Abnahme aus dem arteriellen Zugang: ausreichend verwerfen (Hausstandard; Beispiel eines Laborleitfadens: mindestens 3 ml), luftfrei, zügig messen.","Kontrolle heißt nicht abwarten: Bei Blutungszeichen sofort handeln."]}]},{"titel":"Venös statt arteriell und ein hohes Kalium","start_knoten":"p1","knoten":[{"id":"p1","typ":"text","titel":"Ausgangslage","text":"Frau D., 59 J., IMC zur Überwachung nach Synkope. Wach, Atemfrequenz 14/min, SpO2 97 % unter Raumluft, Kreatinin 0,8 mg/dl, 12-Kanal-EKG unauffällig. Zwei Radialispunktionen misslingen, der dritte Versuch in der Leiste ergibt dunkles, nicht pulsierendes Blut bei zäher Aspiration. Die Spritze wird auf Eis gelegt und nach 25 min gemessen.\n**BGA:** pH 7,37 | pCO2 47 mmHg | pO2 36 mmHg | SO2 68 % | HCO3⁻ 26 mmol/l | Na⁺ 139 | **K⁺ 6,1** | Cl⁻ 102 mmol/l | Laktat 2,3 mmol/l | Glukose 92 mg/dl","weiter":"p2"},{"id":"p2","typ":"wahl","frage":
