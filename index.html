o2":91,"af":22},"rhythmus":"vt","kurz":"Er ist wach, grau im Gesicht und klagt über Druck auf der Brust und Schwindel.","prioritaet":1,"begruendung":"Anhaltende VT mit Hypotonie, Brustschmerz und Schwindel: Es liegen Instabilitätszeichen vor (Schock, Myokardischämie). Das ist eine unmittelbare Lebensbedrohung im Bereich Circulation und erfordert eine synchronisierte Kardioversion; wird er pulslos, beginnt die Reanimation. Sofort Hilfe rufen, Defibrillator und Notfallwagen holen lassen, Analgosedierung vorbereiten."},{"id":"Bett 3","patient":"Frau B., 82 J., dekompensierte Herzinsuffizienz, Tag 2 unter i.v.-Diuretikum","alarm":"SpO2 niedrig","vitals":{"hf":108,"sys":152,"dia":88,"spo2":88,"af":28},"rhythmus":"sinus_tachy","kurz":"Die SpO2 ist seit zwei Stunden von 95 auf 88 % gefallen, der Alarm wurde schon zweimal quittiert; sie sitzt aufrecht und spricht nur noch in kurzen Sätzen.","prioritaet":2,"begruendung":"Kein roter Alarm, aber ein klarer Trend: fallende SpO2, Tachypnoe (28/min), Tachykardie und Sprechdyspnoe sprechen für ein Lungenödem mit drohender respiratorischer Erschöpfung (Airway/Breathing). Wer nur den Momentwert sieht, unterschätzt sie. Sofort Oberkörper hoch, Sauerstoff, Diuretikum, Blutgasanalyse, NIV erwägen; die Pflegekraft kann die ersten Schritte übernehmen, während du bei Bett 2 bist."},{"id":"Bett 4","patient":"Herr R., 66 J., Tag 2 nach elektiver PCI der RCA","alarm":"Asystolie","vitals":{"hf":0,"sys":128,"dia":74,"spo2":97,"af":14},"rhythmus":"asystolie","kurz":"Die Pleth-Kurve läuft regelmäßig mit einem Puls von 62/min weiter, nur die EKG-Linie ist flach; er hat sich vor einer Stunde auf die Seite gedreht und schläft. Der Blutdruck von vor 20 Minuten war unauffällig.","prioritaet":3,"begruendung":"Der Alarm „Asystolie“ ist lebensbedrohlich, wenn er stimmt. Hier widersprechen ihm eine regelmäßige Pleth-Kurve mit Pulsfrequenz, eine normale SpO2 und der letzte Blutdruck; sehr wahrscheinlich ist eine Elektrode abgelöst. Trotzdem wird er nie ungeprüft quittiert: direkt nach den instabilen Betten in Sekunden ansprechen, Puls tasten, Elektroden prüfen und erneuern. Fehlt der Puls, ist es eine Reanimation."}],"debriefing":["Reihenfolge nach ABCDE und Zeitkritikalität: instabile Tachyarrhythmie, dann schleichende respiratorische Verschlechterung, dann Artefaktverdacht, dann erklärbare Belastungsreaktion.","Der lauteste Alarm ist nicht der gefährlichste. Bett 3 hatte nur einen gelben Alarm, aber einen Trend über zwei Stunden. Verläufe lesen, nicht nur Momentwerte.","Priorität heißt nicht, alles allein zu tun: Bei Bett 2 sofort Hilfe und Defibrillator anfordern, bei Bett 3 die Pflegekraft mit Oberkörperhochlagerung und Sauerstoff beginnen lassen.","Ein Asystolie-Alarm mit regelmäßiger Pleth-Kurve ist meist ein Artefakt, wird aber nie ungeprüft quittiert: Patient:in ansehen, Puls tasten, Elektroden erneuern."]},{"titel":"Intensivstation nach dem Herzkathetertag, fünf Betten, 18:20 Uhr","einleitung":"Spätdienst auf der Intensivstation, fünf Patient:innen mit Koronarangiographie oder PCI am heutigen Tag. Du bist die einzige ärztliche Person auf Station, der Oberarzt ist im Haus erreichbar. Fünf Meldungen kommen innerhalb weniger Sekunden: Lege die Reihenfolge fest.","zeitlimit_s":90,"betten":[{"id":"Bett 1","patient":"Herr H., 74 J., persistierendes Vorhofflimmern, Bisoprolol wegen der Untersuchung heute pausiert","alarm":"HF hoch","vitals":{"hf":142,"sys":118,"dia":74,"spo2":96,"af":18},"rhythmus":"vorhofflimmern","kurz":"Er sitzt im Bett, isst sein Abendessen und hat keine Beschwerden.","prioritaet":4,"begruendung":"Bekanntes Vorhofflimmern mit schneller Überleitung, erklärbar durch den pausierten Betablocker, bei stabilem Blutdruck und ohne Instabilitätszeichen. Das ist keine Kardioversion, sondern eine Frage der nächsten Stunde: Betablocker wieder geben, Auslöser wie Schmerz, Volumenmangel, Fieber und Ischämie ausschließen. Wird er symptomatisch oder hypoton, steigt die Priorität sofort."},{"id":"Bett 2","patient":"Frau L., 78 J., 8 Stunden nach diagnostischer Koronarangiographie über die rechte Leiste, ASS und Heparin im Labor","alarm":"RR niedrig","vitals":{"hf":118,"sys":82,"dia":46,"spo2":95,"af":22},"rhythmus":"sinus_tachy","kurz":"Sie klagt über Schmerzen in der rechten Flanke und Übelkeit und ist blass; die Leiste sieht von außen unauffällig aus.","prioritaet":1,"begruendung":"Tachykardie, Hypotonie und Blässe nach arterieller Punktion unter Antikoagulation bedeuten Blutungsschock, bis das Gegenteil bewiesen ist. Ein retroperitoneales Hämatom blutet in die Tiefe; die unauffällige Leiste beruhigt nicht, der Flankenschmerz ist der Hinweis. Sofort: Hilfe, zwei große Zugänge, Volumen, Hb und Kreuzblut, Antikoagulation pausieren, Oberarzt und Bildgebung beziehungsweise Gefäßchirurgie informieren."},{"id":"Bett 3","patient":"Frau S., 70 J., Tag 1 nach PCI der RCX","alarm":"VES häufig","vitals":{"hf":70,"sys":134,"dia":80,"spo2":97,"af":14},"rhythmus":"sinus","kurz":"Etwa 12 VES pro Minute, keine Salven, sie ist beschwerdefrei. Das Kalium von heute Morgen lag bei 3,9 mmol/l, Magnesium wurde nicht bestimmt.","prioritaet":5,"begruendung":"Einzelne VES ohne Salven, ohne Symptome und ohne Kreislaufwirkung sind nach Reperfusion häufig und nicht dringend. Es bleibt eine Aufgabe: Kalium und Magnesium kontrollieren und ausgleichen (Kalium im oberen Normbereich), den Alarm nicht dauerhaft pausieren und bei Salven, R-auf-T oder Symptomen neu bewerten."},{"id":"Bett 4","patient":"Herr W., 63 J., 6 Stunden nach PCI der RCA (Stent), ASS und Ticagrelor","alarm":"ST-Hebung","vitals":{"hf":92,"sys":128,"dia":76,"spo2":97,"af":16},"rhythmus":"stemi","kurz":"Er hat seit 10 Minuten wieder Druck auf der Brust, wie vor der Intervention.","prioritaet":2,"begruendung":"Neuer Brustschmerz mit ST-Hebung wenige Stunden nach Stentimplantation ist eine Stentthrombose, bis das Gegenteil bewiesen ist, und braucht sofort ein 12-Kanal-EKG und die Rücksprache mit dem Herzkatheterlabor. Er ist hämodynamisch stabil und steht deshalb hinter dem Schockbett; das EKG kann die Pflegekraft schreiben, während du bei Bett 2 bist."},{"id":"Bett 5","patient":"Herr N., 58 J., Tag 1 nach Vorderwandinfarkt, arterielle Kanüle links radial","alarm":"ART niedrig","vitals":{"hf":78,"sys":64,"dia":38,"spo2":98,"af":14},"rhythmus":"sinus","kurz":"Die Druckkurve ist flach und ohne dikrotische Kerbe; er liest Zeitung, die Hand ist warm, die NIBP-Messung vor 15 Minuten ergab 126/74 mmHg.","prioritaet":3,"begruendung":"Der Wert passt nicht zum Patienten: warme Hand, normale Herzfrequenz, wach. Wahrscheinlich ist die invasive Messung gedämpft (abgeknickte Leitung, gebeugtes Handgelenk, Luft oder Thrombus in der Leitung). Vor dem Abwinken kommt ein 30-Sekunden-Check: NIBP gegenmessen, Puls tasten, Leitung und Druckbeutel prüfen. Er steht hinter den beiden Kreislaufbetten, aber vor dem stabilen Vorhofflimmern, weil sich hinter dem Wert ein echter Schock verbergen könnte."}],"debriefing":["Zwei Kreislaufprobleme gleichzeitig: Bett 2 (Schock) steht vor Bett 4 (stabile Ischämie). Das 12-Kanal-EKG für Bett 4 wird delegiert und von dir nach wenigen Minuten angesehen.","Nach Katheterzugang denken: Die Blutung kann retroperitoneal liegen. Ein unauffälliger Verband oder eine weiche Leiste schließt sie nicht aus; Flankenschmerz, Tachykardie und Hypotonie sind die Hinweise.","Messwerte, die nicht zum Patienten passen (flache Druckkurve, warme Hand, wach), sind verdächtig auf Messfehler, werden aber in 30 Sekunden gegengeprüft: NIBP, Puls, Patient:in ansehen.","Stabile Rhythmusstörungen wie schnelles Vorhofflimmern oder VES werden behandelt, aber nach den Kreislaufpatient:innen. Sie bleiben auf der Liste und werden neu bewertet."]},{"titel":"Tagdienst zur Übergabezeit, vier Betten, 15:50 Uhr","einleitung":"Früh- und Spätdienst übergeben gerade, der Flur ist voll, das Telefon klingelt, mehrere Kolleg:innen stehen im Dienstzimmer. In dieser Phase gehen Alarme leicht unter oder werden pausiert. Vier Meldungen stehen auf dem Zentralmonitor: Lege die Reihenfolge fest.","zeitlimit_s":60,"betten":[{"id":"Bett 1","patient":"Herr C., 58 J., Tag 2 nach Vorderwandinfarkt","alarm":"VT 5 Schläge","vitals":{"hf":74,"sys":130,"dia":80,"spo2":97,"af":15},"rhythmus":"sinus","kurz":"Eine Salve aus fünf breiten Komplexen, danach wieder Sinusrhythmus; er hat nichts bemerkt und sitzt am Tisch.","prioritaet":3,"begruendung":"Die Salve hat sich von selbst beendet, Kreislauf und Befinden sind unverändert: keine akute Bedrohung. Sie ist aber ein Warnzeichen für elektrische Instabilität in der Frühphase nach Infarkt. Kalium und Magnesium kontrollieren, Ischämie bedenken, Betablocker prüfen, das Ereignis dokumentieren; bei längeren Salven, Symptomen oder Häufung sofort neu bewerten und den Oberarzt informieren."},{"id":"Bett 2","patient":"Herr A., 77 J., Tag 4 nach Hinterwandinfarkt, Niereninsuffizienz (Kreatinin 2,3 mg/dl), Bisoprolol heute früh von 5 auf 10 mg erhöht","alarm":"HF niedrig","vitals":{"hf":38,"sys":78,"dia":44,"spo2":93,"af":16},"rhythmus":"sinus_brady","kurz":"Er liegt ruhig, seine Frau sitzt am Bett; er sagt, er sei „heute so müde“, und antwortet verlangsamt. Der Alarm wurde in der letzten Viertelstunde zweimal pausiert.","prioritaet":1,"begruendung":"Unscheinbar, aber instabil: Bradykardie mit Hypotonie und Vigilanzminderung (Schockzeichen) nach Dosiserhöhung des Betablockers bei eingeschränkter Nierenfunktion. Atropin 500 µg i.v. (wiederholbar bis 3 mg), Betablocker stoppen, 12-Kanal-EKG (AV-Block nach Hinterwandinfarkt?), Stimulation vorbereiten, bei Betablocker-Überdosierung Glukagon erwägen, Oberarzt rufen. Der ruhige Patient ist hier der kränkste."},{"id":"Bett 3","patient":"Herr Z., 62 J., Tag 3 nach Katheterablation","alarm":"EKG-Elektrode lose","vitals":{"hf":72,"sys":136,"dia":82,"spo2":97,"af":14},"rhythmus":"sinus","kurz":"Gelbe technische Meldung, die EKG-Kurve ist verrauscht; er wurde gerade von der Pflegekraft gewaschen und unterhält sich normal.","prioritaet":4,"begruendung":"Reine Technikmeldung ohne Grenzwertverletzung bei einem wachen Patienten. Sie wird nicht ignoriert: Ein verrauschtes EKG kann eine echte Arrhythmie verdecken, und dauerhaft offene Technikalarme fördern Alarmmüdigkeit. Die Pflegekraft erneuert die Elektroden, sobald die kritischen Betten versorgt sind."},{"id":"Bett 4","patient":"Frau F., 73 J., Tag 2 nach NSTEMI, EF 45 %","alarm":"HF hoch","vitals":{"hf":148,"sys":122,"dia":76,"spo2":95,"af":20},"rhythmus":"vorhofflattern","kurz":"Seit 30 Minuten gleichmäßig 148/min, bisher war kein Vorhofflimmern bekannt; sie spürt Herzklopfen, ist sonst beschwerdefrei.","prioritaet":2,"begruendung":"Neue, starre, regelmäßige Tachykardie um 150/min mit schmalen Komplexen: Vorhofflattern mit 2:1-Überleitung, bis das EKG etwas anderes zeigt. Sie ist stabil (kein Schock, keine Ischämiezeichen, keine Herzinsuffizienz), deshalb keine sofortige Kardioversion. Aber 12-Kanal-EKG, Elektrolyte und Ischämie klären und mit dem Oberarzt Frequenzkontrolle oder Kardioversion sowie Antikoagulation planen. Priorität 2, weil sie jederzeit instabil werden kann."}],"debriefing":["Die Übergabezeit ist eine Risikozeit: Alarmtöne werden zum Hintergrundrauschen und pausiert. Wer pausiert, trägt die Verantwortung, nach der Pausenzeit nachzusehen.","Der ruhige Patient kann der kränkste sein. Die Frequenz allein sagt wenig; entscheidend sind Blutdruck, Vigilanz und Perfusion (Instabilitätszeichen: Schock, Synkope, Myokardischämie, Herzinsuffizienz).","Betablocker, Niereninsuffizienz und Dosiserhöhung am selben Tag: Die Medikamentenanamnese gehört zu jeder Bradykardie.","Neue Rhythmusstörungen bei stabilem Kreislauf (Bett 4, Bett 1) kommen nach den instabilen, geraten aber nicht in Vergessenheit: nachverfolgen und dokumentieren."]}]},{"id":"prozedur-arterieller-zugang","typ":"prozedur","titel":"Arterieller Zugang","untertitel":"A. radialis, Druckmesssystem, Nullabgleich und Zugangskontrolle","gruppe":"Prozeduren","reihenfolge":50,"ebene":"oeffentlich","status":"entwurf","dauer":"15 min","lernziele":["Druckmesssystem vorbereiten, luftfrei entlüften und an die Kanüle anschließen","Eine A. radialis ultraschall- oder palpationsgesteuert in direkter oder Seldinger-Technik kanülieren und die Schritte begründen","Druckaufnehmer auf die phlebostatische Achse ausrichten, Nullabgleich und Fast-Flush-Test durchführen","Diskonnektion, Messfehler und Durchblutungsstörungen der Hand erkennen und richtig reagieren"],"quellen":[{"id":"krinko2","kurz":"KRINKO 2017, Teil 2","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 2: Periphervenöse Verweilkanülen und arterielle Katheter. Bundesgesundheitsbl 2017;60:207–215","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil2.pdf?__blob=publicationFile&v=1","stand":"2017"},{"id":"krinko1","kurz":"KRINKO 2017, Teil 1","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 1, Abschnitte 3.3 (Ultraschall) und 3.11 (kathetertypübergreifend: Hubs, Konnektoren)","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1.pdf?__blob=publicationFile&v=3","stand":"2017"},{"id":"saugel","kurz":"Saugel 2020","titel":"Saugel B, Kouz K, Meidert AS, Schulte-Uentrop L, Romagnoli S. How to measure blood pressure using an arterial catheter: a systematic 5-step approach. Crit Care 2020;24:172","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7183114/","stand":"2020"},{"id":"perseus","kurz":"ESAIC PERSEUS 2020","titel":"Lamperti M et al. European Society of Anaesthesiology guidelines on peri-operative use of ultrasound-guided for vascular access (PERSEUS vascular access). Eur J Anaesthesiol 2020;37:344–376","url":"https://doi.org/10.1097/EJA.0000000000001180","stand":"2020"},{"id":"xylocain","kurz":"Fachinfo Xylocain 1 %/2 %","titel":"Fachinformation Xylocain 1 %/2 % Injektionslösung (Lidocainhydrochlorid), Abschnitt 4.2 (Hautquaddel bis 20 mg je Quaddel)","url":"https://www.fachinfo.de/pdf/004674","stand":"Juli 2022"},{"id":"nejm_art","kurz":"NEJM-Video 2006","titel":"Tegtmeyer K et al. Videos in Clinical Medicine: Placement of an arterial line. N Engl J Med 2006;354:e13 (nur weiterführender Link)","url":"https://doi.org/10.1056/NEJMvcm044149","stand":"2006"}],"moderation":"Impulsfragen:\n1. Der Monitor zeigt plötzlich 36/30 mmHg, die Pulsoxymetrie-Kurve ist unverändert. Was ist dein erster Gedanke, und wohin gehst du?\n2. Warum korrigiert ein Nullabgleich keinen Höhenfehler des Druckaufnehmers?\n3. Was spricht gegen den Allen-Test als alleiniges Kriterium vor der Punktion?\n4. Welche A. radialis lässt du bei geplanter Koronarangiographie frei, und wer entscheidet das bei euch?\nStolperstellen: Druckbeutel nicht auf 300 mmHg; Luftblasen im System; Druckaufnehmer nach Umlagerung nicht nachgeführt.","indikationen":["Kontinuierliche Blutdruckmessung bei Schock, Vasopressor- oder Inotropikatherapie oder instabiler Hämodynamik","Häufige arterielle Blutgasanalysen, z. B. bei Beatmung, schwerer Azidose oder respiratorischer Insuffizienz","Häufige Blutentnahmen ohne wiederholte Punktionen","Unzuverlässige nichtinvasive Messung, z. B. bei Arrhythmie, ausgeprägten Ödemen oder nicht pulsatilem Fluss unter mechanischer Kreislaufunterstützung"],"kontraindikationen":["Absolut für den gewählten Ort: lokale Infektion oder Verbrennung, Dialyseshunt am selben Arm sowie fehlender Puls oder verschlossene Arterie im Ultraschall.","Relativ: Gerinnungsstörung oder Antikoagulation, schwere periphere Gefäßerkrankung oder Raynaud-Syndrom, frühere Punktionen mit Hämatom und eine geplante Nutzung dieser A. radialis als Herzkatheterzugang oder Bypassgefäß."],"vorbereitung":["Indikation und Seite festlegen, meist die nicht dominante Hand; klären, welche A. radialis für einen Herzkatheter frei bleiben soll","Aufklärung nach Hausstandard, Gerinnung und Antikoagulation prüfen","Pulse beidseits tasten, A. radialis und A. ulnaris im Ultraschall darstellen (Durchmesser, Verlauf, Verkalkung, Durchgängigkeit)","Druckmesssystem vorbereiten: NaCl 0,9 % ohne Heparin im Druckbeutel auf 300 mmHg, System luftblasenfrei entlüften","Monitor vorbereiten: Druckkanal für die arterielle Kurve aktivieren, passende Skala wählen","Lagerung: Unterarm supiniert, Handgelenk über einer Rolle leicht dorsalflektiert und fixiert"],"material":{"benoetigt":[{"text":"Sterile Handschuhe, Mund-Nasen-Schutz und steriles Lochtuch","warum":"Die KRINKO empfiehlt diese Barriere für periphere arterielle Katheter (Kat. II)."},{"text":"Alkoholisches Hautantiseptikum mit remanentem Wirkstoff (Octenidin oder Chlorhexidin)","warum":"Hautantiseptik ist vor der Anlage Pflicht (Kat. IB); die Kombination mit remanentem Wirkstoff ist sinnvoll (Kat. II)."},{"text":"Arterienkanüle 20 G, mit integriertem Draht oder als Seldinger-Set","warum":"20 G ist für die A. radialis üblich: weniger Komplikationen als 18 G und eine gut auswertbare Kurve. Der Draht hilft bei schwierigen Verhältnissen."},{"text":"Ultraschallgerät mit Linearschallkopf und sterilem Überzug","warum":"Ultraschall erhöht die Erfolgsrate beim ersten Versuch; der Überzug ist nötig, wenn der Schallkopf im Punktionsfeld liegt."},{"text":"Druckmesssystem: Druckaufnehmer mit Spülvorrichtung, druckstabile Leitung, Dreiwegehahn","warum":"Nur druckstabile, kurze Leitungen mit wenigen Hähnen geben die Kurve unverfälscht wieder."},{"text":"NaCl 0,9 % (500 ml) ohne Heparin im Druckbeutel","warum":"Der Druckbeutel auf 300 mmHg verhindert Blutrückfluss und hält die Flüssigkeitssäule stabil; Heparinzusatz wird wegen des HIT-Risikos nicht empfohlen."},{"text":"Lokalanästhetikum, z. B. Lidocain 1 %, 1 bis 2 ml als Hautquaddel","warum":"Reicht für die oberflächliche Punktion; die Fachinformation nennt bis 20 mg (2 ml 1 %) je Quaddel."},{"text":"Handgelenksrolle und Pflaster","warum":"Leichte Dorsalflexion streckt die Arterie und bringt sie näher an die Haut."},{"text":"Fixierung (Naht oder Fixierpflaster) und steriler Transparentverband","warum":"Auch arterielle Katheter sollen steril verbunden werden (Kat. II); sichere Fixierung verhindert Dislokation und Diskonnektion."},{"text":"Rote Kennzeichnung für die arterielle Leitung","warum":"Schützt vor versehentlicher intraarterieller Injektion."}],"ablenker":[{"text":"Heparinhaltige Spüllösung","warum_nicht":"Wird wegen des Risikos einer heparininduzierten Thrombozytopenie nicht empfohlen; NaCl 0,9 % genügt."},{"text":"Normale, dehnbare Infusionsleitung oder lange Verlängerungen als Druckleitung","warum_nicht":"Weiche oder lange Leitungen verfälschen die Kurve; nur druckstabile Leitungen des Messsystems verwenden."},{"text":"Arterienkanüle 18 G für die A. radialis","warum_nicht":"Größer als nötig, mehr Komplikationen und eher unterdämpfte Kurven; 20 G ist der Standard."},{"text":"Zuspritzventil für Medikamente am arteriellen System","warum_nicht":"Lädt zur versehentlichen intraarteriellen Injektion ein; am arteriellen System werden keine Medikamente gegeben."},{"text":"Steriler Kittel, Haube und großes Abdecktuch für die A. radialis","warum_nicht":"Für die A. radialis empfiehlt die KRINKO Lochtuch, sterile Handschuhe und Mund-Nasen-Schutz; maximale Barriere ist beim femoralen Zugang zu erwägen."},{"text":"Stauschlauch am Oberarm","warum_nicht":"Eine Arterie wird nicht gestaut; die Stauung verschlechtert eher die Darstellung und den Puls."}]},"schritte":[{"text":"Indikation, Seite und Technik festlegen (direkte Punktion oder Seldinger); Material vollständig richten","warum":"Bei Ödem, Adipositas oder nach Fehlversuchen hat die Technik mit Draht die höhere Erfolgsrate.","q":["saugel"]},{"text":"Druckmesssystem vorbereiten: NaCl-Beutel ohne Heparin, Druckbeutel auf 300 mmHg, System luftblasenfrei entlüften","warum":"Luftblasen dämpfen die Kurve und sind ein Embolierisiko; ohne 300 mmHg läuft Blut in die Leitung zurück.","q":["saugel"]},{"text":"Pulse tasten, A. radialis im Ultraschall darstellen; Allen-Test nicht als alleiniges Kriterium","warum":"Der Allen-Test sagt ischämische Komplikationen schlecht voraus; der Ultraschall zeigt Durchmesser, Verlauf und Verkalkung.","q":["saugel"]},{"text":"Hand lagern: Unterarm supiniert, Handgelenk leicht dorsalflektiert über einer Rolle, fixiert","warum":"Die Arterie wird gestreckt und oberflächlicher; eine ruhige Hand erleichtert die Punktion.","q":["saugel"]},{"text":"Hygienische Händedesinfektion, Mund-Nasen-Schutz, sterile Handschuhe","warum":"Barriere für periphere arterielle Katheter nach KRINKO (Kat. II).","q":["krinko2"]},{"text":"Hautantiseptik mit alkoholischem Präparat mit remanentem Wirkstoff, Einwirkzeit abwarten, steriles Lochtuch, Schallkopf steril beziehen","warum":"Infektionsraten arterieller Katheter sind ähnlich denen von ZVK; der Schallkopf im Punktionsfeld braucht einen sterilen Überzug.","q":["krinko2","krinko1"]},{"text":"Kleine Hautquaddel mit 1 bis 2 ml Lidocain 1 %","warum":"Schmerz führt zu Bewegung und Gefäßspasmus; mehr Volumen würde den Puls verdecken.","q":["xylocain"]},{"text":"Punktion möglichst distal, etwa 1 bis 2 cm proximal der Handgelenksfalte, im Winkel von 30 bis 45°, unter Ultraschall oder Palpation","warum":"Distal beginnen lässt bei Fehlversuch Raum nach proximal; Ultraschall verbessert die Erfolgsrate beim ersten Versuch.","q":["saugel","perseus"]},{"text":"Bei pulsierendem Rückfluss: direkte Technik Winkel auf 10 bis 15° senken, minimal nachschieben, Kunststoffkanüle vorschieben; Seldinger: Draht widerstandsfrei einführen, Kanüle darüber","warum":"Beim ersten Rückfluss liegt oft nur die Nadelspitze im Gefäß, die Kunststoffkanüle noch nicht.","q":["saugel"]},{"text":"Nadel oder Draht entfernen, Arterie proximal abdrücken, Druckleitung luftfrei anschließen","warum":"Das Abdrücken verhindert Blutverlust beim Konnektieren; Luft im System verfälscht die Kurve.","q":["saugel"]},{"text":"Arterielle Kurve prüfen, spülen, Kanüle fixieren, steril verbinden, Leitung rot kennzeichnen","warum":"Eine typische Kurve bestätigt die Lage; Fixierung und Kennzeichnung schützen vor Diskonnektion und Fehlinjektion.","q":["krinko2","saugel"]},{"text":"Druckaufnehmer auf Höhe der phlebostatischen Achse fixieren (4. ICR, mittlere Axillarlinie)","warum":"Jede Höhendifferenz verfälscht die Werte: 10 cm entsprechen etwa 7,5 mmHg.","q":["saugel"]},{"text":"Nullabgleich: Hahn zum Patienten schließen, zur Luft öffnen, am Monitor nullen, Hahn zurückdrehen","warum":"Der Nullabgleich setzt den Atmosphärendruck als Referenz und gleicht die Drift des Druckaufnehmers aus.","q":["saugel"]},{"text":"Fast-Flush-Test: Spülung kurz auslösen und die Nachschwingungen beurteilen","warum":"Wenige, rasch abklingende Schwingungen zeigen ein adäquat gedämpftes System; keine Schwingung spricht für Überdämpfung, viele für Unterdämpfung.","q":["saugel"]},{"text":"Zugangskontrolle und Dokumentation: Durchblutung der Hand, Einstichstelle, feste Konnektionen, Alarmgrenzen; Ort, Größe und Datum notieren","warum":"Ischämie, Blutung und Diskonnektion werden früh erkannt; nicht mehr benötigte Katheter sind sofort zu entfernen.","q":["krinko2","saugel"]}],"komplikationen":[{"titel":"Durchblutungsstörung der Hand","erkennen":"Blasse, kühle oder marmorierte Finger, Schmerz, verlängerte Rekapillarisierung distal der Kanüle.","handeln":"Kanüle sofort entfernen, Hand warm und tief lagern, Oberärzt:in und Gefäßchirurgie hinzuziehen, Duplex-Sonographie."},{"titel":"Diskonnektion mit Blutverlust","erkennen":"Plötzlich flache Kurve oder Alarm „Druck niedrig“ bei unverändertem EKG und SpO2, Blut im Bett.","handeln":"Sofort ans Bett, Blutung stoppen (proximal abdrücken, Hahn zu), System steril erneuern, neu nullen; Blutverlust abschätzen, Hb kontrollieren."},{"titel":"Gedämpfte oder falsche Messwerte","erkennen":"Überdämpfung: verwaschene Kurve ohne Inzisur, Systole zu niedrig, Diastole zu hoch. Unterdämpfung: spitze Systole, Systole zu hoch. Höhenfehler: alle Werte gleichmäßig verschoben.","handeln":"Luftblasen und Gerinnsel entfernen, Knick am Handgelenk beheben, Druckbeutel auf 300 mmHg, Druckaufnehmer auf Herzhöhe, neu nullen, Fast-Flush-Test; Werte mit nichtinvasiver Messung abgleichen."},{"titel":"Versehentliche intraarterielle Injektion","erkennen":"Brennender Schmerz, Blässe oder Marmorierung der Hand direkt nach einer Injektion.","handeln":"Injektion sofort stoppen, Kanüle zunächst belassen, sofort Oberärzt:in und Gefäßchirurgie informieren; vorbeugend Leitung rot kennzeichnen und kein Zuspritzventil verwenden."},{"titel":"Hämatom, Blutung oder Pseudoaneurysma","erkennen":"Schwellung an der Einstichstelle, Nachblutung, später pulsierende Schwellung.","handeln":"Komprimieren, Gerinnung prüfen; bei pulsierender Schwellung Duplex-Sonographie und Gefäßchirurgie."},{"titel":"Katheterassoziierte Infektion","erkennen":"Rötung, Eiter an der Einstichstelle, Fieber oder Bakteriämie ohne andere Quelle.","handeln":"Katheter entfernen, Blutkulturen, ggf. Katheterspitze einschicken; neuen Zugang an anderer Stelle."}],"nachsorge":["Druckaufnehmer bei jeder Lageänderung auf die phlebostatische Achse nachführen und neu nullen","Druckbeutel regelmäßig auf 300 mmHg kontrollieren, System luftblasenfrei halten","Hand und Einstichstelle mehrmals pro Schicht kontrollieren; Alarmgrenzen für die arterielle Kurve aktiv lassen","Vor Blutentnahmen die Membran desinfizieren; geschlossene Entnahmesysteme sind offenen vorzuziehen","Verbandswechsel nach denselben Prinzipien wie beim ZVK; Wechselintervall des Druckmesssystems nach Herstellerangabe","Nicht mehr benötigte arterielle Katheter umgehend entfernen und danach ausreichend lange komprimieren, unter Antikoagulation länger"],"uebungen":[{"titel":"Alarm „ART niedrig“ in der Nacht","patient":{"kurz":"Herr T., 63 J.","alter":63,"geschlecht":"m","gewicht_kg":88,"groesse_cm":180,"vorgeschichte":"Tag 1 nach Reanimation bei Kammerflimmern, beatmet, Noradrenalin; arterieller Zugang A. radialis links seit gestern."},"start":{"zeit":"Minute 0","vitals":{"hf":88,"sys":112,"dia":64,"spo2":97,"af":14,"temp":36.2},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Nachtdienst","text":"Es ist 3:10 Uhr. Herr T. wurde vor zehn Minuten umgelagert und ist seither unruhig. Der Monitor alarmiert.","effekt":{"vitals":{"sys":36,"dia":30},"alarm":"ART niedrig"},"weiter":"k2"},{"id":"k2","typ":"wahl","zeit":"Minute 1","frage":"Die arterielle Kurve ist fast flach bei 36/30 mmHg, EKG und Pulsoxymetrie-Kurve sind unverändert. Was tust du?","optionen":[{"id":"a1","text":"Sofort ans Bett: Patient, Arm, Leitung und alle Konnektionen ansehen","bewertung":"richtig","feedback":"Richtig. Flache Kurve bei unveränderter Pulsoxymetrie spricht für ein Problem am Messsystem, zum Beispiel eine Diskonnektion. Das muss man sehen, nicht vermuten.","q":["saugel"],"weiter":"k3"},{"id":"a2","text":"Alarm stummschalten; bei regelmäßiger SpO2-Kurve ist das sicher ein Artefakt","bewertung":"falsch","feedback":"Gefährlich. Auch ein Artefakt hat eine Ursache, und die häufigste nach Umlagerung ist eine gelöste Leitung, aus der es blutet.","weiter":"k5"},{"id":"a3","text":"Noradrenalin sofort deutlich erhöhen","bewertung":"falsch","feedback":"Erst prüfen. Wer eine falsche Zahl behandelt, riskiert hypertensive Spitzen, und die eigentliche Ursache bleibt unentdeckt. Du gehst ans Bett.","weiter":"k3"}],"weiter":"k3"},{"id":"k3","typ":"info","zeit":"Minute 2","text":"Am Bett: Was schaust du dir an?","optionen":[{"id":"o1","label":"Arm unter der Decke","ergebnis":"Die Druckleitung hat sich von der Kanüle gelöst. Das Laken ist blutgetränkt (geschätzt 200 ml), aus dem offenen Kanülenansatz läuft Blut."},{"id":"o2","label":"Puls am anderen Arm und Rekapillarisierung","ergebnis":"Puls kräftig, Rekapillarisierung unter 2 s."},{"id":"o3","label":"Nichtinvasive Blutdruckmessung","ergebnis":"108/62 mmHg."},{"id":"o4","label":"Druckbeutel","ergebnis":"300 mmHg, Beutel halb voll."}],"pflicht":["o1"],"weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Minute 3","frage":"Welche Maßnahmen sind jetzt richtig?","optionen":[{"id":"m1","text":"Blutung sofort stoppen: Arterie proximal abdrücken, Kanülenansatz verschließen","richtig":true,"feedback":"Ja. Aus einer offenen arteriellen Kanüle geht schnell viel Blut verloren."},{"id":"m2","text":"Das im Bett liegende Leitungsende nicht wieder aufstecken, sondern steril erneuern oder Kanüle nach Hausstandard wechseln","richtig":true,"feedback":"Ja. Das Ende lag ungeschützt im Bett und ist kontaminiert."},{"id":"m3","text":"Nach dem Anschluss Druckaufnehmer auf Herzhöhe bringen, neu nullen und Fast-Flush-Test machen","richtig":true,"feedback":"Ja. Erst dann sind die Werte wieder verlässlich."},{"id":"m4","text":"Hb kontrollieren, Blutverlust dokumentieren, Luer-Lock-Verbindungen festziehen und Leitung zugentlastet führen","richtig":true,"feedback":"Ja. So wiederholt sich das nicht bei der nächsten Umlagerung."},{"id":"m5","text":"Den ART-Alarm für die Nacht ausschalten, die nichtinvasive Messung reicht","richtig":false,"feedback":"Nein. Der Alarm hat die Blutung aufgedeckt; ohne ihn wäre sie erst viel später aufgefallen."}],"weiter":"k6"},{"id":"k5","typ":"text","zeit":"Minute 25","titel":"Bei der nächsten Runde","text":"Die Pflege findet eine Blutlache unter dem linken Arm, die Leitung hängt lose neben der Kanüle. Herr T. ist blass, die nichtinvasive Messung zeigt 84/48 mmHg.","effekt":{"vitals":{"hf":124,"sys":84,"dia":48,"spo2":95},"alarm":"HF hoch"},"weiter":"k7"},{"id":"k6","typ":"ende","titel":"Diskonnektion rechtzeitig gefunden","text":"Nach steriler Erneuerung des Systems, Nullabgleich und Fast-Flush-Test zeigt die Kurve wieder 106/60 mmHg. Der Hb ist leicht gefallen, eine Transfusion ist nicht nötig.","lernpunkte":["Flache arterielle Kurve bei unveränderter Pulsoxymetrie: zuerst an Messsystem und Diskonnektion denken und sofort ans Bett gehen.","Nach jeder Umlagerung Leitung, Konnektionen und Höhe des Druckaufnehmers prüfen.","Nach Wiederanschluss neu nullen und den Fast-Flush-Test machen."]},{"id":"k7","typ":"wahl","zeit":"Minute 26","frage":"Was tust du jetzt?","optionen":[{"id":"b1","text":"Blutung stoppen, Oberärzt:in informieren, Volumen, Hb und Kreuzblut, System steril erneuern und neu nullen","bewertung":"richtig","feedback":"Richtig. Blutung stoppen und Volumen ersetzen haben Vorrang; danach wird das System wiederhergestellt.","effekt":{"vitals":{"hf":108,"sys":96,"dia":56}}},{"id":"b2","text":"Noradrenalin erhöhen und das Laken wechseln","bewertung":"falsch","feedback":"Nein. Die Hypotonie ist Folge des Blutverlusts; Katecholamine verdecken ihn nur, und die Kanüle blutet weiter."}],"weiter":"k8"},{"id":"k8","typ":"ende","titel":"Blutverlust durch übersehene Diskonnektion","text":"Herr T. braucht zwei Erythrozytenkonzentrate. Bei der Fallbesprechung wird der stummgeschaltete Alarm als Hauptursache benannt.","lernpunkte":["Alarme der arteriellen Kurve nie ungeprüft quittieren oder stummschalten.","Eine gelöste arterielle Leitung kann in Minuten einen relevanten Blutverlust verursachen.","Luer-Lock-Verbindungen fest und die Leitung zugentlastet führen, besonders bei unruhigen Patient:innen."]}]},{"titel":"Gute Werte nach der Umlagerung","patient":{"kurz":"Frau S., 79 J.","alter":79,"geschlecht":"w","gewicht_kg":61,"groesse_cm":160,"vorgeschichte":"NSTEMI mit kardiogenem Schock, Noradrenalin, Ziel-MAP mindestens 65 mmHg; arterieller Zugang A. radialis rechts."},"start":{"zeit":"Minute 0","vitals":{"hf":86,"sys":112,"dia":66,"spo2":95,"af":18,"temp":36.8},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Frage der Pflege","text":"Frau S. wurde für das Röntgen aufgesetzt und danach wieder flach gelagert. Der Druckaufnehmer hängt seitdem am unteren Bettgitter. Der Monitor zeigt 112/66 mmHg, MAP 81. Die Pflege fragt, ob sie das Noradrenalin reduzieren soll.","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 1","text":"Was prüfst du, bevor du entscheidest?","optionen":[{"id":"o1","label":"Höhe des Druckaufnehmers","ergebnis":"Er hängt etwa 20 cm unterhalb der phlebostatischen Achse (4. ICR, mittlere Axillarlinie).","q":["saugel"]},{"id":"o2","label":"Nichtinvasive Messung am anderen Arm","ergebnis":"96/54 mmHg, MAP 68."},{"id":"o3","label":"Fast-Flush-Test","ergebnis":"Ein bis zwei rasch abklingende Nachschwingungen: Das System ist adäquat gedämpft.","q":["saugel"]},{"id":"o4","label":"Klinik","ergebnis":"Unterschenkel kühl, Rekapillarisierung 3 s, Urin 20 ml in der letzten Stunde."}],"pflicht":["o1"],"weiter":"k3"},{"id":"k3","typ":"zahl","zeit":"Minute 2","frage":"Um wie viel mmHg zeigt der Monitor bei 20 cm Höhendifferenz ungefähr zu viel an?","einheit":"mmHg","min":0,"max":40,"schritt":1,"start":0,"zielbereich":[13,17],"feedback_ok":"Richtig. 10 cm Höhendifferenz entsprechen etwa 7,5 mmHg; bei 20 cm liest der Monitor rund 15 mmHg zu hoch, für Systole, Diastole und MAP gleichermaßen.","feedback_zu_niedrig":"Zu wenig. Faustregel: 10 cm entsprechen etwa 7,5 mmHg; 20 cm also rund 15 mmHg.","feedback_zu_hoch":"Zu viel. Faustregel: 10 cm entsprechen etwa 7,5 mmHg; 20 cm also rund 15 mmHg.","weiter":"k4"},{"id":"k4","typ":"wahl","zeit":"Minute 3","frage":"Wie gehst du vor?","optionen":[{"id":"a1","text":"Druckaufnehmer auf die phlebostatische Achse bringen, Nullabgleich wiederholen, dann über das Noradrenalin entscheiden","bewertung":"richtig","feedback":"Richtig. Erst die korrekte Messung, dann die Therapieentscheidung. Der tatsächliche MAP liegt um 66 mmHg, also knapp im Ziel.","q":["saugel"]},{"id":"a2","text":"Noradrenalin reduzieren, der MAP liegt mit 81 mmHg deutlich über dem Ziel","bewertung":"falsch","feedback":"Nein. Der Wert ist um rund 15 mmHg zu hoch; eine Reduktion brächte Frau S. unter das Ziel. Das Team korrigiert zuerst die Höhe."},{"id":"a3","text":"Nur den Nullabgleich am Bettgitter wiederholen","bewertung":"falsch","feedback":"Reicht nicht. Der Nullabgleich setzt nur den Bezug zur Atmosphäre; solange der Druckaufnehmer 20 cm zu tief hängt, bleibt der Höhenfehler bestehen."}],"weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 5","effekt":{"vitals":{"sys":97,"dia":51}},"frage":"Nach Korrektur der Höhe zeigt der Monitor 97/51 mmHg (MAP 66). Welche Ursachen verfälschen eine arterielle Kurve außerdem typischerweise?","optionen":[{"id":"m1","text":"Luftblasen im System","richtig":true,"feedback":"Ja. Sie dämpfen die Kurve: Systole zu niedrig, Diastole zu hoch."},{"id":"m2","text":"Druckbeutel unter 300 mmHg","richtig":true,"feedback":"Ja. Die Spülung reicht nicht, Blut steigt in die Leitung, die Kurve wird gedämpft."},{"id":"m3","text":"Abgeknickte Kanüle bei gebeugtem Handgelenk","richtig":true,"feedback":"Ja. Ein typischer Grund für eine plötzlich verwaschene Kurve."},{"id":"m4","text":"Gerinnsel an der Kanülenspitze","richtig":true,"feedback":"Ja. Führt zur Überdämpfung, lässt sich oft durch Aspiration und Spülen beheben."},{"id":"m5","text":"Lange, dehnbare Zusatzleitungen und viele Dreiwegehähne","richtig":true,"feedback":"Ja. Sie verändern die Schwingungseigenschaften des Systems."},{"id":"m6","text":"Sinusrhythmus","richtig":false,"feedback":"Nein. Ein regelmäßiger Rhythmus stört die Messung nicht."},{"id":"m7","text":"Flache Rückenlage der Patientin","richtig":false,"feedback":"Nein. Entscheidend ist die Höhe des Druckaufnehmers relativ zum Herzen, nicht die Lage an sich."}],"weiter":"k6"},{"id":"k6","typ":"ende","titel":"Messfehler erkannt","text":"Das Noradrenalin bleibt unverändert, der MAP hält sich um 66 mmHg. Die Pflege markiert die phlebostatische Achse am Thorax.","lernpunkte":["Vor jeder Therapieentscheidung nach invasivem Blutdruck: Höhe des Druckaufnehmers, Nullabgleich und Kurvenqualität prüfen.","Faustregel: 10 cm Höhendifferenz entsprechen etwa 7,5 mmHg. Druckaufnehmer zu tief bedeutet zu hohe Werte.","Der Nullabgleich korrigiert keinen Höhenfehler; der zur Luft geöffnete Hahn muss auf der phlebostatischen Achse liegen.","Unplausible Werte immer mit nichtinvasiver Messung und Klinik abgleichen."]}]}]},{"id":"prozedur-aszitespunktion","typ":"prozedur","titel":"Aszitespunktion","untertitel":"Diagnostisch und therapeutisch (Parazentese), ultraschallgesteuert","gruppe":"Prozeduren","reihenfolge":40,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Indikationen der diagnostischen und therapeutischen Aszitespunktion benennen und Kontraindikationen einschließlich Antikoagulation prüfen","Punktionsort sonografisch mit Farbdoppler wählen und die Z-Technik anwenden","Proben richtig verarbeiten: Zellzahl mit Differenzierung, Blutkulturflaschen am Bett, Gesamteiweiß, SAAG","Albumindosis nach großvolumiger Parazentese berechnen und die Gabe sicherstellen","Kardialen von zirrhotischem Aszites anhand von SAAG und Gesamteiweiß unterscheiden"],"quellen":[{"id":"dgvs","kurz":"DGVS S2k 2019","titel":"Aktualisierte S2k-Leitlinie „Komplikationen der Leberzirrhose“ der DGVS, AWMF 021-017 (Gerbes AL, Labenz J et al., Z Gastroenterol 2019;57:611–680)","url":"https://doi.org/10.1055/a-0873-4658","stand":"Version 2.0 (11/2018), publiziert 2019"},{"id":"easl","kurz":"EASL CPG 2018","titel":"EASL Clinical Practice Guidelines for the management of patients with decompensated cirrhosis (J Hepatol 2018;69:406–460)","url":"https://doi.org/10.1016/j.jhep.2018.03.024","stand":"2018"},{"id":"bsg","kurz":"BSG/BASL 2020","titel":"Guidelines on the management of ascites in cirrhosis (Aithal GP et al., Gut 2021;70:9–29)","url":"https://doi.org/10.1136/gutjnl-2020-321790","stand":"2020"},{"id":"shm","kurz":"SHM 2019","titel":"Recommendations on the use of ultrasound guidance for adult abdominal paracentesis: a position statement of the Society of Hospital Medicine (Cho J et al., J Hosp Med 2019;14:E7–E15)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8021127/","stand":"2019"},{"id":"uw","kurz":"Hepatitis C Online 2024","titel":"Diagnosis and Management of Ascites (Price J), Hepatitis C Online, University of Washington","url":"https://www.hepatitisc.uw.edu/go/management-cirrhosis-related-complications/ascites-diagnosis-management/core-concept/all","stand":"2024"},{"id":"nejm_video","kurz":"NEJM Video 2006","titel":"Videos in Clinical Medicine: Paracentesis (Thomsen TW et al., N Engl J Med 2006;355:e21), nur als weiterführender Link","url":"https://doi.org/10.1056/NEJMvcm062234","stand":"2006"}],"moderation":"Impulsfragen: (1) INR 1,9 und Thrombozyten 50.000/µl: Gibst du vor der Punktion FFP oder Thrombozyten? Warum nicht? (2) SAAG 1,6 g/dl, Gesamteiweiß 3,2 g/dl, gestaute Lebervenen: welche Ursache, und was folgt daraus für die Therapie? (3) 7 l abgelassen: Wie viel Albumin, und wann? (4) Gilt die Albuminregel aus der Zirrhose auch für kardialen Aszites?\nStolperstellen: Albumin angeordnet, aber nicht gegeben; Blutkulturflaschen erst im Labor beimpft; Punktion paramedian durch die Rektusscheide; Serum-Albumin nicht am selben Tag bestimmt. Kontrast zur Pleura: Bei der Pleurapunktion gilt ein Richtwert von etwa 1,5 l pro Sitzung, bei der Parazentese wird möglichst vollständig entlastet und ab 5 l Albumin gegeben.","indikationen":["Diagnostisch: jeder neu aufgetretene Aszites, um die Ursache zu klären (portal-hypertensiv, kardial, maligne, entzündlich)","Diagnostisch bei bekannter Zirrhose: stationäre Aufnahme, Verschlechterung oder Komplikationen (Fieber, Bauchschmerz, Enzephalopathie, Nierenfunktionsverschlechterung, GI-Blutung) zum Ausschluss einer SBP","Therapeutisch (Parazentese): großer, gespannter Aszites mit Beschwerden (Spannungsgefühl, Dyspnoe, Völlegefühl) und refraktärer Aszites","Kardiologischer Kontext: Aszites bei Rechtsherzversagen oder schwerer Trikuspidalinsuffizienz einordnen (SAAG und Gesamteiweiß) und bei relevanten Beschwerden trotz Rekompensation entlasten"],"kontraindikationen":["Absolut: fehlende Einwilligung, kein sicherer Zugangsweg zum Aszites oder keine diagnostische bzw. therapeutische Konsequenz.","Relativ: DIC oder Hyperfibrinolyse, Hautinfektion am Punktionsort, stark geblähter Darm, Schwangerschaft, unkooperative Person; Narben und Bauchwandkollateralen im Stichweg werden sonografisch umgangen."],"vorbereitung":["Aufklärung und Einwilligung: Blutung, Aszitesleckage, Infektion, Darmverletzung, Kreislaufreaktion","Gerinnung: keine routinemäßige Messung und keine prophylaktische Gabe von FFP oder Gerinnungsfaktoren, unabhängig vom INR; Ausnahme DIC. Eine Thrombozytentransfusion nur bei unter 20.000/µl erwägen","Medikation: ASS weiterführen; Thienopyridine und GP-IIb/IIIa-Hemmer pausieren; VKA und DOAK wenn möglich pausieren. Bei Dringlichkeit (z. B. SBP-Verdacht) unter laufender Medikation punktieren und über das höhere Blutungsrisiko aufklären","Kardiologisch: Bei Koronarstent, mechanischer Klappe oder Vorhofflimmern mit hohem Embolierisiko das Pausieren gemeinsam mit der Kardiologie festlegen","Labor am selben Tag: Serum-Albumin (für den SAAG), Kreatinin, Natrium, Blutbild; Ausgangswerte für RR, HF und Gewicht dokumentieren","Bei geplanter großvolumiger Entlastung Albumin 20 % vorab anordnen und bereitstellen","Rolle der PJ-Studierenden: Lagerung, Monitoring, steriles Anreichen, Proben und Volumenbilanz; punktiert wird nur nach Ausbildung und unter Aufsicht"],"material":{"benoetigt":[{"text":"Ultraschallgerät mit Konvexsonde und Farbdoppler","warum":"Bestimmt Menge, Zugangsweg und Abstand zu Darm und Organen; der Farbdoppler zeigt Bauchwandgefäße (A. epigastrica inferior, Kollateralen) im geplanten Stichweg."},{"text":"Hautantiseptikum, sterile Handschuhe, steriles Lochtuch, sterile Kompressen","warum":"Die Parazentese ist ein invasiver Eingriff und wird unter sterilen Bedingungen mit Einmalmaterial durchgeführt."},{"text":"Lidocain 1 % mit Spritze und dünner Kanüle","warum":"Betäubt Haut und Bauchwand bis zum Peritoneum; der Stichkanal wird dabei schon in Z-Technik angelegt."},{"text":"Punktionskanüle: dünnkalibrig für die Diagnostik; für die Entlastung Venenverweilkanüle oder spezielle Parazentesekanüle mit Seitenlöchern","warum":"In Deutschland meist Venenverweilkanülen: überall verfügbar und günstig, aber knickanfällig und nur mit Endöffnung, daher häufiger Lagekorrekturen."},{"text":"Spritzen (20 und 50 ml) und Dreiwegehahn","warum":"Proben steril abziehen, ohne das System zu öffnen; über den Hahn lässt sich der Ablauf jederzeit stoppen."},{"text":"Probengefäße: EDTA-Röhrchen (Zellzahl, Differenzierung), Röhrchen für Gesamteiweiß und Albumin, aerobe und anaerobe Blutkulturflaschen, großes Gefäß für Zytologie","warum":"Blutkulturflaschen am Bett mit je 10 bis 20 ml beimpft erhöhen die Ausbeute deutlich; für die Zytologie bei Malignitätsverdacht 50 bis 100 ml."},{"text":"Verbindungsschlauch und Sammelbeutel mit Skala (oder Vakuumflaschen nach Hausstandard)","warum":"Großvolumige Entlastung über etwa 1 bis 4 Stunden mit genauer Mengenbilanz; die Menge bestimmt die Albumindosis."},{"text":"Humanalbumin 20 %","warum":"Nach Entlastung von über 5 l wird Albumin gegeben, um einer zirkulatorischen Dysfunktion nach Parazentese vorzubeugen."},{"text":"Steriler Verband, Nahtmaterial griffbereit","warum":"Bei Leckage aus dem Stichkanal kann eine Tabaksbeutelnaht helfen."}],"ablenker":[{"text":"Fresh Frozen Plasma bei INR 1,8","warum_nicht":"Plasmaderivate werden vor einer Aszitespunktion unabhängig vom INR nicht gegeben; INR und Quick spiegeln das Blutungsrisiko bei Zirrhose schlecht wider. Ausnahme ist die DIC."},{"text":"Thrombozytenkonzentrat bei 45.000/µl","warum_nicht":"Eine prophylaktische Thrombozytengabe wird nur unter 20.000/µl erwogen."},{"text":"Urinteststreifen zum SBP-Nachweis","warum_nicht":"Nicht als alleiniges Verfahren, die Sensitivität ist zu gering. Maßgeblich ist die Zellzahl mit Differenzierung (Granulozyten über 250/µl)."},{"text":"Hydroxyethylstärke (HES) als Volumenersatz nach Entlastung","warum_nicht":"Nach über 5 l ist Albumin anderen Plasmaexpandern überlegen; HES ist wegen Nierenschäden und Gerinnungsstörungen in der Anwendung eingeschränkt."},{"text":"Gramfärbung des Aszites als Routinetest","warum_nicht":"Meist nicht indiziert, weil die Keimdichte im Aszites zu gering ist; entscheidend ist die Kultur in Blutkulturflaschen."}]},"schritte":[{"text":"Indikation, Einwilligung und Medikation prüfen; Gerinnung nicht routinemäßig korrigieren","warum":"Relevante Blutungen sind selten (unter 1 %), FFP senkt dieses Risiko nicht. Plättchenhemmer außer ASS und Antikoagulanzien möglichst pausieren, im Notfall bewusst abwägen.","q":["dgvs","bsg"]},{"text":"Ausgangswerte erheben: RR, HF, SpO2, Gewicht; Serum-Albumin, Kreatinin und Natrium am selben Tag","warum":"Der SAAG braucht Serum- und Aszites-Albumin vom selben Tag; Kreatinin und Natrium sind die Referenz für eine spätere Verschlechterung der Nierenfunktion.","q":["dgvs","easl"]},{"text":"Lagern: Rückenlage, Oberkörper leicht erhöht, leicht nach links gedreht","warum":"In Linksschräglage sammelt sich der Aszites im linken Unterbauch; das Depot wird tiefer und der Zugang sicherer.","q":["dgvs"]},{"text":"Ultraschall: Aszitesdepot, Bauchwanddicke, Darmschlingen, Organe und Farbdoppler der Bauchwandgefäße; Punktionsort im linken Unterbauch lateral der Rektusscheide markieren (mindestens 8 cm von der Mittellinie, 5 cm über der Symphyse)","warum":"So bleiben A. epigastrica inferior, Leber und Milz aus dem Stichweg; rechts drohen ein geblähtes Zökum oder Narben. Nach dem Markieren nicht mehr umlagern, sonst neu schallen.","q":["bsg","dgvs","shm"]},{"text":"Kurzer Sicherheitscheck: Identität, Einwilligung, Allergien, Probenliste, Albumin bereit","warum":"Vermeidet typische Fehler: falsche oder fehlende Proben, vergessene Blutkulturflaschen, fehlendes Albumin nach großer Entlastung."},{"text":"Hygienische Händedesinfektion, sterile Handschuhe, Hautdesinfektion mit Einwirkzeit, steriles Lochtuch","warum":"Steriles Arbeiten verhindert Bauchwandinfektionen und kontaminierte Kulturen.","q":["dgvs","easl"]},{"text":"Lokalanästhesie von der Haut bis zum Peritoneum, dabei den Stichkanal schon in Z-Technik anlegen","warum":"Das Peritoneum ist schmerzempfindlich; derselbe versetzte Kanal wird anschließend für die Punktion genutzt.","q":["uw"]},{"text":"Z-Technik: Haut mit der freien Hand nach kaudal verschieben, Kanüle unter Aspiration vorschieben und die Haut erst loslassen, wenn Aszites kommt; dann Kunststoffkanüle vorschieben, Stahlnadel entfernen","warum":"Nach dem Loslassen gleitet die Haut zurück, der Stichkanal liegt versetzt und schließt sich besser: weniger Leckage. Alternative ist ein schräger Einstich im 45-Grad-Winkel.","q":["dgvs","uw"]},{"text":"Proben sofort am Bett: aerobe und anaerobe Blutkulturflasche mit je 10 bis 20 ml beimpfen, EDTA-Röhrchen für Zellzahl mit Differenzierung, Röhrchen für Gesamteiweiß und Albumin; bei Malignitätsverdacht 50 bis 100 ml für die Zytologie","warum":"Beimpfen am Bett vor einer Antibiotikagabe erhöht die Kulturausbeute deutlich. Eine SBP liegt ab über 250 Granulozyten/µl vor.","q":["dgvs","easl","uw"]},{"text":"Zur Entlastung das Sammelsystem anschließen und ablaufen lassen, Menge fortlaufend notieren; stockt der Fluss, Kanüle vorsichtig bewegen oder Patient:in zur Seite drehen","warum":"Die großvolumige Parazentese entfernt den Aszites möglichst vollständig in einer Sitzung, meist über 1 bis 4 Stunden.","q":["bsg","easl"]},{"text":"Währenddessen Kreislauf, Schmerzen und Aspekt des Punktats beobachten; bei Hypotonie, zunehmendem Schmerz oder frisch blutigem Punktat stoppen und Ursache klären","warum":"Eine großvolumige Entlastung kann die Hämodynamik verändern; eine Blutung aus Bauchwandgefäßen muss früh auffallen.","q":["dgvs"]},{"text":"Nach Abschluss einer Entlastung über 5 l Albumin 20 % geben: 6 bis 8 g pro Liter (DGVS) bzw. 8 g pro Liter (EASL, BSG)","warum":"Albumin beugt der zirkulatorischen Dysfunktion nach Parazentese (Nierenversagen, Hyponatriämie, Enzephalopathie) am besten vor und ist anderen Plasmaexpandern überlegen.","q":["dgvs","easl","bsg"]},{"text":"Kanüle entfernen, steriles Pflaster; bei Nachlaufen etwa 2 Stunden auf die Gegenseite lagern, ggf. Tabaksbeutelnaht","warum":"Leckage ist die häufigste Komplikation (etwa 5 %) und öffnet Keimen einen Weg.","q":["bsg","dgvs"]},{"text":"Proben versenden, Menge und Albumingabe dokumentieren; Kreatinin, Natrium und Diuretika im Verlauf steuern","warum":"Volumen und Albumin gehören in die Übergabe. Nach Entlastung genügt die niedrigste Diuretikadosis, die ein Rezidiv verhindert.","q":["easl"]}],"komplikationen":[{"titel":"Aszitesleckage","erkennen":"Häufigste Komplikation (etwa 5 %): nässender Verband, klare Flüssigkeit aus dem Stichkanal, eher nach großen Kanülen.","handeln":"Auf die Gegenseite lagern, sterile Kompressen, ggf. Tabaksbeutelnaht; auf Infektzeichen achten. Vorbeugen: Z-Technik oder schräger Stichkanal, Aszites möglichst vollständig ablassen."},{"titel":"Blutung (Bauchwandhämatom, Hämoperitoneum, Pseudoaneurysma)","erkennen":"Selten (unter 1 %), aber potenziell lebensbedrohlich: Schmerz und Schwellung an der Einstichstelle, Hb-Abfall, Tachykardie, Hypotonie; blutiges Punktat, das nicht klar wird; im Ultraschall Hämatom in der Bauchwand oder neue echoreiche Flüssigkeit. Risikofaktoren: Niereninsuffizienz, hoher MELD-Score.","handeln":"Kompression, Monitoring, großlumige Zugänge, Hb und Kreuzblut, Antikoagulation prüfen; Oberärzt:in informieren, CT-Angiographie und interventionelle Radiologie (Embolisation), ggf. Chirurgie. Vorbeugen: Ultraschall mit Farbdoppler, Punktion lateral der Rektusscheide."},{"titel":"Zirkulatorische Dysfunktion nach Parazentese","erkennen":"Entwickelt sich über Stunden bis Tage nach großvolumiger Entlastung ohne ausreichende Volumengabe: Kreatininanstieg bis zum hepatorenalen Syndrom, Hyponatriämie, Enzephalopathie; mit schlechterer Prognose verbunden.","handeln":"Vorbeugen mit Albumin nach über 5 l. Kreatinin und Natrium kontrollieren, NSAR und andere nephrotoxische Medikamente meiden, Diuretika anpassen; bei Verschlechterung der Nierenfunktion Abklärung und Therapie nach Zirrhose-Leitlinie."},{"titel":"Hypotonie während oder kurz nach der Entlastung","erkennen":"RR-Abfall, Tachykardie, Schwindel beim Aufsetzen. Differenzialdiagnosen: Blutung, vasovagale Reaktion, Infektion bis Sepsis, Volumenverschiebung nach großer Entlastung.","handeln":"Ablauf stoppen, flach lagern, Monitoring; Blutung aktiv ausschließen (Punktionsstelle, Hb, Ultraschall); fehlendes Albumin nach über 5 l sofort nachholen; Vasopressoren erst nach Klärung von Ursache und Volumenstatus."},{"titel":"Darmperforation und Infektion","erkennen":"Sehr selten: Aspiration von Luft oder trübem, stuhlartigem Material, neue Bauchschmerzen, Fieber, Peritonismus; später Bauchdeckenabszess oder sekundäre Peritonitis (mehrere Erreger in der Kultur).","handeln":"Kanüle entfernen, Ärzt:in und Chirurgie informieren, Bildgebung (CT der Wahl bei Verdacht auf sekundäre Peritonitis), Antibiose nach ärztlicher Entscheidung. Vorbeugen: Ultraschall, nicht durch Narben oder über geblähtem Darm punktieren."}],"nachsorge":["Vitalparameter und Bewusstsein in den ersten Stunden engmaschig; Punktionsstelle auf Nachlaufen und Hämatom kontrollieren","Albumingabe nach Entlastung über 5 l prüfen und dokumentieren (Menge, Zeitpunkt); keine HES oder anderen künstlichen Kolloide","Kreatinin und Natrium in den Folgetagen kontrollieren; NSAR meiden. ACE-Hemmer und AT1-Blocker sind bei Zirrhose mit Aszites in der Regel ungünstig, bei gleichzeitiger Herzinsuffizienz interdisziplinär abwägen","Diuretika nach Entlastung in der niedrigsten Dosis weiterführen, die ein Rezidiv verhindert","Befunde zeitnah ansehen: Granulozyten über 250/µl bedeuten SBP, dann sofort Antibiose und Albumin nach Leitlinie","SAAG und Gesamteiweiß auswerten: SAAG ≥ 1,1 g/dl mit Gesamteiweiß über 2,5 g/dl spricht für kardialen Aszites; dann steht die Behandlung der Stauung im Vordergrund. Gesamteiweiß unter 1,5 g/dl gilt bei Zirrhose als Risikofaktor für eine SBP","Plättchenhemmung bzw. Antikoagulation nach festgelegtem Plan wieder beginnen (DGVS: Plättchenhemmer frühestens 24 h nach der Punktion) und dokumentieren"],"uebungen":[{"titel":"Schwindel nach großer Entlastung","patient":{"kurz":"Herr B., 63 J.","alter":63,"geschlecht":"m","gewicht_kg":74,"groesse_cm":176,"vorgeschichte":"Äthyltoxische Leberzirrhose Child-Pugh B mit refraktärem Aszites, Parazentesen alle 2 bis 3 Wochen. Aufnahme auf die kardiologische IMC wegen Dyspnoe bei gespanntem Abdomen. Medikation: Spironolacton, Furosemid."},"start":{"zeit":"Minute 0","vitals":{"hf":86,"sys":112,"dia":66,"spo2":95,"af":22,"temp":36.6},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"info","text":"Vor der Entlastungspunktion: Welche Informationen holst du ein?","optionen":[{"id":"o1","label":"Labor","ergebnis":"INR 1,8; Thrombozyten 62.000/µl; Kreatinin 1,1 mg/dl; Natrium 132 mmol/l; Serum-Albumin 2,6 g/dl."},{"id":"o2","label":"Ultraschall Abdomen mit Farbdoppler","ergebnis":"Großes Aszitesdepot im linken Unterbauch, Tiefe über 8 cm, keine Darmschlingen im geplanten Stichweg; die A. epigastrica inferior liegt weiter medial.","q":["shm"]},{"id":"o3","label":"Aszitesbefund der Voraufnahme","ergebnis":"SAAG 1,9 g/dl, Gesamteiweiß 0,9 g/dl, Granulozyten 40/µl: portal-hypertensiver Aszites bei Zirrhose. Bei kardialer Ursache wäre das Eiweiß meist über 2,5 g/dl; unter 1,5 g/dl gilt als Risikofaktor für eine SBP.","q":["dgvs","bsg"]},{"id":"o4","label":"Echokardiographie","ergebnis":"LVEF 55 %, normale RV-Funktion, keine relevante Trikuspidalinsuffizienz, V. cava inferior schmal und atemvariabel."}],"pflicht":["o1","o2"],"moderation":"Kardiologischer Blick: Echo und Aszites-Eiweiß zusammen schließen eine kardiale Ursache hier praktisch aus.","weiter":"k2"},{"id":"k2","typ":"wahl","frage":"INR 1,8 und Thrombozyten 62.000/µl. Wie gehst du vor?","optionen":[{"id":"a","text":"Keine Substitution, ultraschallgestützt punktieren","bewertung":"richtig","feedback":"Plasmaderivate werden vor einer Aszitespunktion unabhängig vom INR nicht gegeben; Thrombozyten erst unter 20.000/µl erwägen. Ultraschall senkt das Blutungsrisiko.","q":["dgvs","bsg"]},{"id":"b","text":"Zwei Einheiten FFP, dann punktieren","bewertung":"falsch","feedback":"Kein Nutzen belegt; INR und Quick bilden das Blutungsrisiko bei Zirrhose schlecht ab. FFP bringt Volumen, Transfusionsrisiken und Zeitverlust.","q":["dgvs","easl"]},{"id":"c","text":"Thrombozytenkonzentrat geben, Ziel über 100.000/µl","bewertung":"falsch","feedback":"Eine prophylaktische Thrombozytengabe wird nur bei unter 20.000/µl erwogen.","q":["dgvs"]},{"id":"d","text":"Punktion verschieben, bis der INR unter 1,5 liegt","bewertung":"falsch","feedback":"Der INR wird bei Zirrhose dadurch nicht besser, die Beschwerden bleiben. Es gibt keinen INR-Grenzwert für die Parazentese.","q":["uw"]}],"weiter":"k3"},{"id":"k3","typ":"info","zeit":"Minute 150","text":"Die Parazentese verlief unauffällig: 8 l klarer, gelber Aszites in knapp 2 Stunden, die Kanüle ist entfernt. Beim Aufsetzen wird Herrn B. schwindelig. Was klärst du?","effekt":{"vitals":{"hf":112,"sys":86,"dia":50},"rhythmus":"sinus_tachy","alarm":"RR niedrig"},"optionen":[{"id":"o1","label":"Punktionsstelle und Bauch","ergebnis":"Pflaster trocken, kein Hämatom, Bauch weich, kein Druckschmerz."},{"id":"o2","label":"Blutgasanalyse mit Hb und Laktat","ergebnis":"Hb 10,9 g/dl (vor der Punktion 11,2 g/dl), Laktat 1,4 mmol/l."},{"id":"o3","label":"Ultraschall","ergebnis":"Wenig echofreier Restaszites, keine neue echoreiche Flüssigkeit, kein Bauchwandhämatom."},{"id":"o4","label":"Temperatur und Bewusstsein","ergebnis":"37,0 °C; wach, orientiert, kein Flapping-Tremor."},{"id":"o5","label":"Anordnungen und Pflegedokumentation","ergebnis":"Albumin 20 % war „nach Abschluss der Parazentese“ angeordnet, ist aber noch nicht gelaufen."}],"pflicht":["o2","o3","o5"],"moderation":"Erst die gefährlichste Ursache ausschließen (Blutung), dann die naheliegende behandeln (fehlendes Albumin).","weiter":"k4"},{"id":"k4","typ":"wahl","frage":"Keine Blutungszeichen, kein Infektbild, das Albumin fehlt. Was tust du?","optionen":[{"id":"a","text":"Flach lagern, Albumin 20 % jetzt infundieren, RR und HF engmaschig, Ärzt:in informieren","bewertung":"richtig","feedback":"Nach 8 l ist Albumin ohnehin indiziert und jetzt überfällig. Die Blutung als wichtigste Differenzialdiagnose ist klinisch und sonografisch ausgeschlossen; den Verlauf weiter beobachten.","effekt":{"vitals":{"hf":96,"sys":104,"dia":60},"rhythmus":"sinus"},"q":["dgvs","easl","bsg"]},{"id":"b","text":"2 l NaCl 0,9 % als Bolus statt Albumin","bewertung":"falsch","feedback":"Nach über 5 l wird Albumin empfohlen; andere Plasmaexpander sind dafür weniger wirksam und werden nicht empfohlen.","q":["easl"]},{"id":"c","text":"Noradrenalin über den peripheren Zugang starten","bewertung":"falsch","feedback":"Vasopressoren behandeln nicht die Ursache. Erst Volumenstatus und Albumin, dann neu bewerten."},{"id":"d","text":"Restaszites nachpunktieren, um den Druck zu senken","bewertung":"falsch","feedback":"Eine weitere Entlastung verschärft die Kreislaufsituation eher."}],"weiter":"k5"},{"id":"k5","typ":"zahl","frage":"Wie viel Albumin (g) gibst du für 8 l abgelassenen Aszites?","einheit":"g Albumin","min":0,"max":120,"schritt":2,"start":20,"zielbereich":[48,64],"feedback_ok":"Richtig: 6 bis 8 g pro Liter (DGVS) bzw. 8 g pro Liter (EASL, BSG), für 8 l also 48 bis 64 g. Beispiel: 300 ml Albumin 20 % entsprechen 60 g.","feedback_zu_niedrig":"Zu wenig für 8 l. Gerechnet wird mit 6 bis 8 g pro abgelassenem Liter.","feedback_zu_hoch":"Mehr als 8 g pro Liter ist nicht belegt, belastet das Kreislaufvolumen (bei Herzinsuffizienz relevant), und Albumin ist knapp. Ziel: 6 bis 8 g pro Liter.","weiter":"k6"},{"id":"k6","typ":"mehrfach","frage":"Was gehört in die Nachsorge der nächsten 24 bis 48 Stunden?","optionen":[{"text":"Kreatinin und Natrium kontrollieren","richtig":true,"feedback":"Kreatininanstieg und Hyponatriämie zeigen eine zirkulatorische Dysfunktion nach Parazentese an."},{"text":"Diuretika in der niedrigsten wirksamen Dosis weiterführen","richtig":true,"feedback":"So viel wie nötig, um ein rasches Rezidiv zu verhindern, so wenig wie möglich."},{"text":"Punktionsstelle auf Nachlaufen kontrollieren","richtig":true,"feedback":"Leckage ist die häufigste Komplikation."},{"text":"Ibuprofen gegen Bauchschmerzen","richtig":false,"feedback":"NSAR sollen bei Aszites nicht gegeben werden: Natriumretention, Hyponatriämie, akutes Nierenversagen."},{"text":"ACE-Hemmer hochdosieren, weil eine Herzinsuffizienz vorliegen könnte","richtig":false,"feedback":"Bei Zirrhose mit Aszites sind ACE-Hemmer und AT1-Blocker in der Regel ungünstig (Hypotonie, Nierenfunktion). Hier ist die Pumpfunktion zudem normal; bei echter Herzinsuffizienz ist das eine interdisziplinäre Abwägung."},{"text":"Am nächsten Tag routinemäßig erneut punktieren","richtig":false,"feedback":"Eine erneute Entlastung richtet sich nach den Beschwerden, nicht nach einem festen Zeitplan."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Kreislauf stabilisiert","text":"Herr B. wurde nach einer Parazentese von 8 l hypoton. Eine Blutung war ausgeschlossen, das angeordnete Albumin fehlte. Nach Albumingabe und Flachlagerung stabilisierte sich der Kreislauf; Kreatinin und Natrium blieben in den Folgetagen stabil.","lernpunkte":["Hypotonie nach Parazentese: zuerst eine Blutung ausschließen (Punktionsstelle, Hb, Ultraschall), dann an fehlendes Albumin, vasovagale Reaktion und Infektion denken.","Albumin nach über 5 l: 6 bis 8 g/l (DGVS) bzw. 8 g/l (EASL, BSG) nach Abschluss der Entlastung; die Gabe gehört in die Übergabe.","Keine FFP- oder Thrombozytengabe vor der Punktion allein wegen erhöhtem INR oder mäßiger Thrombopenie.","Hoher SAAG mit niedrigem Eiweiß spricht für Zirrhose; kardialer Aszites hat meist ein Gesamteiweiß über 2,5 g/dl."]}]},{"titel":"Schmerzhafte Schwellung nach Punktion","patient":{"kurz":"Frau H., 79 J.","alter":79,"geschlecht":"w","gewicht_kg":66,"groesse_cm":160,"vorgeschichte":"Schwere Trikuspidalinsuffizienz mit Rechtsherzversagen, permanentes Vorhofflimmern (Apixaban seit 48 h pausiert), chronische Nierenerkrankung Stadium 3. Erstmals Aszites, trotz Diuretika zunehmend gespanntes Abdomen."},"start":{"zeit":"Minute 0","vitals":{"hf":88,"sys":108,"dia":64,"spo2":94,"af":20,"temp":36.7},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"info","text":"Erstpunktion mit Entlastung. Welche Befunde holst du für die Einordnung des Aszites?","optionen":[{"id":"o1","label":"Aszites: Albumin und Gesamteiweiß","ergebnis":"Aszites-Albumin 1,6 g/dl bei Serum-Albumin 3,2 g/dl (SAAG 1,6 g/dl); Gesamteiweiß im Aszites 3,4 g/dl.","q":["dgvs","bsg"]},{"id":"o2","label":"Zellzahl mit Differenzierung","ergebnis":"Leukozyten 210/µl, Granulozyten 30/µl: kein Anhalt für eine SBP.","q":["dgvs"]},{"id":"o3","label":"BNP im Serum","ergebnis":"1.240 ng/l (über 364 ng/l spricht für eine kardiale Ursache).","q":["bsg"]},{"id":"o4","label":"Echokardiographie und Oberbauchsonografie","ergebnis":"TAPSE 12 mm, schwere Trikuspidalinsuffizienz, V. cava inferior 28 mm ohne Atemvariabilität, gestaute Lebervenen; Leber glatt begrenzt, Milz normal groß, kein Hinweis auf Zirrhose."}],"pflicht":["o1","o4"],"weiter":"k2"},{"id":"k2","typ":"wahl","frage":"Wie ordnest du den Aszites ein?","optionen":[{"id":"a","text":"Kardialer Aszites bei Rechtsherzversagen: SAAG ≥ 1,1 g/dl und Gesamteiweiß über 2,5 g/dl","bewertung":"richtig","feedback":"Bei kardialer Stauung ist der SAAG hoch wie bei Zirrhose, das Eiweiß aber meist über 2,5 g/dl, weil die Lebersinusoide durchlässig bleiben. Hohes BNP und gestaute Lebervenen passen dazu. Therapeutisch steht die Behandlung der Stauung im Vordergrund.","q":["dgvs","bsg"]},{"id":"b","text":"Zirrhotischer Aszites, denn ein SAAG über 1,1 g/dl beweist die Zirrhose","bewertung":"falsch","feedback":"Der SAAG zeigt eine portale bzw. sinusoidale Drucksteigerung, nicht deren Ursache. Auch kardialer Aszites hat einen hohen SAAG.","q":["dgvs"]},{"id":"c","text":"Peritonealkarzinose wegen des hohen Eiweißes","bewertung":"falsch","feedback":"Bei Peritonealkarzinose ist der SAAG typischerweise unter 1,1 g/dl.","q":["bsg"]},{"id":"d","text":"Spontan bakterielle Peritonitis","bewertung":"falsch","feedback":"Dafür bräuchte es über 250 Granulozyten/µl.","q":["dgvs"]}],"moderation":"Frage an die Gruppe: Gilt die Albuminregel (6 bis 8 g/l ab 5 l) aus der Zirrhose-Leitlinie auch hier? Die Leitlinien beziehen sich auf Zirrhose; bei kardialem Aszites wird individuell entschieden.","weiter":"k3"},{"id":"k3","typ":"info","zeit":"Minute 90","text":"Wegen des Bauchumfangs wurde paramedian rechts, etwa 4 cm neben der Mittellinie und ohne Farbdoppler punktiert; 3,5 l wurden abgelassen. Jetzt klagt Frau H. über zunehmende Schmerzen an der Punktionsstelle, die Pflege sieht eine bläuliche Schwellung. Was erhebst du?","effekt":{"vitals":{"hf":124,"sys":92,"dia":56},"alarm":"HF hoch"},"optionen":[{"id":"o1","label":"Inspektion und Palpation","ergebnis":"Prall-elastische, druckschmerzhafte Schwellung rechts paraumbilikal, etwa handtellergroß, sichtbar zunehmend."},{"id":"o2","label":"Blutgasanalyse mit Hb","ergebnis":"Hb 9,1 g/dl (vor der Punktion 11,8 g/dl), Laktat 2,6 mmol/l."},{"id":"o3","label":"Ultraschall Bauchwand und Abdomen","ergebnis":"Inhomogene, echoarme Raumforderung in der rechten Rektusscheide, 7 × 5 cm; Restaszites neu mit feinen Binnenechos."},{"id":"o4","label":"Gerinnung","ergebnis":"INR 1,2, Thrombozyten 168.000/µl; letzte Apixaban-Einnahme vor 50 h."}],"pflicht":["o2","o3"],"weiter":"k4"},{"id":"k4","typ":"wahl","frage":"Rektusscheidenhämatom mit Hb-Abfall und Kreislaufreaktion. Was tust du?","optionen":[{"id":"a","text":"Kompression, zwei großlumige Zugänge, Kreuzblut und Blutprodukte nach Bedarf, Oberärzt:in und interventionelle Radiologie informieren, CT-Angiographie","bewertung":"richtig","feedback":"Eine Blutung aus Bauchwandgefäßen nach Parazentese braucht frühe Bildgebung und wird meist radiologisch durch Embolisation gestillt.","q":["dgvs","bsg"]},{"id":"b","text":"Kühlen und in 4 Stunden kontrollieren; Bauchwandhämatome sind selbstlimitierend","bewertung":"falsch","feedback":"Kleine Hämatome bleiben oft stabil, aber ein Hb-Abfall um über 2 g/dl mit Tachykardie und Hypotonie zeigt eine relevante, wahrscheinlich aktive Blutung.","weiter":"k5b"},{"id":"c","text":"Apixaban sofort wieder ansetzen, damit kein Schlaganfall auftritt","bewertung":"falsch","feedback":"Bei aktiver Blutung wird nicht antikoaguliert; der Wiederbeginn wird nach Blutstillung gemeinsam mit der Kardiologie festgelegt.","weiter":"k5b"}],"weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 180","frage":"CT-Angiographie: aktive Blutung aus einem Ast der A. epigastrica inferior rechts, erfolgreich embolisiert; nach 2 EK ist der Kreislauf stabil. Was hätte die Blutung am ehesten verhindert?","effekt":{"vitals":{"hf":96,"sys":110,"dia":64}},"optionen":[{"text":"Punktion im linken Unterbauch lateral der Rektusscheide (mindestens 8 cm von der Mittellinie, 5 cm über der Symphyse)","richtig":true,"feedback":"Dort liegt die A. epigastrica inferior nicht im Stichweg."},{"text":"Farbdoppler der Bauchwand vor der Punktion","richtig":true,"feedback":"Zeigt Bauchwandgefäße im geplanten Stichweg."},{"text":"Ultraschall direkt vor der Punktion, ohne Umlagerung danach","richtig":true,"feedback":"Markierung und Punktion in derselben Position."},{"text":"FFP vor der Punktion","richtig":false,"feedback":"Die Gerinnung war normal; die Ursache war der Stichweg."},{"text":"Größere Kanüle für einen schnelleren Ablauf","richtig":false,"feedback":"Größere Kanülen erhöhen eher Leckage und Verletzungsrisiko."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Blutung früh erkannt","text":"Die Punktion nahe der Mittellinie hat einen Ast der A. epigastrica inferior verletzt. Frühe Bildgebung und Embolisation haben eine größere Blutung verhindert.","lernpunkte":["Punktionsort: linker Unterbauch lateral der Rektusscheide, mit Farbdoppler, Markierung direkt vor der Punktion.","Schmerz und Schwellung an der Einstichstelle plus Hb-Abfall und Tachykardie: an eine Bauchwandblutung denken, früh CT-Angiographie und Radiologie.","Kardialer Aszites: SAAG hoch, Gesamteiweiß über 2,5 g/dl; die Behandlung der Stauung steht im Vordergrund.","Die Albumin-Empfehlungen für große Entlastungen stammen aus Leitlinien zur Zirrhose; bei kardialem Aszites entscheidet das Team individuell."]},{"id":"k5b","typ":"wahl","zeit":"Minute 150","frage":"Eine Stunde später ist die Schwellung deutlich größer, Frau H. ist blass und kaltschweißig. Was jetzt?","effekt":{"vitals":{"hf":142,"sys":76,"dia":44,"spo2":91},"alarm":"RR niedrig"},"optionen":[{"id":"a","text":"Schockmanagement: Kompression, Volumen und Blutprodukte, notfallmäßige CT-Angiographie und Embolisation, Intensivstation informieren","bewertung":"richtig","feedback":"Hämorrhagischer Schock: Die Blutstillung hat jetzt Vorrang, die interventionelle Radiologie ist meist der schnellste Weg.","effekt":{"vitals":{"hf":112,"sys":94,"dia":56,"spo2":94}}},{"id":"b","text":"Restaszites ablassen, um die Bauchwand zu entlasten","bewertung":"falsch","feedback":"Eine weitere Punktion behandelt die Blutung nicht und verzögert die Blutstillung."},{"id":"c","text":"Noradrenalin hochdosiert und weiter beobachten","bewertung":"falsch","feedback":"Vasopressoren ohne Blutstillung und Volumenersatz behandeln nur den Blutdruckwert."}],"weiter":"e2"},{"id":"e2","typ":"ende","titel":"Verzögerte Blutstillung","text":"Abwarten hat die Blutung in einen hämorrhagischen Schock übergehen lassen. Die Embolisation gelang, aber Frau H. brauchte mehrere Erythrozytenkonzentrate und musste auf die Intensivstation.","lernpunkte":["Hb-Abfall plus Tachykardie nach Punktion ist ein Alarmsignal, kein Befund zum Abwarten.","Bauchwandblutungen nach Parazentese werden meist radiologisch gestillt; früh Kontakt aufnehmen.","Vorbeugen: Ultraschall mit Farbdoppler, Punktion lateral der Rektusscheide statt paramedian."]}]}]},{"id":"prozedur-pleurapunktion","typ":"prozedur","titel":"Pleurapunktion","untertitel":"Diagnostisch und therapeutisch, ultraschallgesteuert","gruppe":"Prozeduren","reihenfolge":30,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Indikation zur diagnostischen und therapeutischen Pleurapunktion begründen und Kontraindikationen einschließlich Antikoagulation prüfen","Punktionsort sonografisch festlegen: Sicherheitsdreieck, Rippenoberrand, kein weit posteriorer Zugang","Material und Proben vollständig vorbereiten und die Schritte in sicherer Reihenfolge begleiten","Drainagemenge begrenzen und Abbruchkriterien während der Entlastung anwenden","Pneumothorax und Re-Expansionsödem früh erkennen und erste Maßnahmen einleiten"],"quellen":[{"id":"bts_verfahren","kurz":"BTS Clinical Statement 2023","titel":"British Thoracic Society Clinical Statement on pleural procedures (Asciak R et al., Thorax 2023;78 Suppl 3:s43–s68)","url":"https://doi.org/10.1136/thorax-2022-219371","stand":"2023"},{"id":"bts_anhang3","kurz":"BTS Appendix 3 2023","titel":"BTS Clinical Statement on pleural procedures, Online Appendix 3: Pleural aspiration (Material, Lagerung, Punktionsort)","url":"https://www.brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/online-appendix-3-pleural-procedures-pleural-aspiration/","stand":"2023"},{"id":"bts_leitlinie","kurz":"BTS Guideline 2023","titel":"British Thoracic Society Guideline for pleural disease (Roberts ME et al., Thorax 2023;78 Suppl 3:s1–s42)","url":"https://doi.org/10.1136/thorax-2022-219784","stand":"2023"},{"id":"lus","kurz":"Volpicelli 2012","titel":"International evidence-based recommendations for point-of-care lung ultrasound (Volpicelli G et al., Intensive Care Med 2012;38:577–591)","url":"https://doi.org/10.1007/s00134-012-2513-4","stand":"2012"},{"id":"nejm_video","kurz":"NEJM Video 2006","titel":"Videos in Clinical Medicine: Thoracentesis (Thomsen TW et al., N Engl J Med 2006;355:e16), nur als weiterführender Link","url":"https://doi.org/10.1056/NEJMvcm053812","stand":"2006"}],"moderation":"Impulsfragen: (1) Warum wird direkt über dem Oberrand der Rippe punktiert und nicht weit posterior? (2) Ein Patient mit Koronarstent vor 4 Monaten nimmt Clopidogrel und braucht eine elektive Entlastung: Was klärst du vorher, und mit wem? (3) Nach 700 ml hustet die Patientin anhaltend: weiter oder stopp? (4) Braucht jede Pleurapunktion danach ein Röntgenbild?\nStolperstellen: im Liegen geschallt, im Sitzen punktiert; offener Dreiwegehahn beim Spritzenwechsel; Vakuumflasche, „weil es schneller geht“; bei kardialen Stauungsergüssen reflexhaft punktiert statt zuerst rekompensiert.","indikationen":["Diagnostisch: unklarer, vor allem einseitiger Pleuraerguss; Probe zur Einordnung (Transsudat oder Exsudat nach Light, Infektion, Malignität)","Therapeutisch: symptomatischer Erguss mit Dyspnoe; Entlastung meist 500 bis 1.500 ml","Verdacht auf Pleurainfektion oder Empyem bei Sepsis: Die diagnostische Punktion entscheidet mit über die Notwendigkeit einer Drainage","Maligner Erguss: prüfen, ob sich die Lunge nach Entlastung wieder entfaltet (nicht expandierbare Lunge), als Grundlage für das weitere Vorgehen","Kardiologischer Alltag: Beidseitige Ergüsse bei typischer kardialer Dekompensation werden zuerst rekompensiert; punktiert wird bei relevanter Dyspnoe trotz Therapie oder bei atypischem Bild (einseitig, Fieber, pleuritischer Schmerz, fehlendes Ansprechen)"],"kontraindikationen":["Absolut: fehlende Einwilligung der einwilligungsfähigen Person; ohne sicheren Zugangsweg im Ultraschall wird elektiv nicht punktiert, sondern weiter abgeklärt, z. B. per CT (die BTS führt den fehlenden sicheren Punktionsort formal als relative Kontraindikation).","Relativ: Gerinnungsstörung oder laufende Antikoagulation bzw. P2Y12-Hemmung, Haut- oder Weichteilinfektion am Punktionsort, unkooperative Person, sehr kleiner oder nur posterior erreichbarer Erguss."],"vorbereitung":["Indikation prüfen, aktuelle Bildgebung ansehen und die Seite festlegen","Aufklärung und schriftliche Einwilligung: Pneumothorax, Blutung, Re-Expansionsödem, Schmerz, Infektion, vasovagale Reaktion, Organverletzung, ausbleibende Diagnose","Medikation elektiv: VKA pausieren bis INR ≤ 1,5 (Phenprocoumon braucht dafür deutlich länger als Warfarin); DOAK je nach Substanz und Nierenfunktion 24 bis 48 h vorher; Clopidogrel und Prasugrel 5 Tage, Ticagrelor 7 Tage; ASS und prophylaktisches Heparin dürfen weiterlaufen","Bei Koronarstents, mechanischer Klappe oder hohem Embolierisiko das Pausieren nur nach Rücksprache mit der Kardiologie; im Notfall Nutzen und Blutungsrisiko bewusst abwägen","Gerinnungstests nur bei Gerinnungsanamnese oder Antikoagulation; Basislabor (Blutbild, Nieren-, Leberwerte) und zeitgleich Serum-Gesamteiweiß und LDH für die Light-Kriterien","Elektive Punktionen in der Regelarbeitszeit; Ausrüstung vorher komplett bereitlegen: Ultraschall, Sauerstoff, Absaugung, Monitoring, Notfallwagen erreichbar","Ausgangswerte (HF, RR, SpO2, Atemfrequenz) dokumentieren; Probengefäße und Laboranforderungen vorbereiten und beschriften","Rolle klären: PJ-Studierende assistieren (Lagerung, Monitoring, steriles Anreichen, Proben); punktiert wird nur nach Ausbildung und unter Aufsicht"],"material":{"benoetigt":[{"text":"Ultraschallgerät (Konvex- oder Sektorsonde), bei Punktion unter Sicht steriler Schallkopfüberzug","warum":"Ultraschall ist vor jeder Ergusspunktion Pflicht: Er findet den sicheren Ort, misst die Tiefe und zeigt Zwerchfell, Herz, Leber, Milz und adhärente Lunge."},{"text":"Hautantiseptikum, sterile Handschuhe, steriles Abdecktuch, sterile Kompressen","warum":"Die Punktion erfolgt aseptisch; eine Kontamination kann eine iatrogene Pleurainfektion auslösen und Kulturen verfälschen."},{"text":"Lidocain 1 % mit 10-ml-Spritze, dünne Kanüle für die Quaddel und 21-G-Kanüle (grün) für die Tiefe","warum":"Lokalanästhesie bis zur Pleura parietalis; mit der 21-G-Kanüle wird zugleich probeaspiriert. Dosis begrenzen: bis 3 mg/kg, maximal 250 mg (25 ml Lidocain 1 %)."},{"text":"Pleurapunktionskatheter (Kunststoffkatheter über Stahlnadel)","warum":"Für Entlastungen über 60 ml wird ein Katheter statt einer starren Nadel empfohlen: Er verletzt die sich wieder entfaltende Lunge seltener."},{"text":"50- oder 60-ml-Spritze","warum":"Reicht für die diagnostische Probe und erlaubt eine kontrollierte manuelle Aspiration."},{"text":"Dreiwegehahn und Ableitungsbeutel mit Schlauch","warum":"Langsam per Spritze oder Schwerkraft ablassen; über den Dreiwegehahn lässt sich der Ablauf sofort stoppen und das System bleibt luftdicht."},{"text":"Probengefäße: Nativröhrchen (Eiweiß, LDH, Mikrobiologie), aerobe und anaerobe Blutkulturflaschen, Fluoridröhrchen (Glukose), heparinisierte BGA-Spritze (pH), großes Gefäß für Zytologie","warum":"Die Fragestellung bestimmt die Proben. Zytologie braucht mindestens 25 ml, besser 50 ml; den pH sofort und luftdicht im Blutgasgerät messen; Blutkulturflaschen bei Infektverdacht."},{"text":"Monitoring (SpO2, RR, EKG) und Sauerstoff","warum":"Vitalparameter vor, während und nach der Punktion; Hypoxie, vasovagale Reaktion oder Pneumothorax fallen so früh auf."},{"text":"Steriler Pflasterverband","warum":"Nach Entfernen des Katheters reicht ein einfacher steriler Verband."}],"ablenker":[{"text":"Vakuumflasche oder Wandsog zum schnelleren Ablassen","warum_nicht":"Soll bei der therapeutischen Pleurapunktion nicht verwendet werden: In einer randomisierten Studie mehr Komplikationen (Pneumothorax, Blutung, Re-Expansionsödem) und mehr Schmerzen als bei manueller Aspiration."},{"text":"Großlumige Thoraxdrainage (28 Ch) mit Trokar","warum_nicht":"Gehört nicht zur Punktion. Die Trokar-Technik soll wegen schwerer, teils tödlicher Organverletzungen generell vermieden werden."},{"text":"Frischplasma (FFP) routinemäßig vor jeder Punktion","warum_nicht":"Ohne Gerinnungsanamnese und ohne Antikoagulation ist nicht einmal ein Gerinnungstest nötig; korrigiert wird nur gezielt bei Bedarf."},{"text":"Starre Stahlkanüle für eine Entlastung über 1 l","warum_nicht":"Ab 60 ml wird ein Katheter empfohlen; eine starre Nadel kann die sich entfaltende Lunge verletzen, wenn sie verrutscht."},{"text":"Heimlich-Ventil (Flatterventil)","warum_nicht":"Gehört zur Pneumothorax-Versorgung mit Drainage, nicht zur einmaligen Ergusspunktion."}]},"schritte":[{"text":"Indikation, Einwilligung, Medikation und Bildgebung prüfen, Seite festlegen","warum":"Eine aktuelle Bildgebung bestätigt Indikation und Seite; Antikoagulation und Plättchenhemmung bestimmen das Blutungsrisiko. Die Seitenverwechslung ist ein typischer vermeidbarer Fehler.","q":["bts_verfahren"]},{"text":"Ausgangsvitalwerte erheben, Monitoring anschließen, Sauerstoff und Notfallausrüstung bereitstellen","warum":"Nur mit Ausgangswerten lassen sich Hypoxie, Hypotonie oder Bradykardie während und nach der Punktion sicher erkennen.","q":["bts_verfahren"]},{"text":"Lagern: sitzend, nach vorn gelehnt, Arme auf einem Tisch; alternativ Seitenlage oder halb sitzend mit Arm hinter dem Kopf","warum":"Diese Positionen weiten die Zwischenrippenräume und machen das Sicherheitsdreieck zugänglich; die Position muss bis zum Ende stabil haltbar sein.","q":["bts_anhang3"]},{"text":"Ultraschall in genau dieser Position: Erguss, Tiefe, Zwerchfell, Lunge, Herz, Leber und Milz darstellen; Punktionsort möglichst lateral im Sicherheitsdreieck markieren, Abstand Haut bis Pleura messen","warum":"Markierung und Punktion ohne Umlagerung dazwischen, denn Erguss und Organe verschieben sich mit der Lage. Weit posterior liegt das Gefäß-Nerven-Bündel nicht geschützt unter der Rippe; sehr nah am Zwerchfell drohen Organverletzung und Reizung.","q":["bts_verfahren","bts_anhang3"]},{"text":"Sicherheitscheckliste (Time-out): Identität, Seite, Einwilligung, Allergien, Blutungsrisiko, Monitoring","warum":"Checklisten vor und nach Pleuraeingriffen senken vermeidbare Komplikationen; Seite und Markierung werden gemeinsam bestätigt.","q":["bts_verfahren"]},{"text":"Hygienische Händedesinfektion, sterile Handschuhe, Hautdesinfektion mit Einwirkzeit, steriles Abdecken","warum":"Aseptisches Arbeiten verhindert iatrogene Pleurainfektionen und kontaminierte Kulturen.","q":["bts_anhang3"]},{"text":"Lokalanästhesie: Hautquaddel, dann direkt über dem Oberrand der unteren Rippe schrittweise bis zur Pleura parietalis, vor jeder Injektion aspirieren","warum":"Die Interkostalgefäße verlaufen am Unterrand der Rippe; die Pleura parietalis ist schmerzempfindlich. Aspirieren vor der Injektion verhindert eine intravasale Gabe. Lidocain 1 % bis 3 mg/kg, maximal 250 mg.","q":["bts_verfahren"]},{"text":"Mit der Anästhesienadel probeaspirieren: Der Erguss muss sich aspirieren lassen","warum":"Bestätigt Ort und Tiefe, bevor das größere Besteck eingeführt wird. Kommt kein Erguss, nicht tiefer stochern, sondern neu schallen.","q":["bts_anhang3"]},{"text":"Punktionskatheter über dem Rippenoberrand unter Aspiration vorschieben; sobald Erguss kommt, nur noch den Kunststoffkatheter vorschieben und die Stahlnadel zurückziehen","warum":"Der weiche Katheter verletzt die sich entfaltende Lunge nicht. Die Stahlnadel nie zurück in den Katheter schieben, sonst kann sie ihn anschneiden oder abscheren.","q":["bts_verfahren","bts_anhang3"]},{"text":"Dreiwegehahn anschließen, System geschlossen halten und Proben abfüllen: Eiweiß, LDH, Mikrobiologie (bei Infektverdacht zusätzlich Blutkulturflaschen), Zytologie 25 bis 50 ml, Glukose, pH in heparinisierter BGA-Spritze","warum":"Jeder offene Moment lässt Luft in den Pleuraraum. Der pH muss luftdicht und sofort gemessen werden; zu kleine Zytologiemengen senken die Trefferquote.","q":["bts_verfahren","bts_leitlinie"]},{"text":"Therapeutisch: langsam per Spritze oder Schwerkraft in de
