ck: W in V1, M in V6) und MaRRoW (Rechtsschenkelblock: M in V1, W in V6).\n**Wann Notfall:** Ein neuer Linksschenkelblock bei Brustschmerz kann einem Infarkt entsprechen; ein bekannter Block allein ist kein Notfall. Bei Synkope und Block: Bradyarrhythmie abklären.","merkmale":["QRS breiter als 120 ms","P-Welle vor jedem QRS (supraventrikulärer Ursprung)","Regelmäßige Frequenz im Normbereich","Veränderte Endstrecke (ST-Strecke und T-Welle zeigen entgegengesetzt zum QRS)"]},{"id":"f13","bild":{"art":"ekg","rhythmus":"stemi","hf":88,"dauer_s":6,"st":4},"fragetyp":"wahl","frage":"Ein Patient hat seit 40 Minuten Druck auf der Brust. Welche Veränderung zeigt der Streifen?","optionen":[{"text":"Normalbefund ohne Ischämiezeichen","richtig":false},{"text":"ST-Hebung, vereinbar mit STEMI","richtig":true},{"text":"ST-Senkung, vereinbar mit NSTEMI","richtig":false},{"text":"Spitze T-Wellen bei Hyperkaliämie","richtig":false}],"erklaerung":"Die ST-Strecke hebt sich deutlich über die Grundlinie (hier 4 mm) und geht in die T-Welle über. Auf einem Streifen ist das ein Verdacht; gesichert wird der STEMI im 12-Kanal-EKG durch ST-Hebungen in mindestens zwei benachbarten Ableitungen.\n**Eselsbrücke:** Hebung heißt Verschluss: Zeit ist Herzmuskel.\n**Wann Notfall:** Immer. 12-Kanal-EKG, Katheterlabor und Oberarzt sofort informieren, Reperfusion so schnell wie möglich (primäre PCI). Auch nach einer PCI gilt eine neue ST-Hebung mit Brustschmerz als Stentthrombose, bis das Gegenteil bewiesen ist. Differenzialdiagnosen sind Perikarditis, Aneurysma und frühe Repolarisation.","merkmale":["ST-Strecke deutlich über der Grundlinie (hier 4 mm)","Konvexe oder gerade Hebung, oft mit hoher T-Welle","Im 12-Kanal-EKG in benachbarten Ableitungen","Begleitend Brustschmerz, Grundrhythmus meist Sinus"]},{"id":"f14","bild":{"art":"ekg","rhythmus":"asystolie","hf":0,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Monitor zeigt eine Nulllinie. Was tust du zuerst?","optionen":[{"text":"Sofort defibrillieren","richtig":false},{"text":"Atropin 3 mg i.v. geben","richtig":false},{"text":"Patient:in ansprechen, Atmung und Puls prüfen und die Elektroden kontrollieren","richtig":true},{"text":"Den Alarm quittieren und in zehn Minuten wieder nachsehen","richtig":false}],"erklaerung":"Eine Nulllinie ist erst dann eine Asystolie, wenn der Patient geprüft wurde: ansprechen, Atmung und Puls prüfen, Ableitung wechseln, Verstärkung erhöhen, Elektroden kontrollieren. Ist er bewusstlos ohne Puls, beginnt sofort die Reanimation.\n**Eselsbrücke:** Erst Patient:in, dann Gerät.\n**Wann Notfall:** Eine echte Asystolie ist nicht schockbar: Kompressionen und Beatmung, Adrenalin 1 mg so früh wie möglich, dann alle 3 bis 5 Minuten, reversible Ursachen suchen. In der Nulllinie auf P-Wellen achten; sie können ein Hinweis auf einen Rhythmus sein, der auf Stimulation anspricht.","merkmale":["Keine elektrische Aktivität: flache Linie","Nicht schockbar","Artefakt ausschließen: Elektroden, Ableitung, Verstärkung","P-Wellen ohne QRS können auf Stimulation ansprechen"]},{"id":"f15","bild":{"art":"ekg","rhythmus":"pea","hf":60,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Patient ist bewusstlos, es ist kein Puls tastbar. Der Monitor zeigt diesen Rhythmus. Wie nennt man das?","optionen":[{"text":"Normofrequenter Sinusrhythmus, kein Notfall","richtig":false},{"text":"Kammerflimmern","richtig":false},{"text":"Schrittmacherrhythmus","richtig":false},{"text":"Pulslose elektrische Aktivität (PEA)","richtig":true}],"erklaerung":"Elektrische Aktivität im EKG ohne Auswurf und ohne tastbaren Puls: Der Monitor zeigt einen geordneten Rhythmus, aber der Kreislauf steht. Es gilt der Pulscheck, nicht der Monitor.\n**Eselsbrücke:** EKG ja, Puls nein: Reanimation.\n**Wann Notfall:** Immer. Kompressionen, Adrenalin 1 mg so früh wie möglich, Ursachen systematisch suchen: Hypoxie, Hypovolämie, Hyper- oder Hypokaliämie und andere metabolische Störungen, Hypo- oder Hyperthermie (4 H) sowie Thrombose (Lungenembolie, Koronarthrombose), Herzbeuteltamponade, Toxine und Spannungspneumothorax (4 T).","merkmale":["Organisierte elektrische Aktivität im EKG","Kein tastbarer Puls, bewusstlos","Nicht schockbar","Reversible Ursachen (4 H und 4 T) suchen"]},{"id":"f16","bild":{"art":"ekg","rhythmus":"sinus","hf":72,"dauer_s":6,"st":0},"fragetyp":"tippen","frage":"Tippe auf einen QRS-Komplex.","tippen":{"ziel":"qrs"},"erklaerung":"Der QRS-Komplex ist der schmale, steile Ausschlag nach der P-Welle; er zeigt die Erregung der Kammern. Bei 72/min kommt etwa alle 0,8 Sekunden ein Komplex. Jeder QRS-Komplex im Streifen zählt, die App markiert nach der Antwort alle grün.\n**Eselsbrücke:** P kommt zuerst, QRS ist der Berg, T folgt dahinter.\n**Hinweis:** Zum Bestimmen der Frequenz zählst du die QRS-Komplexe im 6-Sekunden-Streifen und multiplizierst mit 10.","merkmale":["QRS: schmaler, steiler Ausschlag","Vor jedem QRS eine P-Welle","Etwa 7 Komplexe in 6 Sekunden"]},{"id":"f17","bild":{"art":"ekg","rhythmus":"sinus_brady","hf":50,"dauer_s":6,"st":0},"fragetyp":"tippen","frage":"Tippe auf eine P-Welle.","tippen":{"ziel":"p"},"erklaerung":"Die P-Welle ist die kleine, runde Welle vor dem QRS-Komplex und zeigt die Erregung der Vorhöfe. Bei der Sinusbradykardie steht sie vor jedem Komplex im gleichen Abstand. Jede P-Welle im Streifen zählt, die App markiert nach der Antwort alle grün.\n**Eselsbrücke:** Erst P, dann QRS: Der Vorhof gibt den Takt vor.\n**Hinweis:** Fehlen P-Wellen (Vorhofflimmern) oder stehen sie ohne feste Beziehung zum QRS (AV-Block III°), muss der Rhythmus anders benannt werden.","merkmale":["P-Welle: kleine, runde Welle vor dem QRS","Konstanter Abstand zwischen P-Welle und QRS","Etwa 5 Komplexe in 6 Sekunden"]},{"id":"f18","bild":{"art":"ekg","rhythmus":"schenkelblock","hf":78,"dauer_s":6,"st":0},"fragetyp":"tippen","frage":"Tippe auf einen QRS-Komplex und achte auf seine Breite.","tippen":{"ziel":"qrs"},"erklaerung":"Der QRS-Komplex ist hier deutlich breiter als normal (über 120 ms, mehr als drei kleine Kästchen bei 25 mm/s) und oft doppelgipfelig. Jeder Komplex im Streifen zählt, die App markiert nach der Antwort alle grün.\n**Eselsbrücke:** Breit mit P davor ist ein Block; breit ohne P und schnell ist eine VT.\n**Wann Notfall:** Ein neuer Schenkelblock mit Brustschmerz oder Synkope braucht ein 12-Kanal-EKG und Abklärung; ein bekannter Block allein nicht.","merkmale":["Breiter QRS-Komplex (über 120 ms)","Oft doppelgipfelig","P-Welle davor, regelmäßige Frequenz"]}]},{"id":"isbar-uebergabe","typ":"isbar","titel":"ISBAR: Übergabe, Notruf und Visite","untertitel":"Strukturiert kommunizieren unter Zeitdruck","gruppe":"Kommunikation","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"30 min","lernziele":["Eine Übergabe in der Reihenfolge Identifikation, Situation, Beurteilung, Aktueller Zustand und Empfehlung aufbauen","Hintergrund (B) und aktuellen Zustand (A) trennen: Was bleibt gleich, was ändert sich in der Nacht?","Einen Notruf an den Oberarzt in 60 Sekunden formulieren und mit einer konkreten Bitte beenden","Bei der Visitenvorstellung Allergien, Antikoagulation, Zugänge, Kreatinin und Code-Status gezielt nennen","Eskalationsschwellen, offene Befunde und Angehörigenwünsche ausdrücklich übergeben"],"quellen":[{"id":"ahrq-sbar","kurz":"AHRQ SBAR","titel":"Tool: SBAR (TeamSTEPPS, Agency for Healthcare Research and Quality)","url":"https://www.ahrq.gov/teamstepps-program/curriculum/communication/tools/sbar.html"},{"id":"haig2006","kurz":"Haig 2006","titel":"SBAR: a shared mental model for improving communication between clinicians (Haig, Sutton, Whittington; Jt Comm J Qual Patient Saf)","url":"https://psnet.ahrq.gov/issue/sbar-shared-mental-model-improving-communication-between-clinicians","stand":"2006"},{"id":"isbar-revisited","kurz":"ISBAR revisited","titel":"ISBAR revisited: Identifying and Solving BARriers to effective clinical handover (Australian Commission on Safety and Quality in Health Care)","url":"https://www.safetyandquality.gov.au/sites/default/files/2020-05/isbar-toolkit.docx"},{"id":"rcuk-als2025","kurz":"RCUK ALS 2025","titel":"Adult advanced life support Guidelines (Resuscitation Council UK, 2025; Instabilitätszeichen, Bradykardie, Atropin)","url":"https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/adult-advanced-life-support-guidelines","stand":"2025"},{"id":"esc-pacing2021","kurz":"ESC Pacing 2021","titel":"2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy (u. a. AV-Block nach TAVI)","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Cardiac-Pacing-and-Cardiac-Resynchronization-Therapy","stand":"2021"},{"id":"esc-af2024","kurz":"ESC VHF 2024","titel":"2024 ESC Guidelines for the management of atrial fibrillation (AF-CARE)","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Atrial-Fibrillation-Management","stand":"2024"}],"moderation":"Impulsfragen für den Präsentationsmodus:\n1. Was ändert sich für die zuhörende Person, wenn die Übergabe mit der Aufnahmegeschichte statt mit dem aktuellen Problem beginnt?\n2. Woran erkennst du, ob eine Information zu B (Hintergrund) oder zu A (aktueller Zustand) gehört? Wo ordnest du „Kreatinin“ ein, wo „Code-Status“?\n3. Welche Bitte formulierst du im Notruf, und woran merkst du, dass dein Gegenüber sie verstanden hat (Closed Loop)?\n4. Welche Information würdest du im Zweifel weglassen, welche nie?\nStolperstellen: Die Zuordnung einzelner Karten (zum Beispiel Zugang, Kreatinin, Code-Status) ist in der Praxis hausspezifisch; entscheidend ist, dass sie vollständig und an vorhersehbarer Stelle genannt werden. Alle Fälle sind fiktiv.","szenarien":[{"titel":"Übergabe an den Nachtdienst","ausgangslage":"Es ist 20:30 Uhr auf der IMC. Du bist im Spätdienst und übergibst Herrn M. an die Kollegin des Nachtdienstes, die ihn nicht kennt. Du hast etwa zwei Minuten für diesen Patienten. Wähle aus, was in die Übergabe gehört, und ordne es den Buchstaben von ISBAR zu.","karten":[{"text":"Herr M., 68 J., Bett 4 (IMC), Name und Geburtsdatum am Armband geprüft","ziel":"I","wichtig":true,"warum":"Zwei Identifikatoren verhindern Verwechslungen, besonders wenn der Nachtdienst den Patienten nicht kennt."},{"text":"Übergeben wird von Dr. K. (Spätdienst), Rückfragen sind bis 21 Uhr über DECT möglich","ziel":"I","wichtig":false,"warum":"Wer übergibt und wie erreichbar ist, gehört zur Identifikation; es ist aber weniger entscheidend als der Patientenname."},{"text":"Seit 14 Uhr neu aufgetretenes Vorhofflimmern mit bis zu 150/min; die Entscheidung zur Antikoagulation ist offen","ziel":"S","wichtig":true,"warum":"Das aktuelle Problem steht am Anfang, damit die übernehmende Person sofort weiß, worauf sie achten muss."},{"text":"Vor 3 Tagen NSTEMI, PCI mit Stent der RCA; seitdem ASS 100 mg und Ticagrelor 2 x 90 mg","ziel":"B","wichtig":true,"warum":"Duale Plättchenhemmung bestimmt die Antikoagulationsentscheidung und das Blutungsrisiko."},{"text":"Allergie: Penicillin (Exanthem)","ziel":"B","wichtig":true,"warum":"Muss vor jeder nächtlichen Antibiotikagabe präsent sein; wird sonst nur in der Akte gefunden, wenn jemand sucht."},{"text":"Code-Status: volle Therapie, keine Limitationen, mit dem Patienten besprochen","ziel":"B","wichtig":true,"warum":"Bei Verschlechterung in der Nacht muss sofort klar sein, was gewollt ist."},{"text":"Vorerkrankungen: arterielle Hypertonie und Typ-2-Diabetes; Metformin seit der Angiographie pausiert","ziel":"B","wichtig":false,"warum":"Relevanter Hintergrund, vor allem das pausierte Metformin nach Kontrastmittel, aber nicht das Hauptproblem der Nacht."},{"text":"Aktuell VHF 98/min (nach Metoprolol 5 mg i.v. um 15:30 Uhr von 150/min gefallen), RR 132/78 mmHg, SpO2 96 % ohne Sauerstoff, beschwerdefrei und orientiert","ziel":"A","wichtig":true,"warum":"Aktuelle Werte, Verlauf und Reaktion auf die Maßnahme sind das Herz des Assessments."},{"text":"Kreatinin 1,4 mg/dl (Aufnahme 1,0 mg/dl) nach Kontrastmittel, Kalium 4,2 mmol/l","ziel":"A","wichtig":true,"warum":"Der Anstieg beeinflusst Dosierungen und Kontrollen; er ist ein aktueller Befund, kein Dauerhintergrund."},{"text":"Zugang: periphere Verweilkanüle rechter Unterarm, Tag 3, Einstichstelle reizlos","ziel":"A","wichtig":true,"warum":"Der Nachtdienst muss wissen, wo ein funktionierender Zugang liegt und wie alt er ist."},{"text":"Stündlich Frequenz und Blutdruck kontrollieren; Oberarzt rufen bei Frequenz über 130/min, systolischem RR unter 100 mmHg oder Brustschmerz","ziel":"R","wichtig":true,"warum":"Konkrete Schwellen machen aus einer Beobachtung einen Handlungsauftrag und senken Unsicherheit nachts."},{"text":"Antikoagulation nicht nachts beginnen; Entscheidung morgen in der Visite mit dem Oberarzt (Blutungsrisiko unter dualer Plättchenhemmung)","ziel":"R","wichtig":true,"warum":"Eine offene Entscheidung muss ausdrücklich zugewiesen werden, sonst wird sie nachts versehentlich getroffen oder vergessen."},{"text":"Um 6 Uhr Kreatinin, Kalium, Magnesium und TSH kontrollieren; das TSH steht noch aus","ziel":"R","wichtig":true,"warum":"Offene Befunde und geplante Kontrollen gehören in die Empfehlung, damit sie nicht verloren gehen."},{"text":"Die Ehefrau möchte bei Verschlechterung auch nachts angerufen werden, die Nummer steht in der Akte","ziel":"R","wichtig":false,"warum":"Angehörigenwünsche sind ein konkreter Auftrag für die Nacht, aber nachrangig gegenüber den medizinischen Schwellen."},{"text":"Vor 20 Jahren Leistenhernien-Operation rechts, komplikationslos","ziel":"-","wichtig":false,"warum":"Alte, folgenlose Operation ohne Einfluss auf die Nacht; gehört in die Akte, nicht in die Übergabe."},{"text":"Das Abendessen kam wegen des späten Essenwagens erst um 19:15 Uhr","ziel":"-","wichtig":false,"warum":"Organisatorisches ohne Folgen für die Behandlung."},{"text":"Der Enkel des Patienten spielt in der Jugendmannschaft Fußball","ziel":"-","wichtig":false,"warum":"Persönliche Details, die die Übergabe verlängern, ohne eine Entscheidung zu verändern."}],"muster":{"I":"Ich übergebe Herrn M., 68 Jahre, Bett 4 auf der IMC; Name und Geburtsdatum habe ich am Armband geprüft.","S":"Er hat seit 14 Uhr neu Vorhofflimmern mit bis zu 150/min; die Entscheidung zur Antikoagulation ist noch offen.","B":"Vor drei Tagen NSTEMI mit Stent der RCA, seitdem ASS und Ticagrelor; Penicillinallergie, volle Therapie, Typ-2-Diabetes mit pausiertem Metformin.","A":"Aktuell VHF 98/min nach Metoprolol i.v., RR 132/78, SpO2 96 % ohne Sauerstoff, beschwerdefrei; Kreatinin 1,4 mg/dl nach Kontrastmittel, Zugang rechter Unterarm, Tag 3.","R":"Bitte stündlich Frequenz und Blutdruck, Oberarzt rufen bei Frequenz über 130/min, systolisch unter 100 mmHg oder Brustschmerz; Antikoagulation morgen in der Visite entscheiden, um 6 Uhr Labor mit TSH; die Ehefrau möchte bei Verschlechterung angerufen werden."},"debriefing":["Die Übergabe folgt immer derselben Reihenfolge, damit die zuhörende Person weiß, wo sie ist. Beginne mit dem Namen und dem aktuellen Problem, nicht mit der Aufnahmegeschichte.","Hintergrund (B) sind Dinge, die sich in der Nacht nicht ändern: Vorerkrankungen, Medikamente, Allergien, Code-Status. Aktueller Zustand (A) sind Werte, Verlauf und Reaktion auf Maßnahmen.","Eine gute Empfehlung nennt konkrete Schwellen (wann rufen), offene Befunde und was bis morgen warten kann. Sie endet mit der Rückfrage: Ist alles klar, was ist offen?","Persönliche Details, alte Operationen und Organisatorisches verlängern die Übergabe, ohne Entscheidungen zu verändern. Sie werden weggelassen oder nur auf Nachfrage genannt."]},{"titel":"Notruf-Telefonat an den Oberarzt (60 Sekunden)","ausgangslage":"Es ist 23:55 Uhr auf der IMC. Du bist die diensthabende Ärztin im Nachtdienst. Herr B. hatte eine Synkope und ist bradykard und hypoton. Der Oberarzt hat Rufbereitschaft, kennt den Patienten nicht und ist gerade aufgewacht. Du hast 60 Sekunden, in denen die entscheidenden Informationen und deine Bitte ankommen müssen.","karten":[{"text":"Hier Dr. L., Nachtdienst Kardiologie auf der IMC; ich rufe wegen Herrn B., 79 J., Bett 2","ziel":"I","wichtig":true,"warum":"Wer ruft, von wo und wegen wem: Der Oberarzt wird aus dem Schlaf geholt und muss sofort zuordnen können."},{"text":"Rückruf bitte über das DECT-Telefon der IMC","ziel":"I","wichtig":false,"warum":"Hilfreich, falls die Verbindung abbricht, aber nicht Teil der ersten Sekunden."},{"text":"Vor 15 Minuten Synkope, jetzt AV-Block III° mit Kammerfrequenz 32/min und RR 78/45 mmHg","ziel":"S","wichtig":true,"warum":"Das Problem in einem Satz mit den Zahlen, die die Dringlichkeit begründen."},{"text":"Ich halte ihn für instabil und rufe Sie deshalb sofort an","ziel":"S","wichtig":false,"warum":"Benennt die eigene Einschätzung und den Grund des Anrufs; sie erklärt die Dringlichkeit, ersetzt aber nicht die Zahlen."},{"text":"Heute Tag 1 nach transfemoraler TAVI; der Schrittmacherdraht wurde gestern Nachmittag entfernt","ziel":"B","wichtig":true,"warum":"Der Eingriff erklärt die wahrscheinliche Ursache und erleichtert dem Oberarzt die Entscheidung für einen temporären Schrittmacher."},{"text":"Vorbestehend Rechtsschenkelblock und AV-Block I°","ziel":"B","wichtig":true,"warum":"Ein Rechtsschenkelblock vor der TAVI ist ein bekannter Risikofaktor für einen höhergradigen AV-Block danach."},{"text":"Code-Status: volle Therapie","ziel":"B","wichtig":true,"warum":"In einer Notfallsituation muss klar sein, dass alle Maßnahmen gewollt sind."},{"text":"Keine Allergien bekannt; ASS 100 mg, keine orale Antikoagulation","ziel":"B","wichtig":true,"warum":"Antikoagulation und Allergien sind für die Anlage eines temporären Schrittmachers unmittelbar relevant."},{"text":"Schläfrig, aber erweckbar, kaltschweißig, SpO2 93 % unter 2 l Sauerstoff, Blutzucker 112 mg/dl","ziel":"A","wichtig":true,"warum":"Bewusstsein, Perfusion und Oxygenierung zeigen, wie instabil er ist; der Blutzucker schließt eine einfache Ursache der Schläfrigkeit aus."},{"text":"Pads sind geklebt, transkutane Stimulation ist vorbereitet, ein peripherer Zugang liegt; Atropin habe ich wegen des breiten Ersatzrhythmus nicht gegeben","ziel":"A","wichtig":true,"warum":"Der Oberarzt muss wissen, was bereits getan wurde, damit nichts doppelt oder gar nicht geschieht."},{"text":"Kalium 4,1 mmol/l, Kreatinin 1,1 mg/dl von heute Mittag","ziel":"A","wichtig":false,"warum":"Nützlich, aber am Telefon nur auf Nachfrage; die Dringlichkeit hängt nicht an diesen Werten."},{"text":"Bitte kommen Sie sofort auf die Station; ich brauche einen temporären Schrittmacher, bitte informieren Sie das Katheterlabor","ziel":"R","wichtig":true,"warum":"Eine konkrete Bitte mit Zeitangabe statt „Was soll ich tun?“ lässt dem Oberarzt keinen Interpretationsspielraum."},{"text":"Bis Sie hier sind, überbrücke ich mit transkutaner Stimulation und melde mich in 5 Minuten oder sofort bei Reanimation wieder","ziel":"R","wichtig":true,"warum":"Sagt, was du bis zum Eintreffen tust, und vereinbart den nächsten Kontakt (Closed Loop)."},{"text":"Die Ehefrau hat am Nachmittag Wäsche gebracht und ist inzwischen nach Hause gefahren","ziel":"-","wichtig":false,"warum":"Kein Einfluss auf die akute Entscheidung; Angehörige werden später informiert."},{"text":"Die Verlegung auf die Normalstation war für Freitag geplant, der Sozialdienst hat die Reha angefragt","ziel":"-","wichtig":false,"warum":"Entlassplanung ist in dieser Minute irrelevant und kostet Zeit."},{"text":"Das Abendessen hat er gestern komplett gegessen, der Appetit war gut","ziel":"-","wichtig":false,"warum":"Ein unauffälliger Verlauf von gestern ersetzt nicht die Information über jetzt."}],"muster":{"I":"Hier Dr. L., Nachtdienst Kardiologie auf der IMC, ich rufe wegen Herrn B., 79 Jahre, Bett 2.","S":"Er hatte vor 15 Minuten eine Synkope und hat jetzt einen AV-Block III° mit Kammerfrequenz 32/min bei RR 78/45; ich halte ihn für instabil.","B":"Heute Tag 1 nach TAVI, vorbestehend Rechtsschenkelblock, Schrittmacherdraht gestern entfernt; keine Allergien, ASS, keine Antikoagulation, volle Therapie.","A":"Er ist schläfrig, kaltschweißig, SpO2 93 % unter 2 l Sauerstoff; Pads sind geklebt, Stimulation vorbereitet, Zugang liegt.","R":"Bitte kommen Sie sofort, ich brauche einen temporären Schrittmacher; bitte informieren Sie das Katheterlabor. Bis dahin stimuliere ich transkutan und melde mich in 5 Minuten wieder."},"debriefing":["Im 60-Sekunden-Anruf zählt jeder Satz: Wer bin ich, was passiert jetzt, was ist im Hintergrund wichtig, wie ist der Zustand, was brauche ich von dir. Laborwerte, Entlassplanung und Details kommen nur auf Nachfrage.","Die Empfehlung ist eine konkrete Bitte mit Zeitangabe („Bitte kommen Sie sofort“), keine offene Frage wie „Was soll ich tun?“. Nenne auch, was du bis zum Eintreffen tust.","Bei Synkope, Frequenz unter 40/min und Hypotonie wird nicht gewartet, bis das Telefonat vorbei ist: Pads kleben, Zugang sichern, Hilfe holen. Die Pflegekraft kann parallel vorbereiten.","Closed Loop: Der Oberarzt wiederholt die Anweisung, du bestätigst, und ihr vereinbart den nächsten Kontakt. So wird aus einem Telefonat eine gemeinsame Absprache."]},{"titel":"Visitenvorstellung am Bett","ausgangslage":"Es ist 9:15 Uhr, Oberarztvisite auf der Normalstation. Du stellst Frau K. am Bett vor, die Patientin hört mit. Du hast ungefähr zwei Minuten. Der Oberarzt kennt die Patientin und will vor allem wissen, was heute entschieden werden muss.","karten":[{"text":"Frau K., 74 J., Bett 7, Tag 4 des Aufenthalts","ziel":"I","wichtig":true,"warum":"Kurze Identifikation für alle am Bett, auch für das Team, das die Patientin nicht täglich sieht."},{"text":"Aufnahme mit kardialer Dekompensation; heute steht die Umstellung von i.v. auf orale Diuretika an","ziel":"S","wichtig":true,"warum":"Aufnahmegrund und heutige Entscheidung zusammen geben dem Oberarzt den Rahmen für alles Weitere."},{"text":"Heutige Frage für die Visite: Ist die Patientin reif für die Entlassplanung?","ziel":"S","wichtig":false,"warum":"Formuliert den Entscheidungsbedarf; nützlich, aber er folgt auch aus der Empfehlung."},{"text":"Ischämische Kardiomyopathie mit EF 30 %, ICD zur Primärprophylaxe, Vorhofflimmern, Niereninsuffizienz Stadium 3","ziel":"B","wichtig":true,"warum":"Die relevanten chronischen Erkrankungen bestimmen jede Therapieentscheidung der Visite."},{"text":"Apixaban 2,5 mg 2 x täglich wegen Vorhofflimmern; Dosisreduktion wegen Gewicht und Kreatinin","ziel":"B","wichtig":true,"warum":"Antikoagulation und Dosis müssen bei Eingriffen, Blutungen und Änderungen der Nierenfunktion immer genannt werden."},{"text":"Allergien: keine bekannt","ziel":"B","wichtig":true,"warum":"Auch ein negativer Befund wird benannt, damit klar ist, dass danach gefragt wurde."},{"text":"Code-Status: Reanimation gewünscht, keine Langzeitbeatmung laut Patientenverfügung","ziel":"B","wichtig":true,"warum":"Bei einer Patientin mit ICD und Herzinsuffizienz ist der Wille zu Reanimation und Beatmung ein zentraler Teil der Planung."},{"text":"Gewicht 58,4 kg (Aufnahme 64,0 kg), Bilanz der letzten 24 Stunden minus 1,2 l, Ödeme nur noch minimal","ziel":"A","wichtig":true,"warum":"Gewicht, Bilanz und Ödeme sind die Kernzahlen für die Beurteilung der Rekompensation."},{"text":"RR 108/64 mmHg, HF 72/min absolut arrhythmisch, SpO2 95 % ohne Sauerstoff, Lunge basal links leises Rasseln","ziel":"A","wichtig":true,"warum":"Vitalzeichen und Auskultation zeigen, ob die Patientin hämodynamisch stabil und respiratorisch frei ist."},{"text":"Kreatinin 1,7 mg/dl (Aufnahme 1,5 mg/dl), Kalium 3,6 mmol/l, NT-proBNP von 8200 auf 3900 ng/l gefallen","ziel":"A","wichtig":true,"warum":"Die Laborwerte zeigen Ansprechen und Nebenwirkungen der Diuretika; das niedrige Kalium löst eine Maßnahme aus."},{"text":"Zugang: Verweilkanüle linker Unterarm, Tag 4, seit heute Rötung an der Einstichstelle","ziel":"A","wichtig":true,"warum":"Eine gerötete Einstichstelle ist ein Infektionsrisiko und muss ausdrücklich benannt werden."},{"text":"Vorschlag: Umstellung auf ein orales Schleifendiuretikum, Kalium oral ersetzen, morgen früh Gewicht, Kreatinin und Kalium kontrollieren","ziel":"R","wichtig":true,"warum":"Die Visite braucht einen konkreten Vorschlag, den der Oberarzt bestätigen oder ändern kann."},{"text":"Die Kanüle ziehe ich heute; bei oraler Therapie ist kein neuer Zugang nötig","ziel":"R","wichtig":false,"warum":"Folgt aus dem Zugangsbefund; sinnvoll, aber nachrangig gegenüber der Medikamenten-Empfehlung."},{"text":"Die Tochter wünscht vor der Entlassung ein Gespräch, ein Termin am Donnerstag ist angefragt","ziel":"R","wichtig":false,"warum":"Angehörigenwunsch mit konkretem nächsten Schritt; gehört in die Empfehlung, wenn Zeit bleibt."},{"text":"Sie trinkt am liebsten Pfefferminztee und mag keinen Kaffee","ziel":"-","wichtig":false,"warum":"Persönliche Vorliebe ohne Einfluss auf die Visitenentscheidung."},{"text":"Früher Lehrerin, zwei Enkelkinder, die sie sonntags besuchen","ziel":"-","wichtig":false,"warum":"Sozialanamnese in dieser Ausführlichkeit gehört nicht in die Visitenvorstellung am Bett."},{"text":"Das Bett wurde heute früh wegen einer defekten Matratze gewechselt","ziel":"-","wichtig":false,"warum":"Organisatorisches ohne Bezug zur Behandlung."}],"muster":{"I":"Frau K., 74 Jahre, Bett 7, Tag 4 des Aufenthalts.","S":"Sie wurde mit kardialer Dekompensation aufgenommen und ist unter i.v.-Diuretika weitgehend rekompensiert; heute steht die Umstellung auf orale Therapie an.","B":"Ischämische Kardiomyopathie mit EF 30 %, ICD, Vorhofflimmern unter Apixaban 2,5 mg 2 x täglich, Niereninsuffizienz; keine Allergien; Reanimation gewünscht, aber keine Langzeitbeatmung laut Patientenverfügung.","A":"Gewicht minus 5,6 kg, Bilanz minus 1,2 l, Ödeme minimal, RR 108/64, HF 72 absolut arrhythmisch, SpO2 95 % ohne Sauerstoff; Kreatinin 1,7 mg/dl, Kalium 3,6 mmol/l; Kanüle links Tag 4 mit Rötung.","R":"Ich schlage ein orales Schleifendiuretikum und Kaliumsubstitution vor, morgen früh Kontrolle von Gewicht, Kreatinin und Kalium; die Kanüle ziehe ich heute. Die Tochter wünscht ein Gespräch vor der Entlassung."},"debriefing":["Am Bett hört die Patientin mit. Formulierungen wie „Code-Status“ oder „Dekompensation“ werden so gewählt, dass sie ohne Angst verständlich bleiben; sensible Themen werden bei Bedarf nach der Visite vertieft.","Die Vorstellung nennt Allergien, Antikoagulation, Zugänge, Kreatinin und Code-Status immer an derselben Stelle. So fällt dem Oberarzt sofort auf, wenn etwas fehlt.","Zahlen mit Verlauf (Gewicht, Kreatinin, NT-proBNP) sind aussagekräftiger als Einzelwerte. Ein Wert wie Kalium 3,6 mmol/l löst eine Maßnahme aus und gehört deshalb in A und R.","Schließe mit einem Vorschlag, nicht mit einer Frage. Der Oberarzt kann ihn bestätigen oder ändern, und die Entscheidung wird nachvollziehbar."]}]},{"id":"triage-alarme","typ":"triage","titel":"Alarm-Triage am Monitor","untertitel":"Wer zuerst? Mehrere Alarme gleichzeitig, wenig Zeit","gruppe":"Monitoring","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"25 min","lernziele":["Alarme nach ABCDE und Zeitkritikalität ordnen: Lebensbedrohung vor Unbequemlichkeit","Instabilitätszeichen bei Brady- und Tachyarrhythmien erkennen (Schock, Synkope, Myokardischämie, Herzinsuffizienz)","Leise Alarme mit gefährlichem Trend erkennen, zum Beispiel langsam fallende SpO2 oder Bradykardie unter Betablocker","Artefaktverdacht (Asystolie-Alarm, lose Elektrode, flache Druckkurve) in Sekunden gegenprüfen, statt ihn zu quittieren oder zu überhören","Bei mehreren Alarmen Hilfe rufen und Erstmaßnahmen delegieren"],"quellen":[{"id":"rcuk-als2025","kurz":"RCUK ALS 2025","titel":"Adult advanced life support Guidelines (Resuscitation Council UK, 2025; Instabilitätszeichen, Bradykardie, Tachykardie mit Puls)","url":"https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/adult-advanced-life-support-guidelines","stand":"2025"},{"id":"erc2025","kurz":"ERC 2025","titel":"European Resuscitation Council Guidelines 2025 (Übersichtsseite mit Kapitel Adult advanced life support)","url":"https://www.erc.edu/science-research/guidelines/guidelines-2025/guidelines-2025-english","stand":"2025"},{"id":"erc2021","kurz":"ERC 2021 ALS","titel":"European Resuscitation Council Guidelines 2021: Adult advanced life support (Soar et al., Resuscitation)","url":"https://doi.org/10.1016/j.resuscitation.2021.02.010","stand":"2021"},{"id":"aha-ecg2017","kurz":"AHA EKG-Monitoring 2017","titel":"Update to Practice Standards for Electrocardiographic Monitoring in Hospital Settings (Sandau et al., Circulation; Indikationen, Alarmmanagement)","url":"https://pubmed.ncbi.nlm.nih.gov/28974521/","stand":"2017"},{"id":"esc-va2022","kurz":"ESC VA 2022","titel":"2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Ventricular-Arrhythmias-and-the-prevention-of-sudden-cardiac-death","stand":"2022"},{"id":"esc-acs2023","kurz":"ESC ACS 2023","titel":"2023 ESC Guidelines for the management of acute coronary syndromes","url":"https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/acute-coronary-syndromes/","stand":"2023"},{"id":"esc-pacing2021","kurz":"ESC Pacing 2021","titel":"2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Cardiac-Pacing-and-Cardiac-Resynchronization-Therapy","stand":"2021"}],"moderation":"Impulsfragen für den Präsentationsmodus:\n1. Welcher Alarm war der lauteste, welcher der gefährlichste? Was sagt die Farbe oder Lautstärke eines Alarms über die Dringlichkeit aus?\n2. Wen rufst du als Erstes an, und was darf die Pflegekraft übernehmen, während du beim ersten Bett bist?\n3. Woran erkennst du an Pleth-Kurve, Puls und Blutdruck, ob eine Asystolie oder ein niedriger Druck echt ist?\n4. Ab wann wird aus einem „stabilen“ Patienten ein instabiler, und welche Zeichen ändern deine Reihenfolge sofort?\nStolperstellen: Die Reihenfolge ist eine Entscheidungshilfe für den ersten Blick, keine starre Regel. Mehrere Rangfolgen können im Team vertretbar sein, wenn sie begründet sind und Instabilität nicht verspätet erkannt wird. Alle Werte sind fiktiv.","szenarien":[{"titel":"Nachtdienst IMC, vier Betten, 3:10 Uhr","einleitung":"Du bist allein als ärztliche Person auf der IMC, die Pflegekraft ist bei einer Neuaufnahme gebunden. Auf dem Zentralmonitor laufen gleichzeitig vier Alarme auf. Lege fest, in welcher Reihenfolge du die Betten ansteuerst, und überlege, was du delegieren kannst.","zeitlimit_s":60,"betten":[{"id":"Bett 1","patient":"Herr D., 59 J., Tag 1 nach Pulmonalvenenisolation bei Vorhofflimmern","alarm":"HF hoch","vitals":{"hf":118,"sys":134,"dia":82,"spo2":96,"af":18},"rhythmus":"sinus_tachy","kurz":"Er ist gerade von der Toilette zurückgekommen, sitzt auf der Bettkante und hat keine Beschwerden.","prioritaet":4,"begruendung":"Erklärbare Belastungstachykardie im Sinusrhythmus bei stabilem Blutdruck und ohne Symptome; der Wert fällt in Ruhe von selbst. Nicht vergessen: Fällt die Frequenz nach 10 Minuten Ruhe nicht ab oder kommen Schmerz oder Blutdruckabfall dazu, neu bewerten und nach Ablation an Perikarderguss und Blutung denken."},{"id":"Bett 2","patient":"Herr K., 71 J., Tag 2 nach Vorderwandinfarkt, EF 35 %","alarm":"VT","vitals":{"hf":168,"sys":84,"dia":52,"spo2":91,"af":22},"rhythmus":"vt","kurz":"Er ist wach, grau im Gesicht und klagt über Druck auf der Brust und Schwindel.","prioritaet":1,"begruendung":"Anhaltende VT mit Hypotonie, Brustschmerz und Schwindel: Es liegen Instabilitätszeichen vor (Schock, Myokardischämie). Das ist eine unmittelbare Lebensbedrohung im Bereich Circulation und erfordert eine synchronisierte Kardioversion; wird er pulslos, beginnt die Reanimation. Sofort Hilfe rufen, Defibrillator und Notfallwagen holen lassen, Analgosedierung vorbereiten."},{"id":"Bett 3","patient":"Frau B., 82 J., dekompensierte Herzinsuffizienz, Tag 2 unter i.v.-Diuretikum","alarm":"SpO2 niedrig","vitals":{"hf":108,"sys":152,"dia":88,"spo2":88,"af":28},"rhythmus":"sinus_tachy","kurz":"Die SpO2 ist seit zwei Stunden von 95 auf 88 % gefallen, der Alarm wurde schon zweimal quittiert; sie sitzt aufrecht und spricht nur noch in kurzen Sätzen.","prioritaet":2,"begruendung":"Kein roter Alarm, aber ein klarer Trend: fallende SpO2, Tachypnoe (28/min), Tachykardie und Sprechdyspnoe sprechen für ein Lungenödem mit drohender respiratorischer Erschöpfung (Airway/Breathing). Wer nur den Momentwert sieht, unterschätzt sie. Sofort Oberkörper hoch, Sauerstoff, Diuretikum, Blutgasanalyse, NIV erwägen; die Pflegekraft kann die ersten Schritte übernehmen, während du bei Bett 2 bist."},{"id":"Bett 4","patient":"Herr R., 66 J., Tag 2 nach elektiver PCI der RCA","alarm":"Asystolie","vitals":{"hf":0,"sys":128,"dia":74,"spo2":97,"af":14},"rhythmus":"asystolie","kurz":"Die Pleth-Kurve läuft regelmäßig mit einem Puls von 62/min weiter, nur die EKG-Linie ist flach; er hat sich vor einer Stunde auf die Seite gedreht und schläft. Der Blutdruck von vor 20 Minuten war unauffällig.","prioritaet":3,"begruendung":"Der Alarm „Asystolie“ ist lebensbedrohlich, wenn er stimmt. Hier widersprechen ihm eine regelmäßige Pleth-Kurve mit Pulsfrequenz, eine normale SpO2 und der letzte Blutdruck; sehr wahrscheinlich ist eine Elektrode abgelöst. Trotzdem wird er nie ungeprüft quittiert: direkt nach den instabilen Betten in Sekunden ansprechen, Puls tasten, Elektroden prüfen und erneuern. Fehlt der Puls, ist es eine Reanimation."}],"debriefing":["Reihenfolge nach ABCDE und Zeitkritikalität: instabile Tachyarrhythmie, dann schleichende respiratorische Verschlechterung, dann Artefaktverdacht, dann erklärbare Belastungsreaktion.","Der lauteste Alarm ist nicht der gefährlichste. Bett 3 hatte nur einen gelben Alarm, aber einen Trend über zwei Stunden. Verläufe lesen, nicht nur Momentwerte.","Priorität heißt nicht, alles allein zu tun: Bei Bett 2 sofort Hilfe und Defibrillator anfordern, bei Bett 3 die Pflegekraft mit Oberkörperhochlagerung und Sauerstoff beginnen lassen.","Ein Asystolie-Alarm mit regelmäßiger Pleth-Kurve ist meist ein Artefakt, wird aber nie ungeprüft quittiert: Patient:in ansehen, Puls tasten, Elektroden erneuern."]},{"titel":"Intensivstation nach dem Herzkathetertag, fünf Betten, 18:20 Uhr","einleitung":"Spätdienst auf der Intensivstation, fünf Patient:innen mit Koronarangiographie oder PCI am heutigen Tag. Du bist die einzige ärztliche Person auf Station, der Oberarzt ist im Haus erreichbar. Fünf Meldungen kommen innerhalb weniger Sekunden: Lege die Reihenfolge fest.","zeitlimit_s":90,"betten":[{"id":"Bett 1","patient":"Herr H., 74 J., persistierendes Vorhofflimmern, Bisoprolol wegen der Untersuchung heute pausiert","alarm":"HF hoch","vitals":{"hf":142,"sys":118,"dia":74,"spo2":96,"af":18},"rhythmus":"vorhofflimmern","kurz":"Er sitzt im Bett, isst sein Abendessen und hat keine Beschwerden.","prioritaet":4,"begruendung":"Bekanntes Vorhofflimmern mit schneller Überleitung, erklärbar durch den pausierten Betablocker, bei stabilem Blutdruck und ohne Instabilitätszeichen. Das ist keine Kardioversion, sondern eine Frage der nächsten Stunde: Betablocker wieder geben, Auslöser wie Schmerz, Volumenmangel, Fieber und Ischämie ausschließen. Wird er symptomatisch oder hypoton, steigt die Priorität sofort."},{"id":"Bett 2","patient":"Frau L., 78 J., 8 Stunden nach diagnostischer Koronarangiographie über die rechte Leiste, ASS und Heparin im Labor","alarm":"RR niedrig","vitals":{"hf":118,"sys":82,"dia":46,"spo2":95,"af":22},"rhythmus":"sinus_tachy","kurz":"Sie klagt über Schmerzen in der rechten Flanke und Übelkeit und ist blass; die Leiste sieht von außen unauffällig aus.","prioritaet":1,"begruendung":"Tachykardie, Hypotonie und Blässe nach arterieller Punktion unter Antikoagulation bedeuten Blutungsschock, bis das Gegenteil bewiesen ist. Ein retroperitoneales Hämatom blutet in die Tiefe; die unauffällige Leiste beruhigt nicht, der Flankenschmerz ist der Hinweis. Sofort: Hilfe, zwei große Zugänge, Volumen, Hb und Kreuzblut, Antikoagulation pausieren, Oberarzt und Bildgebung beziehungsweise Gefäßchirurgie informieren."},{"id":"Bett 3","patient":"Frau S., 70 J., Tag 1 nach PCI der RCX","alarm":"VES häufig","vitals":{"hf":70,"sys":134,"dia":80,"spo2":97,"af":14},"rhythmus":"sinus","kurz":"Etwa 12 VES pro Minute, keine Salven, sie ist beschwerdefrei. Das Kalium von heute Morgen lag bei 3,9 mmol/l, Magnesium wurde nicht bestimmt.","prioritaet":5,"begruendung":"Einzelne VES ohne Salven, ohne Symptome und ohne Kreislaufwirkung sind nach Reperfusion häufig und nicht dringend. Es bleibt eine Aufgabe: Kalium und Magnesium kontrollieren und ausgleichen (Kalium im oberen Normbereich), den Alarm nicht dauerhaft pausieren und bei Salven, R-auf-T oder Symptomen neu bewerten."},{"id":"Bett 4","patient":"Herr W., 63 J., 6 Stunden nach PCI der RCA (Stent), ASS und Ticagrelor","alarm":"ST-Hebung","vitals":{"hf":92,"sys":128,"dia":76,"spo2":97,"af":16},"rhythmus":"stemi","kurz":"Er hat seit 10 Minuten wieder Druck auf der Brust, wie vor der Intervention.","prioritaet":2,"begruendung":"Neuer Brustschmerz mit ST-Hebung wenige Stunden nach Stentimplantation ist eine Stentthrombose, bis das Gegenteil bewiesen ist, und braucht sofort ein 12-Kanal-EKG und die Rücksprache mit dem Herzkatheterlabor. Er ist hämodynamisch stabil und steht deshalb hinter dem Schockbett; das EKG kann die Pflegekraft schreiben, während du bei Bett 2 bist."},{"id":"Bett 5","patient":"Herr N., 58 J., Tag 1 nach Vorderwandinfarkt, arterielle Kanüle links radial","alarm":"ART niedrig","vitals":{"hf":78,"sys":64,"dia":38,"spo2":98,"af":14},"rhythmus":"sinus","kurz":"Die Druckkurve ist flach und ohne dikrotische Kerbe; er liest Zeitung, die Hand ist warm, die NIBP-Messung vor 15 Minuten ergab 126/74 mmHg.","prioritaet":3,"begruendung":"Der Wert passt nicht zum Patienten: warme Hand, normale Herzfrequenz, wach. Wahrscheinlich ist die invasive Messung gedämpft (abgeknickte Leitung, gebeugtes Handgelenk, Luft oder Thrombus in der Leitung). Vor dem Abwinken kommt ein 30-Sekunden-Check: NIBP gegenmessen, Puls tasten, Leitung und Druckbeutel prüfen. Er steht hinter den beiden Kreislaufbetten, aber vor dem stabilen Vorhofflimmern, weil sich hinter dem Wert ein echter Schock verbergen könnte."}],"debriefing":["Zwei Kreislaufprobleme gleichzeitig: Bett 2 (Schock) steht vor Bett 4 (stabile Ischämie). Das 12-Kanal-EKG für Bett 4 wird delegiert und von dir nach wenigen Minuten angesehen.","Nach Katheterzugang denken: Die Blutung kann retroperitoneal liegen. Ein unauffälliger Verband oder eine weiche Leiste schließt sie nicht aus; Flankenschmerz, Tachykardie und Hypotonie sind die Hinweise.","Messwerte, die nicht zum Patienten passen (flache Druckkurve, warme Hand, wach), sind verdächtig auf Messfehler, werden aber in 30 Sekunden gegengeprüft: NIBP, Puls, Patient:in ansehen.","Stabile Rhythmusstörungen wie schnelles Vorhofflimmern oder VES werden behandelt, aber nach den Kreislaufpatient:innen. Sie bleiben auf der Liste und werden neu bewertet."]},{"titel":"Tagdienst zur Übergabezeit, vier Betten, 15:50 Uhr","einleitung":"Früh- und Spätdienst übergeben gerade, der Flur ist voll, das Telefon klingelt, mehrere Kolleg:innen stehen im Dienstzimmer. In dieser Phase gehen Alarme leicht unter oder werden pausiert. Vier Meldungen stehen auf dem Zentralmonitor: Lege die Reihenfolge fest.","zeitlimit_s":60,"betten":[{"id":"Bett 1","patient":"Herr C., 58 J., Tag 2 nach Vorderwandinfarkt","alarm":"VT 5 Schläge","vitals":{"hf":74,"sys":130,"dia":80,"spo2":97,"af":15},"rhythmus":"sinus","kurz":"Eine Salve aus fünf breiten Komplexen, danach wieder Sinusrhythmus; er hat nichts bemerkt und sitzt am Tisch.","prioritaet":3,"begruendung":"Die Salve hat sich von selbst beendet, Kreislauf und Befinden sind unverändert: keine akute Bedrohung. Sie ist aber ein Warnzeichen für elektrische Instabilität in der Frühphase nach Infarkt. Kalium und Magnesium kontrollieren, Ischämie bedenken, Betablocker prüfen, das Ereignis dokumentieren; bei längeren Salven, Symptomen oder Häufung sofort neu bewerten und den Oberarzt informieren."},{"id":"Bett 2","patient":"Herr A., 77 J., Tag 4 nach Hinterwandinfarkt, Niereninsuffizienz (Kreatinin 2,3 mg/dl), Bisoprolol heute früh von 5 auf 10 mg erhöht","alarm":"HF niedrig","vitals":{"hf":38,"sys":78,"dia":44,"spo2":93,"af":16},"rhythmus":"sinus_brady","kurz":"Er liegt ruhig, seine Frau sitzt am Bett; er sagt, er sei „heute so müde“, und antwortet verlangsamt. Der Alarm wurde in der letzten Viertelstunde zweimal pausiert.","prioritaet":1,"begruendung":"Unscheinbar, aber instabil: Bradykardie mit Hypotonie und Vigilanzminderung (Schockzeichen) nach Dosiserhöhung des Betablockers bei eingeschränkter Nierenfunktion. Atropin 500 µg i.v. (wiederholbar bis 3 mg), Betablocker stoppen, 12-Kanal-EKG (AV-Block nach Hinterwandinfarkt?), Stimulation vorbereiten, bei Betablocker-Überdosierung Glukagon erwägen, Oberarzt rufen. Der ruhige Patient ist hier der kränkste."},{"id":"Bett 3","patient":"Herr Z., 62 J., Tag 3 nach Katheterablation","alarm":"EKG-Elektrode lose","vitals":{"hf":72,"sys":136,"dia":82,"spo2":97,"af":14},"rhythmus":"sinus","kurz":"Gelbe technische Meldung, die EKG-Kurve ist verrauscht; er wurde gerade von der Pflegekraft gewaschen und unterhält sich normal.","prioritaet":4,"begruendung":"Reine Technikmeldung ohne Grenzwertverletzung bei einem wachen Patienten. Sie wird nicht ignoriert: Ein verrauschtes EKG kann eine echte Arrhythmie verdecken, und dauerhaft offene Technikalarme fördern Alarmmüdigkeit. Die Pflegekraft erneuert die Elektroden, sobald die kritischen Betten versorgt sind."},{"id":"Bett 4","patient":"Frau F., 73 J., Tag 2 nach NSTEMI, EF 45 %","alarm":"HF hoch","vitals":{"hf":148,"sys":122,"dia":76,"spo2":95,"af":20},"rhythmus":"vorhofflattern","kurz":"Seit 30 Minuten gleichmäßig 148/min, bisher war kein Vorhofflimmern bekannt; sie spürt Herzklopfen, ist sonst beschwerdefrei.","prioritaet":2,"begruendung":"Neue, starre, regelmäßige Tachykardie um 150/min mit schmalen Komplexen: Vorhofflattern mit 2:1-Überleitung, bis das EKG etwas anderes zeigt. Sie ist stabil (kein Schock, keine Ischämiezeichen, keine Herzinsuffizienz), deshalb keine sofortige Kardioversion. Aber 12-Kanal-EKG, Elektrolyte und Ischämie klären und mit dem Oberarzt Frequenzkontrolle oder Kardioversion sowie Antikoagulation planen. Priorität 2, weil sie jederzeit instabil werden kann."}],"debriefing":["Die Übergabezeit ist eine Risikozeit: Alarmtöne werden zum Hintergrundrauschen und pausiert. Wer pausiert, trägt die Verantwortung, nach der Pausenzeit nachzusehen.","Der ruhige Patient kann der kränkste sein. Die Frequenz allein sagt wenig; entscheidend sind Blutdruck, Vigilanz und Perfusion (Instabilitätszeichen: Schock, Synkope, Myokardischämie, Herzinsuffizienz).","Betablocker, Niereninsuffizienz und Dosiserhöhung am selben Tag: Die Medikamentenanamnese gehört zu jeder Bradykardie.","Neue Rhythmusstörungen bei stabilem Kreislauf (Bett 4, Bett 1) kommen nach den instabilen, geraten aber nicht in Vergessenheit: nachverfolgen und dokumentieren."]}]},{"id":"prozedur-arterieller-zugang","typ":"prozedur","titel":"Arterieller Zugang","untertitel":"A. radialis, Druckmesssystem, Nullabgleich und Zugangskontrolle","gruppe":"Prozeduren","reihenfolge":50,"ebene":"oeffentlich","status":"entwurf","dauer":"15 min","lernziele":["Druckmesssystem vorbereiten, luftfrei entlüften und an die Kanüle anschließen","Eine A. radialis ultraschall- oder palpationsgesteuert in direkter oder Seldinger-Technik kanülieren und die Schritte begründen","Druckaufnehmer auf die phlebostatische Achse ausrichten, Nullabgleich und Fast-Flush-Test durchführen","Diskonnektion, Messfehler und Durchblutungsstörungen der Hand erkennen und richtig reagieren"],"quellen":[{"id":"krinko2","kurz":"KRINKO 2017, Teil 2","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 2: Periphervenöse Verweilkanülen und arterielle Katheter. Bundesgesundheitsbl 2017;60:207–215","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil2.pdf?__blob=publicationFile&v=1","stand":"2017"},{"id":"krinko1","kurz":"KRINKO 2017, Teil 1","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 1, Abschnitte 3.3 (Ultraschall) und 3.11 (kathetertypübergreifend: Hubs, Konnektoren)","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1.pdf?__blob=publicationFile&v=3","stand":"2017"},{"id":"saugel","kurz":"Saugel 2020","titel":"Saugel B, Kouz K, Meidert AS, Schulte-Uentrop L, Romagnoli S. How to measure blood pressure using an arterial catheter: a systematic 5-step approach. Crit Care 2020;24:172","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7183114/","stand":"2020"},{"id":"perseus","kurz":"ESAIC PERSEUS 2020","titel":"Lamperti M et al. European Society of Anaesthesiology guidelines on peri-operative use of ultrasound-guided for vascular access (PERSEUS vascular access). Eur J Anaesthesiol 2020;37:344–376","url":"https://doi.org/10.1097/EJA.0000000000001180","stand":"2020"},{"id":"xylocain","kurz":"Fachinfo Xylocain 1 %/2 %","titel":"Fachinformation Xylocain 1 %/2 % Injektionslösung (Lidocainhydrochlorid), Abschnitt 4.2 (Hautquaddel bis 20 mg je Quaddel)","url":"https://www.fachinfo.de/pdf/004674","stand":"Juli 2022"},{"id":"nejm_art","kurz":"NEJM-Video 2006","titel":"Tegtmeyer K et al. Videos in Clinical Medicine: Placement of an arterial line. N Engl J Med 2006;354:e13 (nur weiterführender Link)","url":"https://doi.org/10.1056/NEJMvcm044149","stand":"2006"}],"moderation":"Impulsfragen:\n1. Der Monitor zeigt plötzlich 36/30 mmHg, die Pulsoxymetrie-Kurve ist unverändert. Was ist dein erster Gedanke, und wohin gehst du?\n2. Warum korrigiert ein Nullabgleich keinen Höhenfehler des Druckaufnehmers?\n3. Was spricht gegen den Allen-Test als alleiniges Kriterium vor der Punktion?\n4. Welche A. radialis lässt du bei geplanter Koronarangiographie frei, und wer entscheidet das bei euch?\nStolperstellen: Druckbeutel nicht auf 300 mmHg; Luftblasen im System; Druckaufnehmer nach Umlagerung nicht nachgeführt.","indikationen":["Kontinuierliche Blutdruckmessung bei Schock, Vasopressor- oder Inotropikatherapie oder instabiler Hämodynamik","Häufige arterielle Blutgasanalysen, z. B. bei Beatmung, schwerer Azidose oder respiratorischer Insuffizienz","Häufige Blutentnahmen ohne wiederholte Punktionen","Unzuverlässige nichtinvasive Messung, z. B. bei Arrhythmie, ausgeprägten Ödemen oder nicht pulsatilem Fluss unter mechanischer Kreislaufunterstützung"],"kontraindikationen":["Absolut für den gewählten Ort: lokale Infektion oder Verbrennung, Dialyseshunt am selben Arm sowie fehlender Puls oder verschlossene Arterie im Ultraschall.","Relativ: Gerinnungsstörung oder Antikoagulation, schwere periphere Gefäßerkrankung oder Raynaud-Syndrom, frühere Punktionen mit Hämatom und eine geplante Nutzung dieser A. radialis als Herzkatheterzugang oder Bypassgefäß."],"vorbereitung":["Indikation und Seite festlegen, meist die nicht dominante Hand; klären, welche A. radialis für einen Herzkatheter frei bleiben soll","Aufklärung nach Hausstandard, Gerinnung und Antikoagulation prüfen","Pulse beidseits tasten, A. radialis und A. ulnaris im Ultraschall darstellen (Durchmesser, Verlauf, Verkalkung, Durchgängigkeit)","Druckmesssystem vorbereiten: NaCl 0,9 % ohne Heparin im Druckbeutel auf 300 mmHg, System luftblasenfrei entlüften","Monitor vorbereiten: Druckkanal für die arterielle Kurve aktivieren, passende Skala wählen","Lagerung: Unterarm supiniert, Handgelenk über einer Rolle leicht dorsalflektiert und fixiert"],"material":{"benoetigt":[{"text":"Sterile Handschuhe, Mund-Nasen-Schutz und steriles Lochtuch","warum":"Die KRINKO empfiehlt diese Barriere für periphere arterielle Katheter (Kat. II)."},{"text":"Alkoholisches Hautantiseptikum mit remanentem Wirkstoff (Octenidin oder Chlorhexidin)","warum":"Hautantiseptik ist vor der Anlage Pflicht (Kat. IB); die Kombination mit remanentem Wirkstoff ist sinnvoll (Kat. II)."},{"text":"Arterienkanüle 20 G, mit integriertem Draht oder als Seldinger-Set","warum":"20 G ist für die A. radialis üblich: weniger Komplikationen als 18 G und eine gut auswertbare Kurve. Der Draht hilft bei schwierigen Verhältnissen."},{"text":"Ultraschallgerät mit Linearschallkopf und sterilem Überzug","warum":"Ultraschall erhöht die Erfolgsrate beim ersten Versuch; der Überzug ist nötig, wenn der Schallkopf im Punktionsfeld liegt."},{"text":"Druckmesssystem: Druckaufnehmer mit Spülvorrichtung, druckstabile Leitung, Dreiwegehahn","warum":"Nur druckstabile, kurze Leitungen mit wenigen Hähnen geben die Kurve unverfälscht wieder."},{"text":"NaCl 0,9 % (500 ml) ohne Heparin im Druckbeutel","warum":"Der Druckbeutel auf 300 mmHg verhindert Blutrückfluss und hält die Flüssigkeitssäule stabil; Heparinzusatz wird wegen des HIT-Risikos nicht empfohlen."},{"text":"Lokalanästhetikum, z. B. Lidocain 1 %, 1 bis 2 ml als Hautquaddel","warum":"Reicht für die oberflächliche Punktion; die Fachinformation nennt bis 20 mg (2 ml 1 %) je Quaddel."},{"text":"Handgelenksrolle und Pflaster","warum":"Leichte Dorsalflexion streckt die Arterie und bringt sie näher an die Haut."},{"text":"Fixierung (Naht oder Fixierpflaster) und steriler Transparentverband","warum":"Auch arterielle Katheter sollen steril verbunden werden (Kat. II); sichere Fixierung verhindert Dislokation und Diskonnektion."},{"text":"Rote Kennzeichnung für die arterielle Leitung","warum":"Schützt vor versehentlicher intraarterieller Injektion."}],"ablenker":[{"text":"Heparinhaltige Spüllösung","warum_nicht":"Wird wegen des Risikos einer heparininduzierten Thrombozytopenie nicht empfohlen; NaCl 0,9 % genügt."},{"text":"Normale, dehnbare Infusionsleitung oder lange Verlängerungen als Druckleitung","warum_nicht":"Weiche oder lange Leitungen verfälschen die Kurve; nur druckstabile Leitungen des Messsystems verwenden."},{"text":"Arterienkanüle 18 G für die A. radialis","warum_nicht":"Größer als nötig, mehr Komplikationen und eher unterdämpfte Kurven; 20 G ist der Standard."},{"text":"Zuspritzventil für Medikamente am arteriellen System","warum_nicht":"Lädt zur versehentlichen intraarteriellen Injektion ein; am arteriellen System werden keine Medikamente gegeben."},{"text":"Steriler Kittel, Haube und großes Abdecktuch für die A. radialis","warum_nicht":"Für die A. radialis empfiehlt die KRINKO Lochtuch, sterile Handschuhe und Mund-Nasen-Schutz; maximale Barriere ist beim femoralen Zugang zu erwägen."},{"text":"Stauschlauch am Oberarm","warum_nicht":"Eine Arterie wird nicht gestaut; die Stauung verschlechtert eher die Darstellung und den Puls."}]},"schritte":[{"text":"Indikation, Seite und Technik festlegen (direkte Punktion oder Seldinger); Material vollständig richten","warum":"Bei Ödem, Adipositas oder nach Fehlversuchen hat die Technik mit Draht die höhere Erfolgsrate.","q":["saugel"]},{"text":"Druckmesssystem vorbereiten: NaCl-Beutel ohne Heparin, Druckbeutel auf 300 mmHg, System luftblasenfrei entlüften","warum":"Luftblasen dämpfen die Kurve und sind ein Embolierisiko; ohne 300 mmHg läuft Blut in die Leitung zurück.","q":["saugel"]},{"text":"Pulse tasten, A. radialis im Ultraschall darstellen; Allen-Test nicht als alleiniges Kriterium","warum":"Der Allen-Test sagt ischämische Komplikationen schlecht voraus; der Ultraschall zeigt Durchmesser, Verlauf und Verkalkung.","q":["saugel"]},{"text":"Hand lagern: Unterarm supiniert, Handgelenk leicht dorsalflektiert über einer Rolle, fixiert","warum":"Die Arterie wird gestreckt und oberflächlicher; eine ruhige Hand erleichtert die Punktion.","q":["saugel"]},{"text":"Hygienische Händedesinfektion, Mund-Nasen-Schutz, sterile Handschuhe","warum":"Barriere für periphere arterielle Katheter nach KRINKO (Kat. II).","q":["krinko2"]},{"text":"Hautantiseptik mit alkoholischem Präparat mit remanentem Wirkstoff, Einwirkzeit abwarten, steriles Lochtuch, Schallkopf steril beziehen","warum":"Infektionsraten arterieller Katheter sind ähnlich denen von ZVK; der Schallkopf im Punktionsfeld braucht einen sterilen Überzug.","q":["krinko2","krinko1"]},{"text":"Kleine Hautquaddel mit 1 bis 2 ml Lidocain 1 %","warum":"Schmerz führt zu Bewegung und Gefäßspasmus; mehr Volumen würde den Puls verdecken.","q":["xylocain"]},{"text":"Punktion möglichst distal, etwa 1 bis 2 cm proximal der Handgelenksfalte, im Winkel von 30 bis 45°, unter Ultraschall oder Palpation","warum":"Distal beginnen lässt bei Fehlversuch Raum nach proximal; Ultraschall verbessert die Erfolgsrate beim ersten Versuch.","q":["saugel","perseus"]},{"text":"Bei pulsierendem Rückfluss: direkte Technik Winkel auf 10 bis 15° senken, minimal nachschieben, Kunststoffkanüle vorschieben; Seldinger: Draht widerstandsfrei einführen, Kanüle darüber","warum":"Beim ersten Rückfluss liegt oft nur die Nadelspitze im Gefäß, die Kunststoffkanüle noch nicht.","q":["saugel"]},{"text":"Nadel oder Draht entfernen, Arterie proximal abdrücken, Druckleitung luftfrei anschließen","warum":"Das Abdrücken verhindert Blutverlust beim Konnektieren; Luft im System verfälscht die Kurve.","q":["saugel"]},{"text":"Arterielle Kurve prüfen, spülen, Kanüle fixieren, steril verbinden, Leitung rot kennzeichnen","warum":"Eine typische Kurve bestätigt die Lage; Fixierung und Kennzeichnung schützen vor Diskonnektion und Fehlinjektion.","q":["krinko2","saugel"]},{"text":"Druckaufnehmer auf Höhe der phlebostatischen Achse fixieren (4. ICR, mittlere Axillarlinie)","warum":"Jede Höhendifferenz verfälscht die Werte: 10 cm entsprechen etwa 7,5 mmHg.","q":["saugel"]},{"text":"Nullabgleich: Hahn zum Patienten schließen, zur Luft öffnen, am Monitor nullen, Hahn zurückdrehen","warum":"Der Nullabgleich setzt den Atmosphärendruck als Referenz und gleicht die Drift des Druckaufnehmers aus.","q":["saugel"]},{"text":"Fast-Flush-Test: Spülung kurz auslösen und die Nachschwingungen beurteilen","warum":"Wenige, rasch abklingende Schwingungen zeigen ein adäquat gedämpftes System; keine Schwingung spricht für Überdämpfung, viele für Unterdämpfung.","q":["saugel"]},{"text":"Zugangskontrolle und Dokumentation: Durchblutung der Hand, Einstichstelle, feste Konnektionen, Alarmgrenzen; Ort, Größe und Datum notieren","warum":"Ischämie, Blutung und Diskonnektion werden früh erkannt; nicht mehr benötigte Katheter sind sofort zu entfernen.","q":["krinko2","saugel"]}],"komplikationen":[{"titel":"Durchblutungsstörung der Hand","erkennen":"Blasse, kühle oder marmorierte Finger, Schmerz, verlängerte Rekapillarisierung distal der Kanüle.","handeln":"Kanüle sofort entfernen, Hand warm und tief lagern, Oberärzt:in und Gefäßchirurgie hinzuziehen, Duplex-Sonographie."},{"titel":"Diskonnektion mit Blutverlust","erkennen":"Plötzlich flache Kurve oder Alarm „Druck niedrig“ bei unverändertem EKG und SpO2, Blut im Bett.","handeln":"Sofort ans Bett, Blutung stoppen (proximal abdrücken, Hahn zu), System steril erneuern, neu nullen; Blutverlust abschätzen, Hb kontrollieren."},{"titel":"Gedämpfte oder falsche Messwerte","erkennen":"Überdämpfung: verwaschene Kurve ohne Inzisur, Systole zu niedrig, Diastole zu hoch. Unterdämpfung: spitze Systole, Systole zu hoch. Höhenfehler: alle Werte gleichmäßig verschoben.","handeln":"Luftblasen und Gerinnsel entfernen, Knick am Handgelenk beheben, Druckbeutel auf 300 mmHg, Druckaufnehmer auf Herzhöhe, neu nullen, Fast-Flush-Test; Werte mit nichtinvasiver Messung abgleichen."},{"titel":"Versehentliche intraarterielle Injektion","erkennen":"Brennender Schmerz, Blässe oder Marmorierung der Hand direkt nach einer Injektion.","handeln":"Injektion sofort stoppen, Kanüle zunächst belassen, sofort Oberärzt:in und Gefäßchirurgie informieren; vorbeugend Leitung rot kennzeichnen und kein Zuspritzventil verwenden."},{"titel":"Hämatom, Blutung oder Pseudoaneurysma","erkennen":"Schwellung an der Einstichstelle, Nachblutung, später pulsierende Schwellung.","handeln":"Komprimieren, Gerinnung prüfen; bei pulsierender Schwellung Duplex-Sonographie und Gefäßchirurgie."},{"titel":"Katheterassoziierte Infektion","erkennen":"Rötung, Eiter an der Einstichstelle, Fieber oder Bakteriämie ohne andere Quelle.","handeln":"Katheter entfernen, Blutkulturen, ggf. Katheterspitze einschicken; neuen Zugang an anderer Stelle."}],"nachsorge":["Druckaufnehmer bei jeder Lageänderung auf die phlebostatische Achse nachführen und neu nullen","Druckbeutel regelmäßig auf 300 mmHg kontrollieren, System luftblasenfrei halten","Hand und Einstichstelle mehrmals pro Schicht kontrollieren; Alarmgrenzen für die arterielle Kurve aktiv lassen","Vor Blutentnahmen die Membran desinfizieren; geschlossene Entnahmesysteme sind offenen vorzuziehen","Verbandswechsel nach denselben Prinzipien wie beim ZVK; Wechselintervall des Druckmesssystems nach Herstellerangabe","Nicht mehr benötigte arterielle Katheter umgehend entfernen und danach ausreichend lange komprimieren, unter Antikoagulation länger"],"uebungen":[{"titel":"Alarm „ART niedrig“ in der Nacht","patient":{"kurz":"Herr T., 63 J.","alter":63,"geschlecht":"m","gewicht_kg":88,"groesse_cm":180,"vorgeschichte":"Tag 1 nach Reanimation bei Kammerflimmern, beatmet, Noradrenalin; arterieller Zugang A. radialis links seit gestern."},"start":{"zeit":"Minute 0","vitals":{"hf":88,"sys":112,"dia":64,"spo2":97,"af":14,"temp":36.2},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Nachtdienst","text":"Es ist 3:10 Uhr. Herr T. wurde vor zehn Minuten umgelagert und ist seither unruhig. Der Monitor alarmiert.","effekt":{"vitals":{"sys":36,"dia":30},"alarm":"ART niedrig"},"weiter":"k2"},{"id":"k2","typ":"wahl","zeit":"Minute 1","frage":"Die arterielle Kurve ist fast flach bei 36/30 mmHg, EKG und Pulsoxymetrie-Kurve sind unverändert. Was tust du?","optionen":[{"id":"a1","text":"Sofort ans Bett: Patient, Arm, Leitung und alle Konnektionen ansehen","bewertung":"richtig","feedback":"Richtig. Flache Kurve bei unveränderter Pulsoxymetrie spricht für ein Problem am Messsystem, zum Beispiel eine Diskonnektion. Das muss man sehen, nicht vermuten.","q":["saugel"],"weiter":"k3"},{"id":"a2","text":"Alarm stummschalten; bei regelmäßiger SpO2-Kurve ist das sicher ein Artefakt","bewertung":"falsch","feedback":"Gefährlich. Auch ein Artefakt hat eine Ursache, und die häufigste nach Umlagerung ist eine gelöste Leitung, aus der es blutet.","weiter":"k5"},{"id":"a3","text":"Noradrenalin sofort deutlich erhöhen","bewertung":"falsch","feedback":"Erst prüfen. Wer eine falsche Zahl behandelt, riskiert hypertensive Spitzen, und die eigentliche Ursache bleibt unentdeckt. Du gehst ans Bett.","weiter":"k3"}],"weiter":"k3"},{"id":"k3","typ":"info","zeit":"Minute 2","text":"Am Bett: Was schaust du dir an?","optionen":[{"id":"o1","label":"Arm unter der Decke","ergebnis":"Die Druckleitung hat sich von der Kanüle gelöst. Das Laken ist blutgetränkt (geschätzt 200 ml), aus dem offenen Kanülenansatz läuft Blut."},{"id":"o2","label":"Puls am anderen Arm und Rekapillarisierung","ergebnis":"Puls kräftig, Rekapillarisierung unter 2 s."},{"id":"o3","label":"Nichtinvasive Blutdruckmessung","ergebnis":"108/62 mmHg."},{"id":"o4","label":"Druckbeutel","ergebnis":"300 mmHg, Beutel halb voll."}],"pflicht":["o1"],"weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Minute 3","frage":"Welche Maßnahmen sind jetzt richtig?","optionen":[{"id":"m1","text":"Blutung sofort stoppen: Arterie proximal abdrücken, Kanülenansatz verschließen","richtig":true,"feedback":"Ja. Aus einer offenen arteriellen Kanüle geht schnell viel Blut verloren."},{"id":"m2","text":"Das im Bett liegende Leitungsende nicht wieder aufstecken, sondern steril erneuern oder Kanüle nach Hausstandard wechseln","richtig":true,"feedback":"Ja. Das Ende lag ungeschützt im Bett und ist kontaminiert."},{"id":"m3","text":"Nach dem Anschluss Druckaufnehmer auf Herzhöhe bringen, neu nullen und Fast-Flush-Test machen","richtig":true,"feedback":"Ja. Erst dann sind die Werte wieder verlässlich."},{"id":"m4","text":"Hb kontrollieren, Blutverlust dokumentieren, Luer-Lock-Verbindungen festziehen und Leitung zugentlastet führen","richtig":true,"feedback":"Ja. So wiederholt sich das nicht bei der nächsten Umlagerung."},{"id":"m5","text":"Den ART-Alarm für die Nacht ausschalten, die nichtinvasive Messung reicht","richtig":false,"feedback":"Nein. Der Alarm hat die Blutung aufgedeckt; ohne ihn wäre sie erst viel später aufgefallen."}],"weiter":"k6"},{"id":"k5","typ":"text","zeit":"Minute 25","titel":"Bei der nächsten Runde","text":"Die Pflege findet eine Blutlache unter dem linken Arm, die Leitung hängt lose neben der Kanüle. Herr T. ist blass, die nichtinvasive Messung zeigt 84/48 mmHg.","effekt":{"vitals":{"hf":124,"sys":84,"dia":48,"spo2":95},"alarm":"HF hoch"},"weiter":"k7"},{"id":"k6","typ":"ende","titel":"Diskonnektion rechtzeitig gefunden","text":"Nach steriler Erneuerung des Systems, Nullabgleich und Fast-Flush-Test zeigt die Kurve wieder 106/60 mmHg. Der Hb ist leicht gefallen, eine Transfusion ist nicht nötig.","lernpunkte":["Flache arterielle Kurve bei unveränderter Pulsoxymetrie: zuerst an Messsystem und Diskonnektion denken und sofort ans Bett gehen.","Nach jeder Umlagerung Leitung, Konnektionen und Höhe des Druckaufnehmers prüfen.","Nach Wiederanschluss neu nullen und den Fast-Flush-Test machen."]},{"id":"k7","typ":"wahl","zeit":"Minute 26","frage":"Was tust du jetzt?","optionen":[{"id":"b1","text":"Blutung stoppen, Oberärzt:in informieren, Volumen, Hb und Kreuzblut, System steril erneuern und neu nullen","bewertung":"richtig","feedback":"Richtig. Blutung stoppen und Volumen ersetzen haben Vorrang; danach wird das System wiederhergestellt.","effekt":{"vitals":{"hf":108,"sys":96,"dia":56}}},{"id":"b2","text":"Noradrenalin erhöhen und das Laken wechseln","bewertung":"falsch","feedback":"Nein. Die Hypotonie ist Folge des Blutverlusts; Katecholamine verdecken ihn nur, und die Kanüle blutet weiter."}],"weiter":"k8"},{"id":"k8","typ":"ende","titel":"Blutverlust durch übersehene Diskonnektion","text":"Herr T. braucht zwei Erythrozytenkonzentrate. Bei der Fallbesprechung wird der stummgeschaltete Alarm als Hauptursache benannt.","lernpunkte":["Alarme der arteriellen Kurve nie ungeprüft quittieren oder stummschalten.","Eine gelöste arterielle Leitung kann in Minuten einen relevanten Blutverlust verursachen.","Luer-Lock-Verbindungen fest und die Leitung zugentlastet führen, besonders bei unruhigen Patient:innen."]}]},{"titel":"Gute Werte nach der Umlagerung","patient":{"kurz":"Frau S., 79 J.","alter":79,"geschlecht":"w","gewicht_kg":61,"groesse_cm":160,"vorgeschichte":"NSTEMI mit kardiogenem Schock, Noradrenalin, Ziel-MAP mindestens 65 mmHg; arterieller Zugang A. radialis rechts."},"start":{"zeit":"Minute 0","vitals":{"hf":86,"sys":112,"dia":66,"spo2":95,"af":18,"temp":36.8},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Frage der Pflege","text":"Frau S. wurde für das Röntgen aufgesetzt und danach wieder flach gelagert. Der Druckaufnehmer hängt seitdem am unteren Bettgitter. Der Monitor zeigt 112/66 mmHg, MAP 81. Die Pflege fragt, ob sie das Noradrenalin reduzieren soll.","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 1","text":"Was prüfst du, bevor du entscheidest?","optionen":[{"id":"o1","label":"Höhe des Druckaufnehmers","ergebnis":"Er hängt etwa 20 cm unterhalb der phlebostatischen Achse (4. ICR, mittlere Axillarlinie).","q":["saugel"]},{"id":"o2","label":"Nichtinvasive Messung am anderen Arm","ergebnis":"96/54 mmHg, MAP 68."},{"id":"o3","label":"Fast-Flush-Test","ergebnis":"Ein bis zwei rasch abklingende Nachschwingungen: Das System ist adäquat gedämpft.","q":["saugel"]},{"id":"o4","label":"Klinik","ergebnis":"Unterschenkel kühl, Rekapillarisierung 3 s, Urin 20 ml in der letzten Stunde."}],"pflicht":["o1"],"weiter":"k3"},{"id":"k3","typ":"zahl","zeit":"Minute 2","frage":"Um wie viel mmHg zeigt der Monitor bei 20 cm Höhendifferenz ungefähr zu viel an?","einheit":"mmHg","min":0,"max":40,"schritt":1,"start":0,"zielbereich":[13,17],"feedback_ok":"Richtig. 10 cm Höhendifferenz entsprechen etwa 7,5 mmHg; bei 20 cm liest der Monitor rund 15 mmHg zu hoch, für Systole, Diastole und MAP gleichermaßen.","feedback_zu_niedrig":"Zu wenig. Faustregel: 10 cm entsprechen etwa 7,5 mmHg; 20 cm also rund 15 mmHg.","feedback_zu_hoch":"Zu viel. Faustregel: 10 cm entsprechen etwa 7,5 mmHg; 20 cm also rund 15 mmHg.","weiter":"k4"},{"id":"k4","typ":"wahl","zeit":"Minute 3","frage":"Wie gehst du vor?","optionen":[{"id":"a1","text":"Druckaufnehmer auf die phlebostatische Achse bringen, Nullabgleich wiederholen, dann über das Noradrenalin entscheiden","bewertung":"richtig","feedback":"Richtig. Erst die korrekte Messung, dann die Therapieentscheidung. Der tatsächliche MAP liegt um 66 mmHg, also knapp im Ziel.","q":["saugel"]},{"id":"a2","text":"Noradrenalin reduzieren, der MAP liegt mit 81 mmHg deutlich über dem Ziel","bewertung":"falsch","feedback":"Nein. Der Wert ist um rund 15 mmHg zu hoch; eine Reduktion brächte Frau S. unter das Ziel. Das Team korrigiert zuerst die Höhe."},{"id":"a3","text":"Nur den Nullabgleich am Bettgitter wiederholen","bewertung":"falsch","feedback":"Reicht nicht. Der Nullabgleich setzt nur den Bezug zur Atmosphäre; solange der Druckaufnehmer 20 cm zu tief hängt, bleibt der Höhenfehler bestehen."}],"weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 5","effekt":{"vitals":{"sys":97,"dia":51}},"frage":"Nach Korrektur der Höhe zeigt der Monitor 97/51 mmHg (MAP 66). Welche Ursachen verfälschen eine arterielle Kurve außerdem typischerweise?","optionen":[{"id":"m1","text":"Luftblasen im System","richtig":true,"feedback":"Ja. Sie dämpfen die Kurve: Systole zu niedrig, Diastole zu hoch."},{"id":"m2","text":"Druckbeutel unter 300 mmHg","richtig":true,"feedback":"Ja. Die Spülung reicht nicht, Blut steigt in die Leitung, die Kurve wird gedämpft."},{"id":"m3","text":"Abgeknickte Kanüle bei gebeugtem Handgelenk","richtig":true,"feedback":"Ja. Ein typischer Grund für eine plötzlich verwaschene Kurve."},{"id":"m4","text":"Gerinnsel an der Kanülenspitze","richtig":true,"feedback":"Ja. Führt zur Überdämpfung, lässt sich oft durch Aspiration und Spülen beheben."},{"id":"m5","text":"Lange, dehnbare Zusatzleitungen und viele Dreiwegehähne","richtig":true,"feedback":"Ja. Sie verändern die Schwingungseigenschaften des Systems."},{"id":"m6","text":"Sinusrhythmus","richtig":false,"feedback":"Nein. Ein regelmäßiger Rhythmus stört die Messung nicht."},{"id":"m7","text":"Flache Rückenlage der Patientin","richtig":false,"feedback":"Nein. Entscheidend ist die Höhe des Druckaufnehmers relativ zum Herzen, nicht die Lage an sich."}],"weiter":"k6"},{"id":"k6","typ":"ende","titel":"Messfehler erkannt","text":"Das Noradrenalin bleibt unverändert, der MAP hält sich um 66 mmHg. Die Pflege markiert die phlebostatische Achse am Thorax.","lernpunkte":["Vor jeder Therapieentscheidung nach invasivem Blutdruck: Höhe des Druckaufnehmers, Nullabgleich und Kurvenqualität prüfen.","Faustregel: 10 cm Höhendifferenz entsprechen etwa 7,5 mmHg. Druckaufnehmer zu tief bedeutet zu hohe Werte.","Der Nullabgleich korrigiert keinen Höhenfehler; der zur Luft geöffnete Hahn muss auf der phlebostatischen Achse liegen.","Unplausible Werte immer mit nichtinvasiver Messung und Klinik abgleichen."]}]}]},{"id":"prozedur-aszitespunktion","typ":"prozedur","titel":"Aszitespunktion","untertitel":"Diagnostisch und therapeutisch (Parazentese), ultraschallgesteuert","gruppe":"Prozeduren","reihenfolge":40,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Indikationen der diagnostischen und therapeutischen Aszitespunktion benennen und Kontraindikationen einschließlich Antikoagulation prüfen","Punktionsort sonografisch mit Farbdoppler wählen und die Z-Technik anwenden","Proben richtig verarbeiten: Zellzahl mit Differenzierung, Blutkulturflaschen am Bett, Gesamteiweiß, SAAG","Albumindosis nach großvolumiger Parazentese berechnen und die Gabe sicherstellen","Kardialen von zirrhotischem Aszites anhand von SAAG und Gesamteiweiß unterscheiden"],"quellen":[{"id":"dgvs","kurz":"DGVS S2k 2019","titel":"Aktualisierte S2k-Leitlinie „Komplikationen der Leberzirrhose“ der DGVS, AWMF 021-017 (Gerbes AL, Labenz J et al., Z Gastroenterol 2019;57:611–680)","url":"https://doi.org/10.1055/a-0873-4658","stand":"Version 2.0 (11/2018), publiziert 2019"},{"id":"easl","kurz":"EASL CPG 2018","titel":"EASL Clinical Practice Guidelines for the management of patients with decompensated cirrhosis (J Hepatol 2018;69:406–460)","url":"https://doi.org/10.1016/j.jhep.2018.03.024","stand":"2018"},{"id":"bsg","kurz":"BSG/BASL 2020","titel":"Guidelines on the management of ascites in cirrhosis (Aithal GP et al., Gut 2021;70:9–29)","url":"https://doi.org/10.1136/gutjnl-2020-321790","stand":"2020"},{"id":"shm","kurz":"SHM 2019","titel":"Recommendations on the use of ultrasound guidance for adult abdominal paracentesis: a position statement of the Society of Hospital Medicine (Cho J et al., J Hosp Med 2019;14:E7–E15)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8021127/","stand":"2019"},{"id":"uw","kurz":"Hepatitis C Online 2024","titel":"Diagnosis and Management of Ascites (Price J), Hepatitis C Online, University of Washington","url":"https://www.hepatitisc.uw.edu/go/management-cirrhosis-related-complications/ascites-diagnosis-management/core-concept/all","stand":"2024"},{"id":"nejm_video","kurz":"NEJM Video 2006","titel":"Videos in Clinical Medicine: Paracentesis (Thomsen TW et al., N Engl J Med 2006;355:e21), nur als weiterführender Link","url":"https://doi.org/10.1056/NEJMvcm062234","stand":"2006"}],"moderation":"Impulsfragen: (1) INR 1,9 und Thrombozyten 50.000/µl: Gibst du vor der Punktion FFP oder Thrombozyten? Warum nicht? (2) SAAG 1,6 g/dl, Gesamteiweiß 3,2 g/dl, gestaute Lebervenen: welche Ursache, und was folgt daraus für die Therapie? (3) 7 l abgelassen: Wie viel Albumin, und wann? (4) Gilt die Albuminregel aus der Zirrhose auch für kardialen Aszites?\nStolperstellen: Albumin angeordnet, aber nicht gegeben; Blutkulturflaschen erst im Labor beimpft; Punktion paramedian durch die Rektusscheide; Serum-Albumin nicht am selben Tag bestimmt. Kontrast zur Pleura: Bei der Pleurapunktion gilt ein Richtwert von etwa 1,5 l pro Sitzung, bei der Parazentese wird möglichst vollständig entlastet und ab 5 l Albumin gegeben.","indikationen":["Diagnostisch: jeder neu aufgetretene Aszites, um die Ursache zu klären (portal-hypertensiv, kardial, maligne, entzündlich)","Diagnostisch bei bekannter Zirrhose: stationäre Aufnahme, Verschlechterung oder Komplikationen (Fieber, Bauchschmerz, Enzephalopathie, Nierenfunktionsverschlechterung, GI-Blutung) zum Ausschluss einer SBP","Therapeutisch (Parazentese): großer, gespannter Aszites mit Beschwerden (Spannungsgefühl, Dyspnoe, Völlegefühl) und refraktärer Aszites","Kardiologischer Kontext: Aszites bei Rechtsherzversagen oder schwerer Trikuspidalinsuffizienz einordnen (SAAG und Gesamteiweiß) und bei relevanten Beschwerden trotz Rekompensation entlasten"],"kontraindikationen":["Absolut: fehlende Einwilligung, kein sicherer Zugangsweg zum Aszites oder keine diagnostische bzw. therapeutische Konsequenz.","Relativ: DIC oder Hyperfibrinolyse, Hautinfektion am Punktionsort, stark geblähter Darm, Schwangerschaft, unkooperative Person; Narben und Bauchwandkollateralen im Stichweg werden sonografisch umgangen."],"vorbereitung":["Aufklärung und Einwilligung: Blutung, Aszitesleckage, Infektion, Darmverletzung, Kreislaufreaktion","Gerinnung: keine routinemäßige Messung und keine prophylaktische Gabe von FFP oder Gerinnungsfaktoren, unabhängig vom INR; Ausnahme DIC. Eine Thrombozytentransfusion nur bei unter 20.000/µl erwägen","Medikation: ASS weiterführen; Thienopyridine und GP-IIb/IIIa-Hemmer pausieren; VKA und DOAK wenn möglich pausieren. Bei Dringlichkeit (z. B. SBP-Verdacht) unter laufender Medikation punktieren und über das höhere Blutungsrisiko aufklären","Kardiologisch: Bei Koronarstent, mechanischer Klappe oder Vorhofflimmern mit hohem Embolierisiko das Pausieren gemeinsam mit der Kardiologie festlegen","Labor am selben Tag: Serum-Albumin (für den SAAG), Kreatinin, Natrium, Blutbild; Ausgangswerte für RR, HF und Gewicht dokumentieren","Bei geplanter großvolumiger Entlastung Albumin 20 % vorab anordnen und bereitstellen","Rolle der PJ-Studierenden: Lagerung, Monitoring, steriles Anreichen, Proben und Volumenbilanz; punktiert wird nur nach Ausbildung und unter Aufsicht"],"material":{"benoetigt":[{"text":"Ultraschallgerät mit Konvexsonde und Farbdoppler","warum":"Bestimmt Menge, Zugangsweg und Abstand zu Darm und Organen; der Farbdoppler zeigt Bauchwandgefäße (A. epigastrica inferior, Kollateralen) im geplanten Stichweg."},{"text":"Hautantiseptikum, sterile Handschuhe, steriles Lochtuch, sterile Kompressen","warum":"Die Parazentese ist ein invasiver Eingriff und wird unter sterilen Bedingungen mit Einmalmaterial durchgeführt."},{"text":"Lidocain 1 % mit Spritze und dünner Kanüle","warum":"Betäubt Haut und Bauchwand bis zum Peritoneum; der Stichkanal wird dabei schon in Z-Technik angelegt."},{"text":"Punktionskanüle: dünnkalibrig für die Diagnostik; für die Entlastung Venenverweilkanüle oder spezielle Parazentesekanüle mit Seitenlöchern","warum":"In Deutschland meist Venenverweilkanülen: überall verfügbar und günstig, aber knickanfällig und nur mit Endöffnung, daher häufiger Lagekorrekturen."},{"text":"Spritzen (20 und 50 ml) und Dreiwegehahn","warum":"Proben steril abziehen, ohne das System zu öffnen; über den Hahn lässt sich der Ablauf jederzeit stoppen."},{"text":"Probengefäße: EDTA-Röhrchen (Zellzahl, Differenzierung), Röhrchen für Gesamteiweiß und Albumin, aerobe und anaerobe Blutkulturflaschen, großes Gefäß für Zytologie","warum":"Blutkulturflaschen am Bett mit je 10 bis 20 ml beimpft erhöhen die Ausbeute deutlich; für die Zytologie bei Malignitätsverdacht 50 bis 100 ml."},{"text":"Verbindungsschlauch und Sammelbeutel mit Skala (oder Vakuumflaschen nach Hausstandard)","warum":"Großvolumige Entlastung über etwa 1 bis 4 Stunden mit genauer Mengenbilanz; die Menge bestimmt die Albumindosis."},{"text":"Humanalbumin 20 %","warum":"Nach Entlastung von über 5 l wird Albumin gegeben, um einer zirkulatorischen Dysfunktion nach Parazentese vorzubeugen."},{"text":"Steriler Verband, Nahtmaterial griffbereit","warum":"Bei Leckage aus dem Stichkanal kann eine Tabaksbeutelnaht helfen."}],"ablenker":[{"text":"Fresh Frozen Plasma bei INR 1,8","warum_nicht":"Plasmaderivate werden vor einer Aszitespunktion unabhängig vom INR nicht gegeben; INR und Quick spiegeln das Blutungsrisiko bei Zirrhose schlecht wider. Ausnahme ist die DIC."},{"text":"Thrombozytenkonzentrat bei 45.000/µl","warum_nicht":"Eine prophylaktische Thrombozytengabe wird nur unter 20.000/µl erwogen."},{"text":"Urinteststreifen zum SBP-Nachweis","warum_nicht":"Nicht als alleiniges Verfahren, die Sensitivität ist zu gering. Maßgeblich ist die Zellzahl mit Differenzierung (Granulozyten über 250/µl)."},{"text":"Hydroxyethylstärke (HES) als Volumenersatz nach Entlastung","warum_nicht":"Nach über 5 l ist Albumin anderen Plasmaexpandern überlegen; HES ist wegen Nierenschäden und Gerinnungsstörungen in der Anwendung eingeschränkt."},{"text":"Gramfärbung des Aszites als Routinetest","warum_nicht":"Meist nicht indiziert, weil die Keimdichte im Aszites zu gering ist; entscheidend ist die Kultur in Blutkulturflaschen."}]},"schritte":[{"text":"Indikation, Einwilligung und Medikation prüfen; Gerinnung nicht routinemäßig korrigieren","warum":"Relevante Blutungen sind selten (unter 1 %), FFP senkt dieses Risiko nicht. Plättchenhemmer außer ASS und Antikoagulanzien möglichst pausieren, im Notfall bewusst abwägen.","q":["dgvs","bsg"]},{"text":"Ausgangswerte erheben: RR, HF, SpO2, Gewicht; Serum-Albumin, Kreatinin und Natrium am selben Tag","warum":"Der SAAG braucht Serum- und Aszites-Albumin vom selben Tag; Kreatinin und Natrium sind die Referenz für eine spätere Verschlechterung der Nierenfunktion.","q":["dgvs","easl"]},{"text":"Lagern: Rückenlage, Oberkörper leicht erhöht, leicht nach links gedreht","warum":"In Linksschräglage sammelt sich der Aszites im linken Unterbauch; das Depot wird tiefer und der Zugang sicherer.","q":["dgvs"]},{"text":"Ultraschall: Aszitesdepot, Bauchwanddicke, Darmschlingen, Organe und Farbdoppler der Bauchwandgefäße; Punktionsort im linken Unterbauch lateral der Rektusscheide markieren (mindestens 8 cm von der Mittellinie, 5 cm über der Symphyse)","warum":"So bleiben A. epigastrica inferior, Leber und Milz aus dem Stichweg; rechts drohen ein geblähtes Zökum oder Narben. Nach dem Markieren nicht mehr umlagern, sonst neu schallen.","q":["bsg","dgvs","shm"]},{"text":"Kurzer Sicherheitscheck: Identität, Einwilligung, Allergien, Probenliste, Albumin bereit","warum":"Vermeidet typische Fehler: falsche oder fehlende Proben, vergessene Blutkulturflaschen, fehlendes Albumin nach großer Entlastung."},{"text":"Hygienische Händedesinfektion, sterile Handschuhe, Hautdesinfektion mit Einwirkzeit, steriles Lochtuch","warum":"Steriles Arbeiten verhindert Bauchwandinfektionen und kontaminierte Kulturen.","q":["dgvs","easl"]},{"text":"Lokalanästhesie von der Haut bis zum Peritoneum, dabei den Stichkanal schon in Z-Technik anlegen","warum":"Das Peritoneum ist schmerzempfindlich; derselbe versetzte Kanal wird anschließend für die Punktion genutzt.","q":["uw"]},{"text":"Z-Technik: Haut mit der freien Hand nach kaudal verschieben, Kanüle unter Aspiration vorschieben und die Haut erst loslassen, wenn Aszites kommt; dann Kunststoffkanüle vorschieben, Stahlnadel entfernen","warum":"Nach dem Loslassen gleitet die Haut zurück, der Stichkanal liegt versetzt und schließt sich besser: weniger Leckage. Alternative ist ein schräger Einstich im 45-Grad-Winkel.","q":["dgvs","uw"]},{"text":"Proben sofort am Bett: aerobe und anaerobe Blutkulturflasche mit je 10 bis 20 ml beimpfen, EDTA-Röhrchen für Zellzahl mit Differenzierung, Röhrchen für Gesamteiweiß und Albumin; bei Malignitätsverdacht 50 bis 100 ml für die Zytologie","warum":"Beimpfen am Bett vor einer Antibiotikagabe erhöht die Kulturausbeute deutlich. Eine SBP liegt ab über 250 Granulozyten/µl vor.","q":["dgvs","easl","uw"]},{"text":"Zur Entlastung das Sammelsystem anschließen und ablaufen lassen, Menge fortlaufend notieren; stockt der Fluss, Kanüle vorsichtig bewegen oder Patient:in zur Seite drehen","warum":"Die großvolumige Parazentese entfernt den Aszites möglichst vollständig in einer Sitzung, meist über 1 bis 4 Stunden.","q":["bsg","easl"]},{"text":"Währenddessen Kreislauf, Schmerzen und Aspekt des Punktats beobachten; bei Hypotonie, zunehmendem Schmerz oder frisch blutigem Punktat stoppen und Ursache klären","warum":"Eine großvolumige Entlastung kann die Hämodynamik verändern; eine Blutung aus Bauchwandgefäßen muss früh auffallen.","q":["dgvs"]},{"text":"Nach Abschluss einer Entlastung über 5 l Albumin 20 % geben: 6 bis 8 g pro Liter (DGVS) bzw. 8 g pro Liter (EASL, BSG)","warum":"Albumin beugt der zirkulatorischen Dysfunktion nach Parazentese (Nierenversagen, Hyponatriämie, Enzephalopathie) am besten vor und ist anderen Plasmaexpandern überlegen.","q":["dgvs","easl","bsg"]},{"text":"Kanüle entfernen, steriles Pflaster; bei Nachlaufen etwa 2 Stunden auf die Gegenseite lagern, ggf. Tabaksbeutelnaht","warum":"Leckage ist die häufigste Komplikation (etwa 5 %) und öffnet Keimen einen Weg.","q":["bsg","dgvs"]},{"text":"Proben versenden, Menge und Albumingabe dokumentieren; Kreatinin, Natrium und Diuretika im Verlauf steuern","warum":"Volumen und Albumin gehören in die Übergabe. Nach Entlastung genügt die niedrigste
