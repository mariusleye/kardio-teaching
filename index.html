Downloads/Gefaesskath_Inf_Teil1.pdf?__blob=publicationFile&v=3","stand":"2017"},{"id":"krinko_err","kurz":"KRINKO Erratum 2018","titel":"Erratum zu Teil 1: Evidenzkategorien der Hautantiseptik vor ZVK-Anlage (CHX 2 % Kat. IB, Octenidin 0,1 % Kat. II). Bundesgesundheitsbl 2018;61:446","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1_Erratum.pdf?__blob=publicationFile&v=1","stand":"2018"},{"id":"nice","kurz":"NICE TA49","titel":"Guidance on the use of ultrasound locating devices for placing central venous catheters (Technology Appraisal 49)","url":"https://www.nice.org.uk/guidance/ta49","stand":"2002"},{"id":"perseus","kurz":"ESAIC PERSEUS 2020","titel":"Lamperti M et al. European Society of Anaesthesiology guidelines on peri-operative use of ultrasound-guided for vascular access (PERSEUS vascular access). Eur J Anaesthesiol 2020;37:344–376","url":"https://doi.org/10.1097/EJA.0000000000001180","stand":"2020"},{"id":"asa","kurz":"ASA 2020","titel":"Practice Guidelines for Central Venous Access 2020. An Updated Report by the American Society of Anesthesiologists Task Force on Central Venous Access. Anesthesiology 2020;132:8–43","url":"https://doi.org/10.1097/ALN.0000000000002864","stand":"2020"},{"id":"smit","kurz":"Smit 2018","titel":"Smit JM et al. Bedside ultrasound to detect central venous catheter misplacement and associated iatrogenic complications: a systematic review and meta-analysis. Crit Care 2018;22:65","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5851097/","stand":"2018"},{"id":"gullo","kurz":"Gullo 2022","titel":"Gullo G, Qanadli SD. ECG-based techniques to optimize peripherally inserted central catheters: rationale for tip positioning and practical use. Front Cardiovasc Med 2022;9:765935","url":"https://doi.org/10.3389/fcvm.2022.765935","stand":"2022"},{"id":"clark16","kurz":"Clark 2016","titel":"Clark E et al. Practical aspects of nontunneled and tunneled hemodialysis catheters. Can J Kidney Health Dis 2016;3:2054358116669128 (Drahtvorschub über 20 cm als typischer Fehler)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5332079/","stand":"2016"},{"id":"xylocain","kurz":"Fachinfo Xylocain 1 %/2 %","titel":"Fachinformation Xylocain 1 %/2 % Injektionslösung (Lidocainhydrochlorid), Abschnitte 4.2 bis 4.4","url":"https://www.fachinfo.de/pdf/004674","stand":"Juli 2022"},{"id":"khan","kurz":"Khan 2013","titel":"Khan H, Zaidi A. Paradoxical air embolism following central venous catheter removal. BMJ Case Rep 2013","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3794207/","stand":"2013"},{"id":"bts","kurz":"BTS Sauerstoff, Anhang 4","titel":"BTS Guideline for oxygen use in adults in healthcare and emergency settings, Web Appendix 4: Local oxygen policy template","url":"https://www.brit-thoracic.org.uk/document-library/guidelines/emergency-oxygen/web-appendix-4-local-oxygen-policy-template","stand":"2017"},{"id":"nejm_zvk","kurz":"NEJM-Video 2010","titel":"Ortega R et al. Videos in Clinical Medicine: Ultrasound-guided internal jugular vein cannulation. N Engl J Med 2010;362:e57 (nur weiterführender Link)","url":"https://doi.org/10.1056/NEJMvcm0810156","stand":"2010"}],"moderation":"Impulsfragen:\n1. Warum reichen Blutfarbe und fehlende Pulsation nicht als Beleg für eine venöse Lage, und was prüfst du stattdessen vor dem Dilatieren?\n2. Was ist am Hals gefährlicher: eine Kanüle oder ein Dilatator in der A. carotis? Was folgt daraus für das Vorgehen?\n3. Die Patientin ist orthopnoisch und kann nicht flach liegen. Wie senkst du trotzdem das Risiko einer Luftembolie?\n4. Welche Aufgaben übernimmst du als PJ-Studierende:r in der Assistenz, ohne das sterile Feld zu gefährden?\nStolperstellen: Draht zu tief vorgeschoben (Extrasystolen, VT) oder beim Vorschieben des Katheters losgelassen (Drahtverlust).","indikationen":["Gabe venenreizender oder hochkonzentrierter Medikamente, z. B. Katecholamine in höherer Dosis oder über längere Zeit, konzentrierte Kalium- oder Glukoselösungen","Mehrere parallel laufende, teils inkompatible Infusionen bei unzureichendem peripherem Zugang","Parenterale Ernährung mit hoher Osmolarität","Messung von zentralvenösem Druck und zentralvenöser Sättigung (ScvO2) als Verlaufsparameter"],"kontraindikationen":["Absolut für den gewählten Ort: Thrombose der Zielvene sowie Infektion oder Verbrennung im Punktionsgebiet; dann einen anderen Zugangsweg wählen.","Relativ: schwere Gerinnungsstörung, Thrombozytopenie oder laufende Antikoagulation, fehlende Kooperation, Tracheostoma (V. jugularis dann möglichst meiden) und ungünstige Anatomie im Vorab-Ultraschall."],"vorbereitung":["Indikation prüfen, Zugangsweg festlegen (hier Standard: V. jugularis interna rechts) und Lumenzahl begründen; Mehrlumenkatheter nur bei echtem Bedarf","Aufklärung und Einwilligung dokumentieren; im Notfall nach mutmaßlichem Willen handeln","Gerinnung, Thrombozyten und laufende Antikoagulation prüfen; Allergien gegen Chlorhexidin, Lokalanästhetika und Pflaster erfragen","Vorab-Ultraschall vor dem Abdecken: Vene offen und komprimierbar, kein Thrombus, Lage zur A. carotis, Weite bei Atmung","Monitoring mit EKG und SpO2, sicherer Zugang für Notfallmedikamente, Sauerstoff griffbereit","Lagerung: Rückenlage, wenn vertretbar Kopftieflage, Kopf nur leicht zur Gegenseite drehen","Assistenz einplanen (Pflege oder PJ), Checkliste nutzen, Material vollständig bereitlegen, bevor sich jemand steril anzieht"],"material":{"benoetigt":[{"text":"OP-Haube, Mund-Nasen-Schutz, steriler langärmeliger Kittel, sterile Handschuhe","warum":"Maximale Barrierevorkehrungen sind bei der ZVK-Anlage empfohlen (KRINKO Kat. IB), weil Draht und Katheter sonst leicht kontaminiert werden."},{"text":"Großes steriles Lochtuch, das den gesamten Aktionsradius des Drahtes abdeckt","warum":"Der Seldinger-Draht ist lang und schwingt beim Hantieren über die Punktionsstelle hinaus; ein kleines Tuch schützt ihn nicht."},{"text":"Alkoholisches Hautantiseptikum mit Chlorhexidin 2 % oder Octenidin 0,1 %","warum":"Von der KRINKO empfohlen (CHX Kat. IB, Octenidin Kat. II, beide gleichermaßen geeignet); wirksam nur nach Einwirkzeit laut Hersteller."},{"text":"Ultraschallgerät mit Linearschallkopf und sterilem Überzug für Schallkopf und Kabel","warum":"Echtzeit-Ultraschall ist an der V. jugularis interna Standard und senkt Fehlpunktionen; der Überzug hält Schallkopf und Kabel im sterilen Feld."},{"text":"ZVK-Set: Punktionskanüle mit Spritze, Seldinger-Draht mit J-Spitze, Skalpell, Dilatator, mehrlumiger Katheter","warum":"Grundausstattung der Seldinger-Technik; die J-Spitze gleitet atraumatisch durch das Gefäß."},{"text":"Lokalanästhetikum, z. B. Lidocain 1 %, mit Spritze und dünner Kanüle","warum":"Für Haut und Stichkanal reichen meist 2 bis 5 ml (20 bis 50 mg). Laut Fachinformation höchstens 300 mg ohne Vasokonstriktor; bei Herzinsuffizienz und Leitungsstörungen Dosis reduzieren."},{"text":"Sterile NaCl 0,9 % in Spülspritzen, mindestens 10 ml pro Lumen","warum":"Zum Füllen vor der Anlage und zum Spülen danach; die KRINKO empfiehlt Spülen und Blocken mit mindestens 10 ml NaCl 0,9 % ohne Heparin (Kat. II)."},{"text":"Sterile Verschlussstopfen oder Dreiwegehähne für jedes Lumen","warum":"Jedes offene Lumen kann Luft ansaugen; Verschlüsse müssen steril sein und dürfen nicht wiederverwendet werden."},{"text":"Nahtmaterial oder nahtfreies Fixiersystem und steriler Transparentverband","warum":"Sichere Fixierung verhindert Dislokation; der Transparentverband erlaubt die tägliche Inspektion der Eintrittsstelle."},{"text":"Adapter für intrakardiales EKG, sofern im Haus etabliert","warum":"Erlaubt die Kontrolle der Spitzenlage schon während der Anlage über die Veränderung der P-Welle."}],"ablenker":[{"text":"Ultraschallgel aus der unsterilen Stationsflasche im Punktionsfeld","warum_nicht":"Kontaminiert Nadel und Punktionsstelle. Braucht man direkt an der Punktionsstelle ein Schallleitungsmedium, empfiehlt die KRINKO alkoholisches Hautantiseptikum statt Gel."},{"text":"Heparinhaltige Blocklösung für alle Lumen","warum_nicht":"Nichtgetunnelte ZVK werden mit NaCl 0,9 % ohne Heparin gespült und geblockt (KRINKO Kat. II); Heparin nur im begründeten Ausnahmefall als Fertiglösung."},{"text":"Routinemäßige i. v. Antibiotikaprophylaxe vor der Punktion","warum_nicht":"Wird nicht empfohlen (ASA 2020). Infektionsschutz entsteht durch Händedesinfektion, Barriere und Hautantiseptik."},{"text":"Kleines Abdecktuch nur um die Punktionsstelle","warum_nicht":"Deckt den Bewegungsradius des Drahtes nicht ab; gefordert ist ein großzügig dimensioniertes Lochtuch."},{"text":"Akustischer Doppler-Stift zur Gefäßsuche","warum_nicht":"Ersetzt die zweidimensionale Echtzeit-Darstellung nicht; NICE rät von audio-gesteuertem Doppler für die ZVK-Anlage ausdrücklich ab."}]},"schritte":[{"text":"Team-Time-out: Patient:in, Indikation, Seite, Gerinnung, Allergien; Assistenz und Aufgaben festlegen","warum":"Eine standardisierte Checkliste mit fester Assistenz verringert Fehler und klärt, wer Material ins sterile Feld anreicht.","q":["asa","krinko1"]},{"text":"Vorab-Ultraschall beidseits: Vene offen und komprimierbar, Lage zur A. carotis, Punktionsstelle wählen","warum":"Thrombosen, kleine Venen oder eine direkt über der Arterie liegende Vene fallen vor dem Abdecken auf; ein Seitenwechsel ist dann noch einfach.","q":["asa","perseus"]},{"text":"Lagerung: Kopftieflage, wenn vertretbar; Kopf nur leicht zur Gegenseite drehen","warum":"Die Kopftieflage füllt die Vene und senkt das Risiko einer Luftembolie; starke Kopfdrehung kann die Vene weiter über die Arterie verschieben.","q":["asa"]},{"text":"Haube und Mund-Nasen-Schutz anlegen, hygienische Händedesinfektion, steriler Kittel, sterile Handschuhe","warum":"Maximale Barrierevorkehrungen zusätzlich zur Händedesinfektion senken das Infektionsrisiko (KRINKO Kat. IB).","q":["krinko1"]},{"text":"Großflächige Hautantiseptik mit alkoholischem CHX- oder Octenidin-Präparat, Einwirkzeit abwarten","warum":"Das Antiseptikum wirkt nur nach vollständiger Einwirkzeit; die Fläche muss mindestens den Ausschnitt des Lochtuchs abdecken.","q":["krinko1","krinko_err"]},{"text":"Großes steriles Lochtuch auflegen, Schallkopf mit Kabel in den sterilen Überzug einbringen","warum":"Der Schallkopf kommt mit Nadel und Draht in Kontakt; Schallkopf und Kabel brauchen deshalb eine sterile Ummantelung.","q":["krinko1"]},{"text":"Set vorbereiten: alle Lumen mit NaCl 0,9 % füllen, Nebenlumen verschließen, distales Lumen für den Draht offen lassen","warum":"Gefüllte Lumen enthalten keine Luft, und der Draht tritt nur über das distale Lumen aus.","q":["krinko1"]},{"text":"Lokalanästhesie von Haut und Stichkanal unter Aspiration, meist 2 bis 5 ml Lidocain 1 %","warum":"Wer schmerzfrei ist, hält still. Aspiration vor der Injektion verhindert eine intravasale Gabe; die Höchstdosis laut Fachinformation liegt weit darüber.","q":["xylocain"]},{"text":"Vene unter Echtzeit-Ultraschall mit aufgesetzter Spritze punktieren, Nadelspitze ständig darstellen","warum":"Echtzeit-Führung senkt arterielle Fehlpunktionen und Mehrfachpunktionen; wer die Nadelspitze verliert, sticht blind.","q":["nice","perseus","asa"]},{"text":"Spritze abnehmen, Kanüle fixieren, Draht mit J-Spitze widerstandsfrei vorschieben, nicht tiefer als etwa 20 cm, EKG beobachten","warum":"Ein zu tief liegender Draht reizt Vorhof oder Ventrikel und löst Extrasystolen bis VT aus. Bei Widerstand nie mit Kraft weiterschieben.","q":["clark16"]},{"text":"Venöse Lage des Drahtes im Ultraschall in Quer- und Längsachse bestätigen, erst dann dilatieren","warum":"Blutfarbe und fehlende Pulsation sind nicht verlässlich; ein Dilatator in der A. carotis ist eine schwere, vermeidbare Komplikation.","q":["asa"]},{"text":"Stichinzision am Draht, Dilatator nur so tief wie nötig vorschieben, Draht dabei festhalten und auf freie Beweglichkeit prüfen","warum":"Zu tiefes Dilatieren gefährdet Gefäßwand und Pleura; ein nicht mehr frei beweglicher Draht ist abgeknickt und muss geprüft werden.","q":["asa"]},{"text":"Katheter über den Draht einführen: Draht muss am distalen Lumen herausschauen und festgehalten werden, bevor der Katheter die Haut erreicht","warum":"So bleibt der Draht jederzeit unter Kontrolle und kann nicht ins Gefäß verschwinden.","q":["asa"]},{"text":"Draht entfernen, distales Lumen sofort verschließen, Draht vollständig und intakt vorzeigen","warum":"Ein offenes Lumen saugt bei Inspiration Luft an. Fehlt der Draht, muss er sofort gesucht werden (Röntgen).","q":["asa","khan"]},{"text":"Jedes Lumen aspirieren und spülen; Spitzenlage mit intrakardialem EKG oder Ultraschall bestimmen und Tiefe anpassen","warum":"Freie Aspiration zeigt die intravasale Lage aller Lumen. Das P-Wellen-Maximum markiert den cavoatrialen Übergang; die Spitze soll nicht tief im Vorhof liegen.","q":["krinko1","gullo","smit"]},{"text":"Fixieren, steriler Transparentverband, Pneumothorax ausschließen (Lungensono oder Röntgen nach Hausstandard), dokumentieren","warum":"Freigabe erst nach Lagebestätigung und Ausschluss eines Pneumothorax; dokumentiert werden Seite, Tiefe an der Haut, Lagekontrolle und Datum.","q":["smit","krinko1","asa"]}],"komplikationen":[{"titel":"Arterielle Fehlpunktion oder Fehlkanülierung (A. carotis)","erkennen":"Hellrotes, pulsierendes Blut ist ein Hinweis, aber unzuverlässig (Schock, Hypoxie, hoher ZVD). Sicherer: Draht oder Katheter im Ultraschall in der Arterie, arterielle Druckkurve über ein Lumen, BGA-Vergleich.","handeln":"Nur Kanüle in der Arterie: entfernen und einige Minuten komprimieren, ohne die Halsgefäße zu verschließen. Dilatator oder Katheter in der Arterie: liegen lassen, verschließen, als arteriell kennzeichnen, sofort Gefäßchirurgie oder interventionelle Radiologie hinzuziehen."},{"titel":"Pneumothorax","erkennen":"Luftnot, Husten, SpO2-Abfall, einseitig abgeschwächtes Atemgeräusch; im Ultraschall fehlendes Lungengleiten; beim Spannungspneumothorax zusätzlich Hypotonie und Tachykardie.","handeln":"Sauerstoff, Oberärzt:in informieren, Ultraschall oder Röntgen; Drainage je nach Größe und Klinik; Spannungspneumothorax sofort entlasten."},{"titel":"Luftembolie","erkennen":"Plötzliche Luftnot, Unruhe, SpO2-Abfall, Tachykardie, Hypotonie bis Kreislaufstillstand; typischer Moment: offenes Lumen, Diskonnektion oder Entfernung im Sitzen.","handeln":"Eintrittsstelle sofort luftdicht verschließen, Kopftief-Linksseitenlage, 100 % Sauerstoff, Luft über den liegenden Katheter aspirieren, bei Kreislaufstillstand Reanimation; danach neurologisch untersuchen."},{"titel":"Rhythmusstörungen durch Draht oder Katheter","erkennen":"Extrasystolen, Salven oder VT am Monitor, zeitlich passend zum Vorschieben von Draht oder Katheter.","handeln":"Draht oder Katheter sofort zurückziehen; die Störung endet meist sofort. Hält sie an oder ist der Kreislauf beeinträchtigt, nach ERC-Algorithmus behandeln."},{"titel":"Fehllage der Katheterspitze","erkennen":"Kein typischer P-Wellen-Anstieg im intrakardialen EKG, Lumen schlecht aspirierbar, im Röntgen Spitze in V. subclavia, Gegenseite oder tief im Vorhof.","handeln":"Vor der Nutzung korrigieren (zurückziehen) oder neu anlegen; über eine unklar liegende Spitze keine Katecholamine oder venenreizenden Lösungen geben."},{"titel":"Blutung und Hämatom","erkennen":"Schwellung am Hals, Nachblutung unter dem Verband; bei großem Hämatom Schluckstörung, Heiserkeit oder Stridor.","handeln":"Gezielt komprimieren, Gerinnung und Antikoagulation prüfen; bei Atemwegsgefahr früh Anästhesie zur Atemwegssicherung rufen, Gefäßchirurgie hinzuziehen."}],"nachsorge":["Nutzung erst nach dokumentierter Freigabe: Lage bestätigt (intrakardiales EKG, Ultraschall oder Röntgen nach Hausstandard) und Pneumothorax ausgeschlossen","Indikation täglich in der Visite prüfen und dokumentieren; nicht mehr benötigte ZVK sofort entfernen","Verband: Gaze täglich palpieren und mindestens alle 72 h wechseln, Transparentverband bis zu 7 Tage; durchfeuchtete, verschmutzte oder gelöste Verbände sofort erneuern","Vor jeder Manipulation an Hub, Dreiwegehahn oder Konnektor: hygienische Händedesinfektion und Desinfektion des Konnektors","Infusionssysteme ohne Lipide oder Blut nicht häufiger als alle 96 h wechseln, mit Lipiden mindestens alle 24 h, nach Blutprodukten nach 6 h","Kein routinemäßiger Wechsel nach fester Liegedauer; im Notfall ohne volle Barriere gelegte ZVK möglichst innerhalb von 24 h ersetzen","Entfernung in flacher Rückenlage oder Kopftieflage, bei Spontanatmung in Ausatmung oder unter Pressen, danach luftdichter Verband"],"abbildung":"seldinger","uebungen":[{"titel":"Hellrotes Blut aus allen Lumen","patient":{"kurz":"Herr M., 67 J.","alter":67,"geschlecht":"m","gewicht_kg":84,"groesse_cm":176,"vorgeschichte":"Vorderwandinfarkt mit PCI vor 6 h, kardiogener Schock, Noradrenalin über peripheren Zugang; ASS, Ticagrelor und Heparin-Perfusor."},"start":{"zeit":"Minute 0","vitals":{"hf":104,"sys":94,"dia":58,"spo2":95,"af":20,"temp":36.9},"rhythmus":"sinus_tachy"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Die Situation","text":"Du assistierst Dr. S. bei der ZVK-Anlage rechts jugulär. Die Vene war im Ultraschall klein und kollabierte bei Einatmung, die Punktion gelang im dritten Versuch. Draht, Dilatator und Katheter liefen ohne Widerstand. Beim Aspirieren kommt aus allen drei Lumen hellrotes Blut, die Spritze füllt sich ruckartig von selbst.","moderation":"Frage an die Gruppe: Welche Information fehlt im Ablauf? (Kontrolle der Drahtlage vor der Dilatation.)","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 1","text":"Dr. S. bittet dich, die Lage zu klären. Was veranlasst du?","optionen":[{"id":"o1","label":"Druckaufnehmer an ein Lumen anschließen","ergebnis":"Pulsatile Kurve mit 92/57 mmHg, deckungsgleich mit dem nichtinvasiven Blutdruck. Das ist eine arterielle Kurve.","q":["asa"]},{"id":"o2","label":"Ultraschall in Quer- und Längsachse","ergebnis":"Der Katheter liegt im Lumen der A. carotis communis. Die V. jugularis interna liegt lateral davon, ist klein und komprimierbar.","q":["asa"]},{"id":"o3","label":"Blutgasanalyse aus dem Katheter","ergebnis":"pO2 98 mmHg, sO2 97 % unter 4 l/min Sauerstoff. Spricht deutlich für arterielles Blut; sicher wird es im Vergleich mit Druckkurve und Ultraschall."},{"id":"o4","label":"Hals und Atmung ansehen","ergebnis":"Kein sichtbares Hämatom, kein Stridor, Herr M. spricht in ganzen Sätzen."}],"pflicht":["o1","o2"],"weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Minute 3","frage":"Ein 7-Fr-Katheter liegt in der A. carotis. Wie geht es weiter?","optionen":[{"id":"a1","text":"Katheter belassen, Lumen verschließen, als arteriell kennzeichnen und sofort Gefäßchirurgie oder interventionelle Radiologie hinzuziehen","bewertung":"richtig","feedback":"Richtig. Ein Dilatator oder großlumiger Katheter in einer Arterie bleibt liegen, bis über eine operative oder interventionelle Entfernung entschieden ist. Unter ASS, Ticagrelor und Heparin wäre die Blutung nach dem Ziehen kaum zu beherrschen.","q":["asa"],"weiter":"k4"},{"id":"a2","text":"Katheter sofort ziehen und 10 Minuten fest komprimieren","bewertung":"falsch","feedback":"Gefährlich. Ein 7-Fr-Loch in der A. carotis lässt sich unter dreifacher Gerinnungshemmung oft nicht sicher abdrücken; es drohen Halshämatom mit Atemwegsverlegung oder eine Ischämie bei zu fester Kompression.","q":["asa"],"weiter":"k6"},{"id":"a3","text":"Katheter liegen lassen und als Zugang für Noradrenalin nutzen, bis die Gefäßchirurgie kommt","bewertung":"falsch","feedback":"Nein. Medikamente oder Luftblasen über einen arteriell liegenden Katheter gelangen direkt in die Hirngefäße. Der Katheter bleibt liegen, wird verschlossen und gekennzeichnet, aber nicht benutzt.","weiter":"k4"}],"weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Minute 5","frage":"Bis die Gefäßchirurgie eintrifft: Was gehört jetzt dazu?","optionen":[{"id":"m1","text":"Neurologischen Status erheben und dokumentieren (Bewusstsein, Sprache, Pupillen, Motorik)","richtig":true,"feedback":"Ja. Ausgangsbefund, falls es zu einer Embolie oder Dissektion kommt."},{"id":"m2","text":"Katheter sicher fixieren und an allen Lumen „arteriell, nicht benutzen“ markieren","richtig":true,"feedback":"Ja. Verhindert versehentliche Injektionen und eine Dislokation."},{"id":"m3","text":"Mit Oberärzt:in und Kardiologie klären, ob der Heparin-Perfusor pausiert wird","richtig":true,"feedback":"Ja. Die Abwägung gegen das frische Stentergebnis trifft das Team gemeinsam."},{"id":"m4","text":"Sofort auf derselben Seite eine neue Punktion der Vene versuchen","richtig":false,"feedback":"Nein. Direkt neben dem arteriell liegenden Katheter steigt das Risiko weiter. Für den zentralen Zugang später Gegenseite oder anderen Ort wählen."},{"id":"m5","text":"Hals und Atemweg überwachen und die Anästhesie vorinformieren","richtig":true,"feedback":"Ja. Ein wachsendes Halshämatom kann die Atemwege verlegen."}],"weiter":"k5"},{"id":"k5","typ":"ende","titel":"Komplikation beherrscht","text":"Die interventionelle Radiologie entfernt den Katheter mit einem Verschlusssystem. Herr M. bleibt neurologisch unauffällig. Der ZVK wird später links jugulär gelegt, diesmal mit Kontrolle der Drahtlage im Längsschnitt vor der Dilatation.","lernpunkte":["Vor jeder Dilatation die venöse Lage des Drahtes im Ultraschall bestätigen; Blutfarbe und Pulsation sind unzuverlässig.","Dilatator oder Katheter in einer Arterie liegen lassen und Gefäßchirurgie oder interventionelle Radiologie hinzuziehen.","Einen arteriell liegenden Katheter nie für Medikamente nutzen und eindeutig kennzeichnen."]},{"id":"k6","typ":"text","zeit":"Minute 8","titel":"Fünf Minuten später","text":"Trotz Kompression schwillt der Hals rechts an. Herr M. wird unruhig, spricht nur noch in kurzen Sätzen, man hört einen inspiratorischen Stridor.","effekt":{"vitals":{"hf":128,"sys":78,"dia":46,"spo2":88,"af":30},"alarm":"SpO2 niedrig"},"weiter":"k7"},{"id":"k7","typ":"wahl","zeit":"Minute 9","frage":"Was hat jetzt Vorrang?","optionen":[{"id":"b1","text":"Anästhesie notfallmäßig zur Atemwegssicherung, Gefäßchirurgie sofort, weiter gezielt komprimieren, Blutprodukte anfordern","bewertung":"richtig","feedback":"Richtig. Der Atemweg ist akut bedroht, und mit wachsendem Hämatom wird die Intubation schwieriger. Die Blutungsquelle muss chirurgisch versorgt werden.","effekt":{"vitals":{"spo2":93,"hf":118}}},{"id":"b2","text":"So fest komprimieren, bis der Carotispuls nicht mehr tastbar ist","bewertung":"falsch","feedback":"Nein. Ein Verschluss der A. carotis riskiert eine zerebrale Ischämie, und das Hämatom wächst trotzdem in die Tiefe."},{"id":"b3","text":"Abwarten und in 15 Minuten neu beurteilen","bewertung":"falsch","feedback":"Nein. Stridor bei wachsendem Halshämatom ist ein Notfall; der Atemweg kann innerhalb von Minuten verloren gehen."}],"weiter":"k8"},{"id":"k8","typ":"ende","titel":"Schwerer Verlauf nach dem Ziehen","text":"Herr M. wird notfallmäßig intubiert, die Gefäßchirurgie versorgt die A. carotis offen. Mit belassenem Katheter wäre dieser Verlauf wahrscheinlich vermeidbar gewesen.","lernpunkte":["Einen großlumigen Katheter in der A. carotis nicht ziehen, besonders nicht unter Plättchenhemmung und Heparin.","Stridor bei Halshämatom heißt: Atemweg sofort durch Erfahrene sichern lassen.","Der eigentliche Schutz vor dieser Komplikation ist die Kontrolle der Drahtlage vor dem Dilatieren."]}]},{"titel":"Plötzliche Luftnot nach Drahtentfernung","patient":{"kurz":"Frau K., 74 J.","alter":74,"geschlecht":"w","gewicht_kg":68,"groesse_cm":163,"vorgeschichte":"Ischämische Kardiomyopathie mit LVEF 25 %, akute Dekompensation mit Orthopnoe, Vorhofflimmern; ZVK für Inotropika geplant."},"start":{"zeit":"Minute 0","vitals":{"hf":98,"sys":104,"dia":66,"spo2":93,"af":24,"temp":36.7},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Anlage im Halbsitzen","text":"Frau K. toleriert keine Flachlage, deshalb wird der ZVK rechts jugulär mit etwa 30° Oberkörperhochlage angelegt. Nach dem Entfernen des Drahtes dreht sich der Kollege zur Spülspritze, das distale Lumen bleibt offen. Frau K. holt tief Luft, man hört ein schlürfendes Geräusch am Katheter.","weiter":"k2"},{"id":"k2","typ":"wahl","zeit":"Minute 1","effekt":{"vitals":{"hf":132,"sys":78,"dia":48,"spo2":82,"af":34},"alarm":"SpO2 niedrig"},"frage":"Frau K. wird plötzlich unruhig, kaltschweißig und ringt nach Luft. Was tust du zuerst?","optionen":[{"id":"a1","text":"Offenes Lumen sofort verschließen: Daumen auf den Ansatz, dann Verschlussstopfen","bewertung":"richtig","feedback":"Richtig. Zuerst muss der Lufteintritt aufhören; jede weitere Einatmung bei offenem Lumen saugt mehr Luft an.","q":["khan"]},{"id":"a2","text":"Röntgen-Thorax anfordern, um einen Pneumothorax auszuschließen","bewertung":"falsch","feedback":"Nicht als erstes. Der zeitliche Zusammenhang mit dem offenen Lumen spricht für eine Luftembolie; der Lufteintritt muss sofort gestoppt werden."},{"id":"a3","text":"Katheter sofort ganz herausziehen","bewertung":"falsch","feedback":"Nein. Es bleibt ein offener Stichkanal, über den weiter Luft eintreten kann, und du verlierst die Möglichkeit, Luft zu aspirieren.","q":["khan"]}],"weiter":"k3"},{"id":"k3","typ":"mehrfach","zeit":"Minute 2","frage":"Das Lumen ist zu. Welche weiteren Sofortmaßnahmen sind richtig?","optionen":[{"id":"m1","text":"Kopftief-Linksseitenlage, so weit Frau K. das toleriert","richtig":true,"feedback":"Ja. Die Luft soll im rechten Vorhof bleiben und nicht den Ausflusstrakt des rechten Ventrikels verlegen; kurzfristig hat das Vorrang vor der Orthopnoe."},{"id":"m2","text":"100 % Sauerstoff über Maske mit Reservoir","richtig":true,"feedback":"Ja. Ein hoher Sauerstoffanteil behandelt die Hypoxie und beschleunigt die Resorption der Luft."},{"id":"m3","text":"Über das distale Lumen Luft aspirieren","richtig":true,"feedback":"Ja, der Versuch lohnt sich, solange die Katheterspitze zentral liegt."},{"id":"m4","text":"Hilfe rufen und Reanimationsbereitschaft herstellen","richtig":true,"feedback":"Ja. Eine große Luftembolie kann in eine pulslose elektrische Aktivität übergehen."},{"id":"m5","text":"Frau K. ganz aufsetzen, weil sie im Liegen schlechter Luft bekommt","richtig":false,"feedback":"Nein. Im Sitzen sinkt der Venendruck am Hals, bei jeder Undichtigkeit tritt leichter Luft ein; empfohlen ist kurzfristig die Kopftief-Linksseitenlage."},{"id":"m6","text":"Furosemid i. v. wegen der bekannten Stauung","richtig":false,"feedback":"Nicht jetzt. Die akute Verschlechterung ist durch die Luft erklärt; ein Diuretikum ändert daran nichts."}],"weiter":"k4"},{"id":"k4","typ":"zahl","zeit":"Minute 3","frage":"Mit welchem Sauerstofffluss betreibst du die Maske mit Reservoir?","einheit":"l/min","min":0,"max":15,"schritt":1,"start":4,"zielbereich":[10,15],"feedback_ok":"Passt. Nur bei hohem Fluss bleibt der Reservoirbeutel gefüllt; für kritisch Kranke sieht die BTS-Vorlage 15 l/min vor.","feedback_zu_niedrig":"Zu wenig. Der Reservoirbeutel fällt zusammen, die Patientin atmet Raumluft zu, und die Sauerstofffraktion bleibt niedrig.","feedback_zu_hoch":"Mehr als 15 l/min liefert der Wandanschluss meist nicht und bringt keinen Vorteil.","weiter":"k5"},{"id":"k5","typ":"info","zeit":"Minute 8","effekt":{"vitals":{"hf":112,"sys":96,"dia":58,"spo2":91,"af":26}},"text":"Nach Lagerung, Sauerstoff und Aspiration von etwa 15 ml schaumigem Blut stabilisiert sich Frau K. Was prüfst du jetzt?","optionen":[{"id":"i1","label":"Fokussierte Echokardiographie","ergebnis":"Echoreiche Bläschen im rechten Vorhof, rechter Ventrikel leicht erweitert, keine Luft im linken Herzen sichtbar."},{"id":"i2","label":"Neurologischer Kurzstatus","ergebnis":"Wach und orientiert, Sprache klar, keine Halbseitenzeichen, Pupillen gleich weit.","q":["khan"]},{"id":"i3","label":"Katheter und Verschlüsse","ergebnis":"Alle Lumen gut aspirierbar, Verschlüsse fest. Wegen Vorhofflimmerns war das intrakardiale EKG nicht eindeutig, ein Röntgen-Thorax ist angefordert."}],"pflicht":["i2"],"weiter":"k6"},{"id":"k6","typ":"ende","titel":"Luftembolie überstanden","text":"Frau K. erholt sich in den folgenden Stunden. Das Röntgen zeigt eine regelrechte Katheterlage ohne Pneumothorax.","lernpunkte":["Der Moment zwischen Drahtentfernung und Verschluss ist kritisch: Daumen auf den Ansatz, Lumen nie offen lassen.","Ohne Kopftieflage steigt das Risiko; dann besonders sorgfältig verschließen und die Patientin bei offenem System ausatmen oder pressen lassen.","Therapie der Luftembolie: Lufteintritt stoppen, Kopftief-Linksseitenlage, 100 % Sauerstoff, Luft aspirieren, Reanimationsbereitschaft.","Neurologisch nachuntersuchen: Über ein offenes Foramen ovale kann Luft in die Hirngefäße gelangen."]}]}]},{"id":"fall-kardiogener-schock","typ":"fall","titel":"Fall: Blutdruckabfall nach Vorderwandinfarkt","untertitel":"IMC-Aufnahme nach PCI: erkennen, einordnen, behandeln","gruppe":"Schock","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Einen kardiogenen Schock am Gesamtbild aus Klinik, Echo und Laktat erkennen","Den Schweregrad nach SCAI einordnen und die ersten Maßnahmen priorisieren","Noradrenalin als Vasopressor der ersten Wahl begründen und eine Startdosis wählen","Auf Dobutamin-bedingte Rhythmusstörungen sicher reagieren"],"quellen":[{"id":"esc-hf","kurz":"ESC HF 2021","titel":"McDonagh TA et al.: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure. Eur Heart J 2021;42:3599-3726","stand":"2021"},{"id":"scai","kurz":"SCAI 2022","titel":"Naidu SS et al.: SCAI SHOCK Stage Classification Expert Consensus Update. J Am Coll Cardiol 2022;79:933-946","stand":"2022"},{"id":"esc-acs","kurz":"ESC ACS 2023","titel":"Byrne RA et al.: 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44:3720-3826","stand":"2023"},{"id":"soap2","kurz":"SOAP II","titel":"De Backer D et al.: Comparison of dopamine and norepinephrine in the treatment of shock. N Engl J Med 2010;362:779-789","stand":"2010"},{"id":"erc","kurz":"ERC ALS 2021","titel":"Soar J et al.: European Resuscitation Council Guidelines 2021: Advanced Life Support. Resuscitation 2021;161:115-151","stand":"2021"}],"moderation":"An jedem Entscheidungspunkt zuerst die Gruppe abstimmen lassen, dann aufdecken. Die Befunde im Info-Schritt bewusst nicht vorlesen, sondern anfordern lassen.","patient":{"kurz":"Herr M., 68 Jahre","alter":68,"geschlecht":"m","gewicht_kg":82,"groesse_cm":178,"vorgeschichte":"Arterielle Hypertonie, Raucher. Vor 3 Stunden Vorderwand-STEMI, PCI und Stent in der LAD (proximal). Aufnahme auf die IMC. Medikation: ASS, Ticagrelor, Heparin im Verlauf."},"start":{"zeit":"Minute 0","vitals":{"hf":112,"sys":84,"dia":54,"spo2":91,"af":26,"temp":36.4},"rhythmus":"sinus_tachy"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","text":"Du übernimmst Herrn M. von der Herzkatheter-Einheit. Er klagt über zunehmende Luftnot und wirkt unruhig. Am Monitor fällt der Blutdruck, die Herzfrequenz ist hoch. Der Dienstarzt ist kurz im Nachbarzimmer.","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 2","text":"Du hast Zeit für gezielte Untersuchungen. Was brauchst du, um das Bild einzuordnen?","optionen":[{"id":"haut","label":"Haut und Peripherie","ergebnis":"Kühle, marmorierte Extremitäten, Kapillarfüllzeit 4 Sekunden, kaltschweißig."},{"id":"lunge","label":"Lunge auskultieren","ergebnis":"Feuchte Rasselgeräusche beidseits bis in die Mittelfelder, Tachypnoe."},{"id":"herz","label":"Herz auskultieren","ergebnis":"Tachykarde Herztöne, 3. Herzton. Kein neues lautes Systolikum.","q":["esc-hf"]},{"id":"echo","label":"Fokussierte Echokardiographie","ergebnis":"Vorderwand und Spitze akinetisch, LVEF geschätzt 25 %. Kein Perikarderguss, RV unauffällig. Untere Hohlvene weit und kaum atemvariabel."},{"id":"bga","label":"Blutgasanalyse mit Laktat","ergebnis":"pH 7,31; Laktat 4,1 mmol/l; Base Excess minus 6; Kalium 4,2 mmol/l."},{"id":"ekg","label":"12-Kanal-EKG","ergebnis":"Sinustachykardie 112/min. Persistierende ST-Hebungen V2 bis V5, keine neuen Blockbilder."},{"id":"urin","label":"Urinausscheidung","ergebnis":"Blasenkatheter: 20 ml in der letzten Stunde."}],"pflicht":["haut","lunge","echo","bga"],"weiter":"k3","moderation":"Lass die Gruppe begründen, warum sie jede Untersuchung anfordert. Was würde sich ändern, wenn das Ergebnis anders wäre?"},{"id":"k3","typ":"wahl","zeit":"Minute 5","frage":"Was ist die wahrscheinlichste Ursache des Blutdruckabfalls?","optionen":[{"id":"a","text":"Kardiogener Schock durch Pumpversagen nach Vorderwandinfarkt","bewertung":"richtig","feedback":"Niedriger Druck, kalte Haut, Lungenstauung, weite VCI, EF 25 %, Laktat erhöht: Das Pumpversagen erklärt alle Befunde.","q":["esc-hf"]},{"id":"b","text":"Septischer Schock","bewertung":"falsch","feedback":"Septische Patient:innen sind eher warm und vasoplegisch, die VCI wäre eher eng und es gäbe kein Lungenödem. Es gibt hier weder Fieber noch Infektfokus."},{"id":"c","text":"Hypovolämischer Schock durch Blutung an der Punktionsstelle","bewertung":"falsch","feedback":"Bei Blutung wäre die VCI eng und die Lunge trocken. Du siehst das Gegenteil. Die Leiste solltest du trotzdem kurz prüfen."},{"id":"d","text":"Perikardtamponade","bewertung":"falsch","feedback":"Im Echo ist kein Erguss zu sehen. Eine Tamponade bleibt nach Intervention eine wichtige Differenzialdiagnose, trifft hier aber nicht zu."},{"id":"e","text":"Lungenarterienembolie","bewertung":"falsch","feedback":"Bei Lungenembolie wäre der rechte Ventrikel dilatiert und die Lunge nicht gestaut. Hier ist der linke Ventrikel betroffen."}],"weiter":"k4"},{"id":"k4","typ":"wahl","zeit":"Minute 6","frage":"Welches SCAI-Stadium trifft zu?","optionen":[{"id":"a","text":"Stadium B (beginnend)","bewertung":"falsch","feedback":"Stadium B hat Hypotonie oder Tachykardie ohne Zeichen der Minderperfusion. Hier sind Laktat erhöht und die Peripherie kalt."},{"id":"b","text":"Stadium C (klassisch)","bewertung":"richtig","feedback":"Hypotonie mit Hypoperfusion (Laktat über 2, kalte Haut, Oligurie) und Zeichen des Pumpversagens, Therapie nötig, aber noch nicht trotz Therapie verschlechtert.","q":["scai"]},{"id":"c","text":"Stadium D (sich verschlechternd)","bewertung":"akzeptabel","feedback":"D setzt eine Verschlechterung trotz Erstmaßnahmen voraus. Jetzt noch nicht, aber das kann der nächste Schritt werden.","q":["scai"]},{"id":"d","text":"Stadium E (Extremis)","bewertung":"falsch","feedback":"E bedeutet Kreislaufstillstand oder schwerste Instabilität mit laufender Reanimation."}],"erklaerung":"Die SCAI-Stadien (A bis E) helfen, Tempo und Eskalationsstufe zu begründen. C bedeutet: Handeln jetzt, Schock-Team informieren.","weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 8","frage":"Welche Sofortmaßnahmen sind jetzt sinnvoll?","optionen":[{"id":"a","text":"Oberarzt und Kardiologie-Dienst informieren, Eskalation anmelden","richtig":true,"feedback":"Kardiogener Schock ist eine Eskalationssituation. Rechtzeitige Information verkürzt die Zeit bis zur definitiven Therapie."},{"id":"b","text":"Arterielle Druckmessung und engmaschiges Monitoring","richtig":true,"feedback":"Vasoaktive Therapie braucht kontinuierliche, invasive Druckmessung."},{"id":"c","text":"Laktat nach 1 bis 2 Stunden kontrollieren","richtig":true,"feedback":"Der Laktatverlauf zeigt, ob die Perfusion besser wird."},{"id":"d","text":"Rasche Klärung der Koronarsituation (Stentverschluss, Restischämie) mit dem Kathetertisch","richtig":true,"feedback":"Eine persistierende Ischämie ist eine behandelbare Ursache und gehört früh geklärt.","q":["esc-acs"]},{"id":"e","text":"Volumenbolus von 1000 ml kristalloider Lösung","richtig":false,"feedback":"Bei Lungenstauung und weiter VCI verschlechtert Volumen die Lungenfunktion."},{"id":"f","text":"Betablocker intravenös zur Frequenzsenkung","richtig":false,"feedback":"Die Tachykardie kompensiert das niedrige Schlagvolumen. Ein Betablocker wäre negativ inotrop und gefährlich."},{"id":"g","text":"Nitroglycerin gegen die Lungenstauung","richtig":false,"feedback":"Bei Hypotonie senkt Nitroglycerin den Druck weiter und verschlechtert die Koronarperfusion."}],"weiter":"k6"},{"id":"k6","typ":"wahl","zeit":"Minute 10","frage":"Die invasive Messung zeigt MAP 64 mmHg. Welcher Vasopressor ist erste Wahl?","optionen":[{"id":"a","text":"Noradrenalin","bewertung":"richtig","feedback":"Noradrenalin ist beim kardiogenen Schock der Vasopressor der ersten Wahl und zeigte weniger Arrhythmien als Dopamin.","q":["esc-hf","soap2"]},{"id":"b","text":"Dopamin","bewertung":"falsch","feedback":"Dopamin löste mehr Rhythmusstörungen aus, im kardiogenen Subkollektiv mit höherer Sterblichkeit.","q":["soap2"]},{"id":"c","text":"Adrenalin","bewertung":"falsch","feedback":"Adrenalin steigert Laktat und Arrhythmierisiko und gilt nicht als erste Wahl."},{"id":"d","text":"Vasopressin als Monotherapie","bewertung":"akzeptabel","feedback":"Vasopressin kann ergänzend den Druck stützen, ist aber keine erste Wahl und hebt den Fluss nicht."}],"weiter":"k7"},{"id":"k7","typ":"zahl","zeit":"Minute 12","frage":"Du startest Noradrenalin über Perfusor (10 mg auf 50 ml, also 200 µg/ml). Wähle eine sinnvolle Startdosis.","einheit":"µg/kg/min","min":0,"max":1,"schritt":0.01,"start":0.3,"zielbereich":[0.02,0.15],"rechnung":{"konz":200,"konz_einheit":"µg/ml","dosis_einheit":"µg/kg/min","gewicht_kg":82},"feedback_ok":"Niedrig beginnen und nach MAP titrieren (Ziel meist 65 mmHg). Wirkung und Nebenwirkungen engmaschig prüfen.","feedback_zu_niedrig":"Das ist unter der üblichen Startdosis und wird kaum wirken. Eine Dosis im niedrigen zweistelligen Hundertstelbereich ist üblich.","feedback_zu_hoch":"Das ist als Startdosis deutlich zu hoch. Beginne niedrig, titriere nach Wirkung und beobachte Frequenz und Rhythmus.","weiter":"k8"},{"id":"k8","typ":"text","zeit":"Minute 40","text":"Der Druck ist jetzt stabil bei etwa MAP 74 mmHg. Aber: Laktat 4,6 mmol/l, die Haut ist weiter kalt, Urinausscheidung 15 ml/h. Der Fluss reicht offensichtlich nicht.","effekt":{"vitals":{"sys":98,"dia":62,"hf":110,"spo2":90}},"weiter":"k9"},{"id":"k9","typ":"mehrfach","zeit":"Minute 42","frage":"Was ist jetzt sinnvoll? Wähle alles Passende.","optionen":[{"id":"a","text":"Schock-Team bzw. Herzteam einbeziehen und Kreislaufunterstützung evaluieren","richtig":true,"feedback":"Bei Hypoperfusion trotz Vasopressor ist die frühe Entscheidung über mechanische Unterstützung zeitkritisch.","q":["esc-hf","scai"]},{"id":"b","text":"Ein Inotropikum ergänzen, zum Beispiel Dobutamin","richtig":true,"feedback":"Bei niedrigem Herzzeitvolumen trotz ausreichendem Druck kann ein Inotropikum den Fluss verbessern, auf Kosten von Frequenz, O₂-Bedarf und Arrhythmierisiko.","q":["esc-hf"]},{"id":"c","text":"Invasive Hämodynamik erwägen (zentralvenöse Sättigung, Pulmonalarterienkatheter)","richtig":true,"feedback":"Misst den Fluss direkt und steuert die Therapie."},{"id":"d","text":"Noradrenalin auf maximale Dosis hochfahren","richtig":false,"feedback":"Noch mehr Nachlast erhöht den Druck, verschlechtert aber den Fluss bei geschwächtem Herzen."},{"id":"e","text":"Weitere 1000 ml Volumen","richtig":false,"feedback":"Die Lunge ist bereits gestaut, mehr Volumen schadet."}],"weiter":"k10"},{"id":"k10","typ":"text","zeit":"Minute 55","text":"Dobutamin läuft seit 10 Minuten. Der Herzindex steigt, aber am Monitor treten gehäuft ventrikuläre Extrasystolen auf, die Frequenz liegt bei 130/min.","effekt":{"vitals":{"hf":130,"sys":104,"dia":66}},"weiter":"k11"},{"id":"k11","typ":"wahl","zeit":"Minute 56","frage":"Wie reagierst du?","optionen":[{"id":"a","text":"Dobutamin reduzieren, Kalium und Magnesium prüfen und ausgleichen, Rhythmus eng überwachen","bewertung":"richtig","feedback":"Dosis senken ist die schnellste Maßnahme. Elektrolytentgleisung und Ischämie als Mitursache prüfen. Das Ziel ist der Kompromiss aus Fluss und Rhythmussicherheit.","q":["esc-hf"],"effekt":{"vitals":{"hf":112}},"weiter":"k13"},{"id":"b","text":"Nichts ändern, Extrasystolen sind harmlos","bewertung":"falsch","feedback":"Salven unter Katecholaminen sind ein Warnsignal. Ohne Reaktion droht eine anhaltende Kammertachykardie.","effekt":{"rhythmus":"vt","vitals":{"hf":180,"sys":68,"dia":44},"alarm":"VT"},"weiter":"k12"},{"id":"c","text":"Sofort Amiodaron als Kurzinfusion, Dobutamin unverändert","bewertung":"akzeptabel","feedback":"Antiarrhythmika können nötig werden, Ursache und Dosis des Auslösers zuerst anzugehen ist aber vorrangig.","effekt":{"vitals":{"hf":124}},"weiter":"k13"}]},{"id":"k12","typ":"wahl","zeit":"Minute 58","frage":"Der Monitor alarmiert: Kammertachykardie 180/min. Der Patient ist ansprechbar, aber blass, der Blutdruck liegt bei 68/44, der Puls ist tastbar. Was tust du?","optionen":[{"id":"a","text":"Hilfe rufen, Defibrillator holen, synchronisierte Kardioversion vorbereiten","bewertung":"richtig","feedback":"Instabile Tachykardie mit Puls: synchronisierte Kardioversion nach Kurznarkose, Team rufen. Die Reanimation beginnt erst bei Pulslosigkeit.","q":["erc"],"effekt":{"rhythmus":"sinus_tachy","vitals":{"hf":118,"sys":92,"dia":58},"alarm":null}},{"id":"b","text":"Erst einmal beobachten, ob sich der Rhythmus von selbst beendet","bewertung":"falsch","feedback":"Bei Instabilität darfst du nicht abwarten. Das Zeitfenster bis zum Kreislaufstillstand ist kurz."},{"id":"c","text":"Unsynchronisierter Schock mit maximaler Energie","bewertung":"akzeptabel","feedback":"Ein unsynchronisierter Schock hat bei Puls das Risiko, Kammerflimmern auszulösen. Synchronisieren, wenn der Patient noch einen Puls hat.","q":["erc"]}],"weiter":"k13"},{"id":"k13","typ":"ende","titel":"Debriefing","text":"Die Lage ist vorerst stabilisiert und das Schock-Team ist informiert. Entscheidend war nicht die einzelne Maßnahme, sondern das Muster: erkennen, einordnen, Druck und Fluss getrennt denken, Eskalation früh anstoßen.","lernpunkte":["Kalt, nass, weite VCI, niedrige EF und erhöhtes Laktat sprechen für kardiogenen Schock, nicht für Volumenmangel.","Die SCAI-Stadien begründen, wie schnell eskaliert wird.","Noradrenalin hebt den Druck, ein Inotropikum hebt den Fluss. Beides hat einen Preis.","Bei Hypoperfusion trotz Vasopressor gehört das Schock-Team früh ans Bett.","Katecholamine können Rhythmusstörungen auslösen: Dosis und Elektrolyte prüfen, bei instabiler Tachykardie mit Puls synchronisiert kardiovertieren."],"moderation":"Frage am Ende: Was hätte sich geändert, wenn die VCI eng gewesen wäre? Die Gruppe soll den hypovolämischen und den kardiogenen Pfad gegenüberstellen."}]},{"id":"fall-septischer-schock","typ":"fall","titel":"Fall: Fieber und Blutdruckabfall nach TAVI","untertitel":"Septischer Schock auf der IMC: erkennen, vom kardiogenen Schock abgrenzen, die erste Stunde behandeln","gruppe":"Schock","reihenfolge":15,"ebene":"oeffentlich","status":"entwurf","dauer":"20 bis 25 min","lernziele":["Eine Sepsis mit vasodilatatorischem Schockbild am Bett erkennen und anhand von Peripherie, Echo, VCI und Lunge vom kardiogenen Schock abgrenzen","Das Bündel der ersten Stunde begründet umsetzen: Laktat, Blutkulturen vor dem Antibiotikum, Antibiotikum innerhalb einer Stunde, Volumen, Vasopressor","Volumen bei Herzinsuffizienz in Portionen geben und die Volumenreagibilität dynamisch prüfen","Noradrenalin mit initialem MAP-Ziel 65 mmHg einsetzen und bei steigendem Bedarf Vasopressin und Hydrocortison leitliniengerecht ergänzen","Fokussuche und Fokuskontrolle nach einer Katheterintervention planen"],"quellen":[{"id":"ssc2021","kurz":"SSC 2021","titel":"Evans L et al.: Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2021. Intensive Care Med 2021;47:1181–1247","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8486643/","stand":"2021"},{"id":"ssc-bundle","kurz":"SSC Hour-1 Bundle","titel":"Surviving Sepsis Campaign: Hour-1 Bundle, Initial Resuscitation for Sepsis and Septic Shock (Bundle-Karte von SCCM und ESICM)","url":"https://sccm.org/SCCM/media/SCCM/PDFs/Surviving-Sepsis-Campaign-Hour-1-Bundle.pdf","stand":"2019"},{"id":"ssc2026","kurz":"SSC 2026","titel":"Prescott HC et al.: Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2026. Intensive Care Med 2026;52:863–936 (eingesehen über die Empfehlungsübersicht der SCCM, nicht im Volltext)","url":"https://sccm.org/survivingsepsiscampaign/guidelines-and-resources/surviving-sepsis-campaign-adult-guidelines","stand":"2026"},{"id":"ssc2026q","kurz":"SSC 2026 Quick Guide","titel":"Quick Guide for Resuscitation and Hemodynamic Support in Adults with Sepsis and Septic Shock (SCCM und ESICM, zur Leitlinie 2026)","url":"https://sccm.org/SCCM/media/SCCM/PDFs/SSC-Adult-Quick-Guide-Infographic-2026.pdf","stand":"2026"},{"id":"sepsis3","kurz":"Sepsis-3","titel":"Singer M et al.: The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA 2016;315:801–810","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4968574/","stand":"2016"},{"id":"esc-hf","kurz":"ESC HF 2021","titel":"DGK Pocket-Leitlinie Akute und chronische Herzinsuffizienz (Version 2021), Kurzfassung der 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure (McDonagh TA et al., Eur Heart J 2021;42:3599–3726)","url":"https://herzmedizin.de/asset/2613/24_2021_pocket-leitlinien_herzinsuffizienz_.pdf","stand":"2021"}],"moderation":"Impulsfragen für die Lehrenden:\n1. Vor dem Fall den Schock-Sandkasten mit der Voreinstellung „Septischer Schock“ öffnen. Die Gruppe sagt vorher, was ein Volumenbolus mit MAP und Füllungsdruck macht. Danach die Kontraktilität auf etwa 0,5 senken (wie bei einer vorbestehenden Herzinsuffizienz) und wiederholen: Ab wann steigt fast nur noch der Füllungsdruck?\n2. Nach dem Volumenschritt: Welcher Befund hätte zuerst gezeigt, dass Herr S. nicht mehr volumenreagibel ist, noch bevor die SpO2 fällt?\n3. Zum Abschluss den Fall neben „Blutdruckabfall nach Vorderwandinfarkt“ legen: Welche drei Befunde am Bett trennen warm von kalt, und warum hilft das Laktat dabei nicht?\n4. Was regelt der Hausstandard genauer als die Leitlinie (kalkulierte Antibiotika, Behandlungsort IMC oder Intensivstation, periphere Noradrenalin-Gabe)?","patient":{"kurz":"Herr S., 72 Jahre","alter":72,"geschlecht":"m","gewicht_kg":82,"groesse_cm":176,"vorgeschichte":"Herzinsuffizienz mit reduzierter Ejektionsfraktion (LVEF 35 %) bei KHK, Diabetes mellitus Typ 2 mit Basalinsulin, chronische Nierenerkrankung (Kreatinin zuletzt 1,4 mg/dl). Vor 3 Tagen elektive transfemorale TAVI bei hochgradiger Aortenklappenstenose, Verlauf bisher unauffällig. Seit einem Harnverhalt an Tag 1 liegt ein Blasenkatheter. Medikation: ASS, Bisoprolol, Sacubitril/Valsartan, Torasemid, Empagliflozin, Basalinsulin."},"start":{"zeit":"Minute 0","vitals":{"hf":118,"sys":88,"dia":40,"spo2":93,"af":24,"temp":38.9},"rhythmus":"sinus_tachy"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","text":"Spätdienst, Tag 3 nach TAVI. Die Pflegekraft ruft dich zu Herrn S.: Er hatte vor einer halben Stunde Schüttelfrost, wirkt seitdem verwirrt und zupft an seinen Zugängen. Am Monitor: Temperatur 38,9 °C, Herzfrequenz 118/min, Blutdruck 88/40 mmHg. Für morgen war die Verlegung auf die Normalstation geplant.","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 2","text":"Du bist als Erste:r am Bett. Was brauchst du, um das Bild einzuordnen?","optionen":[{"id":"haut","label":"Haut und Peripherie","ergebnis":"Haut warm und trocken, Hände und Füße warm, keine Marmorierung. Kapillarfüllzeit am Fingernagel 2 Sekunden."},{"id":"neuro","label":"Bewusstsein","ergebnis":"Wach, zeitlich und örtlich desorientiert, GCS 14 (verbal 4). Keine fokalen Ausfälle."},{"id":"lunge","label":"Lunge auskultieren und schallen","ergebnis":"Vesikuläratmen beidseits, keine Rasselgeräusche. Lungenultraschall: beidseits A-Linien, kein B-Linien-Muster, kein relevanter Pleuraerguss."},{"id":"echo","label":"Fokussierte Echokardiographie","ergebnis":"LV nicht dilatiert, LVEF visuell etwa 40 % (vorbekannt 35 %), bei niedriger Nachlast eher lebhafte Kontraktion. TAVI-Prothese regelrecht, kein relevantes paravalvuläres Leck, kein Perikarderguss. RV normal groß. VCI 1,1 cm, inspiratorisch fast vollständig kollabierend. LVOT-VTI 16 cm."},{"id":"bga","label":"Blutgasanalyse mit Laktat","ergebnis":"Arteriell unter Raumluft: pH 7,32; pO2 68 mmHg; pCO2 31 mmHg; Laktat 4,2 mmol/l; Base Excess minus 7; Glukose 246 mg/dl; Kalium 4,6 mmol/l; Hb 11,3 g/dl."},{"id":"urin","label":"Blasenkatheter und Urin","ergebnis":"Katheter seit Tag 1. Urin trüb und übelriechend, 25 ml in der letzten Stunde. Urinstix: Leukozyten +++, Nitrit positiv."},{"id":"labor","label":"Notfalllabor","ergebnis":"Leukozyten 17,8/nl; CRP 168 mg/l; Procalcitonin 9,6 ng/ml; Kreatinin 2,1 mg/dl (zuletzt 1,4); Thrombozyten 121/nl (Tag 1: 168/nl); Bilirubin 0,9 mg/dl; NT-proBNP 5200 pg/ml (vor TAVI 4100 pg/ml)."},{"id":"zugang","label":"Punktionsstellen und Zugänge","ergebnis":"Beide Leisten reizlos, kein Hämatom, kein Strömungsgeräusch, Fußpulse tastbar. Periphere Venenverweilkanüle am linken Unterarm seit 3 Tagen, Einstichstelle leicht gerötet, kein Eiter."},{"id":"ekg","label":"12-Kanal-EKG","ergebnis":"Sinustachykardie 116/min, PQ 170 ms, QRS 96 ms, kein AV-Block, keine neuen Erregungsrückbildungsstörungen."}],"pflicht":["haut","lunge","echo","bga","urin"],"weiter":"k3","moderation":"Die Befunde nicht vorlesen, sondern anfordern lassen. Frage bei jedem Befund: Würde er im kardiogenen Schock anders aussehen?"},{"id":"k3","typ":"wahl","zeit":"Minute 6","frage":"Was ist die wahrscheinlichste Ursache des Blutdruckabfalls?","optionen":[{"id":"a","text":"Sepsis mit vasodilatatorischem Schockbild, am ehesten katheterassoziierter Harnwegsinfekt (Pneumonie noch nicht sicher ausgeschlossen)","bewertung":"richtig","feedback":"Fieber, Schüttelfrost, Verwirrtheit, trüber Urin mit Nitrit, warme Peripherie, niedrige Diastole und eine schmale, kollabierende VCI passen zusammen. Die Organdysfunktion (Bewusstsein, Niere, Thrombozyten, Kreislauf) macht aus der Infektion eine Sepsis.","q":["sepsis3"]},{"id":"b","text":"Kardiogener Schock bei dekompensierter Herzinsuffizienz","bewertung":"falsch","feedback":"Der kardiogene Schock ist typischerweise kalt und feucht: kalte Peripherie, Stauung, weite VCI, niedriges Herzzeitvolumen. Herr S. ist warm, die Lunge ist trocken, die VCI schmal und die Pumpfunktion nicht schlechter als vorbekannt.","q":["esc-hf"]},{"id":"c","text":"Hypovolämischer Schock durch Nachblutung an der Punktionsstelle","bewertung":"falsch","feedback":"Die Leisten sind reizlos, das Hb ist stabil. Fieber, Leukozytose und der Urinbefund sprechen für eine Infektion. Die schmale VCI allein unterscheidet nicht zwischen Blutung und Vasoplegie."},{"id":"d","text":"Perikardtamponade nach TAVI","bewertung":"falsch","feedback":"Im Echo ist kein Erguss zu sehen, und die VCI ist schmal statt gestaut. Nach Kathetereingriffen bleibt die Tamponade eine Differenzialdiagnose, die du mit dem Echo rasch ausschließt."},{"id":"e","text":"Höhergradiger AV-Block nach TAVI","bewertung":"falsch","feedback":"Herr S. ist tachykard im Sinusrhythmus mit normaler PQ-Zeit. Leitungsstörungen nach TAVI sind häufig, erklären aber weder Fieber noch Tachykardie."},{"id":"f","text":"Harnwegsinfekt ohne Kreislaufrelevanz, ein Antibiotikum innerhalb von 3 Stunden genügt","bewertung":"falsch","feedback":"MAP um 56 mmHg, Laktat 4,2 mmol/l und Verwirrtheit zeigen Hypoperfusion. Bei möglichem Schock soll das Antibiotikum sofort, möglichst innerhalb einer Stunde laufen. Das 3-Stunden-Fenster gilt nur für mögliche Sepsis ohne Schock.","q":["ssc2021","ssc2026"]}],"erklaerung":"Ein erhöhtes NT-proBNP hilft hier nicht weiter: Es ist bei bekannter Herzinsuffizienz ohnehin hoch und steigt auch bei Sepsis. Entscheidend ist das Gesamtbild am Bett.","weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Minute 7","frage":"Welche Befunde sprechen bei Herrn S. gegen einen kardiogenen Schock? Wähle alles Passende.","optionen":[{"id":"a","text":"Warme Peripherie mit Kapillarfüllzeit 2 Sekunden","richtig":true,"feedback":"Im kardiogenen Schock ist die Peripherie durch Vasokonstriktion meist kalt und die Kapillarfüllzeit verlängert.","q":["esc-hf"]},{"id":"b","text":"Niedriger diastolischer Druck (40 mmHg) bei vergleichsweise erhaltener Blutdruckamplitude","richtig":true,"feedback":"Die niedrige Diastole spricht für einen niedrigen Gefäßwiderstand. Im kardiogenen Schock ist die Amplitude eher klein, weil das Schlagvolumen fehlt."},{"id":"c","text":"Schmale, inspiratorisch kollabierende VCI","richtig":true,"feedback":"Spricht für einen niedrigen rechtsatrialen Druck, im kardiogenen Schock ist die VCI meist weit und kaum atemvariabel. Ob Volumen das Schlagvolumen hebt, sagt die VCI bei Spontanatmung allerdings nur unzuverlässig voraus."},{"id":"d","text":"A-Linien ohne B-Linien-Muster im Lungenultraschall","richtig":true,"feedback":"Keine Lungenstauung. Der kardiogene Schock geht meist mit Stauung einher. Der Befund ist zugleich dein Ausgangswert für die Volumentherapie.","q":["esc-hf"]},{"id":"e","text":"LVEF nicht schlechter als vorbekannt, eher lebhafte Kontraktion","richtig":true,"feedback":"Keine neue Pumpschwäche. Bei niedriger Nachlast wirkt die Kontraktion oft besser. Eine septische Kardiomyopathie kann sich im Verlauf entwickeln, deshalb das Echo später wiederholen."},{"id":"f","text":"Laktat 4,2 mmol/l","richtig":false,"feedback":"Laktat ist in beiden Schockformen erhöht. Es zeigt Schweregrad und Verlauf, trennt aber nicht zwischen septisch und kardiogen.","q":["ssc2021"]},{"id":"g","text":"NT-proBNP 5200 pg/ml","richtig":false,"feedback":"Bei bekannter Herzinsuffizienz ohnehin erhöht und auch in der Sepsis ansteigend. Ein Einzelwert trennt hier nicht."},{"id":"h","text":"Herzfrequenz 118/min","richtig":false,"feedback":"Tachykardie ist in beiden Schockformen eine Kompensation und unterscheidet sie nicht."}],"erklaerung":"Warm, trocken und niedrige Diastole sprechen für Vasoplegie, kalt, feucht und weite VCI für Pumpversagen. Ein septischer Schock kann aber auch kalt werden, etwa bei ausgeprägtem Volumenmangel oder septischer Kardiomyopathie. Das Bild im Verlauf neu bewerten.","weiter":"k5"},{"id":"k5","typ":"wahl","zeit":"Minute 8","frage":"Kurz zur Einordnung: Wie verwendest du qSOFA und SOFA bei Herrn S.?","optionen":[{"id":"a","text":"qSOFA 3 von 3 ist ein Warnzeichen für einen schweren Verlauf. Die Sepsis begründet der infektbedingte SOFA-Anstieg um mindestens 2 Punkte, hier um mindestens 4 (Bewusstsein, MAP, Kreatinin, Thrombozyten).","bewertung":"richtig","feedback":"qSOFA (Atemfrequenz ab 22/min, verändertes Bewusstsein, Systole bis 100 mmHg) braucht kein Labor und markiert Patient:innen mit Infekt und hohem Risiko. Die Sepsis-Definition stützt sich auf den SOFA-Anstieg.","q":["sepsis3"]},{"id":"b","text":"qSOFA ab 2 Punkten beweist die Sepsis, weitere Einordnung ist unnötig","bewertung":"falsch","feedback":"qSOFA ist weder Definition noch Beweis. Ein positiver Wert soll zur Suche nach Organdysfunktion und zur Eskalation führen.","q":["sepsis3"]},{"id":"c","text":"qSOFA ist das empfohlene alleinige Screening-Instrument auf der Station","bewertung":"falsch","feedback":"Die SSC 2021 empfiehlt ausdrücklich, qSOFA nicht als alleiniges Screening zu nutzen (starke Empfehlung). NEWS, MEWS oder SIRS sind sensitiver. Ein negativer qSOFA schließt eine Sepsis nicht aus.","q":["ssc2021","ssc2026"]},{"id":"d","text":"Ein septischer Schock nach Sepsis-3 ist bereits gesichert","bewertung":"akzeptabel","feedback":"Klinisch behandelst du ihn sofort wie einen Schock. Formal setzt Sepsis-3 voraus, dass trotz ausreichender Volumengabe ein Vasopressor für MAP ab 65 mmHg nötig ist und das Laktat über 2 mmol/l liegt. Das zeigt sich erst nach der Volumentherapie.","q":["sepsis3"]}],"weiter":"k6"},{"id":"k6","typ":"mehrfach","zeit":"Minute 9","frage":"Verdacht auf Sepsis mit Schock. Was gehört jetzt in die erste Stunde? Wähle alles Passende.","optionen":[{"id":"a","text":"Oberärzt:in und Intensivteam informieren, Behandlungsort (Intensivstation) abstimmen","richtig":true,"feedback":"Sepsis mit Hypotonie ist ein Notfall. Frühe Information sichert Personal, Monitoring und die Entscheidung über den Behandlungsort."},{"id":"b","text":"Laktat bestimmen und bei Werten über 2 mmol/l im Verlauf kontrollieren","richtig":true,"feedback":"Teil des Bündels der ersten Stunde. Ein fallendes Laktat ist ein Zielparameter der Therapie.","q":["ssc-bundle","ssc2021"]},{"id":"c","text":"Blutkulturen (in der Regel zwei Sets, aerob und anaerob) vor dem Antibiotikum, ohne dessen Gabe wesentlich zu verzögern","richtig":true,"feedback":"Kulturen vor Therapiebeginn erhöhen die Chance auf einen Erregernachweis. Die SSC 2021 hält das für sinnvoll, solange die Antibiotikagabe dadurch nicht wesentlich verzögert wird (nicht über 45 Minuten).","q":["ssc2021","ssc-bundle"]},{"id":"d","text":"Urinkultur aus dem frisch gewechselten Blasenkatheter","richtig":true,"feedback":"Urin aus einem seit Tagen liegenden Katheter bildet vor allem dessen Besiedlung ab. Wechsel vor der Probe, soweit das die Antibiotikagabe nicht verzögert."},{"id":"e","text":"Breitspektrum-Antibiotikum sofort, möglichst innerhalb einer Stunde","richtig":true,"feedback":"Bei möglichem septischem Schock empfiehlt die SSC die sofortige Gabe, möglichst innerhalb einer Stunde nach Erkennen (starke Empfehlung).","q":["ssc2021","ssc2026","ssc-bundle"]},{"id":"f","text":"Volumentherapie mit balancierter kristalloider Lösung zügig beginnen","richtig":true,"feedback":"Bei Hypotonie oder Laktat ab 4 mmol/l gehört kristalloides Volumen in das Bündel. Balancierte Lösungen schlägt die SSC gegenüber NaCl 0,9 % vor. Wie viel und wie schnell, entscheidest du gleich.","q":["ssc-bundle","ssc2021"]},{"id":"g","text":"Bisoprolol, Sacubitril/Valsartan und Torasemid sowie den SGLT2-Hemmer pausieren","richtig":true,"feedback":"Die Herzinsuffizienz-Medikation senkt Druck und Vorlast weiter. SGLT2-Hemmer werden bei akuter schwerer Erkrankung wegen des Ketoazidoserisikos pausiert. Wiederbeginn nach Stabilisierung."},{"id":"h","text":"Antibiotikum erst nach Urinbefund und Röntgen-Thorax, um gezielt zu behandeln","richtig":false,"feedback":"Bei möglichem Schock kostet jede Verzögerung. Gezielt wird nach dem Erregernachweis deeskaliert, nicht vorher abgewartet.","q":["ssc2021"]},{"id":"i","text":"Procalcitonin-Verlauf abwarten, bevor das Antibiotikum beginnt","richtig":false,"feedback":"Die SSC 2021 rät davon ab, den Therapiebeginn von Procalcitonin abhängig zu machen.","q":["ssc2021"]},{"id":"j","text":"Hydroxyethylstärke für eine schnellere Kreislaufwirkung","richtig":false,"feedback":"Die SSC empfiehlt klar gegen Stärkelösungen (starke Empfehlung): mehr Nierenersatzverfahren, höhere Sterblichkeit.","q":["ssc2021","ssc2026"]}],"erklaerung":"Hour-1 Bundle der SSC: Laktat, Blutkulturen vor dem Antibiotikum, Breitspektrum-Antibiotikum, 30 ml/kg Kristalloide bei Hypotonie oder Laktat ab 4 mmol/l, Vasopressor bei anhaltender Hypotonie für MAP ab 65 mmHg. Begonnen wird mit dem Erkennen; nicht jedes Element ist nach 60 Minuten abgeschlossen.","weiter":"k7"},{"id":"k7","typ":"wahl","zeit":"Minute 12","frage":"Die Blutkulturen sind abgenommen. Nach welchem Prinzip wählst du die kalkulierte Antibiotikatherapie?","optionen":[{"id":"a","text":"Intravenös und breit nach wahrscheinlichem Fokus (Harnwege, Gefäßzugang), Erwerb im Krankenhaus, Vorbehandlung (z. B. periprozedurale Prophylaxe), bekannter Besiedlung und lokaler Resistenzlage, gemäß Hausstandard; Dosis nach pharmakokinetischen Prinzipien; täglich auf Deeskalation prüfen","bewertung":"richtig","feedback":"Die Auswahl richtet sich nach Fokus, Erwerbsort und Risiko für multiresistente Erreger. Die SSC 2021 empfiehlt, die Dosis nach PK/PD-Prinzipien zu optimieren, schlägt für Betalaktame nach der Startdosis eine verlängerte Infusion vor und rät zur täglichen Prüfung auf Deeskalation. Die konkreten Substanzen legt der Hausstandard fest.","q":["ssc2021"]},{"id":"b","text":"Pauschal ein MRSA-wirksames Mittel plus zwei gramnegativ wirksame Substanzen für alle Patient:innen im Schock","bewertung":"falsch","feedback":"Die SSC 2021 empfiehlt eine MRSA-Abdeckung bei hohem MRSA-Risiko und rät bei niedrigem Risiko davon ab. Zwei gramnegativ wirksame Mittel schlägt sie nur bei hohem Risiko für multiresistente Erreger vor. Ohne Risiko steigen Toxizität und Resistenzdruck ohne Nutzen.","q":["ssc2021","ssc2026"]},{"id":"c","text":"Ein Schmalspektrum-Mittel oral wie beim unkomplizierten Harnwegsinfekt","bewertung":"falsch","feedback":"Bei Sepsis mit Hypotonie ist die Resorption unsicher und das Spektrum für einen nosokomialen, katheterassoziierten Infekt zu schmal."},{"id":"d","text":"Wegen Kreatinin 2,1 mg/dl von Anfang an die halbe Dosis","bewertung":"falsch","feedback":"In der Sepsis ist das Verteilungsvolumen oft vergrößert. Eine zu niedrige erste Dosis gefährdet die Wirksamkeit. Die Anpassung an die Nierenfunktion betrifft in der Regel die Folgedosen, nach Hausstandard oder mit der Klinikapotheke.","q":["ssc2021"]}],"weiter":"k8"},{"id":"k8","typ":"mehrfach","zeit":"Minute 14","frage":"Fokussuche und Fokuskontrolle: Was veranlasst du? Wähle alles Passende.","optionen":[{"id":"a","text":"Blasenkatheter wechseln oder, wenn möglich, ganz entfernen","richtig":true,"feedback":"Der Katheter ist der wahrscheinlichste Fokus. Die SSC fordert, einen Fokus rasch zu identifizieren und so früh wie medizinisch und organisatorisch möglich zu kontrollieren.","q":["ssc2021"]},{"id":"b","text":"Sonographie von Nieren und ableitenden Harnwegen","richtig":true,"feedback":"Ein Harnstau mit Infekt braucht eine rasche Ableitung. Ohne Drainage reicht die Antibiotikatherapie nicht."},{"id":"c","text":"Die gerötete Venenverweilkanüle entfernen, nachdem ein neuer Zugang liegt","richtig":true,"feedback":"Verdächtige Gefäßzugänge sollen zügig entfernt werden, sobald ein anderer Zugang gesichert ist.","q":["ssc2021"]},{"id":"d","text":"Röntgen-Thorax zur Suche nach einer Pneumonie","richtig":true,"feedback":"Nach Analgosedierung ist eine Aspiration möglich. Ein pulmonaler Fokus würde das Spektrum mitbestimmen."},{"id":"e","text":"Bei positiven Blutkulturen an eine Beteiligung der neuen Klappenprothese denken und das Echo-Vorgehen mit der Kardiologie festlegen","richtig":true,"feedback":"Eine Bakteriämie wenige Tage nach Klappenimplantation ist ernst zu nehmen, besonders mit Staphylococcus aureus oder Enterokokken."},{"id":"f","text":"Die Fokuskontrolle auf morgen verschieben, bis der Kreislauf stabil ist","richtig":false,"feedback":"Ein unkontrollierter Fokus hält den Schock aufrecht. Fokuskontrolle gehört so früh wie praktikabel in die Akutphase.","q":["ssc2021"]},{"id":"g","text":"Vor dem Antibiotikum eine CT von Thorax und Abdomen abwarten","richtig":false,"feedback":"Bildgebung kann ergänzen, darf das Antibiotikum aber nicht verzögern. Sonographie und Röntgen am Bett klären hier das Meiste."}],"weiter":"k9"},{"id":"k9","typ":"zahl","zeit":"Minute 15","frage":"Die SSC schlägt bei sepsisbedingter Hypoperfusion mindestens 30 ml/kg kristalloide Lösung in den ersten 3 Stunden vor. Herr S. wiegt 82 kg (BMI 26,5 kg/m²). Welches Gesamtvolumen ergibt sich als Orientierungsrahmen?","einheit":"ml","min":0,"max":5000,"schritt":10,"start":1000,"zielbereich":[2400,2500],"feedback_ok":"30 ml/kg mal 82 kg ergibt 2460 ml, also rund 2,5 l in den ersten 3 Stunden. Das ist ein Orientierungsrahmen (schwache Empfehlung, niedrige Evidenz), keine Menge, die ohne Kontrolle laufen muss. Grundlage ist das tatsächliche Körpergewicht, bei BMI über 30 kg/m² das angepasste oder ideale Gewicht. Bei Herzinsuffizienz gibst du das Volumen in Portionen und prüfst vor jeder weiteren Portion Volumenreagibilität und Stauungszeichen.","feedback_zu_niedrig":"Das liegt unter 30 ml/kg. Gefragt ist der rechnerische Rahmen: 30 ml/kg mal 82 kg. Wie viel davon tatsächlich läuft, entscheidet die Reevaluation nach jeder Portion.","feedback_zu_hoch":"Das liegt über 30 ml/kg. Mehr als dieser Rahmen ist keine Startmenge. Zusätzliches Volumen nur bei nachgewiesener Volumenreagibilität, bei Herzinsuffizienz besonders zurückhaltend.","moderation":"Nachfragen: Wie viele Beutel à 500 ml sind das? Was wäre anders bei 120 kg Körpergewicht?","weiter":"k10"},{"id":"k10","typ":"wahl","zeit":"Minute 16","frage":"Herr S. hat eine Herzinsuffizienz mit LVEF 35 %. Wie gibst du das Volumen?","optionen":[{"id":"a","text":"Erste Portion 500 ml balancierte Kristalloidlösung über etwa 15 Minuten, vor jeder weiteren Portion neu bewerten (MAP, Kapillarfüllzeit, SpO2, Lungenultraschall, Passive-Leg-Raise mit Echo). Noradrenalin vorbereiten und früh, notfalls peripher, starten, wenn der MAP nicht rasch ansteigt.","bewertung":"richtig","feedback":"So nutzt du den Effekt des Volumens und erkennst früh, wann es kippt. Die SSC bevorzugt dynamische Tests gegenüber Untersuchung und statischen Werten allein. Bei lebensbedrohlicher Hypoperfusion nennt der Quick Guide 2026 den Beginn von Noradrenalin parallel zur Volumentherapie.","q":["ssc2021","ssc2026q"],"effekt":{"vitals":{"hf":112,"sys":92,"dia":44}},"weiter":"k11"},{"id":"b","text":"Die vollen 2,5 l als Druckinfusion in 30 Minuten, Kontrolle danach","bewertung":"falsch","feedback":"Die 30 ml/kg sind ein Rahmen, kein Bolus ohne Kontrolle. Bei eingeschränkter Pumpfunktion ist der Bereich zwischen Volumenmangel und Stauung schmal. Achte auf den Monitor.","weiter":"s1"},{"id":"c","text":"Wegen der Herzinsuffizienz gar kein Volumen, nur Noradrenalin","bewertung":"falsch","feedback":"Herzinsuffizienz ist ein Grund für Vorsicht, nicht für Verzicht. Die schmale, kollabierende VCI und die trockene Lunge sprechen dafür, dass eine erste Portion hilft. Ohne Volumen bleibt die relative Hypovolämie der Vasoplegie unbehandelt. Die Oberärztin ordnet zwei kontrollierte Portionen an.","q":["ssc2021"],"weiter":"k11"},{"id":"d","text":"Humanalbumin 20 % als erste Volumenlösung, um die Lunge zu schonen","bewertung":"falsch","feedback":"Erste Wahl sind Kristalloide. Albumin erwägt die SSC erst, wenn bereits große Mengen Kristalloide gelaufen sind. Einen Schutz vor Lungenstau bei Herzinsuffizienz belegt das nicht. Die Oberärztin stellt auf balancierte Kristalloide in Portionen um.","q":["ssc2021","ssc2026q"],"weiter":"k11"}],"weiter":"k11"},{"id":"s1","typ":"text","zeit":"Minute 45","text":"Die 2,5 l sind in 30 Minuten gelaufen. Herr S. sitzt aufrecht im Bett und ringt nach Luft. SpO2 86 % unter 4 l O2, Atemfrequenz 32/min, feuchte Rasselgeräusche beidseits. Lungenultraschall: jetzt beidseits B-Linien. Der Blutdruck ist kaum gestiegen (88/44 mmHg, MAP 59).","effekt":{"vitals":{"spo2":86,"af":32,"hf":126,"sys":88,"dia":44},"alarm":"SpO2"},"weiter":"s2"},{"id":"s2","typ":"wahl","zeit":"Minute 46","frage":"Wie reagierst du?","optionen":[{"id":"a","text":"Volumen stoppen, Oberkörper hoch, Sauerstoff steigern und frühe Atemunterstützung (NIV/CPAP oder High-Flow) mit dem Intensivteam; den Kreislauf ab jetzt mit Vasopressor statt Volumen stützen, Schleifendiuretikum, sobald der Druck gesichert ist","bewertung":"richtig","feedback":"Das Volumen geht nicht mehr ins Schlagvolumen, sondern in die Lunge. Bei Atemnot mit SpO2 unter 90 % sehen die Empfehlungen zur akuten Herzinsuffizienz Sauerstoff und nicht-invasive Beatmung vor; beim rein sepsisbedingten Lungenversagen schlägt die SSC High-Flow vor. Ohne ausreichenden Druck wirken Diuretika schlecht, deshalb zuerst Noradrenalin.","q":["esc-hf","ssc2021"],"effekt":{"vitals":{"spo2":91,"af":26,"hf":118},"alarm":null},"weiter":"k12"},{"id":"b","text":"Weitere 1000 ml, weil der MAP noch unter 65 mmHg liegt","bewertung":"falsch","feedback":"Der MAP ist durch 2,5 l kaum gestiegen: Herr S. ist nicht mehr volumenreagibel. Weiteres Volumen verschlimmert das Lungenödem und hebt den Druck nicht.","effekt":{"vitals":{"spo2":79,"af":36,"hf":134,"sys":84,"dia":40},"alarm":"SpO2"},"weiter":"s3"},{"id":"c","text":"Volumen stoppen und sofort ein Schleifendiuretikum, den Blutdruck zunächst beobachten","bewertung":"akzeptabel","feedback":"Volumen stoppen ist richtig, Entstauung ist das Ziel. Bei MAP unter 60 mmHg und Hypoperfusion fehlt aber die Drucksicherung, und die Atemnot braucht sofort Sauerstoff und Atemunterstützung.","q":["esc-hf"],"effekt":{"vitals":{"spo2":88,"af":30}},"weiter":"k12"}],"weiter":"k12","moderation":"Bevor aufgedeckt wird: Was sagt der kaum gestiegene MAP nach 2,5 l über die Volumenreagibilität?"},{"id":"s3","typ":"ende","titel":"Debriefing: Lungenödem durch Volumen","text":"Unter weiterem Volumen fällt die SpO2 unter 80 %. Das Intensivteam intubiert Herrn S. unter laufendem Noradrenalin und übernimmt ihn auf die Intensivstation. Der Blutdruck war mit Volumen nicht mehr zu heben: Herr S. war schon nach dem ersten Teil der Infusion nicht mehr volumenreagibel.","lernpunkte":["30 ml/kg sind ein Orientierungsrahmen der SSC, keine Infusion ohne Kontrolle. Bei Herzinsuffizienz in Portionen geben und vor jeder Portion neu bewerten.","Dynamische Tests (Passive-Leg-Raise mit Echo, Ansprechen auf eine Portion) und der Lungenultraschall zeigen, wann Volumen nicht mehr hilft, bevor die SpO2 fällt.","Hebt Volumen den Druck nicht, ist der Vasopressor das Mittel: Noradrenalin früh, notfalls peripher.","Vergleich mit dem kardiogenen Schock: Dort ist die Lunge schon zu Beginn gestaut und Volumen schadet sofort. Im septischen Schock mit Herzinsuffizienz hilft eine erste Portion, das Fenster bis zur Stauung ist aber schmal.","Bei Atemnot mit Stauung: Volumen stoppen, früh Atemunterstützung, entstauen, sobald der Druck gesichert ist."],"moderation":"Frage: An welchem Punkt hättet ihr die Infusion gestoppt, und welcher Befund wäre zuerst auffällig gewesen?"},{"id":"k11","typ":"info","zeit":"Minute 35","text":"Zwei Portionen à 500 ml balancierte Kristalloidlösung sind gelaufen. Bewerte neu, bevor du weiteres Volumen gibst.","effekt":{"vitals":{"hf":108,"sys":92,"dia":46,"spo2":94,"af":22,"temp":38.7}},"optionen":[{"id":"kreislauf","label":"Blutdruck und Frequenz","ergebnis":"RR 92/46 mmHg (MAP 61), HF 108/min. Nach der ersten Portion stieg der MAP um 4 mmHg, nach der zweiten kaum noch."},{"id":"crt","label":"Kapillarfüllzeit und Bewusstsein","ergebnis":"Kapillarfüllzeit 2 Sekunden, Haut warm. Weiterhin leicht desorientiert."},{"id":"plr","label":"Passive-Leg-Raise-Test mit Echo","ergebnis":"Oberkörper flach, Beine angehoben: LVOT-VTI steigt von 17 auf 17,5 cm (etwa 3 %). Unter der üblichen Schwelle von etwa 10 %: aktuell kaum volumenreagibel.","q":["ssc2021"]},{"id":"lunge","label":"Lungenultraschall","ergebnis":"Basal beidseits erste einzelne B-Linien, sonst A-Linien. SpO2 94 % unter 2 l O2."},{"id":"vci","label":"Untere Hohlvene","ergebnis":"VCI 1,6 cm, Atemvariabilität etwa 30 %. Bei Spontanatmung allein wenig aussagekräftig, nur zusammen mit dem PLR-Test bewerten."},{"id":"bga","label":"Laktat-Kontrolle","ergebnis":"Laktat 3,6 mmol/l (vorher 4,2), pH 7,33."},{"id":"urin","label":"Urinausscheidung","ergebnis":"25 ml in den letzten 30 Minuten über den neuen Katheter."}],"pflicht":["kreislauf","plr","lunge"],"weiter":"k12","moderation":"Lass die Gruppe zuerst sagen, welcher Befund die Entscheidung für oder gegen weiteres Volumen trägt. Erwartet: PLR-Test und Lunge, nicht die VCI allein."},{"id":"k12","typ":"wahl","frage":"Der MAP bleibt um 60 mmHg, weiteres Volumen hebt ihn nicht. Wie stützt du jetzt den Kreislauf?","optionen":[{"id":"a","text":"Noradrenalin mit initialem MAP-Ziel 65 mmHg; Beginn notfalls über eine sichere periphere Vene, arterielle Druckmessung anlegen","bewertung":"richtig","feedback":"Noradrenalin ist erste Wahl (starke Empfehlung), initial mit MAP-Ziel 65 mmHg. Die SSC schlägt vor, peripher zu beginnen, statt auf einen ZVK zu warten, kurzfristig über eine Vene in oder oberhalb der Ellenbeuge, und invasiv zu messen. Für Patient:innen ab 65 Jahren schlägt die SSC 2026 einen Zielbereich von 60 bis 65 mmHg vor.","q":["ssc2021","ssc2026","ssc2026q"],"effekt":{"vitals":{"sys":102,"dia":50,"hf":104}}},{"id":"b","text":"Dopamin","bewertung":"falsch","feedback":"Die SSC empfiehlt Noradrenalin klar vor Dopamin. Dopamin löst mehr Tachyarrhythmien aus, was bei Herzinsuffizienz besonders ungünstig ist.","q":["ssc2021"],"effekt":{"vitals":{"hf":130}}},{"id":"c","text":"Adrenalin als erstes Mittel wegen der Herzinsuffizienz","bewertung":"akzeptabel","feedback":"Die SSC 2026 lässt bei begleitender kardialer Dysfunktion Noradrenalin oder Adrenalin als erstes Mittel zu, bevorzugt bei Tachykardie aber Noradrenalin. Herr S. ist tachykard, die Pumpfunktion reicht aktuell, das Problem ist der Gefäßtonus. Adrenalin steigert Frequenz und Laktat und erschwert so die Verlaufskontrolle.","q":["ssc2026","ssc2021"],"effekt":{"vitals":{"hf":124,"sys":100,"dia":50}}},{"id":"d","text":"Vasopressin als alleiniges Mittel","bewertung":"falsch","feedback":"Vasopressin ergänzt Noradrenalin bei steigendem Bedarf. Als erstes Mittel schlägt die SSC Noradrenalin vor.","q":["ssc2021","ssc2026"]},{"id":"e","text":"Noradrenalin mit Ziel-MAP 85 mmHg wegen Alter und Nierenfunktion","bewertung":"falsch","feedback":"Höhere Ziele sind im Mittel nicht besser. Die SSC empfiehlt initial 65 mmHg, für Ältere schlägt die SSC 2026 sogar 60 bis 65 mmHg vor. Mehr Druck heißt mehr Vasopressor und bei Herzinsuffizienz mehr Nachlast.","q":["ssc2021","ssc2026"]}],"erklaerung":"Noradrenalin hebt hier den Druck über den Gefäßtonus. Anders als im kardiogenen Schock ist das Herzzeitvolumen meist erhalten oder hoch, zu niedrig ist die Nachlast.","weiter":"k13"},{"id":"k13","typ":"info","zeit":"Stunde 2","text":"Noradrenalin läuft mit 0,12 µg/kg/min, der MAP liegt bei 68 mmHg. Wird die Perfusion besser?","effekt":{"vitals":{"hf":100,"sys":104,"dia":50,"spo2":95,"af":20,"temp":38.3}},"optionen":[{"id":"laktat","label":"Laktat-Verlauf","ergebnis":"Laktat 2,6 mmol/l (Beginn 4,2; nach 35 Minuten 3,6). Rückläufig, aber noch nicht normal: weiter kontrollieren.","q":["ssc2021"]},{"id":"crt","label":"Kapillarfüllzeit","ergebnis":"Unter 2 Sekunden, Haut warm. Beim warmen Schockbild war sie schon zu Beginn kurz. Sie bleibt als Warnzeichen wichtig: Verlängert sie sich, verschlechtert sich die Perfusion.","q":["ssc2021"]},{"id":"urin","label":"Urinausscheidung","ergebnis":"100 ml in 2 Stunden, also etwa 0,6 ml/kg/h."},{"id":"neuro","label":"Bewusstsein","ergebnis":"Wach, orientiert, GCS 15."},{"id":"lunge","label":"Lungenultraschall","ergebnis":"Basal beidseits B-Linien, nicht zunehmend. Bei Herzinsuffizienz ein Grund, weiteres Volumen nur nach positivem Test zu geben und die Bilanz eng zu führen."},{"id":"bild","label":"Nierensonographie und Röntgen-Thorax","ergebnis":"Kein Harnstau, keine Abszedierung. Röntgen-Thorax ohne pneumonisches Infiltrat. Der Blasenkatheter bleibt der wahrscheinlichste Fokus."},{"id":"mibi","label":"Mikrobiologie","ergebnis":"Urin-Gramfärbung: reichlich gramnegative Stäbchen. Blutkulturen bisher ohne Wachstum."}],"pflicht":["laktat","crt","urin"],"weiter":"k14","moderation":"Welche dieser Größen würdet ihr bei der Übergabe an den Nachtdienst als Ziel nennen, und mit welchem Zeitpunkt der nächsten Kontrolle?"},{"id":"k14","typ":"mehrfach","zeit":"Stunde 10","effekt":{"vitals":{"hf":116,"sys":94,"dia":48,"spo2":94,"af":22,"temp":39.1}},"frage":"Zehn Stunden später: Die Blutkulturen zeigen gramnegative Stäbchen. Seit über 4 Stunden braucht Herr S. trotz ausreichender Volumentherapie steigende Noradrenalin-Dosen, jetzt 0,3 µg/kg/min, MAP 63 mmHg, Laktat wieder 3,0 mmol/l. Was ist jetzt sinnvoll? Wähle alles Passende.","optionen":[{"id":"a","text":"Vasopressin ergänzen, statt Noradrenalin immer weiter zu steigern","richtig":true,"feedback":"Die SSC 2021 schlägt Vasopressin vor, wenn der MAP unter Noradrenalin nicht reicht, meist ab etwa 0,25 bis 0,5 µg/kg/min Noradrenalin. Üblich ist eine feste Dosis um 0,03 IE/min.","q":["ssc2021","ssc2026"]},{"id":"b","text":"Hydrocortison intravenös, typischerweise 200 mg pro Tag","richtig":true,"feedback":"Vorgeschlagen bei anhaltendem Vasopressorbedarf. Die SSC 2021 nennt Noradrenalin oder Adrenalin ab 0,25 µg/kg/min über mindestens 4 Stunden als Startpunkt. Der Quick Guide 2026 nennt Hydrocortison mit oder ohne Fludrocortison.","q":["ssc2021","ssc2026q"]},{"id":"c","text":"Echo wiederholen. Zeigt sich eine kardiale Dysfunktion mit anhaltender Hypoperfusion, Dobutamin ergänzen oder Adrenalin allein einsetzen","richtig":true,"feedback":"Bei vorbestehender Herzinsuffizienz kann sich im Verlauf eine septische Kardiomyopathie entwickeln. Dann ist der Fluss das Problem, nicht nur der Tonus. Beide Optionen schlägt die SSC vor; ohne Besserung oder bei Nebenwirkungen wieder beenden.","q":["ssc2021","ssc2026q"]},{"id":"d","text":"Fokuskontrolle und Antibiotikatherapie überprüfen: Resistogramm, Zugänge, Beteiligung der Klappenprothese","richtig":true,"feedback":"Steigender Bedarf kann auf einen unkontrollierten Fokus oder eine unwirksame Therapie hinweisen. Bei Bakteriämie nach Klappenimplantation das Echo-Vorgehen mit der Kardiologie festlegen.","q":["ssc2026q"]},{"id":"e","text":"Weitere 2 l Kristalloide ohne vorherigen Test","richtig":false,"feedback":"Herr S. ist gefüllt und herzinsuffizient. Ohne Nachweis der Volumenreagibilität droht der Lungenstau."},{"id":"f","text":"Levosimendan statt Dobutamin","richtig":false,"feedback":"Die SSC 2021 rät davon ab: kein Überlebensvorteil, in Studien mehr supraventrikuläre Tachyarrhythmien.","q":["ssc2021"]},{"id":"g","text":"Noradrenalin über 1 µg/kg/min steigern, bevor ein zweites Mittel erwogen wird","richtig":false,"feedback":"Hohe Einzeldosen erhöhen Nebenwirkungen wie Tachyarrhythmie und Minderperfusion. Die SSC sieht die Ergänzung durch Vasopressin deutlich früher vor.","q":["ssc2021"]}],"erklaerung":"Ein steigender Katecholaminbedarf ist ein Anlass, Ursache und Fokus erneut zu prüfen, nicht nur die Dosis zu erhöhen. Vasopressin, Hydrocortison und gegebenenfalls ein Inotropikum folgen den Schritten der SSC.","weiter":"k15"},{"id":"k15","typ":"ende","effekt":{"vitals":{"hf":98,"sys":108,"dia":54,"spo2":95,"af":20,"temp":38.2}},"titel":"Debriefing","text":"Herr S. wird auf der Intensivstation mit Noradrenalin, Vasopressin und Hydrocortison stabilisiert, das Laktat fällt wieder. Entscheidend war das Muster: Sepsis früh erkennen, vom kardiogenen Schock abgrenzen, das Bündel der ersten Stunde starten und das Volumen bei Herzinsuffizienz kontrolliert geben.","lernpunkte":["Vergleich mit dem kardiogenen Schock: Septisch hieß hier warm, niedrige Diastole, kurze Kapillarfüllzeit, schmale VCI, trockene Lunge und erhaltene Pumpfunktion. Kardiogen heißt kalt, gestaut, weite VCI, niedrige EF. Hypoton mit erhöhtem Laktat sind beide.","Laktat trennt die Schockformen nicht, zeigt aber Schwere und Verlauf. Bei erhöhtem Wert wiederholt kontrollieren.","Bündel der ersten Stunde: Laktat, Blutkulturen vor dem Antibiotikum ohne wesentliche Verzögerung, Breitspektrum-Antibiotikum möglichst innerhalb einer Stunde, Volumen, Vasopressor. Begonnen wird mit dem Erkennen.","30 ml/kg sind der Rahmen, nicht der Bolus. Bei Herzinsuffizienz in Portionen und mit dynamischen Tests geben.","Noradrenalin ist erste Wahl, MAP-Ziel initial 65 mmHg. Bei steigendem Bedarf Vasopressin, bei anhaltendem Bedarf Hydrocortison, bei kardialer Dysfunktion mit Hypoperfusion Dobutamin oder Adrenalin.","Fokuskontrolle gehört in die ersten Stunden: Katheter wechseln, Harnstau ausschließen, verdächtige Zugänge entfernen."],"moderation":"Legt den Fall neben „Blutdruckabfall nach Vorderwandinfarkt“: Was hätte sich bei Herrn S. geändert, wenn die VCI weit und die Lunge gestaut gewesen wäre?"}]},{"id":"sandkasten-schock","typ":"sandkasten","titel":"Schock-Sandkasten","untertitel":"Füllungsdruck, Pumpkraft und Gefäßtonus verstehen, indem du daran dre
