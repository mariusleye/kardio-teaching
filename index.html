  --slate-750: #1D293D; /* app main background */
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748B;
  --slate-400: #94A3B8;
  --slate-300: #CBD5E1;
  --slate-200: #E2E8F0;
  --slate-100: #F1F5F9;
  --slate-50:  #F8FAFC;
  --white:     #FFFFFF;
  --black:     #05070C;

  /* -- Action / interactive (product control colour) ------- */
  /* The live MedApe app uses this indigo for primary controls. */
  --indigo:       #615FFF;
  --indigo-hover: #4F46E5;
  --indigo-press: #4338CA;
  --indigo-soft:  #EEF0FF;

  /* -- Semantic status ------------------------------------- */
  --info:      #2E9BD6;
  --info-fg:   #93C5FD;
  --info-bg:   #234062; /* on dark surfaces */
  --info-bg-light: #EFF6FF;
  --info-border-light: #BFDBFE;

  --warning:   #FDC246; /* disclaimer amber */
  --warning-fg:#FDE68A;
  --warning-bg:#4A5435; /* amber wash over dark surface */
  --warning-bg-light: #FEF6E0;
  --warning-border-light: #FCD980;

  --success:   #22C55E;
  --success-bg-light: #ECFDF3;
  --success-border-light: #A7F3C9;

  --danger:    #EF4444;
  --danger-bg-light: #FEF2F2;
  --danger-border-light: #FCA5A5;

  /* ========================================================
     SEMANTIC ALIASES — default (LIGHT) theme
     Used by slides, marketing, foundation cards, docs.
     ======================================================== */
  --surface-page:     var(--white);
  --surface-card:     var(--white);
  --surface-sunken:   var(--slate-50);
  --surface-raised:   var(--white);
  --surface-inverse:  var(--slate-900);  /* navy card on light (deck stat cards) */
  --surface-inverse-2:var(--slate-850);

  --border:           var(--slate-200);
  --border-strong:    var(--slate-300);
  --border-inverse:   rgba(255,255,255,0.10);

  --text-strong:      var(--slate-900);
  --text-body:        var(--slate-800);
  --text-muted:       var(--slate-500);
  --text-subtle:      var(--slate-400);
  --text-on-inverse:  var(--white);
  --text-on-inverse-muted: var(--slate-400);
  --text-link:        var(--medape-blue);

  --accent:           var(--medape-orange); /* brand accent */
  --accent-contrast:  var(--white);
  --action:           var(--indigo);        /* primary interactive */
  --action-contrast:  var(--white);

  --focus-ring:        0 0 0 3px rgba(246,128,30,0.35);
  --focus-ring-action: 0 0 0 3px rgba(97,95,255,0.40);
}

/* ==========================================================
   DARK theme — the MedApe product surface (Streamlit app).
   Apply with class .theme-dark or attribute [data-theme="dark"].
   ========================================================== */
.theme-dark,
[data-theme="dark"] {
  --surface-page:     var(--slate-750); /* #1D293D */
  --surface-card:     var(--slate-900); /* textareas / panels */
  --surface-sunken:   #0B1120;          /* sidebar */
  --surface-raised:   #24344D;
  --surface-inverse:  var(--white);
  --surface-inverse-2:var(--slate-100);

  --border:           var(--slate-700);
  --border-strong:    var(--slate-600);
  --border-inverse:   rgba(255,255,255,0.10);

  --text-strong:      var(--slate-100);
  --text-body:        var(--slate-300);
  --text-muted:       var(--slate-400);
  --text-subtle:      var(--slate-500);
  --text-on-inverse:  var(--slate-900);
  --text-on-inverse-muted: var(--slate-600);
  --text-link:        var(--medape-blue-light);

  --accent:           var(--medape-orange);
  --accent-contrast:  var(--white);
  --action:           var(--indigo);
  --action-contrast:  var(--white);

  --info-bg:          #234062;
  --warning-bg:       #4A5435;
}

/* ============================================================
   MedApe — Typography
   Brand face: Hanken Grotesk (see fonts.css for rationale).
   Mono for dosage codes & BMP XML.
   ============================================================ */

:root {
  /* -- Families -------------------------------------------- */
  --font-brand:  "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-sans:   var(--font-brand);
  --font-display:var(--font-brand);
  --font-mono:   "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* -- Type scale (rem @ 16px root) ------------------------ */
  --text-2xs:  0.6875rem; /* 11 — micro labels */
  --text-xs:   0.75rem;   /* 12 — captions, help text */
  --text-sm:   0.875rem;  /* 14 — secondary UI text */
  --text-base: 1rem;      /* 16 — body */
  --text-md:   1.0625rem; /* 17 — comfortable body */
  --text-lg:   1.25rem;   /* 20 — lead / section label */
  --text-xl:   1.5rem;    /* 24 — card titles */
  --text-2xl:  1.875rem;  /* 30 — H2 */
  --text-3xl:  2.25rem;   /* 36 — page title */
  --text-4xl:  3rem;      /* 48 — slide title */
  --text-5xl:  3.75rem;   /* 60 — hero */
  --text-6xl:  4.5rem;    /* 72 — big deck stat */
  --text-7xl:  5.5rem;    /* 88 — display stat */

  /* -- Weights --------------------------------------------- */
  --fw-light:     300; /* @kind font */
  --fw-regular:   400; /* @kind font */
  --fw-medium:    500; /* @kind font */
  --fw-semibold:  600; /* @kind font */
  --fw-bold:      700; /* @kind font */
  --fw-extrabold: 800; /* @kind font */

  /* -- Line heights ---------------------------------------- */
  --leading-none:    1;
  --leading-tight:   1.1;
  --leading-snug:    1.25;
  --leading-normal:  1.5;
  --leading-relaxed: 1.6;

  /* -- Letter spacing -------------------------------------- */
  --tracking-tighter: -0.03em; /* big display numbers */
  --tracking-tight:   -0.015em;/* headings */
  --tracking-normal:  0;
  --tracking-wide:    0.02em;
  --tracking-label:   0.08em;  /* uppercase micro-labels */

  /* -- Semantic roles -------------------------------------- */
  --title-page:      var(--fw-light)    var(--text-3xl)/var(--leading-tight) var(--font-display);
  --title-slide:     var(--fw-bold)     var(--text-4xl)/var(--leading-tight) var(--font-display);
  --title-card:      var(--fw-semibold) var(--text-xl)/var(--leading-snug)  var(--font-display);
  --label-eyebrow:   var(--fw-semibold) var(--text-xs)/1.2 var(--font-sans);
}

/* ============================================================
   MedApe — Spacing  (4px base grid)
   ============================================================ */

:root {
  --space-0:  0;
  --space-px: 1px;
  --space-1:  0.25rem;  /* 4  */
  --space-2:  0.5rem;   /* 8  */
  --space-3:  0.75rem;  /* 12 */
  --space-4:  1rem;     /* 16 */
  --space-5:  1.25rem;  /* 20 */
  --space-6:  1.5rem;   /* 24 */
  --space-7:  1.75rem;  /* 28 */
  --space-8:  2rem;     /* 32 */
  --space-10: 2.5rem;   /* 40 */
  --space-12: 3rem;     /* 48 */
  --space-14: 3.5rem;   /* 56 */
  --space-16: 4rem;     /* 64 */
  --space-20: 5rem;     /* 80 */
  --space-24: 6rem;     /* 96 */
  --space-32: 8rem;     /* 128 */

  /* -- Semantic spacing ------------------------------------ */
  --gap-inline:   var(--space-2);  /* icon ↔ label */
  --gap-control:  var(--space-3);  /* between form controls */
  --pad-control:  var(--space-3);  /* inner padding of inputs/buttons */
  --pad-card:     var(--space-6);  /* card interior */
  --pad-section:  var(--space-12); /* page section rhythm */
  --page-gutter:  var(--space-8);  /* page/app content gutter */

  /* -- Layout ---------------------------------------------- */
  --sidebar-w:      320px;  /* MedApe app sidebar */
  --content-max:    1180px; /* app content column cap */
  --tap-min:        44px;   /* min interactive target */
  --control-h-sm:   32px;
  --control-h-md:   40px;
  --control-h-lg:   48px;
}

/* ============================================================
   MedApe — Radii
   Product surfaces & deck cards favour calm, medium rounding.
   ============================================================ */

:root {
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:   8px;   /* buttons, inputs, tabs */
  --radius-lg:   12px;  /* cards, banners, panels */
  --radius-xl:   16px;  /* logo card, large panels */
  --radius-2xl:  24px;  /* hero / feature surfaces */
  --radius-pill: 999px; /* badges, chips */
  --radius-full: 9999px;

  /* -- Border widths --------------------------------------- */
  --border-w:        1px;
  --border-w-strong: 1.5px;
  --accent-bar:      4px;  /* orange left / bottom accent bar */
}

/* ============================================================
   MedApe — Elevation & Shadows
   The brand runs mostly flat (dark UI, flat deck cards). Shadows
   are reserved for lifted surfaces (logo card, dialogs, menus).
   ============================================================ */

:root {
  --shadow-xs:  0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-sm:  0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md:  0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-lg:  0 12px 32px rgba(15, 23, 42, 0.14);
  --shadow-xl:  0 24px 56px rgba(15, 23, 42, 0.20);

  /* Lift on dark surfaces (deeper, cooler) */
  --shadow-dark-md: 0 6px 20px rgba(2, 6, 23, 0.45);
  --shadow-dark-lg: 0 18px 48px rgba(2, 6, 23, 0.55);

  /* Focus rings (see colors.css for the source values) */
  --ring-accent: var(--focus-ring);
  --ring-action: var(--focus-ring-action);

  /* Inset used on dark inputs to read as "sunken" */
  --inset-field: inset 0 1px 2px rgba(2, 6, 23, 0.35);
}

/* Kardio Teaching, App-Styles auf Basis der MedApe-Tokens (tokens.css) */
:root {
  color-scheme: light;
  --app-bg: var(--slate-100);
  --mon-bg: #05070C;
  --mon-panel: #0B1120;
  --mon-grid: #12301f;
  --c-ekg: #22C55E;
  --c-abp: #EF4444;
  --c-spo2: #2E9BD6;
  --c-af: #E2E8F0;
  --c-temp: #FDC246;
  --fb-richtig-bg: var(--success-bg-light);
  --fb-richtig-bd: var(--success-border-light);
  --fb-richtig-fg: #166534;
  --fb-akz-bg: var(--warning-bg-light);
  --fb-akz-bd: var(--warning-border-light);
  --fb-akz-fg: #854D0E;
  --fb-falsch-bg: var(--danger-bg-light);
  --fb-falsch-bd: var(--danger-border-light);
  --fb-falsch-fg: #991B1B;
  --font-scale: 1;
}
[data-theme="dark"] {
  color-scheme: dark;
  --app-bg: #0B1120;
  --fb-richtig-bg: #0f2a1d; --fb-richtig-bd: #166534; --fb-richtig-fg: #86efac;
  --fb-akz-bg: #2d2610; --fb-akz-bd: #854D0E; --fb-akz-fg: #fde68a;
  --fb-falsch-bg: #2f1517; --fb-falsch-bd: #991B1B; --fb-falsch-fg: #fca5a5;
  --info-bg-light: #172a45; --info-border-light: #234062;
  --warning-bg-light: #2d2610; --warning-border-light: #854D0E;
}
* { box-sizing: border-box; }
html { font-size: calc(16px * var(--font-scale)); -webkit-text-size-adjust: 100%; }
html.modus-praesi { --font-scale: 1.22; }
body {
  overflow-wrap: anywhere;
  margin: 0; background: var(--app-bg); color: var(--text-body);
  font: var(--fw-regular) var(--text-base)/var(--leading-normal) var(--font-sans);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { color: var(--text-strong); margin: 0; letter-spacing: var(--tracking-tight); line-height: var(--leading-snug); }
h1 { font-weight: var(--fw-light); font-size: var(--text-3xl); }
h2 { font-weight: var(--fw-semibold); font-size: var(--text-xl); }
h3 { font-weight: var(--fw-semibold); font-size: var(--text-lg); }
h4 { font-weight: var(--fw-semibold); font-size: var(--text-base); }
p { margin: 0 0 var(--space-3); }
a { color: var(--text-link); }
button { font: inherit; color: inherit; }
.eyebrow { font: var(--label-eyebrow); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); }
.muted { color: var(--text-muted); }
.small { font-size: var(--text-sm); }
.xs { font-size: var(--text-xs); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: none; box-shadow: var(--focus-ring-action); border-radius: var(--radius-sm); }

/* Layout */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); grid-template-rows: auto 1fr auto; min-height: 100vh; }
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4);
  background: var(--surface-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: var(--space-3); background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
.brand img { height: 40px; width: auto; display: block; }
.brand b { font-weight: var(--fw-semibold); font-size: var(--text-lg); color: var(--text-strong); letter-spacing: var(--tracking-tight); }
.brand b span { color: var(--medape-orange); }
.spacer { flex: 1; }
.sidebar { background: var(--surface-card); border-right: 1px solid var(--border); padding: var(--space-4); overflow-y: auto; height: calc(100vh - 88px); position: sticky; top: 56px; align-self: start; }
.main { padding: var(--space-6) var(--page-gutter) var(--space-12); min-width: 0; }
.main > .wrap { max-width: var(--content-max); margin: 0 auto; }
.footbar { grid-column: 1 / -1; position: sticky; bottom: 0; z-index: 40; }
.footbar summary { cursor: pointer; list-style: none; }
.footbar summary::-webkit-details-marker { display: none; }
.footbar .mehr { text-decoration: underline; margin-left: 4px; }
.footbar details[open] .mehr { display: none; }
.nav-group { margin-bottom: var(--space-4); }
.nav-group .eyebrow { display: block; margin: 0 0 var(--space-2) var(--space-2); }
.nav-item {
  display: flex; align-items: center; gap: var(--space-2); width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--text-body); font-size: var(--text-sm);
  min-height: 36px;
}
.nav-item:hover { background: var(--surface-sunken); }
.nav-item[aria-current="page"] { background: var(--indigo-soft); color: var(--indigo-press); font-weight: var(--fw-semibold); }
[data-theme="dark"] .nav-item[aria-current="page"] { background: #232a52; color: #c7d2fe; }
.nav-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); flex: none; }
.lock-card { border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); padding: var(--space-3); font-size: var(--text-sm); }
.lock-card input { width: 100%; margin: var(--space-2) 0; }
.menu-btn { display: none; }
html.modus-praesi .sidebar { display: none; }
html.modus-praesi .app { grid-template-columns: minmax(0, 1fr); }
html.modus-praesi .menu-btn { display: inline-flex; }
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; position: fixed; inset: 56px 0 0 0; z-index: 30; max-height: none; border-right: 0; }
  html.nav-offen .sidebar { display: block; }
  .menu-btn { display: inline-flex; }
  .main { padding: var(--space-4) 16px var(--space-10); }
  .brand b { display: none; }
}

/* Buttons und Kleinteile */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--gap-inline); min-height: var(--control-h-md);
  padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer;
  font-weight: var(--fw-semibold); font-size: var(--text-sm); background: var(--action); color: var(--action-contrast);
  transition: background 120ms ease, transform 120ms ease;
}
.btn:hover { background: var(--indigo-hover); }
.btn:active { transform: translateY(0.5px); background: var(--indigo-press); }
.btn.sek { background: var(--surface-card); color: var(--text-strong); border-color: var(--border-strong); }
.btn.sek:hover { background: var(--surface-sunken); }
.btn.sek[aria-pressed="true"] { background: var(--medape-navy); color: #fff; border-color: var(--medape-navy); }
.btn.ghost { background: none; color: var(--text-body); }
.btn.ghost:hover { background: var(--surface-sunken); }
.btn.gross { min-height: var(--control-h-lg); padding: 0 var(--space-6); font-size: var(--text-base); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn svg, .icon { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-md); overflow: hidden; background: var(--surface-card); }
.seg button { border: 0; background: none; cursor: pointer; padding: 0 var(--space-3); min-height: 34px; font-size: var(--text-sm); color: var(--text-body); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--medape-navy); color: #fff; font-weight: var(--fw-semibold); }
.badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--fw-semibold); background: var(--surface-sunken); color: var(--text-muted); border: 1px solid var(--border); }
.badge.entwurf { background: var(--warning-bg-light); color: var(--fb-akz-fg); border-color: var(--warning-border-light); }
.badge.haus { background: var(--info-bg-light); color: var(--medape-blue); border-color: var(--info-border-light); }
.badge.fehl { background: var(--fb-falsch-bg); color: var(--fb-falsch-fg); border-color: var(--fb-falsch-bd); }
.badge.ok { background: var(--fb-richtig-bg); color: var(--fb-richtig-fg); border-color: var(--fb-richtig-bd); }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); background: var(--surface-sunken); border: 1px solid var(--border); color: var(--text-muted); }
.chip.zeit { background: var(--medape-navy); color: #fff; border-color: var(--medape-navy); font-weight: var(--fw-semibold); }

.card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); margin-bottom: var(--space-4); }
.card.akzent { border-left: var(--accent-bar) solid var(--accent); }
.card h2 + p, .card h3 + p { margin-top: var(--space-2); }
.grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.stack > * + * { margin-top: var(--space-3); }
.alert { border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); background: var(--surface-sunken); font-size: var(--text-sm); }
.alert.info { background: var(--info-bg-light); border-color: var(--info-border-light); }
.alert.warn { background: var(--warning-bg-light); border-color: var(--warning-border-light); }
.alert.richtig { background: var(--fb-richtig-bg); border-color: var(--fb-richtig-bd); color: var(--fb-richtig-fg); }
.alert.akzeptabel { background: var(--fb-akz-bg); border-color: var(--fb-akz-bd); color: var(--fb-akz-fg); }
.alert.falsch { background: var(--fb-falsch-bg); border-color: var(--fb-falsch-bd); color: var(--fb-falsch-fg); }
.alert strong { color: inherit; }
.moderation { border-left: 4px solid var(--indigo); background: var(--indigo-soft); color: #312e81; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); font-size: var(--text-sm); margin: var(--space-3) 0; }
[data-theme="dark"] .moderation { background: #232a52; color: #c7d2fe; }
html:not(.modus-praesi) .moderation { display: none; }
html.modus-praesi .nur-selbst { display: none; }
.nur-praesi { display: none !important; }
html.modus-praesi .nur-praesi { display: flex !important; }
.vorhersage { gap: 8px; align-items: center; margin: 8px 0; }
.footbar .hinweis {
  background: var(--warning-bg-light); border-top: 1px solid var(--warning-border-light); color: var(--fb-akz-fg);
  font-size: var(--text-xs); padding: var(--space-2) var(--space-4); line-height: 1.4;
}
[data-theme="dark"] .footbar .hinweis { color: var(--warning-fg); }
.footbar .hinweis b { font-weight: var(--fw-semibold); }

/* Kopf einer Modulseite */
.modul-kopf { margin-bottom: var(--space-5); }
.modul-kopf .row { margin-bottom: var(--space-2); }
.modul-kopf p.lead { font-size: var(--text-md); color: var(--text-muted); margin-top: var(--space-2); }
ul.klar { margin: var(--space-2) 0 0; padding-left: 1.2em; }
ul.klar li { margin: 4px 0; }
.quellen-liste { font-size: var(--text-sm); }
.quellen-liste li { margin: 4px 0; }
.q-chip { font-size: var(--text-xs); color: var(--text-muted); margin-left: 6px; }

/* Tabs */
.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); margin-bottom: var(--space-5); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: var(--space-3) var(--space-4); cursor: pointer; color: var(--text-muted); font-weight: var(--fw-medium); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text-strong); border-bottom-color: var(--accent); font-weight: var(--fw-semibold); }

/* Auswahloptionen */
.opts { display: grid; gap: var(--space-2); margin: var(--space-3) 0; }
.opt {
  display: flex; gap: var(--space-3); align-items: flex-start; text-align: left; width: 100%; padding: var(--space-3) var(--space-4);
  background: var(--surface-card); border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); cursor: pointer; font-size: var(--text-base);
}
.opt:hover:not([disabled]) { border-color: var(--action); background: var(--surface-sunken); }
.opt[disabled] { cursor: default; }
.opt .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-top: 1px; }
.opt.kasten .mark { border-radius: 6px; }
.opt.gewaehlt { border-color: var(--action); box-shadow: var(--focus-ring-action); }
.opt.gewaehlt .mark { background: var(--action); border-color: var(--action); color: #fff; }
.opt.richtig { background: var(--fb-richtig-bg); border-color: var(--fb-richtig-bd); }
.opt.akzeptabel { background: var(--fb-akz-bg); border-color: var(--fb-akz-bd); }
.opt.falsch { background: var(--fb-falsch-bg); border-color: var(--fb-falsch-bd); }
.opt.empfohlen { box-shadow: 0 0 0 2px var(--success); }
.opt.gedimmt { opacity: 0.55; }
.opt .t { flex: 1; }
.opt .fb { display: block; font-size: var(--text-sm); margin-top: 6px; color: var(--text-muted); }

/* Fall */
.fall-kopf { display: grid; gap: var(--space-4); grid-template-columns: 1fr; margin-bottom: var(--space-4); }
@media (min-width: 1280px) { .fall-kopf.mit-monitor { grid-template-columns: minmax(260px, 340px) 1fr; } }
.patient-card h3 { margin-bottom: var(--space-1); }
.fortschritt { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: var(--space-4); }
.fortschritt i { display: block; height: 100%; background: var(--accent); transition: width 200ms ease; }
.ergebnis-liste { display: grid; gap: var(--space-2); margin-top: var(--space-3); }
.ergebnis { border-left: 4px solid var(--medape-blue); padding: var(--space-2) var(--space-3); background: var(--surface-sunken); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.ergebnis b { display: block; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); }
.chips-wahl { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-3) 0; }
.chips-wahl .opt { width: auto; padding: var(--space-2) var(--space-3); }
.sort-pool, .sort-folge { display: grid; gap: var(--space-2); margin: var(--space-3) 0; }
.sort-folge .opt { align-items: center; }
.num { flex: none; min-width: 26px; height: 26px; border-radius: 13px; background: var(--medape-navy); color: #fff; font-size: var(--text-xs); font-weight: var(--fw-bold); display: inline-flex; align-items: center; justify-content: center; }
.zahlfeld { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin: var(--space-4) 0; }
.zahlfeld input[type=range] { flex: 1; min-width: 180px; accent-color: var(--action); height: 28px; }
input[type=number], input[type=text], input[type=password] {
  min-height: var(--control-h-md); padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--border-strong);
  background: var(--surface-card); color: var(--text-strong); font: inherit;
}
.zahl-gross { font-size: var(--text-2xl); font-weight: var(--fw-light); min-width: 5ch; }
.zuordnen-zeile { display: grid; gap: var(--space-2); padding: var(--space-3) 0; border-bottom: 1px solid var(--border); }
.zuordnen-zeile:last-child { border-bottom: 0; }
.kat-btns { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.kat-btns button { border: 1.5px solid var(--border-strong); background: var(--surface-card); border-radius: var(--radius-pill); padding: 4px 12px; cursor: pointer; font-size: var(--text-sm); }
.kat-btns button[aria-pressed="true"] { background: var(--action); color: #fff; border-color: var(--action); }
.kat-btns button.richtig { background: var(--fb-richtig-bg); border-color: var(--success); color: var(--fb-richtig-fg); }
.kat-btns button.falsch { background: var(--fb-falsch-bg); border-color: var(--danger); color: var(--fb-falsch-fg); }
.zusammenfassung td, .zusammenfassung th { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: var(--text-sm); }
.zusammenfassung { border-collapse: collapse; width: 100%; }
.score { font-size: var(--text-4xl); font-weight: var(--fw-light); color: var(--text-strong); line-height: 1; }

/* Monitor */
.mon { background: var(--mon-bg); border-radius: var(--radius-lg); overflow: hidden; display: grid; grid-template-columns: 1fr 132px; color: #fff; position: relative; border: 1px solid #1e293b; }
.mon canvas { display: block; width: 100%; background: var(--mon-bg); }
.mon .kurven { display: grid; position: relative; }
.mon .num-spalte { background: var(--mon-panel); border-left: 1px solid #1e293b; display: grid; grid-template-rows: repeat(4, 1fr); }
.mon .num-spalte > div { padding: 6px 10px; border-bottom: 1px solid #1e293b; display: flex; flex-direction: column; justify-content: center; }
.mon .num-spalte > div:last-child { border-bottom: 0; }
.mon .lbl { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.mon .val { font-family: var(--font-mono); font-weight: 500; font-size: 30px; line-height: 1; letter-spacing: -0.02em; }
.mon .val small { font-size: 12px; font-weight: 400; margin-left: 4px; opacity: 0.8; }
.mon .hf .val { color: var(--c-ekg); }
.mon .abp .val { color: var(--c-abp); }
.mon .abp .val.klein { font-size: 20px; }
.mon .spo2 .val { color: var(--c-spo2); }
.mon .af .val, .mon .temp .val { color: var(--c-af); }
.mon .alarm { position: absolute; left: 0; right: 132px; top: 0; padding: 4px 12px; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; background: #b91c1c; color: #fff; animation: blink 0.9s steps(2, start) infinite; z-index: 2; }
@keyframes blink { 50% { opacity: 0.35; } }
.mon.kompakt { grid-template-columns: 1fr 100px; }
.mon.kompakt .val { font-size: 22px; }
.mon.kompakt .alarm { right: 100px; font-size: 11px; }
@media (max-width: 560px) { .mon, .mon.kompakt { grid-template-columns: 1fr; } .mon.kompakt .alarm { right: 0; } .seg button span { display: none; } .seg button { padding: 0 var(--space-3); } .mon .num-spalte { grid-template-columns: repeat(4, 1fr); grid-template-rows: auto; border-left: 0; border-top: 1px solid #1e293b; } .mon .num-spalte > div { border-bottom: 0; border-right: 1px solid #1e293b; } .mon .val { font-size: 22px; } .mon .alarm { right: 0; } }
.ekg-wrap { background: #fffdf9; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
[data-theme="dark"] .ekg-wrap { background: #fffdf9; }
.ekg-wrap canvas { display: block; width: 100%; cursor: crosshair; }

/* Sandkasten */
.sb-grid { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@media (min-width: 1280px) { .sb-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.kpi-reihe { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); }
.kpi { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); border-bottom: 4px solid var(--border-strong); }
.kpi .l { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); font-weight: var(--fw-semibold); }
.kpi .v { font-size: var(--text-xl); font-weight: var(--fw-light); color: var(--text-strong); font-family: var(--font-mono); line-height: 1.2; }
.kpi .v small { font-size: var(--text-xs); color: var(--text-muted); }
.kpi.ok { border-bottom-color: var(--success); }
.kpi.warn { border-bottom-color: var(--warning); }
.kpi.krit { border-bottom-color: var(--danger); }
.regler { display: grid; gap: var(--space-3); }
.regler label { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--space-3); font-size: var(--text-sm); }
.regler label span.w { font-family: var(--font-mono); font-weight: 500; color: var(--text-strong); }
.regler input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--action); height: 26px; }
.regler .hinweis { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--text-muted); margin-top: -2px; }
.ziel { display: flex; gap: var(--space-2); align-items: center; font-size: var(--text-sm); padding: 4px 0; }
.ziel .h { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.ziel.erreicht .h { background: var(--success); border-color: var(--success); color: #fff; }
.plot { width: 100%; height: auto; display: block; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.plot text { fill: var(--text-muted); font-size: 11px; font-family: var(--font-sans); }

/* Triage */
.bett-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.bett { position: relative; cursor: pointer; border: 2px solid transparent; border-radius: var(--radius-lg); padding: 0; background: none; text-align: left; }
.bett .rang { position: absolute; right: -6px; top: -10px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 18px; display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-md); }
.bett.gewaehlt .rang { display: flex; }
.bett.gewaehlt { border-color: var(--accent); }
.bett .meta { padding: var(--space-2) var(--space-1) 0; font-size: var(--text-sm); }
.bett .meta b { color: var(--text-strong); }
.bett.richtig { border-color: var(--success); }
.bett.falsch { border-color: var(--danger); }
.fortschritt.zeit i { background: var(--danger); transition: none; }

/* ISBAR */
.karte { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-card); margin-bottom: var(--space-2); }
.karte.richtig { border-color: var(--success); background: var(--fb-richtig-bg); }
.karte.falsch { border-color: var(--danger); background: var(--fb-falsch-bg); }
.karte.luecke { border-color: var(--warning); background: var(--fb-akz-bg); }
.buchstaben { display: flex; gap: 6px; flex-wrap: wrap; }
.buchstaben button { min-width: 40px; min-height: 36px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong); background: var(--surface-card); font-weight: var(--fw-semibold); cursor: pointer; }
.buchstaben button[aria-pressed="true"] { background: var(--medape-navy); color: #fff; border-color: var(--medape-navy); }
.buchstaben button.soll { box-shadow: 0 0 0 2px var(--success); }
.muster dt { font-weight: var(--fw-bold); color: var(--medape-orange-dark); margin-top: var(--space-2); }
.muster dd { margin: 2px 0 0; }

/* Startseite */
.hero { display: grid; gap: var(--space-6); grid-template-columns: 1fr; align-items: center; padding: var(--space-6) 0 var(--space-8); }
@media (min-width: 800px) { .hero { grid-template-columns: 1.3fr 1fr; } }
.hero img { width: 100%; max-width: 360px; height: auto; justify-self: center; }
.hero h1 { font-size: var(--text-4xl); font-weight: var(--fw-light); }
.hero h1 b { font-weight: var(--fw-bold); color: var(--medape-orange); }
.modul-karte { text-align: left; cursor: pointer; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); display: grid; gap: var(--space-2); border-left: var(--accent-bar) solid var(--accent); transition: box-shadow 120ms ease, transform 120ms ease; }
.modul-karte:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.modul-karte h3 { font-size: var(--text-md); }
.gruppe-titel { margin: var(--space-6) 0 var(--space-3); }
.schema-svg { width: 100%; max-width: 920px; height: auto; display: block; margin: var(--space-3) auto; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.schema-svg text { fill: var(--text-body); font-size: 13px; font-family: var(--font-sans); }
.merkkarte ol { padding-left: 1.4em; } .merkkarte li { margin: 6px 0; }
@media print {
  .footbar { position: static; }
  .footbar details > div { display: block !important; }
  .topbar, .sidebar, .tabs, .btn, .no-print { display: none !important; }
  .app { display: block; } body { background: #fff; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>

on 2024, Abb. 18 (ADD-RS, Diagnostik des akuten Aortensyndroms)","url":"https://herzmedizin.de/asset/2778/23_2024_pocket_leitlinien_paad.pdf","stand":"2024"},{"id":"esc-le","kurz":"ESC LE 2019","titel":"Konstantinides SV et al.: 2019 ESC Guidelines for the diagnosis and management of acute pulmonary embolism. Eur Heart J 2020;41:543–603","url":"https://academic.oup.com/eurheartj/article/41/4/543/5556136","stand":"2019"},{"id":"esc-peri","kurz":"ESC Myo/Peri 2025","titel":"Schulz-Menger J et al.: 2025 ESC Guidelines for the management of myocarditis and pericarditis. Eur Heart J 2025;46:3952–4041 (Abschnitt 3.3.2, Tabelle 4)","url":"https://academic.oup.com/eurheartj/article/46/40/3952/8234483","stand":"2025"},{"id":"erc-als","kurz":"ERC ALS 2025","titel":"Soar J et al.: European Resuscitation Council Guidelines 2025 Adult Advanced Life Support. Resuscitation 2025;215 Suppl 1:110769","url":"https://doi.org/10.1016/j.resuscitation.2025.110769","stand":"2025"}],"moderation":"Impulsfragen:\n1. Welche Befunde hätten euch vor ASS und Heparin innehalten lassen, und wie viele ADD-RS-Punkte hat Herr K.?\n2. Warum schließt ein unauffälliger erster Troponinwert nach 45 Minuten nichts aus, und wann darf ein einzelner Wert ausschließen?\n3. Woran erkennt ihr am Bett, dass eine Kammertachykardie instabil ist, und was ändert das am ersten Handgriff?\n4. Was müsste sich ändern, wenn euer Labor einen anderen hs-Troponin-Assay verwendet?","patient":{"kurz":"Herr K., 61 Jahre","alter":61,"geschlecht":"m","gewicht_kg":86,"groesse_cm":178,"vorgeschichte":"Arterielle Hypertonie, raucht. Hausmedikation Ramipril. Kommt mit seiner Frau selbst in die Notaufnahme."},"start":{"zeit":"Minute 0","vitals":{"hf":96,"sys":156,"dia":92,"spo2":96,"af":18,"temp":36.7},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","text":"Notaufnahme, 18:20 Uhr. Herr K., 61 Jahre, kommt mit seiner Frau: Seit etwa 40 Minuten drückt es hinter dem Brustbein. Er ist blass und leicht kaltschweißig. Die Pflege legt den Monitor an und schreibt das 12-Kanal-EKG. Du bist als PJ-Studierende:r mit dem Dienstarzt eingeteilt und übernimmst Anamnese und Untersuchung.","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 2","text":"Das EKG läuft (Ziel: befundet innerhalb von 10 Minuten nach Ankunft). Was erfragst und untersuchst du parallel? Denk an das ACS und an die gefährlichen Differenzialdiagnosen.","optionen":[{"id":"schmerz","label":"Schmerzanamnese","ergebnis":"Drückender Schmerz hinter dem Brustbein, 7/10, vor 40 Minuten in Ruhe beim Fernsehen begonnen. Ausstrahlung in den linken Arm und den Unterkiefer, dazu Übelkeit und Schweiß. Nicht atem- oder lageabhängig, nicht reißend, kein Rückenschmerz, kein Schmerzmaximum zu Beginn. Seit zwei Wochen kürzere ähnliche Episoden beim Treppensteigen.","q":["esc-acs"]},{"id":"rf","label":"Vorgeschichte und Risikofaktoren","ergebnis":"Hypertonie, Hypercholesterinämie, raucht seit 35 Jahren eine Schachtel täglich. Vater mit 58 Jahren Herzinfarkt. Kein bekanntes Aortenaneurysma, keine Klappenerkrankung, kein Marfan-Syndrom, keine Eingriffe an der Aorta. Keine Operation, keine Immobilisation, keine Thrombose. Kein Schlaganfall, keine Blutung.","q":["esc-aorta","esc-le"]},{"id":"med","label":"Medikation und Allergien","ergebnis":"Ramipril 5 mg. Keine Gerinnungshemmer. Keine PDE-5-Hemmer in den letzten 48 Stunden. Keine Allergien, auch nicht gegen Kontrastmittel."},{"id":"rr","label":"Blutdruck an beiden Armen","ergebnis":"Rechts 156/92 mmHg, links 152/90 mmHg. Keine relevante Seitendifferenz.","q":["esc-acs","esc-aorta"]},{"id":"puls","label":"Pulsstatus","ergebnis":"Radialis-, Femoralis- und Fußpulse beidseits gut und seitengleich tastbar.","q":["esc-acs","esc-aorta"]},{"id":"herz","label":"Herz auskultieren","ergebnis":"Reine, rhythmische Herztöne. Kein Geräusch, insbesondere kein Diastolikum, kein Perikardreiben.","q":["esc-aorta","esc-peri"]},{"id":"lunge","label":"Lunge auskultieren und perkutieren","ergebnis":"Vesikuläres Atemgeräusch beidseits, seitengleich, keine Rasselgeräusche, sonorer Klopfschall. Atemfrequenz 18/min, SpO₂ 96 % bei Raumluft."},{"id":"beine","label":"Beine und Neurologie","ergebnis":"Keine Beinschwellung, keine Wadenschmerzen. Wach, orientiert, keine fokal-neurologischen Defizite.","q":["esc-le","esc-aorta"]},{"id":"echo","label":"Fokussierte Echokardiographie","ergebnis":"LV-Funktion visuell erhalten, lateral fraglich verminderte Wandbewegung. Rechter Ventrikel nicht dilatiert, kein Perikarderguss, Aortenwurzel nicht erweitert. Pleuragleiten beidseits. Eine Dissektion ist damit nicht ausgeschlossen, aber nichts spricht dafür.","q":["esc-acs"]}],"pflicht":["schmerz","rr","puls","herz","lunge"],"weiter":"k3","moderation":"Erst sammeln lassen: Welche Befunde würden euch von ASS und Heparin abhalten? Danach gemeinsam den ADD-RS für Herrn K. bestimmen (hier 0 Punkte)."},{"id":"k3","typ":"wahl","zeit":"Minute 8","frage":"Das EKG liegt vor: Sinusrhythmus 96/min, horizontale ST-Senkungen von 1 mm in V4 bis V6. Keine ST-Hebungen, auch nicht in aVR oder V1, keine ST-Senkungen in V1 bis V3, kein Schenkelblock. Ein Vor-EKG gibt es nicht. Wie ordnest du das ein?","optionen":[{"id":"a","text":"NSTE-ACS als Arbeitsdiagnose: ischämietypischer Schmerz, ST-Senkungen, keine ST-Hebung","bewertung":"richtig","feedback":"Ohne persistierende ST-Hebung oder ein STEMI-Äquivalent lautet die Arbeitsdiagnose NSTE-ACS. ST-Senkungen machen ein ACS wahrscheinlicher. Hielte der Schmerz trotz Therapie an oder würde der Kreislauf instabil, wäre es ein NSTE-ACS mit sehr hohem Risiko und damit ein Fall für die sofortige Angiographie.","q":["esc-acs","esc-acs-pocket"]},{"id":"b","text":"STEMI, sofort ins Katheterlabor","bewertung":"falsch","feedback":"Es fehlt die ST-Hebung in zwei benachbarten Ableitungen, und es liegt kein STEMI-Äquivalent vor, etwa ST-Senkungen in V1 bis V3 als Hinweis auf einen Hinterwandinfarkt. Beim NSTE-ACS ergibt sich die Dringlichkeit aus den Risikokriterien.","q":["esc-acs"]},{"id":"c","text":"Unspezifisches EKG, ein ACS ist damit unwahrscheinlich","bewertung":"falsch","feedback":"Beim NSTE-ACS ist das EKG bei mehr als einem Drittel der Patient:innen sogar normal. Horizontale ST-Senkungen bei typischem Ruheschmerz machen ein ACS wahrscheinlicher, nicht unwahrscheinlicher.","q":["esc-acs"]},{"id":"d","text":"Perikarditis","bewertung":"falsch","feedback":"Typisch wären ausgedehnte ST-Hebungen über mehrere Gefäßterritorien mit PR-Senkung und ein scharfer, atem- und lageabhängiger Schmerz. Herr K. hat drückenden Ruheschmerz und ST-Senkungen.","q":["esc-peri"]}],"erklaerung":"STEMI nach ESC: neue ST-Hebung am J-Punkt in mindestens zwei benachbarten Ableitungen; in V2 und V3 mindestens 2,5 mm bei Männern unter 40 Jahren, 2 mm bei Männern ab 40 Jahren und 1,5 mm bei Frauen, in den übrigen Ableitungen mindestens 1 mm. Äquivalente: ST-Senkungen in V1 bis V3 beim Hinterwandinfarkt (dann V7 bis V9 ableiten), Schenkelblock oder Schrittmacherrhythmus bei starkem Ischämieverdacht.","weiter":"k4"},{"id":"k4","typ":"zuordnen","zeit":"Minute 9","frage":"Für Herrn K. passt bisher alles zum ACS. Bevor Gerinnungshemmer laufen, sollten die gefährlichen Alternativen bedacht sein. Ordne jedes Warnzeichen der Differenzialdiagnose zu, an die es zuerst denken lässt.","kategorien":[{"id":"ad","name":"Aortendissektion"},{"id":"le","name":"Lungenembolie"},{"id":"peri","name":"Perikarditis"},{"id":"ptx","name":"Pneumothorax"}],"eintraege":[{"text":"Abrupt einsetzender, sehr heftiger oder reißender Schmerz in Brust, Rücken oder Bauch","kategorie":"ad","warum":"Das ist das Schmerzmerkmal im ADD-RS (1 Punkt). Ab 2 Punkten gilt hohes Risiko: CT der Aorta ohne Verzögerung. Herr K. beschreibt Druck ohne Maximum zu Beginn."},{"text":"Pulsdefizit oder Differenz des systolischen Blutdrucks zwischen den Armen, neues Diastolikum, fokales neurologisches Defizit","kategorie":"ad","warum":"Perfusionsdefizit, neues Aorteninsuffizienz-Geräusch und neurologisches Defizit sind die Untersuchungsmerkmale im ADD-RS. Deshalb gehören Pulse und Blutdruck an beiden Armen zur Erstuntersuchung. Eine Typ-A-Dissektion kann selbst einen STEMI verursachen."},{"text":"Plötzliche Luftnot, Tachykardie und Sättigungsabfall, im Echo ein dilatierter rechter Ventrikel","kategorie":"le","warum":"Typische Konstellation einer relevanten Lungenembolie. Bei zentraler Embolie kann der Schmerz angina-artig sein. Abklärung nach klinischer Wahrscheinlichkeit, D-Dimer bei niedriger oder mittlerer Wahrscheinlichkeit, sonst CT-Pulmonalisangiographie."},{"text":"Einseitig geschwollenes, schmerzhaftes Bein, Synkope, Operation vor zwei Wochen","kategorie":"le","warum":"Zeichen der tiefen Beinvenenthrombose und eine kürzliche Operation gehen in den Genfer Score ein. Eine Synkope spricht bei Lungenembolie für eine Belastung des rechten Ventrikels."},{"text":"Scharfer Schmerz, stärker beim Einatmen und im Liegen, besser im Sitzen mit vorgebeugtem Oberkörper","kategorie":"peri","warum":"Klassischer perikarditischer Schmerz. Ischämieschmerz ist meist drückend und nicht lageabhängig."},{"text":"Perikardreiben, ausgedehnte ST-Hebungen mit PR-Senkung, neuer Perikarderguss, CRP erhöht","kategorie":"peri","warum":"Das sind die Zusatzkriterien der Perikarditis nach ESC 2025. Bei EKG-Veränderungen immer an eine begleitende Myokarditis denken."},{"text":"Plötzlicher einseitiger, atemabhängiger Schmerz mit Luftnot, einseitig abgeschwächtes Atemgeräusch, hypersonorer Klopfschall","kategorie":"ptx","warum":"Klinische Zeichen des Pneumothorax. Deshalb gehören seitengleiche Auskultation und Perkussion zur Erstuntersuchung."},{"text":"Einseitig fehlendes Pleuragleiten im Ultraschall, dazu Hypotonie und gestaute Halsvenen","kategorie":"ptx","warum":"Fehlendes Pleuragleiten passt zum Pneumothorax, kann aber auch andere Ursachen haben (etwa eine einseitige Intubation). Mit Schock und Einflussstauung an einen Spannungspneumothorax denken, eine sofort behandelbare Ursache des Kreislaufversagens."}],"weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 10","frage":"Arbeitsdiagnose NSTE-ACS. Herr K. ist kreislaufstabil (RR 156/92 mmHg, SpO₂ 96 % bei Raumluft), Schmerz 7/10, ADD-RS 0. Was veranlasst du jetzt?","optionen":[{"id":"a","text":"Kontinuierliches EKG-Monitoring, Defibrillator in Reichweite","richtig":true,"feedback":"ESC Klasse I bei Verdacht auf ACS mit EKG-Veränderungen oder anhaltendem Schmerz. Lebensbedrohliche Rhythmusstörungen können jederzeit auftreten."},{"id":"b","text":"Venöser Zugang, sofort Blut für hs-Troponin (0-h-Wert), Blutbild, Kreatinin, Elektrolyte und Gerinnung","richtig":true,"feedback":"Der 0-h-Wert wird direkt bei Ankunft abgenommen, das Ergebnis soll innerhalb von 60 Minuten vorliegen (ESC Klasse I). Kreatinin, Blutbild und Gerinnung braucht ihr für Antithrombotika und Katheter."},{"id":"c","text":"ASS als Aufsättigung, nach ESC 150 bis 300 mg p.o. oder 75 bis 250 mg i.v.","richtig":true,"feedback":"ASS ist bei allen ACS-Patient:innen ohne Kontraindikation empfohlen (ESC Klasse I). Voraussetzung: kein Hinweis auf Aortendissektion oder aktive Blutung. Der ADD-RS ist 0."},{"id":"d","text":"Nitrat sublingual gegen den Schmerz","richtig":true,"feedback":"Kann die Beschwerden lindern. Der Blutdruck reicht, keine PDE-5-Hemmer, kein Hinweis auf Rechtsherzinfarkt. Aber: Besserung unter Nitrat beweist oder widerlegt kein ACS, Nitrat ist kein diagnostischer Test."},{"id":"e","text":"Sauerstoff 4 l/min über Nasenbrille","richtig":false,"feedback":"Bei einer Sättigung über 90 % ist routinemäßiger Sauerstoff nicht empfohlen (ESC Klasse III). Sauerstoff erst unter 90 %."},{"id":"f","text":"Troponin erst nach 3 Stunden abnehmen, weil die Beschwerden erst seit 40 Minuten bestehen","richtig":false,"feedback":"Die ESC-Algorithmen gelten unabhängig vom Schmerzbeginn, der erste Wert wird sofort abgenommen. Nur der Ausschluss mit einem einzigen sehr niedrigen Wert setzt einen Schmerzbeginn vor mehr als 3 Stunden voraus."},{"id":"g","text":"Routinemäßige CT-Koronarangiographie vor der Troponinbestimmung","richtig":false,"feedback":"Eine routinemäßige frühe CCTA ist bei Verdacht auf ACS nicht empfohlen (ESC Klasse III). Sie kann in der Beobachtungszone bei unklaren Werten helfen."}],"weiter":"k6"},{"id":"k6","typ":"wahl","zeit":"Minute 50","effekt":{"vitals":{"hf":84,"sys":138,"dia":84}},"frage":"Nach Nitrat ist der Schmerz auf 2/10 zurückgegangen. Das Labor (hs-cTnT, Elecsys) meldet den 0-h-Wert, abgenommen 45 Minuten nach Schmerzbeginn: **9 ng/l**, unter dem Referenzwert. Herr K. fühlt sich besser und möchte nach Hause. Wie geht es weiter?","optionen":[{"id":"a","text":"Zweiten Wert wie geplant 60 Minuten nach der ersten Abnahme bestimmen und nach dem 0/1-h-Algorithmus entscheiden; Herr K. bleibt am Monitor","bewertung":"richtig","feedback":"Der zweite Wert wird zum festen Zeitpunkt abgenommen, auch wenn das erste Ergebnis noch nicht da ist. Erst 0-h-Wert und Änderung in einer Stunde zusammen erlauben Rule-out oder Rule-in.","q":["esc-acs","esc-acs-supp"]},{"id":"b","text":"Infarkt ausgeschlossen, Entlassung mit Termin in der Hausarztpraxis","bewertung":"falsch","weiter":"k6b","feedback":"Ein einzelner Wert schließt nur aus, wenn er sehr niedrig ist (Elecsys hs-cTnT unter 5 ng/l) und der Schmerz vor mehr als 3 Stunden begann. Hier trifft beides nicht zu. Troponin steigt zeitabhängig, frühe Werte können noch niedrig sein.","q":["esc-acs-supp","esc-acs-pocket"]},{"id":"c","text":"Nächste Abnahme erst nach 3 Stunden (0/3-h-Schema)","bewertung":"akzeptabel","feedback":"Sicher, aber langsam. Die ESC empfiehlt den 0/1-h-Algorithmus als beste und den 0/2-h-Algorithmus als zweitbeste Option; das 0/3-h-Schema nur, wenn die schnellen Algorithmen nicht verfügbar sind.","q":["esc-acs"]},{"id":"d","text":"Troponin ist in den ersten Stunden nicht verwertbar, nächste Abnahme nach 6 Stunden","bewertung":"falsch","feedback":"Hochsensitive Tests erfassen frühe Anstiege. Absolute Änderungen innerhalb von 1 bis 2 Stunden ersetzen die früher üblichen Intervalle von 3 bis 6 Stunden.","q":["esc-acs"]}],"erklaerung":"Elecsys hs-cTnT im 0/1-h-Algorithmus. Rule-out: 0-h-Wert unter 5 ng/l bei Schmerzbeginn vor mehr als 3 Stunden, oder 0-h-Wert unter 12 ng/l und Anstieg in einer Stunde unter 3 ng/l. Rule-in: 0-h-Wert ab 52 ng/l oder Anstieg ab 5 ng/l. Alles andere ist Beobachtungszone (3-h-Wert, ggf. Echo). Die Grenzwerte gelten nur für diesen Assay.","weiter":"k7"},{"id":"k6b","typ":"text","zeit":"Minute 110","text":"Die Pflege hatte nach Standard 60 Minuten nach der ersten Abnahme den zweiten Wert abgenommen. Herr K. sitzt schon angezogen im Wartebereich und wartet auf seinen Brief, als das Labor anruft: Der zweite Wert ist deutlich höher. Die Oberärztin stoppt die Entlassung, Herr K. kommt zurück an den Monitor. Ohne den zweiten Wert wäre er mit einem Infarkt nach Hause gegangen.","weiter":"k7"},{"id":"k7","typ":"wahl","zeit":"Minute 110","frage":"Nach Standard der Notaufnahme wurde 60 Minuten nach der ersten Abnahme der zweite Wert bestimmt: hs-cTnT **27 ng/l** (0 h: 9 ng/l). Kreatinin 0,9 mg/dl, Hb 14,6 g/dl, Thrombozyten 245/nl. Wie ordnest du das ein?","optionen":[{"id":"a","text":"Rule-in: Anstieg um 18 ng/l in einer Stunde, die Schwelle liegt bei 5 ng/l","bewertung":"richtig","feedback":"Ein Anstieg ab 5 ng/l in einer Stunde reicht für das Rule-in, auch wenn kein Wert 52 ng/l erreicht. Der positive Vorhersagewert liegt bei etwa 70 bis 75 %; die meisten Rule-in-Patient:innen werden aufgenommen und invasiv abgeklärt. Arbeitsdiagnose: NSTEMI.","q":["esc-acs","esc-acs-supp"]},{"id":"b","text":"Beobachtungszone, weil kein Wert über 52 ng/l liegt","bewertung":"falsch","feedback":"Rule-in geht über zwei Wege: hoher 0-h-Wert oder relevanter Anstieg in einer Stunde. Der Anstieg ist hier eindeutig.","q":["esc-acs-supp"]},{"id":"c","text":"Rule-out, weil der 0-h-Wert unter 12 ng/l lag","bewertung":"falsch","feedback":"Für ein Rule-out müsste zusätzlich der Anstieg in einer Stunde unter 3 ng/l bleiben. Entscheidend ist hier die Dynamik.","q":["esc-acs-supp"]},{"id":"d","text":"Eher kein Infarkt, Troponin ist bei Männern über 60 oft leicht erhöht","bewertung":"falsch","feedback":"Alter, Nierenfunktion und Geschlecht verschieben die Ausgangswerte, die Grenzwerte des Algorithmus gelten aber unabhängig davon. Ein Anstieg innerhalb einer Stunde spricht für eine akute Schädigung, und die Nierenfunktion ist normal.","q":["esc-acs","esc-acs-supp"]}],"erklaerung":"Fallstricke: Den Algorithmus nur bei Verdacht auf ACS und erst nach Ausschluss von STEMI und anderen lebensbedrohlichen Ursachen nutzen. Bei erneutem Schmerz oder hohem klinischen Verdacht weiter seriell messen. Bei sehr frühem Eintreffen und Rule-out einen zusätzlichen 3-h-Wert erwägen. Andere Ursachen erhöhter Werte mitdenken, etwa tachykardes Vorhofflimmern, ausgeprägte Anämie oder hypertensiver Notfall.","weiter":"k8"},{"id":"k8","typ":"zuordnen","zeit":"Minute 115","frage":"Du rufst mit dem Dienstarzt im Katheterlabor an: NSTEMI nach 0/1-h-Algorithmus, schmerzfrei, stabil, Kreatinin normal, keine Allergien, ASS gegeben. Die Kollegin fragt: „Wie dringend?“ Ordne zu, welches Zeitziel die ESC für welche Situation nennt.","kategorien":[{"id":"sofort","name":"Sofort"},{"id":"z10","name":"Unter 10 min"},{"id":"z60","name":"Unter 60 min"},{"id":"z90","name":"Unter 90 min"},{"id":"z120","name":"Unter 120 min"},{"id":"z24","name":"Unter 24 h"}],"eintraege":[{"text":"Erstes 12-Kanal-EKG ab dem ersten medizinischen Kontakt, befundet","kategorie":"z10","warum":"ESC Klasse I: EKG so schnell wie möglich, Ziel unter 10 Minuten."},{"text":"hs-Troponin: Ergebnis ab der Blutentnahme","kategorie":"z60","warum":"Die Ergebnisse sollen innerhalb von 60 Minuten nach der Abnahme vorliegen (ESC Klasse I)."},{"text":"STEMI, diagnostiziert in einer Klinik mit Herzkatheterlabor: Diagnose bis Drahtpassage","kategorie":"z60","warum":"Zielzeit, wenn die Diagnose direkt im PCI-Zentrum gestellt wird."},{"text":"STEMI, diagnostiziert im Rettungsdienst oder in einer Klinik ohne Katheterlabor: Diagnose bis Drahtpassage","kategorie":"z90","warum":"Bei Diagnose außerhalb des PCI-Zentrums nennt die ESC unter 90 Minuten bis zur Drahtpassage."},{"text":"STEMI: erwartete Zeit von der Diagnose bis zur PCI, bis zu der die primäre PCI der Fibrinolyse vorgezogen wird","kategorie":"z120","warum":"Ist die PCI nicht innerhalb von 120 Minuten möglich, wird ohne Kontraindikation innerhalb von 12 Stunden nach Symptombeginn lysiert (ESC Klasse I)."},{"text":"Fibrinolyse als gewählte Strategie: Diagnose bis Lyse-Bolus","kategorie":"z10","warum":"So schnell wie möglich, Ziel unter 10 Minuten; danach sofortige Verlegung in ein PCI-Zentrum."},{"text":"NSTE-ACS mit sehr hohem Risiko: Schock, refraktärer Schmerz, lebensbedrohliche Arrhythmie, akute Herzinsuffizienz, mechanische Komplikation, wiederkehrende dynamische ST-Veränderungen","kategorie":"sofort","warum":"Sofortige invasive Strategie (ESC Klasse I), logistisch wie beim STEMI."},{"text":"Herr K.: bestätigter NSTEMI, schmerzfrei, stabil","kategorie":"z24","warum":"Hohes Risiko: frühe invasive Strategie innerhalb von 24 Stunden erwägen (ESC Klasse IIa), stationäre invasive Abklärung empfohlen (Klasse I). Dazu zählen auch dynamische ST-Veränderungen, passagere ST-Hebung und GRACE über 140."}],"moderation":"Die Ziele von 60 und 90 Minuten stammen aus der ESC-Abbildung zur STEMI-Logistik. Frage die Gruppe, welche Zeit für einen Infarkt gilt, der auf einer Station im eigenen Haus auftritt.","weiter":"k9"},{"id":"k9","typ":"mehrfach","zeit":"Minute 120","frage":"Das Katheterlabor plant die Koronarangiographie für morgen 07:30 Uhr als ersten Fall, also innerhalb von 24 Stunden. Bis dahin kommt Herr K. auf die IMC. Welche antithrombotischen Entscheidungen sind jetzt richtig?","optionen":[{"id":"a","text":"ASS fortführen, Erhaltung 75 bis 100 mg täglich","richtig":true,"feedback":"ASS ist die Basis der antithrombozytären Therapie beim ACS (ESC Klasse I)."},{"id":"b","text":"Parenterale Antikoagulation jetzt beginnen, bei geplanter Angiographie unter 24 Stunden mit UFH; Enoxaparin wäre eine Alternative","richtig":true,"feedback":"Antikoagulation ist bei allen ACS-Patient:innen zum Zeitpunkt der Diagnose empfohlen (Klasse I). Bei früher Angiographie ist UFH der Standard, Enoxaparin eine Alternative (Klasse IIa)."},{"id":"c","text":"Keinen P2Y12-Hemmer vorab; Aufsättigung erst, wenn die Koronaranatomie bekannt ist","richtig":true,"feedback":"Routinemäßiges Pretreatment ist beim NSTE-ACS mit unbekannter Anatomie und geplanter Angiographie unter 24 Stunden nicht empfohlen (Klasse III). Die Anatomie kann zum Beispiel noch eine Bypass-Operation nahelegen."},{"id":"d","text":"Wenn eine PCI folgt, Prasugrel bevorzugen: kein früherer Schlaganfall, jünger als 75 Jahre, schwerer als 60 kg","richtig":true,"feedback":"Bei PCI soll Prasugrel gegenüber Ticagrelor bevorzugt werden (Klasse IIa). Ein früherer Schlaganfall ist eine Kontraindikation; ab 75 Jahren oder unter 60 kg gilt eine reduzierte Erhaltungsdosis."},{"id":"e","text":"Ticagrelor 180 mg sofort, damit die Wirkung bis morgen sicher eingetreten ist","richtig":false,"feedback":"Das ist genau das routinemäßige Pretreatment, das hier nicht empfohlen ist. Erwogen werden kann es nur, wenn keine frühe Angiographie zu erwarten ist und kein hohes Blutungsrisiko besteht (Klasse IIb)."},{"id":"f","text":"Fondaparinux statt Heparin","richtig":false,"feedback":"Fondaparinux ist die Wahl, wenn keine Angiographie innerhalb von 24 Stunden zu erwarten ist (Klasse I). Bei früher Angiographie ist UFH empfohlen; unter Fondaparinux braucht es bei der PCI zusätzlich einen UFH-Bolus."},{"id":"g","text":"Zusätzlich ein GP-IIb/IIIa-Antagonist zur Vorbehandlung","richtig":false,"feedback":"Eine Vorbehandlung mit GP-IIb/IIIa-Antagonisten ist nicht empfohlen (Klasse III). Sie bleiben Bail-out-Situationen im Katheterlabor vorbehalten, etwa bei No-Reflow oder thrombotischer Komplikation."}],"erklaerung":"Prinzip: ASS und Antikoagulation sofort; der zweite Plättchenhemmer kommt beim NSTE-ACS mit früher Angiographie erst mit bekannter Anatomie. Pretreatment und Wahl des P2Y12-Hemmers regeln Häuser teils anders, im Dienst gilt der Hausstandard.","weiter":"k10"},{"id":"k10","typ":"zahl","zeit":"Minute 125","frage":"Der Dienstarzt bittet dich, den UFH-Bolus vorzubereiten. Herr K. wiegt 86 kg. Welche Dosis pro Kilogramm nennt die ESC für die Erstbehandlung?","einheit":"IE/kg","min":0,"max":200,"schritt":5,"start":20,"zielbereich":[70,100],"feedback_ok":"Die ESC nennt 70 bis 100 IE/kg als i.v.-Bolus, danach einen Perfusor nach aPTT (Ziel 60 bis 80 s). Bei 86 kg sind das etwa 6000 bis 8600 IE. Viele Häuser arbeiten mit festen oder gedeckelten Schemata; im Dienst gilt der Hausstandard.","feedback_zu_niedrig":"Das liegt unter der ESC-Spanne von 70 bis 100 IE/kg. Niedrigere, gedeckelte Boli finden sich in manchen Hausstandards; gemessen an der ESC wäre die Antikoagulation damit eher zu schwach.","feedback_zu_hoch":"Das liegt über der ESC-Spanne von 70 bis 100 IE/kg und erhöht das Blutungsrisiko. Auch im Katheterlabor startet man nach ESC mit 70 bis 100 IE/kg oder dosiert nach ACT nach.","weiter":"k11"},{"id":"k11","typ":"text","zeit":"IMC, 02:30 Uhr","effekt":{"rhythmus":"stemi","vitals":{"hf":98,"sys":128,"dia":80,"spo2":95,"af":20},"alarm":"ST-Hebung"},"text":"Herr K. war auf der IMC schmerzfrei, UFH läuft nach aPTT. Jetzt klingelt er: starker Druck 8/10, kaltschweißig. Am Monitor ST-Hebungen. Das 12-Kanal-EKG zeigt neue ST-Hebungen von 2 mm in II, III und aVF mit spiegelbildlicher Senkung in aVL. Arbeitsdiagnose jetzt: **STEMI**. Der Dienstarzt alarmiert das Katheterlabor (Ziel im PCI-Zentrum: unter 60 Minuten bis zur Drahtpassage) und lässt V3R und V4R ableiten. Du klebst vorsorglich Defibrillationspads und bereitest den Transport vor.","weiter":"k12"},{"id":"k12","typ":"wahl","zeit":"IMC, 02:33 Uhr","effekt":{"rhythmus":"vt","vitals":{"hf":186,"sys":74,"dia":46,"spo2":92,"af":24},"alarm":"VT"},"frage":"Alarm: regelmäßige Breitkomplextachykardie, 186/min. Herr K. ist noch ansprechbar, aber verlangsamt, blass und klagt über Brustschmerz. RR 74/46 mmHg, Puls schwach tastbar. Was tust du?","optionen":[{"id":"a","text":"Hilfe rufen, Defibrillator auf synchronisierten Modus, kurze Analgosedierung durch den Dienstarzt, dann synchronisierte Kardioversion","bewertung":"richtig","feedback":"Instabile Kammertachykardie mit Puls (Schock, Ischämie, Bewusstseinsminderung): Die elektrische Kardioversion ist die bevorzugte Therapie. Der Schock wird auf die R-Zacke synchronisiert. Wache Patient:innen brauchen eine Analgosedierung, vorsichtig dosiert, weil der Blutdruck weiter fallen kann.","q":["erc-als"]},{"id":"b","text":"Amiodaron 300 mg als Kurzinfusion über 20 Minuten und die Wirkung abwarten","bewertung":"falsch","feedback":"Bei Instabilität kommt zuerst der Strom. Amiodaron 300 mg über 10 bis 20 Minuten sieht die ERC erst vor, wenn die Kardioversion keinen Sinusrhythmus bringt, und dann zusammen mit einem erneuten Versuch. Während du wartest, degeneriert die Tachykardie.","q":["erc-als"],"effekt":{"rhythmus":"vf","vitals":{"hf":0,"sys":20,"dia":15,"spo2":70,"af":0},"alarm":"VF"},"weiter":"k15"},{"id":"c","text":"Sofort unsynchronisiert schocken, ohne Sedierung, um keine Zeit zu verlieren","bewertung":"falsch","feedback":"Bei Kammertachykardie mit Puls wird synchronisiert: Ein Schock in die T-Welle kann Kammerflimmern auslösen, genau das passiert hier. Unsynchronisiert schockt man nur, wenn die Synchronisation nicht gelingt, und wache Patient:innen brauchen vorher eine Analgosedierung.","q":["erc-als"],"effekt":{"rhythmus":"vf","vitals":{"hf":0,"sys":20,"dia":15,"spo2":70,"af":0},"alarm":"VF"},"weiter":"k15"},{"id":"d","text":"Erst ein vollständiges 12-Kanal-EKG schreiben, um eine supraventrikuläre Tachykardie mit Schenkelblock auszuschließen","bewertung":"falsch","feedback":"Bei instabiler Breitkomplextachykardie im akuten Infarkt ist die Kammertachykardie die Arbeitsdiagnose. Ein Ausdruck vom Monitor genügt zur Dokumentation; die Differenzierung darf die Kardioversion nicht verzögern.","q":["erc-als"],"effekt":{"rhythmus":"vf","vitals":{"hf":0,"sys":20,"dia":15,"spo2":70,"af":0},"alarm":"VF"},"weiter":"k15"}],"erklaerung":"Instabilitätszeichen nach ERC: Schock (zum Beispiel systolisch unter 90 mmHg mit Zeichen der Minderperfusion), Synkope, Herzinsuffizienz, myokardiale Ischämie. Liegt eines vor, ist die synchronisierte Kardioversion der erste Schritt.","moderation":"Vor dem Aufdecken fragen: Was ist der Unterschied zwischen „Puls tastbar“ und „stabil“?","weiter":"k13"},{"id":"k13","typ":"zahl","zeit":"IMC, 02:35 Uhr","frage":"Die Analgosedierung ist gegeben, die Synchronisationsmarker sitzen auf den R-Zacken. Welche Energie wählst du für den ersten synchronisierten Schock (biphasisches Gerät)?","einheit":"J","min":0,"max":360,"schritt":10,"start":50,"zielbereich":[120,150],"feedback_ok":"Die ERC empfiehlt bei Kammertachykardie mit Puls 120 bis 150 J für den ersten Schock und eine stufenweise Steigerung, falls er nicht wirkt. Vor dem Auslösen: alle weg vom Bett, Sauerstoff mindestens 1 m vom Thorax entfernen, Synchronisation prüfen.","feedback_zu_niedrig":"Das liegt unter der ERC-Empfehlung von 120 bis 150 J. Niedrigere Energien sind für Vorhofflattern und supraventrikuläre Tachykardien vorgesehen; bei Kammertachykardie kosten sie eher einen weiteren Schock unter Sedierung.","feedback_zu_hoch":"Das liegt über der ERC-Empfehlung für den ersten Schock. Bei Kammertachykardie mit Puls startet die ERC mit 120 bis 150 J und steigert erst, wenn der erste Schock nicht wirkt. Maximalenergie zum Start ist für Vorhofflimmern beschrieben, nicht hier.","weiter":"k14"},{"id":"k14","typ":"mehrfach","zeit":"IMC, 02:36 Uhr","effekt":{"rhythmus":"stemi","vitals":{"hf":96,"sys":112,"dia":70,"spo2":96,"af":18},"alarm":null},"frage":"Nach dem ersten Schock: Sinusrhythmus 96/min, RR 112/70 mmHg, Herr K. wird wieder wach. Die inferioren ST-Hebungen bestehen weiter. Was gehört jetzt dazu?","optionen":[{"id":"a","text":"Sofort ins Katheterlabor zur primären PCI, mit Pads, Monitor, Defibrillator und ärztlicher Begleitung; das Katheterlabor über die Kammertachykardie informieren","richtig":true,"feedback":"STEMI mit lebensbedrohlicher Arrhythmie: Die Reperfusion behandelt die Ursache. Bei wiederkehrender VT oder Kammerflimmern ist eine rasche und vollständige Revaskularisation empfohlen (ESC Klasse I)."},{"id":"b","text":"Kalium und Magnesium bestimmen (BGA) und Störungen ausgleichen","richtig":true,"feedback":"Neben der Ischämie sind Elektrolytstörungen typische, behandelbare Auslöser ventrikulärer Arrhythmien (ERC 2025)."},{"id":"c","text":"12-Kanal-EKG mit V3R und V4R dokumentieren, ohne den Transport aufzuhalten","richtig":true,"feedback":"Rechtspräkordiale Ableitungen zeigen beim inferioren Infarkt eine Beteiligung des rechten Ventrikels (ESC Klasse I). Das EKG dokumentiert zugleich den Rhythmus nach der Kardioversion."},{"id":"d","text":"Bei erneuter instabiler VT wieder kardiovertieren; bringt das keinen Sinusrhythmus, Amiodaron 300 mg i.v. über 10 bis 20 Minuten und erneuter Versuch","richtig":true,"feedback":"So beschreibt es die ERC. Bei polymorpher VT oder Kammerflimmern im ACS empfiehlt die ESC zusätzlich i.v. Betablocker und/oder Amiodaron, sofern keine Kontraindikation besteht."},{"id":"e","text":"Koronarangiographie wie geplant morgen früh, jetzt ist ja wieder Sinusrhythmus","richtig":false,"feedback":"Die persistierende ST-Hebung bedeutet STEMI, die lebensbedrohliche Arrhythmie zusätzlich sehr hohes Risiko. Beides verlangt die sofortige invasive Strategie."},{"id":"f","text":"Prophylaktisch einen Lidocain-Perfusor starten","richtig":false,"feedback":"Antiarrhythmika bei asymptomatischen, hämodynamisch irrelevanten ventrikulären Arrhythmien sind nicht empfohlen (ESC Klasse III). Lidocain kann bei wiederkehrender VT erwogen werden, wenn Betablocker, Amiodaron und Overdrive-Stimulation nicht wirken (Klasse IIb)."},{"id":"g","text":"Nitroglycerin i.v. gegen den Restschmerz","richtig":false,"feedback":"Beim inferioren Infarkt kann der rechte Ventrikel beteiligt sein, Nitrate können dann einen starken Blutdruckabfall auslösen. Direkt nach instabiler VT und vor Klärung mit V3R und V4R ist das riskant. Für die Schmerztherapie eher ein vorsichtig titriertes Opioid i.v."}],"weiter":"ende_gut"},{"id":"k15","typ":"wahl","zeit":"IMC, 02:35 Uhr","effekt":{"rhythmus":"vf","vitals":{"hf":0,"sys":20,"dia":15,"spo2":70,"af":0},"alarm":"VF"},"frage":"Herr K. verdreht die Augen, ist nicht mehr ansprechbar und atmet nicht normal. Der Monitor zeigt Kammerflimmern. Die Pads kleben bereits. Was tust du?","optionen":[{"id":"a","text":"Reanimationsalarm, sofort unsynchronisiert defibrillieren (biphasisch, in der Regel mindestens 150 J); da der Stillstand beobachtet und am Defibrillator überwacht ist, bis zu drei rasche Schocks hintereinander, dann sofort Thoraxkompressionen","bewertung":"richtig","feedback":"Kammerflimmern wird unsynchronisiert und so früh wie möglich defibrilliert, im Krankenhaus innerhalb von 3 Minuten. Bei beobachtetem, monitorüberwachtem Beginn mit sofort verfügbarem Defibrillator sieht die ERC bis zu drei Schocks in Folge vor. Die Energie richtet sich nach dem Gerät; ist sie unbekannt, die höchste Stufe wählen.","q":["erc-als"]},{"id":"b","text":"Im synchronisierten Modus schocken, wie für die Kardioversion vorbereitet","bewertung":"falsch","feedback":"Im Kammerflimmern gibt es keine R-Zacken, im Synchronmodus löst das Gerät nicht oder verzögert aus. Kammerflimmern und pulslose VT brauchen unsynchronisierte Schocks.","q":["erc-als"]},{"id":"c","text":"Zuerst intubieren, dann defibrillieren","bewertung":"falsch","feedback":"Die Defibrillation hat Vorrang. Den Atemweg schrittweise sichern; die Intubation darf weder Schock noch Thoraxkompressionen verzögern.","q":["erc-als"]},{"id":"d","text":"Amiodaron 300 mg i.v. geben und dann defibrillieren","bewertung":"falsch","feedback":"Medikamente kommen nach den ersten Schocks: Adrenalin 1 mg und Amiodaron 300 mg nach dem dritten Schock, Amiodaron 150 mg nach dem fünften. Der erste Schock darf nicht warten.","q":["erc-als"]}],"weiter":"ende_schlecht"},{"id":"ende_gut","typ":"ende","effekt":{"rhythmus":"sinus","vitals":{"hf":76,"sys":122,"dia":74,"spo2":97,"af":14},"alarm":null},"titel":"Debriefing: stabil durch die Nacht","text":"Drahtpassage 45 Minuten nach der STEMI-Diagnose: verschlossene rechte Kranzarterie, PCI mit Stent. Herr K. bleibt ohne erneute Rhythmusstörung und kommt zur Überwachung zurück. Entscheidend waren drei Dinge: den frühen Troponinwert nicht als Entwarnung lesen, die Antithrombotika an der geplanten Strategie ausrichten und bei instabiler Kammertachykardie ohne Zögern synchronisiert kardiovertieren.","lernpunkte":["Brustschmerz: Vitalwerte, EKG in unter 10 Minuten, Pulse und Blutdruck an beiden Armen, seitengleiche Lunge. Dissektion, Lungenembolie, Perikarditis und Pneumothorax mitdenken, bevor Gerinnungshemmer laufen.","Der 0/1-h-Algorithmus ist assayspezifisch. Ein einzelner Wert schließt nur bei sehr niedrigem Wert und Schmerzbeginn vor mehr als 3 Stunden aus; sonst entscheidet die Änderung in einer Stunde.","STEMI: primäre PCI, wenn sie innerhalb von 120 Minuten nach Diagnose möglich ist. NSTE-ACS: sehr hohes Risiko sofort, hohes Risiko (zum Beispiel bestätigter NSTEMI) innerhalb von 24 Stunden.","NSTE-ACS mit früher Angiographie: ASS und UFH sofort, kein routinemäßiges P2Y12-Pretreatment; bei PCI Prasugrel bevorzugen.","Instabile Kammertachykardie mit Puls: synchronisierte Kardioversion unter Analgosedierung, erster Schock 120 bis 150 J; danach die Ursache behandeln (Reperfusion, Elektrolyte)."],"moderation":"Frage am Ende: An welchem Punkt hätte der Fall am leichtesten kippen können? Sammle die Antworten und ordne sie den Phasen Notaufnahme, Labor und IMC zu."},{"id":"ende_schlecht","typ":"ende","effekt":{"rhythmus":"sinus_tachy","vitals":{"hf":112,"sys":94,"dia":58,"spo2":94,"af":14},"alarm":null},"titel":"Debriefing: Reanimation statt Kardioversion","text":"Nach dem zweiten Schock und etwa 3 Minuten Reanimation kehrt ein Spontankreislauf zurück. Herr K. bleibt zunächst nicht ansprechbar, wird intubiert und mit persistierender ST-Hebung direkt ins Katheterlabor gebracht: verschlossene rechte Kranzarterie, PCI mit Stent. Danach Intensivstation mit Temperaturkontrolle. Wie gut er sich neurologisch erholt, lässt sich frühestens nach 72 Stunden beurteilen. Die Kammertachykardie war mit tastbarem Puls noch gezielt behandelbar; Verzögerung oder der falsche Schockmodus haben einen Kreislaufstillstand daraus gemacht.","lernpunkte":["Instabil heißt: Schock, Synkope, Herzinsuffizienz oder Ischämie. Dann ist die synchronisierte Kardioversion der erste Schritt, nicht das Medikament und nicht die weitere Diagnostik.","Bei VT mit Puls wird auf die R-Zacke synchronisiert, ein Schock in die T-Welle kann Kammerflimmern auslösen. Unsynchronisiert nur, wenn die Synchronisation nicht gelingt.","Kammerflimmern: sofort unsynchronisiert defibrillieren, beim beobachteten Stillstand am Defibrillator bis zu drei Schocks in Folge; Adrenalin und Amiodaron erst nach dem dritten Schock.","Nach Reanimation mit persistierender ST-Hebung: primäre PCI. Bleiben Patient:innen nach ROSC nicht ansprechbar: Temperaturkontrolle mit aktiver Fiebervermeidung (über 37,7 °C), Prognose frühestens nach 72 Stunden.","Lebensbedrohliche Arrhythmien machen jedes ACS zum Fall für die sofortige invasive Strategie. Davor gilt wie im guten Verlauf: 0/1-h-Algorithmus richtig lesen, Antithrombotika an der Strategie ausrichten."],"moderation":"Spiele den VT-Knoten noch einmal und lass die Gruppe die Instabilitätszeichen laut benennen, bevor sie entscheidet."}]},{"id":"fall-lungenoedem","typ":"fall","titel":"Fall: Akutes Lungenödem bei HFrEF","untertitel":"Nächtliche IMC-Aufnahme: einordnen, entstauen, Auslöser finden","gruppe":"Akutkardiologie","reihenfolge":20,"ebene":"oeffentlich","status":"entwurf","dauer":"20 bis 25 min","lernziele":["Ein akutes kardiales Lungenödem am Bett erkennen und nach Stauung und Perfusion (warm oder kalt, nass oder trocken) einordnen","Sauerstoff, CPAP/NIV, Schleifendiuretikum und Nitrat leitliniengerecht einsetzen und Furosemid i.v. nach der Vormedikation dosieren","Das Diuretika-Ansprechen nach 2 Stunden mit Spot-Natrium und Urinmenge beurteilen und die Dosis anpassen","Auslöser systematisch suchen: CHAMPIT, Medikamente, Nierenfunktion","Typische Fallstricke vermeiden: Morphin, Volumengabe, unnötiges Absetzen von Betablocker und Herzinsuffizienz-Therapie"],"quellen":[{"id":"esc-hf","kurz":"ESC HF 2021","titel":"McDonagh TA et al.: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure. Eur Heart J 2021;42:3599-3726","url":"https://academic.oup.com/eurheartj/article/42/36/3599/6358045","stand":"2021"},{"id":"esc-hf-2023","kurz":"ESC HF Focused Update 2023","titel":"McDonagh TA et al.: 2023 Focused Update of the 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure. Eur Heart J 2023;44:3627-3639","url":"https://academic.oup.com/eurheartj/article/44/37/3627/7246292","stand":"2023"},{"id":"hfa-diuretika","kurz":"HFA Diuretika 2019","titel":"Mullens W et al.: The use of diuretics in heart failure with congestion. A position statement from the Heart Failure Association of the ESC. Eur J Heart Fail 2019;21:137-155","url":"https://academic.oup.com/eurjhf/article/21/2/137/8408118","stand":"2019"},{"id":"3cpo","kurz":"3CPO 2008","titel":"Gray A et al.: Noninvasive ventilation in acute cardiogenic pulmonary edema. N Engl J Med 2008;359:142-151","url":"https://doi.org/10.1056/NEJMoa0707992","stand":"2008"},{"id":"cochrane-niv","kurz":"Cochrane NIV 2019","titel":"Berbenetz N et al.: Non-invasive positive pressure ventilation (CPAP or bilevel NPPV) for cardiogenic pulmonary oedema. Cochrane Database Syst Rev 2019;4:CD005351","url":"https://doi.org/10.1002/14651858.CD005351.pub4","stand":"2019"},{"id":"dgk-pocket","kurz":"DGK Pocket-Leitlinie HI 2021","titel":"DGK: Pocket-Leitlinie Akute und chronische Herzinsuffizienz, Version 2021 (deutsche Fassung der ESC-Leitlinie)","url":"https://leitlinien.dgk.org/files/24_2021_pocket-leitlinien_herzinsuffizienz_.pdf","stand":"2021"}],"moderation":"Impulsfragen für die Gruppe:\n1. Woran erkennt ihr am Bett ohne Labor, ob die Patientin warm oder kalt ist?\n2. Warum sagt ein Spot-Natrium nach 2 Stunden früher etwas über das Ansprechen als die 24-Stunden-Bilanz?\n3. Was hättet ihr anders gemacht, wenn der systolische Blutdruck bei Aufnahme 95 mmHg betragen hätte?\n4. Welche Medikamente fragt ihr bei jeder Dekompensation gezielt ab?\nAm Verzweigungspunkt (Blutdruckabfall unter Nitrat) erst abstimmen lassen, dann aufdecken. Beide Enden lohnen sich: Wer den Bolus gewählt hat, sieht die Konsequenz am Monitor.","patient":{"kurz":"Frau K., 74 Jahre","alter":74,"geschlecht":"w","gewicht_kg":68,"groesse_cm":162,"vorgeschichte":"Herzinsuffizienz mit reduzierter Pumpfunktion (HFrEF, LVEF zuletzt 30 bis 35 %), Koronarangiographie 2024 ohne relevante Stenosen. Permanentes Vorhofflimmern, arterielle Hypertonie, chronische Niereninsuffizienz G3a (Kreatinin zuletzt 1,1 mg/dl). Medikation: Bisoprolol 5 mg 1-0-0, Sacubitril/Valsartan 49/51 mg 1-0-1, Spironolacton 25 mg 1-0-0, Dapagliflozin 10 mg 1-0-0, Furosemid 40 mg 1-0-0, Apixaban 5 mg 1-0-1."},"start":{"zeit":"Minute 0","vitals":{"hf":128,"sys":186,"dia":102,"spo2":84,"af":32,"temp":36.8},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Nachtdienst, 2:30 Uhr","text":"Der Rettungsdienst übergibt Frau K. direkt auf der IMC. Sie ist vor einer Stunde mit schwerer Luftnot aufgewacht und sitzt jetzt nach vorn gebeugt an der Bettkante. Die Sauerstoffbrille aus dem Rettungswagen hat sie sich in ihrer Unruhe abgenommen, Medikamente hat sie bisher nicht erhalten. Am Monitor: SpO₂ 84 % unter Raumluft, Blutdruck hoch, unregelmäßige Tachykardie. Die Tochter ist mitgekommen.","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 2","text":"Du hast zwei Minuten für eine gezielte Erstuntersuchung. Was brauchst du, um das Bild einzuordnen?","optionen":[{"id":"inspektion","label":"Inspektion und Atemarbeit","ergebnis":"Sitzt aufrecht, kann nicht flach liegen. Einsatz der Atemhilfsmuskulatur, spricht nur in kurzen Satzteilen. Lippen leicht zyanotisch, Haut schweißig."},{"id":"perfusion","label":"Peripherie und Perfusion","ergebnis":"Hände und Füße warm, Rekapillarisierungszeit unter 2 Sekunden. Wach, orientiert, ängstlich. Weite Blutdruckamplitude."},{"id":"lunge","label":"Lunge auskultieren","ergebnis":"Feuchte, feinblasige Rasselgeräusche beidseits bis über die Mittelfelder, dazu exspiratorisches Giemen."},{"id":"herz","label":"Herz, Halsvenen, Beine","ergebnis":"Arrhythmische, tachykarde Herztöne, leises Systolikum über der Spitze. Halsvenen auch im Sitzen gestaut. Knöchelödeme beidseits."},{"id":"bga","label":"Arterielle Blutgasanalyse (Raumluft)","ergebnis":"pH 7,29; pCO₂ 50 mmHg; pO₂ 51 mmHg; HCO₃⁻ 23 mmol/l; Laktat 1,6 mmol/l; Kalium 4,9 mmol/l.","q":["esc-hf"]},{"id":"ekg","label":"12-Kanal-EKG","ergebnis":"Vorhofflimmern mit schneller Überleitung, 128/min. Linkstyp, QRS 110 ms. ST-Senkungen bis 1 mm in V5 und V6, keine ST-Hebungen."},{"id":"sono","label":"Fokussierter Ultraschall von Lunge und Herz","ergebnis":"Zahlreiche B-Linien in allen Feldern beidseits, kleine Pleuraergüsse. LVEF visuell etwa 30 %, keine neue regionale Wandbewegungsstörung erkennbar. Mittelgradige Mitralinsuffizienz, Aortenklappe ohne relevante Stenose, kein Perikarderguss, rechter Ventrikel nicht dilatiert. V. cava inferior 2,3 cm, kaum atemvariabel.","q":["esc-hf"]},{"id":"labor","label":"Blutentnahme","ergebnis":"Abgenommen: Blutbild, Elektrolyte, Kreatinin, Harnstoff, hs-Troponin T, NT-proBNP, TSH, Leberwerte, CRP. Die Werte kommen in etwa 30 Minuten, das NT-proBNP vorab: 8400 pg/ml. Zwischen 55 und 75 Jahren spricht ein Wert über 900 pg/ml für eine akute Herzinsuffizienz.","q":["esc-hf"]},{"id":"anamnese","label":"Kurzanamnese mit der Tochter","ergebnis":"Seit etwa einer Woche zunehmend Luftnot bei Belastung, die letzten zwei Nächte im Sessel geschlafen. Heute Nacht plötzlich schwere Luftnot. Kein Brustschmerz, kein Fieber."}],"pflicht":["inspektion","perfusion","lunge","bga"],"weiter":"k3","moderation":"Befunde anfordern lassen, nicht vorlesen. Danach fragen: Welche Befunde stehen für Stauung, welche für Perfusion? Die Gruppe soll zwei Spalten bilden."},{"id":"k3","typ":"wahl","zeit":"Minute 4","frage":"Wie ordnest du das klinische Bild ein?","optionen":[{"id":"a","text":"Akutes Lungenödem, Profil warm und nass","bewertung":"richtig","feedback":"Nass: Orthopnoe, Rasselgeräusche, B-Linien, gestaute Halsvenen, Ödeme, weite V. cava. Warm: warme Akren, rasche Rekapillarisierung, wach, Laktat normal, Blutdruck hoch. Das passt zum Lungenödem mit schnellem Beginn und normalem bis hohem Blutdruck, das typischerweise warm und nass ist.","q":["esc-hf","dgk-pocket"]},{"id":"b","text":"Kalt und nass, beginnender kardiogener Schock","bewertung":"falsch","feedback":"Für Minderperfusion fehlen die Zeichen: kalte, schweißige Akren, Oligurie, Verwirrtheit, schmale Blutdruckamplitude, erhöhtes Laktat. Schweiß allein bei warmen Händen spricht für Stress und Atemarbeit, nicht für Schock.","q":["esc-hf"]},{"id":"c","text":"Warm und trocken: Exazerbation einer obstruktiven Lungenerkrankung wegen des Giemens","bewertung":"falsch","feedback":"Giemen kommt beim Lungenödem vor. Rasselgeräusche, B-Linien in allen Feldern, gestaute Halsvenen, Ödeme und ein hohes NT-proBNP sprechen klar für eine kardiale Stauung."},{"id":"d","text":"Kalt und trocken","bewertung":"falsch","feedback":"Weder Minderperfusion noch fehlende Stauung: Beides trifft hier nicht zu."}],"erklaerung":"Zwei Fragen am Bett: Liegt eine Stauung vor (nass oder trocken)? Ist die Perfusion ausreichend (warm oder kalt)? Die ESC beschreibt vier Erscheinungsbilder der akuten Herzinsuffizienz: akut dekompensiert, akutes Lungenödem, isoliertes Rechtsherzversagen, kardiogener Schock. Das Profil bestimmt die Therapie.","weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Minute 5","frage":"Was veranlasst du in den ersten Minuten? Wähle alles Passende.","optionen":[{"id":"a","text":"Oberkörper hoch, Beine tief, die sitzende Position unterstützen","richtig":true,"feedback":"Weniger venöser Rückstrom, leichtere Atemarbeit. Frau K. hat diese Position ohnehin eingenommen."},{"id":"b","text":"Sofort Sauerstoff über Maske, Ziel SpO₂ über 90 %","richtig":true,"feedback":"Bei SpO₂ unter 90 % oder pO₂ unter 60 mmHg ist Sauerstoff empfohlen (ESC I C). Ohne Hypoxämie nicht routinemäßig, da Sauerstoff Vasokonstriktion und einen Abfall des Herzzeitvolumens fördert.","q":["esc-hf"]},{"id":"c","text":"CPAP- oder NIV-Gerät mit passender Maske holen lassen, Oberärzt:in informieren","richtig":true,"feedback":"Atemfrequenz über 25/min und SpO₂ unter 90 %: Eine NIV soll erwogen und so früh wie möglich begonnen werden (ESC IIa B).","q":["esc-hf"]},{"id":"d","text":"Kontinuierliches Monitoring, sicherer i.v.-Zugang, Blutentnahme","richtig":true,"feedback":"Diagnostik und Therapie laufen bei akuter Herzinsuffizienz parallel.","q":["esc-hf"]},{"id":"e","text":"Flach lagern und Beine hochlegen, um den Kreislauf zu stützen","richtig":false,"feedback":"Mehr venöser Rückstrom heißt mehr Lungenstauung. Die Orthopnoe würde sich sofort verschlechtern."},{"id":"f","text":"1000 ml Vollelektrolytlösung, weil sie seit gestern wenig getrunken hat","richtig":false,"feedback":"Frau K. ist überwässert, nicht trocken: gestaute Halsvenen, Ödeme, B-Linien, weite V. cava. Volumen verstärkt das Lungenödem."},{"id":"g","text":"Mit dem Diuretikum warten, bis das Röntgenbild vorliegt","richtig":false,"feedback":"Klinik, Ultraschall und Blutgas reichen für den Therapiebeginn. Diagnos
