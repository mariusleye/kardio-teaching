 Diuretikadosis, die ein Rezidiv verhindert.","q":["easl"]}],"komplikationen":[{"titel":"Aszitesleckage","erkennen":"Häufigste Komplikation (etwa 5 %): nässender Verband, klare Flüssigkeit aus dem Stichkanal, eher nach großen Kanülen.","handeln":"Auf die Gegenseite lagern, sterile Kompressen, ggf. Tabaksbeutelnaht; auf Infektzeichen achten. Vorbeugen: Z-Technik oder schräger Stichkanal, Aszites möglichst vollständig ablassen."},{"titel":"Blutung (Bauchwandhämatom, Hämoperitoneum, Pseudoaneurysma)","erkennen":"Selten (unter 1 %), aber potenziell lebensbedrohlich: Schmerz und Schwellung an der Einstichstelle, Hb-Abfall, Tachykardie, Hypotonie; blutiges Punktat, das nicht klar wird; im Ultraschall Hämatom in der Bauchwand oder neue echoreiche Flüssigkeit. Risikofaktoren: Niereninsuffizienz, hoher MELD-Score.","handeln":"Kompression, Monitoring, großlumige Zugänge, Hb und Kreuzblut, Antikoagulation prüfen; Oberärzt:in informieren, CT-Angiographie und interventionelle Radiologie (Embolisation), ggf. Chirurgie. Vorbeugen: Ultraschall mit Farbdoppler, Punktion lateral der Rektusscheide."},{"titel":"Zirkulatorische Dysfunktion nach Parazentese","erkennen":"Entwickelt sich über Stunden bis Tage nach großvolumiger Entlastung ohne ausreichende Volumengabe: Kreatininanstieg bis zum hepatorenalen Syndrom, Hyponatriämie, Enzephalopathie; mit schlechterer Prognose verbunden.","handeln":"Vorbeugen mit Albumin nach über 5 l. Kreatinin und Natrium kontrollieren, NSAR und andere nephrotoxische Medikamente meiden, Diuretika anpassen; bei Verschlechterung der Nierenfunktion Abklärung und Therapie nach Zirrhose-Leitlinie."},{"titel":"Hypotonie während oder kurz nach der Entlastung","erkennen":"RR-Abfall, Tachykardie, Schwindel beim Aufsetzen. Differenzialdiagnosen: Blutung, vasovagale Reaktion, Infektion bis Sepsis, Volumenverschiebung nach großer Entlastung.","handeln":"Ablauf stoppen, flach lagern, Monitoring; Blutung aktiv ausschließen (Punktionsstelle, Hb, Ultraschall); fehlendes Albumin nach über 5 l sofort nachholen; Vasopressoren erst nach Klärung von Ursache und Volumenstatus."},{"titel":"Darmperforation und Infektion","erkennen":"Sehr selten: Aspiration von Luft oder trübem, stuhlartigem Material, neue Bauchschmerzen, Fieber, Peritonismus; später Bauchdeckenabszess oder sekundäre Peritonitis (mehrere Erreger in der Kultur).","handeln":"Kanüle entfernen, Ärzt:in und Chirurgie informieren, Bildgebung (CT der Wahl bei Verdacht auf sekundäre Peritonitis), Antibiose nach ärztlicher Entscheidung. Vorbeugen: Ultraschall, nicht durch Narben oder über geblähtem Darm punktieren."}],"nachsorge":["Vitalparameter und Bewusstsein in den ersten Stunden engmaschig; Punktionsstelle auf Nachlaufen und Hämatom kontrollieren","Albumingabe nach Entlastung über 5 l prüfen und dokumentieren (Menge, Zeitpunkt); keine HES oder anderen künstlichen Kolloide","Kreatinin und Natrium in den Folgetagen kontrollieren; NSAR meiden. ACE-Hemmer und AT1-Blocker sind bei Zirrhose mit Aszites in der Regel ungünstig, bei gleichzeitiger Herzinsuffizienz interdisziplinär abwägen","Diuretika nach Entlastung in der niedrigsten Dosis weiterführen, die ein Rezidiv verhindert","Befunde zeitnah ansehen: Granulozyten über 250/µl bedeuten SBP, dann sofort Antibiose und Albumin nach Leitlinie","SAAG und Gesamteiweiß auswerten: SAAG ≥ 1,1 g/dl mit Gesamteiweiß über 2,5 g/dl spricht für kardialen Aszites; dann steht die Behandlung der Stauung im Vordergrund. Gesamteiweiß unter 1,5 g/dl gilt bei Zirrhose als Risikofaktor für eine SBP","Plättchenhemmung bzw. Antikoagulation nach festgelegtem Plan wieder beginnen (DGVS: Plättchenhemmer frühestens 24 h nach der Punktion) und dokumentieren"],"uebungen":[{"titel":"Schwindel nach großer Entlastung","patient":{"kurz":"Herr B., 63 J.","alter":63,"geschlecht":"m","gewicht_kg":74,"groesse_cm":176,"vorgeschichte":"Äthyltoxische Leberzirrhose Child-Pugh B mit refraktärem Aszites, Parazentesen alle 2 bis 3 Wochen. Aufnahme auf die kardiologische IMC wegen Dyspnoe bei gespanntem Abdomen. Medikation: Spironolacton, Furosemid."},"start":{"zeit":"Minute 0","vitals":{"hf":86,"sys":112,"dia":66,"spo2":95,"af":22,"temp":36.6},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"info","text":"Vor der Entlastungspunktion: Welche Informationen holst du ein?","optionen":[{"id":"o1","label":"Labor","ergebnis":"INR 1,8; Thrombozyten 62.000/µl; Kreatinin 1,1 mg/dl; Natrium 132 mmol/l; Serum-Albumin 2,6 g/dl."},{"id":"o2","label":"Ultraschall Abdomen mit Farbdoppler","ergebnis":"Großes Aszitesdepot im linken Unterbauch, Tiefe über 8 cm, keine Darmschlingen im geplanten Stichweg; die A. epigastrica inferior liegt weiter medial.","q":["shm"]},{"id":"o3","label":"Aszitesbefund der Voraufnahme","ergebnis":"SAAG 1,9 g/dl, Gesamteiweiß 0,9 g/dl, Granulozyten 40/µl: portal-hypertensiver Aszites bei Zirrhose. Bei kardialer Ursache wäre das Eiweiß meist über 2,5 g/dl; unter 1,5 g/dl gilt als Risikofaktor für eine SBP.","q":["dgvs","bsg"]},{"id":"o4","label":"Echokardiographie","ergebnis":"LVEF 55 %, normale RV-Funktion, keine relevante Trikuspidalinsuffizienz, V. cava inferior schmal und atemvariabel."}],"pflicht":["o1","o2"],"moderation":"Kardiologischer Blick: Echo und Aszites-Eiweiß zusammen schließen eine kardiale Ursache hier praktisch aus.","weiter":"k2"},{"id":"k2","typ":"wahl","frage":"INR 1,8 und Thrombozyten 62.000/µl. Wie gehst du vor?","optionen":[{"id":"a","text":"Keine Substitution, ultraschallgestützt punktieren","bewertung":"richtig","feedback":"Plasmaderivate werden vor einer Aszitespunktion unabhängig vom INR nicht gegeben; Thrombozyten erst unter 20.000/µl erwägen. Ultraschall senkt das Blutungsrisiko.","q":["dgvs","bsg"]},{"id":"b","text":"Zwei Einheiten FFP, dann punktieren","bewertung":"falsch","feedback":"Kein Nutzen belegt; INR und Quick bilden das Blutungsrisiko bei Zirrhose schlecht ab. FFP bringt Volumen, Transfusionsrisiken und Zeitverlust.","q":["dgvs","easl"]},{"id":"c","text":"Thrombozytenkonzentrat geben, Ziel über 100.000/µl","bewertung":"falsch","feedback":"Eine prophylaktische Thrombozytengabe wird nur bei unter 20.000/µl erwogen.","q":["dgvs"]},{"id":"d","text":"Punktion verschieben, bis der INR unter 1,5 liegt","bewertung":"falsch","feedback":"Der INR wird bei Zirrhose dadurch nicht besser, die Beschwerden bleiben. Es gibt keinen INR-Grenzwert für die Parazentese.","q":["uw"]}],"weiter":"k3"},{"id":"k3","typ":"info","zeit":"Minute 150","text":"Die Parazentese verlief unauffällig: 8 l klarer, gelber Aszites in knapp 2 Stunden, die Kanüle ist entfernt. Beim Aufsetzen wird Herrn B. schwindelig. Was klärst du?","effekt":{"vitals":{"hf":112,"sys":86,"dia":50},"rhythmus":"sinus_tachy","alarm":"RR niedrig"},"optionen":[{"id":"o1","label":"Punktionsstelle und Bauch","ergebnis":"Pflaster trocken, kein Hämatom, Bauch weich, kein Druckschmerz."},{"id":"o2","label":"Blutgasanalyse mit Hb und Laktat","ergebnis":"Hb 10,9 g/dl (vor der Punktion 11,2 g/dl), Laktat 1,4 mmol/l."},{"id":"o3","label":"Ultraschall","ergebnis":"Wenig echofreier Restaszites, keine neue echoreiche Flüssigkeit, kein Bauchwandhämatom."},{"id":"o4","label":"Temperatur und Bewusstsein","ergebnis":"37,0 °C; wach, orientiert, kein Flapping-Tremor."},{"id":"o5","label":"Anordnungen und Pflegedokumentation","ergebnis":"Albumin 20 % war „nach Abschluss der Parazentese“ angeordnet, ist aber noch nicht gelaufen."}],"pflicht":["o2","o3","o5"],"moderation":"Erst die gefährlichste Ursache ausschließen (Blutung), dann die naheliegende behandeln (fehlendes Albumin).","weiter":"k4"},{"id":"k4","typ":"wahl","frage":"Keine Blutungszeichen, kein Infektbild, das Albumin fehlt. Was tust du?","optionen":[{"id":"a","text":"Flach lagern, Albumin 20 % jetzt infundieren, RR und HF engmaschig, Ärzt:in informieren","bewertung":"richtig","feedback":"Nach 8 l ist Albumin ohnehin indiziert und jetzt überfällig. Die Blutung als wichtigste Differenzialdiagnose ist klinisch und sonografisch ausgeschlossen; den Verlauf weiter beobachten.","effekt":{"vitals":{"hf":96,"sys":104,"dia":60},"rhythmus":"sinus"},"q":["dgvs","easl","bsg"]},{"id":"b","text":"2 l NaCl 0,9 % als Bolus statt Albumin","bewertung":"falsch","feedback":"Nach über 5 l wird Albumin empfohlen; andere Plasmaexpander sind dafür weniger wirksam und werden nicht empfohlen.","q":["easl"]},{"id":"c","text":"Noradrenalin über den peripheren Zugang starten","bewertung":"falsch","feedback":"Vasopressoren behandeln nicht die Ursache. Erst Volumenstatus und Albumin, dann neu bewerten."},{"id":"d","text":"Restaszites nachpunktieren, um den Druck zu senken","bewertung":"falsch","feedback":"Eine weitere Entlastung verschärft die Kreislaufsituation eher."}],"weiter":"k5"},{"id":"k5","typ":"zahl","frage":"Wie viel Albumin (g) gibst du für 8 l abgelassenen Aszites?","einheit":"g Albumin","min":0,"max":120,"schritt":2,"start":20,"zielbereich":[48,64],"feedback_ok":"Richtig: 6 bis 8 g pro Liter (DGVS) bzw. 8 g pro Liter (EASL, BSG), für 8 l also 48 bis 64 g. Beispiel: 300 ml Albumin 20 % entsprechen 60 g.","feedback_zu_niedrig":"Zu wenig für 8 l. Gerechnet wird mit 6 bis 8 g pro abgelassenem Liter.","feedback_zu_hoch":"Mehr als 8 g pro Liter ist nicht belegt, belastet das Kreislaufvolumen (bei Herzinsuffizienz relevant), und Albumin ist knapp. Ziel: 6 bis 8 g pro Liter.","weiter":"k6"},{"id":"k6","typ":"mehrfach","frage":"Was gehört in die Nachsorge der nächsten 24 bis 48 Stunden?","optionen":[{"text":"Kreatinin und Natrium kontrollieren","richtig":true,"feedback":"Kreatininanstieg und Hyponatriämie zeigen eine zirkulatorische Dysfunktion nach Parazentese an."},{"text":"Diuretika in der niedrigsten wirksamen Dosis weiterführen","richtig":true,"feedback":"So viel wie nötig, um ein rasches Rezidiv zu verhindern, so wenig wie möglich."},{"text":"Punktionsstelle auf Nachlaufen kontrollieren","richtig":true,"feedback":"Leckage ist die häufigste Komplikation."},{"text":"Ibuprofen gegen Bauchschmerzen","richtig":false,"feedback":"NSAR sollen bei Aszites nicht gegeben werden: Natriumretention, Hyponatriämie, akutes Nierenversagen."},{"text":"ACE-Hemmer hochdosieren, weil eine Herzinsuffizienz vorliegen könnte","richtig":false,"feedback":"Bei Zirrhose mit Aszites sind ACE-Hemmer und AT1-Blocker in der Regel ungünstig (Hypotonie, Nierenfunktion). Hier ist die Pumpfunktion zudem normal; bei echter Herzinsuffizienz ist das eine interdisziplinäre Abwägung."},{"text":"Am nächsten Tag routinemäßig erneut punktieren","richtig":false,"feedback":"Eine erneute Entlastung richtet sich nach den Beschwerden, nicht nach einem festen Zeitplan."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Kreislauf stabilisiert","text":"Herr B. wurde nach einer Parazentese von 8 l hypoton. Eine Blutung war ausgeschlossen, das angeordnete Albumin fehlte. Nach Albumingabe und Flachlagerung stabilisierte sich der Kreislauf; Kreatinin und Natrium blieben in den Folgetagen stabil.","lernpunkte":["Hypotonie nach Parazentese: zuerst eine Blutung ausschließen (Punktionsstelle, Hb, Ultraschall), dann an fehlendes Albumin, vasovagale Reaktion und Infektion denken.","Albumin nach über 5 l: 6 bis 8 g/l (DGVS) bzw. 8 g/l (EASL, BSG) nach Abschluss der Entlastung; die Gabe gehört in die Übergabe.","Keine FFP- oder Thrombozytengabe vor der Punktion allein wegen erhöhtem INR oder mäßiger Thrombopenie.","Hoher SAAG mit niedrigem Eiweiß spricht für Zirrhose; kardialer Aszites hat meist ein Gesamteiweiß über 2,5 g/dl."]}]},{"titel":"Schmerzhafte Schwellung nach Punktion","patient":{"kurz":"Frau H., 79 J.","alter":79,"geschlecht":"w","gewicht_kg":66,"groesse_cm":160,"vorgeschichte":"Schwere Trikuspidalinsuffizienz mit Rechtsherzversagen, permanentes Vorhofflimmern (Apixaban seit 48 h pausiert), chronische Nierenerkrankung Stadium 3. Erstmals Aszites, trotz Diuretika zunehmend gespanntes Abdomen."},"start":{"zeit":"Minute 0","vitals":{"hf":88,"sys":108,"dia":64,"spo2":94,"af":20,"temp":36.7},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"info","text":"Erstpunktion mit Entlastung. Welche Befunde holst du für die Einordnung des Aszites?","optionen":[{"id":"o1","label":"Aszites: Albumin und Gesamteiweiß","ergebnis":"Aszites-Albumin 1,6 g/dl bei Serum-Albumin 3,2 g/dl (SAAG 1,6 g/dl); Gesamteiweiß im Aszites 3,4 g/dl.","q":["dgvs","bsg"]},{"id":"o2","label":"Zellzahl mit Differenzierung","ergebnis":"Leukozyten 210/µl, Granulozyten 30/µl: kein Anhalt für eine SBP.","q":["dgvs"]},{"id":"o3","label":"BNP im Serum","ergebnis":"1.240 ng/l (über 364 ng/l spricht für eine kardiale Ursache).","q":["bsg"]},{"id":"o4","label":"Echokardiographie und Oberbauchsonografie","ergebnis":"TAPSE 12 mm, schwere Trikuspidalinsuffizienz, V. cava inferior 28 mm ohne Atemvariabilität, gestaute Lebervenen; Leber glatt begrenzt, Milz normal groß, kein Hinweis auf Zirrhose."}],"pflicht":["o1","o4"],"weiter":"k2"},{"id":"k2","typ":"wahl","frage":"Wie ordnest du den Aszites ein?","optionen":[{"id":"a","text":"Kardialer Aszites bei Rechtsherzversagen: SAAG ≥ 1,1 g/dl und Gesamteiweiß über 2,5 g/dl","bewertung":"richtig","feedback":"Bei kardialer Stauung ist der SAAG hoch wie bei Zirrhose, das Eiweiß aber meist über 2,5 g/dl, weil die Lebersinusoide durchlässig bleiben. Hohes BNP und gestaute Lebervenen passen dazu. Therapeutisch steht die Behandlung der Stauung im Vordergrund.","q":["dgvs","bsg"]},{"id":"b","text":"Zirrhotischer Aszites, denn ein SAAG über 1,1 g/dl beweist die Zirrhose","bewertung":"falsch","feedback":"Der SAAG zeigt eine portale bzw. sinusoidale Drucksteigerung, nicht deren Ursache. Auch kardialer Aszites hat einen hohen SAAG.","q":["dgvs"]},{"id":"c","text":"Peritonealkarzinose wegen des hohen Eiweißes","bewertung":"falsch","feedback":"Bei Peritonealkarzinose ist der SAAG typischerweise unter 1,1 g/dl.","q":["bsg"]},{"id":"d","text":"Spontan bakterielle Peritonitis","bewertung":"falsch","feedback":"Dafür bräuchte es über 250 Granulozyten/µl.","q":["dgvs"]}],"moderation":"Frage an die Gruppe: Gilt die Albuminregel (6 bis 8 g/l ab 5 l) aus der Zirrhose-Leitlinie auch hier? Die Leitlinien beziehen sich auf Zirrhose; bei kardialem Aszites wird individuell entschieden.","weiter":"k3"},{"id":"k3","typ":"info","zeit":"Minute 90","text":"Wegen des Bauchumfangs wurde paramedian rechts, etwa 4 cm neben der Mittellinie und ohne Farbdoppler punktiert; 3,5 l wurden abgelassen. Jetzt klagt Frau H. über zunehmende Schmerzen an der Punktionsstelle, die Pflege sieht eine bläuliche Schwellung. Was erhebst du?","effekt":{"vitals":{"hf":124,"sys":92,"dia":56},"alarm":"HF hoch"},"optionen":[{"id":"o1","label":"Inspektion und Palpation","ergebnis":"Prall-elastische, druckschmerzhafte Schwellung rechts paraumbilikal, etwa handtellergroß, sichtbar zunehmend."},{"id":"o2","label":"Blutgasanalyse mit Hb","ergebnis":"Hb 9,1 g/dl (vor der Punktion 11,8 g/dl), Laktat 2,6 mmol/l."},{"id":"o3","label":"Ultraschall Bauchwand und Abdomen","ergebnis":"Inhomogene, echoarme Raumforderung in der rechten Rektusscheide, 7 × 5 cm; Restaszites neu mit feinen Binnenechos."},{"id":"o4","label":"Gerinnung","ergebnis":"INR 1,2, Thrombozyten 168.000/µl; letzte Apixaban-Einnahme vor 50 h."}],"pflicht":["o2","o3"],"weiter":"k4"},{"id":"k4","typ":"wahl","frage":"Rektusscheidenhämatom mit Hb-Abfall und Kreislaufreaktion. Was tust du?","optionen":[{"id":"a","text":"Kompression, zwei großlumige Zugänge, Kreuzblut und Blutprodukte nach Bedarf, Oberärzt:in und interventionelle Radiologie informieren, CT-Angiographie","bewertung":"richtig","feedback":"Eine Blutung aus Bauchwandgefäßen nach Parazentese braucht frühe Bildgebung und wird meist radiologisch durch Embolisation gestillt.","q":["dgvs","bsg"]},{"id":"b","text":"Kühlen und in 4 Stunden kontrollieren; Bauchwandhämatome sind selbstlimitierend","bewertung":"falsch","feedback":"Kleine Hämatome bleiben oft stabil, aber ein Hb-Abfall um über 2 g/dl mit Tachykardie und Hypotonie zeigt eine relevante, wahrscheinlich aktive Blutung.","weiter":"k5b"},{"id":"c","text":"Apixaban sofort wieder ansetzen, damit kein Schlaganfall auftritt","bewertung":"falsch","feedback":"Bei aktiver Blutung wird nicht antikoaguliert; der Wiederbeginn wird nach Blutstillung gemeinsam mit der Kardiologie festgelegt.","weiter":"k5b"}],"weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 180","frage":"CT-Angiographie: aktive Blutung aus einem Ast der A. epigastrica inferior rechts, erfolgreich embolisiert; nach 2 EK ist der Kreislauf stabil. Was hätte die Blutung am ehesten verhindert?","effekt":{"vitals":{"hf":96,"sys":110,"dia":64}},"optionen":[{"text":"Punktion im linken Unterbauch lateral der Rektusscheide (mindestens 8 cm von der Mittellinie, 5 cm über der Symphyse)","richtig":true,"feedback":"Dort liegt die A. epigastrica inferior nicht im Stichweg."},{"text":"Farbdoppler der Bauchwand vor der Punktion","richtig":true,"feedback":"Zeigt Bauchwandgefäße im geplanten Stichweg."},{"text":"Ultraschall direkt vor der Punktion, ohne Umlagerung danach","richtig":true,"feedback":"Markierung und Punktion in derselben Position."},{"text":"FFP vor der Punktion","richtig":false,"feedback":"Die Gerinnung war normal; die Ursache war der Stichweg."},{"text":"Größere Kanüle für einen schnelleren Ablauf","richtig":false,"feedback":"Größere Kanülen erhöhen eher Leckage und Verletzungsrisiko."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Blutung früh erkannt","text":"Die Punktion nahe der Mittellinie hat einen Ast der A. epigastrica inferior verletzt. Frühe Bildgebung und Embolisation haben eine größere Blutung verhindert.","lernpunkte":["Punktionsort: linker Unterbauch lateral der Rektusscheide, mit Farbdoppler, Markierung direkt vor der Punktion.","Schmerz und Schwellung an der Einstichstelle plus Hb-Abfall und Tachykardie: an eine Bauchwandblutung denken, früh CT-Angiographie und Radiologie.","Kardialer Aszites: SAAG hoch, Gesamteiweiß über 2,5 g/dl; die Behandlung der Stauung steht im Vordergrund.","Die Albumin-Empfehlungen für große Entlastungen stammen aus Leitlinien zur Zirrhose; bei kardialem Aszites entscheidet das Team individuell."]},{"id":"k5b","typ":"wahl","zeit":"Minute 150","frage":"Eine Stunde später ist die Schwellung deutlich größer, Frau H. ist blass und kaltschweißig. Was jetzt?","effekt":{"vitals":{"hf":142,"sys":76,"dia":44,"spo2":91},"alarm":"RR niedrig"},"optionen":[{"id":"a","text":"Schockmanagement: Kompression, Volumen und Blutprodukte, notfallmäßige CT-Angiographie und Embolisation, Intensivstation informieren","bewertung":"richtig","feedback":"Hämorrhagischer Schock: Die Blutstillung hat jetzt Vorrang, die interventionelle Radiologie ist meist der schnellste Weg.","effekt":{"vitals":{"hf":112,"sys":94,"dia":56,"spo2":94}}},{"id":"b","text":"Restaszites ablassen, um die Bauchwand zu entlasten","bewertung":"falsch","feedback":"Eine weitere Punktion behandelt die Blutung nicht und verzögert die Blutstillung."},{"id":"c","text":"Noradrenalin hochdosiert und weiter beobachten","bewertung":"falsch","feedback":"Vasopressoren ohne Blutstillung und Volumenersatz behandeln nur den Blutdruckwert."}],"weiter":"e2"},{"id":"e2","typ":"ende","titel":"Verzögerte Blutstillung","text":"Abwarten hat die Blutung in einen hämorrhagischen Schock übergehen lassen. Die Embolisation gelang, aber Frau H. brauchte mehrere Erythrozytenkonzentrate und musste auf die Intensivstation.","lernpunkte":["Hb-Abfall plus Tachykardie nach Punktion ist ein Alarmsignal, kein Befund zum Abwarten.","Bauchwandblutungen nach Parazentese werden meist radiologisch gestillt; früh Kontakt aufnehmen.","Vorbeugen: Ultraschall mit Farbdoppler, Punktion lateral der Rektusscheide statt paramedian."]}]}]},{"id":"prozedur-pleurapunktion","typ":"prozedur","titel":"Pleurapunktion","untertitel":"Diagnostisch und therapeutisch, ultraschallgesteuert","gruppe":"Prozeduren","reihenfolge":30,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Indikation zur diagnostischen und therapeutischen Pleurapunktion begründen und Kontraindikationen einschließlich Antikoagulation prüfen","Punktionsort sonografisch festlegen: Sicherheitsdreieck, Rippenoberrand, kein weit posteriorer Zugang","Material und Proben vollständig vorbereiten und die Schritte in sicherer Reihenfolge begleiten","Drainagemenge begrenzen und Abbruchkriterien während der Entlastung anwenden","Pneumothorax und Re-Expansionsödem früh erkennen und erste Maßnahmen einleiten"],"quellen":[{"id":"bts_verfahren","kurz":"BTS Clinical Statement 2023","titel":"British Thoracic Society Clinical Statement on pleural procedures (Asciak R et al., Thorax 2023;78 Suppl 3:s43–s68)","url":"https://doi.org/10.1136/thorax-2022-219371","stand":"2023"},{"id":"bts_anhang3","kurz":"BTS Appendix 3 2023","titel":"BTS Clinical Statement on pleural procedures, Online Appendix 3: Pleural aspiration (Material, Lagerung, Punktionsort)","url":"https://www.brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/online-appendix-3-pleural-procedures-pleural-aspiration/","stand":"2023"},{"id":"bts_leitlinie","kurz":"BTS Guideline 2023","titel":"British Thoracic Society Guideline for pleural disease (Roberts ME et al., Thorax 2023;78 Suppl 3:s1–s42)","url":"https://doi.org/10.1136/thorax-2022-219784","stand":"2023"},{"id":"lus","kurz":"Volpicelli 2012","titel":"International evidence-based recommendations for point-of-care lung ultrasound (Volpicelli G et al., Intensive Care Med 2012;38:577–591)","url":"https://doi.org/10.1007/s00134-012-2513-4","stand":"2012"},{"id":"nejm_video","kurz":"NEJM Video 2006","titel":"Videos in Clinical Medicine: Thoracentesis (Thomsen TW et al., N Engl J Med 2006;355:e16), nur als weiterführender Link","url":"https://doi.org/10.1056/NEJMvcm053812","stand":"2006"}],"moderation":"Impulsfragen: (1) Warum wird direkt über dem Oberrand der Rippe punktiert und nicht weit posterior? (2) Ein Patient mit Koronarstent vor 4 Monaten nimmt Clopidogrel und braucht eine elektive Entlastung: Was klärst du vorher, und mit wem? (3) Nach 700 ml hustet die Patientin anhaltend: weiter oder stopp? (4) Braucht jede Pleurapunktion danach ein Röntgenbild?\nStolperstellen: im Liegen geschallt, im Sitzen punktiert; offener Dreiwegehahn beim Spritzenwechsel; Vakuumflasche, „weil es schneller geht“; bei kardialen Stauungsergüssen reflexhaft punktiert statt zuerst rekompensiert.","indikationen":["Diagnostisch: unklarer, vor allem einseitiger Pleuraerguss; Probe zur Einordnung (Transsudat oder Exsudat nach Light, Infektion, Malignität)","Therapeutisch: symptomatischer Erguss mit Dyspnoe; Entlastung meist 500 bis 1.500 ml","Verdacht auf Pleurainfektion oder Empyem bei Sepsis: Die diagnostische Punktion entscheidet mit über die Notwendigkeit einer Drainage","Maligner Erguss: prüfen, ob sich die Lunge nach Entlastung wieder entfaltet (nicht expandierbare Lunge), als Grundlage für das weitere Vorgehen","Kardiologischer Alltag: Beidseitige Ergüsse bei typischer kardialer Dekompensation werden zuerst rekompensiert; punktiert wird bei relevanter Dyspnoe trotz Therapie oder bei atypischem Bild (einseitig, Fieber, pleuritischer Schmerz, fehlendes Ansprechen)"],"kontraindikationen":["Absolut: fehlende Einwilligung der einwilligungsfähigen Person; ohne sicheren Zugangsweg im Ultraschall wird elektiv nicht punktiert, sondern weiter abgeklärt, z. B. per CT (die BTS führt den fehlenden sicheren Punktionsort formal als relative Kontraindikation).","Relativ: Gerinnungsstörung oder laufende Antikoagulation bzw. P2Y12-Hemmung, Haut- oder Weichteilinfektion am Punktionsort, unkooperative Person, sehr kleiner oder nur posterior erreichbarer Erguss."],"vorbereitung":["Indikation prüfen, aktuelle Bildgebung ansehen und die Seite festlegen","Aufklärung und schriftliche Einwilligung: Pneumothorax, Blutung, Re-Expansionsödem, Schmerz, Infektion, vasovagale Reaktion, Organverletzung, ausbleibende Diagnose","Medikation elektiv: VKA pausieren bis INR ≤ 1,5 (Phenprocoumon braucht dafür deutlich länger als Warfarin); DOAK je nach Substanz und Nierenfunktion 24 bis 48 h vorher; Clopidogrel und Prasugrel 5 Tage, Ticagrelor 7 Tage; ASS und prophylaktisches Heparin dürfen weiterlaufen","Bei Koronarstents, mechanischer Klappe oder hohem Embolierisiko das Pausieren nur nach Rücksprache mit der Kardiologie; im Notfall Nutzen und Blutungsrisiko bewusst abwägen","Gerinnungstests nur bei Gerinnungsanamnese oder Antikoagulation; Basislabor (Blutbild, Nieren-, Leberwerte) und zeitgleich Serum-Gesamteiweiß und LDH für die Light-Kriterien","Elektive Punktionen in der Regelarbeitszeit; Ausrüstung vorher komplett bereitlegen: Ultraschall, Sauerstoff, Absaugung, Monitoring, Notfallwagen erreichbar","Ausgangswerte (HF, RR, SpO2, Atemfrequenz) dokumentieren; Probengefäße und Laboranforderungen vorbereiten und beschriften","Rolle klären: PJ-Studierende assistieren (Lagerung, Monitoring, steriles Anreichen, Proben); punktiert wird nur nach Ausbildung und unter Aufsicht"],"material":{"benoetigt":[{"text":"Ultraschallgerät (Konvex- oder Sektorsonde), bei Punktion unter Sicht steriler Schallkopfüberzug","warum":"Ultraschall ist vor jeder Ergusspunktion Pflicht: Er findet den sicheren Ort, misst die Tiefe und zeigt Zwerchfell, Herz, Leber, Milz und adhärente Lunge."},{"text":"Hautantiseptikum, sterile Handschuhe, steriles Abdecktuch, sterile Kompressen","warum":"Die Punktion erfolgt aseptisch; eine Kontamination kann eine iatrogene Pleurainfektion auslösen und Kulturen verfälschen."},{"text":"Lidocain 1 % mit 10-ml-Spritze, dünne Kanüle für die Quaddel und 21-G-Kanüle (grün) für die Tiefe","warum":"Lokalanästhesie bis zur Pleura parietalis; mit der 21-G-Kanüle wird zugleich probeaspiriert. Dosis begrenzen: bis 3 mg/kg, maximal 250 mg (25 ml Lidocain 1 %)."},{"text":"Pleurapunktionskatheter (Kunststoffkatheter über Stahlnadel)","warum":"Für Entlastungen über 60 ml wird ein Katheter statt einer starren Nadel empfohlen: Er verletzt die sich wieder entfaltende Lunge seltener."},{"text":"50- oder 60-ml-Spritze","warum":"Reicht für die diagnostische Probe und erlaubt eine kontrollierte manuelle Aspiration."},{"text":"Dreiwegehahn und Ableitungsbeutel mit Schlauch","warum":"Langsam per Spritze oder Schwerkraft ablassen; über den Dreiwegehahn lässt sich der Ablauf sofort stoppen und das System bleibt luftdicht."},{"text":"Probengefäße: Nativröhrchen (Eiweiß, LDH, Mikrobiologie), aerobe und anaerobe Blutkulturflaschen, Fluoridröhrchen (Glukose), heparinisierte BGA-Spritze (pH), großes Gefäß für Zytologie","warum":"Die Fragestellung bestimmt die Proben. Zytologie braucht mindestens 25 ml, besser 50 ml; den pH sofort und luftdicht im Blutgasgerät messen; Blutkulturflaschen bei Infektverdacht."},{"text":"Monitoring (SpO2, RR, EKG) und Sauerstoff","warum":"Vitalparameter vor, während und nach der Punktion; Hypoxie, vasovagale Reaktion oder Pneumothorax fallen so früh auf."},{"text":"Steriler Pflasterverband","warum":"Nach Entfernen des Katheters reicht ein einfacher steriler Verband."}],"ablenker":[{"text":"Vakuumflasche oder Wandsog zum schnelleren Ablassen","warum_nicht":"Soll bei der therapeutischen Pleurapunktion nicht verwendet werden: In einer randomisierten Studie mehr Komplikationen (Pneumothorax, Blutung, Re-Expansionsödem) und mehr Schmerzen als bei manueller Aspiration."},{"text":"Großlumige Thoraxdrainage (28 Ch) mit Trokar","warum_nicht":"Gehört nicht zur Punktion. Die Trokar-Technik soll wegen schwerer, teils tödlicher Organverletzungen generell vermieden werden."},{"text":"Frischplasma (FFP) routinemäßig vor jeder Punktion","warum_nicht":"Ohne Gerinnungsanamnese und ohne Antikoagulation ist nicht einmal ein Gerinnungstest nötig; korrigiert wird nur gezielt bei Bedarf."},{"text":"Starre Stahlkanüle für eine Entlastung über 1 l","warum_nicht":"Ab 60 ml wird ein Katheter empfohlen; eine starre Nadel kann die sich entfaltende Lunge verletzen, wenn sie verrutscht."},{"text":"Heimlich-Ventil (Flatterventil)","warum_nicht":"Gehört zur Pneumothorax-Versorgung mit Drainage, nicht zur einmaligen Ergusspunktion."}]},"schritte":[{"text":"Indikation, Einwilligung, Medikation und Bildgebung prüfen, Seite festlegen","warum":"Eine aktuelle Bildgebung bestätigt Indikation und Seite; Antikoagulation und Plättchenhemmung bestimmen das Blutungsrisiko. Die Seitenverwechslung ist ein typischer vermeidbarer Fehler.","q":["bts_verfahren"]},{"text":"Ausgangsvitalwerte erheben, Monitoring anschließen, Sauerstoff und Notfallausrüstung bereitstellen","warum":"Nur mit Ausgangswerten lassen sich Hypoxie, Hypotonie oder Bradykardie während und nach der Punktion sicher erkennen.","q":["bts_verfahren"]},{"text":"Lagern: sitzend, nach vorn gelehnt, Arme auf einem Tisch; alternativ Seitenlage oder halb sitzend mit Arm hinter dem Kopf","warum":"Diese Positionen weiten die Zwischenrippenräume und machen das Sicherheitsdreieck zugänglich; die Position muss bis zum Ende stabil haltbar sein.","q":["bts_anhang3"]},{"text":"Ultraschall in genau dieser Position: Erguss, Tiefe, Zwerchfell, Lunge, Herz, Leber und Milz darstellen; Punktionsort möglichst lateral im Sicherheitsdreieck markieren, Abstand Haut bis Pleura messen","warum":"Markierung und Punktion ohne Umlagerung dazwischen, denn Erguss und Organe verschieben sich mit der Lage. Weit posterior liegt das Gefäß-Nerven-Bündel nicht geschützt unter der Rippe; sehr nah am Zwerchfell drohen Organverletzung und Reizung.","q":["bts_verfahren","bts_anhang3"]},{"text":"Sicherheitscheckliste (Time-out): Identität, Seite, Einwilligung, Allergien, Blutungsrisiko, Monitoring","warum":"Checklisten vor und nach Pleuraeingriffen senken vermeidbare Komplikationen; Seite und Markierung werden gemeinsam bestätigt.","q":["bts_verfahren"]},{"text":"Hygienische Händedesinfektion, sterile Handschuhe, Hautdesinfektion mit Einwirkzeit, steriles Abdecken","warum":"Aseptisches Arbeiten verhindert iatrogene Pleurainfektionen und kontaminierte Kulturen.","q":["bts_anhang3"]},{"text":"Lokalanästhesie: Hautquaddel, dann direkt über dem Oberrand der unteren Rippe schrittweise bis zur Pleura parietalis, vor jeder Injektion aspirieren","warum":"Die Interkostalgefäße verlaufen am Unterrand der Rippe; die Pleura parietalis ist schmerzempfindlich. Aspirieren vor der Injektion verhindert eine intravasale Gabe. Lidocain 1 % bis 3 mg/kg, maximal 250 mg.","q":["bts_verfahren"]},{"text":"Mit der Anästhesienadel probeaspirieren: Der Erguss muss sich aspirieren lassen","warum":"Bestätigt Ort und Tiefe, bevor das größere Besteck eingeführt wird. Kommt kein Erguss, nicht tiefer stochern, sondern neu schallen.","q":["bts_anhang3"]},{"text":"Punktionskatheter über dem Rippenoberrand unter Aspiration vorschieben; sobald Erguss kommt, nur noch den Kunststoffkatheter vorschieben und die Stahlnadel zurückziehen","warum":"Der weiche Katheter verletzt die sich entfaltende Lunge nicht. Die Stahlnadel nie zurück in den Katheter schieben, sonst kann sie ihn anschneiden oder abscheren.","q":["bts_verfahren","bts_anhang3"]},{"text":"Dreiwegehahn anschließen, System geschlossen halten und Proben abfüllen: Eiweiß, LDH, Mikrobiologie (bei Infektverdacht zusätzlich Blutkulturflaschen), Zytologie 25 bis 50 ml, Glukose, pH in heparinisierter BGA-Spritze","warum":"Jeder offene Moment lässt Luft in den Pleuraraum. Der pH muss luftdicht und sofort gemessen werden; zu kleine Zytologiemengen senken die Trefferquote.","q":["bts_verfahren","bts_leitlinie"]},{"text":"Therapeutisch: langsam per Spritze oder Schwerkraft in den Beutel ablassen, kein Vakuum und kein Wandsog; Richtwert höchstens 1,5 l pro Sitzung","warum":"Langsame Entlastung lässt die Lunge kontrolliert entfalten, und Warnzeichen fallen auf, bevor ein Re-Expansionsödem oder Pneumothorax entsteht. Vakuum führte in Studien zu mehr Komplikationen.","q":["bts_verfahren"]},{"text":"Patient:in fortlaufend beobachten und sofort stoppen bei Engegefühl, Schmerz, anhaltendem Husten, zunehmender Dyspnoe oder SpO2-Abfall","warum":"Diese Beschwerden können ein beginnendes Re-Expansionsödem oder eine nicht expandierbare Lunge anzeigen; der Abbruch gilt auch weit unter 1,5 l.","q":["bts_verfahren"]},{"text":"Katheter bei geschlossenem Dreiwegehahn zügig entfernen, steriles Pflaster aufkleben","warum":"Der geschlossene Hahn verhindert Luftzutritt beim Entfernen; die kleine Einstichstelle braucht nur einen einfachen Verband.","q":["bts_anhang3"]},{"text":"Vitalparameter sofort danach erheben, Proben beschriften und versenden, Eingriff dokumentieren; Bildgebung nach klinischem Bild","warum":"Komplikationen zeigen sich oft in der ersten Stunde. Ein Routineröntgen ist nach unkomplizierter Punktion ohne Beschwerden nicht nötig, bei Beschwerden oder schwieriger Punktion aber schon; Lungenultraschall hilft am Bett.","q":["bts_verfahren","lus"]}],"komplikationen":[{"titel":"Pneumothorax","erkennen":"Häufigste Komplikation. Neue Dyspnoe, Thoraxschmerz, Hustenreiz, SpO2-Abfall, einseitig abgeschwächtes Atemgeräusch. Im Ultraschall fehlendes Lungengleiten ohne B-Linien, beweisend ist ein Lungenpunkt; Bestätigung im Röntgen. Ursachen: Verletzung der Pleura visceralis, Luftzutritt über ein offenes System oder nicht expandierbare Lunge (Pneumothorax ex vacuo).","handeln":"Sauerstoff nach Zielsättigung, Ärzt:in informieren, Monitoring, Röntgen. Beschwerdearme iatrogene Pneumothoraces heilen oft ohne Eingriff; ein Pneumothorax ex vacuo braucht meist keine Drainage. Bei Beschwerden oder Größenzunahme Aspiration oder kleinlumige Drainage. Hypotonie, gestaute Halsvenen und rasch zunehmende Hypoxie: an Spannungspneumothorax denken und sofort entlasten."},{"titel":"Re-Expansionsödem","erkennen":"Selten, aber potenziell lebensbedrohlich; meist innerhalb der ersten Stunde nach Entlastung: Husten, Engegefühl, Dyspnoe, Hypoxämie, Rasselgeräusche und neue Infiltrate auf der entlasteten Seite, im Ultraschall viele B-Linien bei erhaltenem Lungengleiten.","handeln":"Ablauf sofort stoppen, ABCDE, Sauerstoff nach Zielsättigung, dringliches Röntgen (andere Komplikationen ausschließen); bei Verschlechterung Intensivstation, CPAP oder High-Flow erwägen. Diuretika und Opiate werden teils gegeben, sind aber nicht evidenzbasiert. Vorbeugen: langsam ablassen, höchstens etwa 1,5 l, bei Beschwerden früher stoppen."},{"titel":"Blutung und Hämatothorax","erkennen":"Selten, aber potenziell lebensbedrohlich: zunehmend blutiges Punktat, Hb-Abfall, Tachykardie, Hypotonie, im Ultraschall rasch zunehmender, echoreicher Erguss oder Thoraxwandhämatom. Ein Erguss-Hämatokrit über 50 % des Blut-Hämatokrits spricht für einen Hämatothorax.","handeln":"Punktion stoppen, Monitoring, großlumige Zugänge, Hb, Gerinnung und Kreuzblut; Antikoagulation prüfen; Oberärzt:in, Bildgebung (CT) und frühzeitig die Thoraxchirurgie einbinden. Vorbeugen: direkt über dem Rippenoberrand und nicht weit posterior punktieren."},{"titel":"Vasovagale Reaktion","erkennen":"Blässe, Schwitzen, Übelkeit, Bradykardie und Hypotonie bis zur Synkope; oft durch Schmerz oder Angst ausgelöst.","handeln":"Punktion unterbrechen, Patient:in hinlegen, Beine hoch, Monitoring; bei anhaltender symptomatischer Bradykardie ärztliche Therapie (z. B. Atropin). Vorbeugen: ruhige Aufklärung und ausreichende Lokalanästhesie."},{"titel":"Organverletzung und Infektion","erkennen":"Zu tiefe oder zu kaudale Punktion kann Leber oder Milz treffen: Bauchschmerz, Hb-Abfall, Kreislaufinstabilität. Infektion (selten): Fieber, Rötung an der Einstichstelle, später trüber Erguss.","handeln":"Vorbeugen durch Ultraschall in Punktionsposition (Zwerchfell, Organe, Tiefe) und Abstand zum Zwerchfell. Bei Verdacht Bildgebung und Chirurgie; bei Infektzeichen Diagnostik und Antibiose nach ärztlicher Entscheidung."}],"nachsorge":["Vitalparameter und Beschwerden direkt nach der Punktion erheben, auf der IMC weiter nach Stationsstandard überwachen; neue Dyspnoe, Husten, Thoraxschmerz oder SpO2-Abfall sofort ärztlich abklären","Bildgebung nach klinischem Bild: Röntgen-Thorax bei Beschwerden, kompliziertem Verlauf oder mehreren Punktionsversuchen; nach unkomplizierter Punktion ohne Beschwerden laut BTS nicht routinemäßig (Hausstandard beachten)","Lungenultraschall als schnelle Bettkontrolle: Sichtbares Lungengleiten oder B-Linien schließen einen Pneumothorax an dieser Stelle aus, ein Lungenpunkt beweist ihn","Beim malignen Erguss hilft ein Röntgen nach Entlastung, eine nicht expandierbare Lunge zu erkennen","Proben vollständig beschriftet und zügig ins Labor, Zytologie bei Verzögerung kühlen; Light-Kriterien mit zeitgleichem Serum-Eiweiß und LDH auswerten","Antikoagulation nach festgelegtem Plan wieder beginnen (BTS: DOAK 1 Tag nach Eingriffen mit niedrigem, 2 bis 3 Tage nach Eingriffen mit hohem Blutungsrisiko) und dokumentieren","Dokumentation: Seite, Ort, Menge, Aspekt, Proben, Komplikationen, Plan; Therapie der Ursache (z. B. Rekompensation) fortführen"],"uebungen":[{"titel":"Atemnot nach Entlastungspunktion","patient":{"kurz":"Herr M., 74 J.","alter":74,"geschlecht":"m","gewicht_kg":78,"groesse_cm":175,"vorgeschichte":"Ischämische Kardiomyopathie (LVEF 30 %), permanentes Vorhofflimmern, Apixaban seit 48 h pausiert. Großer Pleuraerguss rechts trotz intensivierter Diuretika, Dyspnoe in Ruhe."},"start":{"zeit":"Minute 0","vitals":{"hf":94,"sys":116,"dia":70,"spo2":94,"af":20,"temp":36.8},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"info","zeit":"Minute 20","text":"Ultraschallgestützte Entlastungspunktion rechts im Sitzen: 1.100 ml seröser Erguss über Katheter und Schwerkraft, ohne Beschwerden. Beim Entfernen des Katheters hustet Herr M. kräftig. 20 Minuten später klagt er über zunehmende Luftnot. Was erhebst du?","effekt":{"vitals":{"hf":116,"sys":110,"dia":68,"spo2":89,"af":28},"alarm":"SpO2 niedrig"},"optionen":[{"id":"o1","label":"Auskultation und Trachea","ergebnis":"Rechts apikal und ventral abgeschwächtes Atemgeräusch, basal noch etwas Dämpfung. Trachea mittelständig."},{"id":"o2","label":"Lungenultraschall rechts ventral","ergebnis":"Kein Lungengleiten, keine B-Linien; in der vorderen Axillarlinie ein Lungenpunkt (Übergang zu normalem Gleiten).","q":["lus"]},{"id":"o3","label":"Kreislauf und Halsvenen","ergebnis":"RR 110/68 mmHg, HF 116/min (Vorhofflimmern), Halsvenen nicht gestaut, peripher warm."},{"id":"o4","label":"Blutgasanalyse","ergebnis":"pO2 57 mmHg, pCO2 36 mmHg, pH 7,46 unter 2 l O2 über Nasenbrille."}],"pflicht":["o2","o3"],"moderation":"Erst sammeln lassen, dann deuten: Welche zwei Befunde trennen Pneumothorax und Re-Expansionsödem am Bett?","weiter":"k2"},{"id":"k2","typ":"wahl","frage":"Wie schätzt du die Lage ein, und was tust du zuerst?","optionen":[{"id":"a","text":"Iatrogener Pneumothorax ohne Spannungszeichen: O2 steigern, Ärzt:in informieren, Röntgen-Thorax veranlassen, Monitoring fortführen","bewertung":"richtig","feedback":"Fehlendes Lungengleiten ohne B-Linien plus Lungenpunkt beweisen einen Pneumothorax. Kreislauf stabil, Trachea mittelständig, Halsvenen nicht gestaut: kein Spannungspneumothorax. Ursache hier wohl Luftzutritt oder Pleuraverletzung beim Husten während der Katheterentfernung.","effekt":{"vitals":{"spo2":93}},"q":["lus","bts_verfahren"]},{"id":"b","text":"Spannungspneumothorax: sofort Nadeldekompression im 2. ICR","bewertung":"falsch","feedback":"Kein Spannungsbild: RR stabil, keine Halsvenenstauung, Trachea mittelständig. Eine unnötige Dekompression setzt eine zusätzliche Verletzung."},{"id":"c","text":"Re-Expansionsödem: Furosemid i. v. und abwarten","bewertung":"falsch","feedback":"Beim Re-Expansionsödem wären Lungengleiten und viele B-Linien zu sehen, hier zeigt der Ultraschall das Gegenteil. Diuretika sind zudem keine belegte Therapie des Re-Expansionsödems.","q":["lus","bts_verfahren"]},{"id":"d","text":"Den Resterguss sofort nachpunktieren","bewertung":"falsch","feedback":"Eine erneute Punktion behandelt das Problem nicht und erhöht das Risiko."}],"weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Minute 45","frage":"Röntgen: Pneumothorax rechts, apikal etwa 3 cm. Herr M. braucht 4 l O2 für eine SpO2 von 93 % und ist weiter dyspnoisch. Wie geht es weiter?","optionen":[{"id":"a","text":"Kleinlumige Thoraxdrainage (Seldinger, unter 14 F) durch eine erfahrene Person","bewertung":"richtig","feedback":"Symptomatischer, sauerstoffpflichtiger Pneumothorax: Eine Intervention ist sinnvoll. Kleinlumige Drainagen reichen für die meisten iatrogenen Pneumothoraces.","q":["bts_verfahren"]},{"id":"b","text":"Nadelaspiration der Luft, danach Röntgenkontrolle","bewertung":"akzeptabel","feedback":"Möglich zur raschen Symptomlinderung. Bei anhaltender Sauerstoffpflicht und schwerer Herzinsuffizienz ist eine Drainage oft die verlässlichere Lösung; die Entscheidung trifft die Oberärzt:in.","q":["bts_leitlinie"]},{"id":"c","text":"Abwarten, iatrogene Pneumothoraces heilen meist von selbst; Kontrolle morgen","bewertung":"falsch","feedback":"Beschwerdearme iatrogene Pneumothoraces dürfen oft beobachtet werden. Herr M. ist aber symptomatisch und sauerstoffpflichtig; ohne engmaschige Kontrolle fällt eine Zunahme zu spät auf.","q":["bts_leitlinie"],"weiter":"k3b"}],"weiter":"k4"},{"id":"k3b","typ":"wahl","zeit":"Minute 120","frage":"Zwei Stunden später kann Herr M. kaum sprechen: SpO2 86 % unter 6 l O2, HF 134/min, RR 96/60 mmHg. Was jetzt?","effekt":{"vitals":{"hf":134,"sys":96,"dia":60,"spo2":86,"af":32},"alarm":"SpO2 niedrig"},"optionen":[{"id":"a","text":"Sofort Notfallteam und Oberärzt:in, Drainage durch eine erfahrene Person; bei Spannungszeichen vorher sofort entlasten","bewertung":"richtig","feedback":"Zunehmende Hypoxie und beginnende Kreislaufbeteiligung: Der Pneumothorax muss jetzt entlastet werden. Kommen Hypotonie und Halsvenenstauung dazu, liegt ein Spannungspneumothorax vor.","effekt":{"vitals":{"hf":108,"sys":112,"dia":66,"spo2":93,"af":24}}},{"id":"b","text":"CPAP-Maske zur Verbesserung der Oxygenierung","bewertung":"falsch","feedback":"Positiver Atemwegsdruck bei nicht drainiertem Pneumothorax kann ihn vergrößern und eine Spannungssituation auslösen. CPAP nur mit funktionierender Drainage.","q":["bts_verfahren"]},{"id":"c","text":"O2 auf 15 l erhöhen und weiter beobachten","bewertung":"falsch","feedback":"Sauerstoff überbrückt nur; die Ursache bleibt und schreitet fort."}],"weiter":"e2"},{"id":"k4","typ":"mehrfach","frage":"Die Drainage liegt, Herr M. ist stabil. Welche Faktoren erhöhen bei der Pleurapunktion das Pneumothoraxrisiko?","effekt":{"vitals":{"hf":98,"sys":114,"dia":70,"spo2":95,"af":20}},"optionen":[{"text":"Große Entlastungsmengen","richtig":true,"feedback":"Mit steigender Menge steigt das Risiko."},{"text":"Geringe Ergusstiefe am Punktionsort","richtig":true,"feedback":"Wenig Abstand zur Lunge: Die Nadel erreicht leichter die Pleura visceralis."},{"text":"Wenig Erfahrung der punktierenden Person","richtig":true,"feedback":"Erfahrung und Supervision senken das Risiko."},{"text":"Untergewicht","richtig":true,"feedback":"In Studien als Risikofaktor beschrieben."},{"text":"Luftzutritt über ein offenes System","richtig":true,"feedback":"Ein offener Dreiwegehahn beim Spritzenwechsel lässt Luft eintreten."},{"text":"Ultraschallsteuerung","richtig":false,"feedback":"Ultraschall senkt das Pneumothoraxrisiko nachweislich."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Pneumothorax erkannt und versorgt","text":"Herr M. hatte nach der Entlastung einen symptomatischen iatrogenen Pneumothorax. Ultraschall am Bett, Kreislaufbeurteilung und Röntgen ermöglichten eine zügige, angemessene Versorgung mit kleinlumiger Drainage.","lernpunkte":["Neue Dyspnoe nach Pleurapunktion: zuerst an Pneumothorax denken; fehlendes Lungengleiten ohne B-Linien plus Lungenpunkt ist beweisend.","Spannungszeichen (Hypotonie, Halsvenenstauung, Trachealverlagerung, rasch zunehmende Hypoxie) bestimmen die Dringlichkeit.","Beschwerdearme iatrogene Pneumothoraces heilen oft ohne Eingriff; symptomatische brauchen Aspiration oder kleinlumige Drainage.","Vorbeugen: Ultraschall, moderates Volumen, System geschlossen halten, Katheter bei geschlossenem Hahn entfernen."]},{"id":"e2","typ":"ende","titel":"Zu spät erkannt: Entlastung im Notfall","text":"Abwarten ohne engmaschige Kontrolle hat bei einem symptomatischen, sauerstoffpflichtigen Pneumothorax zur Verschlechterung geführt. Die Drainage hat Herrn M. stabilisiert, aber unter Notfallbedingungen.","lernpunkte":["Wer konservativ beobachtet, braucht einen klaren Plan: Monitoring, Kontrollzeitpunkt, Eskalationskriterien.","Symptomatischer Pneumothorax mit Sauerstoffbedarf: Entlastung nicht aufschieben.","Kein CPAP bei nicht drainiertem Pneumothorax."]}]},{"titel":"Husten während der Entlastung","patient":{"kurz":"Frau K., 66 J.","alter":66,"geschlecht":"w","gewicht_kg":61,"groesse_cm":164,"vorgeschichte":"Biologischer Aortenklappenersatz vor 3 Wochen; seitdem zunehmender Pleuraerguss links, im Röntgen fast der ganze linke Hemithorax verschattet. Medikation: ASS 100 mg, Bisoprolol, Torasemid."},"start":{"zeit":"Minute 0","vitals":{"hf":98,"sys":128,"dia":74,"spo2":93,"af":24,"temp":37.1},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"mehrfach","frage":"Entlastungspunktion links ist geplant. Was gilt für die Vorbereitung?","optionen":[{"text":"ASS kann weiterlaufen","richtig":true,"feedback":"ASS und prophylaktisches Heparin dürfen vor Pleurapunktionen weitergegeben werden."},{"text":"Ultraschall in der Punktionsposition, danach ohne Umlagerung punktieren","richtig":true,"feedback":"Sonst stimmt die Markierung nicht mehr."},{"text":"Langsam per Spritze oder Schwerkraft ablassen, Dreiwegehahn im System","richtig":true,"feedback":"So lässt sich der Ablauf jederzeit sofort stoppen."},{"text":"Vakuumflasche anschließen, damit es schneller geht","richtig":false,"feedback":"Vakuum oder Wandsog sollen nicht verwendet werden: mehr Komplikationen und mehr Schmerzen."},{"text":"Routinemäßig Gerinnung bestimmen und FFP bereitstellen","richtig":false,"feedback":"Ohne Gerinnungsanamnese und ohne Antikoagulation ist kein Gerinnungstest nötig."},{"text":"Weit posterior paravertebral punktieren, weil dort der Erguss am tiefsten ist","richtig":false,"feedback":"Posterior liegt das Gefäß-Nerven-Bündel nicht geschützt unter der Rippe; bevorzugt wird das Sicherheitsdreieck, möglichst lateral."}],"weiter":"k2"},{"id":"k2","typ":"zahl","frage":"Frau K. ist beschwerdefrei. Welche Menge (ml) ist der übliche Richtwert für das Maximum in dieser Sitzung?","einheit":"ml","min":0,"max":3000,"schritt":100,"start":500,"zielbereich":[1500,1500],"feedback_ok":"Richtig: in der Regel höchstens 1,5 l pro Sitzung. Bei Beschwerden wird früher gestoppt; größere Mengen nur in Ausnahmefällen unter Überwachung durch erfahrene Teams.","feedback_zu_niedrig":"Weniger abzulassen ist erlaubt und bei Beschwerden richtig. Der übliche Richtwert für das Maximum liegt aber bei 1,5 l.","feedback_zu_hoch":"Zu viel: Darüber wächst die Sorge vor Re-Expansionsödem und Pneumothorax. Richtwert ist höchstens 1,5 l pro Sitzung.","weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Minute 25","frage":"Nach 1.000 ml hustet Frau K. anhaltend und klagt über Druck in der linken Brust. Was tust du?","effekt":{"vitals":{"hf":108,"spo2":90,"af":26},"rhythmus":"sinus_tachy"},"optionen":[{"id":"a","text":"Ablauf sofort stoppen (Dreiwegehahn schließen) und Ärzt:in informieren","bewertung":"richtig","feedback":"Engegefühl, Schmerz und anhaltender Husten sind Abbruchkriterien, unabhängig von der Menge. Sie können ein beginnendes Re-Expansionsödem oder eine nicht expandierbare Lunge anzeigen.","q":["bts_verfahren"]},{"id":"b","text":"Weiter bis 1.500 ml; Husten ist bei der Re-Expansion normal","bewertung":"falsch","feedback":"Die 1,5 l sind eine Obergrenze, kein Ziel. Wer bei Warnzeichen weiterlaufen lässt, riskiert ein Re-Expansionsödem.","effekt":{"vitals":{"spo2":87,"af":30}},"q":["bts_verfahren"]},{"id":"c","text":"Hustenstiller geben und weiter ablassen","bewertung":"falsch","feedback":"Das unterdrückt ein Warnsymptom, statt darauf zu reagieren."}],"weiter":"k4"},{"id":"k4","typ":"info","zeit":"Minute 50","text":"Der Katheter ist entfernt. Frau K. wird zunehmend dyspnoisch und unruhig. Was erhebst du?","effekt":{"vitals":{"hf":118,"sys":104,"dia":62,"spo2":85,"af":32},"rhythmus":"sinus_tachy","alarm":"SpO2 niedrig"},"optionen":[{"id":"o1","label":"Auskultation","ergebnis":"Links feinblasige Rasselgeräusche über dem gesamten Lungenfeld, rechts unauffällig."},{"id":"o2","label":"Lungenultraschall","ergebnis":"Links Lungengleiten vorhanden, zahlreiche konfluierende B-Linien, kleiner Resterguss basal; rechts A-Linien.","q":["lus"]},{"id":"o3","label":"Röntgen-Thorax","ergebnis":"Neue diffuse alveoläre Verdichtungen der linken Lunge, kein Pneumothorax, rechts unverändert."},{"id":"o4","label":"Blutgasanalyse","ergebnis":"pO2 54 mmHg, pCO2 34 mmHg unter 4 l O2, Laktat 1,6 mmol/l."},{"id":"o5","label":"Fokussierte Echokardiographie","ergebnis":"LVEF unverändert gut, kein Perikarderguss, Klappenprothese unauffällig."}],"pflicht":["o2","o3"],"moderation":"Kardiologischer Blick: Das Echo schließt Tamponade und akutes Linksherzversagen als Ursache der Hypoxie aus.","weiter":"k5"},{"id":"k5","typ":"mehrfach","frage":"Einseitige Verdichtungen nach rascher Entfaltung: Re-Expansionsödem. Welche Maßnahmen sind angemessen?","optionen":[{"text":"ABCDE-Beurteilung und vollständige Vitalparameter","richtig":true,"feedback":"Erster Schritt bei jeder akuten Verschlechterung."},{"text":"Sauerstoff nach Zielsättigung","richtig":true,"feedback":"Hypoxämie ist das Leitproblem."},{"text":"Bildgebung zum Ausschluss anderer Komplikationen (z. B. Pneumothorax)","richtig":true,"feedback":"Hier bereits erfolgt: kein Pneumothorax."},{"text":"Bei Verschlechterung Intensivstation einbinden, CPAP oder High-Flow erwägen","richtig":true,"feedback":"Ein Pneumothorax ist ausgeschlossen; nichtinvasive Unterstützung ist hier möglich."},{"text":"Furosemid als gesicherte Standardtherapie des Re-Expansionsödems","richtig":false,"feedback":"Diuretika und Opiate werden teils eingesetzt, sind aber nicht evidenzbasiert. Ein Diuretikum aus kardialer Indikation ist davon unabhängig eine ärztliche Einzelentscheidung."},{"text":"Gegenseite vorsorglich ebenfalls punktieren","richtig":false,"feedback":"Rechts ist kein relevanter Erguss; das brächte nur zusätzliches Risiko."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Re-Expansionsödem stabilisiert","effekt":{"vitals":{"hf":102,"sys":112,"dia":68,"spo2":93,"af":24}},"text":"Frau K. entwickelte nach Entlastung eines großen, länger bestehenden Ergusses ein Re-Expansionsödem. Mit Sauerstoff und engmaschiger Überwachung besserte sich der Befund über einige Stunden.","lernpunkte":["Re-Expansionsödem: meist in der ersten Stunde nach Entlastung, mit Hypoxämie und neuen Infiltraten auf der entlasteten Seite.","Husten, Engegefühl oder Schmerz während der Drainage heißt: sofort stoppen, egal wie viel schon abgelaufen ist.","Langsam ablassen (Spritze oder Schwerkraft), kein Vakuum, Richtwert höchstens 1,5 l pro Sitzung.","Ultraschall unterscheidet am Bett: B-Linien mit Lungengleiten (Ödem) gegen fehlendes Gleiten mit Lungenpunkt (Pneumothorax)."]}]}]},{"id":"prozedur-shaldon","typ":"prozedur","titel":"Shaldon-Katheter","untertitel":"Temporärer doppellumiger Dialysekatheter, Seldinger-Technik mit Dilatation","gruppe":"Prozeduren","reihenfolge":20,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Zugangsort und Katheterlänge für einen Shaldon-Katheter nach KDIGO begründet auswählen","Den Ablauf von Punktion, Dilatation, Katheteranlage und Lock in richtiger Reihenfolge erklären","Einen Katheter-Lock mit dem aufgedruckten Füllvolumen korrekt setzen und das Übertrittsrisiko begründen","Die Voraussetzungen der Nutzungsfreigabe benennen: Lagekontrolle, Aspiration des Locks, Dokumentation","Blutung nach femoraler Anlage und drahtbedingte Rhythmusstörungen erkennen und erste Maßnahmen einleiten"],"quellen":[{"id":"kdigo","kurz":"KDIGO AKI 2012","titel":"KDIGO Clinical Practice Guideline for Acute Kidney Injury, Kapitel 5.3 und 5.4 (Antikoagulation und Gefäßzugang für die Nierenersatztherapie). Kidney Int Suppl 2012;2:1–138","url":"https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf","stand":"2012 (Neufassung AKI/AKD 2026 im Entwurf)"},{"id":"krinko1","kurz":"KRINKO 2017, Teil 1","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 1: Nichtgetunnelte zentralvenöse Katheter. Bundesgesundheitsbl 2017;60:171–206","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1.pdf?__blob=publicationFile&v=3","stand":"2017"},{"id":"krinko_err","kurz":"KRINKO Erratum 2018","titel":"Erratum zu Teil 1: Evidenzkategorien der Hautantiseptik (CHX 2 % Kat. IB, Octenidin 0,1 % Kat. II). Bundesgesundheitsbl 2018;61:446","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1_Erratum.pdf?__blob=publicationFile&v=1","stand":"2018"},{"id":"clark14","kurz":"Clark 2014","titel":"Clark EG, Barsuk JH. Temporary hemodialysis catheters: recent advances. Kidney Int 2014;86:888–895","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4220490/","stand":"2014"},{"id":"clark16","kurz":"Clark 2016","titel":"Clark E et al. Practical aspects of nontunneled and tunneled hemodialysis catheters. Can J Kidney Health Dis 2016;3:2054358116669128","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5332079/","stand":"2016"},{"id":"boucley","kurz":"Boucley 2023","titel":"Boucley I et al. Systematic review of locking solutions for non-tunneled hemodialysis catheters. Hemodial Int 2023;27:12–20","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10092163/","stand":"2023"},{"id":"asa","kurz":"ASA 2020","titel":"Practice Guidelines for Central Venous Access 2020. An Updated Report by the American Society of Anesthesiologists Task Force on Central Venous Access. Anesthesiology 2020;132:8–43","url":"https://doi.org/10.1097/ALN.0000000000002864","stand":"2020"},{"id":"perseus","kurz":"ESAIC PERSEUS 2020","titel":"Lamperti M et al. European Society of Anaesthesiology guidelines on peri-operative use of ultrasound-guided for vascular access (PERSEUS vascular access). Eur J Anaesthesiol 2020;37:344–376","url":"https://doi.org/10.1097/EJA.0000000000001180","stand":"2020"},{"id":"ahs","kurz":"AHS 2023","titel":"Alberta Health Services, Critical Care Strategic Clinical Network: Dialyzing Wisely. Renal Replacement Therapy (RRT) Access, Care Pathway Resource","url":"https://www.albertahealthservices.ca/assets/about/scn/ahs-scn-cc-dialyzingwisely-rrt-access-care-pathway-resource.pdf","stand":"September 2023"},{"id":"xylocain","kurz":"Fachinfo Xylocain 1 %/2 %","titel":"Fachinformation Xylocain 1 %/2 % Injektionslösung (Lidocainhydrochlorid), Abschnitte 4.2 bis 4.4","url":"https://www.fachinfo.de/pdf/004674","stand":"Juli 2022"}],"moderation":"Impulsfragen:\n1. Warum steht die V. femoralis bei KDIGO vor der linken V. jugularis, und wann würdest du trotzdem jugulär gehen?\n2. Was passiert mit einem Heparin-Lock, wenn man mehr als das aufgedruckte Volumen injiziert oder ihn vor dem Anschluss nicht aspiriert?\n3. Wer gibt bei euch den Katheter zur Nutzung frei, und woran erkennt die Dialysepflege, dass das geschehen ist?\n4. Woran denkst du bei Hypotonie und Rückenschmerz wenige Stunden nach femoraler Anlage?\nStolperstellen: Dilatator zu tief vorgeschoben; Lock-Volumen geschätzt statt am Schenkel abgelesen; Dialysekatheter als Infusionszugang benutzt.","indikationen":["Akute Nierenersatztherapie (kontinuierlich oder intermittierend) bei Patient:innen ohne nutzbaren Dialyseshunt","Typische Anlässe: therapierefraktäre Hyperkaliämie, schwere metabolische Azidose, diuretikarefraktäre Überwässerung, urämische Komplikationen, dialysierbare Intoxikation","Überbrückung, bis ein getunnelter Katheter oder Shunt angelegt ist, wenn sich eine längere Dialysepflicht abzeichnet","Seltener: therapeutischer Plasmaaustausch oder andere extrakorporale Verfahren"],"kontraindikationen":["Absolut für den gewählten Ort: Thrombose der Zielvene oder Infektion im Punktionsgebiet; dann einen anderen Zugangsweg wählen.","Relativ: schwere Gerinnungsstörung oder Antikoagulation, V. subclavia (Stenoserisiko für spätere Shunts), V. femoralis bei möglicher Nierentransplantation und V. jugularis bei Tracheostoma."],"vorbereitung":["Indikation, Verfahren und Zeitpunkt mit Nephrologie oder Intensiv-Oberärzt:in abstimmen","Zugangsort nach KDIGO-Rangfolge wählen: V. jugularis interna rechts, dann V. femoralis, dann V. jugularis interna links; V. subclavia nur als letzte Option","Katheterlänge zum Ort passend wählen: jugulär rechts 12 bis 15 cm, jugulär links 15 bis 20 cm, femoral 19 bis 24 cm","Aufklärung und Einwilligung; Gerinnung, Thrombozyten, Kalium und laufende Antikoagulation prüfen","Vorab-Ultraschall der Zielvene: offen, komprimierbar und weit genug für einen Katheter von 11 bis 14 Fr","Monitoring mit EKG und SpO2; Lagerung jugulär in Kopftieflage, femoral flach mit leicht abgespreiztem, außenrotiertem Bein","Lock-Lösung nach Hausstandard bereitlegen und das Füllvolumen beider Schenkel am Katheter ablesen und notieren"],"material":{"benoetigt":[{"text":"Maximale Barriere: Haube, Mund-Nasen-Schutz, steriler Kittel, sterile Handschuhe, großes Lochtuch","warum":"Für die Anlage von Dialysekathetern gelten dieselben maximalen Barrierevorkehrungen wie für den ZVK (KRINKO, KDIGO)."},{"text":"Alkoholisches Hautantiseptikum mit Chlorhexidin 2 % oder Octenidin 0,1 %","warum":"Empfohlene Hautantiseptik vor zentralvenöser Anlage (KRINKO; Einwirkzeit nach Hersteller)."},{"text":"Ultraschallgerät mit Linearschallkopf und sterilem Überzug","warum":"KDIGO empfiehlt die ultraschallgesteuerte Anlage von Dialysekathetern mit starkem Empfehlungsgrad (1A); bei großen Kathetern sind Fehlpunktionen besonders folgenreich."},{"text":"Shaldon-Set: Punktionskanüle, Draht, Skalpell, Dilatatoren in steigender Größe, doppellumiger Katheter passender Länge","warum":"Der großlumige Katheter braucht einen schrittweise aufgeweiteten Stichkanal; die Länge bestimmt, ob die Spitze in einer großen Vene liegt."},{"text":"Lokalanästhetikum, z. B. Lidocain 1 %","warum":"Wegen der Dilatation großzügiger als beim ZVK, meist 5 bis 10 ml (50 bis 100 mg). Höchstens 300 mg ohne Vasokonstriktor laut Fachinformation, bei Herzinsuffizienz reduzieren."},{"text":"NaCl 0,9 % in Spülspritzen, mindestens 10 ml je Schenkel","warum":"Zum Füllen vor der Anlage und zum Prüfen von Aspiration und Spülbarkeit danach."},{"text":"Lock-Lösung nach Hausstandard, z. B. Citrat 4 % oder Heparin","warum":"Verhindert die Thrombosierung zwischen den Behandlungen; dosiert wird exakt nach dem Füllvolumen, das auf jedem Schenkel steht."},{"text":"Sterile Verschlusskappen und funktionierende Klemmen an beiden Schenkeln","warum":"Der großlumige Katheter darf nie offen sein: Luftembolie und Blutverlust drohen schnell."},{"text":"Nahtmaterial oder Fixiersystem und steriler Verband","warum":"Ein dislozierter Dialysekatheter kann lebensbedrohlich bluten; die Fixierung muss die ganze Liegedauer halten."}],"ablenker":[{"text":"Antibiotikahaltige Salbe auf die Einstichstelle","warum_nicht":"KDIGO rät bei Intensivpatient:innen davon ab (2C); Risiko für Pilzinfektionen und Resistenzen."},{"text":"Antibiotikahaltige Lock-Lösung zur Infektionsprophylaxe","warum_nicht":"Für nicht getunnelte Dialysekatheter bei AKI rät KDIGO davon ab (2C)."},{"text":"Hochkonzentriertes Citrat (30 % oder 46,7 %) als Standard-Lock","warum_nicht":"Bei Übertritt in den Kreislauf drohen Hypokalzämie und Rhythmusstörungen; üblich sind Konzentrationen bis 4 %."},{"text":"Dreilumiger ZVK mit 7 Fr als Dialysezugang","warum_nicht":"Zu kleiner Querschnitt für den nötigen Blutfluss; Dialysekatheter haben 11 bis 14 Fr."},{"text":"Kurzer 15-cm-Katheter für die V. femoralis","warum_nicht":"Die Spitze erreicht keine große Vene, Rezirkulation und Funktionsstörungen nehmen zu; femoral sind 19 bis 24 cm sinnvoll."}]},"schritte":[{"text":"Time-out: Indikation, Zugangsort, Katheterlänge, Gerinnung, Kalium, Allergien; Assistenz und Monitoring","warum":"Ort und Länge müssen vor dem Öffnen des Sets feststehen, weil Sets unterschiedliche Längen enthalten.","q":["kdigo","asa"]},{"text":"Vorab-Ultraschall der Zielvene, Punktionsstelle festlegen","warum":"Thrombosen oder eine zu kleine Vene fallen vor dem Abdecken auf; femoral liegt die Punktionsstelle unterhalb des Leistenbandes.","q":["kdigo","asa"]},{"text":"Lagerung: jugulär Kopftieflage, femoral flach mit leicht abgespreiztem Bein","warum":"Kopftieflage füllt die Halsvene und senkt das Luftembolierisiko; in der Leiste verbessert die Beinstellung den Zugang.","q":["asa"]},{"text":"Haube, Mund-Nasen-Schutz, hygienische Händedesinfektion, steriler Kittel und sterile Handschuhe","warum":"Maximale Barrierevorkehrungen wie beim ZVK (KRINKO Kat. IB).","q":["krinko1","kdigo"]},{"text":"Hautantiseptik großflächig, Einwirkzeit abwarten, großes Lochtuch, Schallkopf steril beziehen","warum":"Alkoholisches CHX- oder Octenidin-Präparat wirkt nur nach Einwirkzeit; das Feld muss den Bewegungsradius von Draht und Dilatatoren abdecken.","q":["krinko1","krinko_err"]},{"text":"Beide Schenkel mit NaCl 0,9 % füllen, arteriellen Schenkel abklemmen, venösen Schenkel für den Draht offen lassen","warum":"Der Draht tritt durch das venöse Lumen an der Spitze aus; gefüllte Lumen enthalten keine Luft.","q":["krinko1"]},{"text":"Lokalanästhesie von Haut und Stichkanal unter Aspiration","warum":"Die Dilatation ist schmerzhaft; Aspiration verhindert eine intravasale Injektion.","q":["xylocain"]},{"text":"Punktion unter Echtzeit-Ultraschall, Draht widerstandsfrei einführen, nicht tiefer als etwa 20 cm, EKG beobachten","warum":"Ein zu tief vorgeschobener Draht ist ein häufiger Fehler und löst Rhythmusstörungen aus.","q":["kdigo","perseus","clark16"]},{"text":"Venöse Drahtlage im Ultraschall in der Längsachse bestätigen, erst dann dilatieren","warum":"Ein Dilatator für 12 bis 14 Fr in einer Arterie ist eine schwere Komplikation; Blutfarbe und Pulsation reichen als Beleg nicht.","q":["asa"]},{"text":"Ausreichende Stichinzision, Dilatatoren nacheinander über den Draht, jeweils nur so tief wie nötig; Draht zwischendurch auf freie Beweglichkeit prüfen","warum":"Zu tiefes Dilatieren kann Vene, Pleura oder bei femoraler Anlage die Beckengefäße verletzen; ein festsitzender Draht ist abgeknickt.","q":["asa","clark14"]},{"text":"Katheter über den Draht auf die geplante Tiefe vorschieben, Draht entfernen und vollständig vorzeigen, venösen Schenkel sofort abklemmen","warum":"Ein offener großlumiger Schenkel saugt Luft an; der Draht muss vollständig sein.","q":["asa"]},{"text":"Beide Schenkel aspirieren und kräftig spülen, dann abklemmen","warum":"Leichte Aspiration und Spülung beider Schenkel zeigen, dass der Katheter für den Dialysefluss taugt.","q":["ahs"]},{"text":"Lock setzen: jeden Schenkel langsam mit genau dem aufgedruckten Füllvolumen füllen, Klemme schließen, sterile Kappe","warum":"Zu viel Volumen tritt in den Kreislauf über (Heparin wirkt dann systemisch), zu wenig lässt die Spitze thrombosieren.","q":["boucley"]},{"text":"Katheter annähen oder fixieren, steriler Verband","warum":"Eine Dislokation des großlumigen Katheters kann zu lebensbedrohlicher Blutung führen.","q":["clark16","krinko1"]},{"text":"Lagekontrolle: jugulär Röntgen-Thorax vor der ersten Nutzung (Spitze am Übergang V. cava superior zu rechtem Vorhof, kein Pneumothorax); femoral kein Röntgen nötig","warum":"Der halbstarre Katheter darf nicht im Vorhof liegen (Perforationsgefahr) und nicht zu hoch (Dysfunktion, Thrombose); vor hohen Blutflüssen und Antikoagulation muss die Lage gesichert sein.","q":["kdigo"]},{"text":"Dokumentieren und freigeben: Ort, Länge, Lock-Art und Volumen je Schenkel, Röntgenbefund; Katheter als Dialysezugang kennzeichnen","warum":"Die Dialysepflege muss wissen, welcher Lock im Katheter ist und dass er vor dem Anschluss aspiriert werden muss.","q":["kdigo","boucley"]}],"komplikationen":[{"titel":"Arterielle Punktion oder Dilatation einer Arterie","erkennen":"Pulsierendes, hellrotes Blut (unzuverlässig), Draht oder Katheter im Ultraschall in der Arterie, arterielle Druckkurve über einen Schenkel.","handeln":"Nur Kanüle: entfernen und komprimieren. Dilatator oder Katheter in der Arterie: liegen lassen, verschließen, sofort Gefäßchirurgie oder interventionelle Radiologie."},{"titel":"Blutung, Hämatom und retroperitoneale Blutung","erkennen":"Hämatom an der Einstichstelle, Hb-Abfall, Tachykardie, Hypotonie; retroperitoneal oft ohne sichtbares Hämatom, mit Rücken- oder Flankenschmerz. Bei femoraler Anlage in etwa 0,5 %, besonders nach Punktion oberhalb des Leistenbandes.","handeln":"Antikoagulation stoppen, Volumen und Blutprodukte, CT-Angiographie, Gefäßchirurgie oder interventionelle Radiologie; die Nierenersatztherapie danach ohne systemisches Heparin, z. B. mit regionaler Citratantikoagulation."},{"titel":"Pneumothorax oder Fehllage (jugulär)","erkennen":"Luftnot, SpO2-Abfall, fehlendes Lungengleiten; im Röntgen Spitze im Vorhof, in der V. subclavia oder zu hoch in der V. brachiocephalica.","handeln":"Pneumothorax nach Größe und Klinik behandeln. Fehllage vor der Nutzung korrigieren oder Katheter neu anlegen; nicht mit hohen Blutflüssen beginnen."},{"titel":"Systemische Antikoagulation durch Heparin-Lock","erkennen":"Nachblutung an Einstichstellen, unerwartet verlängerte aPTT oder Anstieg von Anti-Xa nach dem Blocken.","handeln":"Exakt das aufgedruckte Füllvolumen langsam injizieren, vor jeder Nutzung den Lock aspirieren und verwerfen; bei Blutungsrisiko nach Hausstandard Citrat 4 % erwägen."},{"titel":"Katheterdysfunktion","erkennen":"Ansaugalarme, niedriger oder schwankender Blutfluss, häufige Filterwechsel.","handeln":"Klemmen und Knicke prüfen, Konnektionen festziehen, Katheter und Patient:in umlagern, Schenkel spülen; Schenkel nur bewusst tauschen (mehr Rezirkulation); Lage prüfen, notfalls über Draht wechseln oder neu anlegen."},{"titel":"Rhythmusstörungen durch den Draht","erkennen":"Extrasystolen, Salven oder VT beim Vorschieben des Drahtes, meist bei zu tiefer Lage.","handeln":"Draht sofort auf etwa 15 cm zurückziehen und festhalten; anhaltende Rhythmusstörung nach ERC-Algorithmus behandeln."}],"nachsorge":["Nutzungsfreigabe erst nach dokumentierter Lagekontrolle: jugulär oder subclavia Röntgen-Thorax vor der ersten Nutzung; femoral genügt die klinische Funktionsprüfung","Vor jedem Anschluss den Lock aus beiden Schenkeln aspirieren und verwerfen, dann Durchgängigkeit durch Spülen prüfen","Dialysekatheter nur für die Nierenersatztherapie nutzen, außer im Notfall; Schenkel deutlich als Dialysezugang kennzeichnen","Nach jeder Behandlung beide Schenkel spülen und mit dem aufgedruckten Füllvolumen neu blocken; Lock-Art und Volumen dokumentieren","Verband, Hub-Pflege und Händedesinfektion wie beim ZVK; keine antibiotischen Salben","Indikation täglich prüfen; zeichnet sich eine längere Dialysepflicht ab, frühzeitig getunnelten Katheter oder Shunt planen","Femoraler Katheter: Mobilisation eingeschränkt, Leiste und Durchblutung des Beins täglich kontrollieren"],"abbildung":"seldinger","uebungen":[{"titel":"Rückenschmerz nach femoraler Anlage","patient":{"kurz":"Frau D., 71 J.","alter":71,"geschlecht":"w","gewicht_kg":74,"groesse_cm":165,"vorgeschichte":"Kardiorenales Syndrom bei HFrEF, diuretikarefraktäre Überwässerung, Vorhofflimmern unter Heparin-Perfusor."},"start":{"zeit":"Stunde 0","vitals":{"hf":96,"sys":112,"dia":64,"spo2":94,"af":20,"temp":36.6},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Stunde 3","titel":"Anruf der Pflege","text":"Vor drei Stunden wurde femoral rechts ein Shaldon-Katheter angelegt, im zweiten Versuch. Die CVVHD soll gleich starten. Die Pflege ruft dich: Der Blutdruck ist gefallen, Frau D. klagt über Schmerzen im Rücken rechts.","effekt":{"vitals":{"hf":122,"sys":86,"dia":52},"alarm":"NIBP niedrig"},"weiter":"k2"},{"id":"k2","typ":"info","zeit":"Stunde 3","text":"Was erhebst du, bevor die Dialyse beginnt?","optionen":[{"id":"o1","label":"Leiste und Verband ansehen","ergebnis":"Verband trocken, kleines Hämatom an der Einstichstelle, Leiste weich, Fußpulse tastbar."},{"id":"o2","label":"Labor: Blutgasanalyse, Blutbild, Gerinnung","ergebnis":"Hb 8,1 g/dl (vor der Anlage 11,4 g/dl), aPTT 74 s unter Heparin, Laktat 2,6 mmol/l, Kalium 5,9 mmol/l."},{"id":"o3","label":"Anlageprotokoll lesen","ergebnis":"Erster Versuch ohne Ultraschall, Punktion hoch in der Leiste, kurz hellrotes Blut, Nadel entfernt, 5 Minuten komprimiert. Zweiter Versuch ultraschallgesteuert, venös.","q":["clark14"]},{"id":"o4","label":"Bauch und Flanke untersuchen","ergebnis":"Rechte Flanke druckschmerzhaft, Bauch weich, keine Abwehrspannung."},{"id":"o5","label":"Funktion des Shaldon prüfen","ergebnis":"Beide Schenkel gut aspirierbar, dunkles venöses Blut."}],"pflicht":["o2","o3"],"weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Stunde 3","frage":"Wie gehst du vor?","optionen":[{"id":"a1","text":"Verdacht auf retroperitoneale Blutung: Heparin stoppen, Volumen und Blutprodukte, CT-Angiographie, Gefäßchirurgie oder interventionelle Radiologie informieren","bewertung":"richtig","feedback":"Richtig. Hb-Abfall, Hypotonie und Flankenschmerz nach hoher Leistenpunktion mit arteriellem Rückfluss sprechen für eine retroperitoneale Blutung. Ein Kalium von 5,9 mmol/l lässt Zeit, die Blutung zuerst zu klären.","q":["clark14"],"weiter":"k4"},{"id":"a2","text":"Kristalloide geben und die CVVHD wie geplant mit Heparin starten","bewertung":"falsch","feedback":"Gefährlich. Die Zeichen sprechen für eine aktive Blutung. Zusätzliches Heparin im Kreislauf und ein Volumenentzug verschlechtern die Lage.","weiter":"k5"},{"id":"a3","text":"Shaldon sofort ziehen und die Leiste 15 Minuten komprimieren","bewertung":"falsch","feedback":"Löst das Problem nicht. Die wahrscheinliche Quelle ist die arterielle Fehlpunktion oberhalb des Leistenbandes; sie blutet ins Retroperitoneum und ist von außen nicht komprimierbar. Das Ziehen kostet nur den Zugang. Das Team entscheidet sich für die Bildgebung.","weiter":"k4"}],"weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Stunde 5","effekt":{"vitals":{"hf":104,"sys":104,"dia":60}},"frage":"Die CT-Angiographie zeigt ein retroperitoneales Hämatom mit Blutung aus einem Seitenast der A. iliaca externa; die interventionelle Radiologie embolisiert erfolgreich, Frau D. erhält zwei Erythrozytenkonzentrate. Wie geht es mit der Nierenersatztherapie weiter?","optionen":[{"id":"m1","text":"CVVHD mit regionaler Citratantikoagulation statt systemischem Heparin","richtig":true,"feedback":"Ja. KDIGO schlägt bei erhöhtem Blutungsrisiko die regionale Citratantikoagulation für die CRRT vor."},{"id":"m2","text":"Den gut funktionierenden femoralen Shaldon weiter nutzen","richtig":true,"feedback":"Ja. Der Katheter selbst liegt venös und funktioniert; eine Neuanlage brächte neue Risiken."},{"id":"m3","text":"Nach Hausstandard den Lock eher mit Citrat 4 % statt Heparin setzen","richtig":true,"feedback":"Ja, naheliegend. Heparin aus dem Lock tritt messbar in den Kreislauf über; bei frischer Blutung spricht das für Citrat."},{"id":"m4","text":"Hb und Kreislauf engmaschig kontrollieren, Antikoagulation des Vorhofflimmerns erst nach Rücksprache wieder aufnehmen","richtig":true,"feedback":"Ja. Die Wiederaufnahme ist eine gemeinsame Abwägung von Blutungs- und Schlaganfallrisiko."},{"id":"m5","text":"Zusätzlich einen zweiten Shaldon jugulär als Reserve anlegen","richtig":false,"feedback":"Nein. Ein Reservekatheter bringt nur zusätzliche Punktions- und Infektionsrisiken."},{"id":"m6","text":"Heparin-Perfusor sofort in voller Dosis neu starten, wegen des Schlaganfallrisikos","richtig":false,"feedback":"Nein. Erst nach gesicherter Blutstillung und gemeinsamer Abwägung."}],"weiter":"k7"},{"id":"k5","typ":"text","zeit":"Stunde 4","titel":"Vierzig Minuten später","text":"Die CVVHD läuft mit Heparin. Frau D. ist somnolent und kaltschweißig, der Blutdruck fällt trotz 1.500 ml Volumen weiter.","effekt":{"vitals":{"hf":138,"sys":68,"dia":38,"spo2":90,"af":28},"alarm":"NIBP niedrig"},"weiter":"k6"},{"id":"k6","typ":"wahl","zeit":"Stunde 4","frage":"Was tust du jetzt?","optionen":[{"id":"b1","text":"Dialyse und Heparin stoppen, Notfalltransfusion, Oberärzt:in, sofort CT-Angiographie oder direkt Intervention","bewertung":"richtig","feedback":"Richtig, jetzt ohne Zeitverlust. Der hämorrhagische Schock hat Vorrang vor der Nierenersatztherapie.","effekt":{"vitals":{"hf":124,"sys":82,"dia":48}}},{"id":"b2","text":"Noradrenalin starten und den Entzug an der Maschine reduzieren","bewertung":"falsch","feedback":"Nein. Damit wird die Blutung kaschiert, nicht behandelt; Heparin im Kreislauf hält sie in Gang."}],"weiter":"k8"},{"id":"k7","typ":"ende","titel":"Blutung früh erkannt","text":"Frau D. stabilisiert sich, die CVVHD läuft am nächsten Morgen mit Citratantikoagulation über den bestehenden Katheter.","lernpunkte":["Hypotonie, Hb-Abfall und Rücken- oder Flankenschmerz nach femoraler Anlage: an eine retroperitoneale Blutung denken, auch ohne sichtbares Hämatom.","Femoral unterhalb des Leistenbandes und immer ultraschallgesteuert punktieren.","Bei Blutung die Nierenersatztherapie ohne systemisches Heparin planen, z. B. mit regionaler Citratantikoagulation."]},{"id":"k8","typ":"ende","titel":"Blutung spät erkannt","text":"Frau D. braucht eine Massivtransfusion und eine notfallmäßige Embolisation. Die Dialyse beginnt erst am Folgetag.","lernpunkte":["Vor dem Start einer Dialyse mit Antikoagulation eine Blutung als Ursache neuer Hypotonie ausschließen.","Ein Anlageprotokoll mit arteriellem Rückfluss ist ein Warnsignal und gehört in die Übergabe.","Katecholamine überdecken einen Volumenmangel durch Blutung, sie behandeln ihn nicht."]}]},{"titel":"Breitkomplextachykardie beim Drahtvorschub","patient":{"kurz":"Herr B., 58 J.","alter":58,"geschlecht":"m","gewicht_kg":92,"groesse_cm":181,"vorgeschichte":"Kardiogener Schock nach Hinterwandinfarkt, Oligurie, Kalium 6,3 mmol/l, metabolische Azidose; CVVHD geplant."},"start":{"zeit":"Minute 0","vitals":{"hf":102,"sys":98,"dia":60,"spo2":95,"af":22,"temp":37.1},"rhythmus":"sinus_tachy"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Anlage rechts jugulär","text":"Die Punktion der V. jugularis interna rechts gelingt ultraschallgesteuert auf Anhieb. Der Kollege schiebt den Draht zügig vor, die 40-cm-Markierung ist fast an der Kanüle.","weiter":"k2"},{"id":"k2","typ":"wahl","zeit":"Minute 1","effekt":{"vitals":{"hf":168,"sys":82,"dia":50},"rhythmus":"vt","alarm":"VT"},"frage":"Der Monitor zeigt eine Breitkomplextachykardie mit 168/min, Herr B. ist ansprechbar. Was tust du?","optionen":[{"id":"a1","text":"Den Kollegen bitten, den Draht sofort auf etwa 15 cm zurückzuziehen und festzuhalten","bewertung":"richtig","feedback":"Richtig. Die Ursache ist mechanisch: Die Drahtspitze reizt das Myokard. Zurückziehen beendet die Tachykardie meist sofort.","q":["clark16"]},{"id":"a2","text":"Amiodaron i. v. vorbereiten lassen","bewertung":"falsch","feedback":"Nicht als erstes. Erst die mechanische Ursache beseitigen; ein Antiarrhythmikum nur, wenn die Tachykardie danach anhält."},{"id":"a3","text":"Sofort synchronisiert kardiovertieren","bewertung":"falsch","feedback":"Bei erhaltenem Kreislauf und klar mechanischer Ursache nicht der erste Schritt. Ohne Zurückziehen des Drahtes käme die Tachykardie wieder."},{"id":"a4","text":"Draht ganz entfernen und neu punktieren","bewertung":"akzeptabel","feedback":"Beendet die Rhythmusstörung auch, kostet aber den Zugang und eine weitere Punktion; Zurückziehen reicht."}],"weiter":"k3"},{"id":"k3","typ":"text","zeit":"Minute 2","titel":"Draht zurückgezogen","effekt":{"vitals":{"hf":108,"sys":96,"dia":58},"rhythmus":"sinus_tachy"},"text":"Mit dem Zurückziehen endet die Tachykardie. Die venöse Drahtlage wird im Längsschnitt bestätigt, dilatiert und ein 15-cm-Katheter eingeführt. Beide Schenkel lassen sich leicht aspirieren und spülen.","weiter":"k4"},{"id":"k4","typ":"zahl","zeit":"Minute 12","frage":"Auf dem arteriellen (roten) Schenkel steht „1,4 ml“. Wie viel Lock-Lösung gibst du in diesen Schenkel?","einheit":"ml","min":0,"max":5,"schritt":0.1,"start":0,"zielbereich":[1.3,1.5],"feedback_ok":"Richtig: das aufgedruckte Füllvolumen, langsam injiziert. Auch dann tritt ein Teil an der Spitze aus; deshalb wird der Lock vor jeder Nutzung aspiriert.","feedback_zu_niedrig":"Zu wenig. Die Katheterspitze bleibt ungeschützt, Blut gerinnt im Lumen, und der Schenkel ist beim nächsten Anschluss verschlossen.","feedback_zu_hoch":"Zu viel. Was über das Füllvolumen hinausgeht, gelangt in den Kreislauf: Heparin wirkt dann systemisch gerinnungshemmend, Citrat bindet Calcium.","weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 40","frage":"Was muss erfüllt sein, bevor die Dialysepflege Herrn B. an die CVVHD anschließt?","optionen":[{"id":"m1","text":"Röntgen-Thorax: Spitze am Übergang der V. cava superior zum rechten Vorhof, kein Pneumothorax","richtig":true,"feedback":"Ja. KDIGO empfiehlt das Röntgen nach jugulärer Anlage vor der ersten Nutzung (1B)."},{"id":"m2","text":"Lock aus beiden Schenkeln aspirieren und verwerfen","richtig":true,"feedback":"Ja. Sonst landet der gesamte Lock als Bolus im Patienten."},{"id":"m3","text":"Beide Schenkel leicht aspirier- und spülbar","richtig":true,"feedback":"Ja. Schlechte Aspiration kündigt Flussprobleme an."},{"id":"m4","text":"Dokumentation von Ort, Länge, Lock-Art und Volumen je Schenkel sowie ärztliche Freigabe","richtig":true,"feedback":"Ja. Ohne diese Angaben kann die Pflege den Lock nicht sicher handhaben."},{"id":"m5","text":"Röntgen nur, wenn Herr B. Luftnot bekommt","richtig":false,"feedback":"Nein. Fehllage oder Pneumothorax können symptomlos sein, und hohe Blutflüsse mit Antikoagulation verzeihen keine Fehllage."},{"id":"m6","text":"Den venösen Schenkel bis zum Start für Noradrenalin nutzen","richtig":false,"feedback":"Nein. Dialysekatheter dienen außer im Notfall nur der Nierenersatztherapie. Beim Umstecken bricht die Noradrenalinzufuhr ab, oder das Noradrenalin im Lumen wird als Bolus gespült."}],"weiter":"k6"},{"id":"k6","typ":"ende","titel":"Katheter freigegeben","text":"Das Röntgen zeigt eine regelrechte Lage ohne Pneumothorax. Nach Aspiration des Locks startet die CVVHD mit gutem Fluss.","lernpunkte":["Draht nicht tiefer als etwa 20 cm vorschieben; bei Rhythmusstörungen zuerst zurückziehen.","Lock immer mit dem aufgedruckten Füllvolumen je Schenkel setzen und vor jeder Nutzung aspirieren.","Jugulärer Shaldon: Röntgen vor der ersten Nutzung, dann dokumentierte Freigabe.","Den Dialysekatheter außer im Notfall nicht für Infusionen nutzen."]}]}]},{"id":"prozedur-zvk","typ":"prozedur","titel":"ZVK-Anlage","untertitel":"Ultraschallgesteuert über die V. jugularis interna, Seldinger-Technik","gruppe":"Prozeduren","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Material und maximale Barrieremaßnahmen für eine ZVK-Anlage vollständig und steril vorbereiten","Die Schritte der Seldinger-Technik in richtiger Reihenfolge benennen und jeweils begründen","Die Sicherheitskontrollen vor der Dilatation und nach der Anlage erklären: venöse Drahtlage, Spitzenlage, Pneumothorax","Arterielle Fehlkanülierung, Luftembolie und drahtbedingte Rhythmusstörungen erkennen und erste Maßnahmen einleiten"],"quellen":[{"id":"krinko1","kurz":"KRINKO 2017, Teil 1","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 1: Nichtgetunnelte zentralvenöse Katheter. Bundesgesundheitsbl 2017;60:171–206","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/
