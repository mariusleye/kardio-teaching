n Beutel ablassen, kein Vakuum und kein Wandsog; Richtwert höchstens 1,5 l pro Sitzung","warum":"Langsame Entlastung lässt die Lunge kontrolliert entfalten, und Warnzeichen fallen auf, bevor ein Re-Expansionsödem oder Pneumothorax entsteht. Vakuum führte in Studien zu mehr Komplikationen.","q":["bts_verfahren"]},{"text":"Patient:in fortlaufend beobachten und sofort stoppen bei Engegefühl, Schmerz, anhaltendem Husten, zunehmender Dyspnoe oder SpO2-Abfall","warum":"Diese Beschwerden können ein beginnendes Re-Expansionsödem oder eine nicht expandierbare Lunge anzeigen; der Abbruch gilt auch weit unter 1,5 l.","q":["bts_verfahren"]},{"text":"Katheter bei geschlossenem Dreiwegehahn zügig entfernen, steriles Pflaster aufkleben","warum":"Der geschlossene Hahn verhindert Luftzutritt beim Entfernen; die kleine Einstichstelle braucht nur einen einfachen Verband.","q":["bts_anhang3"]},{"text":"Vitalparameter sofort danach erheben, Proben beschriften und versenden, Eingriff dokumentieren; Bildgebung nach klinischem Bild","warum":"Komplikationen zeigen sich oft in der ersten Stunde. Ein Routineröntgen ist nach unkomplizierter Punktion ohne Beschwerden nicht nötig, bei Beschwerden oder schwieriger Punktion aber schon; Lungenultraschall hilft am Bett.","q":["bts_verfahren","lus"]}],"komplikationen":[{"titel":"Pneumothorax","erkennen":"Häufigste Komplikation. Neue Dyspnoe, Thoraxschmerz, Hustenreiz, SpO2-Abfall, einseitig abgeschwächtes Atemgeräusch. Im Ultraschall fehlendes Lungengleiten ohne B-Linien, beweisend ist ein Lungenpunkt; Bestätigung im Röntgen. Ursachen: Verletzung der Pleura visceralis, Luftzutritt über ein offenes System oder nicht expandierbare Lunge (Pneumothorax ex vacuo).","handeln":"Sauerstoff nach Zielsättigung, Ärzt:in informieren, Monitoring, Röntgen. Beschwerdearme iatrogene Pneumothoraces heilen oft ohne Eingriff; ein Pneumothorax ex vacuo braucht meist keine Drainage. Bei Beschwerden oder Größenzunahme Aspiration oder kleinlumige Drainage. Hypotonie, gestaute Halsvenen und rasch zunehmende Hypoxie: an Spannungspneumothorax denken und sofort entlasten."},{"titel":"Re-Expansionsödem","erkennen":"Selten, aber potenziell lebensbedrohlich; meist innerhalb der ersten Stunde nach Entlastung: Husten, Engegefühl, Dyspnoe, Hypoxämie, Rasselgeräusche und neue Infiltrate auf der entlasteten Seite, im Ultraschall viele B-Linien bei erhaltenem Lungengleiten.","handeln":"Ablauf sofort stoppen, ABCDE, Sauerstoff nach Zielsättigung, dringliches Röntgen (andere Komplikationen ausschließen); bei Verschlechterung Intensivstation, CPAP oder High-Flow erwägen. Diuretika und Opiate werden teils gegeben, sind aber nicht evidenzbasiert. Vorbeugen: langsam ablassen, höchstens etwa 1,5 l, bei Beschwerden früher stoppen."},{"titel":"Blutung und Hämatothorax","erkennen":"Selten, aber potenziell lebensbedrohlich: zunehmend blutiges Punktat, Hb-Abfall, Tachykardie, Hypotonie, im Ultraschall rasch zunehmender, echoreicher Erguss oder Thoraxwandhämatom. Ein Erguss-Hämatokrit über 50 % des Blut-Hämatokrits spricht für einen Hämatothorax.","handeln":"Punktion stoppen, Monitoring, großlumige Zugänge, Hb, Gerinnung und Kreuzblut; Antikoagulation prüfen; Oberärzt:in, Bildgebung (CT) und frühzeitig die Thoraxchirurgie einbinden. Vorbeugen: direkt über dem Rippenoberrand und nicht weit posterior punktieren."},{"titel":"Vasovagale Reaktion","erkennen":"Blässe, Schwitzen, Übelkeit, Bradykardie und Hypotonie bis zur Synkope; oft durch Schmerz oder Angst ausgelöst.","handeln":"Punktion unterbrechen, Patient:in hinlegen, Beine hoch, Monitoring; bei anhaltender symptomatischer Bradykardie ärztliche Therapie (z. B. Atropin). Vorbeugen: ruhige Aufklärung und ausreichende Lokalanästhesie."},{"titel":"Organverletzung und Infektion","erkennen":"Zu tiefe oder zu kaudale Punktion kann Leber oder Milz treffen: Bauchschmerz, Hb-Abfall, Kreislaufinstabilität. Infektion (selten): Fieber, Rötung an der Einstichstelle, später trüber Erguss.","handeln":"Vorbeugen durch Ultraschall in Punktionsposition (Zwerchfell, Organe, Tiefe) und Abstand zum Zwerchfell. Bei Verdacht Bildgebung und Chirurgie; bei Infektzeichen Diagnostik und Antibiose nach ärztlicher Entscheidung."}],"nachsorge":["Vitalparameter und Beschwerden direkt nach der Punktion erheben, auf der IMC weiter nach Stationsstandard überwachen; neue Dyspnoe, Husten, Thoraxschmerz oder SpO2-Abfall sofort ärztlich abklären","Bildgebung nach klinischem Bild: Röntgen-Thorax bei Beschwerden, kompliziertem Verlauf oder mehreren Punktionsversuchen; nach unkomplizierter Punktion ohne Beschwerden laut BTS nicht routinemäßig (Hausstandard beachten)","Lungenultraschall als schnelle Bettkontrolle: Sichtbares Lungengleiten oder B-Linien schließen einen Pneumothorax an dieser Stelle aus, ein Lungenpunkt beweist ihn","Beim malignen Erguss hilft ein Röntgen nach Entlastung, eine nicht expandierbare Lunge zu erkennen","Proben vollständig beschriftet und zügig ins Labor, Zytologie bei Verzögerung kühlen; Light-Kriterien mit zeitgleichem Serum-Eiweiß und LDH auswerten","Antikoagulation nach festgelegtem Plan wieder beginnen (BTS: DOAK 1 Tag nach Eingriffen mit niedrigem, 2 bis 3 Tage nach Eingriffen mit hohem Blutungsrisiko) und dokumentieren","Dokumentation: Seite, Ort, Menge, Aspekt, Proben, Komplikationen, Plan; Therapie der Ursache (z. B. Rekompensation) fortführen"],"uebungen":[{"titel":"Atemnot nach Entlastungspunktion","patient":{"kurz":"Herr M., 74 J.","alter":74,"geschlecht":"m","gewicht_kg":78,"groesse_cm":175,"vorgeschichte":"Ischämische Kardiomyopathie (LVEF 30 %), permanentes Vorhofflimmern, Apixaban seit 48 h pausiert. Großer Pleuraerguss rechts trotz intensivierter Diuretika, Dyspnoe in Ruhe."},"start":{"zeit":"Minute 0","vitals":{"hf":94,"sys":116,"dia":70,"spo2":94,"af":20,"temp":36.8},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"info","zeit":"Minute 20","text":"Ultraschallgestützte Entlastungspunktion rechts im Sitzen: 1.100 ml seröser Erguss über Katheter und Schwerkraft, ohne Beschwerden. Beim Entfernen des Katheters hustet Herr M. kräftig. 20 Minuten später klagt er über zunehmende Luftnot. Was erhebst du?","effekt":{"vitals":{"hf":116,"sys":110,"dia":68,"spo2":89,"af":28},"alarm":"SpO2 niedrig"},"optionen":[{"id":"o1","label":"Auskultation und Trachea","ergebnis":"Rechts apikal und ventral abgeschwächtes Atemgeräusch, basal noch etwas Dämpfung. Trachea mittelständig."},{"id":"o2","label":"Lungenultraschall rechts ventral","ergebnis":"Kein Lungengleiten, keine B-Linien; in der vorderen Axillarlinie ein Lungenpunkt (Übergang zu normalem Gleiten).","q":["lus"]},{"id":"o3","label":"Kreislauf und Halsvenen","ergebnis":"RR 110/68 mmHg, HF 116/min (Vorhofflimmern), Halsvenen nicht gestaut, peripher warm."},{"id":"o4","label":"Blutgasanalyse","ergebnis":"pO2 57 mmHg, pCO2 36 mmHg, pH 7,46 unter 2 l O2 über Nasenbrille."}],"pflicht":["o2","o3"],"moderation":"Erst sammeln lassen, dann deuten: Welche zwei Befunde trennen Pneumothorax und Re-Expansionsödem am Bett?","weiter":"k2"},{"id":"k2","typ":"wahl","frage":"Wie schätzt du die Lage ein, und was tust du zuerst?","optionen":[{"id":"a","text":"Iatrogener Pneumothorax ohne Spannungszeichen: O2 steigern, Ärzt:in informieren, Röntgen-Thorax veranlassen, Monitoring fortführen","bewertung":"richtig","feedback":"Fehlendes Lungengleiten ohne B-Linien plus Lungenpunkt beweisen einen Pneumothorax. Kreislauf stabil, Trachea mittelständig, Halsvenen nicht gestaut: kein Spannungspneumothorax. Ursache hier wohl Luftzutritt oder Pleuraverletzung beim Husten während der Katheterentfernung.","effekt":{"vitals":{"spo2":93}},"q":["lus","bts_verfahren"]},{"id":"b","text":"Spannungspneumothorax: sofort Nadeldekompression im 2. ICR","bewertung":"falsch","feedback":"Kein Spannungsbild: RR stabil, keine Halsvenenstauung, Trachea mittelständig. Eine unnötige Dekompression setzt eine zusätzliche Verletzung."},{"id":"c","text":"Re-Expansionsödem: Furosemid i. v. und abwarten","bewertung":"falsch","feedback":"Beim Re-Expansionsödem wären Lungengleiten und viele B-Linien zu sehen, hier zeigt der Ultraschall das Gegenteil. Diuretika sind zudem keine belegte Therapie des Re-Expansionsödems.","q":["lus","bts_verfahren"]},{"id":"d","text":"Den Resterguss sofort nachpunktieren","bewertung":"falsch","feedback":"Eine erneute Punktion behandelt das Problem nicht und erhöht das Risiko."}],"weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Minute 45","frage":"Röntgen: Pneumothorax rechts, apikal etwa 3 cm. Herr M. braucht 4 l O2 für eine SpO2 von 93 % und ist weiter dyspnoisch. Wie geht es weiter?","optionen":[{"id":"a","text":"Kleinlumige Thoraxdrainage (Seldinger, unter 14 F) durch eine erfahrene Person","bewertung":"richtig","feedback":"Symptomatischer, sauerstoffpflichtiger Pneumothorax: Eine Intervention ist sinnvoll. Kleinlumige Drainagen reichen für die meisten iatrogenen Pneumothoraces.","q":["bts_verfahren"]},{"id":"b","text":"Nadelaspiration der Luft, danach Röntgenkontrolle","bewertung":"akzeptabel","feedback":"Möglich zur raschen Symptomlinderung. Bei anhaltender Sauerstoffpflicht und schwerer Herzinsuffizienz ist eine Drainage oft die verlässlichere Lösung; die Entscheidung trifft die Oberärzt:in.","q":["bts_leitlinie"]},{"id":"c","text":"Abwarten, iatrogene Pneumothoraces heilen meist von selbst; Kontrolle morgen","bewertung":"falsch","feedback":"Beschwerdearme iatrogene Pneumothoraces dürfen oft beobachtet werden. Herr M. ist aber symptomatisch und sauerstoffpflichtig; ohne engmaschige Kontrolle fällt eine Zunahme zu spät auf.","q":["bts_leitlinie"],"weiter":"k3b"}],"weiter":"k4"},{"id":"k3b","typ":"wahl","zeit":"Minute 120","frage":"Zwei Stunden später kann Herr M. kaum sprechen: SpO2 86 % unter 6 l O2, HF 134/min, RR 96/60 mmHg. Was jetzt?","effekt":{"vitals":{"hf":134,"sys":96,"dia":60,"spo2":86,"af":32},"alarm":"SpO2 niedrig"},"optionen":[{"id":"a","text":"Sofort Notfallteam und Oberärzt:in, Drainage durch eine erfahrene Person; bei Spannungszeichen vorher sofort entlasten","bewertung":"richtig","feedback":"Zunehmende Hypoxie und beginnende Kreislaufbeteiligung: Der Pneumothorax muss jetzt entlastet werden. Kommen Hypotonie und Halsvenenstauung dazu, liegt ein Spannungspneumothorax vor.","effekt":{"vitals":{"hf":108,"sys":112,"dia":66,"spo2":93,"af":24}}},{"id":"b","text":"CPAP-Maske zur Verbesserung der Oxygenierung","bewertung":"falsch","feedback":"Positiver Atemwegsdruck bei nicht drainiertem Pneumothorax kann ihn vergrößern und eine Spannungssituation auslösen. CPAP nur mit funktionierender Drainage.","q":["bts_verfahren"]},{"id":"c","text":"O2 auf 15 l erhöhen und weiter beobachten","bewertung":"falsch","feedback":"Sauerstoff überbrückt nur; die Ursache bleibt und schreitet fort."}],"weiter":"e2"},{"id":"k4","typ":"mehrfach","frage":"Die Drainage liegt, Herr M. ist stabil. Welche Faktoren erhöhen bei der Pleurapunktion das Pneumothoraxrisiko?","effekt":{"vitals":{"hf":98,"sys":114,"dia":70,"spo2":95,"af":20}},"optionen":[{"text":"Große Entlastungsmengen","richtig":true,"feedback":"Mit steigender Menge steigt das Risiko."},{"text":"Geringe Ergusstiefe am Punktionsort","richtig":true,"feedback":"Wenig Abstand zur Lunge: Die Nadel erreicht leichter die Pleura visceralis."},{"text":"Wenig Erfahrung der punktierenden Person","richtig":true,"feedback":"Erfahrung und Supervision senken das Risiko."},{"text":"Untergewicht","richtig":true,"feedback":"In Studien als Risikofaktor beschrieben."},{"text":"Luftzutritt über ein offenes System","richtig":true,"feedback":"Ein offener Dreiwegehahn beim Spritzenwechsel lässt Luft eintreten."},{"text":"Ultraschallsteuerung","richtig":false,"feedback":"Ultraschall senkt das Pneumothoraxrisiko nachweislich."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Pneumothorax erkannt und versorgt","text":"Herr M. hatte nach der Entlastung einen symptomatischen iatrogenen Pneumothorax. Ultraschall am Bett, Kreislaufbeurteilung und Röntgen ermöglichten eine zügige, angemessene Versorgung mit kleinlumiger Drainage.","lernpunkte":["Neue Dyspnoe nach Pleurapunktion: zuerst an Pneumothorax denken; fehlendes Lungengleiten ohne B-Linien plus Lungenpunkt ist beweisend.","Spannungszeichen (Hypotonie, Halsvenenstauung, Trachealverlagerung, rasch zunehmende Hypoxie) bestimmen die Dringlichkeit.","Beschwerdearme iatrogene Pneumothoraces heilen oft ohne Eingriff; symptomatische brauchen Aspiration oder kleinlumige Drainage.","Vorbeugen: Ultraschall, moderates Volumen, System geschlossen halten, Katheter bei geschlossenem Hahn entfernen."]},{"id":"e2","typ":"ende","titel":"Zu spät erkannt: Entlastung im Notfall","text":"Abwarten ohne engmaschige Kontrolle hat bei einem symptomatischen, sauerstoffpflichtigen Pneumothorax zur Verschlechterung geführt. Die Drainage hat Herrn M. stabilisiert, aber unter Notfallbedingungen.","lernpunkte":["Wer konservativ beobachtet, braucht einen klaren Plan: Monitoring, Kontrollzeitpunkt, Eskalationskriterien.","Symptomatischer Pneumothorax mit Sauerstoffbedarf: Entlastung nicht aufschieben.","Kein CPAP bei nicht drainiertem Pneumothorax."]}]},{"titel":"Husten während der Entlastung","patient":{"kurz":"Frau K., 66 J.","alter":66,"geschlecht":"w","gewicht_kg":61,"groesse_cm":164,"vorgeschichte":"Biologischer Aortenklappenersatz vor 3 Wochen; seitdem zunehmender Pleuraerguss links, im Röntgen fast der ganze linke Hemithorax verschattet. Medikation: ASS 100 mg, Bisoprolol, Torasemid."},"start":{"zeit":"Minute 0","vitals":{"hf":98,"sys":128,"dia":74,"spo2":93,"af":24,"temp":37.1},"rhythmus":"sinus"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"mehrfach","frage":"Entlastungspunktion links ist geplant. Was gilt für die Vorbereitung?","optionen":[{"text":"ASS kann weiterlaufen","richtig":true,"feedback":"ASS und prophylaktisches Heparin dürfen vor Pleurapunktionen weitergegeben werden."},{"text":"Ultraschall in der Punktionsposition, danach ohne Umlagerung punktieren","richtig":true,"feedback":"Sonst stimmt die Markierung nicht mehr."},{"text":"Langsam per Spritze oder Schwerkraft ablassen, Dreiwegehahn im System","richtig":true,"feedback":"So lässt sich der Ablauf jederzeit sofort stoppen."},{"text":"Vakuumflasche anschließen, damit es schneller geht","richtig":false,"feedback":"Vakuum oder Wandsog sollen nicht verwendet werden: mehr Komplikationen und mehr Schmerzen."},{"text":"Routinemäßig Gerinnung bestimmen und FFP bereitstellen","richtig":false,"feedback":"Ohne Gerinnungsanamnese und ohne Antikoagulation ist kein Gerinnungstest nötig."},{"text":"Weit posterior paravertebral punktieren, weil dort der Erguss am tiefsten ist","richtig":false,"feedback":"Posterior liegt das Gefäß-Nerven-Bündel nicht geschützt unter der Rippe; bevorzugt wird das Sicherheitsdreieck, möglichst lateral."}],"weiter":"k2"},{"id":"k2","typ":"zahl","frage":"Frau K. ist beschwerdefrei. Welche Menge (ml) ist der übliche Richtwert für das Maximum in dieser Sitzung?","einheit":"ml","min":0,"max":3000,"schritt":100,"start":500,"zielbereich":[1500,1500],"feedback_ok":"Richtig: in der Regel höchstens 1,5 l pro Sitzung. Bei Beschwerden wird früher gestoppt; größere Mengen nur in Ausnahmefällen unter Überwachung durch erfahrene Teams.","feedback_zu_niedrig":"Weniger abzulassen ist erlaubt und bei Beschwerden richtig. Der übliche Richtwert für das Maximum liegt aber bei 1,5 l.","feedback_zu_hoch":"Zu viel: Darüber wächst die Sorge vor Re-Expansionsödem und Pneumothorax. Richtwert ist höchstens 1,5 l pro Sitzung.","weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Minute 25","frage":"Nach 1.000 ml hustet Frau K. anhaltend und klagt über Druck in der linken Brust. Was tust du?","effekt":{"vitals":{"hf":108,"spo2":90,"af":26},"rhythmus":"sinus_tachy"},"optionen":[{"id":"a","text":"Ablauf sofort stoppen (Dreiwegehahn schließen) und Ärzt:in informieren","bewertung":"richtig","feedback":"Engegefühl, Schmerz und anhaltender Husten sind Abbruchkriterien, unabhängig von der Menge. Sie können ein beginnendes Re-Expansionsödem oder eine nicht expandierbare Lunge anzeigen.","q":["bts_verfahren"]},{"id":"b","text":"Weiter bis 1.500 ml; Husten ist bei der Re-Expansion normal","bewertung":"falsch","feedback":"Die 1,5 l sind eine Obergrenze, kein Ziel. Wer bei Warnzeichen weiterlaufen lässt, riskiert ein Re-Expansionsödem.","effekt":{"vitals":{"spo2":87,"af":30}},"q":["bts_verfahren"]},{"id":"c","text":"Hustenstiller geben und weiter ablassen","bewertung":"falsch","feedback":"Das unterdrückt ein Warnsymptom, statt darauf zu reagieren."}],"weiter":"k4"},{"id":"k4","typ":"info","zeit":"Minute 50","text":"Der Katheter ist entfernt. Frau K. wird zunehmend dyspnoisch und unruhig. Was erhebst du?","effekt":{"vitals":{"hf":118,"sys":104,"dia":62,"spo2":85,"af":32},"rhythmus":"sinus_tachy","alarm":"SpO2 niedrig"},"optionen":[{"id":"o1","label":"Auskultation","ergebnis":"Links feinblasige Rasselgeräusche über dem gesamten Lungenfeld, rechts unauffällig."},{"id":"o2","label":"Lungenultraschall","ergebnis":"Links Lungengleiten vorhanden, zahlreiche konfluierende B-Linien, kleiner Resterguss basal; rechts A-Linien.","q":["lus"]},{"id":"o3","label":"Röntgen-Thorax","ergebnis":"Neue diffuse alveoläre Verdichtungen der linken Lunge, kein Pneumothorax, rechts unverändert."},{"id":"o4","label":"Blutgasanalyse","ergebnis":"pO2 54 mmHg, pCO2 34 mmHg unter 4 l O2, Laktat 1,6 mmol/l."},{"id":"o5","label":"Fokussierte Echokardiographie","ergebnis":"LVEF unverändert gut, kein Perikarderguss, Klappenprothese unauffällig."}],"pflicht":["o2","o3"],"moderation":"Kardiologischer Blick: Das Echo schließt Tamponade und akutes Linksherzversagen als Ursache der Hypoxie aus.","weiter":"k5"},{"id":"k5","typ":"mehrfach","frage":"Einseitige Verdichtungen nach rascher Entfaltung: Re-Expansionsödem. Welche Maßnahmen sind angemessen?","optionen":[{"text":"ABCDE-Beurteilung und vollständige Vitalparameter","richtig":true,"feedback":"Erster Schritt bei jeder akuten Verschlechterung."},{"text":"Sauerstoff nach Zielsättigung","richtig":true,"feedback":"Hypoxämie ist das Leitproblem."},{"text":"Bildgebung zum Ausschluss anderer Komplikationen (z. B. Pneumothorax)","richtig":true,"feedback":"Hier bereits erfolgt: kein Pneumothorax."},{"text":"Bei Verschlechterung Intensivstation einbinden, CPAP oder High-Flow erwägen","richtig":true,"feedback":"Ein Pneumothorax ist ausgeschlossen; nichtinvasive Unterstützung ist hier möglich."},{"text":"Furosemid als gesicherte Standardtherapie des Re-Expansionsödems","richtig":false,"feedback":"Diuretika und Opiate werden teils eingesetzt, sind aber nicht evidenzbasiert. Ein Diuretikum aus kardialer Indikation ist davon unabhängig eine ärztliche Einzelentscheidung."},{"text":"Gegenseite vorsorglich ebenfalls punktieren","richtig":false,"feedback":"Rechts ist kein relevanter Erguss; das brächte nur zusätzliches Risiko."}],"weiter":"e1"},{"id":"e1","typ":"ende","titel":"Re-Expansionsödem stabilisiert","effekt":{"vitals":{"hf":102,"sys":112,"dia":68,"spo2":93,"af":24}},"text":"Frau K. entwickelte nach Entlastung eines großen, länger bestehenden Ergusses ein Re-Expansionsödem. Mit Sauerstoff und engmaschiger Überwachung besserte sich der Befund über einige Stunden.","lernpunkte":["Re-Expansionsödem: meist in der ersten Stunde nach Entlastung, mit Hypoxämie und neuen Infiltraten auf der entlasteten Seite.","Husten, Engegefühl oder Schmerz während der Drainage heißt: sofort stoppen, egal wie viel schon abgelaufen ist.","Langsam ablassen (Spritze oder Schwerkraft), kein Vakuum, Richtwert höchstens 1,5 l pro Sitzung.","Ultraschall unterscheidet am Bett: B-Linien mit Lungengleiten (Ödem) gegen fehlendes Gleiten mit Lungenpunkt (Pneumothorax)."]}]}]},{"id":"prozedur-shaldon","typ":"prozedur","titel":"Shaldon-Katheter","untertitel":"Temporärer doppellumiger Dialysekatheter, Seldinger-Technik mit Dilatation","gruppe":"Prozeduren","reihenfolge":20,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Zugangsort und Katheterlänge für einen Shaldon-Katheter nach KDIGO begründet auswählen","Den Ablauf von Punktion, Dilatation, Katheteranlage und Lock in richtiger Reihenfolge erklären","Einen Katheter-Lock mit dem aufgedruckten Füllvolumen korrekt setzen und das Übertrittsrisiko begründen","Die Voraussetzungen der Nutzungsfreigabe benennen: Lagekontrolle, Aspiration des Locks, Dokumentation","Blutung nach femoraler Anlage und drahtbedingte Rhythmusstörungen erkennen und erste Maßnahmen einleiten"],"quellen":[{"id":"kdigo","kurz":"KDIGO AKI 2012","titel":"KDIGO Clinical Practice Guideline for Acute Kidney Injury, Kapitel 5.3 und 5.4 (Antikoagulation und Gefäßzugang für die Nierenersatztherapie). Kidney Int Suppl 2012;2:1–138","url":"https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf","stand":"2012 (Neufassung AKI/AKD 2026 im Entwurf)"},{"id":"krinko1","kurz":"KRINKO 2017, Teil 1","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 1: Nichtgetunnelte zentralvenöse Katheter. Bundesgesundheitsbl 2017;60:171–206","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1.pdf?__blob=publicationFile&v=3","stand":"2017"},{"id":"krinko_err","kurz":"KRINKO Erratum 2018","titel":"Erratum zu Teil 1: Evidenzkategorien der Hautantiseptik (CHX 2 % Kat. IB, Octenidin 0,1 % Kat. II). Bundesgesundheitsbl 2018;61:446","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1_Erratum.pdf?__blob=publicationFile&v=1","stand":"2018"},{"id":"clark14","kurz":"Clark 2014","titel":"Clark EG, Barsuk JH. Temporary hemodialysis catheters: recent advances. Kidney Int 2014;86:888–895","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4220490/","stand":"2014"},{"id":"clark16","kurz":"Clark 2016","titel":"Clark E et al. Practical aspects of nontunneled and tunneled hemodialysis catheters. Can J Kidney Health Dis 2016;3:2054358116669128","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5332079/","stand":"2016"},{"id":"boucley","kurz":"Boucley 2023","titel":"Boucley I et al. Systematic review of locking solutions for non-tunneled hemodialysis catheters. Hemodial Int 2023;27:12–20","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10092163/","stand":"2023"},{"id":"asa","kurz":"ASA 2020","titel":"Practice Guidelines for Central Venous Access 2020. An Updated Report by the American Society of Anesthesiologists Task Force on Central Venous Access. Anesthesiology 2020;132:8–43","url":"https://doi.org/10.1097/ALN.0000000000002864","stand":"2020"},{"id":"perseus","kurz":"ESAIC PERSEUS 2020","titel":"Lamperti M et al. European Society of Anaesthesiology guidelines on peri-operative use of ultrasound-guided for vascular access (PERSEUS vascular access). Eur J Anaesthesiol 2020;37:344–376","url":"https://doi.org/10.1097/EJA.0000000000001180","stand":"2020"},{"id":"ahs","kurz":"AHS 2023","titel":"Alberta Health Services, Critical Care Strategic Clinical Network: Dialyzing Wisely. Renal Replacement Therapy (RRT) Access, Care Pathway Resource","url":"https://www.albertahealthservices.ca/assets/about/scn/ahs-scn-cc-dialyzingwisely-rrt-access-care-pathway-resource.pdf","stand":"September 2023"},{"id":"xylocain","kurz":"Fachinfo Xylocain 1 %/2 %","titel":"Fachinformation Xylocain 1 %/2 % Injektionslösung (Lidocainhydrochlorid), Abschnitte 4.2 bis 4.4","url":"https://www.fachinfo.de/pdf/004674","stand":"Juli 2022"}],"moderation":"Impulsfragen:\n1. Warum steht die V. femoralis bei KDIGO vor der linken V. jugularis, und wann würdest du trotzdem jugulär gehen?\n2. Was passiert mit einem Heparin-Lock, wenn man mehr als das aufgedruckte Volumen injiziert oder ihn vor dem Anschluss nicht aspiriert?\n3. Wer gibt bei euch den Katheter zur Nutzung frei, und woran erkennt die Dialysepflege, dass das geschehen ist?\n4. Woran denkst du bei Hypotonie und Rückenschmerz wenige Stunden nach femoraler Anlage?\nStolperstellen: Dilatator zu tief vorgeschoben; Lock-Volumen geschätzt statt am Schenkel abgelesen; Dialysekatheter als Infusionszugang benutzt.","indikationen":["Akute Nierenersatztherapie (kontinuierlich oder intermittierend) bei Patient:innen ohne nutzbaren Dialyseshunt","Typische Anlässe: therapierefraktäre Hyperkaliämie, schwere metabolische Azidose, diuretikarefraktäre Überwässerung, urämische Komplikationen, dialysierbare Intoxikation","Überbrückung, bis ein getunnelter Katheter oder Shunt angelegt ist, wenn sich eine längere Dialysepflicht abzeichnet","Seltener: therapeutischer Plasmaaustausch oder andere extrakorporale Verfahren"],"kontraindikationen":["Absolut für den gewählten Ort: Thrombose der Zielvene oder Infektion im Punktionsgebiet; dann einen anderen Zugangsweg wählen.","Relativ: schwere Gerinnungsstörung oder Antikoagulation, V. subclavia (Stenoserisiko für spätere Shunts), V. femoralis bei möglicher Nierentransplantation und V. jugularis bei Tracheostoma."],"vorbereitung":["Indikation, Verfahren und Zeitpunkt mit Nephrologie oder Intensiv-Oberärzt:in abstimmen","Zugangsort nach KDIGO-Rangfolge wählen: V. jugularis interna rechts, dann V. femoralis, dann V. jugularis interna links; V. subclavia nur als letzte Option","Katheterlänge zum Ort passend wählen: jugulär rechts 12 bis 15 cm, jugulär links 15 bis 20 cm, femoral 19 bis 24 cm","Aufklärung und Einwilligung; Gerinnung, Thrombozyten, Kalium und laufende Antikoagulation prüfen","Vorab-Ultraschall der Zielvene: offen, komprimierbar und weit genug für einen Katheter von 11 bis 14 Fr","Monitoring mit EKG und SpO2; Lagerung jugulär in Kopftieflage, femoral flach mit leicht abgespreiztem, außenrotiertem Bein","Lock-Lösung nach Hausstandard bereitlegen und das Füllvolumen beider Schenkel am Katheter ablesen und notieren"],"material":{"benoetigt":[{"text":"Maximale Barriere: Haube, Mund-Nasen-Schutz, steriler Kittel, sterile Handschuhe, großes Lochtuch","warum":"Für die Anlage von Dialysekathetern gelten dieselben maximalen Barrierevorkehrungen wie für den ZVK (KRINKO, KDIGO)."},{"text":"Alkoholisches Hautantiseptikum mit Chlorhexidin 2 % oder Octenidin 0,1 %","warum":"Empfohlene Hautantiseptik vor zentralvenöser Anlage (KRINKO; Einwirkzeit nach Hersteller)."},{"text":"Ultraschallgerät mit Linearschallkopf und sterilem Überzug","warum":"KDIGO empfiehlt die ultraschallgesteuerte Anlage von Dialysekathetern mit starkem Empfehlungsgrad (1A); bei großen Kathetern sind Fehlpunktionen besonders folgenreich."},{"text":"Shaldon-Set: Punktionskanüle, Draht, Skalpell, Dilatatoren in steigender Größe, doppellumiger Katheter passender Länge","warum":"Der großlumige Katheter braucht einen schrittweise aufgeweiteten Stichkanal; die Länge bestimmt, ob die Spitze in einer großen Vene liegt."},{"text":"Lokalanästhetikum, z. B. Lidocain 1 %","warum":"Wegen der Dilatation großzügiger als beim ZVK, meist 5 bis 10 ml (50 bis 100 mg). Höchstens 300 mg ohne Vasokonstriktor laut Fachinformation, bei Herzinsuffizienz reduzieren."},{"text":"NaCl 0,9 % in Spülspritzen, mindestens 10 ml je Schenkel","warum":"Zum Füllen vor der Anlage und zum Prüfen von Aspiration und Spülbarkeit danach."},{"text":"Lock-Lösung nach Hausstandard, z. B. Citrat 4 % oder Heparin","warum":"Verhindert die Thrombosierung zwischen den Behandlungen; dosiert wird exakt nach dem Füllvolumen, das auf jedem Schenkel steht."},{"text":"Sterile Verschlusskappen und funktionierende Klemmen an beiden Schenkeln","warum":"Der großlumige Katheter darf nie offen sein: Luftembolie und Blutverlust drohen schnell."},{"text":"Nahtmaterial oder Fixiersystem und steriler Verband","warum":"Ein dislozierter Dialysekatheter kann lebensbedrohlich bluten; die Fixierung muss die ganze Liegedauer halten."}],"ablenker":[{"text":"Antibiotikahaltige Salbe auf die Einstichstelle","warum_nicht":"KDIGO rät bei Intensivpatient:innen davon ab (2C); Risiko für Pilzinfektionen und Resistenzen."},{"text":"Antibiotikahaltige Lock-Lösung zur Infektionsprophylaxe","warum_nicht":"Für nicht getunnelte Dialysekatheter bei AKI rät KDIGO davon ab (2C)."},{"text":"Hochkonzentriertes Citrat (30 % oder 46,7 %) als Standard-Lock","warum_nicht":"Bei Übertritt in den Kreislauf drohen Hypokalzämie und Rhythmusstörungen; üblich sind Konzentrationen bis 4 %."},{"text":"Dreilumiger ZVK mit 7 Fr als Dialysezugang","warum_nicht":"Zu kleiner Querschnitt für den nötigen Blutfluss; Dialysekatheter haben 11 bis 14 Fr."},{"text":"Kurzer 15-cm-Katheter für die V. femoralis","warum_nicht":"Die Spitze erreicht keine große Vene, Rezirkulation und Funktionsstörungen nehmen zu; femoral sind 19 bis 24 cm sinnvoll."}]},"schritte":[{"text":"Time-out: Indikation, Zugangsort, Katheterlänge, Gerinnung, Kalium, Allergien; Assistenz und Monitoring","warum":"Ort und Länge müssen vor dem Öffnen des Sets feststehen, weil Sets unterschiedliche Längen enthalten.","q":["kdigo","asa"]},{"text":"Vorab-Ultraschall der Zielvene, Punktionsstelle festlegen","warum":"Thrombosen oder eine zu kleine Vene fallen vor dem Abdecken auf; femoral liegt die Punktionsstelle unterhalb des Leistenbandes.","q":["kdigo","asa"]},{"text":"Lagerung: jugulär Kopftieflage, femoral flach mit leicht abgespreiztem Bein","warum":"Kopftieflage füllt die Halsvene und senkt das Luftembolierisiko; in der Leiste verbessert die Beinstellung den Zugang.","q":["asa"]},{"text":"Haube, Mund-Nasen-Schutz, hygienische Händedesinfektion, steriler Kittel und sterile Handschuhe","warum":"Maximale Barrierevorkehrungen wie beim ZVK (KRINKO Kat. IB).","q":["krinko1","kdigo"]},{"text":"Hautantiseptik großflächig, Einwirkzeit abwarten, großes Lochtuch, Schallkopf steril beziehen","warum":"Alkoholisches CHX- oder Octenidin-Präparat wirkt nur nach Einwirkzeit; das Feld muss den Bewegungsradius von Draht und Dilatatoren abdecken.","q":["krinko1","krinko_err"]},{"text":"Beide Schenkel mit NaCl 0,9 % füllen, arteriellen Schenkel abklemmen, venösen Schenkel für den Draht offen lassen","warum":"Der Draht tritt durch das venöse Lumen an der Spitze aus; gefüllte Lumen enthalten keine Luft.","q":["krinko1"]},{"text":"Lokalanästhesie von Haut und Stichkanal unter Aspiration","warum":"Die Dilatation ist schmerzhaft; Aspiration verhindert eine intravasale Injektion.","q":["xylocain"]},{"text":"Punktion unter Echtzeit-Ultraschall, Draht widerstandsfrei einführen, nicht tiefer als etwa 20 cm, EKG beobachten","warum":"Ein zu tief vorgeschobener Draht ist ein häufiger Fehler und löst Rhythmusstörungen aus.","q":["kdigo","perseus","clark16"]},{"text":"Venöse Drahtlage im Ultraschall in der Längsachse bestätigen, erst dann dilatieren","warum":"Ein Dilatator für 12 bis 14 Fr in einer Arterie ist eine schwere Komplikation; Blutfarbe und Pulsation reichen als Beleg nicht.","q":["asa"]},{"text":"Ausreichende Stichinzision, Dilatatoren nacheinander über den Draht, jeweils nur so tief wie nötig; Draht zwischendurch auf freie Beweglichkeit prüfen","warum":"Zu tiefes Dilatieren kann Vene, Pleura oder bei femoraler Anlage die Beckengefäße verletzen; ein festsitzender Draht ist abgeknickt.","q":["asa","clark14"]},{"text":"Katheter über den Draht auf die geplante Tiefe vorschieben, Draht entfernen und vollständig vorzeigen, venösen Schenkel sofort abklemmen","warum":"Ein offener großlumiger Schenkel saugt Luft an; der Draht muss vollständig sein.","q":["asa"]},{"text":"Beide Schenkel aspirieren und kräftig spülen, dann abklemmen","warum":"Leichte Aspiration und Spülung beider Schenkel zeigen, dass der Katheter für den Dialysefluss taugt.","q":["ahs"]},{"text":"Lock setzen: jeden Schenkel langsam mit genau dem aufgedruckten Füllvolumen füllen, Klemme schließen, sterile Kappe","warum":"Zu viel Volumen tritt in den Kreislauf über (Heparin wirkt dann systemisch), zu wenig lässt die Spitze thrombosieren.","q":["boucley"]},{"text":"Katheter annähen oder fixieren, steriler Verband","warum":"Eine Dislokation des großlumigen Katheters kann zu lebensbedrohlicher Blutung führen.","q":["clark16","krinko1"]},{"text":"Lagekontrolle: jugulär Röntgen-Thorax vor der ersten Nutzung (Spitze am Übergang V. cava superior zu rechtem Vorhof, kein Pneumothorax); femoral kein Röntgen nötig","warum":"Der halbstarre Katheter darf nicht im Vorhof liegen (Perforationsgefahr) und nicht zu hoch (Dysfunktion, Thrombose); vor hohen Blutflüssen und Antikoagulation muss die Lage gesichert sein.","q":["kdigo"]},{"text":"Dokumentieren und freigeben: Ort, Länge, Lock-Art und Volumen je Schenkel, Röntgenbefund; Katheter als Dialysezugang kennzeichnen","warum":"Die Dialysepflege muss wissen, welcher Lock im Katheter ist und dass er vor dem Anschluss aspiriert werden muss.","q":["kdigo","boucley"]}],"komplikationen":[{"titel":"Arterielle Punktion oder Dilatation einer Arterie","erkennen":"Pulsierendes, hellrotes Blut (unzuverlässig), Draht oder Katheter im Ultraschall in der Arterie, arterielle Druckkurve über einen Schenkel.","handeln":"Nur Kanüle: entfernen und komprimieren. Dilatator oder Katheter in der Arterie: liegen lassen, verschließen, sofort Gefäßchirurgie oder interventionelle Radiologie."},{"titel":"Blutung, Hämatom und retroperitoneale Blutung","erkennen":"Hämatom an der Einstichstelle, Hb-Abfall, Tachykardie, Hypotonie; retroperitoneal oft ohne sichtbares Hämatom, mit Rücken- oder Flankenschmerz. Bei femoraler Anlage in etwa 0,5 %, besonders nach Punktion oberhalb des Leistenbandes.","handeln":"Antikoagulation stoppen, Volumen und Blutprodukte, CT-Angiographie, Gefäßchirurgie oder interventionelle Radiologie; die Nierenersatztherapie danach ohne systemisches Heparin, z. B. mit regionaler Citratantikoagulation."},{"titel":"Pneumothorax oder Fehllage (jugulär)","erkennen":"Luftnot, SpO2-Abfall, fehlendes Lungengleiten; im Röntgen Spitze im Vorhof, in der V. subclavia oder zu hoch in der V. brachiocephalica.","handeln":"Pneumothorax nach Größe und Klinik behandeln. Fehllage vor der Nutzung korrigieren oder Katheter neu anlegen; nicht mit hohen Blutflüssen beginnen."},{"titel":"Systemische Antikoagulation durch Heparin-Lock","erkennen":"Nachblutung an Einstichstellen, unerwartet verlängerte aPTT oder Anstieg von Anti-Xa nach dem Blocken.","handeln":"Exakt das aufgedruckte Füllvolumen langsam injizieren, vor jeder Nutzung den Lock aspirieren und verwerfen; bei Blutungsrisiko nach Hausstandard Citrat 4 % erwägen."},{"titel":"Katheterdysfunktion","erkennen":"Ansaugalarme, niedriger oder schwankender Blutfluss, häufige Filterwechsel.","handeln":"Klemmen und Knicke prüfen, Konnektionen festziehen, Katheter und Patient:in umlagern, Schenkel spülen; Schenkel nur bewusst tauschen (mehr Rezirkulation); Lage prüfen, notfalls über Draht wechseln oder neu anlegen."},{"titel":"Rhythmusstörungen durch den Draht","erkennen":"Extrasystolen, Salven oder VT beim Vorschieben des Drahtes, meist bei zu tiefer Lage.","handeln":"Draht sofort auf etwa 15 cm zurückziehen und festhalten; anhaltende Rhythmusstörung nach ERC-Algorithmus behandeln."}],"nachsorge":["Nutzungsfreigabe erst nach dokumentierter Lagekontrolle: jugulär oder subclavia Röntgen-Thorax vor der ersten Nutzung; femoral genügt die klinische Funktionsprüfung","Vor jedem Anschluss den Lock aus beiden Schenkeln aspirieren und verwerfen, dann Durchgängigkeit durch Spülen prüfen","Dialysekatheter nur für die Nierenersatztherapie nutzen, außer im Notfall; Schenkel deutlich als Dialysezugang kennzeichnen","Nach jeder Behandlung beide Schenkel spülen und mit dem aufgedruckten Füllvolumen neu blocken; Lock-Art und Volumen dokumentieren","Verband, Hub-Pflege und Händedesinfektion wie beim ZVK; keine antibiotischen Salben","Indikation täglich prüfen; zeichnet sich eine längere Dialysepflicht ab, frühzeitig getunnelten Katheter oder Shunt planen","Femoraler Katheter: Mobilisation eingeschränkt, Leiste und Durchblutung des Beins täglich kontrollieren"],"abbildung":"seldinger","uebungen":[{"titel":"Rückenschmerz nach femoraler Anlage","patient":{"kurz":"Frau D., 71 J.","alter":71,"geschlecht":"w","gewicht_kg":74,"groesse_cm":165,"vorgeschichte":"Kardiorenales Syndrom bei HFrEF, diuretikarefraktäre Überwässerung, Vorhofflimmern unter Heparin-Perfusor."},"start":{"zeit":"Stunde 0","vitals":{"hf":96,"sys":112,"dia":64,"spo2":94,"af":20,"temp":36.6},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Stunde 3","titel":"Anruf der Pflege","text":"Vor drei Stunden wurde femoral rechts ein Shaldon-Katheter angelegt, im zweiten Versuch. Die CVVHD soll gleich starten. Die Pflege ruft dich: Der Blutdruck ist gefallen, Frau D. klagt über Schmerzen im Rücken rechts.","effekt":{"vitals":{"hf":122,"sys":86,"dia":52},"alarm":"NIBP niedrig"},"weiter":"k2"},{"id":"k2","typ":"info","zeit":"Stunde 3","text":"Was erhebst du, bevor die Dialyse beginnt?","optionen":[{"id":"o1","label":"Leiste und Verband ansehen","ergebnis":"Verband trocken, kleines Hämatom an der Einstichstelle, Leiste weich, Fußpulse tastbar."},{"id":"o2","label":"Labor: Blutgasanalyse, Blutbild, Gerinnung","ergebnis":"Hb 8,1 g/dl (vor der Anlage 11,4 g/dl), aPTT 74 s unter Heparin, Laktat 2,6 mmol/l, Kalium 5,9 mmol/l."},{"id":"o3","label":"Anlageprotokoll lesen","ergebnis":"Erster Versuch ohne Ultraschall, Punktion hoch in der Leiste, kurz hellrotes Blut, Nadel entfernt, 5 Minuten komprimiert. Zweiter Versuch ultraschallgesteuert, venös.","q":["clark14"]},{"id":"o4","label":"Bauch und Flanke untersuchen","ergebnis":"Rechte Flanke druckschmerzhaft, Bauch weich, keine Abwehrspannung."},{"id":"o5","label":"Funktion des Shaldon prüfen","ergebnis":"Beide Schenkel gut aspirierbar, dunkles venöses Blut."}],"pflicht":["o2","o3"],"weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Stunde 3","frage":"Wie gehst du vor?","optionen":[{"id":"a1","text":"Verdacht auf retroperitoneale Blutung: Heparin stoppen, Volumen und Blutprodukte, CT-Angiographie, Gefäßchirurgie oder interventionelle Radiologie informieren","bewertung":"richtig","feedback":"Richtig. Hb-Abfall, Hypotonie und Flankenschmerz nach hoher Leistenpunktion mit arteriellem Rückfluss sprechen für eine retroperitoneale Blutung. Ein Kalium von 5,9 mmol/l lässt Zeit, die Blutung zuerst zu klären.","q":["clark14"],"weiter":"k4"},{"id":"a2","text":"Kristalloide geben und die CVVHD wie geplant mit Heparin starten","bewertung":"falsch","feedback":"Gefährlich. Die Zeichen sprechen für eine aktive Blutung. Zusätzliches Heparin im Kreislauf und ein Volumenentzug verschlechtern die Lage.","weiter":"k5"},{"id":"a3","text":"Shaldon sofort ziehen und die Leiste 15 Minuten komprimieren","bewertung":"falsch","feedback":"Löst das Problem nicht. Die wahrscheinliche Quelle ist die arterielle Fehlpunktion oberhalb des Leistenbandes; sie blutet ins Retroperitoneum und ist von außen nicht komprimierbar. Das Ziehen kostet nur den Zugang. Das Team entscheidet sich für die Bildgebung.","weiter":"k4"}],"weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Stunde 5","effekt":{"vitals":{"hf":104,"sys":104,"dia":60}},"frage":"Die CT-Angiographie zeigt ein retroperitoneales Hämatom mit Blutung aus einem Seitenast der A. iliaca externa; die interventionelle Radiologie embolisiert erfolgreich, Frau D. erhält zwei Erythrozytenkonzentrate. Wie geht es mit der Nierenersatztherapie weiter?","optionen":[{"id":"m1","text":"CVVHD mit regionaler Citratantikoagulation statt systemischem Heparin","richtig":true,"feedback":"Ja. KDIGO schlägt bei erhöhtem Blutungsrisiko die regionale Citratantikoagulation für die CRRT vor."},{"id":"m2","text":"Den gut funktionierenden femoralen Shaldon weiter nutzen","richtig":true,"feedback":"Ja. Der Katheter selbst liegt venös und funktioniert; eine Neuanlage brächte neue Risiken."},{"id":"m3","text":"Nach Hausstandard den Lock eher mit Citrat 4 % statt Heparin setzen","richtig":true,"feedback":"Ja, naheliegend. Heparin aus dem Lock tritt messbar in den Kreislauf über; bei frischer Blutung spricht das für Citrat."},{"id":"m4","text":"Hb und Kreislauf engmaschig kontrollieren, Antikoagulation des Vorhofflimmerns erst nach Rücksprache wieder aufnehmen","richtig":true,"feedback":"Ja. Die Wiederaufnahme ist eine gemeinsame Abwägung von Blutungs- und Schlaganfallrisiko."},{"id":"m5","text":"Zusätzlich einen zweiten Shaldon jugulär als Reserve anlegen","richtig":false,"feedback":"Nein. Ein Reservekatheter bringt nur zusätzliche Punktions- und Infektionsrisiken."},{"id":"m6","text":"Heparin-Perfusor sofort in voller Dosis neu starten, wegen des Schlaganfallrisikos","richtig":false,"feedback":"Nein. Erst nach gesicherter Blutstillung und gemeinsamer Abwägung."}],"weiter":"k7"},{"id":"k5","typ":"text","zeit":"Stunde 4","titel":"Vierzig Minuten später","text":"Die CVVHD läuft mit Heparin. Frau D. ist somnolent und kaltschweißig, der Blutdruck fällt trotz 1.500 ml Volumen weiter.","effekt":{"vitals":{"hf":138,"sys":68,"dia":38,"spo2":90,"af":28},"alarm":"NIBP niedrig"},"weiter":"k6"},{"id":"k6","typ":"wahl","zeit":"Stunde 4","frage":"Was tust du jetzt?","optionen":[{"id":"b1","text":"Dialyse und Heparin stoppen, Notfalltransfusion, Oberärzt:in, sofort CT-Angiographie oder direkt Intervention","bewertung":"richtig","feedback":"Richtig, jetzt ohne Zeitverlust. Der hämorrhagische Schock hat Vorrang vor der Nierenersatztherapie.","effekt":{"vitals":{"hf":124,"sys":82,"dia":48}}},{"id":"b2","text":"Noradrenalin starten und den Entzug an der Maschine reduzieren","bewertung":"falsch","feedback":"Nein. Damit wird die Blutung kaschiert, nicht behandelt; Heparin im Kreislauf hält sie in Gang."}],"weiter":"k8"},{"id":"k7","typ":"ende","titel":"Blutung früh erkannt","text":"Frau D. stabilisiert sich, die CVVHD läuft am nächsten Morgen mit Citratantikoagulation über den bestehenden Katheter.","lernpunkte":["Hypotonie, Hb-Abfall und Rücken- oder Flankenschmerz nach femoraler Anlage: an eine retroperitoneale Blutung denken, auch ohne sichtbares Hämatom.","Femoral unterhalb des Leistenbandes und immer ultraschallgesteuert punktieren.","Bei Blutung die Nierenersatztherapie ohne systemisches Heparin planen, z. B. mit regionaler Citratantikoagulation."]},{"id":"k8","typ":"ende","titel":"Blutung spät erkannt","text":"Frau D. braucht eine Massivtransfusion und eine notfallmäßige Embolisation. Die Dialyse beginnt erst am Folgetag.","lernpunkte":["Vor dem Start einer Dialyse mit Antikoagulation eine Blutung als Ursache neuer Hypotonie ausschließen.","Ein Anlageprotokoll mit arteriellem Rückfluss ist ein Warnsignal und gehört in die Übergabe.","Katecholamine überdecken einen Volumenmangel durch Blutung, sie behandeln ihn nicht."]}]},{"titel":"Breitkomplextachykardie beim Drahtvorschub","patient":{"kurz":"Herr B., 58 J.","alter":58,"geschlecht":"m","gewicht_kg":92,"groesse_cm":181,"vorgeschichte":"Kardiogener Schock nach Hinterwandinfarkt, Oligurie, Kalium 6,3 mmol/l, metabolische Azidose; CVVHD geplant."},"start":{"zeit":"Minute 0","vitals":{"hf":102,"sys":98,"dia":60,"spo2":95,"af":22,"temp":37.1},"rhythmus":"sinus_tachy"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Anlage rechts jugulär","text":"Die Punktion der V. jugularis interna rechts gelingt ultraschallgesteuert auf Anhieb. Der Kollege schiebt den Draht zügig vor, die 40-cm-Markierung ist fast an der Kanüle.","weiter":"k2"},{"id":"k2","typ":"wahl","zeit":"Minute 1","effekt":{"vitals":{"hf":168,"sys":82,"dia":50},"rhythmus":"vt","alarm":"VT"},"frage":"Der Monitor zeigt eine Breitkomplextachykardie mit 168/min, Herr B. ist ansprechbar. Was tust du?","optionen":[{"id":"a1","text":"Den Kollegen bitten, den Draht sofort auf etwa 15 cm zurückzuziehen und festzuhalten","bewertung":"richtig","feedback":"Richtig. Die Ursache ist mechanisch: Die Drahtspitze reizt das Myokard. Zurückziehen beendet die Tachykardie meist sofort.","q":["clark16"]},{"id":"a2","text":"Amiodaron i. v. vorbereiten lassen","bewertung":"falsch","feedback":"Nicht als erstes. Erst die mechanische Ursache beseitigen; ein Antiarrhythmikum nur, wenn die Tachykardie danach anhält."},{"id":"a3","text":"Sofort synchronisiert kardiovertieren","bewertung":"falsch","feedback":"Bei erhaltenem Kreislauf und klar mechanischer Ursache nicht der erste Schritt. Ohne Zurückziehen des Drahtes käme die Tachykardie wieder."},{"id":"a4","text":"Draht ganz entfernen und neu punktieren","bewertung":"akzeptabel","feedback":"Beendet die Rhythmusstörung auch, kostet aber den Zugang und eine weitere Punktion; Zurückziehen reicht."}],"weiter":"k3"},{"id":"k3","typ":"text","zeit":"Minute 2","titel":"Draht zurückgezogen","effekt":{"vitals":{"hf":108,"sys":96,"dia":58},"rhythmus":"sinus_tachy"},"text":"Mit dem Zurückziehen endet die Tachykardie. Die venöse Drahtlage wird im Längsschnitt bestätigt, dilatiert und ein 15-cm-Katheter eingeführt. Beide Schenkel lassen sich leicht aspirieren und spülen.","weiter":"k4"},{"id":"k4","typ":"zahl","zeit":"Minute 12","frage":"Auf dem arteriellen (roten) Schenkel steht „1,4 ml“. Wie viel Lock-Lösung gibst du in diesen Schenkel?","einheit":"ml","min":0,"max":5,"schritt":0.1,"start":0,"zielbereich":[1.3,1.5],"feedback_ok":"Richtig: das aufgedruckte Füllvolumen, langsam injiziert. Auch dann tritt ein Teil an der Spitze aus; deshalb wird der Lock vor jeder Nutzung aspiriert.","feedback_zu_niedrig":"Zu wenig. Die Katheterspitze bleibt ungeschützt, Blut gerinnt im Lumen, und der Schenkel ist beim nächsten Anschluss verschlossen.","feedback_zu_hoch":"Zu viel. Was über das Füllvolumen hinausgeht, gelangt in den Kreislauf: Heparin wirkt dann systemisch gerinnungshemmend, Citrat bindet Calcium.","weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 40","frage":"Was muss erfüllt sein, bevor die Dialysepflege Herrn B. an die CVVHD anschließt?","optionen":[{"id":"m1","text":"Röntgen-Thorax: Spitze am Übergang der V. cava superior zum rechten Vorhof, kein Pneumothorax","richtig":true,"feedback":"Ja. KDIGO empfiehlt das Röntgen nach jugulärer Anlage vor der ersten Nutzung (1B)."},{"id":"m2","text":"Lock aus beiden Schenkeln aspirieren und verwerfen","richtig":true,"feedback":"Ja. Sonst landet der gesamte Lock als Bolus im Patienten."},{"id":"m3","text":"Beide Schenkel leicht aspirier- und spülbar","richtig":true,"feedback":"Ja. Schlechte Aspiration kündigt Flussprobleme an."},{"id":"m4","text":"Dokumentation von Ort, Länge, Lock-Art und Volumen je Schenkel sowie ärztliche Freigabe","richtig":true,"feedback":"Ja. Ohne diese Angaben kann die Pflege den Lock nicht sicher handhaben."},{"id":"m5","text":"Röntgen nur, wenn Herr B. Luftnot bekommt","richtig":false,"feedback":"Nein. Fehllage oder Pneumothorax können symptomlos sein, und hohe Blutflüsse mit Antikoagulation verzeihen keine Fehllage."},{"id":"m6","text":"Den venösen Schenkel bis zum Start für Noradrenalin nutzen","richtig":false,"feedback":"Nein. Dialysekatheter dienen außer im Notfall nur der Nierenersatztherapie. Beim Umstecken bricht die Noradrenalinzufuhr ab, oder das Noradrenalin im Lumen wird als Bolus gespült."}],"weiter":"k6"},{"id":"k6","typ":"ende","titel":"Katheter freigegeben","text":"Das Röntgen zeigt eine regelrechte Lage ohne Pneumothorax. Nach Aspiration des Locks startet die CVVHD mit gutem Fluss.","lernpunkte":["Draht nicht tiefer als etwa 20 cm vorschieben; bei Rhythmusstörungen zuerst zurückziehen.","Lock immer mit dem aufgedruckten Füllvolumen je Schenkel setzen und vor jeder Nutzung aspirieren.","Jugulärer Shaldon: Röntgen vor der ersten Nutzung, dann dokumentierte Freigabe.","Den Dialysekatheter außer im Notfall nicht für Infusionen nutzen."]}]}]},{"id":"prozedur-zvk","typ":"prozedur","titel":"ZVK-Anlage","untertitel":"Ultraschallgesteuert über die V. jugularis interna, Seldinger-Technik","gruppe":"Prozeduren","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Material und maximale Barrieremaßnahmen für eine ZVK-Anlage vollständig und steril vorbereiten","Die Schritte der Seldinger-Technik in richtiger Reihenfolge benennen und jeweils begründen","Die Sicherheitskontrollen vor der Dilatation und nach der Anlage erklären: venöse Drahtlage, Spitzenlage, Pneumothorax","Arterielle Fehlkanülierung, Luftembolie und drahtbedingte Rhythmusstörungen erkennen und erste Maßnahmen einleiten"],"quellen":[{"id":"krinko1","kurz":"KRINKO 2017, Teil 1","titel":"Prävention von Infektionen, die von Gefäßkathetern ausgehen. Teil 1: Nichtgetunnelte zentralvenöse Katheter. Bundesgesundheitsbl 2017;60:171–206","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1.pdf?__blob=publicationFile&v=3","stand":"2017"},{"id":"krinko_err","kurz":"KRINKO Erratum 2018","titel":"Erratum zu Teil 1: Evidenzkategorien der Hautantiseptik vor ZVK-Anlage (CHX 2 % Kat. IB, Octenidin 0,1 % Kat. II). Bundesgesundheitsbl 2018;61:446","url":"https://www.rki.de/DE/Themen/Infektionskrankheiten/Krankenhaushygiene/KRINKO/Empfehlungen-der-KRINKO/Device-assoziierte-postoperative-Infektionen/Downloads/Gefaesskath_Inf_Teil1_Erratum.pdf?__blob=publicationFile&v=1","stand":"2018"},{"id":"nice","kurz":"NICE TA49","titel":"Guidance on the use of ultrasound locating devices for placing central venous catheters (Technology Appraisal 49)","url":"https://www.nice.org.uk/guidance/ta49","stand":"2002"},{"id":"perseus","kurz":"ESAIC PERSEUS 2020","titel":"Lamperti M et al. European Society of Anaesthesiology guidelines on peri-operative use of ultrasound-guided for vascular access (PERSEUS vascular access). Eur J Anaesthesiol 2020;37:344–376","url":"https://doi.org/10.1097/EJA.0000000000001180","stand":"2020"},{"id":"asa","kurz":"ASA 2020","titel":"Practice Guidelines for Central Venous Access 2020. An Updated Report by the American Society of Anesthesiologists Task Force on Central Venous Access. Anesthesiology 2020;132:8–43","url":"https://doi.org/10.1097/ALN.0000000000002864","stand":"2020"},{"id":"smit","kurz":"Smit 2018","titel":"Smit JM et al. Bedside ultrasound to detect central venous catheter misplacement and associated iatrogenic complications: a systematic review and meta-analysis. Crit Care 2018;22:65","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5851097/","stand":"2018"},{"id":"gullo","kurz":"Gullo 2022","titel":"Gullo G, Qanadli SD. ECG-based techniques to optimize peripherally inserted central catheters: rationale for tip positioning and practical use. Front Cardiovasc Med 2022;9:765935","url":"https://doi.org/10.3389/fcvm.2022.765935","stand":"2022"},{"id":"clark16","kurz":"Clark 2016","titel":"Clark E et al. Practical aspects of nontunneled and tunneled hemodialysis catheters. Can J Kidney Health Dis 2016;3:2054358116669128 (Drahtvorschub über 20 cm als typischer Fehler)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5332079/","stand":"2016"},{"id":"xylocain","kurz":"Fachinfo Xylocain 1 %/2 %","titel":"Fachinformation Xylocain 1 %/2 % Injektionslösung (Lidocainhydrochlorid), Abschnitte 4.2 bis 4.4","url":"https://www.fachinfo.de/pdf/004674","stand":"Juli 2022"},{"id":"khan","kurz":"Khan 2013","titel":"Khan H, Zaidi A. Paradoxical air embolism following central venous catheter removal. BMJ Case Rep 2013","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3794207/","stand":"2013"},{"id":"bts","kurz":"BTS Sauerstoff, Anhang 4","titel":"BTS Guideline for oxygen use in adults in healthcare and emergency settings, Web Appendix 4: Local oxygen policy template","url":"https://www.brit-thoracic.org.uk/document-library/guidelines/emergency-oxygen/web-appendix-4-local-oxygen-policy-template","stand":"2017"},{"id":"nejm_zvk","kurz":"NEJM-Video 2010","titel":"Ortega R et al. Videos in Clinical Medicine: Ultrasound-guided internal jugular vein cannulation. N Engl J Med 2010;362:e57 (nur weiterführender Link)","url":"https://doi.org/10.1056/NEJMvcm0810156","stand":"2010"}],"moderation":"Impulsfragen:\n1. Warum reichen Blutfarbe und fehlende Pulsation nicht als Beleg für eine venöse Lage, und was prüfst du stattdessen vor dem Dilatieren?\n2. Was ist am Hals gefährlicher: eine Kanüle oder ein Dilatator in der A. carotis? Was folgt daraus für das Vorgehen?\n3. Die Patientin ist orthopnoisch und kann nicht flach liegen. Wie senkst du trotzdem das Risiko einer Luftembolie?\n4. Welche Aufgaben übernimmst du als PJ-Studierende:r in der Assistenz, ohne das sterile Feld zu gefährden?\nStolperstellen: Draht zu tief vorgeschoben (Extrasystolen, VT) oder beim Vorschieben des Katheters losgelassen (Drahtverlust).","indikationen":["Gabe venenreizender oder hochkonzentrierter Medikamente, z. B. Katecholamine in höherer Dosis oder über längere Zeit, konzentrierte Kalium- oder Glukoselösungen","Mehrere parallel laufende, teils inkompatible Infusionen bei unzureichendem peripherem Zugang","Parenterale Ernährung mit hoher Osmolarität","Messung von zentralvenösem Druck und zentralvenöser Sättigung (ScvO2) als Verlaufsparameter"],"kontraindikationen":["Absolut für den gewählten Ort: Thrombose der Zielvene sowie Infektion oder Verbrennung im Punktionsgebiet; dann einen anderen Zugangsweg wählen.","Relativ: schwere Gerinnungsstörung, Thrombozytopenie oder laufende Antikoagulation, fehlende Kooperation, Tracheostoma (V. jugularis dann möglichst meiden) und ungünstige Anatomie im Vorab-Ultraschall."],"vorbereitung":["Indikation prüfen, Zugangsweg festlegen (hier Standard: V. jugularis interna rechts) und Lumenzahl begründen; Mehrlumenkatheter nur bei echtem Bedarf","Aufklärung und Einwilligung dokumentieren; im Notfall nach mutmaßlichem Willen handeln","Gerinnung, Thrombozyten und laufende Antikoagulation prüfen; Allergien gegen Chlorhexidin, Lokalanästhetika und Pflaster erfragen","Vorab-Ultraschall vor dem Abdecken: Vene offen und komprimierbar, kein Thrombus, Lage zur A. carotis, Weite bei Atmung","Monitoring mit EKG und SpO2, sicherer Zugang für Notfallmedikamente, Sauerstoff griffbereit","Lagerung: Rückenlage, wenn vertretbar Kopftieflage, Kopf nur leicht zur Gegenseite drehen","Assistenz einplanen (Pflege oder PJ), Checkliste nutzen, Material vollständig bereitlegen, bevor sich jemand steril anzieht"],"material":{"benoetigt":[{"text":"OP-Haube, Mund-Nasen-Schutz, steriler langärmeliger Kittel, sterile Handschuhe","warum":"Maximale Barrierevorkehrungen sind bei der ZVK-Anlage empfohlen (KRINKO Kat. IB), weil Draht und Katheter sonst leicht kontaminiert werden."},{"text":"Großes steriles Lochtuch, das den gesamten Aktionsradius des Drahtes abdeckt","warum":"Der Seldinger-Draht ist lang und schwingt beim Hantieren über die Punktionsstelle hinaus; ein kleines Tuch schützt ihn nicht."},{"text":"Alkoholisches Hautantiseptikum mit Chlorhexidin 2 % oder Octenidin 0,1 %","warum":"Von der KRINKO empfohlen (CHX Kat. IB, Octenidin Kat. II, beide gleichermaßen geeignet); wirksam nur nach Einwirkzeit laut Hersteller."},{"text":"Ultraschallgerät mit Linearschallkopf und sterilem Überzug für Schallkopf und Kabel","warum":"Echtzeit-Ultraschall ist an der V. jugularis interna Standard und senkt Fehlpunktionen; der Überzug hält Schallkopf und Kabel im sterilen Feld."},{"text":"ZVK-Set: Punktionskanüle mit Spritze, Seldinger-Draht mit J-Spitze, Skalpell, Dilatator, mehrlumiger Katheter","warum":"Grundausstattung der Seldinger-Technik; die J-Spitze gleitet atraumatisch durch das Gefäß."},{"text":"Lokalanästhetikum, z. B. Lidocain 1 %, mit Spritze und dünner Kanüle","warum":"Für Haut und Stichkanal reichen meist 2 bis 5 ml (20 bis 50 mg). Laut Fachinformation höchstens 300 mg ohne Vasokonstriktor; bei Herzinsuffizienz und Leitungsstörungen Dosis reduzieren."},{"text":"Sterile NaCl 0,9 % in Spülspritzen, mindestens 10 ml pro Lumen","warum":"Zum Füllen vor der Anlage und zum Spülen danach; die KRINKO empfiehlt Spülen und Blocken mit mindestens 10 ml NaCl 0,9 % ohne Heparin (Kat. II)."},{"text":"Sterile Verschlussstopfen oder Dreiwegehähne für jedes Lumen","warum":"Jedes offene Lumen kann Luft ansaugen; Verschlüsse müssen steril sein und dürfen nicht wiederverwendet werden."},{"text":"Nahtmaterial oder nahtfreies Fixiersystem und steriler Transparentverband","warum":"Sichere Fixierung verhindert Dislokation; der Transparentverband erlaubt die tägliche Inspektion der Eintrittsstelle."},{"text":"Adapter für intrakardiales EKG, sofern im Haus etabliert","warum":"Erlaubt die Kontrolle der Spitzenlage schon während der Anlage über die Veränderung der P-Welle."}],"ablenker":[{"text":"Ultraschallgel aus der unsterilen Stationsflasche im Punktionsfeld","warum_nicht":"Kontaminiert Nadel und Punktionsstelle. Braucht man direkt an der Punktionsstelle ein Schallleitungsmedium, empfiehlt die KRINKO alkoholisches Hautantiseptikum statt Gel."},{"text":"Heparinhaltige Blocklösung für alle Lumen","warum_nicht":"Nichtgetunnelte ZVK werden mit NaCl 0,9 % ohne Heparin gespült und geblockt (KRINKO Kat. II); Heparin nur im begründeten Ausnahmefall als Fertiglösung."},{"text":"Routinemäßige i. v. Antibiotikaprophylaxe vor der Punktion","warum_nicht":"Wird nicht empfohlen (ASA 2020). Infektionsschutz entsteht durch Händedesinfektion, Barriere und Hautantiseptik."},{"text":"Kleines Abdecktuch nur um die Punktionsstelle","warum_nicht":"Deckt den Bewegungsradius des Drahtes nicht ab; gefordert ist ein großzügig dimensioniertes Lochtuch."},{"text":"Akustischer Doppler-Stift zur Gefäßsuche","warum_nicht":"Ersetzt die zweidimensionale Echtzeit-Darstellung nicht; NICE rät von audio-gesteuertem Doppler für die ZVK-Anlage ausdrücklich ab."}]},"schritte":[{"text":"Team-Time-out: Patient:in, Indikation, Seite, Gerinnung, Allergien; Assistenz und Aufgaben festlegen","warum":"Eine standardisierte Checkliste mit fester Assistenz verringert Fehler und klärt, wer Material ins sterile Feld anreicht.","q":["asa","krinko1"]},{"text":"Vorab-Ultraschall beidseits: Vene offen und komprimierbar, Lage zur A. carotis, Punktionsstelle wählen","warum":"Thrombosen, kleine Venen oder eine direkt über der Arterie liegende Vene fallen vor dem Abdecken auf; ein Seitenwechsel ist dann noch einfach.","q":["asa","perseus"]},{"text":"Lagerung: Kopftieflage, wenn vertretbar; Kopf nur leicht zur Gegenseite drehen","warum":"Die Kopftieflage füllt die Vene und senkt das Risiko einer Luftembolie; starke Kopfdrehung kann die Vene weiter über die Arterie verschieben.","q":["asa"]},{"text":"Haube und Mund-Nasen-Schutz anlegen, hygienische Händedesinfektion, steriler Kittel, sterile Handschuhe","warum":"Maximale Barrierevorkehrungen zusätzlich zur Händedesinfektion senken das Infektionsrisiko (KRINKO Kat. IB).","q":["krinko1"]},{"text":"Großflächige Hautantiseptik mit alkoholischem CHX- oder Octenidin-Präparat, Einwirkzeit abwarten","warum":"Das Antiseptikum wirkt nur nach vollständiger Einwirkzeit; die Fläche muss mindestens den Ausschnitt des Lochtuchs abdecken.","q":["krinko1","krinko_err"]},{"text":"Großes steriles Lochtuch auflegen, Schallkopf mit Kabel in den sterilen Überzug einbringen","warum":"Der Schallkopf kommt mit Nadel und Draht in Kontakt; Schallkopf und Kabel brauchen deshalb eine sterile Ummantelung.","q":["krinko1"]},{"text":"Set vorbereiten: alle Lumen mit NaCl 0,9 % füllen, Nebenlumen verschließen, distales Lumen für den Draht offen lassen","warum":"Gefüllte Lumen enthalten keine Luft, und der Draht tritt nur über das distale Lumen aus.","q":["krinko1"]},{"text":"Lokalanästhesie von Haut und Stichkanal unter Aspiration, meist 2 bis 5 ml Lidocain 1 %","warum":"Wer schmerzfrei ist, hält still. Aspiration vor der Injektion verhindert eine intravasale Gabe; die Höchstdosis laut Fachinformation liegt weit darüber.","q":["xylocain"]},{"text":"Vene unter Echtzeit-Ultraschall mit aufgesetzter Spritze punktieren, Nadelspitze ständig darstellen","warum":"Echtzeit-Führung senkt arterielle Fehlpunktionen und Mehrfachpunktionen; wer die Nadelspitze verliert, sticht blind.","q":["nice","perseus","asa"]},{"text":"Spritze abnehmen, Kanüle fixieren, Draht mit J-Spitze widerstandsfrei vorschieben, nicht tiefer als etwa 20 cm, EKG beobachten","warum":"Ein zu tief liegender Draht reizt Vorhof oder Ventrikel und löst Extrasystolen bis VT aus. Bei Widerstand nie mit Kraft weiterschieben.","q":["clark16"]},{"text":"Venöse Lage des Drahtes im Ultraschall in Quer- und Längsachse bestätigen, erst dann dilatieren","warum":"Blutfarbe und fehlende Pulsation sind nicht verlässlich; ein Dilatator in der A. carotis ist eine schwere, vermeidbare Komplikation.","q":["asa"]},{"text":"Stichinzision am Draht, Dilatator nur so tief wie nötig vorschieben, Draht dabei festhalten und auf freie Beweglichkeit prüfen","warum":"Zu tiefes Dilatieren gefährdet Gefäßwand und Pleura; ein nicht mehr frei beweglicher Draht ist abgeknickt und muss geprüft werden.","q":["asa"]},{"text":"Katheter über den Draht einführen: Draht muss am distalen Lumen herausschauen und festgehalten werden, bevor der Katheter die Haut erreicht","warum":"So bleibt der Draht jederzeit unter Kontrolle und kann nicht ins Gefäß verschwinden.","q":["asa"]},{"text":"Draht entfernen, distales Lumen sofort verschließen, Draht vollständig und intakt vorzeigen","warum":"Ein offenes Lumen saugt bei Inspiration Luft an. Fehlt der Draht, muss er sofort gesucht werden (Röntgen).","q":["asa","khan"]},{"text":"Jedes Lumen aspirieren und spülen; Spitzenlage mit intrakardialem EKG oder Ultraschall bestimmen und Tiefe anpassen","warum":"Freie Aspiration zeigt die intravasale Lage aller Lumen. Das P-Wellen-Maximum markiert den cavoatrialen Übergang; die Spitze soll nicht tief im Vorhof liegen.","q":["krinko1","gullo","smit"]},{"text":"Fixieren, steriler Transparentverband, Pneumothorax ausschließen (Lungensono oder Röntgen nach Hausstandard), dokumentieren","warum":"Freigabe erst nach Lagebestätigung und Ausschluss eines Pneumothorax; dokumentiert werden Seite, Tiefe an der Haut, Lagekontrolle und Datum.","q":["smit","krinko1","asa"]}],"komplikationen":[{"titel":"Arterielle Fehlpunktion oder Fehlkanülierung (A. carotis)","erkennen":"Hellrotes, pulsierendes Blut ist ein Hinweis, aber unzuverlässig (Schock, Hypoxie, hoher ZVD). Sicherer: Draht oder Katheter im Ultraschall in der Arterie, arterielle Druckkurve über ein Lumen, BGA-Vergleich.","handeln":"Nur Kanüle in der Arterie: entfernen und einige Minuten komprimieren, ohne die Halsgefäße zu verschließen. Dilatator oder Katheter in der Arterie: liegen lassen, verschließen, als arteriell kennzeichnen, sofort Gefäßchirurgie oder interventionelle Radiologie hinzuziehen."},{"titel":"Pneumothorax","erkennen":"Luftnot, Husten, SpO2-Abfall, einseitig abgeschwächtes Atemgeräusch; im Ultraschall fehlendes Lungengleiten; beim Spannungspneumothorax zusätzlich Hypotonie und Tachykardie.","handeln":"Sauerstoff, Oberärzt:in informieren, Ultraschall oder Röntgen; Drainage je nach Größe und Klinik; Spannungspneumothorax sofort entlasten."},{"titel":"Luftembolie","erkennen":"Plötzliche Luftnot, Unruhe, SpO2-Abfall, Tachykardie, Hypotonie bis Kreislaufstillstand; typischer Moment: offenes Lumen, Diskonnektion oder Entfernung im Sitzen.","handeln":"Eintrittsstelle sofort luftdicht verschließen, Kopftief-Linksseitenlage, 100 % Sauerstoff, Luft über den liegenden Katheter aspirieren, bei Kreislaufstillstand Reanimation; danach neurologisch untersuchen."},{"titel":"Rhythmusstörungen durch Draht oder Katheter","erkennen":"Extrasystolen, Salven oder VT am Monitor, zeitlich passend zum Vorschieben von Draht oder Katheter.","handeln":"Draht oder Katheter sofort zurückziehen; die Störung endet meist sofort. Hält sie an oder ist der Kreislauf beeinträchtigt, nach ERC-Algorithmus behandeln."},{"titel":"Fehllage der Katheterspitze","erkennen":"Kein typischer P-Wellen-Anstieg im intrakardialen EKG, Lumen schlecht aspirierbar, im Röntgen Spitze in V. subclavia, Gegenseite oder tief im Vorhof.","handeln":"Vor der Nutzung korrigieren (zurückziehen) oder neu anlegen; über eine unklar liegende Spitze keine Katecholamine oder venenreizenden Lösungen geben."},{"titel":"Blutung und Hämatom","erkennen":"Schwellung am Hals, Nachblutung unter dem Verband; bei großem Hämatom Schluckstörung, Heiserkeit oder Stridor.","handeln":"Gezielt komprimieren, Gerinnung und Antikoagulation prüfen; bei Atemwegsgefahr früh Anästhesie zur Atemwegssicherung rufen, Gefäßchirurgie hinzuziehen."}],"nachsorge":["Nutzung erst nach dokumentierter Freigabe: Lage bestätigt (intrakardiales EKG, Ultraschall oder Röntgen nach Hausstandard) und Pneumothorax ausgeschlossen","Indikation täglich in der Visite prüfen und dokumentieren; nicht mehr benötigte ZVK sofort entfernen","Verband: Gaze täglich palpieren und mindestens alle 72 h wechseln, Transparentverband bis zu 7 Tage; durchfeuchtete, verschmutzte oder gelöste Verbände sofort erneuern","Vor jeder Manipulation an Hub, Dreiwegehahn oder Konnektor: hygienische Händedesinfektion und Desinfektion des Konnektors","Infusionssysteme ohne Lipide oder Blut nicht häufiger als alle 96 h wechseln, mit Lipiden mindestens alle 24 h, nach Blutprodukten nach 6 h","Kein routinemäßiger Wechsel nach fester Liegedauer; im Notfall ohne volle Barriere gelegte ZVK möglichst innerhalb von 24 h ersetzen","Entfernung in flacher Rückenlage oder Kopftieflage, bei Spontanatmung in Ausatmung oder unter Pressen, danach luftdichter Verband"],"abbildung":"seldinger","uebungen":[{"titel":"Hellrotes Blut aus allen Lumen","patient":{"kurz":"Herr M., 67 J.","alter":67,"geschlecht":"m","gewicht_kg":84,"groesse_cm":176,"vorgeschichte":"Vorderwandinfarkt mit PCI vor 6 h, kardiogener Schock, Noradrenalin über peripheren Zugang; ASS, Ticagrelor und Heparin-Perfusor."},"start":{"zeit":"Minute 0","vitals":{"hf":104,"sys":94,"dia":58,"spo2":95,"af":20,"temp":36.9},"rhythmus":"sinus_tachy"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Die Situation","text":"Du assistierst Dr. S. bei der ZVK-Anlage rechts jugulär. Die Vene war im Ultraschall klein und kollabierte bei Einatmung, die Punktion gelang im dritten Versuch. Draht, Dilatator und Katheter liefen ohne Widerstand. Beim Aspirieren kommt aus allen drei Lumen hellrotes Blut, die Spritze füllt sich ruckartig von selbst.","moderation":"Frage an die Gruppe: Welche Information fehlt im Ablauf? (Kontrolle der Drahtlage vor der Dilatation.)","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 1","text":"Dr. S. bittet dich, die Lage zu klären. Was veranlasst du?","optionen":[{"id":"o1","label":"Druckaufnehmer an ein Lumen anschließen","ergebnis":"Pulsatile Kurve mit 92/57 mmHg, deckungsgleich mit dem nichtinvasiven Blutdruck. Das ist eine arterielle Kurve.","q":["asa"]},{"id":"o2","label":"Ultraschall in Quer- und Längsachse","ergebnis":"Der Katheter liegt im Lumen der A. carotis communis. Die V. jugularis interna liegt lateral davon, ist klein und komprimierbar.","q":["asa"]},{"id":"o3","label":"Blutgasanalyse aus dem Katheter","ergebnis":"pO2 98 mmHg, sO2 97 % unter 4 l/min Sauerstoff. Spricht deutlich für arterielles Blut; sicher wird es im Vergleich mit Druckkurve und Ultraschall."},{"id":"o4","label":"Hals und Atmung ansehen","ergebnis":"Kein sichtbares Hämatom, kein Stridor, Herr M. spricht in ganzen Sätzen."}],"pflicht":["o1","o2"],"weiter":"k3"},{"id":"k3","typ":"wahl","zeit":"Minute 3","frage":"Ein 7-Fr-Katheter liegt in der A. carotis. Wie geht es weiter?","optionen":[{"id":"a1","text":"Katheter belassen, Lumen verschließen, als arteriell kennzeichnen und sofort Gefäßchirurgie oder interventionelle Radiologie hinzuziehen","bewertung":"richtig","feedback":"Richtig. Ein Dilatator oder großlumiger Katheter in einer Arterie bleibt liegen, bis über eine operative oder interventionelle Entfernung entschieden ist. Unter ASS, Ticagrelor und Heparin wäre die Blutung nach dem Ziehen kaum zu beherrschen.","q":["asa"],"weiter":"k4"},{"id":"a2","text":"Katheter sofort ziehen und 10 Minuten fest komprimieren","bewertung":"falsch","feedback":"Gefährlich. Ein 7-Fr-Loch in der A. carotis lässt sich unter dreifacher Gerinnungshemmung oft nicht sicher abdrücken; es drohen Halshämatom mit Atemwegsverlegung oder eine Ischämie bei zu fester Kompression.","q":["asa"],"weiter":"k6"},{"id":"a3","text":"Katheter liegen lassen und als Zugang für Noradrenalin nutzen, bis die Gefäßchirurgie kommt","bewertung":"falsch","feedback":"Nein. Medikamente oder Luftblasen über einen arteriell liegenden Katheter gelangen direkt in die Hirngefäße. Der Katheter bleibt liegen, wird verschlossen und gekennzeichnet, aber nicht benutzt.","weiter":"k4"}],"weiter":"k4"},{"id":"k4","typ":"mehrfach","zeit":"Minute 5","frage":"Bis die Gefäßchirurgie eintrifft: Was gehört jetzt dazu?","optionen":[{"id":"m1","text":"Neurologischen Status erheben und dokumentieren (Bewusstsein, Sprache, Pupillen, Motorik)","richtig":true,"feedback":"Ja. Ausgangsbefund, falls es zu einer Embolie oder Dissektion kommt."},{"id":"m2","text":"Katheter sicher fixieren und an allen Lumen „arteriell, nicht benutzen“ markieren","richtig":true,"feedback":"Ja. Verhindert versehentliche Injektionen und eine Dislokation."},{"id":"m3","text":"Mit Oberärzt:in und Kardiologie klären, ob der Heparin-Perfusor pausiert wird","richtig":true,"feedback":"Ja. Die Abwägung gegen das frische Stentergebnis trifft das Team gemeinsam."},{"id":"m4","text":"Sofort auf derselben Seite eine neue Punktion der Vene versuchen","richtig":false,"feedback":"Nein. Direkt neben dem arteriell liegenden Katheter steigt das Risiko weiter. Für den zentralen Zugang später Gegenseite oder anderen Ort wählen."},{"id":"m5","text":"Hals und Atemweg überwachen und die Anästhesie vorinformieren","richtig":true,"feedback":"Ja. Ein wachsendes Halshämatom kann die Atemwege verlegen."}],"weiter":"k5"},{"id":"k5","typ":"ende","titel":"Komplikation beherrscht","text":"Die interventionelle Radiologie entfernt den Katheter mit einem Verschlusssystem. Herr M. bleibt neurologisch unauffällig. Der ZVK wird später links jugulär gelegt, diesmal mit Kontrolle der Drahtlage im Längsschnitt vor der Dilatation.","lernpunkte":["Vor jeder Dilatation die venöse Lage des Drahtes im Ultraschall bestätigen; Blutfarbe und Pulsation sind unzuverlässig.","Dilatator oder Katheter in einer Arterie liegen lassen und Gefäßchirurgie oder interventionelle Radiologie hinzuziehen.","Einen arteriell liegenden Katheter nie für Medikamente nutzen und eindeutig kennzeichnen."]},{"id":"k6","typ":"text","zeit":"Minute 8","titel":"Fünf Minuten später","text":"Trotz Kompression schwillt der Hals rechts an. Herr M. wird unruhig, spricht nur noch in kurzen Sätzen, man hört einen inspiratorischen Stridor.","effekt":{"vitals":{"hf":128,"sys":78,"dia":46,"spo2":88,"af":30},"alarm":"SpO2 niedrig"},"weiter":"k7"},{"id":"k7","typ":"wahl","zeit":"Minute 9","frage":"Was hat jetzt Vorrang?","optionen":[{"id":"b1","text":"Anästhesie notfallmäßig zur Atemwegssicherung, Gefäßchirurgie sofort, weiter gezielt komprimieren, Blutprodukte anfordern","bewertung":"richtig","feedback":"Richtig. Der Atemweg ist akut bedroht, und mit wachsendem Hämatom wird die Intubation schwieriger. Die Blutungsquelle muss chirurgisch versorgt werden.","effekt":{"vitals":{"spo2":93,"hf":118}}},{"id":"b2","text":"So fest komprimieren, bis der Carotispuls nicht mehr tastbar ist","bewertung":"falsch","feedback":"Nein. Ein Verschluss der A. carotis riskiert eine zerebrale Ischämie, und das Hämatom wächst trotzdem in die Tiefe."},{"id":"b3","text":"Abwarten und in 15 Minuten neu beurteilen","bewertung":"falsch","feedback":"Nein. Stridor bei wachsendem Halshämatom ist ein Notfall; der Atemweg kann innerhalb von Minuten verloren gehen."}],"weiter":"k8"},{"id":"k8","typ":"ende","titel":"Schwerer Verlauf nach dem Ziehen","text":"Herr M. wird notfallmäßig intubiert, die Gefäßchirurgie versorgt die A. carotis offen. Mit belassenem Katheter wäre dieser Verlauf wahrscheinlich vermeidbar gewesen.","lernpunkte":["Einen großlumigen Katheter in der A. carotis nicht ziehen, besonders nicht unter Plättchenhemmung und Heparin.","Stridor bei Halshämatom heißt: Atemweg sofort durch Erfahrene sichern lassen.","Der eigentliche Schutz vor dieser Komplikation ist die Kontrolle der Drahtlage vor dem Dilatieren."]}]},{"titel":"Plötzliche Luftnot nach Drahtentfernung","patient":{"kurz":"Frau K., 74 J.","alter":74,"geschlecht":"w","gewicht_kg":68,"groesse_cm":163,"vorgeschichte":"Ischämische Kardiomyopathie mit LVEF 25 %, akute Dekompensation mit Orthopnoe, Vorhofflimmern; ZVK für Inotropika geplant."},"start":{"zeit":"Minute 0","vitals":{"hf":98,"sys":104,"dia":66,"spo2":93,"af":24,"temp":36.7},"rhythmus":"vorhofflimmern"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","titel":"Anlage im Halbsitzen","text":"Frau K. toleriert keine Flachlage, deshalb wird der ZVK rechts jugulär mit etwa 30° Oberkörperhochlage angelegt. Nach dem Entfernen des Drahtes dreht sich der Kollege zur Spülspritze, das distale Lumen bleibt offen. Frau K. holt tief Luft, man hört ein schlürfendes Geräusch am Katheter.","weiter":"k2"},{"id":"k2","typ":"wahl","zeit":"Minute 1","effekt":{"vitals":{"hf":132,"sys":78,"dia":48,"spo2":82,"af":34},"alarm":"SpO2 niedrig"},"frage":"Frau K. wird plötzlich unruhig, kaltschweißig und ringt nach Luft. Was tust du zuerst?","optionen":[{"id":"a1","text":"Offenes Lumen sofort verschließen: Daumen auf den Ansatz, dann Verschlussstopfen","bewertung":"richtig","feedback":"Richtig. Zuerst muss der Lufteintritt aufhören; jede weitere Einatmung bei offenem Lumen saugt mehr Luft an.","q":["khan"]},{"id":"a2","text":"Röntgen-Thorax anfordern, um einen Pneumothorax auszuschließen","bewertung":"falsch","feedback":"Nicht als erstes. Der zeitliche Zusammenhang mit dem offenen Lumen spricht für eine Luftembolie; der Lufteintritt muss sofort gestoppt werden."},{"id":"a3","text":"Katheter sofort ganz herausziehen","bewertung":"falsch","feedback":"Nein. Es bleibt ein offener Stichkanal, über den weiter Luft eintreten kann, und du verlierst die Möglichkeit, Luft zu aspirieren.","q":["khan"]}],"weiter":"k3"},{"id":"k3","typ":"mehrfach","zeit":"Minute 2","frage":"Das Lumen ist zu. Welche weiteren Sofortmaßnahmen sind richtig?","optionen":[{"id":"m1","text":"Kopftief-Linksseitenlage, so weit Frau K. das toleriert","richtig":true,"feedback":"Ja. Die Luft soll im rechten Vorhof bleiben und nicht den Ausflusstrakt des rechten Ventrikels verlegen; kurzfristig hat das Vorrang vor der Orthopnoe."},{"id":"m2","text":"100 % Sauerstoff über Maske mit Reservoir","richtig":true,"feedback":"Ja. Ein hoher Sauerstoffanteil behandelt die Hypoxie und beschleunigt die Resorption der Luft."},{"id":"m3","text":"Über das distale Lumen Luft aspirieren","richtig":true,"feedback":"Ja, der Versuch lohnt sich, solange die Katheterspitze zentral liegt."},{"id":"m4","text":"Hilfe rufen und Reanimationsbereitschaft herstellen","richtig":true,"feedback":"Ja. Eine große Luftembolie kann in eine pulslose elektrische Aktivität übergehen."},{"id":"m5","text":"Frau K. ganz aufsetzen, weil sie im Liegen schlechter Luft bekommt","richtig":false,"feedback":"Nein. Im Sitzen sinkt der Venendruck am Hals, bei jeder Undichtigkeit tritt leichter Luft ein; empfohlen ist kurzfristig die Kopftief-Linksseitenlage."},{"id":"m6","text":"Furosemid i. v. wegen der bekannten Stauung","richtig":false,"feedback":"Nicht jetzt. Die akute Verschlechterung ist durch die Luft erklärt; ein Diuretikum ändert daran nichts."}],"weiter":"k4"},{"id":"k4","typ":"zahl","zeit":"Minute 3","frage":"Mit welchem Sauerstofffluss betreibst du die Maske mit Reservoir?","einheit":"l/min","min":0,"max":15,"schritt":1,"start":4,"zielbereich":[10,15],"feedback_ok":"Passt. Nur bei hohem Fluss bleibt der Reservoirbeutel gefüllt; für kritisch Kranke sieht die BTS-Vorlage 15 l/min vor.","feedback_zu_niedrig":"Zu wenig. Der Reservoirbeutel fällt zusammen, die Patientin atmet Raumluft zu, und die Sauerstofffraktion bleibt niedrig.","feedback_zu_hoch":"Mehr als 15 l/min liefert der Wandanschluss meist nicht und bringt keinen Vorteil.","weiter":"k5"},{"id":"k5","typ":"info","zeit":"Minute 8","effekt":{"vitals":{"hf":112,"sys":96,"dia":58,"spo2":91,"af":26}},"text":"Nach Lagerung, Sauerstoff und Aspiration von etwa 15 ml schaumigem Blut stabilisiert sich Frau K. Was prüfst du jetzt?","optionen":[{"id":"i1","label":"Fokussierte Echokardiographie","ergebnis":"Echoreiche Bläschen im rechten Vorhof, rechter Ventrikel leicht erweitert, keine Luft im linken Herzen sichtbar."},{"id":"i2","label":"Neurologischer Kurzstatus","ergebnis":"Wach und orientiert, Sprache klar, keine Halbseitenzeichen, Pupillen gleich weit.","q":["khan"]},{"id":"i3","label":"Katheter und Verschlüsse","ergebnis":"Alle Lumen gut aspirierbar, Verschlüsse fest. Wegen Vorhofflimmerns war das intrakardiale EKG nicht eindeutig, ein Röntgen-Thorax ist angefordert."}],"pflicht":["i2"],"weiter":"k6"},{"id":"k6","typ":"ende","titel":"Luftembolie überstanden","text":"Frau K. erholt sich in den folgenden Stunden. Das Röntgen zeigt eine regelrechte Katheterlage ohne Pneumothorax.","lernpunkte":["Der Moment zwischen Drahtentfernung und Verschluss ist kritisch: Daumen auf den Ansatz, Lumen nie offen lassen.","Ohne Kopftieflage steigt das Risiko; dann besonders sorgfältig verschließen und die Patientin bei offenem System ausatmen oder pressen lassen.","Therapie der Luftembolie: Lufteintritt stoppen, Kopftief-Linksseitenlage, 100 % Sauerstoff, Luft aspirieren, Reanimationsbereitschaft.","Neurologisch nachuntersuchen: Über ein offenes Foramen ovale kann Luft in die Hirngefäße gelangen."]}]}]},{"id":"fall-kardiogener-schock","typ":"fall","titel":"Fall: Blutdruckabfall nach Vorderwandinfarkt","untertitel":"IMC-Aufnahme nach PCI: erkennen, einordnen, behandeln","gruppe":"Schock","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Einen kardiogenen Schock am Gesamtbild aus Klinik, Echo und Laktat erkennen","Den Schweregrad nach SCAI einordnen und die ersten Maßnahmen priorisieren","Noradrenalin als Vasopressor der ersten Wahl begründen und eine Startdosis wählen","Auf Dobutamin-bedingte Rhythmusstörungen sicher reagieren"],"quellen":[{"id":"esc-hf","kurz":"ESC HF 2021","titel":"McDonagh TA et al.: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure. Eur Heart J 2021;42:3599-3726","stand":"2021"},{"id":"scai","kurz":"SCAI 2022","titel":"Naidu SS et al.: SCAI SHOCK Stage Classification Expert Consensus Update. J Am Coll Cardiol 2022;79:933-946","stand":"2022"},{"id":"esc-acs","kurz":"ESC ACS 2023","titel":"Byrne RA et al.: 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J 2023;44:3720-3826","stand":"2023"},{"id":"soap2","kurz":"SOAP II","titel":"De Backer D et al.: Comparison of dopamine and norepinephrine in the treatment of shock. N Engl J Med 2010;362:779-789","stand":"2010"},{"id":"erc","kurz":"ERC ALS 2021","titel":"Soar J et al.: European Resuscitation Council Guidelines 2021: Advanced Life Support. Resuscitation 2021;161:115-151","stand":"2021"}],"moderation":"An jedem Entscheidungspunkt zuerst die Gruppe abstimmen lassen, dann aufdecken. Die Befunde im Info-Schritt bewusst nicht vorlesen, sondern anfordern lassen.","patient":{"kurz":"Herr M., 68 Jahre","alter":68,"geschlecht":"m","gewicht_kg":82,"groesse_cm":178,"vorgeschichte":"Arterielle Hypertonie, Raucher. Vor 3 Stunden Vorderwand-STEMI, PCI und Stent in der LAD (proximal). Aufnahme auf die IMC. Medikation: ASS, Ticagrelor, Heparin im Verlauf."},"start":{"zeit":"Minute 0","vitals":{"hf":112,"sys":84,"dia":54,"spo2":91,"af":26,"temp":36.4},"rhythmus":"sinus_tachy"},"start_knoten":"k1","knoten":[{"id":"k1","typ":"text","zeit":"Minute 0","text":"Du übernimmst Herrn M. von der Herzkatheter-Einheit. Er klagt über zunehmende Luftnot und wirkt unruhig. Am Monitor fällt der Blutdruck, die Herzfrequenz ist hoch. Der Dienstarzt ist kurz im Nachbarzimmer.","weiter":"k2"},{"id":"k2","typ":"info","zeit":"Minute 2","text":"Du hast Zeit für gezielte Untersuchungen. Was brauchst du, um das Bild einzuordnen?","optionen":[{"id":"haut","label":"Haut und Peripherie","ergebnis":"Kühle, marmorierte Extremitäten, Kapillarfül
