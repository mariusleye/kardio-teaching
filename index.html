"Wie erklärst du pO2 36 mmHg und SO2 68 % bei einer SpO2 von 97 %?","optionen":[{"id":"a","text":"Venöse Probe (Fehlpunktion der Vene)","bewertung":"richtig","feedback":"Richtig. Dunkles, nicht pulsierendes Blut aus der Leiste, eine SO2 weit unter der SpO2 und eine wache, eupnoische Patientin sprechen für venöses Blut. Für pO2 und SO2 ist die Probe nicht verwertbar.","q":["byrne-2014","msd-gas"]},{"id":"b","text":"Schwere Hypoxämie: Sauerstoff hoch dosiert und Intubation vorbereiten","bewertung":"falsch","feedback":"Klinik und SpO2 passen nicht zu einem pO2 von 36 mmHg. Der Wert beschreibt venöses Blut. Die Patientin trotzdem anschauen, aber nicht auf diesen Wert hin behandeln.","q":["msd-gas"]},{"id":"c","text":"Das Pulsoxymeter misst falsch hoch","bewertung":"falsch","feedback":"Im Bereich 70 bis 100 % weicht die Pulsoxymetrie um 2 bis 5 % ab, nicht um fast 30 Prozentpunkte. Eine CO-Vergiftung täuscht eine normale SpO2 vor, senkt aber nicht den pO2.","q":["msd-gas"]},{"id":"d","text":"Eine Luftblase in der Spritze","bewertung":"falsch","feedback":"Luft verschiebt den pO2 Richtung Raumluft (etwa 150 mmHg), senkt ihn also nicht.","q":["baird-2013"]}],"weiter":"p3"},{"id":"p3","typ":"zuordnen","frage":"Was kannst du aus einer venösen BGA ablesen?","kategorien":[{"id":"ja","name":"Orientierend verwertbar"},{"id":"teil","name":"Nur eingeschränkt verwertbar"},{"id":"nein","name":"Nicht verwertbar"}],"eintraege":[{"text":"pH","kategorie":"ja","warum":"Gute Übereinstimmung; der arterielle pH liegt im Mittel etwa 0,03 höher (Byrne 2014)."},{"text":"Laktat","kategorie":"ja","warum":"Venöses und arterielles Laktat korrelieren eng; beide sind verwendbar (Andersen 2013)."},{"text":"HCO3⁻","kategorie":"ja","warum":"Bikarbonat lässt sich aus venösem Blut bestimmen (MSD)."},{"text":"pCO2","kategorie":"teil","warum":"Nicht austauschbar mit dem arteriellen Wert. Ein normaler venöser pCO2 macht eine Hyperkapnie unwahrscheinlich, ein erhöhter beweist sie nicht (Cochrane 2025: hohe Sensitivität, geringe Spezifität)."},{"text":"pO2","kategorie":"nein","warum":"Venöses Blut ist für die Oxygenierung ungeeignet; dafür braucht es eine arterielle Probe."},{"text":"SO2 der Probe als Maß der arteriellen Sättigung","kategorie":"nein","warum":"Die venöse Sättigung beschreibt die Sauerstoffausschöpfung, nicht die arterielle Oxygenierung."},{"text":"Horovitz-Quotient","kategorie":"nein","warum":"Er setzt einen arteriellen pO2 voraus."}],"weiter":"p4"},{"id":"p4","typ":"wahl","frage":"Wie bewertest du das Kalium von 6,1 mmol/l?","optionen":[{"id":"a","text":"Pseudohyperkaliämie wahrscheinlich: zügig eine schonend abgenommene Kontrolle ohne Kühlung (BGA sofort messen oder Plasma-Kalium), EKG ist bereits unauffällig","bewertung":"richtig","feedback":"Richtig. Schwierige Punktion mit zäher Aspiration (Hämolyse), Eis und 25 min Verzögerung sind typische Ursachen; Nierenfunktion und EKG sind normal. BGA-Geräte erkennen Hämolyse im Vollblut nicht.","q":["erc-2021","salvagno-2019","smellie-2007","baird-2013"]},{"id":"b","text":"Sofort Insulin-Glukose und Calcium geben","bewertung":"falsch","feedback":"Bei normalem EKG und normaler Nierenfunktion wird der Wert erst gesichert; Insulin-Glukose birgt ein Hypoglykämierisiko. Bestätigt sich die Hyperkaliämie, wird nach Algorithmus behandelt.","q":["erc-2021"]},{"id":"c","text":"Wert ignorieren, er ist sicher falsch","bewertung":"falsch","feedback":"Wahrscheinlich falsch ist nicht sicher falsch. Eine Kontrolle ist Pflicht.","q":["smellie-2007"]}],"weiter":"p5"},{"id":"p5","typ":"ende","titel":"Probe als Fehlerquelle erkannt","text":"Die Probe war venös und durch Hämolyse und Kühlung verfälscht. Eine arterielle BGA ist bei Frau D. nur nötig, wenn die Oxygenierung oder der pCO2 exakt gebraucht werden; das Kalium wird schonend kontrolliert.","lernpunkte":["SO2 der Probe gegen SpO2 prüfen: Ein großer Unterschied spricht für eine venöse Probe oder Mischblut.","Venöse BGA: pH, Laktat und HCO3⁻ orientierend; pCO2 nur zum Ausschluss einer Hyperkapnie; pO2 nie.","Pseudohyperkaliämie: Hämolyse, Kühlung, Verzögerung, Faustschluss, EDTA-Kontamination, ausgeprägte Thrombo- oder Leukozytose.","BGA-Proben in Plastikspritzen nicht auf Eis legen, zügig messen."]}]}]},{"id":"ablauf-echo-befund","typ":"ablauf","titel":"Echo-Befunde lesen","untertitel":"Von Zahlen zu Aussagen auf IMC und ICU","gruppe":"Befunde","reihenfolge":30,"ebene":"oeffentlich","status":"entwurf","dauer":"25 bis 30 min","lernziele":["Einen Echo-Befund in fester Reihenfolge lesen: Rahmenbedingungen, linker und rechter Ventrikel, Klappen, Perikard, VCI, PA-Druck, diastolische Funktion.","Messwerte mit Richtwerten aus ASE/EACVI- und ESC-Empfehlungen einordnen und daraus eine klinische Aussage formulieren.","Schlagvolumen, Aortenklappenöffnungsfläche, sPAP und E/e′ aus Rohwerten selbst berechnen und die wichtigsten Fehlerquellen benennen.","Fallstricke erkennen: Low-Flow-Low-Gradient-Aortenstenose, kleines Schlagvolumen bei Tachykardie, Lastabhängigkeit der Parameter, VCI unter Beatmung.","Notfallbefunde (Tamponade, akute schwere Mitralinsuffizienz, akute Rechtsherzbelastung) erkennen und sofort eskalieren."],"quellen":[{"id":"lang-2015","kurz":"ASE/EACVI 2015 (Lang)","titel":"Lang RM et al. Recommendations for cardiac chamber quantification by echocardiography in adults: an update from the ASE and the EACVI. Eur Heart J Cardiovasc Imaging 2015;16:233–271","url":"https://academic.oup.com/ehjcimaging/article/16/3/233/2400051","stand":"2015"},{"id":"nagueh-2016","kurz":"ASE/EACVI 2016 (Nagueh)","titel":"Nagueh SF et al. Recommendations for the evaluation of left ventricular diastolic function by echocardiography: an update from the ASE and the EACVI. Eur Heart J Cardiovasc Imaging 2016;17:1321–1360","url":"https://academic.oup.com/ehjcimaging/article/17/12/1321/2680006","stand":"2016"},{"id":"baumgartner-2017","kurz":"EACVI/ASE 2017 (Baumgartner)","titel":"Baumgartner H et al. Recommendations on the echocardiographic assessment of aortic valve stenosis: a focused update from the EACVI and the ASE. Eur Heart J Cardiovasc Imaging 2017;18:254–275","url":"https://academic.oup.com/ehjcimaging/article/18/3/254/2981658","stand":"2017"},{"id":"esc-vhd-2021","kurz":"ESC/EACTS 2021","titel":"2021 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 2022;43:561–632","url":"https://academic.oup.com/eurheartj/article/43/7/561/6358470","stand":"2021"},{"id":"zoghbi-2017","kurz":"ASE 2017 (Zoghbi)","titel":"Zoghbi WA et al. Recommendations for noninvasive evaluation of native valvular regurgitation (ASE, SCMR). J Am Soc Echocardiogr 2017;30:303–371","url":"https://asecho.org/wp-content/uploads/2017/04/2017VavularRegurgitationGuideline.pdf","stand":"2017"},{"id":"ase-rh-2025","kurz":"ASE 2025 (Mukherjee)","titel":"Mukherjee M et al. Guidelines for the echocardiographic assessment of the right heart in adults and special considerations in pulmonary hypertension. J Am Soc Echocardiogr 2025;38:141–186","url":"https://www.asecho.org/wp-content/uploads/2025/03/PIIS0894731725000379.pdf","stand":"2025"},{"id":"esc-ph-2022","kurz":"ESC/ERS 2022","titel":"2022 ESC/ERS Guidelines for the diagnosis and treatment of pulmonary hypertension. Eur Heart J 2022;43:3618–3731","url":"https://academic.oup.com/eurheartj/article/43/38/3618/6673929","stand":"2022"},{"id":"esc-pe-2019","kurz":"ESC 2019 LE","titel":"2019 ESC Guidelines for the diagnosis and management of acute pulmonary embolism. Eur Heart J 2020;41:543–603","url":"https://academic.oup.com/eurheartj/article/41/4/543/5556136","stand":"2019"},{"id":"esc-perikard-2015","kurz":"ESC 2015 Perikard","titel":"2015 ESC Guidelines for the diagnosis and management of pericardial diseases. Eur Heart J 2015;36:2921–2964","url":"https://academic.oup.com/eurheartj/article/36/42/2921/2293375","stand":"2015"},{"id":"santangelo-2026","kurz":"Santangelo 2026","titel":"Santangelo S et al. Cardiac tamponade under positive-pressure ventilation: pathophysiological insights and implications for diagnosis. Rev Cardiovasc Med 2026;27(6):49283","url":"https://www.imrpress.com/journal/RCM/27/6/10.31083/RCM49283","stand":"2026"},{"id":"huang-2018","kurz":"Huang 2018","titel":"Huang H et al. Value of variation index of inferior vena cava diameter in predicting fluid responsiveness in patients with circulatory shock receiving mechanical ventilation: a systematic review and meta-analysis. Crit Care 2018;22:204","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6102872/","stand":"2018"},{"id":"pino-2025","kurz":"Pino 2025","titel":"Pino PG et al. Echocardiographic management of papillary muscle rupture during acute myocardial infarction. Explor Cardiol 2025;3:101242","url":"https://explorationpub.com/Journals/ec/Article/101242","stand":"2025"}],"moderation":"Impulsfragen:\n1. Welche Angaben braucht ihr, bevor ihr eine LVEF oder einen Gradienten bewertet (Herzfrequenz, Rhythmus, Blutdruck, Beatmung, Katecholamine)?\n2. Warum kann ein normales HZV bei Tachykardie täuschen, und welche Zahl berichtet ihr stattdessen?\n3. Wann ist ein niedriger Gradient über der Aortenklappe beruhigend, und wann nicht?\n4. Was ändert sich an der Beurteilung der VCI, sobald die Patient:in beatmet ist?\nStolperstellen: Der LVOT-Durchmesser geht quadriert ein, kleine Messfehler wirken groß. Ein kleiner Farbjet schließt eine akute schwere Mitralinsuffizienz nicht aus. Ein normaler sPAP bei schwerer Trikuspidalinsuffizienz beweist nichts. Alle Zahlen sind Richtwerte aus Leitlinien; ein UKHD-Hausstandard lag nicht vor.","phasen":[{"titel":"Rahmen: vor dem ersten Messwert","inhalt":"Ein Messwert ist nur im Zusammenhang aussagekräftig. Vor dem ersten Wert klären:\n• Fragestellung und Klinik: Hypotonie, Dyspnoe, Zustand nach Intervention, Vorbefund?\n• Herzfrequenz, Rhythmus und Blutdruck während der Untersuchung. Gradienten und Flüsse hängen davon ab. Bei Sinusrhythmus mindestens 3 Schläge mitteln, bei unregelmäßigem Rhythmus (z. B. Vorhofflimmern) mindestens 5 aufeinanderfolgende, Schläge nach Extrasystolen auslassen.\n• Beatmung (Überdruck, PEEP), Katecholamine, Volumengaben, mechanische Kreislaufunterstützung.\n• Bildqualität: gemessen oder visuell geschätzt?\n**Hinweis:** Alle Zahlen in diesem Modul sind Richtwerte aus internationalen Empfehlungen (ASE/EACVI, ESC). Ein Hausstandard des UKHD lag bei der Erstellung nicht vor.","frist":"Bei jedem Befund zuerst","q":["baumgartner-2017","ase-rh-2025"]},{"titel":"Linker Ventrikel","inhalt":"**Größe:** LV-enddiastolischer Durchmesser, Richtwert normal Männer 4,2–5,8 cm, Frauen 3,8–5,2 cm. Aussagekräftiger ist das indexierte Volumen (obere Normgrenze biplan: Männer 74 ml/m², Frauen 61 ml/m²).\n**Systolische Funktion:** LVEF bevorzugt biplan (Scheibchensummation). Richtwerte: normal Männer 52–72 %, Frauen 54–74 %; leicht eingeschränkt 41–51 % bzw. 41–53 %; mittelgradig 30–40 %; hochgradig \u003c30 %.\n**Regionale Wandbewegung:** 16-Segment-Modell, je Segment normal oder hyperkinetisch (1), hypokinetisch (2), akinetisch (3), dyskinetisch (4); der Mittelwert ist der Wandbewegungsindex. Das Muster einem Koronargebiet zuordnen.\n**Schlagvolumen:** SV = LVOT-Fläche × LVOT-VTI, LVOT-Fläche = π × (Durchmesser/2)². Der Durchmesser geht quadriert ein und ist die größte Fehlerquelle.\n**Aussage formulieren:** z. B. „LV normal groß, LVEF mittelgradig eingeschränkt (32 %), Akinesie anteroseptal und apikal, passend zum RIVA-Gebiet; SV 38 ml bei HF 110/min“. Nach Infarkt immer nach mechanischen Komplikationen fragen: neue Mitralinsuffizienz, Shunt über das Septum, Perikarderguss.","frist":"Bei jedem Befund","q":["lang-2015","baumgartner-2017","zoghbi-2017","pino-2025"]},{"titel":"Rechter Ventrikel","inhalt":"**Größe:** im RV-fokussierten Vierkammerblick. Dilatation bei basalem Durchmesser >41 mm oder midventrikulär >35 mm. RV größer als LV (Verhältnis der Basisdurchmesser >1,0) ist ein Belastungszeichen.\n**Systolische Funktion, Richtwerte für pathologisch:** TAPSE \u003c17 mm, Gewebedoppler S′ \u003c9,5 cm/s, FAC \u003c35 %, longitudinaler Strain der freien Wand betragsmäßig \u003c20 %.\n**Grenzen:** TAPSE erfasst nur die Längsbewegung des Trikuspidalrings. Unterschätzung z. B. nach Herzoperation, bei Konstriktion, bei Schrittmachersonde oder schlechtem Winkel; Überschätzung bei schwerer Trikuspidalinsuffizienz. Deshalb nie isoliert werten.\n**Septum:** Abflachung in der Endsystole (LV-Exzentrizitätsindex >1) spricht für Druckbelastung, in der Enddiastole für Volumenbelastung.\n**Wanddicke:** normal unter 5 mm. Eine verdickte RV-Wand spricht für eine länger bestehende Druckbelastung.\n**Aussage formulieren:** z. B. „RV dilatiert, systolische Funktion eingeschränkt (TAPSE 14 mm, S′ 8 cm/s), systolische Septumabflachung: Druckbelastung“.","frist":"Bei jedem Befund","q":["lang-2015","ase-rh-2025","esc-ph-2022","esc-pe-2019"]},{"titel":"Klappen: Aortenstenose, Mitral- und Trikuspidalinsuffizienz","inhalt":"**Aortenstenose:** Vmax und mittlerer Gradient (CW), Öffnungsfläche (AVA) mit der Kontinuitätsgleichung: AVA = LVOT-Fläche × LVOT-VTI / AV-VTI. Richtwerte schwer: Vmax ≥4,0 m/s, mittlerer Gradient ≥40 mmHg, AVA \u003c1,0 cm² (ESC 2021: ≤1 cm²), indexiert \u003c0,6 cm²/m², Geschwindigkeitsverhältnis \u003c0,25. Mittelgradig: Vmax 3,0–4,0 m/s, Gradient 20–40 mmHg, AVA 1,0–1,5 cm².\nPassen Fläche und Gradient nicht zusammen, den Fluss prüfen: SVi ≤35 ml/m² gilt als Low Flow (Low-Flow-Low-Gradient-AS mit reduzierter LVEF \u003c50 % oder mit erhaltener LVEF).\n**Mitralinsuffizienz, Richtwerte schwer:** Vena contracta ≥7 mm (biplan ≥8 mm), EROA ≥40 mm², Regurgitationsvolumen ≥60 ml, Regurgitationsfraktion ≥50 %, systolische Flussumkehr in den Pulmonalvenen. Bei sekundärer MR spricht bei elliptischer Öffnung schon eine EROA ≥30 mm², bei niedrigem Fluss ein Volumen ≥45 ml für schwer.\n**Trikuspidalinsuffizienz, Richtwerte schwer:** Vena contracta >7 mm, PISA-Radius >9 mm, EROA ≥40 mm², Regurgitationsvolumen ≥45 ml, systolische Flussumkehr in den Lebervenen, dichtes, dreieckiges, früh gipfelndes CW-Signal. Darüber hinaus sind die Grade „massiv“ und „torrentiell“ vorgeschlagen.\n**Regel:** Kein Einzelwert entscheidet. Morphologie, Farbdoppler, Spektraldoppler und Kammergrößen gemeinsam bewerten.","frist":"Bei jedem Befund, gezielt bei Geräusch, Dyspnoe, Hypotonie","q":["baumgartner-2017","esc-vhd-2021","zoghbi-2017"]},{"titel":"Perikarderguss und Tamponadezeichen","inhalt":"**Ergussgröße** (enddiastolischer echofreier Raum): klein \u003c10 mm, mittel 10–20 mm, groß >20 mm. Lage beschreiben: zirkulär oder umschrieben. Nach Herzoperation sind Ergüsse oft gekammert oder geronnen und transthorakal schwer zu sehen, dann TEE erwägen.\n**Tamponadezeichen:** schwingendes Herz, frühdiastolischer Kollaps des RV, Kollaps des RA in der späten Diastole, gestaute VCI ohne Atemvariabilität, verstärkte Atemvariation des Mitraleinstroms (>25 %). Klinisch: Pulsus paradoxus (inspiratorischer Abfall des systolischen Drucks >10 mmHg).\n**Entscheidend ist die Geschwindigkeit:** Die Toleranz hängt mehr vom Tempo der Ergussbildung ab als vom Volumen. Ein rasch entstandener, nicht großer Erguss nach Intervention kann tamponieren.\n**Unter Überdruckbeatmung** sind die Atemvariationszeichen abgeschwächt oder fehlen, eine weite VCI ist unspezifisch, Kammerkollaps kann intermittierend sein. Tamponade ist dort schon bei kleineren Ergüssen möglich.\n**Konsequenz:** Bei instabiler Patient:in Drainage ohne Verzögerung, bevorzugt Nadelperikardiozentese. Blutige Tamponade früh nach Herzoperation: chirurgische Revision.","frist":"Bei Hypotonie, nach Intervention oder Herzoperation","q":["esc-perikard-2015","santangelo-2026"]},{"titel":"Volumenstatus über die untere Hohlvene (VCI)","inhalt":"**Messung:** subkostal, am Ende der Exspiration, 0,5 bis 3,0 cm vor der Einmündung in den RA. Kollaps beim Schnüffeln und bei ruhiger Atmung beurteilen, möglichst im M-Mode. Prüfen, dass die VCI nicht aus der Schnittebene wandert.\n**RAP-Schätzung bei Spontanatmung, Richtwerte:**\n• ≤2,1 cm und Kollaps ≥50 %: 3 mmHg (0–5)\n• ≤2,1 cm mit Kollaps \u003c50 % oder >2,1 cm mit Kollaps ≥50 %: 8 mmHg (5–10), Nebenkriterien heranziehen\n• >2,1 cm und Kollaps \u003c50 %: 15 mmHg (10–20)\n• klein und kollabiert: RAP wahrscheinlich niedrig, Hinweis auf Volumenmangel\n**Nebenkriterien für erhöhten RAP:** großer RA, Vorhofseptum durchgehend nach links gewölbt, Lebervenenfluss mit diastolischer Dominanz, Trikuspidal-E/e′ >6.\n**Beatmung:** Unter Überdruckbeatmung ist der Kollaps nicht verwertbar; die VCI ist dort oft weit, ohne dass der RAP hoch ist. Eine VCI ≤2,1 cm spricht auch bei Intubierten für RAP \u003c10 mmHg. Ist der RAP therapeutisch wichtig: invasiv messen.\n**Volumenreagibilität:** Die Atemvariation der VCI sagt sie unter Beatmung nur mäßig voraus; fehlende Variation schließt sie nicht aus. Eine weite VCI kann bei jungen Gesunden, Sportler:innen und Schwangeren normal sein.","frist":"Bei Hypotonie, Oligurie, vor und nach Volumengabe","q":["ase-rh-2025","lang-2015","huang-2018"]},{"titel":"Pulmonale Hypertonie: sPAP aus TR-Geschwindigkeit und RAP","inhalt":"**Schätzung:** sPAP ≈ 4 × (TR-Vmax)² + RAP (vereinfachte Bernoulli-Gleichung). Gilt nur ohne Stenose im RVOT, an der Pulmonalklappe oder in der proximalen PA.\n**Messung:** TR-Signal aus mehreren Fenstern ableiten, die höchste saubere Hüllkurve verwenden, den dichten Rand messen und nicht die ausgefransten Signalanteile. Bei Vorhofflimmern über 5 bis 10 Zyklen mitteln.\n**Fehlerquellen:** schwaches Signal und schlechter Winkel unterschätzen, Übersteuerung überschätzt. Bei schwerer TR mit laminarem, dreieckigem Signal gleichen sich RV- und RA-Druck früh an; Bernoulli gilt dann nicht, der Gradient wird unterschätzt. Der geschätzte RAP bringt einen eigenen Fehler mit.\n**Einordnung nach ESC/ERS 2022:** Schlüsselgröße ist die TR-Geschwindigkeit, nicht der berechnete sPAP. TR-Vmax >2,8 m/s kann auf eine PH hinweisen. Zusatzzeichen aus mindestens zwei Bereichen erhöhen die Wahrscheinlichkeit, z. B. RV/LV-Basisdurchmesser >1,0, Septumabflachung (Exzentrizitätsindex >1,1), TAPSE/sPAP \u003c0,55 mm/mmHg, RVOT-Akzelerationszeit \u003c105 ms oder mesosystolisches Notching, PA-Durchmesser >25 mm, VCI >21 mm mit vermindertem Kollaps, RA-Fläche >18 cm².\n**Grenze:** Das Echo liefert eine Wahrscheinlichkeit. Die Diagnose PH (mPAP >20 mmHg) stellt der Rechtsherzkatheter.","frist":"Bei Dyspnoe, Rechtsherzbelastung, vor Klappeneingriffen","q":["esc-ph-2022","ase-rh-2025"]},{"titel":"Diastolische Funktion und Füllungsdrücke (ASE/EACVI 2016)","inhalt":"**Bei normaler LVEF vier Kriterien, Richtwerte für pathologisch:**\n• e′ septal \u003c7 cm/s oder lateral \u003c10 cm/s\n• E/e′ gemittelt >14\n• LAVI >34 ml/m²\n• TR-Vmax >2,8 m/s\nMehr als die Hälfte erfüllt: diastolische Dysfunktion; genau die Hälfte: nicht eindeutig; weniger als die Hälfte: normal.\n**Füllungsdruck** (bei reduzierter LVEF oder bei Myokarderkrankung mit normaler LVEF):\n• E/A ≤0,8 und E ≤50 cm/s: LA-Druck normal oder niedrig (Grad I)\n• E/A ≥2: LA-Druck erhöht (Grad III)\n• dazwischen: E/e′ >14, LAVI >34 ml/m², TR-Vmax >2,8 m/s prüfen. Zwei oder drei erfüllt: LA-Druck erhöht (Grad II); höchstens eines erfüllt: normal (Grad I).\n**Nicht oder eingeschränkt anwendbar:** mehr als mittelgradige MR, mindestens mittelgradige Mitralringverkalkung, Mitralstenose, Mitralprothese oder Rekonstruktion. LSB, RV-Stimulation und CRT mindern die Aussagekraft von e′. Bei Konstriktion E/e′ nicht verwenden.\n**Vorhofflimmern:** E/A entfällt; ein septales E/e′ ≥11 spricht unter anderem für erhöhte Füllungsdrücke. **Sinustachykardie:** E- und A-Welle können verschmelzen.","frist":"Bei Dyspnoe mit erhaltener LVEF, bei Herzinsuffizienz","q":["nagueh-2016"]}],"kriterien":[{"titel":"Merkliste Schwellenwerte (Richtwerte nach Literatur, kein UKHD-Hausstandard)","punkte":["LVEF biplan: normal Männer 52–72 %, Frauen 54–74 %; mittelgradig eingeschränkt 30–40 %, hochgradig \u003c30 % (ASE/EACVI 2015)","LVEDD normal: Männer 4,2–5,8 cm, Frauen 3,8–5,2 cm; LAVI normal bis 34 ml/m²","RV dilatiert bei basal >41 mm; pathologisch: TAPSE \u003c17 mm, S′ \u003c9,5 cm/s, FAC \u003c35 %","Schwere AS: Vmax ≥4,0 m/s, mittlerer Gradient ≥40 mmHg, AVA \u003c1,0 cm² (ESC 2021: ≤1 cm²), AVAi \u003c0,6 cm²/m²; Low Flow: SVi ≤35 ml/m²","Schwere MR: Vena contracta ≥7 mm, EROA ≥40 mm² (sekundäre MR mit elliptischer Öffnung ab 30 mm²), Regurgitationsvolumen ≥60 ml, Regurgitationsfraktion ≥50 %","Schwere TR: Vena contracta >7 mm, EROA ≥40 mm², Regurgitationsvolumen ≥45 ml, systolische Flussumkehr in den Lebervenen","Perikarderguss: klein \u003c10 mm, mittel 10–20 mm, groß >20 mm; Atemvariation des Mitraleinstroms >25 % als Tamponadezeichen","VCI ≤2,1 cm mit Kollaps ≥50 %: RAP 3 mmHg; >2,1 cm mit Kollaps \u003c50 %: 15 mmHg; Mischbilder 8 mmHg (nur bei Spontanatmung)","sPAP = 4 × TR-Vmax² + RAP; TR-Vmax >2,8 m/s kann auf eine PH hinweisen; TAPSE/sPAP \u003c0,55 mm/mmHg als Zusatzzeichen (ESC/ERS 2022)","Diastole: e′ septal \u003c7 oder lateral \u003c10 cm/s, E/e′ gemittelt >14, LAVI >34 ml/m², TR-Vmax >2,8 m/s; bei Vorhofflimmern septales E/e′ ≥11","Akute LE (ESC 2019): RV/LV ≥1,0 und TAPSE \u003c16 mm prognostisch ungünstig; 60/60-Zeichen: RVOT-Akzelerationszeit \u003c60 ms bei TR-Gradient \u003c60 mmHg"]},{"titel":"Fallstricke","punkte":["Low-Flow-Low-Gradient-AS: kleine AVA bei niedrigem Gradienten. Erst das SVi prüfen. Bei reduzierter LVEF niedrig dosiertes Dobutamin-Stressecho: SV-Anstieg >20 % zeigt Flussreserve; erreicht der Gradient ≥40 mmHg (EACVI/ASE: >30–40 mmHg) oder Vmax ≥4,0 m/s bei AVA ≤1,0 cm², ist die AS echt schwer; AVA >1,0 cm² unter Fluss spricht für pseudoschwer.","Ohne Flussreserve oder bei erhaltener LVEF hilft der CT-Kalkscore der Aortenklappe: schwere AS wahrscheinlich ab etwa 2000 AU bei Männern und 1200 AU bei Frauen, sehr wahrscheinlich ab etwa 3000 bzw. 1600 AU, unwahrscheinlich unter 1600 bzw. 800 AU.","Schlagvolumen bei Tachykardie: HZV = SV × HF wirkt bei hoher Frequenz oft noch normal, obwohl das SV klein ist. SV oder SVi berichten, nicht nur HZV oder LVEF.","LVOT-Durchmesser geht quadriert ein: 1 mm Messfehler bei 22 mm verändert SV und AVA um etwa 9 %.","Lastabhängigkeit: Volumenstatus, Blutdruck, Katecholamine, Rhythmus und eine begleitende MR verändern AS-Gradient, Regurgitationsfläche, E-Welle und TR-Geschwindigkeit. Eine schwere MR kann den Fluss über die Aortenklappe und damit den AS-Gradienten senken. Verlaufsbefunde nur bei vergleichbaren Bedingungen gegeneinander stellen.","Akute schwere MR: Farbjet oft klein und exzentrisch, LA und LV normal groß; die Doppler-Quantifizierung (EROA, Volumen) gilt für chronische MR. Anatomie und hyperdynamer LV bei niedrigem Vorwärtsfluss zählen.","Beatmung und VCI: unter Überdruckbeatmung kein Kollapskriterium, weite VCI häufig ohne hohen RAP; Atemvariation sagt Volumenreagibilität nur mäßig voraus, fehlende Variation schließt sie nicht aus.","TAPSE ist winkel- und lastabhängig, unterschätzt nach Herzoperation und überschätzt bei schwerer TR: nie isoliert werten.","sPAP bei schwerer TR: laminarer, dreieckiger Jet unterschätzt den Gradienten; ein normaler Wert schließt dann keine PH aus."]},{"titel":"Notfallbefunde: sofort Oberärzt:in informieren","punkte":["Perikarderguss mit Kollaps von RA oder RV, gestauter VCI und Hypotonie: Tamponade, Drainage ohne Verzögerung","Neuer Erguss nach Intervention oder Herzoperation, auch wenn er nicht groß ist: engmaschig kontrollieren, Blutungsquelle bedenken","Akute schwere MR (Segelflail, Papillarmuskelabriss, hyperdynamer LV) mit Lungenödem oder Hypotonie: Herzchirurgie und Kreislaufunterstützung als Brücke","Akute Rechtsherzbelastung (RV dilatiert und dysfunktional, McConnell-Zeichen, 60/60-Zeichen, Thrombus im rechten Herzen): bei Schock und eindeutiger RV-Belastung kann eine Reperfusion gerechtfertigt sein, wenn eine CT nicht sofort möglich ist","Fehlende RV-Belastung bei Schock: Lungenembolie als Schockursache praktisch ausgeschlossen, andere Ursache suchen (Tamponade, Klappe, LV, Hypovolämie)","Neue Wandbewegungsstörung, neues Geräusch oder Hypotonie nach Infarkt: mechanische Komplikation suchen","Hochgradig eingeschränkte LVEF mit kleinem SV und Zeichen der Minderperfusion: kardiogener Schock"]}],"uebungen":[{"titel":"Hypotonie nach Vorderwandinfarkt","patient":{"kurz":"Herr M., 64 J.","alter":64,"geschlecht":"m","vorgeschichte":"Tag 1 nach Vorderwand-STEMI mit PCI des proximalen RIVA. Jetzt RR 86/58 mmHg, HF 110/min (Sinusrhythmus), kühle Extremitäten, spontan atmend. Körperoberfläche 2,0 m²."},"start_knoten":"a1","knoten":[{"id":"a1","typ":"text","titel":"Echo-Befund","text":"LVEDD 54 mm. LVEF biplan 32 %. Akinesie der anteroseptalen und anterioren Segmente sowie aller apikalen Segmente; basale inferiore und laterale Segmente hyperkinetisch.\nMR leicht (Vena contracta 3 mm). Kein Perikarderguss, im Farbdoppler kein Shunt über das Septum.\nRV normal groß, TAPSE 19 mm. VCI 2,3 cm, Kollaps beim Schnüffeln unter 50 %.\n**LVOT-Durchmesser 2,2 cm, LVOT-VTI 10 cm.**","weiter":"a2"},{"id":"a2","typ":"zahl","frage":"Berechne das Schlagvolumen aus LVOT-Durchmesser 2,2 cm und LVOT-VTI 10 cm.","einheit":"ml","min":0,"max":160,"schritt":1,"start":80,"zielbereich":[37,39],"feedback_ok":"Richtig. LVOT-Fläche = π × (2,2/2)² = π × 1,21 ≈ 3,80 cm²; SV = 3,80 cm² × 10 cm ≈ 38 ml. Mit HF 110/min ergibt das ein HZV von etwa 4,2 l/min, indexiert SVi 19 ml/m² und HI 2,1 l/min/m². Das HZV wirkt fast normal, weil die Tachykardie das kleine SV ausgleicht.","feedback_zu_niedrig":"Zu niedrig. Wurde der Radius nicht quadriert (π × 1,1 × 10 ≈ 35 ml)? Fläche = π × r² mit r = 1,1 cm, also etwa 3,80 cm², dann × VTI 10 cm.","feedback_zu_hoch":"Zu hoch. Häufiger Fehler: den Durchmesser statt des Radius quadriert (π × 2,2² × 10 ≈ 152 ml). Richtig ist π × (D/2)² × VTI.","weiter":"a3"},{"id":"a3","typ":"wahl","moderation":"Frage an die Gruppe: Welche Zahl im Befund widerspricht der Idee, dass hier vor allem Volumen fehlt?","frage":"SV 38 ml, HF 110/min, LVEF 32 %, VCI 2,3 cm mit Kollaps unter 50 %, RR 86/58 mmHg, kühle Extremitäten. Wie ordnest du den Befund ein?","optionen":[{"id":"a","text":"Pumpversagen nach großem Vorderwandinfarkt mit kleinem SV und kompensatorischer Tachykardie; kein Hinweis auf Volumenmangel. Oberärzt:in sofort informieren, Behandlung als kardiogener Schock nach Hausstandard, mechanische Komplikationen im Verlauf erneut prüfen.","bewertung":"richtig","feedback":"Richtig. Hypotonie, kühle Peripherie und ein SVi von 19 ml/m² passen zu einem Low-Output-Zustand. Die weite, kaum kollabierende VCI (geschätzter RAP um 15 mmHg) spricht gegen Volumenmangel als Hauptursache. Ein Septumshunt, eine schwere MR und ein Erguss sind im Befund nicht zu sehen, können aber später auftreten.","q":["lang-2015","ase-rh-2025","baumgartner-2017"]},{"id":"b","text":"Hypovolämie: rasch 1000 ml Kristalloid geben.","bewertung":"falsch","feedback":"Die weite VCI mit geringem Kollaps entspricht bei Spontanatmung einem erhöhten RAP. Das Problem ist die Pumpe, nicht das Volumen; ein großer Bolus kann eine Lungenstauung verschlechtern.","q":["ase-rh-2025"]},{"id":"c","text":"Das HZV von 4,2 l/min ist normal, ein Schock liegt nicht vor.","bewertung":"falsch","feedback":"Das HZV wird nur durch die Herzfrequenz gehalten; das SV ist mit 38 ml (SVi 19 ml/m²) sehr klein. Zusammen mit Hypotonie und kühler Peripherie ist das ein Low-Output-Zustand. Deshalb SV oder SVi berichten, nicht nur das HZV.","q":["baumgartner-2017"]},{"id":"d","text":"Herzfrequenz medikamentös senken, damit sich der LV besser füllt.","bewertung":"falsch","feedback":"Bei kleinem, kaum steigerbarem SV ist die Tachykardie der Mechanismus, der das HZV hält. Eine Frequenzsenkung würde das HZV weiter verringern."}],"weiter":"a4"},{"id":"a4","typ":"mehrfach","frage":"Welche Aussagen zu diesem Befund treffen zu?","optionen":[{"text":"Eine LVEF von 32 % entspricht nach ASE/EACVI 2015 einer mittelgradig eingeschränkten Funktion (30–40 %).","richtig":true,"feedback":"Richtig. Unter 30 % gilt als hochgradig eingeschränkt."},{"text":"Akinesie anteroseptal, anterior und apikal passt zum Versorgungsgebiet des RIVA.","richtig":true,"feedback":"Richtig. Das Muster der Wandbewegungsstörung sollte zum Infarktgefäß passen; sonst nach einer zweiten Ursache suchen."},{"text":"Ein normaler LVEDD schließt einen großen Infarkt aus.","richtig":false,"feedback":"Falsch. Am ersten Tag ist der LV meist noch nicht dilatiert. Die Ausdehnung zeigt sich an der Zahl akinetischer Segmente und an der LVEF."},{"text":"Die hyperkinetischen basalen Segmente sind ein Zeichen einer zweiten Ischämie.","richtig":false,"feedback":"Falsch. Nicht betroffene Segmente arbeiten oft kompensatorisch verstärkt. Im Wandbewegungsscore werden sie als normal (1) gewertet."},{"text":"Ein Messfehler von 1 mm im LVOT-Durchmesser (2,1 oder 2,3 statt 2,2 cm) verändert das SV um etwa 9 %.","richtig":true,"feedback":"Richtig. Der Durchmesser geht quadriert ein: (2,3/2,2)² ≈ 1,09 und (2,1/2,2)² ≈ 0,91. Er ist die größte Fehlerquelle der Flussberechnung."},{"text":"Die VCI von 2,3 cm mit Kollaps unter 50 % entspricht bei Spontanatmung einem geschätzten RAP von etwa 15 mmHg.","richtig":true,"feedback":"Richtig. Über 2,1 cm und unter 50 % Kollaps: Richtwert 15 mmHg (Bereich 10 bis 20)."}],"weiter":"a5"},{"id":"a5","typ":"ende","titel":"Low Output nach Vorderwandinfarkt erkannt","text":"Du hast aus zwei Messwerten das Schlagvolumen berechnet und erkannt, dass ein fast normales HZV hier nur durch die Tachykardie zustande kommt. Die VCI spricht gegen Volumenmangel.","lernpunkte":["SV = π × (LVOT-Durchmesser/2)² × LVOT-VTI. Der Durchmesser geht quadriert ein, deshalb sorgfältig messen.","Bei Tachykardie kann ein normales HZV ein sehr kleines SV verdecken: SV oder SVi berichten.","LVEF nach ASE/EACVI 2015: 30–40 % mittelgradig, \u003c30 % hochgradig eingeschränkt (Richtwerte).","Nach Infarkt bei jeder Verschlechterung erneut nach mechanischen Komplikationen suchen."]}]},{"titel":"Dyspnoe bei Aortenstenose mit niedrigem Gradienten","patient":{"kurz":"Frau K., 79 J.","alter":79,"geschlecht":"w","vorgeschichte":"Aufnahme auf die IMC mit Dyspnoe NYHA III und Lungenstauung. RR 118/70 mmHg, HF 80/min, Sinusrhythmus. Körperoberfläche 1,70 m²."},"start_knoten":"b1","knoten":[{"id":"b1","typ":"text","titel":"Echo-Befund","text":"LV normal groß, global hypokinetisch, LVEF biplan 30 %. MR leicht.\nAortenklappe stark verkalkt, Öffnung eingeschränkt. CW: Vmax 3,4 m/s, mittlerer Gradient 28 mmHg, AV-VTI 70 cm.\nLVOT-Durchmesser 2,0 cm (gezoomte parasternale lange Achse, Mesosystole), LVOT-VTI (PW) 14 cm.","weiter":"b2"},{"id":"b2","typ":"zahl","frage":"Berechne die Aortenklappenöffnungsfläche mit der Kontinuitätsgleichung: LVOT 2,0 cm, LVOT-VTI 14 cm, AV-VTI 70 cm.","einheit":"cm²","min":0,"max":3,"schritt":0.01,"start":1.2,"zielbereich":[0.6,0.66],"feedback_ok":"Richtig. LVOT-Fläche = π × (2,0/2)² ≈ 3,14 cm²; SV = 3,14 × 14 ≈ 44 ml; AVA = 44 / 70 ≈ 0,63 cm², indexiert 0,37 cm²/m². SVi = 44 / 1,70 ≈ 26 ml/m²: Low Flow. Das VTI-Verhältnis LVOT/AV beträgt 0,20.","feedback_zu_niedrig":"Zu klein. Wurde π vergessen (1,0² × 14 / 70 = 0,20)? AVA = π × (D/2)² × LVOT-VTI / AV-VTI.","feedback_zu_hoch":"Zu groß. Häufige Fehler: Durchmesser statt Radius quadriert (π × 2,0² × 14 / 70 ≈ 2,5 cm²) oder D² ohne den Faktor π/4 (2,0² × 14 / 70 = 0,80 cm²).","weiter":"b3"},{"id":"b3","typ":"wahl","moderation":"Diskutieren: Welcher der drei Werte (Gradient, Fläche, SVi) ist am fehleranfälligsten, und wie prüft ihr ihn?","frage":"AVA 0,63 cm², mittlerer Gradient 28 mmHg, Vmax 3,4 m/s, LVEF 30 %, SVi 26 ml/m². Wie ordnest du den Befund ein, und was folgt?","optionen":[{"id":"a","text":"Klassische Low-Flow-Low-Gradient-AS mit reduzierter LVEF. Niedrig dosiertes Dobutamin-Stressecho, um eine echte schwere von einer pseudoschweren AS zu unterscheiden.","bewertung":"richtig","feedback":"Richtig. Kleine Fläche (≤1 cm²), Gradient unter 40 mmHg, LVEF unter 50 % und SVi ≤35 ml/m² definieren diese Form. Der Gradient ist flussabhängig und bei niedrigem SV zu klein, um den Schweregrad zu zeigen.","q":["esc-vhd-2021","baumgartner-2017"]},{"id":"b","text":"Mittelgradige AS, da Gradient unter 40 mmHg und Vmax unter 4 m/s.","bewertung":"falsch","feedback":"Bei niedrigem Fluss unterschätzt der Gradient den Schweregrad. Die Fläche von 0,63 cm² und das SVi von 26 ml/m² passen nicht zu einer mittelgradigen AS mit normalem Fluss.","q":["baumgartner-2017"]},{"id":"c","text":"Paradoxe Low-Flow-Low-Gradient-AS mit erhaltener LVEF.","bewertung":"falsch","feedback":"Die paradoxe Form setzt eine LVEF ≥50 % voraus. Hier ist die LVEF mit 30 % reduziert.","q":["esc-vhd-2021"]},{"id":"d","text":"Zuerst CT-Kalkscore der Aortenklappe statt Stressecho.","bewertung":"akzeptabel","feedback":"Der Kalkscore hilft, vor allem bei erhaltener LVEF oder wenn das Stressecho keine Flussreserve zeigt. Bei reduzierter LVEF ist das niedrig dosierte Dobutamin-Stressecho der übliche erste Schritt, weil es zusätzlich die kontraktile Reserve zeigt.","q":["esc-vhd-2021","baumgartner-2017"]}],"weiter":"b4"},{"id":"b4","typ":"mehrfach","frage":"Niedrig dosiertes Dobutamin-Stressecho (bis 20 µg/kg/min, HF 80 auf 92/min): LVOT-VTI 18 cm, SV damit 44 auf 57 ml. Vmax 4,2 m/s, mittlerer Gradient 44 mmHg, AV-VTI 85 cm, AVA 0,67 cm². Welche Aussagen treffen zu?","optionen":[{"text":"Es besteht eine Flussreserve: Das SV steigt um 29 %, also um mehr als 20 %.","richtig":true,"feedback":"Richtig. 57/44 ≈ 1,29. Ein SV-Anstieg über 20 % gilt als Flussreserve."},{"text":"Echte schwere AS: Gradient ≥40 mmHg und Vmax ≥4,0 m/s, während die AVA ≤1,0 cm² bleibt.","richtig":true,"feedback":"Richtig. Steigt der Gradient mit dem Fluss deutlich an und bleibt die Fläche klein, ist die Stenose fixiert."},{"text":"Pseudoschwere AS, weil die AVA unter Dobutamin von 0,63 auf 0,67 cm² zunimmt.","richtig":false,"feedback":"Falsch. Für eine pseudoschwere AS müsste die Fläche unter Fluss auf über 1,0 cm² steigen."},{"text":"Ohne Flussreserve bliebe die Frage offen; dann hilft der CT-Kalkscore weiter.","richtig":true,"feedback":"Richtig. Fehlende Flussreserve erschwert die Unterscheidung und ist prognostisch ungünstig; der Kalkscore liefert eine flussunabhängige Information."},{"text":"Dobutamin wird bis zur submaximalen Zielfrequenz gesteigert.","richtig":false,"feedback":"Falsch. Es ist ein niedrig dosiertes Protokoll (bis 10 bis 20 µg/kg/min). Abbruch u. a. bei positivem Ergebnis, HF-Anstieg über 10 bis 20/min oder HF über 100/min, Symptomen, Blutdruckabfall oder Rhythmusstörungen."}],"weiter":"b5"},{"id":"b5","typ":"ende","titel":"Low-Flow-Low-Gradient-AS eingeordnet","text":"Die Kontinuitätsgleichung hat die Diskrepanz zwischen kleiner Fläche und niedrigem Gradienten aufgedeckt. Das Stressecho zeigt eine Flussreserve und eine echte schwere AS.","lernpunkte":["AVA = π × (LVOT/2)² × LVOT-VTI / AV-VTI; der LVOT-Durchmesser ist die größte Fehlerquelle.","Passen Fläche und Gradient nicht zusammen: SVi prüfen. SVi ≤35 ml/m² gilt als Low Flow (Richtwert, Schwelle in Diskussion).","Bei reduzierter LVEF klärt das niedrig dosierte Dobutamin-Stressecho, ob die AS echt schwer ist: SV-Anstieg >20 % als Flussreserve, AVA >1,0 cm² unter Fluss spricht für pseudoschwer.","Ohne Flussreserve oder bei erhaltener LVEF ergänzt der CT-Kalkscore die Einordnung."]}]},{"titel":"Rechtsherzbelastung bei Verdacht auf Lungenembolie","patient":{"kurz":"Frau T., 58 J.","alter":58,"geschlecht":"w","vorgeschichte":"Tag 4 nach Hüftprothese. Plötzliche Dyspnoe, HF 116/min, RR 104/66 mmHg, SpO2 88 % unter 4 l/min O2, spontan atmend."},"start_knoten":"c1","knoten":[{"id":"c1","typ":"text","titel":"Echo-Befund","text":"LV klein, LVEF visuell 65 %.\nRV dilatiert, basal 46 mm, größer als der LV. Freie RV-Wand im mittleren Abschnitt hypokinetisch, Spitze kontrahiert gut. Septum in der Systole abgeflacht (D-Form). RV-Wand 4 mm.\nTAPSE 14 mm, S′ 8 cm/s. TR-Vmax 3,0 m/s (sauberes Signal, mehrere Fenster). RVOT-Akzelerationszeit 55 ms.\nVCI 2,4 cm, Kollaps beim Schnüffeln unter 50 %. Kein Perikarderguss, kein Thrombus im rechten Herzen sichtbar.","weiter":"c2"},{"id":"c2","typ":"zahl","frage":"Schätze den systolischen PA-Druck aus TR-Vmax 3,0 m/s und dem RAP, den du aus der VCI (2,4 cm, Kollaps unter 50 %) ableitest.","einheit":"mmHg","min":0,"max":120,"schritt":1,"start":30,"zielbereich":[50,52],"feedback_ok":"Richtig. 4 × 3,0² = 36 mmHg (RV-RA-Gradient), plus RAP 15 mmHg ergibt etwa 51 mmHg. TAPSE/sPAP = 14/51 ≈ 0,27 mm/mmHg, deutlich unter 0,55: Hinweis auf eine schlechte Kopplung von RV und Lungenkreislauf.","feedback_zu_niedrig":"Zu niedrig. Wurde der RAP vergessen (36 mmHg) oder mit 8 statt 15 mmHg angesetzt (44 mmHg)? VCI über 2,1 cm mit Kollaps unter 50 % entspricht etwa 15 mmHg.","feedback_zu_hoch":"Zu hoch. Der Gradient ist 4 × v² = 4 × 9 = 36 mmHg; dazu kommt der RAP von 15 mmHg einmal.","weiter":"c3"},{"id":"c3","typ":"wahl","frage":"Wie ordnest du die Rechtsherzbefunde ein?","optionen":[{"id":"a","text":"Akute RV-Druckbelastung, gut vereinbar mit Lungenembolie: RV dilatiert und dysfunktional, dünnwandig, McConnell-Zeichen, 60/60-Zeichen. Oberärzt:in informieren, Diagnostik und Risikostratifizierung nach ESC-Leitlinie.","bewertung":"richtig","feedback":"Richtig. Akzelerationszeit 55 ms und TR-Gradient 36 mmHg erfüllen das 60/60-Zeichen; RV/LV ≥1,0 und TAPSE unter 16 mm sind prognostisch ungünstig. Frau T. ist kreislaufstabil (systolisch über 90 mmHg); die Diagnose wird mit der CT-Angiographie gesichert, die weitere Therapie richtet sich nach der ESC-Risikoklasse.","q":["esc-pe-2019","ase-rh-2025"]},{"id":"b","text":"Chronische PH, weil der sPAP über 50 mmHg liegt.","bewertung":"falsch","feedback":"Ein nicht vorbelasteter, dünnwandiger RV kann akut nur begrenzt Druck aufbauen (einen mittleren PA-Druck über 40 mmHg kaum). Erst eine TR-Geschwindigkeit über 3,8 m/s bzw. ein Gradient über 60 mmHg spricht eher für eine chronische PH. Hier: 3,0 m/s, 36 mmHg, RV-Wand 4 mm.","q":["esc-pe-2019"]},{"id":"c","text":"RV-Infarkt, weil die freie Wand hypokinetisch ist und die Spitze gut kontrahiert.","bewertung":"falsch","feedback":"Das McConnell-Zeichen kann einem RV-Infarkt ähneln. Systolische Septumabflachung, erhöhte TR-Geschwindigkeit und das 60/60-Zeichen zeigen aber eine Druckbelastung, und der klinische Kontext (postoperativ, plötzliche Dyspnoe) spricht für eine Lungenembolie.","q":["esc-pe-2019","ase-rh-2025"]},{"id":"d","text":"Unauffällig, da die LVEF normal ist.","bewertung":"falsch","feedback":"Eine normale LVEF schließt eine relevante Rechtsherzbelastung nicht aus. Der kleine LV ist hier sogar Folge der RV-Dilatation und der Septumverlagerung.","q":["ase-rh-2025"]}],"weiter":"c4"},{"id":"c4","typ":"mehrfach","frage":"Welche Befunde sprechen eher für eine akute Rechtsherzbelastung bei Lungenembolie als für eine chronische PH?","optionen":[{"text":"Dünne RV-Wand (4 mm) trotz Belastung","richtig":true,"feedback":"Richtig. Eine Hypertrophie braucht Zeit; die normale Wanddicke liegt unter 5 mm."},{"text":"60/60-Zeichen: RVOT-Akzelerationszeit unter 60 ms bei TR-Gradient unter 60 mmHg","richtig":true,"feedback":"Richtig. Kurze Akzelerationszeit bei nur mäßig erhöhtem Gradienten ist typisch für die akute Belastung."},{"text":"McConnell-Zeichen: Hypokinesie der freien Wand bei erhaltener Spitzenkontraktion","richtig":true,"feedback":"Richtig. Typisch für akute Lungenembolie, aber nicht beweisend (Differenzialdiagnose RV-Infarkt)."},{"text":"Mobiler Thrombus im rechten Herzen","richtig":true,"feedback":"Richtig. Selten (unter 4 % der unselektierten Patient:innen), sichert die Diagnose aber praktisch und geht mit hoher Frühsterblichkeit einher."},{"text":"TR-Vmax 4,2 m/s","richtig":false,"feedback":"Falsch. Eine TR-Geschwindigkeit über 3,8 m/s spricht eher für eine länger bestehende PH."},{"text":"RV-Wand 9 mm verdickt","richtig":false,"feedback":"Falsch. Eine verdickte RV-Wand weist auf eine chronische Druckbelastung hin."}],"weiter":"c5"},{"id":"c5","typ":"ende","titel":"Akute Rechtsherzbelastung erkannt","text":"Du hast den sPAP korrekt geschätzt und erkannt, dass nicht die Höhe des Drucks, sondern das Muster aus dilatiertem, dünnwandigem RV mit 60/60- und McConnell-Zeichen auf eine akute Belastung hinweist.","lernpunkte":["sPAP ≈ 4 × TR-Vmax² + RAP; den RAP aus der VCI ableiten (über 2,1 cm mit Kollaps unter 50 %: 15 mmHg).","Akut belasteter RV: dilatiert, dünnwandig, mäßig erhöhter Gradient; TR über 3,8 m/s oder Gradient über 60 mmHg spricht eher für chronische PH.","RV/LV ≥1,0 und TAPSE \u003c16 mm sind bei Lungenembolie prognostisch ungünstig (ESC 2019, Richtwerte).","Bei Schock ohne Zeichen der RV-Belastung ist eine Lungenembolie als Ursache praktisch ausgeschlossen."]}]},{"titel":"Tamponade nach Intervention","patient":{"kurz":"Herr B., 71 J.","alter":71,"geschlecht":"m","vorgeschichte":"2 h nach Katheterablation bei Vorhofflimmern (transseptale Punktion, Heparin während der Prozedur). Zunehmend unruhig, HF 124/min, RR 82/60 mmHg, gestaute Halsvenen."},"start_knoten":"d1","knoten":[{"id":"d1","typ":"text","titel":"Echo-Befund","text":"Neuer zirkulärer Perikarderguss, enddiastolisch 16 mm (vor der Prozedur kein Erguss).\nFreie RV-Wand kollabiert frühdiastolisch, RA kollabiert in der späten Diastole.\nVCI 2,6 cm ohne Atemvariabilität. Atemvariation des Mitraleinstroms 35 %.\nLV klein und hyperkontraktil.","weiter":"d2"},{"id":"d2","typ":"zuordnen","frage":"Ordne die Befunde zu: Spricht der Befund für eine Tamponade, oder ist er allein kein Tamponadezeichen?","kategorien":[{"id":"ja","name":"Spricht für Tamponade"},{"id":"nein","name":"Allein kein Tamponadezeichen"}],"eintraege":[{"text":"Frühdiastolischer Kollaps der freien RV-Wand","kategorie":"ja","warum":"Klassisches Echozeichen: Der Perikarddruck übersteigt den RV-Druck in der frühen Diastole."},{"text":"Kollaps des RA in der späten Diastole","kategorie":"ja","warum":"Klassisches Echozeichen; der dünnwandige RA kollabiert zuerst."},{"text":"VCI 2,6 cm ohne Atemvariabilität","kategorie":"ja","warum":"Gestaute VCI bei Spontanatmung zeigt den erhöhten Füllungsdruck, der zur Tamponade gehört. Unter Überdruckbeatmung wäre sie unspezifisch."},{"text":"Atemvariation des Mitraleinstroms 35 %","kategorie":"ja","warum":"Über 25 % gilt als verstärkte Atemvariation und Zeichen der Tamponade (bei Spontanatmung)."},{"text":"Inspiratorischer Abfall des systolischen Blutdrucks um 16 mmHg","kategorie":"ja","warum":"Pulsus paradoxus: Abfall über 10 mmHg bei ruhiger Atmung."},{"text":"Ergusstiefe 16 mm (mittelgroß)","kategorie":"nein","warum":"Die Größe allein entscheidet nicht. Die Toleranz hängt vor allem vom Tempo der Ergussbildung ab; ein rasch entstandener mittelgroßer Erguss kann tamponieren, ein langsam gewachsener großer nicht."},{"text":"Wäre die VCI 1,3 cm mit Kollaps über 50 %","kategorie":"nein","warum":"Eine schmale, gut kollabierende VCI zeigt bei Spontanatmung einen niedrigen RAP und spricht gegen eine Tamponade."},{"text":"Linksseitiger Pleuraerguss","kategorie":"nein","warum":"Kein Zeichen der kardialen Kompression; kann neben einem Perikarderguss bestehen."}],"weiter":"d3"},{"id":"d3","typ":"wahl","frage":"Wie gehst du vor?","optionen":[{"id":"a","text":"Sofort Oberärzt:in und Interventionsteam rufen, echogesteuerte Perikardpunktion ohne Verzögerung, Antikoagulation klären, nach der Drainage Echo wiederholen.","bewertung":"richtig","feedback":"Richtig. Neuer Erguss nach Intervention, Kollaps von RA und RV, gestaute VCI und Hypotonie: Tamponade. Bei instabiler Patient:in wird ohne Verzögerung drainiert, bevorzugt per Nadel. Volle Antikoagulation ist ein Risikofaktor für Tamponade und Komplikationen.","q":["esc-perikard-2015"]},{"id":"b","text":"Furosemid i.v. wegen der gestauten Halsvenen.","bewertung":"falsch","feedback":"Die Stauung kommt von der Kompression des Herzens, nicht von Überwässerung. Behandelt wird durch Drainage; eine Entwässerung behebt die Ursache nicht.","q":["esc-perikard-2015"]},{"id":"c","text":"Der Erguss ist nur mittelgroß: Kontrolle in 2 h.","bewertung":"falsch","feedback":"Herr B. ist instabil. Bei rascher Ergussbildung kann schon ein mittelgroßer Erguss tamponieren; Abwarten ist hier gefährlich.","q":["esc-perikard-2015"]},{"id":"d","text":"Zuerst intubieren und beatmen, dann punktieren.","bewertung":"falsch","feedback":"Narkoseeinleitung und Überdruckbeatmung können eine Tamponade verstärken und um die Intubation zum Kreislaufstillstand führen. Die Drainage hat Vorrang.","q":["santangelo-2026"]}],"weiter":"d4"},{"id":"d4","typ":"ende","titel":"Tamponade erkannt und entlastet","text":"Du hast die Tamponadezeichen von bloßen Begleitbefunden getrennt und ohne Verzögerung die Drainage veranlasst.","lernpunkte":["Tamponadezeichen: frühdiastolischer RV-Kollaps, spätdiastolischer RA-Kollaps, gestaute VCI, Atemvariation des Mitraleinstroms über 25 %, schwingendes Herz; klinisch Pulsus paradoxus über 10 mmHg.","Die Geschwindigkeit der Ergussbildung zählt mehr als die Größe; nach Intervention reicht ein nicht großer Erguss.","Unter Überdruckbeatmung sind Atemvariation und VCI wenig aussagekräftig; Tamponade ist dort schon bei kleineren Ergüssen möglich.","Instabile Patient:in mit Tamponade: Drainage ohne Verzögerung, Intubation möglichst vermeiden oder erst nach Entlastung."]}]},{"titel":"Volumenmangel mit enger VCI","patient":{"kurz":"Frau L., 67 J.","alter":67,"geschlecht":"w","vorgeschichte":"IMC, Tag 3 nach Aufnahme wegen kardialer Dekompensation bei Herzinsuffizienz mit erhaltener LVEF. Unter hochdosiertem Schleifendiuretikum 6 kg Gewichtsverlust. Jetzt Schwindel beim Aufsetzen, RR 88/52 mmHg, HF 108/min (Sinus), Kreatinin steigend, spontan atmend, keine Stauung mehr auskultierbar."},"start_knoten":"e1","knoten":[{"id":"e1","typ":"text","titel":"Echo-Befund","text":"LV klein und hyperkontraktil, LVEF visuell 70 %. RV normal. Kein Perikarderguss, keine relevante Klappenerkrankung.\nVCI 0,9 cm, bei ruhiger Atmung und beim Schnüffeln nahezu vollständiger Kollaps.\nLVOT-VTI 12 cm.","weiter":"e2"},{"id":"e2","typ":"wahl","frage":"Wie interpretierst du den Befund, und was folgt daraus?","optionen":[{"id":"a","text":"Kleine, kollabierende VCI: RAP niedrig, passend zu intravasalem Volumenmangel durch die Diurese. Diuretikum pausieren, Volumen in kleinen Portionen geben und die Wirkung prüfen (Klinik, RR, LVOT-VTI im Verlauf).","bewertung":"richtig","feedback":"Richtig. Bei Spontanatmung zeigt eine kleine, kollabierte VCI einen niedrigen RAP und weist auf Volumenmangel hin. Bei Herzinsuffizienz in kleinen Schritten geben und nach jeder Gabe neu beurteilen.","q":["ase-rh-2025"]},{"id":"b","text":"Diuretikum unverändert fortführen, da eine Herzinsuffizienz besteht.","bewertung":"falsch","feedback":"Hypotonie, steigendes Kreatinin und eine kollabierte VCI sprechen für Übertherapie. Die Diurese muss pausiert werden.","q":["ase-rh-2025"]},{"id":"c","text":"Volumen geben, bis die VCI über 2,1 cm misst.","bewertung":"falsch","feedback":"Der VCI-Durchmesser ist kein Therapieziel. Wer bis zur weiten VCI auffüllt, riskiert bei Herzinsuffizienz eine erneute Stauung. Ziel sind Kreislauf und Perfusion.","q":["ase-rh-2025"]},{"id":"d","text":"Das Echo hilft beim Volumenstatus nicht weiter.","bewertung":"falsch","feedback":"Bei Spontanatmung ist die Kombination aus VCI-Durchmesser und Kollaps ein brauchbarer Schätzer des RAP. Ein kleiner, hyperkontraktiler LV ergänzt das Bild.","q":["ase-rh-2025"]}],"weiter":"e3"},{"id":"e3","typ":"text","titel":"Zwei Tage später","text":"Frau L. ist wegen einer Pneumonie intubiert und kontrolliert beatmet. Erneut RR 90/55 mmHg. VCI 2,4 cm, kaum Durchmesserschwankung über den Atemzyklus.","weiter":"e4"},{"id":"e4","typ":"mehrfach","frage":"Frau L. ist jetzt beatmet, VCI 2,4 cm mit kaum Schwankung. Welche Aussagen zur VCI treffen zu?","optionen":[{"text":"Unter Überdruckbeatmung ist der Kollaps nicht verwertbar; ist der RAP wichtig, wird er invasiv gemessen.","richtig":true,"feedback":"Richtig. Die Atemmechanik ist umgekehrt, das Kollapskriterium gilt nur bei Spontanatmung."},{"text":"Eine weite VCI ist unter Beatmung häufig und beweist keinen hohen RAP.","richtig":true,"feedback":"Richtig. Unter Beatmung ist die VCI oft dilatiert und kollabiert nicht; sie wird dort nicht routinemäßig zur RAP-Schätzung genutzt."},{"text":"Eine VCI ≤2,1 cm spricht auch bei Intubierten recht zuverlässig für einen RAP unter 10 mmHg.","richtig":true,"feedback":"Richtig. Das ist die verwertbare Richtung unter Beatmung."},{"text":"Die atemabhängige Durchmesserschwankung der VCI wurde unter Beatmung mit Schwellen zwischen etwa 8 und 21 % untersucht (z. B. 12 % oder 18 %); eine fehlende Schwankung schließt Volumenreagibilität nicht aus.","richtig":true,"feedback":"Richtig. In der Metaanalyse sagte die Variation die Volumenreagibilität nur mäßig voraus, ein negativer Befund schloss sie nicht aus."},{"text":"VCI 2,4 cm ohne Schwankung: RAP 15 mmHg in den Befund schreiben.","richtig":false,"feedback":"Falsch. Die Einteilung in 3, 8 und 15 mmHg gilt für Spontanatmung. Unter Beatmung allenfalls Nebenkriterien nutzen oder invasiv messen."},{"text":"Damit ist eine Volumenreagibilität sicher ausgeschlossen.","richtig":false,"feedback":"Falsch. Fehlende Variation unter Beatmung schließt Volumenreagibilität nicht aus."}],"weiter":"e5"},{"id":"e5","typ":"ende","titel":"VCI im richtigen Kontext gelesen","text":"Du hast die VCI bei Spontanatmung als Hinweis auf Volumenmangel genutzt und unter Beatmung ihre Grenzen erkannt.","lernpunkte":["Spontanatmung: ≤2,1 cm mit Kollaps ≥50 % entspricht RAP 3 mmHg, >2,1 cm mit Kollaps \u003c50 % entspricht 15 mmHg, Mischbilder 8 mmHg (Richtwerte); klein und kollabiert: Volumenmangel wahrscheinlich.","Unter Überdruckbeatmung ist das Kollapskriterium nicht anwendbar; eine weite VCI ist dort häufig. Eine schmale VCI (≤2,1 cm) spricht weiter für niedrigen RAP.","Die VCI ist kein Therapieziel. Volumen in kleinen Schritten geben und die Wirkung am Kreislauf und am SV prüfen."]}]},{"titel":"Akute Mitralinsuffizienz nach Infarkt","patient":{"kurz":"Herr S., 68 J.","alter":68,"geschlecht":"m","vorgeschichte":"Tag 3 nach inferoposteriorem Infarkt mit PCI der RCA. Plötzlich schwere Dyspnoe, feuchte Rasselgeräusche beidseits, RR 84/50 mmHg, HF 118/min, SpO2 86 % unter O2. Neues, eher leises Systolikum."},"start_knoten":"f1","knoten":[{"id":"f1","typ":"text","titel":"Echo-Befund","text":"LV normal groß (LVEDD 50 mm), hyperdynam, LVEF visuell 65 %, inferobasal hypokinetisch.\nPosteriores Mitralsegel schlägt systolisch in den LA durch, an den Sehnenfäden hängt eine mobile Struktur, die systolisch in den LA prolabiert.\nFarbdoppler: exzentrischer, wandständiger Jet, die Jetfläche wirkt nicht groß. CW-Signal dicht, dreieckig, früh gipfelnd. Pulmonalvenen: systolische Flussumkehr.\nLA nicht vergrößert. Kein Perikarderguss, kein Shunt über das Septum. LVOT-VTI 9 cm.","weiter":"f2"},{"id":"f2","typ":"wahl","moderation":"Frage an die Gruppe: Warum wirkt der Farbjet bei akuter schwerer MR oft klein?","frage":"Wie ordnest du den Befund ein?","optionen":[{"id":"a","text":"Akute schwere MR durch Papillarmuskelabriss. Notfall: Oberärzt:in und Herzchirurgie sofort, TEE zur Sicherung, Kreislaufunterstützung als Brücke zur Operation.","bewertung":"richtig","feedback":"Richtig. Durchschlagendes Segel mit mobiler Struktur am Halteapparat, hyperdynamer LV bei kleinem Vorwärtsfluss (LVOT-VTI 9 cm) und systolische Flussumkehr in den Pulmonalvenen sichern die Diagnose, auch wenn der Farbjet klein wirkt. Frühe Operation ist der Eckpfeiler der Behandlung.","q":["zoghbi-2017","pino-2025"]},{"id":"b","text":"Mittelgradige MR, da der Jet klein und der LA normal groß ist. Diuretikum und Verlaufskontrolle.","bewertung":"falsch","feedback":"Bei akuter MR sind LA und LV oft noch normal groß. Hypotonie und hoher LA-Druck senken die Antriebsdruckdifferenz, der Jet ist exzentrisch: Der Farbdoppler unterschätzt die MR deutlich.","q":["zoghbi-2017"]},{"id":"c","text":"Ventrikelseptumruptur.","bewertung":"falsch","feedback":"Auch sie verursacht nach Infarkt ein neues Systolikum und einen Schock und muss gesucht werden. Hier zeigt der Farbdoppler aber keinen Shunt über das Septum, dafür eine mobile Struktur am Mitralapparat."},{"id":"d","text":"Zuerst EROA und Regurgitationsvolumen mit PISA bestimmen; erst bei EROA ≥40 mm² handeln.","bewertung":"falsch","feedback":"Die quantitativen Doppler-Methoden gelten für die chronische MR. Bei Papillarmuskelabriss entscheidet die Anatomie; das Messen kostet Zeit.","q":["zoghbi-2017","pino-2025"]}],"weiter":"f3"},{"id":"f3","typ":"mehrfach","frage":"Welche Aussagen zur akuten schweren MR treffen zu?","optionen":[{"text":"Eine mobile Struktur am Sehnenapparat mit durchschlagendem Segel spricht für einen Papillarmuskelabriss.","richtig":true,"feedback":"Richtig. Die Anatomie ist bei akuter MR der stärkste Befund."},{"text":"Hyperdynamer LV bei kleinem Vorwärtsfluss passt zur akuten schweren MR.","richtig":true,"feedback":"Richtig. Der LV wirft viel Volumen aus, aber ein großer Teil fließt in den LA zurück."},{"text":"Die systolische Flussumkehr in den Pulmonalvenen ist ein spezifisches Zeichen einer schweren MR.","richtig":true,"feedback":"Richtig. Spezifisch, aber nicht sensitiv; andere Ursachen einer Flussumkehr ausschließen."},{"text":"Ein dichtes, dreieckiges, früh gipfelndes CW-Signal spricht für eine große Regurgitationswelle im LA.","richtig":true,"feedback":"Richtig. Der LA-Druck steigt in der Systole rasch an, die Geschwindigkeit fällt früh ab."},{"text":"Der normal große LA spricht gegen eine schwere MR.","richtig":false,"feedback":"Falsch. Bei akuter MR fehlt die Zeit für die Dilatation; LA und LV können normal groß sein."},{"text":"Die kleine Jetfläche im Farbdoppler spricht gegen eine schwere MR.","richtig":false,"feedback":"Falsch. Niedrige Antriebsdruckdifferenz und exzentrischer Jet führen zur Unterschätzung."}],"weiter":"f4"},{"id":"f4","typ":"ende","titel":"Akute schwere MR erkannt","text":"Du hast dich nicht vom kleinen Farbjet und vom normal großen LA täuschen lassen und die Anatomie in den Vordergrund gestellt.","lernpunkte":["Akute schwere MR: Farbjet oft klein und exzentrisch, LA und LV normal groß; Anatomie und hyperdynamer LV bei niedrigem Vorwärtsfluss entscheiden.","Die Doppler-Quantifizierung (EROA, Regurgitationsvolumen) gilt für die chronische MR.","Papillarmuskelabriss meist in der ersten Woche nach Infarkt, häufig zwischen Tag 2 und 6; der posteromediale Papillarmuskel ist 3- bis 12-mal häufiger betroffen, weil er nur aus einem Gefäß versorgt wird (RCA oder RCX).","Transthorakal kann ein partieller Abriss übersehen werden; TEE sichert die Diagnose. Frühe Operation, Kreislaufunterstützung als Brücke."]}]},{"titel":"Dyspnoe bei erhaltener LVEF: Füllungsdrücke","patient":{"kurz":"Frau H., 74 J.","alter":74,"geschlecht":"w","vorgeschichte":"Arterielle Hypertonie, Belastungsdyspnoe, Sinusrhythmus 72/min. Aufnahme auf die IMC zur Abklärung."},"start_knoten":"g1","knoten":[{"id":"g1","typ":"text","titel":"Echo-Befund","text":"LV normal groß, konzentrisch hypertrophiert, LVEF biplan 62 %.\nMitraleinstrom: E 105 cm/s, A 65 cm/s.\nGewebedoppler: e′ septal 5 cm/s, e′ lateral 9 cm/s.\nLAVI 38 ml/m². TR-Vmax 3,1 m/s.\nKeine relevante MR, keine Mitralringverkalkung.","weiter":"g2"},{"id":"g2","typ":"zahl","frage":"Berechne das gemittelte E/e′ aus E 105 cm/s, e′ septal 5 cm/s und e′ lateral 9 cm/s.","einheit":"(dimensionslos)","min":0,"max":30,"schritt":0.1,"start":8,"zielbereich":[14.8,15.2],"feedback_ok":"Richtig. e′ gemittelt = (5 + 9) / 2 = 7 cm/s; E/e′ = 105 / 7 = 15, also über 14. Nur lateral gerechnet (≈ 11,7) fiele der Wert deutlich niedriger aus, nur septal (21) deutlich höher; die Empfehlung nutzt den Mittelwert.","feedback_zu_niedrig":"Zu niedrig. Wurde nur e′ lateral verwendet (105/9 ≈ 11,7)? Gerechnet wird mit dem Mittelwert aus septal und lateral: (5 + 9) / 2 = 7 cm/s.","feedback_zu_hoch":"Zu hoch. Wurde nur e′ septal verwendet (105/5 = 21)? Mittelwert e′ = 7 cm/s, E = 105 cm/s.","weiter":"g3"},{"id":"g3","typ":"wahl","frage":"E/A 1,6; E/e′ gemittelt 15; e′ septal 5 und lateral 9 cm/s; LAVI 38 ml/m²; TR-Vmax 3,1 m/s; LVEF 62 %. Wie ordnest du die diastolische Funktion nach ASE/EACVI 2016 ein?","optionen":[{"id":"a","text":"Diastolische Dysfunktion mit erhöhtem LA-Druck (Grad II).","bewertung":"richtig","feedback":"Richtig. Alle vier Kriterien sind erfüllt (e′ erniedrigt, E/e′ >14, LAVI >34 ml/m², TR-Vmax >2,8 m/s): diastolische Dysfunktion. E/A liegt zwischen 0,8 und 2; alle drei Zusatzkriterien sind positiv: LA-Druck erhöht, Grad II.","q":["nagueh-2016"]},{"id":"b","text":"Normale diastolische Funktion, da E/A zwischen 0,8 und 2 liegt.","bewertung":"falsch","feedback":"Ein E/A in diesem Bereich kann normal oder pseudonormal sein. Erst e′, E/e′, LAVI und TR-Geschwindigkeit trennen beides.","q":["nagueh-2016"]},{"id":"c","text":"Grad III, weil E größer als A ist.","bewertung":"falsch","feedback":"Grad III setzt ein E/A ≥2 voraus. Hier ist E/A 1,6.","q":["nagueh-2016"]},{"id":"d","text":"Nicht beurteilbar, weil die LVEF normal ist.","bewertung":"falsch","feedback":"Gerade bei normaler LVEF ist die diastolische Funktion mit den vier Kriterien gut einzuordnen.","q":["nagueh-2016"]}],"weiter":"g4"},{"id":"g4","typ":"mehrfach","frage":"In welchen Situationen ist E/e′ nach ASE/EACVI 2016 nicht oder nur eingeschränkt verwertbar?","optionen":[{"text":"Mehr als mittelgradige Mitralinsuffizienz","richtig":true,"feedback":"Richtig. Der Algorithmus wird dann nicht angewendet."},{"text":"Mindestens mittelgradige Mitralringverkalkung","richtig":true,"feedback":"Richtig. Die Verkalkung senkt e′ mechanisch und erhöht E/e′."},{"text":"Linksschenkelblock oder RV-Stimulation","richtig":true,"feedback":"Richtig. Die Ringgeschwindigkeiten sind dann weniger aussagekräftig."},{"text":"Konstriktive Perikarditis","richtig":true,"feedback":"Richtig. Bei Konstriktion soll E/e′ nicht zur Schätzung der Füllungsdrücke verwendet werden."},{"text":"Sinusrhythmus 72/min ohne Klappenerkrankung","richtig":false,"feedback":"Falsch. Das ist die Situation, für die der Algorithmus gemacht ist."},{"text":"Vorhofflimmern: E/e′ ist dann überhaupt nicht verwertbar.","richtig":false,"feedback":"Falsch. E/A entfällt, aber ein septales E/e′ ≥11 spricht unter anderem für erhöhte Füllungsdrücke; über mehrere Zyklen mitteln."}],"weiter":"g5"},{"id":"g5","typ":"ende","titel":"Füllungsdruck eingeordnet","text":"Du hast E/e′ korrekt gemittelt und die vier Kriterien nach ASE/EACVI 2016 auf eine Patientin mit erhaltener LVEF angewendet.","lernpunkte":["E/e′ mit dem Mittelwert aus septalem und lateralem e′ berechnen; >14 gilt als erhöht (Richtwert).","Vier Kriterien bei normaler LVEF: e′ septal \u003c7 oder lateral \u003c10 cm/s, E/e′ >14, LAVI >34 ml/m², TR-Vmax >2,8 m/s; mehr als die Hälfte erfüllt: Dysfunktion.","E/A zwischen 0,8 und 2 kann pseudonormal sein; erst die Zusatzkriterien klären den Füllungsdruck.","Grenzen kennen: relevante MR, Mitralringverkalkung, LSB, Stimulation, Konstriktion."]}]},{"titel":"Schwere Trikuspidalinsuffizienz und unterschätzter PA-Druck","patient":{"kurz":"Herr P., 81 J.","alter":81,"geschlecht":"m","vorgeschichte":"Permanentes Vorhofflimmern, ausgeprägte Beinödeme und Aszites. Aufnahme auf die IMC wegen Rechtsherzdekompensation."},"start_knoten":"h1","knoten":[{"id":"h1","typ":"text","titel":"Echo-Befund","text":"LVEF 55 %. RA und RV stark dilatiert (RV basal 52 mm), Septum in der Diastole abgeflacht. TAPSE 15 mm.\nTrikuspidalsegel mit sichtbarem Koaptationsdefekt. Vena contracta 11 mm (biplan), EROA 60 mm².\nCW-Signal dicht, dreieckig, früh gipfelnd; TR-Vmax 2,2 m/s (Mittel aus 8 Zyklen).\nLebervenen: systolische Flussumkehr. VCI 2,4 cm, Kollaps beim Schnüffeln unter 50 %.","weiter":"h2"},{"id":"h2","typ":"zahl","frage":"Berechne den sPAP aus TR-Vmax 2,2 m/s und dem RAP, den du aus der VCI (2,4 cm, Kollaps unter 50 %) ableitest.","einheit":"mmHg","min":0,"max":100,"schritt":1,"start":60,"zielbereich":[34,35],"feedback_ok":"Rechnerisch richtig: 4 × 2,2² = 4 × 4,84 ≈ 19 mmHg, plus RAP 15 mmHg ergibt etwa 34 mmHg. Ob dieser Wert den tatsächlichen Druck abbildet, ist die nächste Frage.","feedback_zu_niedrig":"Zu niedrig. Wurde 4 × 2,2 × 2 statt 4 × 2,2² gerechnet (≈ 33 mmHg) oder der RAP vergessen (≈ 19 mmHg)? Gradient 4 × 4,84 ≈ 19 mmHg, dazu RAP 15 mmHg.","feedback_zu_hoch":"Zu hoch. Wurde (4 × 2,2)² gerechnet (≈ 77 mmHg)? Richtig ist 4 × 2,2² ≈ 19 mmHg, dazu einmal RAP 15 mmHg.","weiter":"h3"},{"id":"h3","typ":"wahl","frage":"Wie interpretierst du den berechneten sPAP von etwa 34 mmHg?","optionen":[{"id":"a","text":"Nicht verwertbar: Bei schwerer TR mit dichtem, dreieckigem, laminarem Signal gleichen sich RV- und RA-Druck früh an, Bernoulli unterschätzt den Gradienten. Der PA-Druck bleibt offen; Rechtsherzkatheter, falls er therapeutisch wichtig ist.","bewertung":"richtig","feedback":"Richtig. Bei Koaptationsdefekt und V-Wellen-Abbruch ist die vereinfachte Bernoulli-Gleichung nicht anwendbar. Die ESC/ERS 2022 empfiehlt ohnehin die TR-Geschwindigkeit, nicht den berechneten sPAP, als Schlüsselgröße, und die PH-Diagnose stellt der Rechtsherzkatheter.","q":["ase-rh-2025","esc-ph-2022"]},{"id":"b","text":"Kein Hinweis auf eine pulmonale Hypertonie, da TR-Vmax unter 2,8 m/s liegt.","bewertung":"falsch","feedback":"Die TR-Geschwindigkeit ist hier wegen der schweren TR nicht aussagekräftig. Ein niedriger Wert schließt in dieser Situation keine PH aus.","q":["ase-rh-2025"]},{"id":"c","text":"Sicher pulmonale Hypertonie, weil der RV stark dilatiert ist.","bewertung":"falsch","feedback":"Die diastolische Septumabflachung spricht für Volumenbelastung, die eine schwere TR selbst erzeugt. Eine Dilatation beweist keine Druckbelastung.","q":["ase-rh-2025"]}],"weiter":"h4"},{"id":"h4","typ":"mehrfach","frage":"Welche Befunde von Herrn P. erfüllen Kriterien einer schweren TR nach ESC/EACTS 2021?","optionen":[{"text":"Vena contracta 11 mm","richtig":true,"feedback":"Richtig. Über 7 mm (bevorzugt biplan) spricht für schwer."},{"text":"EROA 60 mm²","richtig":true,"feedback":"Richtig. Ab 40 mm² schwer. Für noch höhere Schweregrade sind die zusätzlichen Grade massiv und torrentiell vorgeschlagen."},{"text":"Systolische Flussumkehr in den Lebervenen","richtig":true,"feedback":"Richtig. Spezifisches Zeichen einer schweren TR."},{"text":"Dichtes, dreieckiges, früh gipfelndes CW-Signal","richtig":true,"feedback":"Richtig. Zeichen der großen Regurgitationswelle im RA."},{"text":"TR-Vmax 2,2 m/s","richtig":false,"feedback":"Falsch. Die Geschwindigkeit bildet den Druckgradienten ab, nicht den Schweregrad der Insuffizienz."},{"text":"TAPSE 15 mm","richtig":false,"feedback":"Falsch. TAPSE beschreibt die RV-Funktion, nicht die TR. Bei schwerer TR kann sie die RV-Funktion sogar überschätzen."}],"weiter":"h5"},{"id":"h5","typ":"ende","titel":"Grenzen der sPAP-Schätzung erkannt","text":"Du hast korrekt gerechnet und trotzdem erkannt, dass die Zahl bei schwerer TR nicht stimmt.","lernpunkte":["sPAP ≈ 4 × TR-Vmax² + RAP gilt nur bei parabolischem Signal; bei schwerer TR mit laminarem, dreieckigem Signal wird der Gradient unterschätzt.","Schwere TR (Richtwerte): Vena contracta >7 mm, EROA ≥40 mm², Regurgitationsvolumen ≥45 ml, systolische Flussumkehr in den Lebervenen.","Bei Vorhofflimmern die TR-Geschwindigkeit über 5 bis 10 Zyklen mitteln, nicht den höchsten Einzelwert nehmen.","Diastolische Septumabflachung zeigt Volumen-, systolische Druckbelastung."]}]}]},{"id":"bildquiz-ekg","typ":"bildquiz","titel":"EKG-Quiz: Rhythmen erkennen","untertitel":"Synthetische Ein-Kanal-Streifen, vom Sinusrhythmus bis zum Kammerflimmern","gruppe":"Befunde","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"15 min","lernziele":["Häufige Rhythmen auf dem Monitorstreifen erkennen: Sinus-, Vorhof-, Kammer- und Blockrhythmen","Schockbare (Kammerflimmern, pulslose VT) von nicht schockbaren Rhythmen (Asystolie, PEA) trennen","Merkmale wie P-Welle, QRS-Breite und RR-Abstände systematisch ablesen","Wissen, wann ein Rhythmus ein Notfall ist und welche erste Maßnahme folgt"],"quellen":[{"id":"rcuk-als2025","kurz":"RCUK ALS 2025","titel":"Adult advanced life support Guidelines (Resuscitation Council UK, 2025; schockbare und nicht schockbare Rhythmen, Peri-Arrest-Arrhythmien)","url":"https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/adult-advanced-life-support-guidelines","stand":"2025"},{"id":"erc2025","kurz":"ERC 2025","titel":"European Resuscitation Council Guidelines 2025 (Übersichtsseite mit Kapitel Adult advanced life support)","url":"https://www.erc.edu/science-research/guidelines/guidelines-2025/guidelines-2025-english","stand":"2025"},{"id":"erc2021","kurz":"ERC 2021 ALS","titel":"European Resuscitation Council Guidelines 2021: Adult advanced life support (Soar et al., Resuscitation)","url":"https://doi.org/10.1016/j.resuscitation.2021.02.010","stand":"2021"},{"id":"aha-acls2020","kurz":"AHA ACLS 2020","titel":"Part 3: Adult Basic and Advanced Life Support, 2020 American Heart Association Guidelines for CPR and Emergency Cardiovascular Care (Circulation)","url":"https://pubmed.ncbi.nlm.nih.gov/33081529/","stand":"2020"},{"id":"esc-pacing2021","kurz":"ESC Pacing 2021","titel":"2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy (AV-Block, Schenkelblock, Schrittmacher)","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Cardiac-Pacing-and-Cardiac-Resynchronization-Therapy","stand":"2021"},{"id":"esc-va2022","kurz":"ESC VA 2022","titel":"2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Ventricular-Arrhythmias-and-the-prevention-of-sudden-cardiac-death","stand":"2022"},{"id":"esc-acs2023","kurz":"ESC ACS 2023","titel":"2023 ESC Guidelines for the management of acute coronary syndromes","url":"https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/acute-coronary-syndromes/","stand":"2023"},{"id":"esc-af2024","kurz":"ESC VHF 2024","titel":"2024 ESC Guidelines for the management of atrial fibrillation (AF-CARE)","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Atrial-Fibrillation-Management","stand":"2024"},{"id":"litfl-af","kurz":"LITFL VHF","titel":"Atrial Fibrillation, ECG Library (Life in the Fast Lane)","url":"https://litfl.com/atrial-fibrillation-ecg-library/"}],"moderation":"Impulsfragen für den Präsentationsmodus:\n1. Welche der gezeigten Rhythmen sind defibrillierbar, welche nicht? Was machst du jeweils zuerst?\n2. Wie gehst du vor, bevor du eine Nulllinie als Asystolie akzeptierst?\n3. Woran trennst du eine Breitkomplextachykardie (VT) von einem Sinusrhythmus mit Schenkelblock oder von einem Schrittmacherrhythmus?\n4. Welche Tachykardien um 150/min sind verwechselbar (Sinustachykardie, Vorhofflattern mit 2:1-Überleitung), und woran erkennst du den Unterschied?\nStolperstellen: Ein Ein-Kanal-Streifen ersetzt kein 12-Kanal-EKG. Die Streifen sind synthetisch und idealisiert, echte Registrierungen sind unruhiger und mehrdeutiger. Bei den Fragen zum Antippen zeigt die App nach der Antwort alle richtigen Stellen grün.","fragen":[{"id":"f1","bild":{"art":"ekg","rhythmus":"sinus","hf":70,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"Vorhofflimmern","richtig":false},{"text":"Vorhofflattern mit variabler Überleitung","richtig":false},{"text":"Normofrequenter Sinusrhythmus","richtig":true},{"text":"Schrittmacherrhythmus","richtig":false}],"erklaerung":"Vor jedem schmalen QRS-Komplex steht eine P-Welle, die Abstände sind gleichmäßig, die Frequenz liegt zwischen 60 und 100/min.\n**Eselsbrücke:** P, QRS, T, immer in dieser Reihenfolge und im gleichen Takt.\n**Wann Notfall:** Der Rhythmus selbst nie. Entscheidend ist, ob zum Bild ein Patient mit Puls und Perfusion gehört.","merkmale":["P-Welle vor jedem QRS-Komplex","Regelmäßige RR-Abstände","Frequenz 60 bis 100/min","Schmaler QRS-Komplex (unter 120 ms)"]},{"id":"f2","bild":{"art":"ekg","rhythmus":"sinus_tachy","hf":130,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"Sinustachykardie","richtig":true},{"text":"Vorhofflattern mit 2:1-Überleitung","richtig":false},{"text":"Kammertachykardie","richtig":false},{"text":"Vorhofflimmern","richtig":false}],"erklaerung":"Regelmäßige schmale Komplexe mit einer P-Welle vor jedem QRS bei einer Frequenz über 100/min. Die Sinustachykardie ist fast immer ein Symptom, nicht die Diagnose.\n**Eselsbrücke:** Bei der Sinustachykardie die Ursache suchen: Schmerz, Fieber, Volumenmangel, Blutung, Anämie, Hypoxie, Lungenembolie, Sepsis, Hyperthyreose.\n**Wann Notfall:** Wenn sie mit Hypotonie, Schockzeichen oder Hypoxie einhergeht. Dann wird die Ursache behandelt (zum Beispiel Blutung oder Lungenembolie), nicht die Frequenz.","merkmale":["P-Welle vor jedem QRS","Regelmäßig, Frequenz über 100/min (typisch 100 bis 150/min)","Schmaler QRS-Komplex","Frequenz ändert sich allmählich, nicht sprunghaft"]},{"id":"f3","bild":{"art":"ekg","rhythmus":"sinus_brady","hf":42,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Ein Patient unter Betablocker fühlt sich müde. Welcher Rhythmus liegt vor?","optionen":[{"text":"AV-Block III°","richtig":false},{"text":"Vorhofflimmern mit langsamer Überleitung","richtig":false},{"text":"Schrittmacherrhythmus","richtig":false},{"text":"Sinusbradykardie","richtig":true}],"erklaerung":"Vor jedem QRS-Komplex steht eine P-Welle mit konstantem Abstand, die Frequenz liegt unter 60/min.\n**Eselsbrücke:** Brady kommt vom Medikament, vom Vagus oder vom Block: Betablocker, Digoxin, Verapamil oder Diltiazem, Amiodaron, Hypothermie, Hirndruck, Hypothyreose, Hyperkaliämie.\n**Wann Notfall:** Bei Instabilitätszeichen (Schock, Synkope, Myokardischämie, Herzinsuffizienz). Dann Atropin 500 µg i.v., bei Versagen Stimulation oder Katecholamine, Ursache beheben.","merkmale":["P-Welle vor jedem QRS, konstante PQ-Zeit","Regelmäßig, Frequenz unter 60/min","Schmaler QRS-Komplex","Häufig medikamentös oder vagal bedingt"]},{"id":"f4","bild":{"art":"ekg","rhythmus":"vorhofflimmern","hf":130,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"Sinustachykardie","richtig":false},{"text":"Vorhofflimmern","richtig":true},{"text":"Vorhofflattern mit 2:1-Überleitung","richtig":false},{"text":"Kammertachykardie","richtig":false}],"erklaerung":"Die RR-Abstände sind völlig unregelmäßig, es gibt keine erkennbaren P-Wellen, die Grundlinie flimmert.\n**Eselsbrücke:** „Unregelmäßig unregelmäßig, ohne P“: Chaos ohne Takt.\n**Wann Notfall:** Bei schneller Überleitung mit Schock, Synkope, Ischämie oder Herzinsuffizienz ist eine synchronisierte Kardioversion nötig. Sonst Frequenz- oder Rhythmuskontrolle und Antikoagulation anhand des Schlaganfallrisikos (CHA2DS2-VASc) klären.","merkmale":["Absolute Arrhythmie (unregelmäßig unregelmäßig)","Keine erkennbaren P-Wellen","Flimmerwellen an der Grundlinie, oft fein","QRS meist schmal"]},{"id":"f5","bild":{"art":"ekg","rhythmus":"vorhofflattern","hf":150,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Regelmäßige schmale Tachykardie mit etwa 150/min. Welcher Rhythmus liegt vor?","optionen":[{"text":"Sinustachykardie","richtig":false},{"text":"Vorhofflimmern","richtig":false},{"text":"Vorhofflattern mit 2:1-Überleitung","richtig":true},{"text":"Kammertachykardie","richtig":false}],"erklaerung":"Regelmäßige schmale Tachykardie um 150/min mit Sägezahnmuster der Vorhofaktivität (Flatterwellen mit etwa 300/min); jede zweite Welle wird auf die Kammern übergeleitet.\n**Eselsbrücke:** 300 geteilt durch die Überleitung: 2:1 ergibt 150, 3:1 ergibt 100, 4:1 ergibt 75. Eine starre Frequenz um 150/min ist verdächtig auf Flattern.\n**Wann Notfall:** Bei Instabilität synchronisierte Kardioversion. Auch beim Flattern muss über Antikoagulation entschieden werden, wie beim Vorhofflimmern.","merkmale":["Sägezahnmuster der Flatterwellen","Vorhoffrequenz etwa 300/min","Meist feste Überleitung (2:1, 3:1, 4:1)","Kammerfrequenz bei 2:1 häufig um 150/min"]},{"id":"f6","bild":{"art":"ekg","rhythmus":"vt","hf":170,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Ein Patient nach Vorderwandinfarkt klagt über Druck auf der Brust. Welcher Rhythmus liegt vor?","optionen":[{"text":"Monomorphe Kammertachykardie","richtig":true},{"text":"Sinustachykardie","richtig":false},{"text":"Torsade de pointes","richtig":false},{"text":"Kammerflimmern","richtig":false}],"erklaerung":"Regelmäßige Tachykardie mit breiten, gleichförmigen QRS-Komplexen (über 120 ms). Eine regelmäßige Breitkomplextachykardie wird als VT behandelt, bis das Gegenteil belegt ist, besonders nach Infarkt.\n**Eselsbrücke:** Breit, schnell, regelmäßig: VT, bis das Gegenteil bewiesen ist.\n**Wann Notfall:** Immer. Pulslos wird wie Kammerflimmern behandelt (Reanimation, Defibrillation). Mit Puls und Instabilitätszeichen (Schock, Synkope, Ischämie, Herzinsuffizienz): synchronisierte Kardioversion. Stabil: Rücksprache mit dem Oberarzt, Antiarrhythmikum oder elektrische Kardioversion.","merkmale":["Breite QRS-Komplexe (über 120 ms)","Regelmäßig, meist 120 bis 250/min","Keine eindeutigen P-Wellen","Gleichförmige (monomorphe) Komplexe"]},{"id":"f7","bild":{"art":"ekg","rhythmus":"vf","hf":300,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Patient reagiert nicht und atmet nicht. Welcher Rhythmus liegt vor?","optionen":[{"text":"Torsade de pointes","richtig":false},{"text":"Asystolie","richtig":false},{"text":"Muskelartefakt durch Zittern","richtig":false},{"text":"Kammerflimmern","richtig":true}],"erklaerung":"Chaotische, unregelmäßige Ausschläge ohne erkennbare QRS-Komplexe; das Herz pumpt nicht.\n**Eselsbrücke:** Kein Komplex, kein Puls, kein Zögern: schocken.\n**Wann Notfall:** Immer. Sofort Reanimation beginnen, Defibrillator holen, schocken. Nach ERC-Algorithmus folgen 2 Minuten CPR nach jedem Schock; Adrenalin 1 mg und Amiodaron 300 mg nach dem 3. Schock; reversible Ursachen (4 H und 4 T) suchen.","merkmale":["Chaotische Grundlinie ohne QRS-Komplexe","Wechselnde Amplituden (grob bis fein)","Kein Puls, Bewusstlosigkeit","Schockbarer Rhythmus"]},{"id":"f8","bild":{"art":"ekg","rhythmus":"torsade","hf":220,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Eine Patientin hat unter Haloperidol eine QTc-Zeit von 580 ms und ein Kalium von 2,9 mmol/l. Welcher Rhythmus liegt vor?","optionen":[{"text":"Monomorphe Kammertachykardie","richtig":false},{"text":"Torsade de pointes","richtig":true},{"text":"Kammerflimmern","richtig":false},{"text":"Vorhofflimmern mit Schenkelblock","richtig":false}],"erklaerung":"Polymorphe Kammertachykardie, bei der die QRS-Amplitude spindelförmig um die Grundlinie wechselt. Auslöser sind eine verlängerte QT-Zeit, Hypokaliämie, Hypomagnesiämie, Bradykardie und QT-verlängernde Medikamente.\n**Eselsbrücke:** „Spindel“: Die Komplexe tanzen um die Nulllinie. Behandlung nach dem Merksatz Magnesium, Kalium, Medikament absetzen.\n**Wann Notfall:** Pulslos: Defibrillation. Mit Puls: Magnesium 2 g i.v., Kalium ausgleichen (Zielbereich 4,5 bis 5 mmol/l), QT-verlängernde Medikamente stoppen; bei bradykardieabhängiger Torsade nach Rücksprache Stimulation oder Isoprenalin.","merkmale":["Wechselnde (spindelförmige) QRS-Amplitude","Breite Komplexe, sehr schnell (200 bis 250/min)","Zuvor oft verlängerte QT-Zeit und Bradykardie oder Pause","Neigt zu Spontanende, Rezidiv oder Übergang in Kammerflimmern"]},{"id":"f9","bild":{"art":"ekg","rhythmus":"avblock3","hf":36,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Ein Patient wird synkopal. Welcher Rhythmus ist zu sehen?","optionen":[{"text":"Sinusbradykardie","richtig":false},{"text":"AV-Block II° Typ Wenckebach","richtig":false},{"text":"AV-Block III° (totaler AV-Block)","richtig":true},{"text":"Vorhofflimmern mit langsamer Überleitung","richtig":false}],"erklaerung":"Vorhöfe und Kammern schlagen unabhängig voneinander: Die P-Wellen laufen in regelmäßigem Abstand durch, die QRS-Komplexe kommen langsam (30 bis 40/min) und haben keine feste Beziehung zu den P-Wellen. Der Ersatzrhythmus ist breit, wenn er unterhalb des AV-Knotens entsteht.\n**Eselsbrücke:** P und QRS gehen getrennte Wege; die P-Wellen marschieren durch den QRS-Takt hindurch.\n**Wann Notfall:** Bei Synkope, Hypotonie oder Herzinsuffizienz. Atropin 500 µg nur bei schmalem Ersatzrhythmus, nicht bei breitem; sonst transkutane Stimulation als Brücke zum temporären Schrittmacher. Ursachen: Infarkt (vor allem Hinterwand), Medikamente, Hyperkaliämie, nach TAVI, Myokarditis.","merkmale":["P-Wellen und QRS-Komplexe ohne feste Beziehung","P-Frequenz höher als QRS-Frequenz","Langsamer Ersatzrhythmus (meist 30 bis 40/min)","QRS schmal (Ersatz im AV-Knoten) oder breit (unterhalb des AV-Knotens)"]},{"id":"f10","bild":{"art":"ekg","rhythmus":"avblock2_mobitz2","hf":50,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"AV-Block II° Typ Mobitz (Typ II)","richtig":true},{"text":"AV-Block II° Typ Wenckebach (Typ I)","richtig":false},{"text":"AV-Block I°","richtig":false},{"text":"Sinusarrest","richtig":false}],"erklaerung":"Die PQ-Zeit der übergeleiteten Schläge bleibt konstant, gelegentlich fällt ein QRS-Komplex plötzlich aus. Der Block liegt meist unterhalb des AV-Knotens und kann ohne Vorwarnung in einen totalen AV-Block übergehen.\n**Eselsbrücke:** Wenckebach: länger, länger, länger, Pause. Mobitz II: gleich, gleich, gleich, plötzlich weg.\n**Wann Notfall:** Auch ohne Symptome ein Warnsignal: Monitorüberwachung, Klebeelektroden bereithalten, Schrittmacherindikation klären. Bei Synkope oder Bradykardie mit Instabilität handeln wie beim AV-Block III°.","merkmale":["Konstante PQ-Zeit vor dem Ausfall","Plötzlich ausfallender QRS-Komplex nach einer P-Welle","Oft breiter QRS (Block unterhalb des AV-Knotens)","Risiko für den Übergang in einen AV-Block III°"]},{"id":"f11","bild":{"art":"ekg","rhythmus":"schrittmacher","hf":70,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Patient hat vor drei Wochen einen Schrittmacher bekommen. Welcher Rhythmus liegt vor?","optionen":[{"text":"Linksschenkelblock im Sinusrhythmus","richtig":false},{"text":"Schrittmacherrhythmus (Ventrikelstimulation)","richtig":true},{"text":"Monomorphe Kammertachykardie","richtig":false},{"text":"Normofrequenter Sinusrhythmus","richtig":false}],"erklaerung":"Vor dem breiten QRS-Komplex steht ein feiner senkrechter Stimulationsimpuls (Spike). Der Komplex wirkt wie ein Linksschenkelblock, weil die Kammer von der rechten Herzkammer aus erregt wird.\n**Eselsbrücke:** Spike, dann Breitkomplex: Der Schrittmacher klopft an, die Kammer antwortet.\n**Wann Notfall:** Bei Spikes ohne folgenden QRS-Komplex (Capture-Verlust) oder bei fehlenden Spikes trotz langsamer Frequenz (Oversensing). Dann Patient:in beurteilen, Schrittmacherkontrolle veranlassen, bei Instabilität wie bei Bradykardie handeln.","merkmale":["Feiner Stimulationsspike vor dem QRS","Breiter QRS (Linksschenkelblock-ähnlich)","Regelmäßige Frequenz entsprechend der Programmierung","Bei Vorhofstimulation zusätzlich ein Spike vor der P-Welle"]},{"id":"f12","bild":{"art":"ekg","rhythmus":"schenkelblock","hf":78,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Befund passt zum Streifen?","optionen":[{"text":"Sinusrhythmus mit schmalem QRS","richtig":false},{"text":"Kammertachykardie","richtig":false},{"text":"Idioventrikulärer Rhythmus","richtig":false},{"text":"Sinusrhythmus mit Schenkelblock","richtig":true}],"erklaerung":"Sinusrhythmus mit P-Wellen, aber einem verbreiterten QRS-Komplex (über 120 ms), weil die Erregung eine Kammer verzögert erreicht.\n**Eselsbrücke:** Mehr als drei kleine Kästchen (120 ms bei 25 mm/s) sind breit; mit P-Welle davor und normaler Frequenz ist es ein Block, keine VT. Zur Seite im 12-Kanal-EKG: WiLLiaM (Linksschenkelblo
