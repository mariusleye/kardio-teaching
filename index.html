  --slate-750: #1D293D; /* app main background */
  --slate-700: #334155;
  --slate-600: #475569;
  --slate-500: #64748B;
  --slate-400: #94A3B8;
  --slate-300: #CBD5E1;
  --slate-200: #E2E8F0;
  --slate-100: #F1F5F9;
  --slate-50:  #F8FAFC;
  --white:     #FFFFFF;
  --black:     #05070C;

  /* -- Action / interactive (product control colour) ------- */
  /* The live MedApe app uses this indigo for primary controls. */
  --indigo:       #615FFF;
  --indigo-hover: #4F46E5;
  --indigo-press: #4338CA;
  --indigo-soft:  #EEF0FF;

  /* -- Semantic status ------------------------------------- */
  --info:      #2E9BD6;
  --info-fg:   #93C5FD;
  --info-bg:   #234062; /* on dark surfaces */
  --info-bg-light: #EFF6FF;
  --info-border-light: #BFDBFE;

  --warning:   #FDC246; /* disclaimer amber */
  --warning-fg:#FDE68A;
  --warning-bg:#4A5435; /* amber wash over dark surface */
  --warning-bg-light: #FEF6E0;
  --warning-border-light: #FCD980;

  --success:   #22C55E;
  --success-bg-light: #ECFDF3;
  --success-border-light: #A7F3C9;

  --danger:    #EF4444;
  --danger-bg-light: #FEF2F2;
  --danger-border-light: #FCA5A5;

  /* ========================================================
     SEMANTIC ALIASES — default (LIGHT) theme
     Used by slides, marketing, foundation cards, docs.
     ======================================================== */
  --surface-page:     var(--white);
  --surface-card:     var(--white);
  --surface-sunken:   var(--slate-50);
  --surface-raised:   var(--white);
  --surface-inverse:  var(--slate-900);  /* navy card on light (deck stat cards) */
  --surface-inverse-2:var(--slate-850);

  --border:           var(--slate-200);
  --border-strong:    var(--slate-300);
  --border-inverse:   rgba(255,255,255,0.10);

  --text-strong:      var(--slate-900);
  --text-body:        var(--slate-800);
  --text-muted:       var(--slate-500);
  --text-subtle:      var(--slate-400);
  --text-on-inverse:  var(--white);
  --text-on-inverse-muted: var(--slate-400);
  --text-link:        var(--medape-blue);

  --accent:           var(--medape-orange); /* brand accent */
  --accent-contrast:  var(--white);
  --action:           var(--indigo);        /* primary interactive */
  --action-contrast:  var(--white);

  --focus-ring:        0 0 0 3px rgba(246,128,30,0.35);
  --focus-ring-action: 0 0 0 3px rgba(97,95,255,0.40);
}

/* ==========================================================
   DARK theme — the MedApe product surface (Streamlit app).
   Apply with class .theme-dark or attribute [data-theme="dark"].
   ========================================================== */
.theme-dark,
[data-theme="dark"] {
  --surface-page:     var(--slate-750); /* #1D293D */
  --surface-card:     var(--slate-900); /* textareas / panels */
  --surface-sunken:   #0B1120;          /* sidebar */
  --surface-raised:   #24344D;
  --surface-inverse:  var(--white);
  --surface-inverse-2:var(--slate-100);

  --border:           var(--slate-700);
  --border-strong:    var(--slate-600);
  --border-inverse:   rgba(255,255,255,0.10);

  --text-strong:      var(--slate-100);
  --text-body:        var(--slate-300);
  --text-muted:       var(--slate-400);
  --text-subtle:      var(--slate-500);
  --text-on-inverse:  var(--slate-900);
  --text-on-inverse-muted: var(--slate-600);
  --text-link:        var(--medape-blue-light);

  --accent:           var(--medape-orange);
  --accent-contrast:  var(--white);
  --action:           var(--indigo);
  --action-contrast:  var(--white);

  --info-bg:          #234062;
  --warning-bg:       #4A5435;
}

/* ============================================================
   MedApe — Typography
   Brand face: Hanken Grotesk (see fonts.css for rationale).
   Mono for dosage codes & BMP XML.
   ============================================================ */

:root {
  /* -- Families -------------------------------------------- */
  --font-brand:  "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-sans:   var(--font-brand);
  --font-display:var(--font-brand);
  --font-mono:   "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* -- Type scale (rem @ 16px root) ------------------------ */
  --text-2xs:  0.6875rem; /* 11 — micro labels */
  --text-xs:   0.75rem;   /* 12 — captions, help text */
  --text-sm:   0.875rem;  /* 14 — secondary UI text */
  --text-base: 1rem;      /* 16 — body */
  --text-md:   1.0625rem; /* 17 — comfortable body */
  --text-lg:   1.25rem;   /* 20 — lead / section label */
  --text-xl:   1.5rem;    /* 24 — card titles */
  --text-2xl:  1.875rem;  /* 30 — H2 */
  --text-3xl:  2.25rem;   /* 36 — page title */
  --text-4xl:  3rem;      /* 48 — slide title */
  --text-5xl:  3.75rem;   /* 60 — hero */
  --text-6xl:  4.5rem;    /* 72 — big deck stat */
  --text-7xl:  5.5rem;    /* 88 — display stat */

  /* -- Weights --------------------------------------------- */
  --fw-light:     300; /* @kind font */
  --fw-regular:   400; /* @kind font */
  --fw-medium:    500; /* @kind font */
  --fw-semibold:  600; /* @kind font */
  --fw-bold:      700; /* @kind font */
  --fw-extrabold: 800; /* @kind font */

  /* -- Line heights ---------------------------------------- */
  --leading-none:    1;
  --leading-tight:   1.1;
  --leading-snug:    1.25;
  --leading-normal:  1.5;
  --leading-relaxed: 1.6;

  /* -- Letter spacing -------------------------------------- */
  --tracking-tighter: -0.03em; /* big display numbers */
  --tracking-tight:   -0.015em;/* headings */
  --tracking-normal:  0;
  --tracking-wide:    0.02em;
  --tracking-label:   0.08em;  /* uppercase micro-labels */

  /* -- Semantic roles -------------------------------------- */
  --title-page:      var(--fw-light)    var(--text-3xl)/var(--leading-tight) var(--font-display);
  --title-slide:     var(--fw-bold)     var(--text-4xl)/var(--leading-tight) var(--font-display);
  --title-card:      var(--fw-semibold) var(--text-xl)/var(--leading-snug)  var(--font-display);
  --label-eyebrow:   var(--fw-semibold) var(--text-xs)/1.2 var(--font-sans);
}

/* ============================================================
   MedApe — Spacing  (4px base grid)
   ============================================================ */

:root {
  --space-0:  0;
  --space-px: 1px;
  --space-1:  0.25rem;  /* 4  */
  --space-2:  0.5rem;   /* 8  */
  --space-3:  0.75rem;  /* 12 */
  --space-4:  1rem;     /* 16 */
  --space-5:  1.25rem;  /* 20 */
  --space-6:  1.5rem;   /* 24 */
  --space-7:  1.75rem;  /* 28 */
  --space-8:  2rem;     /* 32 */
  --space-10: 2.5rem;   /* 40 */
  --space-12: 3rem;     /* 48 */
  --space-14: 3.5rem;   /* 56 */
  --space-16: 4rem;     /* 64 */
  --space-20: 5rem;     /* 80 */
  --space-24: 6rem;     /* 96 */
  --space-32: 8rem;     /* 128 */

  /* -- Semantic spacing ------------------------------------ */
  --gap-inline:   var(--space-2);  /* icon ↔ label */
  --gap-control:  var(--space-3);  /* between form controls */
  --pad-control:  var(--space-3);  /* inner padding of inputs/buttons */
  --pad-card:     var(--space-6);  /* card interior */
  --pad-section:  var(--space-12); /* page section rhythm */
  --page-gutter:  var(--space-8);  /* page/app content gutter */

  /* -- Layout ---------------------------------------------- */
  --sidebar-w:      320px;  /* MedApe app sidebar */
  --content-max:    1180px; /* app content column cap */
  --tap-min:        44px;   /* min interactive target */
  --control-h-sm:   32px;
  --control-h-md:   40px;
  --control-h-lg:   48px;
}

/* ============================================================
   MedApe — Radii
   Product surfaces & deck cards favour calm, medium rounding.
   ============================================================ */

:root {
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:   8px;   /* buttons, inputs, tabs */
  --radius-lg:   12px;  /* cards, banners, panels */
  --radius-xl:   16px;  /* logo card, large panels */
  --radius-2xl:  24px;  /* hero / feature surfaces */
  --radius-pill: 999px; /* badges, chips */
  --radius-full: 9999px;

  /* -- Border widths --------------------------------------- */
  --border-w:        1px;
  --border-w-strong: 1.5px;
  --accent-bar:      4px;  /* orange left / bottom accent bar */
}

/* ============================================================
   MedApe — Elevation & Shadows
   The brand runs mostly flat (dark UI, flat deck cards). Shadows
   are reserved for lifted surfaces (logo card, dialogs, menus).
   ============================================================ */

:root {
  --shadow-xs:  0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-sm:  0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md:  0 4px 12px rgba(15, 23, 42, 0.10);
  --shadow-lg:  0 12px 32px rgba(15, 23, 42, 0.14);
  --shadow-xl:  0 24px 56px rgba(15, 23, 42, 0.20);

  /* Lift on dark surfaces (deeper, cooler) */
  --shadow-dark-md: 0 6px 20px rgba(2, 6, 23, 0.45);
  --shadow-dark-lg: 0 18px 48px rgba(2, 6, 23, 0.55);

  /* Focus rings (see colors.css for the source values) */
  --ring-accent: var(--focus-ring);
  --ring-action: var(--focus-ring-action);

  /* Inset used on dark inputs to read as "sunken" */
  --inset-field: inset 0 1px 2px rgba(2, 6, 23, 0.35);
}

/* Kardio Teaching, App-Styles auf Basis der MedApe-Tokens (tokens.css) */
:root {
  color-scheme: light;
  --app-bg: var(--slate-100);
  --mon-bg: #05070C;
  --mon-panel: #0B1120;
  --mon-grid: #12301f;
  --c-ekg: #22C55E;
  --c-abp: #EF4444;
  --c-spo2: #2E9BD6;
  --c-af: #E2E8F0;
  --c-temp: #FDC246;
  --fb-richtig-bg: var(--success-bg-light);
  --fb-richtig-bd: var(--success-border-light);
  --fb-richtig-fg: #166534;
  --fb-akz-bg: var(--warning-bg-light);
  --fb-akz-bd: var(--warning-border-light);
  --fb-akz-fg: #854D0E;
  --fb-falsch-bg: var(--danger-bg-light);
  --fb-falsch-bd: var(--danger-border-light);
  --fb-falsch-fg: #991B1B;
  --font-scale: 1;
}
[data-theme="dark"] {
  color-scheme: dark;
  --app-bg: #0B1120;
  --fb-richtig-bg: #0f2a1d; --fb-richtig-bd: #166534; --fb-richtig-fg: #86efac;
  --fb-akz-bg: #2d2610; --fb-akz-bd: #854D0E; --fb-akz-fg: #fde68a;
  --fb-falsch-bg: #2f1517; --fb-falsch-bd: #991B1B; --fb-falsch-fg: #fca5a5;
  --info-bg-light: #172a45; --info-border-light: #234062;
  --warning-bg-light: #2d2610; --warning-border-light: #854D0E;
}
* { box-sizing: border-box; }
html { font-size: calc(16px * var(--font-scale)); -webkit-text-size-adjust: 100%; }
html.modus-praesi { --font-scale: 1.22; }
body {
  overflow-wrap: anywhere;
  margin: 0; background: var(--app-bg); color: var(--text-body);
  font: var(--fw-regular) var(--text-base)/var(--leading-normal) var(--font-sans);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { color: var(--text-strong); margin: 0; letter-spacing: var(--tracking-tight); line-height: var(--leading-snug); }
h1 { font-weight: var(--fw-light); font-size: var(--text-3xl); }
h2 { font-weight: var(--fw-semibold); font-size: var(--text-xl); }
h3 { font-weight: var(--fw-semibold); font-size: var(--text-lg); }
h4 { font-weight: var(--fw-semibold); font-size: var(--text-base); }
p { margin: 0 0 var(--space-3); }
a { color: var(--text-link); }
button { font: inherit; color: inherit; }
.eyebrow { font: var(--label-eyebrow); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); }
.muted { color: var(--text-muted); }
.small { font-size: var(--text-sm); }
.xs { font-size: var(--text-xs); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: none; box-shadow: var(--focus-ring-action); border-radius: var(--radius-sm); }

/* Layout */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); grid-template-rows: auto 1fr auto; min-height: 100vh; }
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4);
  background: var(--surface-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: center; gap: var(--space-3); background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
.brand img { height: 40px; width: auto; display: block; }
.brand b { font-weight: var(--fw-semibold); font-size: var(--text-lg); color: var(--text-strong); letter-spacing: var(--tracking-tight); }
.brand b span { color: var(--medape-orange); }
.spacer { flex: 1; }
.sidebar { background: var(--surface-card); border-right: 1px solid var(--border); padding: var(--space-4); overflow-y: auto; height: calc(100vh - 88px); position: sticky; top: 56px; align-self: start; }
.main { padding: var(--space-6) var(--page-gutter) var(--space-12); min-width: 0; }
.main > .wrap { max-width: var(--content-max); margin: 0 auto; }
.footbar { grid-column: 1 / -1; position: sticky; bottom: 0; z-index: 40; }
.footbar summary { cursor: pointer; list-style: none; }
.footbar summary::-webkit-details-marker { display: none; }
.footbar .mehr { text-decoration: underline; margin-left: 4px; }
.footbar details[open] .mehr { display: none; }
.nav-group { margin-bottom: var(--space-4); }
.nav-group .eyebrow { display: block; margin: 0 0 var(--space-2) var(--space-2); }
.nav-item {
  display: flex; align-items: center; gap: var(--space-2); width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); color: var(--text-body); font-size: var(--text-sm);
  min-height: 36px;
}
.nav-item:hover { background: var(--surface-sunken); }
.nav-item[aria-current="page"] { background: var(--indigo-soft); color: var(--indigo-press); font-weight: var(--fw-semibold); }
[data-theme="dark"] .nav-item[aria-current="page"] { background: #232a52; color: #c7d2fe; }
.nav-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); flex: none; }
.lock-card { border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); padding: var(--space-3); font-size: var(--text-sm); }
.lock-card input { width: 100%; margin: var(--space-2) 0; }
.menu-btn { display: none; }
html.modus-praesi .sidebar { display: none; }
html.modus-praesi .app { grid-template-columns: minmax(0, 1fr); }
html.modus-praesi .menu-btn { display: inline-flex; }
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; position: fixed; inset: 56px 0 0 0; z-index: 30; max-height: none; border-right: 0; }
  html.nav-offen .sidebar { display: block; }
  .menu-btn { display: inline-flex; }
  .main { padding: var(--space-4) 16px var(--space-10); }
  .brand b { display: none; }
}

/* Buttons und Kleinteile */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--gap-inline); min-height: var(--control-h-md);
  padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer;
  font-weight: var(--fw-semibold); font-size: var(--text-sm); background: var(--action); color: var(--action-contrast);
  transition: background 120ms ease, transform 120ms ease;
}
.btn:hover { background: var(--indigo-hover); }
.btn:active { transform: translateY(0.5px); background: var(--indigo-press); }
.btn.sek { background: var(--surface-card); color: var(--text-strong); border-color: var(--border-strong); }
.btn.sek:hover { background: var(--surface-sunken); }
.btn.sek[aria-pressed="true"] { background: var(--medape-navy); color: #fff; border-color: var(--medape-navy); }
.btn.ghost { background: none; color: var(--text-body); }
.btn.ghost:hover { background: var(--surface-sunken); }
.btn.gross { min-height: var(--control-h-lg); padding: 0 var(--space-6); font-size: var(--text-base); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn svg, .icon { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-md); overflow: hidden; background: var(--surface-card); }
.seg button { border: 0; background: none; cursor: pointer; padding: 0 var(--space-3); min-height: 34px; font-size: var(--text-sm); color: var(--text-body); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--medape-navy); color: #fff; font-weight: var(--fw-semibold); }
.badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--fw-semibold); background: var(--surface-sunken); color: var(--text-muted); border: 1px solid var(--border); }
.badge.entwurf { background: var(--warning-bg-light); color: var(--fb-akz-fg); border-color: var(--warning-border-light); }
.badge.haus { background: var(--info-bg-light); color: var(--medape-blue); border-color: var(--info-border-light); }
.badge.fehl { background: var(--fb-falsch-bg); color: var(--fb-falsch-fg); border-color: var(--fb-falsch-bd); }
.badge.ok { background: var(--fb-richtig-bg); color: var(--fb-richtig-fg); border-color: var(--fb-richtig-bd); }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); background: var(--surface-sunken); border: 1px solid var(--border); color: var(--text-muted); }
.chip.zeit { background: var(--medape-navy); color: #fff; border-color: var(--medape-navy); font-weight: var(--fw-semibold); }

.card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); margin-bottom: var(--space-4); }
.card.akzent { border-left: var(--accent-bar) solid var(--accent); }
.card h2 + p, .card h3 + p { margin-top: var(--space-2); }
.grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.stack > * + * { margin-top: var(--space-3); }
.alert { border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); background: var(--surface-sunken); font-size: var(--text-sm); }
.alert.info { background: var(--info-bg-light); border-color: var(--info-border-light); }
.alert.warn { background: var(--warning-bg-light); border-color: var(--warning-border-light); }
.alert.richtig { background: var(--fb-richtig-bg); border-color: var(--fb-richtig-bd); color: var(--fb-richtig-fg); }
.alert.akzeptabel { background: var(--fb-akz-bg); border-color: var(--fb-akz-bd); color: var(--fb-akz-fg); }
.alert.falsch { background: var(--fb-falsch-bg); border-color: var(--fb-falsch-bd); color: var(--fb-falsch-fg); }
.alert strong { color: inherit; }
.moderation { border-left: 4px solid var(--indigo); background: var(--indigo-soft); color: #312e81; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); font-size: var(--text-sm); margin: var(--space-3) 0; }
[data-theme="dark"] .moderation { background: #232a52; color: #c7d2fe; }
html:not(.modus-praesi) .moderation { display: none; }
html.modus-praesi .nur-selbst { display: none; }
.nur-praesi { display: none !important; }
html.modus-praesi .nur-praesi { display: flex !important; }
.vorhersage { gap: 8px; align-items: center; margin: 8px 0; }
.footbar .hinweis {
  background: var(--warning-bg-light); border-top: 1px solid var(--warning-border-light); color: var(--fb-akz-fg);
  font-size: var(--text-xs); padding: var(--space-2) var(--space-4); line-height: 1.4;
}
[data-theme="dark"] .footbar .hinweis { color: var(--warning-fg); }
.footbar .hinweis b { font-weight: var(--fw-semibold); }

/* Kopf einer Modulseite */
.modul-kopf { margin-bottom: var(--space-5); }
.modul-kopf .row { margin-bottom: var(--space-2); }
.modul-kopf p.lead { font-size: var(--text-md); color: var(--text-muted); margin-top: var(--space-2); }
ul.klar { margin: var(--space-2) 0 0; padding-left: 1.2em; }
ul.klar li { margin: 4px 0; }
.quellen-liste { font-size: var(--text-sm); }
.quellen-liste li { margin: 4px 0; }
.q-chip { font-size: var(--text-xs); color: var(--text-muted); margin-left: 6px; }

/* Tabs */
.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); margin-bottom: var(--space-5); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: var(--space-3) var(--space-4); cursor: pointer; color: var(--text-muted); font-weight: var(--fw-medium); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text-strong); border-bottom-color: var(--accent); font-weight: var(--fw-semibold); }

/* Auswahloptionen */
.opts { display: grid; gap: var(--space-2); margin: var(--space-3) 0; }
.opt {
  display: flex; gap: var(--space-3); align-items: flex-start; text-align: left; width: 100%; padding: var(--space-3) var(--space-4);
  background: var(--surface-card); border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); cursor: pointer; font-size: var(--text-base);
}
.opt:hover:not([disabled]) { border-color: var(--action); background: var(--surface-sunken); }
.opt[disabled] { cursor: default; }
.opt .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-top: 1px; }
.opt.kasten .mark { border-radius: 6px; }
.opt.gewaehlt { border-color: var(--action); box-shadow: var(--focus-ring-action); }
.opt.gewaehlt .mark { background: var(--action); border-color: var(--action); color: #fff; }
.opt.richtig { background: var(--fb-richtig-bg); border-color: var(--fb-richtig-bd); }
.opt.akzeptabel { background: var(--fb-akz-bg); border-color: var(--fb-akz-bd); }
.opt.falsch { background: var(--fb-falsch-bg); border-color: var(--fb-falsch-bd); }
.opt.empfohlen { box-shadow: 0 0 0 2px var(--success); }
.opt.gedimmt { opacity: 0.55; }
.opt .t { flex: 1; }
.opt .fb { display: block; font-size: var(--text-sm); margin-top: 6px; color: var(--text-muted); }

/* Fall */
.fall-kopf { display: grid; gap: var(--space-4); grid-template-columns: 1fr; margin-bottom: var(--space-4); }
@media (min-width: 1280px) { .fall-kopf.mit-monitor { grid-template-columns: minmax(260px, 340px) 1fr; } }
.patient-card h3 { margin-bottom: var(--space-1); }
.fortschritt { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: var(--space-4); }
.fortschritt i { display: block; height: 100%; background: var(--accent); transition: width 200ms ease; }
.ergebnis-liste { display: grid; gap: var(--space-2); margin-top: var(--space-3); }
.ergebnis { border-left: 4px solid var(--medape-blue); padding: var(--space-2) var(--space-3); background: var(--surface-sunken); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.ergebnis b { display: block; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); }
.chips-wahl { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-3) 0; }
.chips-wahl .opt { width: auto; padding: var(--space-2) var(--space-3); }
.sort-pool, .sort-folge { display: grid; gap: var(--space-2); margin: var(--space-3) 0; }
.sort-folge .opt { align-items: center; }
.num { flex: none; min-width: 26px; height: 26px; border-radius: 13px; background: var(--medape-navy); color: #fff; font-size: var(--text-xs); font-weight: var(--fw-bold); display: inline-flex; align-items: center; justify-content: center; }
.zahlfeld { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin: var(--space-4) 0; }
.zahlfeld input[type=range] { flex: 1; min-width: 180px; accent-color: var(--action); height: 28px; }
input[type=number], input[type=text], input[type=password] {
  min-height: var(--control-h-md); padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--border-strong);
  background: var(--surface-card); color: var(--text-strong); font: inherit;
}
.zahl-gross { font-size: var(--text-2xl); font-weight: var(--fw-light); min-width: 5ch; }
.zuordnen-zeile { display: grid; gap: var(--space-2); padding: var(--space-3) 0; border-bottom: 1px solid var(--border); }
.zuordnen-zeile:last-child { border-bottom: 0; }
.kat-btns { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.kat-btns button { border: 1.5px solid var(--border-strong); background: var(--surface-card); border-radius: var(--radius-pill); padding: 4px 12px; cursor: pointer; font-size: var(--text-sm); }
.kat-btns button[aria-pressed="true"] { background: var(--action); color: #fff; border-color: var(--action); }
.kat-btns button.richtig { background: var(--fb-richtig-bg); border-color: var(--success); color: var(--fb-richtig-fg); }
.kat-btns button.falsch { background: var(--fb-falsch-bg); border-color: var(--danger); color: var(--fb-falsch-fg); }
.zusammenfassung td, .zusammenfassung th { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: var(--text-sm); }
.zusammenfassung { border-collapse: collapse; width: 100%; }
.score { font-size: var(--text-4xl); font-weight: var(--fw-light); color: var(--text-strong); line-height: 1; }

/* Monitor */
.mon { background: var(--mon-bg); border-radius: var(--radius-lg); overflow: hidden; display: grid; grid-template-columns: 1fr 132px; color: #fff; position: relative; border: 1px solid #1e293b; }
.mon canvas { display: block; width: 100%; background: var(--mon-bg); }
.mon .kurven { display: grid; position: relative; }
.mon .num-spalte { background: var(--mon-panel); border-left: 1px solid #1e293b; display: grid; grid-template-rows: repeat(4, 1fr); }
.mon .num-spalte > div { padding: 6px 10px; border-bottom: 1px solid #1e293b; display: flex; flex-direction: column; justify-content: center; }
.mon .num-spalte > div:last-child { border-bottom: 0; }
.mon .lbl { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.mon .val { font-family: var(--font-mono); font-weight: 500; font-size: 30px; line-height: 1; letter-spacing: -0.02em; }
.mon .val small { font-size: 12px; font-weight: 400; margin-left: 4px; opacity: 0.8; }
.mon .hf .val { color: var(--c-ekg); }
.mon .abp .val { color: var(--c-abp); }
.mon .abp .val.klein { font-size: 20px; }
.mon .spo2 .val { color: var(--c-spo2); }
.mon .af .val, .mon .temp .val { color: var(--c-af); }
.mon .alarm { position: absolute; left: 0; right: 132px; top: 0; padding: 4px 12px; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; background: #b91c1c; color: #fff; animation: blink 0.9s steps(2, start) infinite; z-index: 2; }
@keyframes blink { 50% { opacity: 0.35; } }
.mon.kompakt { grid-template-columns: 1fr 100px; }
.mon.kompakt .val { font-size: 22px; }
.mon.kompakt .alarm { right: 100px; font-size: 11px; }
@media (max-width: 560px) { .mon, .mon.kompakt { grid-template-columns: 1fr; } .mon.kompakt .alarm { right: 0; } .seg button span { display: none; } .seg button { padding: 0 var(--space-3); } .mon .num-spalte { grid-template-columns: repeat(4, 1fr); grid-template-rows: auto; border-left: 0; border-top: 1px solid #1e293b; } .mon .num-spalte > div { border-bottom: 0; border-right: 1px solid #1e293b; } .mon .val { font-size: 22px; } .mon .alarm { right: 0; } }
.ekg-wrap { background: #fffdf9; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
[data-theme="dark"] .ekg-wrap { background: #fffdf9; }
.ekg-wrap canvas { display: block; width: 100%; cursor: crosshair; }

/* Sandkasten */
.sb-grid { display: grid; gap: var(--space-4); grid-template-columns: 1fr; }
@media (min-width: 1280px) { .sb-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
.kpi-reihe { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); }
.kpi { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); border-bottom: 4px solid var(--border-strong); }
.kpi .l { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); font-weight: var(--fw-semibold); }
.kpi .v { font-size: var(--text-xl); font-weight: var(--fw-light); color: var(--text-strong); font-family: var(--font-mono); line-height: 1.2; }
.kpi .v small { font-size: var(--text-xs); color: var(--text-muted); }
.kpi.ok { border-bottom-color: var(--success); }
.kpi.warn { border-bottom-color: var(--warning); }
.kpi.krit { border-bottom-color: var(--danger); }
.regler { display: grid; gap: var(--space-3); }
.regler label { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--space-3); font-size: var(--text-sm); }
.regler label span.w { font-family: var(--font-mono); font-weight: 500; color: var(--text-strong); }
.regler input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--action); height: 26px; }
.regler .hinweis { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--text-muted); margin-top: -2px; }
.ziel { display: flex; gap: var(--space-2); align-items: center; font-size: var(--text-sm); padding: 4px 0; }
.ziel .h { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.ziel.erreicht .h { background: var(--success); border-color: var(--success); color: #fff; }
.plot { width: 100%; height: auto; display: block; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.plot text { fill: var(--text-muted); font-size: 11px; font-family: var(--font-sans); }

/* Triage */
.bett-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.bett { position: relative; cursor: pointer; border: 2px solid transparent; border-radius: var(--radius-lg); padding: 0; background: none; text-align: left; }
.bett .rang { position: absolute; right: -6px; top: -10px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 18px; display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-md); }
.bett.gewaehlt .rang { display: flex; }
.bett.gewaehlt { border-color: var(--accent); }
.bett .meta { padding: var(--space-2) var(--space-1) 0; font-size: var(--text-sm); }
.bett .meta b { color: var(--text-strong); }
.bett.richtig { border-color: var(--success); }
.bett.falsch { border-color: var(--danger); }
.fortschritt.zeit i { background: var(--danger); transition: none; }

/* ISBAR */
.karte { display: grid; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 1.5px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-card); margin-bottom: var(--space-2); }
.karte.richtig { border-color: var(--success); background: var(--fb-richtig-bg); }
.karte.falsch { border-color: var(--danger); background: var(--fb-falsch-bg); }
.karte.luecke { border-color: var(--warning); background: var(--fb-akz-bg); }
.buchstaben { display: flex; gap: 6px; flex-wrap: wrap; }
.buchstaben button { min-width: 40px; min-height: 36px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong); background: var(--surface-card); font-weight: var(--fw-semibold); cursor: pointer; }
.buchstaben button[aria-pressed="true"] { background: var(--medape-navy); color: #fff; border-color: var(--medape-navy); }
.buchstaben button.soll { box-shadow: 0 0 0 2px var(--success); }
.muster dt { font-weight: var(--fw-bold); color: var(--medape-orange-dark); margin-top: var(--space-2); }
.muster dd { margin: 2px 0 0; }

/* Startseite */
.hero { display: grid; gap: var(--space-6); grid-template-columns: 1fr; align-items: center; padding: var(--space-6) 0 var(--space-8); }
@media (min-width: 800px) { .hero { grid-template-columns: 1.3fr 1fr; } }
.hero img { width: 100%; max-width: 360px; height: auto; justify-self: center; }
.hero h1 { font-size: var(--text-4xl); font-weight: var(--fw-light); }
.hero h1 b { font-weight: var(--fw-bold); color: var(--medape-orange); }
.modul-karte { text-align: left; cursor: pointer; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); display: grid; gap: var(--space-2); border-left: var(--accent-bar) solid var(--accent); transition: box-shadow 120ms ease, transform 120ms ease; }
.modul-karte:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.modul-karte h3 { font-size: var(--text-md); }
.gruppe-titel { margin: var(--space-6) 0 var(--space-3); }
.schema-svg { width: 100%; max-width: 920px; height: auto; display: block; margin: var(--space-3) auto; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.schema-svg text { fill: var(--text-body); font-size: 13px; font-family: var(--font-sans); }
.merkkarte ol { padding-left: 1.4em; } .merkkarte li { margin: 6px 0; }
@media print {
  .footbar { position: static; }
  .footbar details > div { display: block !important; }
  .topbar, .sidebar, .tabs, .btn, .no-print { display: none !important; }
  .app { display: block; } body { background: #fff; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>

cal-Practice-Guidelines/Cardiac-Pacing-and-Cardiac-Resynchronization-Therapy","stand":"2021"},{"id":"esc-va2022","kurz":"ESC VA 2022","titel":"2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Ventricular-Arrhythmias-and-the-prevention-of-sudden-cardiac-death","stand":"2022"},{"id":"esc-acs2023","kurz":"ESC ACS 2023","titel":"2023 ESC Guidelines for the management of acute coronary syndromes","url":"https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/acute-coronary-syndromes/","stand":"2023"},{"id":"esc-af2024","kurz":"ESC VHF 2024","titel":"2024 ESC Guidelines for the management of atrial fibrillation (AF-CARE)","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Atrial-Fibrillation-Management","stand":"2024"},{"id":"litfl-af","kurz":"LITFL VHF","titel":"Atrial Fibrillation, ECG Library (Life in the Fast Lane)","url":"https://litfl.com/atrial-fibrillation-ecg-library/"}],"moderation":"Impulsfragen für den Präsentationsmodus:\n1. Welche der gezeigten Rhythmen sind defibrillierbar, welche nicht? Was machst du jeweils zuerst?\n2. Wie gehst du vor, bevor du eine Nulllinie als Asystolie akzeptierst?\n3. Woran trennst du eine Breitkomplextachykardie (VT) von einem Sinusrhythmus mit Schenkelblock oder von einem Schrittmacherrhythmus?\n4. Welche Tachykardien um 150/min sind verwechselbar (Sinustachykardie, Vorhofflattern mit 2:1-Überleitung), und woran erkennst du den Unterschied?\nStolperstellen: Ein Ein-Kanal-Streifen ersetzt kein 12-Kanal-EKG. Die Streifen sind synthetisch und idealisiert, echte Registrierungen sind unruhiger und mehrdeutiger. Bei den Fragen zum Antippen zeigt die App nach der Antwort alle richtigen Stellen grün.","fragen":[{"id":"f1","bild":{"art":"ekg","rhythmus":"sinus","hf":70,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"Vorhofflimmern","richtig":false},{"text":"Vorhofflattern mit variabler Überleitung","richtig":false},{"text":"Normofrequenter Sinusrhythmus","richtig":true},{"text":"Schrittmacherrhythmus","richtig":false}],"erklaerung":"Vor jedem schmalen QRS-Komplex steht eine P-Welle, die Abstände sind gleichmäßig, die Frequenz liegt zwischen 60 und 100/min.\n**Eselsbrücke:** P, QRS, T, immer in dieser Reihenfolge und im gleichen Takt.\n**Wann Notfall:** Der Rhythmus selbst nie. Entscheidend ist, ob zum Bild ein Patient mit Puls und Perfusion gehört.","merkmale":["P-Welle vor jedem QRS-Komplex","Regelmäßige RR-Abstände","Frequenz 60 bis 100/min","Schmaler QRS-Komplex (unter 120 ms)"]},{"id":"f2","bild":{"art":"ekg","rhythmus":"sinus_tachy","hf":130,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"Sinustachykardie","richtig":true},{"text":"Vorhofflattern mit 2:1-Überleitung","richtig":false},{"text":"Kammertachykardie","richtig":false},{"text":"Vorhofflimmern","richtig":false}],"erklaerung":"Regelmäßige schmale Komplexe mit einer P-Welle vor jedem QRS bei einer Frequenz über 100/min. Die Sinustachykardie ist fast immer ein Symptom, nicht die Diagnose.\n**Eselsbrücke:** Bei der Sinustachykardie die Ursache suchen: Schmerz, Fieber, Volumenmangel, Blutung, Anämie, Hypoxie, Lungenembolie, Sepsis, Hyperthyreose.\n**Wann Notfall:** Wenn sie mit Hypotonie, Schockzeichen oder Hypoxie einhergeht. Dann wird die Ursache behandelt (zum Beispiel Blutung oder Lungenembolie), nicht die Frequenz.","merkmale":["P-Welle vor jedem QRS","Regelmäßig, Frequenz über 100/min (typisch 100 bis 150/min)","Schmaler QRS-Komplex","Frequenz ändert sich allmählich, nicht sprunghaft"]},{"id":"f3","bild":{"art":"ekg","rhythmus":"sinus_brady","hf":42,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Ein Patient unter Betablocker fühlt sich müde. Welcher Rhythmus liegt vor?","optionen":[{"text":"AV-Block III°","richtig":false},{"text":"Vorhofflimmern mit langsamer Überleitung","richtig":false},{"text":"Schrittmacherrhythmus","richtig":false},{"text":"Sinusbradykardie","richtig":true}],"erklaerung":"Vor jedem QRS-Komplex steht eine P-Welle mit konstantem Abstand, die Frequenz liegt unter 60/min.\n**Eselsbrücke:** Brady kommt vom Medikament, vom Vagus oder vom Block: Betablocker, Digoxin, Verapamil oder Diltiazem, Amiodaron, Hypothermie, Hirndruck, Hypothyreose, Hyperkaliämie.\n**Wann Notfall:** Bei Instabilitätszeichen (Schock, Synkope, Myokardischämie, Herzinsuffizienz). Dann Atropin 500 µg i.v., bei Versagen Stimulation oder Katecholamine, Ursache beheben.","merkmale":["P-Welle vor jedem QRS, konstante PQ-Zeit","Regelmäßig, Frequenz unter 60/min","Schmaler QRS-Komplex","Häufig medikamentös oder vagal bedingt"]},{"id":"f4","bild":{"art":"ekg","rhythmus":"vorhofflimmern","hf":130,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"Sinustachykardie","richtig":false},{"text":"Vorhofflimmern","richtig":true},{"text":"Vorhofflattern mit 2:1-Überleitung","richtig":false},{"text":"Kammertachykardie","richtig":false}],"erklaerung":"Die RR-Abstände sind völlig unregelmäßig, es gibt keine erkennbaren P-Wellen, die Grundlinie flimmert.\n**Eselsbrücke:** „Unregelmäßig unregelmäßig, ohne P“: Chaos ohne Takt.\n**Wann Notfall:** Bei schneller Überleitung mit Schock, Synkope, Ischämie oder Herzinsuffizienz ist eine synchronisierte Kardioversion nötig. Sonst Frequenz- oder Rhythmuskontrolle und Antikoagulation anhand des Schlaganfallrisikos (CHA2DS2-VASc) klären.","merkmale":["Absolute Arrhythmie (unregelmäßig unregelmäßig)","Keine erkennbaren P-Wellen","Flimmerwellen an der Grundlinie, oft fein","QRS meist schmal"]},{"id":"f5","bild":{"art":"ekg","rhythmus":"vorhofflattern","hf":150,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Regelmäßige schmale Tachykardie mit etwa 150/min. Welcher Rhythmus liegt vor?","optionen":[{"text":"Sinustachykardie","richtig":false},{"text":"Vorhofflimmern","richtig":false},{"text":"Vorhofflattern mit 2:1-Überleitung","richtig":true},{"text":"Kammertachykardie","richtig":false}],"erklaerung":"Regelmäßige schmale Tachykardie um 150/min mit Sägezahnmuster der Vorhofaktivität (Flatterwellen mit etwa 300/min); jede zweite Welle wird auf die Kammern übergeleitet.\n**Eselsbrücke:** 300 geteilt durch die Überleitung: 2:1 ergibt 150, 3:1 ergibt 100, 4:1 ergibt 75. Eine starre Frequenz um 150/min ist verdächtig auf Flattern.\n**Wann Notfall:** Bei Instabilität synchronisierte Kardioversion. Auch beim Flattern muss über Antikoagulation entschieden werden, wie beim Vorhofflimmern.","merkmale":["Sägezahnmuster der Flatterwellen","Vorhoffrequenz etwa 300/min","Meist feste Überleitung (2:1, 3:1, 4:1)","Kammerfrequenz bei 2:1 häufig um 150/min"]},{"id":"f6","bild":{"art":"ekg","rhythmus":"vt","hf":170,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Ein Patient nach Vorderwandinfarkt klagt über Druck auf der Brust. Welcher Rhythmus liegt vor?","optionen":[{"text":"Monomorphe Kammertachykardie","richtig":true},{"text":"Sinustachykardie","richtig":false},{"text":"Torsade de pointes","richtig":false},{"text":"Kammerflimmern","richtig":false}],"erklaerung":"Regelmäßige Tachykardie mit breiten, gleichförmigen QRS-Komplexen (über 120 ms). Eine regelmäßige Breitkomplextachykardie wird als VT behandelt, bis das Gegenteil belegt ist, besonders nach Infarkt.\n**Eselsbrücke:** Breit, schnell, regelmäßig: VT, bis das Gegenteil bewiesen ist.\n**Wann Notfall:** Immer. Pulslos wird wie Kammerflimmern behandelt (Reanimation, Defibrillation). Mit Puls und Instabilitätszeichen (Schock, Synkope, Ischämie, Herzinsuffizienz): synchronisierte Kardioversion. Stabil: Rücksprache mit dem Oberarzt, Antiarrhythmikum oder elektrische Kardioversion.","merkmale":["Breite QRS-Komplexe (über 120 ms)","Regelmäßig, meist 120 bis 250/min","Keine eindeutigen P-Wellen","Gleichförmige (monomorphe) Komplexe"]},{"id":"f7","bild":{"art":"ekg","rhythmus":"vf","hf":300,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Patient reagiert nicht und atmet nicht. Welcher Rhythmus liegt vor?","optionen":[{"text":"Torsade de pointes","richtig":false},{"text":"Asystolie","richtig":false},{"text":"Muskelartefakt durch Zittern","richtig":false},{"text":"Kammerflimmern","richtig":true}],"erklaerung":"Chaotische, unregelmäßige Ausschläge ohne erkennbare QRS-Komplexe; das Herz pumpt nicht.\n**Eselsbrücke:** Kein Komplex, kein Puls, kein Zögern: schocken.\n**Wann Notfall:** Immer. Sofort Reanimation beginnen, Defibrillator holen, schocken. Nach ERC-Algorithmus folgen 2 Minuten CPR nach jedem Schock; Adrenalin 1 mg und Amiodaron 300 mg nach dem 3. Schock; reversible Ursachen (4 H und 4 T) suchen.","merkmale":["Chaotische Grundlinie ohne QRS-Komplexe","Wechselnde Amplituden (grob bis fein)","Kein Puls, Bewusstlosigkeit","Schockbarer Rhythmus"]},{"id":"f8","bild":{"art":"ekg","rhythmus":"torsade","hf":220,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Eine Patientin hat unter Haloperidol eine QTc-Zeit von 580 ms und ein Kalium von 2,9 mmol/l. Welcher Rhythmus liegt vor?","optionen":[{"text":"Monomorphe Kammertachykardie","richtig":false},{"text":"Torsade de pointes","richtig":true},{"text":"Kammerflimmern","richtig":false},{"text":"Vorhofflimmern mit Schenkelblock","richtig":false}],"erklaerung":"Polymorphe Kammertachykardie, bei der die QRS-Amplitude spindelförmig um die Grundlinie wechselt. Auslöser sind eine verlängerte QT-Zeit, Hypokaliämie, Hypomagnesiämie, Bradykardie und QT-verlängernde Medikamente.\n**Eselsbrücke:** „Spindel“: Die Komplexe tanzen um die Nulllinie. Behandlung nach dem Merksatz Magnesium, Kalium, Medikament absetzen.\n**Wann Notfall:** Pulslos: Defibrillation. Mit Puls: Magnesium 2 g i.v., Kalium ausgleichen (Zielbereich 4,5 bis 5 mmol/l), QT-verlängernde Medikamente stoppen; bei bradykardieabhängiger Torsade nach Rücksprache Stimulation oder Isoprenalin.","merkmale":["Wechselnde (spindelförmige) QRS-Amplitude","Breite Komplexe, sehr schnell (200 bis 250/min)","Zuvor oft verlängerte QT-Zeit und Bradykardie oder Pause","Neigt zu Spontanende, Rezidiv oder Übergang in Kammerflimmern"]},{"id":"f9","bild":{"art":"ekg","rhythmus":"avblock3","hf":36,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Ein Patient wird synkopal. Welcher Rhythmus ist zu sehen?","optionen":[{"text":"Sinusbradykardie","richtig":false},{"text":"AV-Block II° Typ Wenckebach","richtig":false},{"text":"AV-Block III° (totaler AV-Block)","richtig":true},{"text":"Vorhofflimmern mit langsamer Überleitung","richtig":false}],"erklaerung":"Vorhöfe und Kammern schlagen unabhängig voneinander: Die P-Wellen laufen in regelmäßigem Abstand durch, die QRS-Komplexe kommen langsam (30 bis 40/min) und haben keine feste Beziehung zu den P-Wellen. Der Ersatzrhythmus ist breit, wenn er unterhalb des AV-Knotens entsteht.\n**Eselsbrücke:** P und QRS gehen getrennte Wege; die P-Wellen marschieren durch den QRS-Takt hindurch.\n**Wann Notfall:** Bei Synkope, Hypotonie oder Herzinsuffizienz. Atropin 500 µg nur bei schmalem Ersatzrhythmus, nicht bei breitem; sonst transkutane Stimulation als Brücke zum temporären Schrittmacher. Ursachen: Infarkt (vor allem Hinterwand), Medikamente, Hyperkaliämie, nach TAVI, Myokarditis.","merkmale":["P-Wellen und QRS-Komplexe ohne feste Beziehung","P-Frequenz höher als QRS-Frequenz","Langsamer Ersatzrhythmus (meist 30 bis 40/min)","QRS schmal (Ersatz im AV-Knoten) oder breit (unterhalb des AV-Knotens)"]},{"id":"f10","bild":{"art":"ekg","rhythmus":"avblock2_mobitz2","hf":50,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Rhythmus liegt vor?","optionen":[{"text":"AV-Block II° Typ Mobitz (Typ II)","richtig":true},{"text":"AV-Block II° Typ Wenckebach (Typ I)","richtig":false},{"text":"AV-Block I°","richtig":false},{"text":"Sinusarrest","richtig":false}],"erklaerung":"Die PQ-Zeit der übergeleiteten Schläge bleibt konstant, gelegentlich fällt ein QRS-Komplex plötzlich aus. Der Block liegt meist unterhalb des AV-Knotens und kann ohne Vorwarnung in einen totalen AV-Block übergehen.\n**Eselsbrücke:** Wenckebach: länger, länger, länger, Pause. Mobitz II: gleich, gleich, gleich, plötzlich weg.\n**Wann Notfall:** Auch ohne Symptome ein Warnsignal: Monitorüberwachung, Klebeelektroden bereithalten, Schrittmacherindikation klären. Bei Synkope oder Bradykardie mit Instabilität handeln wie beim AV-Block III°.","merkmale":["Konstante PQ-Zeit vor dem Ausfall","Plötzlich ausfallender QRS-Komplex nach einer P-Welle","Oft breiter QRS (Block unterhalb des AV-Knotens)","Risiko für den Übergang in einen AV-Block III°"]},{"id":"f11","bild":{"art":"ekg","rhythmus":"schrittmacher","hf":70,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Patient hat vor drei Wochen einen Schrittmacher bekommen. Welcher Rhythmus liegt vor?","optionen":[{"text":"Linksschenkelblock im Sinusrhythmus","richtig":false},{"text":"Schrittmacherrhythmus (Ventrikelstimulation)","richtig":true},{"text":"Monomorphe Kammertachykardie","richtig":false},{"text":"Normofrequenter Sinusrhythmus","richtig":false}],"erklaerung":"Vor dem breiten QRS-Komplex steht ein feiner senkrechter Stimulationsimpuls (Spike). Der Komplex wirkt wie ein Linksschenkelblock, weil die Kammer von der rechten Herzkammer aus erregt wird.\n**Eselsbrücke:** Spike, dann Breitkomplex: Der Schrittmacher klopft an, die Kammer antwortet.\n**Wann Notfall:** Bei Spikes ohne folgenden QRS-Komplex (Capture-Verlust) oder bei fehlenden Spikes trotz langsamer Frequenz (Oversensing). Dann Patient:in beurteilen, Schrittmacherkontrolle veranlassen, bei Instabilität wie bei Bradykardie handeln.","merkmale":["Feiner Stimulationsspike vor dem QRS","Breiter QRS (Linksschenkelblock-ähnlich)","Regelmäßige Frequenz entsprechend der Programmierung","Bei Vorhofstimulation zusätzlich ein Spike vor der P-Welle"]},{"id":"f12","bild":{"art":"ekg","rhythmus":"schenkelblock","hf":78,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Welcher Befund passt zum Streifen?","optionen":[{"text":"Sinusrhythmus mit schmalem QRS","richtig":false},{"text":"Kammertachykardie","richtig":false},{"text":"Idioventrikulärer Rhythmus","richtig":false},{"text":"Sinusrhythmus mit Schenkelblock","richtig":true}],"erklaerung":"Sinusrhythmus mit P-Wellen, aber einem verbreiterten QRS-Komplex (über 120 ms), weil die Erregung eine Kammer verzögert erreicht.\n**Eselsbrücke:** Mehr als drei kleine Kästchen (120 ms bei 25 mm/s) sind breit; mit P-Welle davor und normaler Frequenz ist es ein Block, keine VT. Zur Seite im 12-Kanal-EKG: WiLLiaM (Linksschenkelblock: W in V1, M in V6) und MaRRoW (Rechtsschenkelblock: M in V1, W in V6).\n**Wann Notfall:** Ein neuer Linksschenkelblock bei Brustschmerz kann einem Infarkt entsprechen; ein bekannter Block allein ist kein Notfall. Bei Synkope und Block: Bradyarrhythmie abklären.","merkmale":["QRS breiter als 120 ms","P-Welle vor jedem QRS (supraventrikulärer Ursprung)","Regelmäßige Frequenz im Normbereich","Veränderte Endstrecke (ST-Strecke und T-Welle zeigen entgegengesetzt zum QRS)"]},{"id":"f13","bild":{"art":"ekg","rhythmus":"stemi","hf":88,"dauer_s":6,"st":4},"fragetyp":"wahl","frage":"Ein Patient hat seit 40 Minuten Druck auf der Brust. Welche Veränderung zeigt der Streifen?","optionen":[{"text":"Normalbefund ohne Ischämiezeichen","richtig":false},{"text":"ST-Hebung, vereinbar mit STEMI","richtig":true},{"text":"ST-Senkung, vereinbar mit NSTEMI","richtig":false},{"text":"Spitze T-Wellen bei Hyperkaliämie","richtig":false}],"erklaerung":"Die ST-Strecke hebt sich deutlich über die Grundlinie (hier 4 mm) und geht in die T-Welle über. Auf einem Streifen ist das ein Verdacht; gesichert wird der STEMI im 12-Kanal-EKG durch ST-Hebungen in mindestens zwei benachbarten Ableitungen.\n**Eselsbrücke:** Hebung heißt Verschluss: Zeit ist Herzmuskel.\n**Wann Notfall:** Immer. 12-Kanal-EKG, Katheterlabor und Oberarzt sofort informieren, Reperfusion so schnell wie möglich (primäre PCI). Auch nach einer PCI gilt eine neue ST-Hebung mit Brustschmerz als Stentthrombose, bis das Gegenteil bewiesen ist. Differenzialdiagnosen sind Perikarditis, Aneurysma und frühe Repolarisation.","merkmale":["ST-Strecke deutlich über der Grundlinie (hier 4 mm)","Konvexe oder gerade Hebung, oft mit hoher T-Welle","Im 12-Kanal-EKG in benachbarten Ableitungen","Begleitend Brustschmerz, Grundrhythmus meist Sinus"]},{"id":"f14","bild":{"art":"ekg","rhythmus":"asystolie","hf":0,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Monitor zeigt eine Nulllinie. Was tust du zuerst?","optionen":[{"text":"Sofort defibrillieren","richtig":false},{"text":"Atropin 3 mg i.v. geben","richtig":false},{"text":"Patient:in ansprechen, Atmung und Puls prüfen und die Elektroden kontrollieren","richtig":true},{"text":"Den Alarm quittieren und in zehn Minuten wieder nachsehen","richtig":false}],"erklaerung":"Eine Nulllinie ist erst dann eine Asystolie, wenn der Patient geprüft wurde: ansprechen, Atmung und Puls prüfen, Ableitung wechseln, Verstärkung erhöhen, Elektroden kontrollieren. Ist er bewusstlos ohne Puls, beginnt sofort die Reanimation.\n**Eselsbrücke:** Erst Patient:in, dann Gerät.\n**Wann Notfall:** Eine echte Asystolie ist nicht schockbar: Kompressionen und Beatmung, Adrenalin 1 mg so früh wie möglich, dann alle 3 bis 5 Minuten, reversible Ursachen suchen. In der Nulllinie auf P-Wellen achten; sie können ein Hinweis auf einen Rhythmus sein, der auf Stimulation anspricht.","merkmale":["Keine elektrische Aktivität: flache Linie","Nicht schockbar","Artefakt ausschließen: Elektroden, Ableitung, Verstärkung","P-Wellen ohne QRS können auf Stimulation ansprechen"]},{"id":"f15","bild":{"art":"ekg","rhythmus":"pea","hf":60,"dauer_s":6,"st":0},"fragetyp":"wahl","frage":"Der Patient ist bewusstlos, es ist kein Puls tastbar. Der Monitor zeigt diesen Rhythmus. Wie nennt man das?","optionen":[{"text":"Normofrequenter Sinusrhythmus, kein Notfall","richtig":false},{"text":"Kammerflimmern","richtig":false},{"text":"Schrittmacherrhythmus","richtig":false},{"text":"Pulslose elektrische Aktivität (PEA)","richtig":true}],"erklaerung":"Elektrische Aktivität im EKG ohne Auswurf und ohne tastbaren Puls: Der Monitor zeigt einen geordneten Rhythmus, aber der Kreislauf steht. Es gilt der Pulscheck, nicht der Monitor.\n**Eselsbrücke:** EKG ja, Puls nein: Reanimation.\n**Wann Notfall:** Immer. Kompressionen, Adrenalin 1 mg so früh wie möglich, Ursachen systematisch suchen: Hypoxie, Hypovolämie, Hyper- oder Hypokaliämie und andere metabolische Störungen, Hypo- oder Hyperthermie (4 H) sowie Thrombose (Lungenembolie, Koronarthrombose), Herzbeuteltamponade, Toxine und Spannungspneumothorax (4 T).","merkmale":["Organisierte elektrische Aktivität im EKG","Kein tastbarer Puls, bewusstlos","Nicht schockbar","Reversible Ursachen (4 H und 4 T) suchen"]},{"id":"f16","bild":{"art":"ekg","rhythmus":"sinus","hf":72,"dauer_s":6,"st":0},"fragetyp":"tippen","frage":"Tippe auf einen QRS-Komplex.","tippen":{"ziel":"qrs"},"erklaerung":"Der QRS-Komplex ist der schmale, steile Ausschlag nach der P-Welle; er zeigt die Erregung der Kammern. Bei 72/min kommt etwa alle 0,8 Sekunden ein Komplex. Jeder QRS-Komplex im Streifen zählt, die App markiert nach der Antwort alle grün.\n**Eselsbrücke:** P kommt zuerst, QRS ist der Berg, T folgt dahinter.\n**Hinweis:** Zum Bestimmen der Frequenz zählst du die QRS-Komplexe im 6-Sekunden-Streifen und multiplizierst mit 10.","merkmale":["QRS: schmaler, steiler Ausschlag","Vor jedem QRS eine P-Welle","Etwa 7 Komplexe in 6 Sekunden"]},{"id":"f17","bild":{"art":"ekg","rhythmus":"sinus_brady","hf":50,"dauer_s":6,"st":0},"fragetyp":"tippen","frage":"Tippe auf eine P-Welle.","tippen":{"ziel":"p"},"erklaerung":"Die P-Welle ist die kleine, runde Welle vor dem QRS-Komplex und zeigt die Erregung der Vorhöfe. Bei der Sinusbradykardie steht sie vor jedem Komplex im gleichen Abstand. Jede P-Welle im Streifen zählt, die App markiert nach der Antwort alle grün.\n**Eselsbrücke:** Erst P, dann QRS: Der Vorhof gibt den Takt vor.\n**Hinweis:** Fehlen P-Wellen (Vorhofflimmern) oder stehen sie ohne feste Beziehung zum QRS (AV-Block III°), muss der Rhythmus anders benannt werden.","merkmale":["P-Welle: kleine, runde Welle vor dem QRS","Konstanter Abstand zwischen P-Welle und QRS","Etwa 5 Komplexe in 6 Sekunden"]},{"id":"f18","bild":{"art":"ekg","rhythmus":"schenkelblock","hf":78,"dauer_s":6,"st":0},"fragetyp":"tippen","frage":"Tippe auf einen QRS-Komplex und achte auf seine Breite.","tippen":{"ziel":"qrs"},"erklaerung":"Der QRS-Komplex ist hier deutlich breiter als normal (über 120 ms, mehr als drei kleine Kästchen bei 25 mm/s) und oft doppelgipfelig. Jeder Komplex im Streifen zählt, die App markiert nach der Antwort alle grün.\n**Eselsbrücke:** Breit mit P davor ist ein Block; breit ohne P und schnell ist eine VT.\n**Wann Notfall:** Ein neuer Schenkelblock mit Brustschmerz oder Synkope braucht ein 12-Kanal-EKG und Abklärung; ein bekannter Block allein nicht.","merkmale":["Breiter QRS-Komplex (über 120 ms)","Oft doppelgipfelig","P-Welle davor, regelmäßige Frequenz"]}]},{"id":"isbar-uebergabe","typ":"isbar","titel":"ISBAR: Übergabe, Notruf und Visite","untertitel":"Strukturiert kommunizieren unter Zeitdruck","gruppe":"Kommunikation","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"30 min","lernziele":["Eine Übergabe in der Reihenfolge Identifikation, Situation, Beurteilung, Aktueller Zustand und Empfehlung aufbauen","Hintergrund (B) und aktuellen Zustand (A) trennen: Was bleibt gleich, was ändert sich in der Nacht?","Einen Notruf an den Oberarzt in 60 Sekunden formulieren und mit einer konkreten Bitte beenden","Bei der Visitenvorstellung Allergien, Antikoagulation, Zugänge, Kreatinin und Code-Status gezielt nennen","Eskalationsschwellen, offene Befunde und Angehörigenwünsche ausdrücklich übergeben"],"quellen":[{"id":"ahrq-sbar","kurz":"AHRQ SBAR","titel":"Tool: SBAR (TeamSTEPPS, Agency for Healthcare Research and Quality)","url":"https://www.ahrq.gov/teamstepps-program/curriculum/communication/tools/sbar.html"},{"id":"haig2006","kurz":"Haig 2006","titel":"SBAR: a shared mental model for improving communication between clinicians (Haig, Sutton, Whittington; Jt Comm J Qual Patient Saf)","url":"https://psnet.ahrq.gov/issue/sbar-shared-mental-model-improving-communication-between-clinicians","stand":"2006"},{"id":"isbar-revisited","kurz":"ISBAR revisited","titel":"ISBAR revisited: Identifying and Solving BARriers to effective clinical handover (Australian Commission on Safety and Quality in Health Care)","url":"https://www.safetyandquality.gov.au/sites/default/files/2020-05/isbar-toolkit.docx"},{"id":"rcuk-als2025","kurz":"RCUK ALS 2025","titel":"Adult advanced life support Guidelines (Resuscitation Council UK, 2025; Instabilitätszeichen, Bradykardie, Atropin)","url":"https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/adult-advanced-life-support-guidelines","stand":"2025"},{"id":"esc-pacing2021","kurz":"ESC Pacing 2021","titel":"2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy (u. a. AV-Block nach TAVI)","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Cardiac-Pacing-and-Cardiac-Resynchronization-Therapy","stand":"2021"},{"id":"esc-af2024","kurz":"ESC VHF 2024","titel":"2024 ESC Guidelines for the management of atrial fibrillation (AF-CARE)","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Atrial-Fibrillation-Management","stand":"2024"}],"moderation":"Impulsfragen für den Präsentationsmodus:\n1. Was ändert sich für die zuhörende Person, wenn die Übergabe mit der Aufnahmegeschichte statt mit dem aktuellen Problem beginnt?\n2. Woran erkennst du, ob eine Information zu B (Hintergrund) oder zu A (aktueller Zustand) gehört? Wo ordnest du „Kreatinin“ ein, wo „Code-Status“?\n3. Welche Bitte formulierst du im Notruf, und woran merkst du, dass dein Gegenüber sie verstanden hat (Closed Loop)?\n4. Welche Information würdest du im Zweifel weglassen, welche nie?\nStolperstellen: Die Zuordnung einzelner Karten (zum Beispiel Zugang, Kreatinin, Code-Status) ist in der Praxis hausspezifisch; entscheidend ist, dass sie vollständig und an vorhersehbarer Stelle genannt werden. Alle Fälle sind fiktiv.","szenarien":[{"titel":"Übergabe an den Nachtdienst","ausgangslage":"Es ist 20:30 Uhr auf der IMC. Du bist im Spätdienst und übergibst Herrn M. an die Kollegin des Nachtdienstes, die ihn nicht kennt. Du hast etwa zwei Minuten für diesen Patienten. Wähle aus, was in die Übergabe gehört, und ordne es den Buchstaben von ISBAR zu.","karten":[{"text":"Herr M., 68 J., Bett 4 (IMC), Name und Geburtsdatum am Armband geprüft","ziel":"I","wichtig":true,"warum":"Zwei Identifikatoren verhindern Verwechslungen, besonders wenn der Nachtdienst den Patienten nicht kennt."},{"text":"Übergeben wird von Dr. K. (Spätdienst), Rückfragen sind bis 21 Uhr über DECT möglich","ziel":"I","wichtig":false,"warum":"Wer übergibt und wie erreichbar ist, gehört zur Identifikation; es ist aber weniger entscheidend als der Patientenname."},{"text":"Seit 14 Uhr neu aufgetretenes Vorhofflimmern mit bis zu 150/min; die Entscheidung zur Antikoagulation ist offen","ziel":"S","wichtig":true,"warum":"Das aktuelle Problem steht am Anfang, damit die übernehmende Person sofort weiß, worauf sie achten muss."},{"text":"Vor 3 Tagen NSTEMI, PCI mit Stent der RCA; seitdem ASS 100 mg und Ticagrelor 2 x 90 mg","ziel":"B","wichtig":true,"warum":"Duale Plättchenhemmung bestimmt die Antikoagulationsentscheidung und das Blutungsrisiko."},{"text":"Allergie: Penicillin (Exanthem)","ziel":"B","wichtig":true,"warum":"Muss vor jeder nächtlichen Antibiotikagabe präsent sein; wird sonst nur in der Akte gefunden, wenn jemand sucht."},{"text":"Code-Status: volle Therapie, keine Limitationen, mit dem Patienten besprochen","ziel":"B","wichtig":true,"warum":"Bei Verschlechterung in der Nacht muss sofort klar sein, was gewollt ist."},{"text":"Vorerkrankungen: arterielle Hypertonie und Typ-2-Diabetes; Metformin seit der Angiographie pausiert","ziel":"B","wichtig":false,"warum":"Relevanter Hintergrund, vor allem das pausierte Metformin nach Kontrastmittel, aber nicht das Hauptproblem der Nacht."},{"text":"Aktuell VHF 98/min (nach Metoprolol 5 mg i.v. um 15:30 Uhr von 150/min gefallen), RR 132/78 mmHg, SpO2 96 % ohne Sauerstoff, beschwerdefrei und orientiert","ziel":"A","wichtig":true,"warum":"Aktuelle Werte, Verlauf und Reaktion auf die Maßnahme sind das Herz des Assessments."},{"text":"Kreatinin 1,4 mg/dl (Aufnahme 1,0 mg/dl) nach Kontrastmittel, Kalium 4,2 mmol/l","ziel":"A","wichtig":true,"warum":"Der Anstieg beeinflusst Dosierungen und Kontrollen; er ist ein aktueller Befund, kein Dauerhintergrund."},{"text":"Zugang: periphere Verweilkanüle rechter Unterarm, Tag 3, Einstichstelle reizlos","ziel":"A","wichtig":true,"warum":"Der Nachtdienst muss wissen, wo ein funktionierender Zugang liegt und wie alt er ist."},{"text":"Stündlich Frequenz und Blutdruck kontrollieren; Oberarzt rufen bei Frequenz über 130/min, systolischem RR unter 100 mmHg oder Brustschmerz","ziel":"R","wichtig":true,"warum":"Konkrete Schwellen machen aus einer Beobachtung einen Handlungsauftrag und senken Unsicherheit nachts."},{"text":"Antikoagulation nicht nachts beginnen; Entscheidung morgen in der Visite mit dem Oberarzt (Blutungsrisiko unter dualer Plättchenhemmung)","ziel":"R","wichtig":true,"warum":"Eine offene Entscheidung muss ausdrücklich zugewiesen werden, sonst wird sie nachts versehentlich getroffen oder vergessen."},{"text":"Um 6 Uhr Kreatinin, Kalium, Magnesium und TSH kontrollieren; das TSH steht noch aus","ziel":"R","wichtig":true,"warum":"Offene Befunde und geplante Kontrollen gehören in die Empfehlung, damit sie nicht verloren gehen."},{"text":"Die Ehefrau möchte bei Verschlechterung auch nachts angerufen werden, die Nummer steht in der Akte","ziel":"R","wichtig":false,"warum":"Angehörigenwünsche sind ein konkreter Auftrag für die Nacht, aber nachrangig gegenüber den medizinischen Schwellen."},{"text":"Vor 20 Jahren Leistenhernien-Operation rechts, komplikationslos","ziel":"-","wichtig":false,"warum":"Alte, folgenlose Operation ohne Einfluss auf die Nacht; gehört in die Akte, nicht in die Übergabe."},{"text":"Das Abendessen kam wegen des späten Essenwagens erst um 19:15 Uhr","ziel":"-","wichtig":false,"warum":"Organisatorisches ohne Folgen für die Behandlung."},{"text":"Der Enkel des Patienten spielt in der Jugendmannschaft Fußball","ziel":"-","wichtig":false,"warum":"Persönliche Details, die die Übergabe verlängern, ohne eine Entscheidung zu verändern."}],"muster":{"I":"Ich übergebe Herrn M., 68 Jahre, Bett 4 auf der IMC; Name und Geburtsdatum habe ich am Armband geprüft.","S":"Er hat seit 14 Uhr neu Vorhofflimmern mit bis zu 150/min; die Entscheidung zur Antikoagulation ist noch offen.","B":"Vor drei Tagen NSTEMI mit Stent der RCA, seitdem ASS und Ticagrelor; Penicillinallergie, volle Therapie, Typ-2-Diabetes mit pausiertem Metformin.","A":"Aktuell VHF 98/min nach Metoprolol i.v., RR 132/78, SpO2 96 % ohne Sauerstoff, beschwerdefrei; Kreatinin 1,4 mg/dl nach Kontrastmittel, Zugang rechter Unterarm, Tag 3.","R":"Bitte stündlich Frequenz und Blutdruck, Oberarzt rufen bei Frequenz über 130/min, systolisch unter 100 mmHg oder Brustschmerz; Antikoagulation morgen in der Visite entscheiden, um 6 Uhr Labor mit TSH; die Ehefrau möchte bei Verschlechterung angerufen werden."},"debriefing":["Die Übergabe folgt immer derselben Reihenfolge, damit die zuhörende Person weiß, wo sie ist. Beginne mit dem Namen und dem aktuellen Problem, nicht mit der Aufnahmegeschichte.","Hintergrund (B) sind Dinge, die sich in der Nacht nicht ändern: Vorerkrankungen, Medikamente, Allergien, Code-Status. Aktueller Zustand (A) sind Werte, Verlauf und Reaktion auf Maßnahmen.","Eine gute Empfehlung nennt konkrete Schwellen (wann rufen), offene Befunde und was bis morgen warten kann. Sie endet mit der Rückfrage: Ist alles klar, was ist offen?","Persönliche Details, alte Operationen und Organisatorisches verlängern die Übergabe, ohne Entscheidungen zu verändern. Sie werden weggelassen oder nur auf Nachfrage genannt."]},{"titel":"Notruf-Telefonat an den Oberarzt (60 Sekunden)","ausgangslage":"Es ist 23:55 Uhr auf der IMC. Du bist die diensthabende Ärztin im Nachtdienst. Herr B. hatte eine Synkope und ist bradykard und hypoton. Der Oberarzt hat Rufbereitschaft, kennt den Patienten nicht und ist gerade aufgewacht. Du hast 60 Sekunden, in denen die entscheidenden Informationen und deine Bitte ankommen müssen.","karten":[{"text":"Hier Dr. L., Nachtdienst Kardiologie auf der IMC; ich rufe wegen Herrn B., 79 J., Bett 2","ziel":"I","wichtig":true,"warum":"Wer ruft, von wo und wegen wem: Der Oberarzt wird aus dem Schlaf geholt und muss sofort zuordnen können."},{"text":"Rückruf bitte über das DECT-Telefon der IMC","ziel":"I","wichtig":false,"warum":"Hilfreich, falls die Verbindung abbricht, aber nicht Teil der ersten Sekunden."},{"text":"Vor 15 Minuten Synkope, jetzt AV-Block III° mit Kammerfrequenz 32/min und RR 78/45 mmHg","ziel":"S","wichtig":true,"warum":"Das Problem in einem Satz mit den Zahlen, die die Dringlichkeit begründen."},{"text":"Ich halte ihn für instabil und rufe Sie deshalb sofort an","ziel":"S","wichtig":false,"warum":"Benennt die eigene Einschätzung und den Grund des Anrufs; sie erklärt die Dringlichkeit, ersetzt aber nicht die Zahlen."},{"text":"Heute Tag 1 nach transfemoraler TAVI; der Schrittmacherdraht wurde gestern Nachmittag entfernt","ziel":"B","wichtig":true,"warum":"Der Eingriff erklärt die wahrscheinliche Ursache und erleichtert dem Oberarzt die Entscheidung für einen temporären Schrittmacher."},{"text":"Vorbestehend Rechtsschenkelblock und AV-Block I°","ziel":"B","wichtig":true,"warum":"Ein Rechtsschenkelblock vor der TAVI ist ein bekannter Risikofaktor für einen höhergradigen AV-Block danach."},{"text":"Code-Status: volle Therapie","ziel":"B","wichtig":true,"warum":"In einer Notfallsituation muss klar sein, dass alle Maßnahmen gewollt sind."},{"text":"Keine Allergien bekannt; ASS 100 mg, keine orale Antikoagulation","ziel":"B","wichtig":true,"warum":"Antikoagulation und Allergien sind für die Anlage eines temporären Schrittmachers unmittelbar relevant."},{"text":"Schläfrig, aber erweckbar, kaltschweißig, SpO2 93 % unter 2 l Sauerstoff, Blutzucker 112 mg/dl","ziel":"A","wichtig":true,"warum":"Bewusstsein, Perfusion und Oxygenierung zeigen, wie instabil er ist; der Blutzucker schließt eine einfache Ursache der Schläfrigkeit aus."},{"text":"Pads sind geklebt, transkutane Stimulation ist vorbereitet, ein peripherer Zugang liegt; Atropin habe ich wegen des breiten Ersatzrhythmus nicht gegeben","ziel":"A","wichtig":true,"warum":"Der Oberarzt muss wissen, was bereits getan wurde, damit nichts doppelt oder gar nicht geschieht."},{"text":"Kalium 4,1 mmol/l, Kreatinin 1,1 mg/dl von heute Mittag","ziel":"A","wichtig":false,"warum":"Nützlich, aber am Telefon nur auf Nachfrage; die Dringlichkeit hängt nicht an diesen Werten."},{"text":"Bitte kommen Sie sofort auf die Station; ich brauche einen temporären Schrittmacher, bitte informieren Sie das Katheterlabor","ziel":"R","wichtig":true,"warum":"Eine konkrete Bitte mit Zeitangabe statt „Was soll ich tun?“ lässt dem Oberarzt keinen Interpretationsspielraum."},{"text":"Bis Sie hier sind, überbrücke ich mit transkutaner Stimulation und melde mich in 5 Minuten oder sofort bei Reanimation wieder","ziel":"R","wichtig":true,"warum":"Sagt, was du bis zum Eintreffen tust, und vereinbart den nächsten Kontakt (Closed Loop)."},{"text":"Die Ehefrau hat am Nachmittag Wäsche gebracht und ist inzwischen nach Hause gefahren","ziel":"-","wichtig":false,"warum":"Kein Einfluss auf die akute Entscheidung; Angehörige werden später informiert."},{"text":"Die Verlegung auf die Normalstation war für Freitag geplant, der Sozialdienst hat die Reha angefragt","ziel":"-","wichtig":false,"warum":"Entlassplanung ist in dieser Minute irrelevant und kostet Zeit."},{"text":"Das Abendessen hat er gestern komplett gegessen, der Appetit war gut","ziel":"-","wichtig":false,"warum":"Ein unauffälliger Verlauf von gestern ersetzt nicht die Information über jetzt."}],"muster":{"I":"Hier Dr. L., Nachtdienst Kardiologie auf der IMC, ich rufe wegen Herrn B., 79 Jahre, Bett 2.","S":"Er hatte vor 15 Minuten eine Synkope und hat jetzt einen AV-Block III° mit Kammerfrequenz 32/min bei RR 78/45; ich halte ihn für instabil.","B":"Heute Tag 1 nach TAVI, vorbestehend Rechtsschenkelblock, Schrittmacherdraht gestern entfernt; keine Allergien, ASS, keine Antikoagulation, volle Therapie.","A":"Er ist schläfrig, kaltschweißig, SpO2 93 % unter 2 l Sauerstoff; Pads sind geklebt, Stimulation vorbereitet, Zugang liegt.","R":"Bitte kommen Sie sofort, ich brauche einen temporären Schrittmacher; bitte informieren Sie das Katheterlabor. Bis dahin stimuliere ich transkutan und melde mich in 5 Minuten wieder."},"debriefing":["Im 60-Sekunden-Anruf zählt jeder Satz: Wer bin ich, was passiert jetzt, was ist im Hintergrund wichtig, wie ist der Zustand, was brauche ich von dir. Laborwerte, Entlassplanung und Details kommen nur auf Nachfrage.","Die Empfehlung ist eine konkrete Bitte mit Zeitangabe („Bitte kommen Sie sofort“), keine offene Frage wie „Was soll ich tun?“. Nenne auch, was du bis zum Eintreffen tust.","Bei Synkope, Frequenz unter 40/min und Hypotonie wird nicht gewartet, bis das Telefonat vorbei ist: Pads kleben, Zugang sichern, Hilfe holen. Die Pflegekraft kann parallel vorbereiten.","Closed Loop: Der Oberarzt wiederholt die Anweisung, du bestätigst, und ihr vereinbart den nächsten Kontakt. So wird aus einem Telefonat eine gemeinsame Absprache."]},{"titel":"Visitenvorstellung am Bett","ausgangslage":"Es ist 9:15 Uhr, Oberarztvisite auf der Normalstation. Du stellst Frau K. am Bett vor, die Patientin hört mit. Du hast ungefähr zwei Minuten. Der Oberarzt kennt die Patientin und will vor allem wissen, was heute entschieden werden muss.","karten":[{"text":"Frau K., 74 J., Bett 7, Tag 4 des Aufenthalts","ziel":"I","wichtig":true,"warum":"Kurze Identifikation für alle am Bett, auch für das Team, das die Patientin nicht täglich sieht."},{"text":"Aufnahme mit kardialer Dekompensation; heute steht die Umstellung von i.v. auf orale Diuretika an","ziel":"S","wichtig":true,"warum":"Aufnahmegrund und heutige Entscheidung zusammen geben dem Oberarzt den Rahmen für alles Weitere."},{"text":"Heutige Frage für die Visite: Ist die Patientin reif für die Entlassplanung?","ziel":"S","wichtig":false,"warum":"Formuliert den Entscheidungsbedarf; nützlich, aber er folgt auch aus der Empfehlung."},{"text":"Ischämische Kardiomyopathie mit EF 30 %, ICD zur Primärprophylaxe, Vorhofflimmern, Niereninsuffizienz Stadium 3","ziel":"B","wichtig":true,"warum":"Die relevanten chronischen Erkrankungen bestimmen jede Therapieentscheidung der Visite."},{"text":"Apixaban 2,5 mg 2 x täglich wegen Vorhofflimmern; Dosisreduktion wegen Gewicht und Kreatinin","ziel":"B","wichtig":true,"warum":"Antikoagulation und Dosis müssen bei Eingriffen, Blutungen und Änderungen der Nierenfunktion immer genannt werden."},{"text":"Allergien: keine bekannt","ziel":"B","wichtig":true,"warum":"Auch ein negativer Befund wird benannt, damit klar ist, dass danach gefragt wurde."},{"text":"Code-Status: Reanimation gewünscht, keine Langzeitbeatmung laut Patientenverfügung","ziel":"B","wichtig":true,"warum":"Bei einer Patientin mit ICD und Herzinsuffizienz ist der Wille zu Reanimation und Beatmung ein zentraler Teil der Planung."},{"text":"Gewicht 58,4 kg (Aufnahme 64,0 kg), Bilanz der letzten 24 Stunden minus 1,2 l, Ödeme nur noch minimal","ziel":"A","wichtig":true,"warum":"Gewicht, Bilanz und Ödeme sind die Kernzahlen für die Beurteilung der Rekompensation."},{"text":"RR 108/64 mmHg, HF 72/min absolut arrhythmisch, SpO2 95 % ohne Sauerstoff, Lunge basal links leises Rasseln","ziel":"A","wichtig":true,"warum":"Vitalzeichen und Auskultation zeigen, ob die Patientin hämodynamisch stabil und respiratorisch frei ist."},{"text":"Kreatinin 1,7 mg/dl (Aufnahme 1,5 mg/dl), Kalium 3,6 mmol/l, NT-proBNP von 8200 auf 3900 ng/l gefallen","ziel":"A","wichtig":true,"warum":"Die Laborwerte zeigen Ansprechen und Nebenwirkungen der Diuretika; das niedrige Kalium löst eine Maßnahme aus."},{"text":"Zugang: Verweilkanüle linker Unterarm, Tag 4, seit heute Rötung an der Einstichstelle","ziel":"A","wichtig":true,"warum":"Eine gerötete Einstichstelle ist ein Infektionsrisiko und muss ausdrücklich benannt werden."},{"text":"Vorschlag: Umstellung auf ein orales Schleifendiuretikum, Kalium oral ersetzen, morgen früh Gewicht, Kreatinin und Kalium kontrollieren","ziel":"R","wichtig":true,"warum":"Die Visite braucht einen konkreten Vorschlag, den der Oberarzt bestätigen oder ändern kann."},{"text":"Die Kanüle ziehe ich heute; bei oraler Therapie ist kein neuer Zugang nötig","ziel":"R","wichtig":false,"warum":"Folgt aus dem Zugangsbefund; sinnvoll, aber nachrangig gegenüber der Medikamenten-Empfehlung."},{"text":"Die Tochter wünscht vor der Entlassung ein Gespräch, ein Termin am Donnerstag ist angefragt","ziel":"R","wichtig":false,"warum":"Angehörigenwunsch mit konkretem nächsten Schritt; gehört in die Empfehlung, wenn Zeit bleibt."},{"text":"Sie trinkt am liebsten Pfefferminztee und mag keinen Kaffee","ziel":"-","wichtig":false,"warum":"Persönliche Vorliebe ohne Einfluss auf die Visitenentscheidung."},{"text":"Früher Lehrerin, zwei Enkelkinder, die sie sonntags besuchen","ziel":"-","wichtig":false,"warum":"Sozialanamnese in dieser Ausführlichkeit gehört nicht in die Visitenvorstellung am Bett."},{"text":"Das Bett wurde heute früh wegen einer defekten Matratze gewechselt","ziel":"-","wichtig":false,"warum":"Organisatorisches ohne Bezug zur Behandlung."}],"muster":{"I":"Frau K., 74 Jahre, Bett 7, Tag 4 des Aufenthalts.","S":"Sie wurde mit kardialer Dekompensation aufgenommen und ist unter i.v.-Diuretika weitgehend rekompensiert; heute steht die Umstellung auf orale Therapie an.","B":"Ischämische Kardiomyopathie mit EF 30 %, ICD, Vorhofflimmern unter Apixaban 2,5 mg 2 x täglich, Niereninsuffizienz; keine Allergien; Reanimation gewünscht, aber keine Langzeitbeatmung laut Patientenverfügung.","A":"Gewicht minus 5,6 kg, Bilanz minus 1,2 l, Ödeme minimal, RR 108/64, HF 72 absolut arrhythmisch, SpO2 95 % ohne Sauerstoff; Kreatinin 1,7 mg/dl, Kalium 3,6 mmol/l; Kanüle links Tag 4 mit Rötung.","R":"Ich schlage ein orales Schleifendiuretikum und Kaliumsubstitution vor, morgen früh Kontrolle von Gewicht, Kreatinin und Kalium; die Kanüle ziehe ich heute. Die Tochter wünscht ein Gespräch vor der Entlassung."},"debriefing":["Am Bett hört die Patientin mit. Formulierungen wie „Code-Status“ oder „Dekompensation“ werden so gewählt, dass sie ohne Angst verständlich bleiben; sensible Themen werden bei Bedarf nach der Visite vertieft.","Die Vorstellung nennt Allergien, Antikoagulation, Zugänge, Kreatinin und Code-Status immer an derselben Stelle. So fällt dem Oberarzt sofort auf, wenn etwas fehlt.","Zahlen mit Verlauf (Gewicht, Kreatinin, NT-proBNP) sind aussagekräftiger als Einzelwerte. Ein Wert wie Kalium 3,6 mmol/l löst eine Maßnahme aus und gehört deshalb in A und R.","Schließe mit einem Vorschlag, nicht mit einer Frage. Der Oberarzt kann ihn bestätigen oder ändern, und die Entscheidung wird nachvollziehbar."]}]},{"id":"triage-alarme","typ":"triage","titel":"Alarm-Triage am Monitor","untertitel":"Wer zuerst? Mehrere Alarme gleichzeitig, wenig Zeit","gruppe":"Monitoring","reihenfolge":10,"ebene":"oeffentlich","status":"entwurf","dauer":"25 min","lernziele":["Alarme nach ABCDE und Zeitkritikalität ordnen: Lebensbedrohung vor Unbequemlichkeit","Instabilitätszeichen bei Brady- und Tachyarrhythmien erkennen (Schock, Synkope, Myokardischämie, Herzinsuffizienz)","Leise Alarme mit gefährlichem Trend erkennen, zum Beispiel langsam fallende SpO2 oder Bradykardie unter Betablocker","Artefaktverdacht (Asystolie-Alarm, lose Elektrode, flache Druckkurve) in Sekunden gegenprüfen, statt ihn zu quittieren oder zu überhören","Bei mehreren Alarmen Hilfe rufen und Erstmaßnahmen delegieren"],"quellen":[{"id":"rcuk-als2025","kurz":"RCUK ALS 2025","titel":"Adult advanced life support Guidelines (Resuscitation Council UK, 2025; Instabilitätszeichen, Bradykardie, Tachykardie mit Puls)","url":"https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/adult-advanced-life-support-guidelines","stand":"2025"},{"id":"erc2025","kurz":"ERC 2025","titel":"European Resuscitation Council Guidelines 2025 (Übersichtsseite mit Kapitel Adult advanced life support)","url":"https://www.erc.edu/science-research/guidelines/guidelines-2025/guidelines-2025-english","stand":"2025"},{"id":"erc2021","kurz":"ERC 2021 ALS","titel":"European Resuscitation Council Guidelines 2021: Adult advanced life support (Soar et al., Resuscitation)","url":"https://doi.org/10.1016/j.resuscitation.2021.02.010","stand":"2021"},{"id":"aha-ecg2017","kurz":"AHA EKG-Monitoring 2017","titel":"Update to Practice Standards for Electrocardiographic Monitoring in Hospital Settings (Sandau et al., Circulation; Indikationen, Alarmmanagement)","url":"https://pubmed.ncbi.nlm.nih.gov/28974521/","stand":"2017"},{"id":"esc-va2022","kurz":"ESC VA 2022","titel":"2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Ventricular-Arrhythmias-and-the-prevention-of-sudden-cardiac-death","stand":"2022"},{"id":"esc-acs2023","kurz":"ESC ACS 2023","titel":"2023 ESC Guidelines for the management of acute coronary syndromes","url":"https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/acute-coronary-syndromes/","stand":"2023"},{"id":"esc-pacing2021","kurz":"ESC Pacing 2021","titel":"2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy","url":"https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Cardiac-Pacing-and-Cardiac-Resynchronization-Therapy","stand":"2021"}],"moderation":"Impulsfragen für den Präsentationsmodus:\n1. Welcher Alarm war der lauteste, welcher der gefährlichste? Was sagt die Farbe oder Lautstärke eines Alarms über die Dringlichkeit aus?\n2. Wen rufst du als Erstes an, und was darf die Pflegekraft übernehmen, während du beim ersten Bett bist?\n3. Woran erkennst du an Pleth-Kurve, Puls und Blutdruck, ob eine Asystolie oder ein niedriger Druck echt ist?\n4. Ab wann wird aus einem „stabilen“ Patienten ein instabiler, und welche Zeichen ändern deine Reihenfolge sofort?\nStolperstellen: Die Reihenfolge ist eine Entscheidungshilfe für den ersten Blick, keine starre Regel. Mehrere Rangfolgen können im Team vertretbar sein, wenn sie begründet sind und Instabilität nicht verspätet erkannt wird. Alle Werte sind fiktiv.","szenarien":[{"titel":"Nachtdienst IMC, vier Betten, 3:10 Uhr","einleitung":"Du bist allein als ärztliche Person auf der IMC, die Pflegekraft ist bei einer Neuaufnahme gebunden. Auf dem Zentralmonitor laufen gleichzeitig vier Alarme auf. Lege fest, in welcher Reihenfolge du die Betten ansteuerst, und überlege, was du delegieren kannst.","zeitlimit_s":60,"betten":[{"id":"Bett 1","patient":"Herr D., 59 J., Tag 1 nach Pulmonalvenenisolation bei Vorhofflimmern","alarm":"HF hoch","vitals":{"hf":118,"sys":134,"dia":82,"spo2":96,"af":18},"rhythmus":"sinus_tachy","kurz":"Er ist gerade von der Toilette zurückgekommen, sitzt auf der Bettkante und hat keine Beschwerden.","prioritaet":4,"begruendung":"Erklärbare Belastungstachykardie im Sinusrhythmus bei stabilem Blutdruck und ohne Symptome; der Wert fällt in Ruhe von selbst. Nicht vergessen: Fällt die Frequenz nach 10 Minuten Ruhe nicht ab oder kommen Schmerz oder Blutdruckabfall dazu, neu bewerten und nach Ablation an Perikarderguss und Blutung denken."},{"id":"Bett 2","patient":"Herr K., 71 J., Tag 2 nach Vorderwandinfarkt, EF 35 %","alarm":"VT","vitals":{"hf":168,"sys":84,"dia":52,"sp
