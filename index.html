lzeit 4 Sekunden, kaltschweißig."},{"id":"lunge","label":"Lunge auskultieren","ergebnis":"Feuchte Rasselgeräusche beidseits bis in die Mittelfelder, Tachypnoe."},{"id":"herz","label":"Herz auskultieren","ergebnis":"Tachykarde Herztöne, 3. Herzton. Kein neues lautes Systolikum.","q":["esc-hf"]},{"id":"echo","label":"Fokussierte Echokardiographie","ergebnis":"Vorderwand und Spitze akinetisch, LVEF geschätzt 25 %. Kein Perikarderguss, RV unauffällig. Untere Hohlvene weit und kaum atemvariabel."},{"id":"bga","label":"Blutgasanalyse mit Laktat","ergebnis":"pH 7,31; Laktat 4,1 mmol/l; Base Excess minus 6; Kalium 4,2 mmol/l."},{"id":"ekg","label":"12-Kanal-EKG","ergebnis":"Sinustachykardie 112/min. Persistierende ST-Hebungen V2 bis V5, keine neuen Blockbilder."},{"id":"urin","label":"Urinausscheidung","ergebnis":"Blasenkatheter: 20 ml in der letzten Stunde."}],"pflicht":["haut","lunge","echo","bga"],"weiter":"k3","moderation":"Lass die Gruppe begründen, warum sie jede Untersuchung anfordert. Was würde sich ändern, wenn das Ergebnis anders wäre?"},{"id":"k3","typ":"wahl","zeit":"Minute 5","frage":"Was ist die wahrscheinlichste Ursache des Blutdruckabfalls?","optionen":[{"id":"a","text":"Kardiogener Schock durch Pumpversagen nach Vorderwandinfarkt","bewertung":"richtig","feedback":"Niedriger Druck, kalte Haut, Lungenstauung, weite VCI, EF 25 %, Laktat erhöht: Das Pumpversagen erklärt alle Befunde.","q":["esc-hf"]},{"id":"b","text":"Septischer Schock","bewertung":"falsch","feedback":"Septische Patient:innen sind eher warm und vasoplegisch, die VCI wäre eher eng und es gäbe kein Lungenödem. Es gibt hier weder Fieber noch Infektfokus."},{"id":"c","text":"Hypovolämischer Schock durch Blutung an der Punktionsstelle","bewertung":"falsch","feedback":"Bei Blutung wäre die VCI eng und die Lunge trocken. Du siehst das Gegenteil. Die Leiste solltest du trotzdem kurz prüfen."},{"id":"d","text":"Perikardtamponade","bewertung":"falsch","feedback":"Im Echo ist kein Erguss zu sehen. Eine Tamponade bleibt nach Intervention eine wichtige Differenzialdiagnose, trifft hier aber nicht zu."},{"id":"e","text":"Lungenarterienembolie","bewertung":"falsch","feedback":"Bei Lungenembolie wäre der rechte Ventrikel dilatiert und die Lunge nicht gestaut. Hier ist der linke Ventrikel betroffen."}],"weiter":"k4"},{"id":"k4","typ":"wahl","zeit":"Minute 6","frage":"Welches SCAI-Stadium trifft zu?","optionen":[{"id":"a","text":"Stadium B (beginnend)","bewertung":"falsch","feedback":"Stadium B hat Hypotonie oder Tachykardie ohne Zeichen der Minderperfusion. Hier sind Laktat erhöht und die Peripherie kalt."},{"id":"b","text":"Stadium C (klassisch)","bewertung":"richtig","feedback":"Hypotonie mit Hypoperfusion (Laktat über 2, kalte Haut, Oligurie) und Zeichen des Pumpversagens, Therapie nötig, aber noch nicht trotz Therapie verschlechtert.","q":["scai"]},{"id":"c","text":"Stadium D (sich verschlechternd)","bewertung":"akzeptabel","feedback":"D setzt eine Verschlechterung trotz Erstmaßnahmen voraus. Jetzt noch nicht, aber das kann der nächste Schritt werden.","q":["scai"]},{"id":"d","text":"Stadium E (Extremis)","bewertung":"falsch","feedback":"E bedeutet Kreislaufstillstand oder schwerste Instabilität mit laufender Reanimation."}],"erklaerung":"Die SCAI-Stadien (A bis E) helfen, Tempo und Eskalationsstufe zu begründen. C bedeutet: Handeln jetzt, Schock-Team informieren.","weiter":"k5"},{"id":"k5","typ":"mehrfach","zeit":"Minute 8","frage":"Welche Sofortmaßnahmen sind jetzt sinnvoll?","optionen":[{"id":"a","text":"Oberarzt und Kardiologie-Dienst informieren, Eskalation anmelden","richtig":true,"feedback":"Kardiogener Schock ist eine Eskalationssituation. Rechtzeitige Information verkürzt die Zeit bis zur definitiven Therapie."},{"id":"b","text":"Arterielle Druckmessung und engmaschiges Monitoring","richtig":true,"feedback":"Vasoaktive Therapie braucht kontinuierliche, invasive Druckmessung."},{"id":"c","text":"Laktat nach 1 bis 2 Stunden kontrollieren","richtig":true,"feedback":"Der Laktatverlauf zeigt, ob die Perfusion besser wird."},{"id":"d","text":"Rasche Klärung der Koronarsituation (Stentverschluss, Restischämie) mit dem Kathetertisch","richtig":true,"feedback":"Eine persistierende Ischämie ist eine behandelbare Ursache und gehört früh geklärt.","q":["esc-acs"]},{"id":"e","text":"Volumenbolus von 1000 ml kristalloider Lösung","richtig":false,"feedback":"Bei Lungenstauung und weiter VCI verschlechtert Volumen die Lungenfunktion."},{"id":"f","text":"Betablocker intravenös zur Frequenzsenkung","richtig":false,"feedback":"Die Tachykardie kompensiert das niedrige Schlagvolumen. Ein Betablocker wäre negativ inotrop und gefährlich."},{"id":"g","text":"Nitroglycerin gegen die Lungenstauung","richtig":false,"feedback":"Bei Hypotonie senkt Nitroglycerin den Druck weiter und verschlechtert die Koronarperfusion."}],"weiter":"k6"},{"id":"k6","typ":"wahl","zeit":"Minute 10","frage":"Die invasive Messung zeigt MAP 64 mmHg. Welcher Vasopressor ist erste Wahl?","optionen":[{"id":"a","text":"Noradrenalin","bewertung":"richtig","feedback":"Noradrenalin ist beim kardiogenen Schock der Vasopressor der ersten Wahl und zeigte weniger Arrhythmien als Dopamin.","q":["esc-hf","soap2"]},{"id":"b","text":"Dopamin","bewertung":"falsch","feedback":"Dopamin löste mehr Rhythmusstörungen aus, im kardiogenen Subkollektiv mit höherer Sterblichkeit.","q":["soap2"]},{"id":"c","text":"Adrenalin","bewertung":"falsch","feedback":"Adrenalin steigert Laktat und Arrhythmierisiko und gilt nicht als erste Wahl."},{"id":"d","text":"Vasopressin als Monotherapie","bewertung":"akzeptabel","feedback":"Vasopressin kann ergänzend den Druck stützen, ist aber keine erste Wahl und hebt den Fluss nicht."}],"weiter":"k7"},{"id":"k7","typ":"zahl","zeit":"Minute 12","frage":"Du startest Noradrenalin über Perfusor (10 mg auf 50 ml, also 200 µg/ml). Wähle eine sinnvolle Startdosis.","einheit":"µg/kg/min","min":0,"max":1,"schritt":0.01,"start":0.3,"zielbereich":[0.02,0.15],"rechnung":{"konz":200,"konz_einheit":"µg/ml","dosis_einheit":"µg/kg/min","gewicht_kg":82},"feedback_ok":"Niedrig beginnen und nach MAP titrieren (Ziel meist 65 mmHg). Wirkung und Nebenwirkungen engmaschig prüfen.","feedback_zu_niedrig":"Das ist unter der üblichen Startdosis und wird kaum wirken. Eine Dosis im niedrigen zweistelligen Hundertstelbereich ist üblich.","feedback_zu_hoch":"Das ist als Startdosis deutlich zu hoch. Beginne niedrig, titriere nach Wirkung und beobachte Frequenz und Rhythmus.","weiter":"k8"},{"id":"k8","typ":"text","zeit":"Minute 40","text":"Der Druck ist jetzt stabil bei etwa MAP 74 mmHg. Aber: Laktat 4,6 mmol/l, die Haut ist weiter kalt, Urinausscheidung 15 ml/h. Der Fluss reicht offensichtlich nicht.","effekt":{"vitals":{"sys":98,"dia":62,"hf":110,"spo2":90}},"weiter":"k9"},{"id":"k9","typ":"mehrfach","zeit":"Minute 42","frage":"Was ist jetzt sinnvoll? Wähle alles Passende.","optionen":[{"id":"a","text":"Schock-Team bzw. Herzteam einbeziehen und Kreislaufunterstützung evaluieren","richtig":true,"feedback":"Bei Hypoperfusion trotz Vasopressor ist die frühe Entscheidung über mechanische Unterstützung zeitkritisch.","q":["esc-hf","scai"]},{"id":"b","text":"Ein Inotropikum ergänzen, zum Beispiel Dobutamin","richtig":true,"feedback":"Bei niedrigem Herzzeitvolumen trotz ausreichendem Druck kann ein Inotropikum den Fluss verbessern, auf Kosten von Frequenz, O₂-Bedarf und Arrhythmierisiko.","q":["esc-hf"]},{"id":"c","text":"Invasive Hämodynamik erwägen (zentralvenöse Sättigung, Pulmonalarterienkatheter)","richtig":true,"feedback":"Misst den Fluss direkt und steuert die Therapie."},{"id":"d","text":"Noradrenalin auf maximale Dosis hochfahren","richtig":false,"feedback":"Noch mehr Nachlast erhöht den Druck, verschlechtert aber den Fluss bei geschwächtem Herzen."},{"id":"e","text":"Weitere 1000 ml Volumen","richtig":false,"feedback":"Die Lunge ist bereits gestaut, mehr Volumen schadet."}],"weiter":"k10"},{"id":"k10","typ":"text","zeit":"Minute 55","text":"Dobutamin läuft seit 10 Minuten. Der Herzindex steigt, aber am Monitor treten gehäuft ventrikuläre Extrasystolen auf, die Frequenz liegt bei 130/min.","effekt":{"vitals":{"hf":130,"sys":104,"dia":66}},"weiter":"k11"},{"id":"k11","typ":"wahl","zeit":"Minute 56","frage":"Wie reagierst du?","optionen":[{"id":"a","text":"Dobutamin reduzieren, Kalium und Magnesium prüfen und ausgleichen, Rhythmus eng überwachen","bewertung":"richtig","feedback":"Dosis senken ist die schnellste Maßnahme. Elektrolytentgleisung und Ischämie als Mitursache prüfen. Das Ziel ist der Kompromiss aus Fluss und Rhythmussicherheit.","q":["esc-hf"],"effekt":{"vitals":{"hf":112}},"weiter":"k13"},{"id":"b","text":"Nichts ändern, Extrasystolen sind harmlos","bewertung":"falsch","feedback":"Salven unter Katecholaminen sind ein Warnsignal. Ohne Reaktion droht eine anhaltende Kammertachykardie.","effekt":{"rhythmus":"vt","vitals":{"hf":180,"sys":68,"dia":44},"alarm":"VT"},"weiter":"k12"},{"id":"c","text":"Sofort Amiodaron als Kurzinfusion, Dobutamin unverändert","bewertung":"akzeptabel","feedback":"Antiarrhythmika können nötig werden, Ursache und Dosis des Auslösers zuerst anzugehen ist aber vorrangig.","effekt":{"vitals":{"hf":124}},"weiter":"k13"}]},{"id":"k12","typ":"wahl","zeit":"Minute 58","frage":"Der Monitor alarmiert: Kammertachykardie 180/min. Der Patient ist ansprechbar, aber blass, der Blutdruck liegt bei 68/44, der Puls ist tastbar. Was tust du?","optionen":[{"id":"a","text":"Hilfe rufen, Defibrillator holen, synchronisierte Kardioversion vorbereiten","bewertung":"richtig","feedback":"Instabile Tachykardie mit Puls: synchronisierte Kardioversion nach Kurznarkose, Team rufen. Die Reanimation beginnt erst bei Pulslosigkeit.","q":["erc"],"effekt":{"rhythmus":"sinus_tachy","vitals":{"hf":118,"sys":92,"dia":58},"alarm":null}},{"id":"b","text":"Erst einmal beobachten, ob sich der Rhythmus von selbst beendet","bewertung":"falsch","feedback":"Bei Instabilität darfst du nicht abwarten. Das Zeitfenster bis zum Kreislaufstillstand ist kurz."},{"id":"c","text":"Unsynchronisierter Schock mit maximaler Energie","bewertung":"akzeptabel","feedback":"Ein unsynchronisierter Schock hat bei Puls das Risiko, Kammerflimmern auszulösen. Synchronisieren, wenn der Patient noch einen Puls hat.","q":["erc"]}],"weiter":"k13"},{"id":"k13","typ":"ende","titel":"Debriefing","text":"Die Lage ist vorerst stabilisiert und das Schock-Team ist informiert. Entscheidend war nicht die einzelne Maßnahme, sondern das Muster: erkennen, einordnen, Druck und Fluss getrennt denken, Eskalation früh anstoßen.","lernpunkte":["Kalt, nass, weite VCI, niedrige EF und erhöhtes Laktat sprechen für kardiogenen Schock, nicht für Volumenmangel.","Die SCAI-Stadien begründen, wie schnell eskaliert wird.","Noradrenalin hebt den Druck, ein Inotropikum hebt den Fluss. Beides hat einen Preis.","Bei Hypoperfusion trotz Vasopressor gehört das Schock-Team früh ans Bett.","Katecholamine können Rhythmusstörungen auslösen: Dosis und Elektrolyte prüfen, bei instabiler Tachykardie mit Puls synchronisiert kardiovertieren."],"moderation":"Frage am Ende: Was hätte sich geändert, wenn die VCI eng gewesen wäre? Die Gruppe soll den hypovolämischen und den kardiogenen Pfad gegenüberstellen."}]},{"id":"sandkasten-schock","typ":"sandkasten","titel":"Schock-Sandkasten","untertitel":"Füllungsdruck, Pumpkraft und Gefäßtonus verstehen, indem du daran drehst","gruppe":"Schock","reihenfolge":20,"ebene":"oeffentlich","status":"entwurf","dauer":"20 min","lernziele":["Herzzeitvolumen und Blutdruck aus Schlagvolumen, Frequenz und Gefäßwiderstand herleiten","Kardiogenen, septischen und hypovolämischen Schock am Muster aus Herzindex, Füllungsdruck und Widerstand unterscheiden","Vorhersagen, wie Noradrenalin, Dobutamin, Milrinon, Volumen und Entlastung den Kreislauf verändern"],"quellen":[{"id":"scai","kurz":"SCAI 2022","titel":"Naidu SS et al.: SCAI SHOCK Stage Classification Expert Consensus Update. J Am Coll Cardiol 2022;79:933-946","stand":"2022"},{"id":"esc-hf","kurz":"ESC HF 2021","titel":"McDonagh TA et al.: 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure. Eur Heart J 2021;42:3599-3726","stand":"2021"},{"id":"ssc","kurz":"SSC 2021","titel":"Evans L et al.: Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2021. Intensive Care Med 2021;47:1181-1247","stand":"2021"},{"id":"cardiocalc","kurz":"CardioCalc","titel":"Hämodynamik-Formeln (Fick-HZV, SVR, CPO, VIS, SCAI-Klassifikation) aus der CardioCalc-Engine; Abgleichtest beiliegend","stand":"2026"}],"moderation":"Lass die Gruppe vor jedem Eingriff vorhersagen, was mit Blutdruck und Herzindex passiert, und decke dann auf. Bei Falschvorhersagen nach dem Mechanismus fragen, nicht nach der richtigen Antwort.","erklaerung":"Die orange Kurve zeigt, wie viel Blut das Herz bei einem Füllungsdruck pro Minute fördert. Inotropika heben die Kurve an, Volumen verschiebt den Punkt entlang der Kurve nach rechts, Entlastung nach links. Eine hohe Nachlast drückt die Kurve bei schwachem Herzen deutlich nach unten.","regler":[{"id":"na","label":"Noradrenalin","einheit":"µg/kg/min","min":0,"max":0.5,"schritt":0.01,"hinweis":"Vasokonstriktion, in niedriger Dosis kaum Inotropie"},{"id":"epi","label":"Adrenalin","einheit":"µg/kg/min","min":0,"max":0.3,"schritt":0.01,"hinweis":"Inotropie und Vasokonstriktion, Frequenzanstieg"},{"id":"dobu","label":"Dobutamin","einheit":"µg/kg/min","min":0,"max":15,"schritt":0.5,"hinweis":"Inotropie, leichte Vasodilatation, Frequenzanstieg"},{"id":"mil","label":"Milrinon","einheit":"µg/kg/min","min":0,"max":0.75,"schritt":0.05,"hinweis":"Inotropie und Vasodilatation, wenig Frequenzeffekt"},{"id":"vol","label":"Volumenbolus","einheit":"ml","min":0,"max":2000,"schritt":250,"hinweis":"Erhöht den Füllungsdruck"},{"id":"entzug","label":"Volumenentzug (Diurese, Ultrafiltration)","einheit":"ml","min":0,"max":3000,"schritt":250,"hinweis":"Senkt den Füllungsdruck"},{"id":"nitro","label":"Nitroglycerin","einheit":"µg/min","min":0,"max":200,"schritt":10,"hinweis":"Venöse Vorlastsenkung, bei Hochdosis auch Nachlastsenkung"}],"basisregler":[{"id":"pcwp","label":"Füllungsdruck (PCWP)","einheit":"mmHg","min":2,"max":40,"schritt":1},{"id":"c","label":"Kontraktilität (1,0 = normal)","einheit":"","min":0.15,"max":2,"schritt":0.05},{"id":"svr","label":"Systemischer Gefäßwiderstand","einheit":"dyn·s·cm⁻⁵","min":250,"max":3500,"schritt":50},{"id":"hf","label":"Herzfrequenz","einheit":"/min","min":35,"max":160,"schritt":1}],"presets":[{"id":"normal","name":"Normalbefund","basis":{"pcwp":10,"c":1,"svr":1250,"hf":70},"beschreibung":"Gesunder Kreislauf als Vergleich. Das Herz fördert ausreichend, der Füllungsdruck liegt im Normbereich.","lernpunkt":"Blutdruck (MAP) ergibt sich aus Herzzeitvolumen mal Gefäßwiderstand plus ZVD. Das Herzzeitvolumen ergibt sich aus Schlagvolumen mal Frequenz.","moderation":"Starte hier und lass ein Rädchen nach dem anderen drehen: Was ändert sich zuerst, was bleibt gleich?","ziele":[]},{"id":"kardiogen","name":"Kardiogener Schock","basis":{"pcwp":26,"c":0.32,"svr":1500,"hf":100},"beschreibung":"Großer Vorderwandinfarkt, Pumpversagen. Niedriger Herzindex, hoher Füllungsdruck, hoher Gefäßwiderstand, kalte Haut, Lungenstauung.","lernpunkt":"Noradrenalin hebt den Druck, aber nicht den Fluss. Inotropie hebt den Fluss. Volumen verschlechtert die Lunge. Mechanische Kreislaufunterstützung wird hier nicht simuliert.","moderation":"Frage: Warum steigt der Druck unter Noradrenalin, obwohl das Herz nicht stärker pumpt? Was passiert mit der Nachlast?","ziele":[{"text":"MAP ≥ 65 mmHg","groesse":"map","op":">=","wert":65},{"text":"Herzindex ≥ 2,2 l/min/m²","groesse":"ci","op":">=","wert":2.2},{"text":"Füllungsdruck ≤ 18 mmHg","groesse":"pcwp","op":"\u003c=","wert":18}]},{"id":"septisch","name":"Septischer Schock","basis":{"pcwp":8,"c":1,"svr":520,"hf":115},"beschreibung":"Vasoplegie bei Sepsis. Hohes Herzzeitvolumen bei sehr niedrigem Gefäßwiderstand, warme Peripherie, niedriger Füllungsdruck.","lernpunkt":"Hier ist nicht die Pumpe das Problem, sondern Gefäßtonus und Volumenstatus. Zu viel Volumen treibt den Füllungsdruck und die Lunge in die Stauung.","moderation":"Vergleiche mit dem kardiogenen Schock: Beide haben niedrigen Blutdruck. Woran erkennst du den Unterschied am Herzindex, am Widerstand und am Füllungsdruck?","ziele":[{"text":"MAP ≥ 65 mmHg","groesse":"map","op":">=","wert":65},{"text":"Füllungsdruck ≤ 18 mmHg","groesse":"pcwp","op":"\u003c=","wert":18}]},{"id":"hypovol","name":"Hypovolämischer Schock","basis":{"pcwp":3,"c":1,"svr":1500,"hf":125,"komp":1},"beschreibung":"Blutung oder Volumenverlust. Der Füllungsdruck ist sehr niedrig, der Körper kompensiert mit hoher Frequenz und Vasokonstriktion.","lernpunkt":"Die Therapie ist Ursachenbeseitigung und Volumenersatz, bei Blutung Blut. Ein Vasopressor hebt den Druck, lässt aber den Volumenmangel bestehen. Mit Volumen sinkt die kompensatorische Tachykardie.","moderation":"Frage: Woran siehst du im Modell, dass der Körper noch kompensiert? Was passiert mit der Frequenz, wenn du Volumen gibst?","ziele":[{"text":"MAP ≥ 65 mmHg","groesse":"map","op":">=","wert":65},{"text":"Herzfrequenz ≤ 100 /min","groesse":"hf","op":"\u003c=","wert":100}]},{"id":"dekomp","name":"Akut dekompensierte Herzinsuffizienz","basis":{"pcwp":28,"c":0.5,"svr":1400,"hf":95},"beschreibung":"Reduzierte Pumpfunktion mit ausgeprägter Lungenstauung, Blutdruck noch erhalten, Sauerstoffsättigung grenzwertig.","lernpunkt":"Im Vordergrund steht die Stauung: entlasten, nicht auffüllen. Bei erhaltenem Druck senken Vasodilatatoren und Diurese den Füllungsdruck, bei zu niedrigem Druck wird es kritisch.","moderation":"Frage: Warum bringt hier Volumen nichts, obwohl der Herzindex niedrig ist? Wie weit darfst du den Füllungsdruck senken, bevor der Blutdruck leidet?","ziele":[{"text":"Füllungsdruck ≤ 18 mmHg","groesse":"pcwp","op":"\u003c=","wert":18},{"text":"SpO₂ ≥ 94 %","groesse":"spo2","op" <script>

const KT = (window.KT = {

/* ---------- Kleine Helfer ---------- */
KT.h = function h(tag, attrs, ...kinder) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'for') el.htmlFor = v;
      else if (k.startsWith('aria-') || k.startsWith('data-') || k === 'role' || k === 'viewBox') el.setAttribute(k, v === true ? 'true' : v);
      else if (k in el) el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  KT.anhaengen(el, kinder);
  return el;
};
KT.anhaengen = function (el, kinder) {
  for (const k of kinder) {
    if (k === null || k === undefined || k === false) continue;
    if (Array.isArray(k)) KT.anhaengen(el, k);
    else if (k instanceof Node) el.appendChild(k);
    else el.appendChild(document.createTextNode(String(k)));
  }
  return el;
};
KT.leeren = function (el) { while (el.firstChild) el.removeChild(el.firstChild); return el; };
/* Einfache Auszeichnung: **fett**, \n als Umbruch */
KT.rich = function (text) {
  const frag = document.createDocumentFragment();
  String(text ?? '').split('\n').forEach((zeile0, i) => {
    if (i > 0) frag.appendChild(document.createElement('br'));
    const zeile = zeile0.startsWith('- ') ? '• ' + zeile0.slice(2) : zeile0;
    zeile.split(/(\*\*[^*]+\*\*)/).forEach((teil) => {
      if (/^\*\*[^*]+\*\*$/.test(teil)) frag.appendChild(KT.h('strong', null, teil.slice(2, -2)));
      else if (teil) frag.appendChild(document.createTextNode(teil));
    });
  });
  return frag;
};
KT.fmt = (n, dez = 0) => (n === null || n === undefined || !Number.isFinite(n) ? '–' : Number(n).toFixed(dez).replace('.', ','));
KT.mischen = function (arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
/* Mischen, das garantiert nicht die Ausgangsreihenfolge liefert (für Sortieraufgaben) */
KT.mischenAnders = function (arr) {
  if (arr.length < 2) return arr.slice();
  let a;
  for (let i = 0; i < 12; i++) { a = KT.mischen(arr); if (a.some((x, j) => x !== arr[j])) return a; }
  return arr.slice().reverse();
};
KT.klemme = (x, a, b) => Math.min(b, Math.max(a, x));

      h('div', { class: 'card' }, h('h3', null, 'Datenschutz'), h('p', null, 'Die App speichert nichts über dich. Im Browser werden nur Darstellung (hell oder dunkel) und Ansicht (Selbstlernen oder Präsentation) gemerkt. Es gibt keine Konten, keine Server-Aufrufe und keine Auswertung deiner Antworten.')),
      h('div', { class: 'card' }, h('h3', null, 'Bilder, Kurven und Lizenzen'),
        h('ul', { class: 'klar' },
          h('li', null, 'EKG-Streifen, Blutdruckkurven und Schemazeichnungen werden von der App selbst erzeugt oder wurden eigens gezeichnet. Sie sind keine Patient:innen-Aufnahmen.'),
          h('li', null, 'Symbole: Lucide (ISC-Lizenz).'),
          h('li', null, 'Gestaltung: MedApe Design System, Universitätsklinikum Heidelberg. Das Maskottchen wird unverändert aus den Originaldateien verwendet.'),
          h('li', null, 'Hämodynamik- und Perfusorformeln: portiert aus CardioCalc und gegen das Original getestet.'))));
  }

  function zeige(nachOben) {
    navBau();
    KT.leeren(wrapEl);
    const z = KT.zustand;
    let titel = 'Kardio Teaching';
    try {
      if (z.ansicht === 'modul' && KT.nachId[z.id]) {
        const m = KT.nachId[z.id]; titel = m.titel + ' · Kardio Teaching';
        const fn = KT.typen[m.typ];
        if (fn) fn(wrapEl, m); else wrapEl.appendChild(U.alertBox('warn', 'Für den Typ „' + m.typ + '“ gibt es noch keine Ansicht.'));
      } else if (z.ansicht === 'info') { wrapEl.appendChild(infoSeite()); }
      else { z.ansicht = 'start'; wrapEl.appendChild(startseite()); }
    } catch (e) {
      console.error(e); KT.leeren(wrapEl); wrapEl.appendChild(U.alertBox('falsch', 'Beim Aufbau dieser Seite ist ein Fehler aufgetreten: ' + e.message));
    }
    document.title = titel;
    if (nachOben) window.scrollTo(0, 0);
  }

  /* ---------- Start ---------- */
  function start() {
    KT.registriere(DATEN.oeffentlich || [], 'oeffentlich');
    if (DATEN.haus) KT.registriere(DATEN.haus, 'haus');
    bauGeruest();
    setzeTheme(KT.speicher.lesen('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dunkel' : 'hell'));
    const modus = KT.speicher.lesen('modus'); if (modus === 'praesi') setzeModus('praesi');
    try { history.replaceState({ ansicht: 'start', id: null }, '', location.href); } catch (e) { /* ignorieren */ }
    const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash || '');
    const fertig = () => zeige(false);
    if (m && DATEN.hausKrypto) KT.haus.freischalten(m[1]).then(fertig, fertig); else fertig();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
